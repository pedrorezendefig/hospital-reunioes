<!doctype html>
<!-- O pedido chega explicado: o vídeo de percepção de valor do PRD #1632 do Hospital São Matheus.
     Contrato do estúdio: seek(t) pinta o quadro t do zero (DOM com transform), sem rAF, timer ou transição CSS,
     acaso só com semente, movimento só com molas (lib/motion.js). Todo evento preso a uma palavra do tempos.js.
     As telas do app são capturas reais (assets/0*.png, 2x). O email é o template do app gerado pelo código do app;
     o corpo do card é o texto da função do app, mostrado como o GitHub mostra. Pessoas e pedidos fictícios. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'HPS'; font-weight: 400; src: url(assets/HPSimplified_Rg.ttf) format('truetype'); }
  * { transition: none !important; animation: none !important; box-sizing: border-box; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #palco { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #14163F;
    font-family: 'HPS', system-ui, sans-serif; font-weight: 400; color: #EEF2FA; -webkit-font-smoothing: antialiased; }
  #fundo { position: absolute; inset: 0; }
  .camada { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; display: none; transform-origin: 50% 50%; }

  /* Painel com captura do app */
  .painel { position: absolute; overflow: hidden; border-radius: 22px; background: #fff; box-shadow: 0 40px 110px rgba(0, 0, 0, 0.45); transform-origin: 50% 50%; }
  .painel.cheio { border-radius: 0; box-shadow: none; }
  .mundo { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .mundo > img { position: absolute; left: 0; top: 0; }
  .remendo { position: absolute; background: #fff; }
  .realce { position: absolute; border: 3px solid #3B6FB6; border-radius: 10px; box-shadow: 0 0 0 6px rgba(59, 111, 182, 0.2);
    overflow: hidden; display: none; }
  .realce i { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(143, 178, 234, 0.45) 50%, transparent 65%); background-size: 260% 100%; }
  .marca { position: absolute; display: none; border-radius: 6px; background: rgba(59, 111, 182, 0.13); overflow: hidden; }
  .marca b { position: absolute; left: 0; top: 0; bottom: 0; background: #3B6FB6; }
  .marca i { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(143, 178, 234, 0.55) 50%, transparent 70%); background-size: 260% 100%; }
  .foco { position: absolute; border-radius: 14px; display: none; }
  .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 42px; transform-origin: 0 0; display: none; z-index: 9; }
  .anel { position: absolute; left: 0; top: 0; border: 3px solid #3B6FB6; border-radius: 50%; display: none; z-index: 8; }

  /* Selos e avisos */
  .selo { position: absolute; display: none; white-space: nowrap; background: #3B6FB6; color: #fff; font-size: 32px; border-radius: 999px;
    padding: 14px 30px 15px 22px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); transform-origin: 50% 50%; z-index: 12; }
  .selo svg { vertical-align: -7px; margin-right: 12px; }
  .selo.escuro { background: #1A1C4E; border: 2px solid rgba(238, 242, 250, 0.28); }
  .num { position: absolute; display: none; width: 52px; height: 52px; border-radius: 50%; background: #3B6FB6; color: #fff; font-size: 30px;
    text-align: center; line-height: 52px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); z-index: 12; }
  .etiqueta { position: absolute; display: none; white-space: nowrap; background: #2B2E7E; color: #fff; font-size: 25px; border-radius: 12px;
    padding: 9px 18px 10px 14px; box-shadow: 0 12px 34px rgba(26, 28, 78, 0.35); transform-origin: 0 0; z-index: 12; }
  .etiqueta em { font-style: normal; color: #9DBBEF; margin-right: 8px; }
  .envelope { position: absolute; display: none; width: 300px; height: 190px; background: #fff; border-radius: 22px; border: 2px solid #DCE4F2;
    box-shadow: 0 24px 60px rgba(26, 28, 78, 0.28); transform-origin: 50% 50%; z-index: 12; }
  .envelope svg { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); }
  .envelope .t1 { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font-size: 30px; color: #1A1C4E; }
  .envelope .t2 { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font-size: 30px; color: #64748B; }
  .envelope .risco { position: absolute; left: 40px; right: 40px; top: 56px; height: 5px; border-radius: 3px; background: #64748B; transform-origin: 0 50%; }

  /* Fim: os dois lados */
  .rot { position: absolute; display: none; white-space: nowrap; font-size: 36px; color: #A9BCE3; transform: translate(-50%, 0); z-index: 12; }
  #fio { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; z-index: 11; overflow: visible; }

  /* Legenda */
  .leg { position: absolute; left: 960px; top: 1018px; display: none; white-space: nowrap; background: rgba(13, 14, 40, 0.9);
    border: 1px solid rgba(238, 242, 250, 0.14); border-radius: 999px; padding: 13px 34px 15px; font-size: 38px; color: #EEF2FA;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35); z-index: 92; }
  .leg span { display: inline-block; margin-right: 0.24em; }
  .leg span:last-child { margin-right: 0; }

  /* Transições e assinatura */
  .tira { position: absolute; left: 0; width: 1920px; background: #14163F; display: none; z-index: 90; }
  #borda { position: absolute; left: 0; width: 1920px; height: 4px; background: #8FB2EA; box-shadow: 0 0 30px 6px rgba(143, 178, 234, 0.55); display: none; z-index: 91; }
  #cortina { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #fff; display: none; z-index: 95; }
  #logo { position: absolute; left: 50%; top: 50%; width: 600px; display: none; z-index: 96; }
</style>
<script src="../../lib/motion.js"></script>
<script src="assets/tempos.js"></script>
</head>
<body>
<div id="palco"><div id="fundo"></div></div>
<script>
const { spring, track, MOLA, clamp } = Motion;
const S = (t, m = MOLA.padrao) => spring(t, ...m);
const TR = (t, keys, m = MOLA.padrao) => track(t, keys, ...m);
const lerp = (a, b, p) => a + (b - a) * p;
const px = (v) => `${v}px`;
const palco = document.getElementById('palco');
const fundo = document.getElementById('fundo');
function el(tag, cls, css, html, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) Object.assign(e.style, css);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- Tempo: cada evento preso a uma palavra da narração ----------
const norm = (x) => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function W(n, txt, k = 0) {
  const alvo = norm(txt);
  for (const w of TEMPOS.cenas[n - 1].palavras) if (norm(w.p) === alvo && k-- === 0) return w.a;
  throw new Error(`palavra ${txt} não está no trecho ${n}`);
}
const C1 = W(2, 'até') - 0.45, C2 = W(3, 'a') - 0.5, C3 = W(4, 'no') - 0.5, C4 = W(5, 'sua') - 0.6;
const C5 = W(9, 'na') - 0.6, C6 = W(10, 'se') - 0.44, C7 = W(11, 'no') - 0.5, C8 = W(12, 'os') - 0.5, C9 = W(13, 'você') - 0.5;
const C10 = TEMPOS.cenas[12].fim_s + 0.35;
const DUR = +(C10 + 3.6).toFixed(2);
window.FILM = { fps: 30, duration: DUR, formatos: ['16x9'] };

const CUES = [];
const cue = (t, type, extra = {}) => CUES.push({ t: +t.toFixed(3), type, ...extra });

// ---------- Ícones ----------
const SETA = `<svg width="30" height="42" viewBox="0 0 30 42"><path d="M2 2 L2 33 L10 25.5 L15.5 38.5 L21 36.2 L15.6 23.6 L26 23.6 Z" fill="#fff" stroke="#1A1C4E" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
const CHECK = (c = '#fff', s = 32) => `<svg width="${s}" height="${s}" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M9 15.5 L13.3 19.6 L21.2 11" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SINO = (c = '#fff', s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 34 34"><path d="M9 24 V15.5 a8 8 0 0 1 16 0 V24 l2.5 3 h-21 z" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 30 a3 3 0 0 0 6 0" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/><path d="M5 5 L29 29" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const CARTA = (c = '#2B2E7E', s = 74) => `<svg width="${s}" height="${s * 0.72}" viewBox="0 0 74 53"><rect x="3" y="3" width="68" height="47" rx="7" fill="none" stroke="${c}" stroke-width="4"/><path d="M5 7 L37 31 L69 7" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"/></svg>`;
const SEM_CARTA = (c = '#fff', s = 36) => `<svg width="${s}" height="${s}" viewBox="0 0 36 36"><rect x="4" y="9" width="28" height="19" rx="3.5" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M5 11 L18 20 L31 11" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M4 4 L32 32" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const PESSOA = (c = '#fff', s = 32) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32"><circle cx="16" cy="11" r="6" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M5 28 a11 9 0 0 1 22 0" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`;

// ---------- Fundo: azul-marinho com uma luz que anda devagar ----------
const gradFundo = (t) => { const x = 420 + 15 * t, y = 280 + 4 * t; return `radial-gradient(1000px 760px at ${x}px ${y}px, rgba(59,111,182,0.30), transparent 70%),
    radial-gradient(900px 700px at ${1650 - 11 * t}px ${880 - 3 * t}px, rgba(43,46,126,0.55), transparent 70%),
    linear-gradient(160deg, #1E1D57 0%, #15174A 55%, #101233 100%)`; };
function pintaFundo(t) { fundo.style.background = gradFundo(t); }

// ---------- Painéis com as capturas ----------
function camada(z) { return el('div', 'camada', { zIndex: z }, null, palco); }
function painel(parent, src, iw, ih, w, h, x, y, cheio = false) {
  const box = el('div', 'painel' + (cheio ? ' cheio' : ''), { width: px(w), height: px(h), left: px(x), top: px(y) }, null, parent);
  const mundo = el('div', 'mundo', { width: px(iw), height: px(ih) }, null, box);
  const img = el('img', null, { width: px(iw), height: px(ih) }, null, mundo); img.src = src;
  return { box, mundo, img, w, h, iw, ih, x, y, s: 1, x0: 0, y0: 0 };
}
const cheio = (parent, src, ih = 1080) => painel(parent, src, 1920, ih, 1920, 1080, 0, 0, true);
function vista(p, x0, y0, s) {
  p.s = s; p.x0 = x0; p.y0 = y0;
  p.mundo.style.transform = `translate(${(-x0 * s).toFixed(2)}px, ${(-y0 * s).toFixed(2)}px) scale(${s.toFixed(4)})`;
}
// Câmera dentro do painel: o ponto (fx, fy) da captura no centro, com escala s. yMin corta o que fica acima.
function foco(p, fx, fy, s, yMin = 0) {
  const hw = p.w / (2 * s), hh = p.h / (2 * s);
  fx = clamp(fx, hw, Math.max(hw, p.iw - hw)); fy = clamp(fy, yMin + hh, Math.max(yMin + hh, p.ih - hh));
  vista(p, fx - hw, fy - hh, s);
}
// Onde um ponto da captura cai no palco (dentro da mesma camada).
const naTela = (p, x, y) => [p.x + (x - p.x0) * p.s, p.y + (y - p.y0) * p.s];
// O canto do rodapé das capturas mostra a versão do build de desenvolvimento: coberto com o branco da tela.
const remendo = (p, x, y, w, h) => el('div', 'remendo', { left: px(x), top: px(y), width: px(w), height: px(h) }, null, p.mundo);
const vivo = (t, a = 1) => [4 * a * Math.sin(t * 0.7), 3 * a * Math.sin(t * 0.5 + 1), 1 + 0.008 * a * Math.sin(t * 0.4)];

function realce(p) { return el('div', 'realce', null, '<i></i>', p.mundo); }
function pintaRealce(r, caixa, s, t, t0, t1 = 1e9) {
  if (t < t0 || t > t1 + 0.3) { r.style.display = 'none'; return; }
  const p = clamp(S(t - t0, MOLA.ui), 0, 1.05), q = t > t1 ? clamp(S(t - t1, MOLA.ui), 0, 1) : 0;
  const pad = (8 + 6 * (1 - p)) / s;
  const [x, y, w, h] = caixa;
  Object.assign(r.style, { display: 'block', left: px(x - pad), top: px(y - pad), width: px(w + 2 * pad), height: px(h + 2 * pad),
    borderWidth: px(3 / s), borderRadius: px(10 / s), boxShadow: `0 0 0 ${6 / s}px rgba(59,111,182,0.2)`, opacity: clamp(p * 1.4, 0, 1) * (1 - q) });
  r.firstChild.style.backgroundPosition = `${lerp(130, -40, clamp(S(t - t0 - 0.05, [60, 15.5]), 0, 1))}% 0`;
}
function marca(p) { return el('div', 'marca', null, '<b></b><i></i>', p.mundo); }
function pintaMarca(m, caixa, s, t, t0, t1 = 1e9) {
  if (t < t0 || t > t1 + 0.4) { m.style.display = 'none'; return; }
  const p = clamp(S(t - t0, MOLA.ui), 0, 1), q = t > t1 ? clamp(S(t - t1, MOLA.padrao), 0, 1) : 0;
  const [x, y, w, h] = caixa, pad = 6 / s;
  Object.assign(m.style, { display: 'block', left: px(x - 2 * pad), top: px(y - pad), width: px((w + 3 * pad) * p), height: px(h + 2 * pad),
    borderRadius: px(6 / s), opacity: 1 - q });
  m.firstChild.style.width = px(5 / s);
  m.lastChild.style.backgroundPosition = `${lerp(130, -40, clamp(S(t - t0 - 0.05, [60, 15.5]), 0, 1))}% 0`;
}
function holofote(p) { return el('div', 'foco', null, null, p.mundo); }
function pintaHolofote(f, caixa, s, t, t0, t1 = 1e9, escuro = 0.6) {
  if (t < t0 || t > t1 + 0.5) { f.style.display = 'none'; return; }
  const a = clamp(S(t - t0, MOLA.padrao), 0, 1) * (t > t1 ? 1 - clamp(S(t - t1, MOLA.padrao), 0, 1) : 1);
  const [x, y, w, h] = caixa, pad = 12 / s;
  Object.assign(f.style, { display: 'block', left: px(x - pad), top: px(y - pad), width: px(w + 2 * pad), height: px(h + 2 * pad),
    borderRadius: px(14 / s), boxShadow: `0 0 0 ${4000 / s}px rgba(16,18,51,${(escuro * a).toFixed(3)}), 0 0 0 ${3 / s}px rgba(59,111,182,${a.toFixed(3)})` });
}
function cursor(p) { return { c: el('div', 'cursor', null, SETA, p.mundo), a: el('div', 'anel', null, null, p.mundo) }; }
function pintaCursor(k, s, t, keys, cliques, vis = true) {
  if (!vis || t < keys[0][0]) { k.c.style.display = 'none'; k.a.style.display = 'none'; return; }
  const x = TR(t, keys.map(([tt, xx]) => [tt, xx])), y = TR(t, keys.map(([tt, , yy]) => [tt, yy]));
  const ap = clamp(S(t - keys[0][0], MOLA.ui), 0, 1);
  let esc = 1, anel = null;
  for (const tc of cliques) {
    esc -= 0.18 * (S(t - tc, [600, 40]) - S(t - tc - 0.09, [600, 40]));
    if (t >= tc && t - tc <= 0.6) anel = tc;
  }
  Object.assign(k.c.style, { display: 'block', opacity: ap, transform: `translate(${x}px, ${y}px) scale(${(esc * 1.25) / s})` });
  if (anel == null) { k.a.style.display = 'none'; return; }
  const d = t - anel, r = (12 + 46 * S(d, [200, 24])) / s;
  Object.assign(k.a.style, { display: 'block', width: px(2 * r), height: px(2 * r), borderWidth: px(3 / s), transform: `translate(${x - r}px, ${y - r}px)`, opacity: 1 - S(d, [60, 15.5]) });
}
function selo(parent, html, cls = '') { return el('div', 'selo ' + cls, null, html, parent); }
function pintaSelo(e, t, t0, t1, x, y, esc = 1) {
  if (t < t0 || t > t1 + 0.3) { e.style.display = 'none'; return; }
  const p = S(t - t0, MOLA.brincalhona), q = t > t1 ? clamp(S(t - t1, MOLA.ui), 0, 1) : 0;
  Object.assign(e.style, { display: 'block', left: px(x), top: px(y), opacity: clamp(S(t - t0, MOLA.ui) * 2, 0, 1) * (1 - q),
    transform: `translate(-50%, -50%) scale(${(esc * (0.6 + 0.4 * p) * (1 - 0.15 * q)).toFixed(4)}) rotate(${(-4 * (1 - p)).toFixed(2)}deg)` });
}
const mostra = (e, v) => { e.style.display = v ? 'block' : 'none'; return v; };

// =====================================================================================
// Cena 1 (gancho): o clique em Criar o card e o email chegando.
const L1 = camada(20);
const F03 = cheio(L1, 'assets/03-resumo-escolhido.png');
remendo(F03, 1790, 1058, 120, 22);
const K1 = cursor(F03);
const R1b = realce(F03);
const E1 = painel(L1, 'assets/07-email-card-novo.png', 1920, 1080, 820, 560, 1040, 250);
const R1s = realce(E1);
function camL1(t) {
  const [dx, dy, ds] = vivo(t);
  const tq = W(1, 'quem') - 0.15;
  return { fx: TR(t, [[0, 520], [tq, 775]]) + dx, fy: TR(t, [[0, 830], [tq, 712]]) + dy, s: TR(t, [[0, 2.3], [tq, 1.42], [W(1, 'sabe'), 1.48]]) * ds };
}
function pintaL1(t) {
  if (!mostra(L1, t < C1 + 0.7)) return;
  const q = clamp(S(t - C1, MOLA.padrao), 0, 1.02);
  L1.style.transform = `scale(${(1 - 0.16 * q).toFixed(4)})`;
  L1.style.filter = `grayscale(${q.toFixed(3)}) brightness(${(1 - 0.3 * q).toFixed(3)})`;
  L1.style.opacity = 1 - clamp(S(t - C1 - 0.12, MOLA.ui), 0, 1);
  const c = camL1(t); foco(F03, c.fx, c.fy, c.s);
  pintaCursor(K1, F03.s, t, [[-1, 430, 905], [0, 404, 872]], [0.1]);
  pintaRealce(R1b, [332.5, 843.5, 122, 40.5], F03.s, t, 0.12, 1.1);
  // O email sobe do canto, inclinado, e assenta.
  const te = W(1, 'quem'), p = S(t - te, MOLA.padrao);
  mostra(E1.box, t >= te);
  E1.box.style.opacity = clamp(S(t - te, MOLA.ui) * 2, 0, 1);
  E1.box.style.transform = `translate(${(160 * (1 - p)).toFixed(1)}px, ${(720 * (1 - p)).toFixed(1)}px) rotate(${lerp(9, -2.5, p).toFixed(2)}deg)`;
  const [dx, dy] = vivo(t, 0.6);
  foco(E1, 960 + dx, 320 + dy, 0.9);
  pintaRealce(R1s, [546, 68, 600, 31], E1.s, t, W(1, 'sabe'));
}
cue(0.1, 'click', { g: 0.6 });
cue(W(1, 'quem'), 'notification', { g: 0.55 });

// =====================================================================================
// Cena 2: até agora, o card nascia em silêncio (o Quadro desbotado).
const L2 = camada(10);
const F06a = cheio(L2, 'assets/06b-lista-de-pedidos-so-do-diretor.png');
remendo(F06a, 1790, 833, 120, 24);
const veu2 = el('div', null, { position: 'absolute', inset: '0', background: '#14163F', opacity: 0.32 }, null, L2);
const R2 = realce(F06a);
const AV2 = selo(L2, `${SINO('#fff', 36)}ninguém era avisado`, 'escuro');
function pintaL2(t) {
  if (!mostra(L2, t >= C1 - 0.05 && t < C2 + 0.8)) return;
  const e = S(t - C1, MOLA.padrao);
  L2.style.transform = `scale(${(1.08 - 0.08 * e).toFixed(4)})`;
  F06a.box.style.filter = 'grayscale(0.85) brightness(0.97)';
  const [dx, dy, ds] = vivo(t);
  foco(F06a, TR(t, [[C1, 880], [C2, 940]], [30, 11]) + dx, 650 + dy, TR(t, [[C1, 1.26], [C2, 1.36]], [30, 11]) * ds);
  pintaRealce(R2, [625, 576, 302.5, 109.5], F06a.s, t, W(2, 'card'));
  const [x, y] = naTela(F06a, 927.5, 630);
  pintaSelo(AV2, t, W(2, 'silêncio'), 1e9, x + 250, y + 150);
}
cue(C1, 'whoosh', { len: 0.4, g: 0.45 });
cue(W(2, 'silêncio'), 'pop', { g: 0.4 });

// =====================================================================================
// Cena 3: a conversa com o assistente continua igual.
const L3 = camada(30);
const F01 = cheio(L3, 'assets/01-conversa-melhoria.png');
remendo(F01, 1790, 1008, 120, 24);
const R3a = realce(F01), R3b = realce(F01), H3 = holofote(F01);
const SE3 = selo(L3, `${CHECK('#fff', 34)}a conversa de sempre`);
const borda = el('div', null, null, null, palco); borda.id = 'borda';
function pintaL3(t) {
  if (!mostra(L3, t >= C2 && t < C3 + 0.9)) { borda.style.display = 'none'; return; }
  const p = clamp(S(t - C2, MOLA.padrao), 0, 1);

    fioL.setAttribute('opacity', (d * 0.95).toFixed(3));
  }
}
cue(C9, 'whoosh', { len: 0.4, g: 0.45 });
cue(W(13, 'quem'), 'whoosh', { len: 0.35, g: 0.3 });
cue(W(13, 'sabendo'), 'pop', { g: 0.45 });

// ---------- Assinatura ----------
const cortina = el('div', null, null, null, palco); cortina.id = 'cortina';
const logo = el('img', null, null, null, palco); logo.id = 'logo'; logo.src = 'assets/logo-hsm.png';
function pintaAssinatura(t) {
  const p = S(t - C10, MOLA.pesada);
  cortina.style.display = t >= C10 ? 'block' : 'none';
  cortina.style.transform = `translateY(${((1 - clamp(p, 0, 1)) * 1080).toFixed(2)}px)`;
  const tl = C10 + 0.3;
  logo.style.display = t >= tl ? 'block' : 'none';
  const k = clamp(S(t - tl, MOLA.pesada), 0, 1);
  logo.style.opacity = clamp(S(t - tl, MOLA.pesada) * 1.2, 0, 1);
  logo.style.transform = `translate(-50%, -50%) scale(${(0.96 + 0.04 * k).toFixed(4)})`;
}
cue(C10, 'whoosh', { len: 0.5, g: 0.4 });
cue(C10 + 0.3, 'chime', { g: 0.55 });

// ---------- Legenda: a fala na tela, palavra por palavra ----------
const LEG = [];
for (const c of TEMPOS.cenas) {
  let atual = [];
  const fecha = () => { if (atual.length) LEG.push({ n: c.n, ws: atual }); atual = []; };
  c.palavras.forEach((w, i) => {
    atual.push(w);
    const fim = /[.?!:]$/.test(w.p) || (/,$/.test(w.p) && atual.length >= 4) || atual.length >= 7;
    if (fim || i === c.palavras.length - 1) fecha();
  });
}
LEG.forEach((L, i) => {
  L.t0 = L.ws[0].a - 0.12;
  const prox = LEG[i + 1];
  const fimCena = TEMPOS.cenas[L.n - 1].fim_s + 0.45;
  L.t1 = prox && prox.n === L.n ? prox.ws[0].a - 0.12 : prox ? Math.min(fimCena, prox.ws[0].a - 0.2) : Math.min(fimCena, C10 - 0.05);
  L.el = el('div', 'leg', null, null, palco);
  L.spans = L.ws.map((w) => el('span', null, null, w.p, L.el));
});
function pintaLegenda(t) {
  for (const L of LEG) {
    const on = t >= L.t0 && t < L.t1 + 0.12;
    L.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const p = clamp(S(t - L.t0, MOLA.ui), 0, 1.05), q = t > L.t1 ? clamp(S(t - L.t1, [500, 45]), 0, 1) : 0;
    L.el.style.opacity = clamp(p * 2, 0, 1) * (1 - q);
    L.el.style.transform = `translate(-50%, -50%) translateY(${((1 - p) * 18 + q * 14).toFixed(2)}px)`;
    let ultima = -1;
    L.ws.forEach((w, i) => { if (t >= w.a - 0.02) ultima = i; });
    L.spans.forEach((sp, i) => {
      const w = S(t - L.ws[i].a + 0.04, MOLA.ui);
      sp.style.opacity = clamp(w * 1.6, 0, 1);
      sp.style.transform = `translateY(${((1 - clamp(w, 0, 1.1)) * 20).toFixed(2)}px)`;
      sp.style.color = i === ultima ? '#9DBBEF' : '#EEF2FA';
    });
  }
}

// ---------- Sons ----------
const PESO = { hit: 6, notification: 5, chime: 5, click: 4, pop: 3, whoosh: 3, key: 2 };
function poda(lista) {
  const ok = [];
  for (const c of [...lista].sort((a, b) => (PESO[b.type] - PESO[a.type]) || (a.t - b.t))) {
    if (ok.some((o) => Math.abs(o.t - c.t) < 0.12)) continue;
    ok.push(c);
  }
  return ok.sort((a, b) => a.t - b.t);
}
window.CUES = poda(CUES.filter((c) => c.t >= 0 && c.t < DUR));

// ---------- Carregar e pintar ----------
const PRONTO = (async () => {
  await document.fonts.load('40px HPS');
  await document.fonts.ready;
  await Promise.all([...palco.querySelectorAll('img')].map((i) => (i.decode ? i.decode().catch(() => {}) : null)));
})();

window.seek = async (t) => {
  await PRONTO;
  pintaFundo(t);
  pintaL1(t);
  pintaL2(t);
  pintaL3(t);
  pintaL4(t);
  pintaL5f(t);
  pintaL5(t);
  pintaL6(t);
  pintaL7(t);
  pintaL8(t);
  pintaTiras(t);
  pintaL9(t);
  pintaL10(t);
  pintaLegenda(t);
  pintaAssinatura(t);
};

if (!window.RENDER) {
  const q = new URLSearchParams(location.search);
  const t0 = performance.now(), ini = +(q.get('t') || 0);
  let ocupado = false;
  const tocar = async (agora) => { if (!ocupado) { ocupado = true; await seek((ini + (agora - t0) / 1000) % DUR); ocupado = false; } requestAnimationFrame(tocar); };
  requestAnimationFrame(tocar);
} else {
  seek(0);
}
</script>
</body>
</html>
