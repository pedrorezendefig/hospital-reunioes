<script>
const { spring, track, MOLA, mulberry32, clamp } = Motion;
const S = (t, m = MOLA.padrao) => spring(t, ...m);
const TR = (t, keys, m = MOLA.padrao) => track(t, keys, ...m);
const lerp = (a, b, p) => a + (b - a) * p;
const px = (v) => `${v}px`;
const palco = document.getElementById('palco');
const cam = document.getElementById('cam');
const fundo = document.getElementById('fundo');
function el(tag, cls, css, html, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) Object.assign(e.style, css);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);

}

// ---------- Tempo: cada evento preso a uma palavra da narração ----------
const norm = (x) => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function W(n, txt, k = 0) {
  const alvo = norm(txt);
  for (const w of TEMPOS.cenas[n - 1].palavras) if (norm(w.p) === alvo && k-- === 0) return w.a;
  throw new Error(`palavra ${txt} não está no trecho ${n}`);
}
const FIM_FALA = TEMPOS.cenas[10].fim_s;
const C1 = W(3, 'é') - 0.6, C2 = W(4, 'quer') - 0.9, C3 = W(5, 'na') - 0.93, C4 = W(6, 'são') - 0.44;
const C5 = W(7, 'peça') - 0.6, C6 = W(8, 'cada') - 0.3, C7 = W(9, 'o') - 0.74, C8 = W(9, 'diretoria') - 0.1;
const C9 = W(10, 'o') - 0.6, C10 = W(11, 'no') - 0.46, C11 = FIM_FALA + 0.25;
const DUR = 69.0;
window.FILM = { fps: 30, duration: DUR, formatos: ['16x9'] };

const CUES = [];

// ---------- Ícones ----------
const SETA = `<svg width="30" height="42" viewBox="0 0 30 42"><path d="M2 2 L2 33 L10 25.5 L15.5 38.5 L21 36.2 L15.6 23.6 L26 23.6 Z" fill="#fff" stroke="#1A1C4E" stroke-width="2.4" stroke-linejoin="round"/></svg>`;

const CADEADO = (c = '#fff', s = 32) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32"><rect x="6" y="14" width="20" height="14" rx="3.5" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M10.5 14 V10 a5.5 5.5 0 0 1 11 0 V14" fill="none" stroke="${c}" stroke-width="2.4"/><circle cx="16" cy="21" r="2" fill="${c}"/></svg>`;
const APP = `<svg width="15" height="15" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="#3B6FB6" stroke-width="1.8"/><path d="M5 8 H11 M8 5 V11" stroke="#3B6FB6" stroke-width="1.8" stroke-linecap="round"/></svg>`;

const NAVEGADOR = `<svg width="64" height="50" viewBox="0 0 64 50"><rect x="3" y="3" width="58" height="44" rx="7" fill="none" stroke="#A9BCE3" stroke-width="3"/><path d="M3 15 H61" stroke="#A9BCE3" stroke-width="3"/><circle cx="11" cy="9" r="2" fill="#A9BCE3"/><circle cx="18" cy="9" r="2" fill="#A9BCE3"/><path class="risco" d="M6 46 L58 4" stroke="#8FB2EA" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-dasharray="67" stroke-dashoffset="67"/></svg>`;

const PASTA = `<svg width="44" height="44" viewBox="0 0 44 44"><path d="M5 12 a4 4 0 0 1 4 -4 h9 l4 5 h13 a4 4 0 0 1 4 4 v17 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 z" fill="none" stroke="#8FB2EA" stroke-width="2.6" stroke-linejoin="round"/></svg>`;

function parte(parent, cls, html, t, tag = 'div') { const e = el(tag, cls, null, html, parent); PARTES.push({ el: e, t }); return e; }

// Digitação com ritmo de gente, encaixada entre t0 e t1.
function digitacao(txt, t0, t1, semente) {
  const r = mulberry32(semente); let acc = 0; const ts = [];

  return ts.map((x) => t0 + (x / acc) * (t1 - t0));
}

  { txt: 'Quais pendências estão atrasadas, e de quem?', t0: -0.3, t1: W(1, 'quem') + 0.18, env: W(1, 'agora') },

  vista(P01, 290, 66 + 4 * lt, s);
  pintaCursor(K01, s, t, [[C1 + 0.3, 1500, 760], [W(3, 'mesma') - 0.35, 410, 396]], W(3, 'mesma'));
  pintaRealce(R01[0], [308, 378, 148, 36], s, t, W(3, 'mesma'));
  pintaRealce(R01[1], [312, 488, 1410, 72], s, t, W(3, 'lista'));
  pintaRealce(R01[2], [312, 568, 1410, 72], s, t, W(3, 'lista') + 0.2);
  pintaRealce(R01[3], [312, 648, 1410, 74], s, t, W(3, 'aparece'));
  pintaSelo(SELO01, t, W(3, 'pendências'), C2, 1700, 205);
}

function pintaP05(t) {
  const vis = t >= C2 && t < C3 + 0.7;
  P05.box.style.display = vis ? 'block' : 'none';
  if (!vis) return;
  const p = clamp(S(t - C2 - 0.08, MOLA.padrao), 0, 1), q = t > C3 ? clamp(S(t - C3, MOLA.padrao), 0, 1) : 0;
  P05.box.style.clipPath = `inset(${(100 * (1 - p)).toFixed(2)}% 0 0 0 round 22px)`;
  P05.box.style.transform = `translate(${(q * 1250).toFixed(2)}px, ${((1 - p) * 50).toFixed(2)}px)`;
  const s = 1.07;
  const y0 = TR(t, [[C2, 30], [W(4, 'ata'), 590], [W(4, 'participou'), 780], [W(4, 'ficou'), 1210]]);
  vista(P05, 268, y0 + 2 * (t - C2), s);
  pintaRealce(R05[0], [306, 302, 951, 76], s, t, W(4, 'ata') - 0.1, W(4, 'participou') - 0.1);
  pintaRealce(R05[1], [306, 657, 951, 150], s, t, W(4, 'ata') + 0.15, W(4, 'participou') - 0.05);
  pintaRealce(R05[2], [306, 836, 951, 219], s, t, W(4, 'participou'), W(4, 'ficou') - 0.05);
  pintaRealce(R05[3], [345, 1478, 870, 280], s, t, W(4, 'ficou') + 0.1);
}

function pintaP04(t) {
  const vis = t >= C5 + 0.15 && t < C6 + 0.7;
  P04.box.style.display = vis ? 'block' : 'none';
  if (!vis) return;
  const p = clamp(S(t - C5 - 0.25, MOLA.padrao), 0, 1.02), q = t > C6 ? clamp(S(t - C6, MOLA.padrao), 0, 1.02) : 0;
  P04.box.style.opacity = clamp((t - C5 - 0.15) / 0.2, 0, 1);
  P04.box.style.transform = `translateX(${(-q * 1180).toFixed(2)}px) scale(${(0.9 + 0.1 * p).toFixed(4)})`;
  P04.box.style.filter = p < 0.98 ? `blur(${(14 * (1 - p)).toFixed(2)}px)` : 'none';
  const s = 1.2;
  const y0 = TR(t, [[C5, 140], [W(7, 'relato'), 1460], [W(7, 'trilha'), 1860]]);
  vista(P04, 645, y0 + 2 * (t - C5), s);
  pintaRealce(R04[0], [681, 1580, 830, 66], s, t, W(7, 'relato'), W(7, 'trilha') - 0.1);
  pintaRealce(R04[1], [681, 1946, 830, 476], s, t, W(7, 'trilha'), W(7, 'resposta') - 0.1);
  pintaRealce(R04[2], [681, 1880, 600, 44], s, t, W(7, 'resposta'));
  pintaRealce(R04[3], [690, 2160, 640, 82], s, t, W(7, 'resposta') + 0.2);
}

function pintaP07(t) {
  const vis = t >= C6 - 0.05 && t < C7 + 0.6;
  P07.box.style.display = vis ? 'block' : 'none';
  if (!vis) { SELO07.style.display = 'none'; return; }
  const p = clamp(S(t - C6, MOLA.padrao), 0, 1.02), q = t > C7 ? clamp(S(t - C7, MOLA.ui), 0, 1) : 0;
  P07.box.style.transform = `perspective(1800px) translateX(${((1 - p) * 1180).toFixed(2)}px) rotateX(${(86 * q).toFixed(2)}deg)`;
  P07.box.style.opacity = 1 - clamp(q * 1.2, 0, 1);
  const s = 1.48;
  vista(P07, 598, 1440 + 3 * (t - C6), s);
  pintaHolofote(H07, [624, 1736, 672, 76], s, t, W(8, 'histórico') - 0.1);
  pintaSelo(SELO07, t, W(8, 'nome'), C7 - 0.1, 1560, 170);
}

function pintaVerso(t) {
  // "só leitura" vira como um cartão, e as fichas dizem que nada muda
  const t0 = W(9, 'só'), t1 = C8 - 0.05;
  if (t < t0 - 0.05 || t > t1 + 0.3) { soLe.style.display = 'none'; fichaR.style.display = 'none'; fichaC.style.display = 'none'; return; }
  const p = clamp(S(t - t0, MOLA.ui), 0, 1.05), q = t > t1 ? clamp(S(t - t1, MOLA.ui), 0, 1) : 0;
  Object.assign(soLe.style, { display: 'block', left: '960px', top: '470px', opacity: clamp(p * 2, 0, 1) * (1 - q),
    transform: `translate(-50%, -50%) perspective(900px) rotateX(${(-90 * (1 - clamp(p, 0, 1))).toFixed(2)}deg) scale(1.3)` });
  const ficha = (f, ta, x) => {
    const k = S(t - ta, MOLA.padrao);
    Object.assign(f.style, { display: t >= ta ? 'block' : 'none', left: px(x), top: '380px', opacity: clamp(k * 1.6, 0, 1) * (1 - q),
      transform: `translateY(${((1 - k) * 40).toFixed(2)}px)` });
    f.querySelector('.s').style.color = t > ta + 0.35 ? '#A9BCE3' : '#EEF2FA';
  };
  ficha(fichaR, W(9, 'reuniões'), 250);
  ficha(fichaC, W(9, 'casos'), 1290);
}

function pintaL02(t) {
  const vis = t >= C4 && t < C5 + 0.7;
  L02.style.display = vis ? 'block' : 'none';
  if (!vis) return;
  const r = 1300 * clamp(S(t - C4, MOLA.padrao), 0, 1.02);
  L02.style.clipPath = t < C5 ? `circle(${r.toFixed(1)}px at 960px 640px)` : 'none';
  const q = t > C5 ? clamp(S(t - C5, MOLA.padrao), 0, 1) : 0;
  L02.style.transform = `translate(${((410 - 960) * q).toFixed(2)}px, ${((515 - 540) * q).toFixed(2)}px) scale(${(1 - 0.82 * q).toFixed(4)})`;
  L02.style.opacity = 1 - clamp((q - 0.55) / 0.4, 0, 1);
  L02.style.borderRadius = `${(40 * q).toFixed(1)}px`;
  const lt = t - C4;
  const s = TR(t, [[C4, 1.0], [W(6, 'mesmos') - 0.2, 1.16]]) + 0.006 * lt;
  const fy = TR(t, [[C4, 540], [W(6, 'mesmos') - 0.2, 470]]);
  foco(F02, 1080 + 3 * lt, fy, s);
  const sv = F02.s;
  pintaRealce(R02[0], [1396, 206, 189, 34], sv, t, W(6, 'mesmos'));
  pintaRealce(R02[1], [522, 482, 1150, 64], sv, t, W(6, 'fila'));
  pintaRealce(R02[2], [522, 550, 1150, 64], sv, t, W(6, 'mostra'));
  pintaRealce(R02[3], [522, 618, 1150, 64], sv, t, W(6, 'como'));
  pintaSelo(SELO02, t, W(6, 'vencidos'), C5, 1560, 820);
}

function pintaL06(t) {
  const vis = t >= C8 - 0.02 && t < C9 + 0.05;
  L06.style.display = vis ? 'block' : 'none';
  if (!vis) { SELO06.style.display = 'none'; return; }
  const p = clamp(S(t - C8, MOLA.padrao), 0, 1.02);
  L06.style.opacity = clamp((t - C8 + 0.02) / 0.14, 0, 1);
  L06.style.transform = `scale(${(1.6 - 0.6 * p).toFixed(4)})`;
  L06.style.filter = p < 0.97 ? `blur(${(12 * (1 - p)).toFixed(2)}px)` : 'none';
  const lt = t - C8;
  const s = TR(t, [[C8, 1.0], [W(9, 'executiva'), 1.32]]) + 0.008 * lt;
  foco(F06, 960, TR(t, [[C8, 540], [W(9, 'executiva'), 520]]), s);
  const sv = F06.s;
  pintaRealce(R06, [628, 459, 664, 38], sv, t, W(9, 'executiva'));
  const tc = W(9, 'perder') - 0.12;
  pintaCursor(K06, sv, t, [[W(9, 'executiva'), 1240, 760], [tc - 0.4, 1180, 482]], tc);
  troca.style.opacity = clamp(S(t - W(9, 'perder'), MOLA.ui) * 1.3, 0, 1);
  pintaSelo(SELO06, t, W(9, 'para'), C9 - 0.2, 1380, 300);
}

function pintaL07(t) {
  const vis = t >= C9 && t < C10 + 0.9;
  L07.style.display = vis ? 'block' : 'none';
  if (!vis) return;
  const ks = [[C9, 300], [W(10, 'exemplos') - 0.15, 1625], [W(10, 'privacidade') - 0.25, 722]];
  const fy = TR(t, ks, MOLA.padrao), fy0 = TR(t - 1 / 60, ks, MOLA.padrao);
  const lt = t - C9;
  const s = 1.46 + 0.006 * lt;
  foco(F07, 960, fy, s);
  const v = Math.abs(fy - fy0) * 60;
  F07.mundo.style.filter = v > 300 ? `blur(${Math.min(10, (v - 300) / 260).toFixed(2)}px)` : 'none';
  pintaHolofote(H07b, [624, 1550, 672, 140], F07.s, t, W(10, 'pergunta') - 0.1, W(10, 'privacidade') - 0.45);
  pintaHolofote(H07c, [624, 656, 672, 124], F07.s, t, W(10, 'privacidade'));
  // recua quando os aparelhos chegam
  const q = t > C10 ? clamp(S(t - C10, MOLA.padrao), 0, 1) : 0;
  L07.style.transform = `scale(${(1 - 0.08 * q).toFixed(4)})`;
  veu07.style.opacity = (0.88 * q).toFixed(3);
}

function pintaTiras(t) {
  // persiana: fecha sobre o cadastro e abre no guia
  const fecha = C9 - 0.32;
  TIRAS.forEach((tr, i) => {
    const a = S(t - fecha - i * 0.022, MOLA.ui), b = S(t - C9 - 0.02 - i * 0.03, MOLA.ui);
    const v = clamp(a, 0, 1) * (1 - clamp(b, 0, 1));
    tr.style.display = v > 0.002 && t > fecha && t < C9 + 0.9 ? 'block' : 'none';
    tr.style.transform = `scaleY(${v.toFixed(4)})`;
  });
}

function pintaNote(t) {
  const vis = t >= C10 && t < C11 + 0.6;
  note.style.display = vis ? 'block' : 'none';
  if (!vis) return;
  const p = S(t - (W(11, 'computador') - 0.25), MOLA.padrao);
  note.style.transform = `translate(${lerp(2100, 820, p).toFixed(2)}px, 200px) rotate(${(0.15 * Math.sin(t * 0.7 + 1)).toFixed(3)}deg)`;
  const r = t - W(11, 'responde');
  noteLin.forEach((l, i) => { const k = clamp(S(r - i * 0.08, MOLA.ui), 0, 1); l.style.background = r > 0 ? `rgba(59,111,182,${(0.06 + 0.12 * k).toFixed(3)})` : '#F5F7FC'; });
}

function pintaAssinatura(t) {
  const p = S(t - C11, MOLA.pesada);
  cortina.style.display = t >= C11 ? 'block' : 'none';
  cortina.style.transform = `translateY(${((1 - clamp(p, 0, 1)) * 1080).toFixed(2)}px)`;
  const tl = C11 + 0.3;
  logo.style.display = t >= tl ? 'block' : 'none';
  const k = clamp(S(t - tl, MOLA.pesada), 0, 1);
  logo.style.opacity = clamp((t - tl) / 0.35, 0, 1);
  logo.style.transform = `translate(-50%, -50%) scale(${(0.96 + 0.04 * k).toFixed(4)})`;
}

// ---------- Sons ----------
PERGUNTAS.forEach((q) => { cue(Math.max(0, q.t0), 'key', { len: +(q.t1 - Math.max(0, q.t0)).toFixed(2), g: 0.35 }); cue(q.env, 'pop', { g: 0.55 }); });
CHIPS.forEach((c) => cue(c.tOk, 'notification', { g: 0.5 }));
[C1, C2, C3, C4, C5, C6, C7, C8, C9, C10].forEach((c) => cue(c, 'whoosh', { len: 0.4, g: 0.45 }));
cue(W(3, 'mesma'), 'click', { g: 0.55 });
cue(W(9, 'perder') - 0.12, 'click', { g: 0.55 });
cue(W(3, 'pendências'), 'pop', { g: 0.5 });
cue(W(6, 'vencidos'), 'pop', { g: 0.5 });
cue(W(8, 'nome'), 'pop', { g: 0.5 });
cue(W(9, 'para'), 'hit', { g: 0.45 });
cue(C11 + 0.3, 'chime', { g: 0.6 });
const PESO = { hit: 6, notification: 5, chime: 5, click: 4, pop: 3, whoosh: 3, key: 2 };
function poda(lista) {
  const ok = [];
  for (const c of [...lista].sort((a, b) => (PESO[b.type] - PESO[a.type]) || (a.t - b.t))) {
    if (ok.some((o) => Math.abs(o.t - c.t) < 0.12)) continue;
    ok.push(c);
  }
  return ok.sort((a, b) => a.t - b.t);
}
window.CUES = poda(CUES.filter((c) => c.t >= 0 && c.t < DUR));

// ---------- Carregar e pintar ----------
const PRONTO = (async () => {
  await document.fonts.load('40px HPS');
  await document.fonts.ready;
  await Promise.all([...palco.querySelectorAll('img')].map((i) => (i.decode ? i.decode().catch(() => {}) : null)));
  for (const p of PARTES) { p.el.style.opacity = 1; p.el.style.transform = 'none'; }
  rolo.style.transform = 'none';
  medeRolagem();
})();

window.seek = async (t) => {
  await PRONTO;
  pintaFundo(t);
  pintaCamera(t);
  pintaCelular(t);
  pintaAviso(t);
  pintaDado(dadoP, t, W(2, 'três'), C1 - 0.1, [W(2, 'otávio'), W(2, 'renata')]);
  pintaDado(dadoO, t, W(5, 'casos'), C4 - 0.05, [W(5, 'farmácia'), W(5, 'uti'), W(5, 'recepção')]);
  pintaP01(t);
  pintaP05(t);
  pintaP04(t);
  pintaP07(t);
  pintaVerso(t);
  pintaL02(t);
  pintaL06(t);
  pintaL07(t);
  pintaTiras(t);
  pintaNote(t);
  pintaLegenda(t);
  pintaAssinatura(t);
};

if (!window.RENDER) {
  const q = new URLSearchParams(location.search);
  const t0 = performance.now(), ini = +(q.get('t') || 0);
  let ocupado = false;
  const tocar = async (agora) => { if (!ocupado) { ocupado = true; await seek((ini + (agora - t0) / 1000) % DUR); ocupado = false; } requestAnimationFrame(tocar); };
  requestAnimationFrame(tocar);
} else {
  seek(0);
}
</script>
