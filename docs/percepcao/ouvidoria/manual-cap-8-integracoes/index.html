function logo(w) {

  return `<svg width="${w}" height="${h}" viewBox="0 0 100 42" fill="none" style="flex-shrink:0">

    <path d="M44 40 A24 24 0 0 1 92 40" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
  </svg>`;
}

/* QR desenhado, determinístico: mesma fonte, mesmo desenho em todo render */
function qr(px, semente) {
  const N = 25, s = px / N;
  let d = "", x = semente || 7;
  const rnd = () => { x = (x * 1103515245 + 12345) % 2147483648; return x / 2147483648; };
  const canto = (cx, cy) =>
    `<rect x="${cx*s}" y="${cy*s}" width="${7*s}" height="${7*s}" fill="#000"/>` +
    `<rect x="${(cx+1)*s}" y="${(cy+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/>` +
    `<rect x="${(cx+2)*s}" y="${(cy+2)*s}" width="${3*s}" height="${3*s}" fill="#000"/>`;
  const dentroCanto = (i, j) =>
    (i < 8 && j < 8) || (i > N - 9 && j < 8) || (i < 8 && j > N - 9);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (dentroCanto(i, j)) continue;
    if (rnd() > 0.5) d += `<rect x="${i*s}" y="${j*s}" width="${s}" height="${s}" fill="#000"/>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" style="flex-shrink:0"><rect width="${px}" height="${px}" fill="#fff"/>${d}${canto(0,0)}${canto(N-7,0)}${canto(0,N-7)}</svg>`;
}

}
