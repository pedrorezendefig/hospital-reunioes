function tabelaPops(acaoDaLinha, alvos) {
  alvos = alvos || {};
  const th = `<div class="th">
      <span style="width:${CL.cod}px">Código</span>
      <span style="width:${CL.nome}px">Nome</span>

      <span style="width:${CL.ela}px">Elaborador</span>
      <span style="width:${CL.ac}px"></span>
    </div>`;
  const linhas = POPS_LINHAS.map((base, i) => {
    const r = alvos.estados && alvos.estados[i] ? { ...base, ...alvos.estados[i] } : base;
    const acao = acaoDaLinha ? acaoDaLinha(r, i) : "";
    return `<div class="tr">
      <span style="width:${CL.cod}px"><span class="tag tag-cod">${r.cod}</span></span>
      <span style="width:${CL.nome}px;font-weight:600">${r.nome}</span>
      <span style="width:${CL.setor}px;color:#64748B">${r.setor}</span>
      <span style="width:${CL.cri}px"><span class="tag ${r.cls}">${r.cri}</span></span>
      <span style="width:${CL.est}px" data-alvo="estado-linha-${i}"><span class="tag ${r.ecls}">${r.ver} · ${r.est}</span></span>
      <span style="width:${CL.ela}px;color:#64748B">${r.ela}</span>
      <span style="width:${CL.ac}px;display:flex;gap:2px;justify-content:flex-end">${acao}</span>
    </div>`;
  }).join("");
  const nova = alvos.linhaNova
    ? `<div class="tr" id="linha-nova" style="opacity:0">
        <span style="width:${CL.cod}px"><span class="tag tag-cod">HSM_CTI-002</span></span>
        <span style="width:${CL.nome}px;font-weight:600">Higienização das Mãos</span>
        <span style="width:${CL.setor}px;color:#64748B">CTI</span>
        <span style="width:${CL.cri}px"><span class="tag tag-cri">CRÍTICA</span></span>

        <span style="width:${CL.ac}px;display:flex;gap:2px;justify-content:flex-end"><span class="mini-btn mini-neu">Papéis</span></span>
      </div>`
    : "";
  return `<div class="tb">${th}${linhas}${nova}</div>`;
}

/* O fluxograma desenhado pelo app: caixas do caminho principal e o desvio. */
function desenhoFluxograma() {
  const cx = 150;
  const cxa = (t, x, y, w, h, tipo) => {
    const fundo = tipo === "dec" ? "#FFF7ED" : tipo === "fim" ? "#ECFDF5" : "#EEF2FF";
    const borda = tipo === "dec" ? "#FDBA74" : tipo === "fim" ? "#6EE7B7" : "#A5B4FC";
    const raio = tipo === "fim" ? 12 : 4;
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${raio}" fill="${fundo}" stroke="${borda}" stroke-width="1.4"/>
      <text x="${x + w / 2}" y="${y + h / 2 + 3}" text-anchor="middle" font-size="8" fill="#1E293B" font-family="HP Simplified, sans-serif">${t}</text></g>`;
  };
  const seta = (x1, y1, x2, y2, rot) => `<g><path d="M${x1} ${y1} L${x2} ${y2}" stroke="#6B7280" stroke-width="1.2" fill="none"/>
    <path d="M${x2} ${y2} l-3 -4 l6 0 z" fill="#6B7280" transform="rotate(${rot || 0} ${x2} ${y2})"/>
    </g>`;
  return `<svg viewBox="0 0 300 240" width="300" height="240" xmlns="http://www.w3.org/2000/svg">
    ${cxa("Início", cx - 34, 6, 68, 20, "fim")}
    ${seta(cx, 26, cx, 42, 180)}
    ${cxa("Molhar as mãos", cx - 56, 42, 112, 20)}
    ${seta(cx, 62, cx, 78, 180)}
    ${cxa("Aplicar sabonete", cx - 56, 78, 112, 20)}
    ${seta(cx, 98, cx, 114, 180)}
    ${cxa("Friccionou 40s?", cx - 56, 114, 112, 20, "dec")}
    ${seta(cx, 134, cx, 150, 180)}
    ${cxa("Enxaguar e secar", cx - 56, 150, 112, 20)}
    ${seta(cx, 170, cx, 186, 180)}
    ${cxa("Fim", cx - 34, 186, 68, 20, "fim")}
    <path d="M${cx + 56} 124 L${cx + 86} 124 L${cx + 86} 88 L${cx + 56} 88" stroke="#6B7280" stroke-width="1.2" fill="none"/>
    <path d="M${cx + 56} 88 l4 -3 l0 6 z" fill="#6B7280"/>
    <text x="${cx + 90} " y="108" font-size="7" fill="#64748B" font-family="HP Simplified, sans-serif">não</text>
  </svg>`;
}

/* Posições calculadas uma vez, no carregamento: o marcador e o dedo saem da
   medida real do elemento, e não de coordenada escrita à mão. */
const C = {};
function medir() {
  const palco = document.getElementById("palco-tarefa");
  const base = palco.getBoundingClientRect();
  /* Telas que nascem escondidas também precisam ser medidas: mostramos todas
     por um instante (elas se sobrepõem no mesmo espaço) e devolvemos o estado. */
  const ocultos = Array.from(palco.querySelectorAll("[data-medir-oculto]"));
  const antes = ocultos.map((e) => e.style.display);
  ocultos.forEach((e) => { e.style.display = "block"; });
  palco.querySelectorAll("[data-alvo]").forEach((el) => {
    const r = el.getBoundingClientRect();
    const l = (r.left - base.left) / 2;
    const t = (r.top - base.top) / 2;
    const w = r.width / 2;
    const h = r.height / 2;
    C[el.dataset.alvo] = { l, t, w, h, x: l + w / 2, y: t + h / 2 };
  });
  palco.querySelectorAll("[data-marca]").forEach((m) => {
    const c = C[m.dataset.marca];
    if (!c) return;
    const f = parseFloat(m.dataset.folga || "2");
    m.style.left = c.l - f + "px";
    m.style.top = c.t - f + "px";
    m.style.width = c.w + f * 2 + "px";
    m.style.height = c.h + f * 2 + "px";
  });
  ocultos.forEach((e, i) => { e.style.display = antes[i]; });
  /* Texto de exemplo e valor digitado empilhados no mesmo canto do campo. */
  palco.querySelectorAll(".campo").forEach((c) => {
    const ph = c.querySelector(".ph"), val = c.querySelector(".val");
    if (!ph || !val || ph.parentNode.classList.contains("txt")) return;
    const w = document.createElement("span");
    w.className = "txt";
    ph.parentNode.insertBefore(w, ph);
    w.appendChild(ph);
    w.appendChild(val);
  });
  /* Camadas que cobrem a tela de propósito (modal, véu, aviso, menu). */
  palco.querySelectorAll(".modal, .backdrop, .toast, .menu-user").forEach((e) => {
    e.setAttribute("data-layout-allow-overlap", "");
    e.setAttribute("data-layout-allow-occlusion", "");
    e.querySelectorAll("*").forEach((x) => {
      x.setAttribute("data-layout-allow-overlap", "");
      x.setAttribute("data-layout-allow-occlusion", "");
    });
  });
}

/* A ponta da seta do dedo fica a (3.5, 2.1) do canto do elemento. */
const PX = 3.5, PY = 2.1;
const em = (alvo, ox, oy) => [C[alvo].x - PX + (ox || 0), C[alvo].y - PY + (oy || 0)];
/* Move o dedo de um alvo (ou par de coordenadas) para outro. */
function anda(g, t, de, para) {
  const a = Array.isArray(de) ? de : em(de);
  const b = Array.isArray(para) ? para : em(para);
  move(g, t, a[0], a[1], b[0], b[1]);
}

const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);

const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);

  if (campo) tl.to(campo, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
const marca_on = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);

const abre = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", ...IR }, t);
const fecha = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const rola = (sel, t, y) => tl.to(sel, { y: y, duration: 0.7, ease: "power2.inOut" }, t);
const toast = (sel, t, ate) => { tl.fromTo(sel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", ...IR }, t); tl.to(sel, { opacity: 0, duration: 0.3 }, ate); };

};
