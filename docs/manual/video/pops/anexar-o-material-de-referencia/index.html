const campo = (id, vazio, cheio) => `<div class="cx" id="${id}"><span class="vazio" id="${id}-v">${vazio || "&nbsp;"}</span><span class="cheio sobre" id="${id}-c">${cheio}</span><span class="cx-foco" id="${id}-f"></span></div>`;
/* Escolha numa lista: toca o campo, a lista abre, toca a opção, o valor entra. */
function escolhe(t, campoId, listaId, i, de) {
  const c = alvo(campoId), o = alvo(`${listaId}-${i}`);
  toca(t, c, de); mostra(`#${campoId}-f`, t + 0.95, 0.1); mostra(`#${listaId}`, t + 1.0, 0.15); toca(t + 1.3, o, c);
  esconde(`#${listaId}`, t + 2.4, 0.12); esconde(`#${campoId}-f`, t + 2.45, 0.1); esconde(`#${campoId}-v`, t + 2.45, 0.1); mostra(`#${campoId}-c`, t + 2.45, 0.1);
  return o;
}
/* A Elaboração (pops/[id]/elaboracao/page.tsx): o POP vivo à esquerda e o Consultor de POPs à direita. */
const cabElab = (p, pop, apagado) => `<header class="vh"><div class="vh-in" style="max-width:80rem"><div class="esq"><span class="volta">${ic("voltar", 16)}</span><div><div class="eti" id="${p}-etapa">${ic("brilho", 14)}Elaboração de POP</div><h1>${pop.cod}<span> · ${pop.nome}</span></h1></div></div>
  <span class="bt-verde" id="${p}-aprovar">${ic("checkc", 16)}Aprovar versão final${apagado ? `<span class="apaga" id="${p}-aprovar-apaga"></span>` : ""}</span></div></header>`;
const periodicidade = (p, atual, sugestao) => `<div class="per" id="${p}-per"><span class="rot-per">${ic("calrel", 16)}<b>Periodicidade de revisão</b></span>${sugestao ? `<span class="sug" id="${p}-sug">${ic("brilho", 12)}Agente sugere: ${sugestao}</span>` : ""}
  <span class="fim-per"><small>Escolha final</small><span class="cmp" style="min-width:180px">${selValor(`${p}-fper`, atual, sugestao || atual)}${lista(`${p}-lper`, ["3 meses", "6 meses", "1 ano", "2 anos"], atual)}</span></span></div>`;
/* @ic pessoa @ic robo */
const msg = (eu, texto, id) => `<div class="msg${eu ? " eu" : ""}"${id ? ` id="${id}"` : ""}><span class="av">${ic(eu ? "pessoa" : "robo", 14)}</span><div class="bal">${texto}</div></div>`;
const BOAS_VINDAS = "Vamos elaborar este POP juntos. Me conte como o procedimento funciona na prática. Eu estruturo nas seções do template institucional, seguindo as boas práticas de hospitais acreditados, e pergunto o que faltar. As seções tomam forma ao lado; quando o documento estiver pronto, use \"Aprovar versão final\".";
const chat = (p, msgs, extra, cheio) => `<div class="chat" id="${p}-chat" style="left:934.5px"><div class="chat-cab"><span class="ic-box">${ic("robo", 16)}</span><div><h3>Consultor de POPs</h3><p>Boas práticas ONA / JCI</p></div></div>
  <div class="chat-msgs" id="${p}-msgs">${msg(false, BOAS_VINDAS)}${msgs || ""}</div>${extra || ""}
  <div class="chat-pe"><div class="txt" id="${p}-txt"><span class="vazio" id="${p}-txt-v">Descreva o procedimento, passo a passo...</span><span class="cheio" id="${p}-txt-c">${cheio || ""}</span></div><span class="bt-ch" id="${p}-clipe">${ic("clipe", 16)}</span><span class="bt-ch" id="${p}-micro">${ic("micro", 16)}</span><span class="bt-env" id="${p}-enviar">${ic("enviar", 16)}<span class="apaga" id="${p}-enviar-apaga"></span></span></div></div>`;
/* A página inteira: cabeçalho, coluna do POP (rolável) e o chat fixo ao lado. */
const telaElab = (p, pop, esquerda, conversa, apagado) => `<div class="pg-doc"><div class="el-grade"><div class="el-rolo" id="${p}-rolo" style="width:883.5px">${esquerda}</div>${conversa}</div>${cabElab(p, pop, apagado)}</div>`;
/* O POP de exemplo do roteiro: HSM_FARM-002, ainda A Elaborar, com a Marina como Elaboradora. */
const POP = { cod: "HSM_FARM-002", nome: "POP Recebimento de Medicamentos", setor: "Farmácia (FARM)", crit: "MÉDIA", elab: "Marina Alves", rev: "Rafael Pimenta", val: "Helena Duarte" };
const ARQ1 = "POP-Recebimento-de-Medicamentos-2019.txt", ARQ2 = "RDC-430-2020-boas-praticas.pdf";
const PEDIDO = "Elabore a nova versão deste POP a partir do material anexado, mantendo a estrutura e o conteúdo do documento original.";
const vazia = `<section class="sec" style="padding:1.5rem 1.25rem"><p class="vazia">As seções do POP tomam forma conforme a conversa com o agente.</p></section>`;
const esquerda = periodicidade("e", "6 meses") + identificacao("e", POP) + vazia;
const etiqueta = (id, nome) => `<div class="eti-mat" id="${id}">${ic("arquivo", 14)}<span class="nome-mat" id="${id}-nome">${nome}</span><span class="xm" id="${id}-x">${ic("fechar", 14)}</span></div>`;
const extra = `<div class="chat-extra">${etiqueta("e-mat1", ARQ1)}${etiqueta("e-mat2", ARQ2)}</div><div class="chat-extra"><span class="arranque" id="e-arranque">${ic("brilho", 14)}Elaborar a nova versão a partir do material anexado</span></div>`;
const arquivo = (id, nome, off) => `<div class="s-arq${off ? " off" : ""}" id="${id}">${ic("arquivo", 16)}${nome}${off ? "" : `<span class="s-on" id="${id}-on">${ic("arquivo", 16)}${nome}</span>`}</div>`;
const seletor = `<div class="sobre-app" id="seletor" style="opacity:0"><div class="seletor" id="seletor-caixa"><div class="s-topo">Abrir</div><div class="s-lista">${arquivo("a1", ARQ1)}${arquivo("a2", ARQ2)}${arquivo("a3", "Planilha-de-estoque-2024.xlsx", true)}</div>
  <div class="s-pe"><span class="s-bt">Cancelar</span><span class="s-bt ok" id="s-abrir">Abrir</span></div></div></div>`;
const aviso = (id, texto) => `<div class="aviso-ok" id="${id}"><span class="ic">${ic("checkc", 20)}</span><p>${texto}</p><span class="x">${ic("fechar", 16)}</span></div>`;
monta("app.hospitalsaomatheus.cloud/pops", `<div class="tela-app" id="t-lista">${casca(gestao("g"))}</div><div class="tela-app" id="t-elab">${telaElab("e", POP, esquerda, chat("e", "", extra, PEDIDO), true)}</div>`,
  seletor + aviso("aviso", "2 materiais de referência anexados. O agente passa a usá-los.") + aviso("aviso2", `"${ARQ2}" removido. Sai do contexto do agente.`));
const msgs = document.getElementById("e-msgs");
msgs.innerHTML = `<div id="e-msgs-in">${msgs.innerHTML}${msg(true, PEDIDO, "e-m1")}<div class="msg" id="e-pontos"><span class="av">${ic("robo", 14)}</span><div class="pontos"><i></i><i></i><i></i></div></div></div>`;
liberaCamera();
const rolaChat = (ate) => () => { const el = document.getElementById(ate); return Math.max(0, el.offsetTop + el.offsetHeight - (msgs.clientHeight - 2 * 17)); };
/* Passo 1 (4 a 10): Elaborar, na linha do HSM_FARM-002, no fim da lista. */
const ROLA_LINHA = rolagemPara("g-rolo", "g-HSM_FARM-002", 300, 655.6);
rola("#g-rolo", ROLA_LINHA, 4.5, 1.2);
const bElaborar = alvo("g-HSM_FARM-002-etapa", ROLA_LINHA);
mira(5.2, 1.8, bElaborar, 1.45, 9.4); marca(6.4, bElaborar, 8.6); toca(7.0, bElaborar); soltaDedo(8.5);
trocaTela("#t-lista", "#t-elab", 9.0);
mira(9.4, 1.0, REPOUSO, 1.0, 10.4);
/* Passo 2 (10 a 15,5): o clipe, ao lado do campo de mensagem. */
const bClipe = alvo("e-clipe");
mira(10.4, 1.4, alvo("e-chat"), 1.25, 14.6); marca(11.4, bClipe, 13.4); toca(11.6, bClipe); soltaDedo(13.0); mostra("#seletor", 13.6, 0.25);
mira(14.6, 1.2, alvo("seletor-caixa"), 1.35, 20.6);
/* Passo 3 (15,5 a 23): os dois arquivos aceitos; viram etiquetas acima do campo. */
toca(15.6, alvo("a1")); mostra("#a1-on", 16.55, 0.1); toca(16.9, alvo("a2"), alvo("a1")); mostra("#a2-on", 17.85, 0.1); toca(18.4, alvo("s-abrir"), alvo("a2"));
aperta("#s-abrir", 19.35); soltaDedo(19.8); esconde("#seletor", 19.6, 0.2);
mostra("#e-mat1", 20.0, 0.25); mostra("#e-mat2", 20.15, 0.25); mostra("#e-arranque", 20.3, 0.25); mostra("#aviso", 20.2, 0.3);
mira(20.6, 1.2, alvo("e-mat1 e-mat2"), 1.45, 23.0); marca(21.2, alvo("e-mat1 e-mat2"), 22.8);
/* Passo 4 (23 a 29): o botão que escreve o pedido aparece com a conversa vazia. */
esconde("#aviso", 23.0, 0.3);
const bArranque = alvo("e-arranque");
mira(23.0, 1.2, bArranque, 1.5, 29.0); marca(23.8, bArranque, 25.6); toca(25.6, bArranque); soltaDedo(27.0); esconde("#e-txt-v", 26.6, 0.1);
mostra("#e-txt-c", 26.65, 0.4); esconde("#e-enviar-apaga", 26.7, 0.2);
/* Passo 5 (29 a 36): o pedido pronto no campo; envie. */
const bTxt = alvo("e-txt");
mira(29.0, 1.2, alvo("e-txt e-enviar"), 1.5, 31.6); marca(29.6, bTxt, 31.2);
const bEnviar = alvo("e-enviar");
toca(31.0, bEnviar, bTxt); aperta("#e-enviar", 31.95); soltaDedo(32.4);
esconde("#e-txt-c", 32.1, 0.15); mostra("#e-txt-v", 32.15, 0.15); tl.set("#e-enviar-apaga", { opacity: 1 }, 32.15); esconde("#e-arranque", 32.2, 0.2);
rola("#e-msgs-in", rolaChat("e-pontos"), 32.1, 0.5); mostra("#e-m1", 32.3, 0.3); mostra("#e-pontos", 32.9, 0.2); mira(31.6, 1.4, alvo("e-chat"), 1.25, 36.0);
/* Passo 6 (36 a 45): o X da etiqueta tira o arquivo da conversa. */
const bX = alvo("e-mat2-x");
mira(36.0, 1.2, alvo("e-mat1 e-mat2"), 1.5, 45.0); marca(36.8, bX, 38.4); toca(37.0, bX); soltaDedo(38.6); esconde("#e-mat2", 38.0, 0.3); mostra("#aviso2", 38.3, 0.3);
marca(39.6, alvo("e-mat1"), 41.6);
/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 49 }, 0);
window.__timelines["main"] = tl;
</script>
