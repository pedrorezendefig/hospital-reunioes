/* Barra lateral e topo do app: a moldura de toda tela interna. */
function shell(conteudo, ativo, opc) {
  opc = opc || {};
  const item = (nome, icone, chave) =>
    `<div class="sb-item${ativo === chave ? " on" : ""}"${opc.alvos && opc.alvos[chave] ? ` data-alvo="${opc.alvos[chave]}"` : ""}>${ic(icone, 7)}<span>${nome}</span></div>`;
  return `
    <div class="sb">
      <div class="sb-logo"><img src="assets/logo-hsm.png" alt="Hospital São Matheus" /></div>
      <div class="sb-nav">

      </div>

    <div class="hd">
      <div class="hd-busca">${ic("busca", 5)}<span>Buscar...</span></div>
      <div class="hd-dir">
        ${ic("sino", 7, "#64748B")}

}

        <div style="flex:1">
          <h1 style="font-size:10.5px;font-weight:700;color:#1E293B">Administrador</h1>
          <p style="font-size:5.8px;color:#64748B;margin-top:1px">Coordenador de Qualidade</p>
          <span style="display:inline-flex;align-items:center;gap:2px;padding:1.5px 5px;border-radius:999px;background:#ECFDF5;color:#047857;font-size:5px;font-weight:700;margin-top:3px" data-alvo="selo-ativo">

/* Posições calculadas uma vez, no carregamento: o marcador e o dedo saem da
   medida real do elemento, e não de coordenada escrita à mão. */
const C = {};
function medir() {
  const palco = document.getElementById("palco-tarefa");
  const base = palco.getBoundingClientRect();
  /* Telas que nascem escondidas também precisam ser medidas: mostramos todas
     por um instante (elas se sobrepõem no mesmo espaço) e devolvemos o estado. */
  const ocultos = Array.from(palco.querySelectorAll("[data-medir-oculto]"));
  const antes = ocultos.map((e) => e.style.display);
  ocultos.forEach((e) => { e.style.display = "block"; });
  palco.querySelectorAll("[data-alvo]").forEach((el) => {
    const r = el.getBoundingClientRect();
    const l = (r.left - base.left) / 2;
    const t = (r.top - base.top) / 2;
    const w = r.width / 2;
    const h = r.height / 2;
    C[el.dataset.alvo] = { l, t, w, h, x: l + w / 2, y: t + h / 2 };
  });
  palco.querySelectorAll("[data-marca]").forEach((m) => {
    const c = C[m.dataset.marca];
    if (!c) return;
    const f = parseFloat(m.dataset.folga || "2");
    m.style.left = c.l - f + "px";
    m.style.top = c.t - f + "px";
    m.style.width = c.w + f * 2 + "px";
    m.style.height = c.h + f * 2 + "px";
  });
  ocultos.forEach((e, i) => { e.style.display = antes[i]; });
  /* Texto de exemplo e valor digitado empilhados no mesmo canto do campo. */
  palco.querySelectorAll(".campo").forEach((c) => {
    const ph = c.querySelector(".ph"), val = c.querySelector(".val");
    if (!ph || !val || ph.parentNode.classList.contains("txt")) return;
    const w = document.createElement("span");
    w.className = "txt";
    ph.parentNode.insertBefore(w, ph);
    w.appendChild(ph);
    w.appendChild(val);
  });
  /* Camadas que cobrem a tela de propósito (modal, véu, aviso, menu). */
  palco.querySelectorAll(".modal, .backdrop, .toast, .menu-user").forEach((e) => {
    e.setAttribute("data-layout-allow-overlap", "");
    e.setAttribute("data-layout-allow-occlusion", "");
    e.querySelectorAll("*").forEach((x) => {
      x.setAttribute("data-layout-allow-overlap", "");
      x.setAttribute("data-layout-allow-occlusion", "");
    });
  });
}

/* A ponta da seta do dedo fica a (3.5, 2.1) do canto do elemento. */
const PX = 3.5, PY = 2.1;
const em = (alvo, ox, oy) => [C[alvo].x - PX + (ox || 0), C[alvo].y - PY + (oy || 0)];
/* Move o dedo de um alvo (ou par de coordenadas) para outro. */
function anda(g, t, de, para) {
  const a = Array.isArray(de) ? de : em(de);
  const b = Array.isArray(para) ? para : em(para);
  move(g, t, a[0], a[1], b[0], b[1]);
}
/* Medir de novo quando imagens e fontes terminarem de carregar: o quadro

  <div class="rodape-v">v0.142.1</div>` +
  passo("p1", 1, "Clique no seu nome e escolha Configurações", "O atalho fica no alto da tela, à direita.", 120) +

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(g + " .pulse", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const some_dedo = (g, t) => tl.to(g, { opacity: 0, duration: 0.25 }, t);
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const digita = (vazio, cheio, campo, t) => {
  tl.to(vazio, { opacity: 0, duration: 0.15 }, t);
  tl.to(cheio, { opacity: 1, duration: 0.22 }, t + 0.15);
  if (campo) tl.to(campo, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
const marca_on = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const marca_off = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
const abre = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", ...IR }, t);
const fecha = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const rola = (sel, t, y) => tl.to(sel, { y: y, duration: 0.7, ease: "power2.inOut" }, t);
const toast = (sel, t, ate) => { tl.fromTo(sel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", ...IR }, t); tl.to(sel, { opacity: 0, duration: 0.3 }, ate); };
const troca = (sai, entra, t) => {
  tl.to(sai, { opacity: 0, duration: 0.3 }, t);
  tl.set(sai, { display: "none" }, t + 0.3);
  tl.set(entra, { display: "block" }, t + 0.32);
  tl.fromTo(entra, { opacity: 0 }, { opacity: 1, duration: 0.35, ...IR }, t + 0.34);
};

nota("#p1", 4.9, 10.5);

/* a chave desliga: fundo cinza e a bolinha volta para a esquerda */

window.__timelines.main = tl;
