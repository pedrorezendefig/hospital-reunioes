  email: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>', paleta: '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
  olho: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>', checkc: '<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>', fechar: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
const ic = (nome, s, traco) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${traco || 2}" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${P[nome]}</svg>`;

/* A casca: a barra lateral muda de estado com a rota (no Dashboard, o item fica aceso). */
const lado = (id, noDash) => `<div class="lado" id="${id}"><div class="marca"><img src="assets/logo-hsm.png" alt="Hospital São Matheus" /></div><nav>
    <div class="mi${noDash ? " grupo-on" : ""}">${ic("alvo", 18, noDash ? 2 : 1.5)}Reuniões e metas<span class="fim">${ic("baixo", 16)}</span></div>
    <div class="sub"><div class="mi${noDash ? " on" : ""}">${ic("painel", 16, noDash ? 2 : 1.5)}Dashboard</div><div class="mi">${ic("calendario", 16, 1.5)}Calendário</div><div class="mi">${ic("relogio", 16, 1.5)}Pendências<span class="fim">${ic("direita", 16)}</span></div></div>
    <div class="mi">${ic("megafone", 18, 1.5)}Ouvidoria</div><div class="mi">${ic("escudo", 18, 1.5)}Admin</div><div class="mi" style="margin-top:8px">${ic("ajuda", 18, 1.5)}Ajuda</div></nav></div>`;
const topo = `<div class="topo"><div class="busca">${ic("lupa", 16)}Buscar...</div><div class="quem"><div class="sino">${ic("sino", 22, 1.75)}</div><div class="divisor"></div>
    <div class="pessoa" id="pessoa"><span class="aceso" id="pessoa-aceso"></span><div class="tx"><b>paula.nogueira</b><span>paula.nogueira@exemplo...</span></div><div class="avatar">P<span class="seta" id="seta">${ic("baixo", 12)}</span></div></div></div></div>`;
const menuNome = `<div class="menu-nome" id="menu-nome"><div class="mn-bloco"><div class="item"><span class="ic">${ic("pessoa", 16)}</span>Meu Perfil</div><div class="item" id="item-conf"><span class="ic">${ic("engrenagem", 16)}</span>Configurações</div></div>
  <div class="mn-bloco"><div class="item sair"><span class="ic">${ic("sair", 16)}</span>Sair da conta</div></div></div>`;

const kpi = (icone, cor, n, r, s, alerta) => `<div class="kpi${alerta ? " alerta" : ""}"><div class="ic" style="background:color-mix(in srgb, ${cor} 10%, transparent);color:${cor}">${icone}</div><div class="n"${n.endsWith("%") ? ' style="color:var(--color-success)"' : ""}>${n}</div><div class="r">${r}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
const anel = '<svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" fill="none" stroke="var(--color-slate-200)" stroke-width="3"/><circle cx="14" cy="14" r="10" fill="none" stroke="var(--color-success)" stroke-width="3" stroke-dasharray="62.83" stroke-dashoffset="8.8" transform="rotate(-90 14 14)"/></svg>';
const paginaDash = `<div class="pagina" id="p-dash"><div class="ola"><h1>Olá, paula.nogueira</h1><p>Quarta-feira, 14 de outubro de 2026</p></div>
  <div class="kpis">${kpi(anel, "var(--color-success)", "86%", "Conformidade", "12 em dia · 2 atrasadas")}${kpi(ic("relogio", 20), "var(--color-warning)", "3", "Vencem em 3 dias", "", true)}${kpi(ic("aviso", 20), "var(--color-warning)", "0", "Atas Paradas", "&gt; 3 dias")}${kpi(ic("caneta", 20), "var(--color-primary)", "0", "Aguardam Assinatura", "")}</div>
  <div class="filtros">${ic("filtro", 16)}Filtros Dinâmicos de Desempenho</div></div>`;

/* Configurações, na aba Segurança (a que abre primeiro). */
const sec = (id, icone, nome, on) => `<div class="bt-sec${on ? " on" : ""}" id="${id}">${ic(icone, 18, on ? 2 : 1.5)}${nome}</div>`;
const AVISOS = [["Menções em comentários", "Receba notificações quando alguém mencionar você em um comentário"], ["Prazos próximos", "Seja avisado quando uma pendência estiver perto do prazo"], ["Novos comentários", "Notificações sobre novos comentários em reuniões que você participa"], ["Atribuição de pendências", "Seja notificado quando uma pendência for atribuída a você"]];
const linhaAviso = ([titulo, ajuda], i) => `<div class="linha-aviso" id="linha-${i}"><div><b>${titulo}</b><small>${ajuda}</small></div><span class="chave" id="chave-${i}"><span class="desligada" id="chave-${i}-off"></span><span class="bola" id="chave-${i}-bola"></span></span></div>`;
const cabSecao = (icone, nome, texto) => `<div class="cf-linha"><span class="caixa-ic">${ic(icone, 20)}</span><h2>${nome}</h2></div><p>${texto}</p>`;
const paginaConf = `<div class="pagina" id="p-conf"><div class="conf-cab"><div class="cf-linha"><span class="caixa-ic">${ic("engrenagem", 24)}</span><h1>Configurações</h1></div><p>Gerencie suas preferências e configurações do sistema</p></div>
  <div class="conf"><aside class="conf-menu" id="conf-menu"><div class="rot" id="rot-pessoal">Pessoal</div><div class="navs"><nav id="nav-seg">${sec("sec-seguranca", "escudoSimples", "Segurança", true)}${sec("sec-notif", "sino", "Notificações")}${sec("sec-email", "email", "Email")}${sec("sec-aparencia", "paleta", "Aparência")}</nav>
    <nav id="nav-notif">${sec("sec-seguranca-2", "escudoSimples", "Segurança")}${sec("sec-notif-2", "sino", "Notificações", true)}${sec("sec-email-2", "email", "Email")}${sec("sec-aparencia-2", "paleta", "Aparência")}</nav></div></aside>
    <div class="secoes"><div class="cf-secao" id="secao-seg">${cabSecao("escudoSimples", "Segurança", "Gerencie sua senha de acesso ao sistema")}<div class="form-seg">${["Nova senha", "Confirmar nova senha"].map((r, k) => `<div class="grupo"><label>${r}</label><div class="entrada"><span class="vazio">${k ? "Repita a nova senha" : "Mínimo 8 caracteres"}</span><span class="olho">${ic("olho", 18)}</span></div></div>`).join("")}<span class="bt-alterar">Alterar senha</span></div></div>
      <div class="cf-secao" id="secao-notif">${cabSecao("sino", "Notificações", "Controle quais notificações você deseja receber no sistema")}<div id="avisos">${AVISOS.map(linhaAviso).join("")}</div></div></div></div></div>`;
const avisoVerde = `<div class="aviso-verde" id="aviso-verde"><span class="ic">${ic("checkc", 20)}</span><p id="aviso-tx">Preferências salvas!</p><span class="x">${ic("fechar", 16)}</span></div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url"><span id="url-dash">app.hospitalsaomatheus.cloud/dashboard</span><span id="url-conf">app.hospitalsaomatheus.cloud/configuracoes</span></div></div>
    <div class="vista"><div class="app" id="app">${lado("lado-dash", true)}${lado("lado-conf", false)}${topo}<div class="corpo">${paginaDash}${paginaConf}</div>${menuNome}${avisoVerde}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera). Nada se mede na montagem: o script
   roda antes de a fonte do app carregar. Alvo é função que o GSAP chama
   quando o tween começa, e o render só busca o primeiro quadro depois da fonte. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + y * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const alvo = (ids) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x - 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.0);

/* Passo 1 (4 a 11): o seu nome, no alto à direita, e Configurações. */
const bPessoa = alvo("pessoa");
mira(4.4, 2.2, bPessoa, 1.6, 7.0);
toca(5.4, bPessoa);
tl.to("#pessoa-aceso", { opacity: 1, duration: 0.15 }, 6.35);
tl.to("#seta", { rotation: 180, duration: 0.3 }, 6.35);
tl.fromTo("#menu-nome", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 6.4);
const bMenu = alvo("pessoa menu-nome");
mira(7.0, 1.0, bMenu, 1.6, 10.0);
const bItem = alvo("item-conf");
toca(7.4, bItem, bPessoa);
marca(8.2, bItem, 9.4);
soltaDedo(9.4);
tl.to("#menu-nome", { opacity: 0, duration: 0.15 }, 9.5);
tl.to("#pessoa-aceso", { opacity: 0, duration: 0.15 }, 9.5);
tl.to("#seta", { rotation: 0, duration: 0.3 }, 9.5);
mira(10.0, 0.6, REPOUSO, 1.0, 11.0);
/* Transição com rastro: o Dashboard sai para a esquerda, Configurações vem da direita. */
tl.to("#p-dash", { x: -300, filter: "blur(24px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 9.7);
tl.fromTo("#p-conf", { x: 300, filter: "blur(24px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 9.9);
tl.to("#lado-dash", { opacity: 0, duration: 0.3 }, 9.9);
tl.to("#lado-conf", { opacity: 1, duration: 0.3 }, 9.9);
tl.to("#url-dash", { opacity: 0, duration: 0.2 }, 9.8);
tl.to("#url-conf", { opacity: 1, duration: 0.2 }, 9.9);

/* Passo 2 (11 a 17): Pessoal, Notificações. A seção troca no lugar. */
mira(11.0, 1.6, alvo("conf-menu"), 1.45, 14.6);
marca(12.0, alvo("rot-pessoal"), 13.0);
toca(12.6, alvo("sec-notif"));
tl.to("#nav-seg", { opacity: 0, duration: 0.15 }, 13.55);
tl.to("#nav-notif", { opacity: 1, duration: 0.15 }, 13.55);
tl.to("#secao-seg", { opacity: 0, duration: 0.2 }, 13.6);
tl.fromTo("#secao-notif", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 13.7);
soltaDedo(14.0);
marca(14.0, alvo("sec-notif-2"), 15.4);
mira(14.6, 1.6, alvo("secao-notif"), 1.25, 17.0);

/* Passo 3 (17 a 24): as quatro chaves. Novos comentários é desligada. */
const bAvisos = alvo("avisos");
mira(17.0, 1.2, bAvisos, 1.3, 20.4);
marca(17.6, bAvisos, 20.0);
const bLinha = alvo("linha-2"), bChave = alvo("chave-2");
mira(20.4, 1.2, bLinha, 1.5, 24.0);
toca(20.8, bChave);
tl.to("#chave-2-off", { opacity: 1, duration: 0.2 }, 21.75);
tl.to("#chave-2-bola", { x: 4, duration: 0.2, ease: "power2.out" }, 21.75);
soltaDedo(22.4);
tl.fromTo("#aviso-verde", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 22.0);
marca(22.4, bLinha, 23.8);

/* Passo 4 (24 a 31): o aviso verde, e a chave que ficou como você deixou. */
const bAviso = alvo("aviso-verde");
mira(24.0, 1.4, bAviso, 1.5, 27.2);
marca(24.8, bAviso, 26.6);
tl.to("#aviso-verde", { opacity: 0, duration: 0.3 }, 27.0);
mira(27.2, 1.4, bLinha, 1.4, 31.0);
marca(28.0, bLinha, 30.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 35 }, 0);
window.__timelines["main"] = tl;
</script>
