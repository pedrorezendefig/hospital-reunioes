      ${kpi(ic("relogio", 20), "var(--color-warning)", "color-mix(in srgb, var(--color-warning) 10%, transparent)", "3", "Vencem em 3 dias", "", true)}${kpi(ic("aviso", 20), "var(--color-warning)", "color-mix(in srgb, var(--color-warning) 10%, transparent)", "0", "Atas Paradas", "&gt; 3 dias")}${kpi(ic("caneta", 20), "var(--color-primary)", "color-mix(in srgb, var(--color-primary) 10%, transparent)", "0", "Aguardam Assinatura", "")}</div>
    <div class="filtros">${ic("filtro", 16)}Filtros Dinâmicos de Desempenho</div></div></div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url"><span id="url-login">app.hospitalsaomatheus.cloud/login</span><span class="depois" id="url-dash">app.hospitalsaomatheus.cloud/dashboard</span></div></div>
    <div class="vista"><div class="app" id="app">${telaEntrada}${telaDashboard}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera). Nada se mede na montagem: o script
   roda antes de a fonte do app carregar. Alvo é função que o GSAP chama
   quando o tween começa, e o render só busca o primeiro quadro depois da fonte. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + y * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const alvo = (ids) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.0);

/* Passo 1 (4 a 10): a tela de entrada, Bem-vindo de volta. */
const bCab = alvo("cab");
mira(4.4, 2.6, bCab, 1.35, 10.0);
marca(6.2, bCab, 9.6);

/* Passo 2 (10 a 16): o Email. */
const bEmail = alvo("g-email");
mira(10.0, 1.6, bEmail, 1.5, 16.0);
toca(10.6, bEmail);
tl.to("#email-foco", { opacity: 1, duration: 0.15 }, 11.55);
tl.to("#email-vazio", { opacity: 0, duration: 0.15 }, 11.8);
tl.to("#email-cheio", { opacity: 1, duration: 0.8 }, 11.9);
soltaDedo(12.6);
marca(13.0, bEmail, 15.6);

/* Passo 3 (16 a 24): a Senha, e o olho que mostra o que foi digitado. */
const bSenha = alvo("g-senha");
mira(16.0, 1.4, bSenha, 1.5, 24.0);
tl.to("#email-foco", { opacity: 0, duration: 0.15 }, 16.4);
toca(16.4, alvo("senha"));
tl.to("#senha-foco", { opacity: 1, duration: 0.15 }, 17.35);
tl.to("#senha-vazio", { opacity: 0, duration: 0.15 }, 17.6);
tl.to("#senha-pontos", { opacity: 1, duration: 0.8 }, 17.7);
const bOlho = alvo("olho");
toca(19.0, bOlho, alvo("senha"));
tl.to("#senha-pontos", { opacity: 0, duration: 0.15 }, 20.0);
tl.to("#senha-texto", { opacity: 1, duration: 0.2 }, 20.05);
tl.to("#olho-aberto", { opacity: 0, duration: 0.15 }, 20.0);
tl.to("#olho-fechado", { opacity: 1, duration: 0.15 }, 20.05);
soltaDedo(20.6);
marca(21.0, bSenha, 23.6);

/* Passo 4 (24 a 34): Entrar. O botão fica Entrando... e o Dashboard abre. */
const bEntrar = alvo("entrar");
mira(24.0, 1.6, bEntrar, 1.45, 28.2);
tl.to("#senha-foco", { opacity: 0, duration: 0.15 }, 24.4);
toca(24.8, bEntrar);
tl.to("#entrar", { scale: 0.97, duration: 0.1 }, 25.75);
tl.to("#entrar", { scale: 1, duration: 0.1 }, 25.85);
tl.to("#entrar-tx", { opacity: 0, duration: 0.15 }, 25.9);
tl.to("#entrar-carregando", { opacity: 1, duration: 0.15 }, 25.95);
tl.to("#entrar", { opacity: 0.5, duration: 0.15 }, 25.95);
soltaDedo(26.2);
marca(26.3, bEntrar, 27.9);
mira(28.2, 1.2, REPOUSO, 1.0, 29.4);
/* Transição com rastro: a entrada sai para a esquerda, o Dashboard vem da direita. */
tl.fromTo("#tela-login", { x: 0, filter: "blur(0px)", opacity: 1 }, { x: -300, filter: "blur(24px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 29.0);
tl.fromTo("#tela-dash", { x: 300, filter: "blur(24px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 29.2);
tl.to("#url-login", { opacity: 0, duration: 0.2 }, 29.1);
tl.to("#url-dash", { opacity: 1, duration: 0.2 }, 29.2);
const bOla = alvo("ola");
mira(29.4, 1.8, bOla, 1.3, 34.0);
marca(30.6, bOla, 33.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 38 }, 0);
window.__timelines["main"] = tl;
</script>
