<script>
/* Ícones no traço do app (mesma biblioteca das outras composições) */
function ic(nome, s, cls) {
  const P = {
    email: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    cadeado: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    olho: '<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.87 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.87 0"/><circle cx="12" cy="12" r="3"/>'
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls || ""}" style="flex-shrink:0">${P[nome]}</svg>`;
}

function logo(w) {
  const h = Math.round(w * 0.42);
  return `<svg width="${w}" height="${h}" viewBox="0 0 100 42" fill="none" style="flex-shrink:0">
    <path d="M8 40 A24 24 0 0 1 56 40" stroke="#3B6FB6" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 40 A24 24 0 0 1 92 40" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
  </svg>`;
}

function marca(w, cor) {
  return `${logo(w)}<div style="font-size:${Math.round(w*0.115)}px;font-weight:700;color:${cor || "#1E3A8A"};line-height:1.12;text-align:center;letter-spacing:.01em">HOSPITAL<br>SÃO MATHEUS</div>`;
}

const passo = (n, num, titulo, texto, topo) =>
  `<div class="passo" id="${n}" style="top:${topo}px"><div class="n">${num}</div><h3>${titulo}</h3><p>${texto}</p></div>`;

document.getElementById("palco-tarefa").innerHTML =
  `<div style="position:absolute;inset:0;background:#EEF1F6"></div>
  <div class="janela" data-layout-allow-overflow data-layout-allow-occlusion id="janela" style="left:56px;top:105px">
    <div class="barra"><i></i><i></i><i></i><div class="url">plataforma do hospital</div></div>
    <div class="tela" data-layout-allow-overflow data-layout-allow-occlusion id="tela-login">
      <div class="painel">
        <div class="caixa" style="display:flex;flex-direction:column;align-items:center;gap:4px">${marca(56)}</div>
        <p>A plataforma de gestão do Hospital São Matheus: reuniões, POPs e Ouvidoria.</p>
      </div>
      <div class="form">
        <div class="caixa">
          <h1>Bem-vindo de volta</h1>
          <div class="dek">Acesse a plataforma de gestão do hospital</div>
          <div class="lb">Email</div>
          <div class="campo" id="campo-email">
            ${ic("email", 8)}
            <span class="ph" id="email-ph">seu@email.com</span>
            <span class="val" id="email-val">admin@hospital.com</span>
          </div>
          <div class="lb" style="margin-top:9px">Senha</div>
          <div class="campo" id="campo-senha">
            ${ic("cadeado", 8)}
            <span class="ph" id="senha-ph">••••••••</span>
            <span class="val" id="senha-val">••••••••••</span>
            <span class="olho" id="olho">${ic("olho", 8)}</span>
          </div>
          <div class="esqueci">Esqueci minha senha</div>
          <div class="entrar" id="entrar"><span id="entrar-txt">Entrar</span></div>
        </div>
      </div>
    </div>
    <div class="painel-dashboard" data-layout-allow-overflow data-layout-allow-occlusion id="tela-dashboard">
      <div class="pd-topo">${marca(30)}</div>
      <div class="pd-menu">
        <div class="on">Reuniões e metas</div>
        <div>Ouvidoria</div>
        <div>POPs</div>
        <div>Ajuda</div>
      </div>
      <div class="pd-corpo">
        <h2>Olá, Administrador</h2>
        <p>quarta-feira, 16 de setembro de 2026</p>
        <div class="pd-cards">
          <div><b>92%</b><span>Conformidade</span></div>
          <div><b>4</b><span>Vencem em 3 dias</span></div>
          <div><b>1</b><span>Atas Paradas</span></div>
          <div><b>2</b><span>Aguardam Assinatura</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="marcador" data-layout-allow-overlap data-layout-allow-occlusion id="mk-email" style="left:336px;top:248px;width:200px;height:26px"></div>
  <div class="marcador" data-layout-allow-overlap data-layout-allow-occlusion id="mk-senha" style="left:336px;top:292px;width:200px;height:26px"></div>
  <div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  passo("p1", 1, "Abra o endereço da plataforma", "A tela mostra <b>Bem-vindo de volta</b>. É a mesma no computador e no celular.", 130) +
  passo("p2", 2, "Escreva o seu Email", "O mesmo endereço em que você recebe os avisos da plataforma.", 130) +
  passo("p3", 3, "Escreva a sua Senha", "O olho no canto do campo mostra o que você digitou, para conferir antes de entrar.", 130) +
  passo("p4", 4, "Clique em Entrar", "O botão fica <b>Entrando...</b> e você cai na sua tela inicial.", 130);

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const digita = (vazio, cheio, campo, t) => {
  tl.to(vazio, { opacity: 0, duration: 0.15 }, t);
  tl.to(cheio, { opacity: 1, duration: 0.22 }, t + 0.15);
  if (campo) tl.to(campo, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};

/* 1 · Abertura (0 a 4) */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);

/* 2 · A tarefa (4 a 35) */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.2);

/* passo 1: a tela abre */
nota("#p1", 4.9, 10.4);

/* passo 2: o email */
nota("#p2", 10.7, 16.4);
tl.fromTo("#mk-email", { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, 11.0);
move("#g1", 11.3, 470, 330, 400, 256);
clique("#g1", 12.3);
digita("#email-ph", "#email-val", "#campo-email", 12.6);
tl.to("#mk-email", { opacity: 0, duration: 0.3 }, 14.6);

/* passo 3: a senha */
nota("#p3", 16.7, 23.2);
tl.fromTo("#mk-senha", { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, 17.0);
move("#g1", 17.3, 400, 256, 400, 300);
clique("#g1", 18.3);
digita("#senha-ph", "#senha-val", "#campo-senha", 18.6);
tl.to("#olho", { color: "#2B2E7E", duration: 0.3 }, 20.4);
tl.to("#mk-senha", { opacity: 0, duration: 0.3 }, 21.6);

/* passo 4: entrar */
nota("#p4", 23.5, 30.6);
move("#g1", 23.9, 400, 300, 430, 349);
clique("#g1", 24.9);
aperta("#entrar", 24.9);
tl.to("#entrar-txt", { opacity: 0, duration: 0.15 }, 25.1);
tl.set("#entrar-txt", { innerText: "Entrando..." }, 25.3);
tl.to("#entrar-txt", { opacity: 1, duration: 0.15 }, 25.35);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 25.6);
tl.to("#tela-login", { opacity: 0, duration: 0.35 }, 26.6);
tl.set("#tela-dashboard", { display: "block" }, 26.9);
tl.to("#tela-dashboard", { opacity: 1, duration: 0.45 }, 26.95);

/* 3 · Fecho (35 a 40) */
surge("#fc-titulo", 35.3, 18);
surge("#fc-carimbo", 35.8, 14);
surge("#fc-org", 36.2, 12);

window.__timelines.main = tl;
</script>
