<script>

const P = {

/* Uma tela de entrada: o painel da marca à esquerda e o formulário à direita. */
const LADO_LOGIN = "A plataforma de gestão do Hospital São Matheus: reuniões, POPs e Ouvidoria.";
const LADO_SENHA = "Gestão automatizada de atas e decisões com inteligência artificial.";
const auth = (id, lado, form) => `<div class="tela-cheia auth" id="${id}"><div class="auth-lado"><div class="auth-logo"><img src="assets/logo-hsm.png" alt="Hospital São Matheus" /></div><p>${lado}</p></div><div class="auth-form">${form}</div></div>`;

const resposta = (id, titulo, texto) => `<div class="resposta" id="${id}"><div class="selo-ok">${ic("checkc", 32)}</div><h1>${titulo}</h1><p>${texto}</p></div>`;

const telaLogin = auth("t-login", LADO_LOGIN, `<div class="auth-caixa"><div class="auth-cab"><h1>Bem-vindo de volta</h1><p>Acesse a plataforma de gestão do hospital</p></div>

const telaEmail = `<div class="tela-cheia caixa-email" id="t-email"><div class="email"><div class="faixa"></div><div class="cab"><img src="assets/logo-hsm.png" alt="Hospital São Matheus" /><p>Segurança da Conta</p></div>

const URLS = ["app.hospitalsaomatheus.cloud/login", "app.hospitalsaomatheus.cloud/reset-password", "O seu email: Redefinir sua senha", "app.hospitalsaomatheus.cloud/reset-password/update"];
document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url">${URLS.map((u, i) => `<span id="url-${i + 1}">${u}</span>`).join("")}</div></div>

  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera). Nada se mede na montagem: o script
   roda antes de a fonte do app carregar. Alvo é função que o GSAP chama
   quando o tween começa, e o render só busca o primeiro quadro depois da fonte. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  /* A caixa do formulário fica no meio da altura por translateY(-50%), que o offset não vê. */
  const meio = document.getElementById(id).closest(".auth-caixa");
  if (meio) y -= meio.offsetHeight / 2;
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + y * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const alvo = (ids) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);

/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
/* Transição com rastro: a tela A sai para a esquerda, a B vem da direita, e o endereço troca. */
function passaTela(t, a, b, urlA, urlB) {
  tl.to(a, { x: -300, filter: "blur(24px)", opacity: 0, duration: 0.35, ease: "power2.in" }, t);
  tl.fromTo(b, { x: 300, filter: "blur(24px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, t + 0.2);
  tl.to(urlA, { opacity: 0, duration: 0.2 }, t + 0.1);
  tl.to(urlB, { opacity: 1, duration: 0.2 }, t + 0.2);
}
/* Troca de estado na mesma tela: o formulário dá lugar à resposta. */
function trocaEstado(t, a, b) {
  tl.to(a, { opacity: 0, duration: 0.2 }, t);
  tl.fromTo(b, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.15);
}

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.0);

/* Passo 1 (4 a 10): Esqueci minha senha, abaixo do campo Senha. */
const bLink = alvo("link-esqueci");
mira(4.4, 2.4, bLink, 1.5, 7.9);
marca(5.6, bLink, 7.6);
toca(6.0, bLink);
soltaDedo(7.6);
mira(7.9, 0.6, REPOUSO, 1.0, 8.9);
passaTela(8.0, "#t-login", "#t-pedido", "#url-1", "#url-2");
const bCabPedido = alvo("cab-pedido");
mira(8.9, 0.9, bCabPedido, 1.3, 10.0);

/* Passo 2 (10 a 17): o Email e Enviar link de redefinição. */
const bEmail = alvo("g-p-email");
mira(10.0, 1.4, bEmail, 1.45, 14.0);
toca(10.4, alvo("p-email"));
tl.to("#p-email-foco", { opacity: 1, duration: 0.15 }, 11.35);
tl.to("#p-email-vazio", { opacity: 0, duration: 0.15 }, 11.6);
tl.to("#p-email-cheio", { opacity: 1, duration: 0.8 }, 11.7);
soltaDedo(12.3);
marca(12.4, bEmail, 13.8);
const bEnviar = alvo("p-enviar");
mira(14.0, 1.0, bEnviar, 1.45, 17.0);
tl.to("#p-email-foco", { opacity: 0, duration: 0.15 }, 14.2);
toca(14.3, bEnviar);
tl.to("#p-enviar", { scale: 0.97, duration: 0.1 }, 15.25);
tl.to("#p-enviar", { scale: 1, duration: 0.1 }, 15.35);
tl.to("#p-enviar-tx", { opacity: 0, duration: 0.15 }, 15.4);
tl.to("#p-enviar-carregando", { opacity: 1, duration: 0.15 }, 15.45);
tl.to("#p-enviar", { opacity: 0.5, duration: 0.15 }, 15.45);
soltaDedo(15.8);
trocaEstado(16.4, "#pedido-1", "#pedido-2");

/* Passo 3 (17 a 25): Verifique seu email; no email, o botão do link. */
const bVerifique = alvo("verifique");
mira(17.0, 1.4, bVerifique, 1.4, 19.6);
marca(17.6, bVerifique, 19.4);
mira(19.6, 0.5, REPOUSO, 1.0, 20.6);
passaTela(20.0, "#t-pedido", "#t-email", "#url-2", "#url-3");
const bBotaoEmail = alvo("bt-email");
mira(20.6, 1.6, bBotaoEmail, 1.45, 25.0);
marca(21.6, bBotaoEmail, 23.2);
toca(22.4, bBotaoEmail);
tl.to("#bt-email", { scale: 0.97, duration: 0.1 }, 23.35);
tl.to("#bt-email", { scale: 1, duration: 0.1 }, 23.47);
soltaDedo(24.0);
passaTela(24.6, "#t-email", "#t-nova", "#url-3", "#url-4");

/* Passo 4 (25 a 33): Nova senha e Confirmar nova senha. */
const bCampos = alvo("g-n-senha g-n-confirma");
mira(25.2, 1.4, bCampos, 1.4, 33.0);
toca(26.2, alvo("n-senha"));
tl.to("#n-senha-foco", { opacity: 1, duration: 0.15 }, 27.15);
tl.to("#n-senha-vazio", { opacity: 0, duration: 0.15 }, 27.4);
tl.to("#n-senha-cheio", { opacity: 1, duration: 0.8 }, 27.5);
toca(28.6, alvo("n-confirma"), alvo("n-senha"));
tl.to("#n-senha-foco", { opacity: 0, duration: 0.15 }, 29.5);
tl.to("#n-confirma-foco", { opacity: 1, duration: 0.15 }, 29.55);
tl.to("#n-confirma-vazio", { opacity: 0, duration: 0.15 }, 29.8);
tl.to("#n-confirma-cheio", { opacity: 1, duration: 0.8 }, 29.9);
soltaDedo(30.8);
marca(30.9, bCampos, 32.8);

/* Passo 5 (33 a 40): Redefinir senha, e a confirmação. */
const bRedefinir = alvo("n-redefinir");
mira(33.0, 1.2, bRedefinir, 1.45, 36.2);
tl.to("#n-confirma-foco", { opacity: 0, duration: 0.15 }, 33.2);
toca(33.4, bRedefinir);
tl.to("#n-redefinir", { scale: 0.97, duration: 0.1 }, 34.35);
tl.to("#n-redefinir", { scale: 1, duration: 0.1 }, 34.45);
tl.to("#n-redefinir-tx", { opacity: 0, duration: 0.15 }, 34.5);
tl.to("#n-redefinir-carregando", { opacity: 1, duration: 0.15 }, 34.55);
tl.to("#n-redefinir", { opacity: 0.5, duration: 0.15 }, 34.55);
soltaDedo(34.9);
trocaEstado(35.6, "#nova-1", "#nova-2");
const bSucesso = alvo("sucesso");
mira(36.2, 1.4, bSucesso, 1.4, 40.0);
marca(37.0, bSucesso, 39.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 44 }, 0);
window.__timelines["main"] = tl;
</script>
</body>
</html>
