    </div>
  </div>
  <div class="marcada" id="l2-feita" style="display:none;background:#F8FAFC;border:1px solid #E2E8F0">
    <span class="etq" style="background:#F1F5F9;color:#475569">Não procede</span>Agulha hipodérmica 25 x 7<span class="cod" style="font-family:ui-monospace,Menlo,monospace;color:#2B2E7E;font-size:5.8px">70031245</span><span class="v">-R$ 4,70</span><span class="link" style="font-size:5.6px">Desfazer</span>
  </div>

  <div class="linha" id="l3">
    <div class="topo"><span class="etq" style="background:#FEF3C7;color:#92400E">Validar</span></div>
    <div class="nome">Diária de CTI adulto</div>
    <div class="txt">Validar, em 03/10</div>
    <div class="validar-msg" id="validar-msg">Você não precisa decidir: o item já foi para a validação<br><b>Em jogo: R$ 1.212,00</b></div>
  </div>

  <div class="rodape-guia">
    <div class="rot-num">Observação para a gestão de contas médicas</div>
    <div class="area">Opcional</div>
    <span class="bt bt-cheio" id="btn-concluir" style="margin-top:4px;padding:4px 8px">Concluir e abrir a próxima</span>
  </div>
  <div class="confirma" id="confirma"><p>3 itens sem marcação. Concluir assim mesmo?</p>
    <div class="acoes"><span style="border:1px solid #E2E8F0;color:#334155">Cancelar</span><span id="confirma-ok" style="background:#2563EB;color:#fff">OK</span></div></div>
  <div class="toast" id="toast-copiado">Código copiado</div>
  <div class="toast" id="toast-concluida">Conta concluída</div>`);

document.getElementById("palco-tarefa").innerHTML =
  `<div style="position:absolute;inset:0;background:#EEF1F6"></div>` +
  `<div class="janela" id="janela"><div class="barra"><i></i><i></i><i></i><div class="url">plataforma do hospital · contas médicas</div></div>` +
  `<div class="tela" id="tela-fila">${telaFila}</div>` +
  `<div class="tela" id="tela-guia" style="opacity:0">${telaGuia}</div></div>` +
  `<div class="rodape-v">Manual · retrata o app em v0.179.0 · gerado em 12/10/2026</div>` +
  `<div class="ghost" id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1"><div class="n">1</div><h3>Na Fila, clique em Abrir</h3><p>A conta <b>A fazer</b> abre o guia e passa para <b>Em correção</b>.</p></div>` +
  `<div class="passo" id="p2"><div class="n">2</div><h3>Leia os três números do topo</h3><p><b>Nota de entrada</b>, <b>R$ a ajustar</b> e <b>Itens feitos</b>. Abaixo, as linhas por dia e setor.</p></div>` +
  `<div class="passo" id="p3"><div class="n">3</div><h3>Copie o código, corrija no MV e clique em Feito</h3><p>A linha recolhe em verde e <b>Itens feitos</b> sobe.</p></div>` +
  `<div class="passo" id="p4"><div class="n">4</div><h3>Não cabe? Clique em Não procede</h3><p>Escolha o motivo e clique em <b>Confirmar</b>. Se o MV não deixou lançar, é <b>Bloqueado</b>.</p></div>` +
  `<div class="passo" id="p5"><div class="n">5</div><h3>A linha Validar não tem botão</h3><p>O item já foi para a gestão decidir. Você não precisa fazer nada nela.</p></div>` +
  `<div class="passo" id="p6"><div class="n">6</div><h3>Clique em Concluir e abrir a próxima</h3><p>Com linha sem marcação, o app pergunta antes. A próxima conta <b>A fazer</b> já abre.</p></div>`;

/* Marca de sobreposição permitida em tudo do palco: é uma réplica de tela. */
const PALCO = document.getElementById("palco-tarefa");
PALCO.querySelectorAll("*").forEach((el) => {
  el.setAttribute("data-layout-allow-overlap", "");
  el.setAttribute("data-layout-allow-occlusion", "");
  el.setAttribute("data-layout-allow-overflow", "");
});

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
const exibe = (sel, t) => tl.set(sel, { display: "block" }, t);
const exibeFlex = (sel, t) => tl.set(sel, { display: "flex" }, t);
const oculta = (sel, t) => tl.set(sel, { display: "none" }, t);

/* Ancoragem ao elemento: o marcador nasce dentro do alvo e o dedo lê a
   posição do alvo no palco (offset*, que ignora o scale(2)). */
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;
  const el = document.getElementById(idAlvo);
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 4 : 2.5;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* A tela muda de altura quando uma linha recolhe ou o motivo abre: a posição
   de cada alvo é medida no estado em que a tela estará quando o dedo chegar. */
function noEstado(estado, fn) {
  const antes = {};
  for (const [id, disp] of Object.entries(estado)) {
    const el = document.getElementById(id);
    antes[id] = el.style.display;
    el.style.display = disp;
  }
  const r = fn();
  for (const [id, disp] of Object.entries(antes)) document.getElementById(id).style.display = disp;
  return r;
}
const ESTADO = {
  inicio: {},
  motivo: { "l1-aberta": "none", "l1-feita": "flex", "fs-agulha": "block" },
  depois: { "l1-aberta": "none", "l1-feita": "flex", "l2-aberta": "none", "l2-feita": "flex" },
  depoisFeito: { "l1-aberta": "none", "l1-feita": "flex" },
};
function toca(t, para, de, estado, estadoDe) {
  const a = noEstado(ESTADO[estado || "inicio"], () => ponto(para));
  const b = de ? noEstado(ESTADO[estadoDe || estado || "inicio"], () => ponto(de)) : { x: a.x + 34, y: Math.min(a.y + 70, 480) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota("#p1", 4.90, 9.55);
nota("#p2", 9.90, 14.55);
nota("#p3", 14.90, 20.55);
nota("#p4", 20.90, 27.05);
nota("#p5", 27.40, 31.55);
nota("#p6", 31.90, 38.55);

/* passo 1: o Abrir da conta A fazer, e o guia abre */
toca(5.4, "fila-abrir");
esconde("#mk-fila-abrir", 7.6);
esconde("#tela-fila", 7.9);
mostra("#tela-guia", 8.0);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 8.0);

/* passo 2: os três números */
const mkNum = marcaEm("bl-numeros");
mostra(mkNum, 10.3);
esconde(mkNum, 13.8);

/* passo 3: o código copia, a correção vai no MV, e o Feito recolhe a linha */
toca(15.2, "cod-panto");
mostra("#toast-copiado", 16.3);
esconde("#toast-copiado", 17.6);
esconde("#mk-cod-panto", 16.8);
toca(17.4, "feito-panto", "cod-panto");
oculta("#l1-aberta", 18.6);
exibeFlex("#l1-feita", 18.6);
troca("#itens-feitos", "1 de 5", 18.7);

/* passo 4: Não procede, o motivo e o Confirmar */
toca(21.2, "np-agulha", "feito-panto", "depoisFeito", "inicio");
exibe("#fs-agulha", 22.35);
toca(23.0, "mt-regra", "np-agulha", "motivo", "depoisFeito");
mostra("#mt-regra-ponto", 24.1);
esconde("#mk-np-agulha", 23.0);
esconde("#mk-mt-regra", 24.7);
toca(24.7, "conf-agulha", "mt-regra", "motivo");
oculta("#l2-aberta", 25.9);
exibeFlex("#l2-feita", 25.9);
troca("#itens-feitos", "2 de 5", 26.0);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 26.2);

/* passo 5: a linha Validar, sem botão */
const mkVal = marcaEm("validar-msg");
mostra(mkVal, 27.8);
esconde(mkVal, 31.2);

/* passo 6: Concluir, a pergunta e a próxima */
toca(32.2, "btn-concluir", null, "depois");
mostra("#confirma", 33.4);
esconde("#mk-btn-concluir", 33.4);
toca(34.4, "confirma-ok", "btn-concluir", "depois");
esconde("#confirma", 35.6);
mostra("#toast-concluida", 35.8);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 35.7);

/* 3 · Fecho */
surge("#fc-titulo", 39.30, 18);
surge("#fc-carimbo", 39.80, 14);
surge("#fc-org", 40.20, 12);

window.__timelines.main = tl;
</script>
