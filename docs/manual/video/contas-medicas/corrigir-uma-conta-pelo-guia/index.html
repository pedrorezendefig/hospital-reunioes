/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera e a rolagem). Nada se mede na
   montagem: o script roda antes de a fonte do app carregar. Cada alvo é uma
   função que o GSAP chama quando o tween começa. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noApp(id) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x, y, w, h };
}
const valor = (v) => (typeof v === "function" ? v() : v);
function noQuadro(id, rolagem) { const r = noApp(id); return { x: APP_X + r.x * ESCALA_APP, y: APP_Y + (r.y - valor(rolagem)) * ESCALA_APP, w: r.w * ESCALA_APP, h: r.h * ESCALA_APP }; }
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, rolagem))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
/* Rolagem que põe o elemento a 24 px do topo do corpo, sem passar do fim da página. */
const ALTURA_CORPO = 579.2;
const rolagemAte = (id, pagina) => () => Math.max(0, Math.min(noApp(id).y - 64 - 24, document.getElementById(pagina).offsetHeight - ALTURA_CORPO));
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const troca = (sai, entra, t) => { tl.set(sai, { opacity: 0 }, t); tl.set(entra, { opacity: 1 }, t); };
const rola = (rolo, r, t) => tl.to(rolo, { y: () => -valor(r), duration: 0.8, ease: "power2.inOut" }, t);
const avisa = (id, t, ate) => { tl.to(id, { opacity: 1, duration: 0.3, ease: "power2.out" }, t); tl.to(id, { opacity: 0, duration: 0.3 }, ate); };

/* A janela entra com um rastro curto, saindo do branco da abertura. */

/* Passo 1 (4 a 10): a Fila e o Abrir. */

const bAbrir = alvo("bt-abrir", () => Math.max(0, valor(ROLA_FILA) - 40));

marca(6.0, bAbrir, 8.0);
toca(6.1, bAbrir);
soltaDedo(7.7);
/* Transição com rastro: a Fila sai pela esquerda e o guia entra pela direita. */
tl.fromTo("#tela-contas", { x: 0, opacity: 1, filter: "blur(0px)" }, { x: -240, opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power2.in" }, 8.3);

/* Passo 2 (10 a 16): os três números do topo. */
const bNums = alvo("g0-nums");
mira(10.2, 2.2, bNums, 1.35, 16.0);
marca(11.0, bNums, 15.6);

/* Passo 3 (16 a 25): copiar o código e marcar Feito. */
const bCod = alvo("g0-panto-cod");
mira(16.0, 1.8, alvo("g0-panto"), 1.4, 19.2);
toca(16.8, bCod);
avisa("#av-copiado", 17.9, 19.9);
const bFeito = alvo("g0-panto-feito");
toca(19.6, bFeito, bCod);
troca("#g0", "#g1", 20.65);
soltaDedo(21.0);
mira(20.4, 1.6, alvo("g1-panto g1-nums"), 1.25, 25.0);
marca(21.6, alvo("g1-panto"), 24.6);

/* Passo 4 (25 a 34): Não procede, o motivo e Confirmar. */
const ROLA_AGULHA = rolagemAte("g2-agulha", "g2");
rola("#rolo-g", ROLA_AGULHA, 25.0);
const bNp = alvo("g1-agulha-np", ROLA_AGULHA);
mira(25.0, 1.8, alvo("g1-agulha", ROLA_AGULHA), 1.25, 26.8);
toca(25.9, bNp);
troca("#g1", "#g2", 26.95);
mira(26.8, 1.6, alvo("g2-agulha", ROLA_AGULHA), 1.2, 33.8);
const bRegra = alvo("g2-regra-outra", ROLA_AGULHA);
toca(28.2, bRegra, bNp);
troca("#g2", "#g3", 29.25);

toca(30.4, bConfirmar, bRegra);
troca("#g3", "#g4", 31.45);
soltaDedo(31.8);
marca(32.0, alvo("g4-agulha", ROLA_AGULHA), 33.6);
