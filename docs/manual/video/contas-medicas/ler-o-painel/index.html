    <div class="mi">${ic("megafone", 18, 1.5)}Ouvidoria</div><div class="mi on">${ic("recibo", 18, 2)}Contas médicas</div><div class="mi">${ic("escudo", 18, 1.5)}Admin</div><div class="mi" style="margin-top:8px">${ic("ajuda", 18, 1.5)}Ajuda</div></nav></div>
  <div class="topo"><div class="busca">${ic("lupa", 16)}Buscar...</div><div class="quem"><div class="sino">${ic("sino", 22, 1.75)}<span class="n">1</span></div><div class="divisor"></div>

/* Tela Contas médicas (app/contas-medicas/page.tsx), com a fila da Marta vazia. */
const telaContas = `<div class="rolo"><div class="pagina">
  <div><div class="ap-cabeca"><h1>Contas médicas</h1><span class="atalho" id="bt-painel">${ic("grafico", 16)}Painel</span><span class="atalho">${ic("checks", 16)}Validação</span><span class="atalho">${ic("prancheta", 16)}Coordenação<span class="n">2</span></span><span class="atalho">${ic("contrato", 16)}Contratos</span><span class="atalho">${ic("predio", 16)}Operadoras</span></div>
    <p class="dek">Envie a conta e o prontuário do MV e receba a lista do que corrigir antes de mandar para a operadora.</p></div>

/* Tela Painel (painel/page.tsx e os cartões e blocos de components/contas-medicas/painel).
   O Painel relê os números quando o filtro muda: cada filtro é um quadro inteiro
   e a troca entre eles é instantânea, como no app. */
const moldura = (id, titulo, sub, corpo) => `<section class="ap-cartao pn-moldura" ${id ? `id="${id}"` : ""}><h2>${titulo}</h2>${sub ? `<p class="st">${sub}</p>` : ""}<div class="cont">${corpo}</div></section>`;
const cartao = (titulo, num, apoio, id) => moldura(id, titulo, "", `<p class="pn-num">${num}</p><p class="pn-apoio">${apoio}</p>`);
const NOTAS = [86, 89, 94, 93, 93, 96, 96, 92.5];
const grafico = () => { const x = (i) => 46 + i * 52, y = (n) => 8 + (100 - n) * 1.8, ds = ["17/08", "24/08", "31/08", "07/09", "14/09", "21/09", "28/09", "05/10"];
  return `<svg class="grafico" viewBox="0 0 432 220">${[0, 25, 50, 75, 100].map((n) => `<line class="grade" x1="40" x2="430" y1="${y(n)}" y2="${y(n)}"/><text x="30" y="${y(n) + 4}" text-anchor="end">${n}</text>`).join("")}
    <polyline class="curva" points="${NOTAS.map((n, i) => `${x(i)},${y(n)}`).join(" ")}"/>${NOTAS.map((n, i) => `<circle class="ponto" cx="${x(i)}" cy="${y(n)}" r="3"/><text x="${x(i)}" y="214" text-anchor="middle">${ds[i]}</text>`).join("")}</svg>`; };
const causa = (nm, qm, pc, rs) => `<div><div class="causa-l"><span class="nm">${nm}</span><span class="qm">${qm}</span><span class="pc">${pc.toLocaleString("pt-BR", { minimumFractionDigits: 1 })}%</span><span class="rs">R$ ${rs}</span></div><div class="trilho"><b style="width:${pc}%"></b></div></div>`;
const item = (cd, nm, n, rs) => `<tr><td class="cd">${cd}</td><td>${nm}</td><td class="r pr">${n}</td><td class="r ap">R$ ${rs}</td></tr>`;
const prod = (nm, c, p, inc, np, ret) => `<tr><td>${nm}</td><td class="r pr">${c}</td><td class="r ap">${p}</td><td class="r pr">R$ ${inc}</td><td class="r ap">${np}</td><td class="r ap4">R$ ${ret}</td></tr>`;
const blocos = (p) => `<div class="pn-blocos">
  ${moldura("", "Nota média por semana", "De segunda a domingo, pelo dia em que a conta foi concluída", grafico())}
  ${moldura(`${p}-causa`, "R$ apontado por causa-raiz", "Onde o problema nasce e quem corrige", `<div class="causas">${causa("Dispensação", "farmácia e enfermagem", 10.3, "159,25")}${causa("Regra automática", "TI e consultoria MV", 48.8, "756,00")}${causa("Cadastro e preço", "credenciamento e cadastro", 28.2, "437,00")}${causa("Registro assistencial", "enfermagem e corpo clínico", 8.1, "125,85")}${causa("Lançamento manual", "faturamento", 4.5, "70,40")}</div>`)}
  ${moldura(`${p}-itens`, "Os dez itens que mais faltam", "Fila de parametrização para a consultoria do MV", `<table class="tab"><tr><th>Código</th><th>Item</th><th class="r">Contas</th><th class="r">R$</th></tr>${item("90123456", "Pantoprazol 40 mg injetável", 2, "136,80")}${item("70081975", "Curativo com filme transparente", 2, "83,60")}${item("90187733", "Ondansetrona 4 mg injetável", 2, "19,70")}${item("70095001", "Cateter venoso central duplo lúmen", 1, "389,00")}${item("70044190", "Equipo de bomba de infusão", 1, "86,00")}${item("70072210", "Bolsa coletora de urina", 1, "32,40")}</table>`)}
  ${moldura(`${p}-prod`, "Produção por faturista", "", `<table class="tab"><tr><th>Faturista</th><th class="r">Contas</th><th class="r">Com pendência</th><th class="r">R$ incluído</th><th class="r">Não procede</th><th class="r ap4">R$ retirado</th></tr>${prod("Bianca Torres", 2, 1, "235,00", "0%", "143,00")}${prod("Caio Moreira", 1, 0, "118,40", "25%", "95,00")}${prod("Renata Lima", 1, 0, "78,25", "0%", "480,00")}</table>`)}
</div>`;
const opcao = (nome, sel, hover, id) => `<div ${id ? `id="${id}" ` : ""}class="${sel ? "sel" : ""}${hover ? " hover" : ""}"><span class="ck">${sel ? ic("check", 16, 3) : ""}</span>${nome}</div>`;
const filtros = (p, op, aberto) => `<div class="filtros" id="${p}-filtros">
  <div class="filtro"><span class="rot">Semana</span><div class="campo">05/10/2026<span class="cal">${ic("calendario", 16)}</span></div></div>
  <div class="filtro"><span class="rot">Operadora</span><div class="campo" id="${p}-op">${op}<span class="seta-c">${ic("baixo", 16)}</span>${aberto ? `<span class="campo-foco" id="${p}-op-foco"></span>` : ""}</div>
    ${aberto ? `<div class="lista-op" id="${p}-lista">${opcao("Todas", true)}${opcao("AURORA", false, true, `${p}-aurora`)}</div>` : ""}</div>
  <div class="filtro"><span class="rot">Tipo de conta</span><div class="campo">Todos<span class="seta-c">${ic("baixo", 16)}</span></div></div></div>`;
const painel = (p, op, n, visivel) => `<div class="pagina" id="${p}" style="opacity:${visivel ? 1 : 0}">
  <div><span class="volta">${ic("voltar", 16)}Contas médicas</span><h1>Painel</h1><p class="dek">A nota da semana e onde a perda da conta nasce, pelas contas concluídas de segunda a domingo.</p></div>
  ${filtros(p, op, p === "p0")}<p class="semana">Semana de 05/10 a 11/10/2026</p>
  <div class="pn-grade"><div class="pn-cartoes">${cartao("Nota média de entrada", n[0], `Semana anterior: ${n[1]}`, `${p}-c1`)}${cartao("Contas concluídas", n[2], "contas na semana", `${p}-c2`)}${cartao("R$ apontado", `R$ ${n[3]}`, `Já incluídos: R$ ${n[4]}`, `${p}-c3`)}${cartao("Não procede", n[5], n[6], `${p}-c4`)}${cartao("R$ incluído pela coordenação", "R$ 0,00", "0 lembretes incluídos")}</div>${blocos(p)}</div></div>`;
const telaPainel = `<div class="rolo" id="rolo-p">${painel("p0", "Todas", ["93,4", "95,5", 6, "1.874,30", "512,05", "4,2%", "1 de 24 linhas"], true)}${painel("p1", "AURORA", ["92,5", "95,5", 4, "1.548,50", "431,65", "5,9%", "1 de 17 linhas"])}</div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url">app.hospitalsaomatheus.cloud/contas-medicas</div></div>
    <div class="vista"><div class="app" id="app">${casca}<div class="corpo"><div class="tela-app" id="tela-contas">${telaContas}</div><div class="tela-app" id="tela-painel" style="opacity:0">${telaPainel}</div></div></div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera e a rolagem). Nada se mede na
   montagem: o script roda antes de a fonte do app carregar. Cada alvo é uma
   função que o GSAP chama quando o tween começa. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noApp(id) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x, y, w, h };
}
const valor = (v) => (typeof v === "function" ? v() : v);
function noQuadro(id, rolagem) { const r = noApp(id); return { x: APP_X + r.x * ESCALA_APP, y: APP_Y + (r.y - valor(rolagem)) * ESCALA_APP, w: r.w * ESCALA_APP, h: r.h * ESCALA_APP }; }
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, rolagem))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
/* Rolagem que põe o bloco a 24 px do topo do corpo, sem passar do fim da página. */
const ALTURA_CORPO = 579.2;
const rolagemAte = (id) => () => Math.min(noApp(id).y - 64 - 24, document.getElementById("p1").offsetHeight - ALTURA_CORPO);
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const troca = (sai, entra, t) => { tl.set(sai, { opacity: 0 }, t); tl.set(entra, { opacity: 1 }, t); };
const rola = (r, t) => tl.to("#rolo-p", { y: () => -valor(r), duration: 0.8, ease: "power2.inOut" }, t);

/* A janela entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.0);

/* Passo 1 (4 a 10): o botão Painel. */
const bPainel = alvo("bt-painel");
mira(4.4, 2.6, bPainel, 1.45, 8.3);
marca(6.0, bPainel, 8.0);
toca(6.1, bPainel);
soltaDedo(7.7);
/* Transição com rastro: Contas médicas sai pela esquerda e o Painel entra pela direita. */
tl.fromTo("#tela-contas", { x: 0, opacity: 1, filter: "blur(0px)" }, { x: -240, opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power2.in" }, 8.3);
tl.fromTo("#tela-painel", { x: 240, opacity: 0, filter: "blur(20px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out", immediateRender: false }, 8.5);
mira(8.3, 1.4, REPOUSO, 1.0, 10.2);

/* Passo 2 (10 a 17): os filtros; a Operadora vira AURORA e os números mudam. */
const bFiltros = alvo("p0-filtros");
mira(10.2, 2.0, bFiltros, 1.3, 12.6);
marca(10.8, bFiltros, 12.4);
const bOp = alvo("p0-op");
toca(12.6, bOp);
tl.to("#p0-op-foco", { opacity: 1, duration: 0.1 }, 13.55);
tl.to("#p0-lista", { opacity: 1, duration: 0.2 }, 13.6);
mira(12.6, 1.6, alvo("p0-op p0-lista"), 1.4, 15.2);
toca(14.1, alvo("p0-aurora"), bOp);
troca("#p0", "#p1", 15.1);
soltaDedo(15.4);
mira(15.2, 1.8, alvo("p1-c1 p1-c2 p1-c3 p1-c4"), 1.2, 17.2);

/* Passo 3 (17 a 23): os cartões do topo. */
const bCartoes = alvo("p1-c1 p1-c2 p1-c3 p1-c4");
mira(17.2, 2.0, bCartoes, 1.3, 23.0);
marca(17.6, bCartoes, 22.6);

/* Passo 4 (23 a 30): a causa-raiz. */
const ROLA_CAUSA = rolagemAte("p1-causa");
rola(ROLA_CAUSA, 23.0);
const bCausa = alvo("p1-causa", ROLA_CAUSA);
mira(23.0, 2.2, bCausa, 1.3, 30.0);
marca(24.4, bCausa, 29.6);

/* Passo 5 (30 a 36): os dez itens que mais faltam. */
const ROLA_ITENS = rolagemAte("p1-itens");
rola(ROLA_ITENS, 30.0);
const bItens = alvo("p1-itens", ROLA_ITENS);
mira(30.0, 2.2, bItens, 1.3, 36.0);
marca(31.2, bItens, 35.6);

/* Passo 6 (36 a 42): a produção por faturista. */
const bProd = alvo("p1-prod", ROLA_ITENS);
mira(36.0, 2.2, bProd, 1.3, 42.0);
marca(37.2, bProd, 41.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 46 }, 0);
window.__timelines["main"] = tl;
</script>
