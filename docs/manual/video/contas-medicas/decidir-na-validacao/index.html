  `<div class="passo" id="p4"><div class="n">4</div><h3>Código bloqueado: Enviar ao cadastro</h3><p>A lista para o cadastro do MV é baixada. <b>Descartar</b> fecha sem ação.</p></div>` +
  `<div class="passo" id="p5"><div class="n">5</div><h3>Observação do time: leia a Leitura da IA</h3><p>Escolha <b>Manter a regra</b>, <b>Editar a regra</b> ou <b>Responder ao time</b>. A faturista vê a resposta no guia.</p></div>` +
  `<div class="passo" id="p6"><div class="n">6</div><h3>Termo do dicionário: Confirmar ou Rejeitar</h3><p>Cada decisão tira o tema da fila. Fila vazia: <b>Nada aguardando decisão.</b></p></div>`;

/* Marca de sobreposição permitida em tudo do palco: é uma réplica de tela. */
const PALCO = document.getElementById("palco-tarefa");
PALCO.querySelectorAll("*").forEach((el) => {
  el.setAttribute("data-layout-allow-overlap", "");
  el.setAttribute("data-layout-allow-occlusion", "");
  el.setAttribute("data-layout-allow-overflow", "");
});

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
const exibe = (sel, t) => tl.set(sel, { display: "block" }, t);
const exibeFlex = (sel, t) => tl.set(sel, { display: "flex" }, t);
const oculta = (sel, t) => tl.set(sel, { display: "none" }, t);
/* O cartão decidido apaga e sai da fila: o de baixo sobe para o lugar dele. */
const decide = (sel, t) => { tl.to(sel, { opacity: 0, duration: 0.35 }, t); oculta(sel, t + 0.4); };

/* Ancoragem ao elemento: o marcador nasce dentro do alvo e o dedo lê a
   posição do alvo no palco (offset*, que ignora o scale(2)). */
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;
  const el = document.getElementById(idAlvo);
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 4 : 2.5;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* A fila muda de altura quando um formulário abre ou um cartão sai: a
   posição de cada alvo é medida no estado em que a tela estará quando o dedo
   chegar. */
function noEstado(estado, fn) {
  const antes = {};
  for (const [id, disp] of Object.entries(estado)) {
    const el = document.getElementById(id);
    antes[id] = el.style.display;
    el.style.display = disp;
  }
  const r = fn();
  for (const [id, disp] of Object.entries(antes)) document.getElementById(id).style.display = disp;
  return r;
}
const ESTADO = {
  inicio: {},
  regraAberta: { "bts-regra": "none", "fm-regra": "block" },
  semRegra: { "t-regra": "none" },
  semBloq: { "t-regra": "none", "t-bloq": "none" },
  obsAberta: { "t-regra": "none", "t-bloq": "none", "bts-obs": "none", "fm-obs": "block" },
  soTermo: { "t-regra": "none", "t-bloq": "none", "t-obs": "none" },
};
function toca(t, para, de, estado, estadoDe) {
  const a = noEstado(ESTADO[estado || "inicio"], () => ponto(para));
  const b = de ? noEstado(ESTADO[estadoDe || estado || "inicio"], () => ponto(de)) : { x: a.x + 34, y: Math.min(a.y + 70, 480) };
  const mk = noEstado(ESTADO[estado || "inicio"], () => marcaEm(para));
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota("#p1", 4.90, 9.55);
nota("#p2", 9.90, 14.55);
nota("#p3", 14.90, 22.55);
nota("#p4", 22.90, 27.55);
nota("#p5", 27.90, 35.05);
nota("#p6", 35.40, 40.55);

/* passo 1: o botão Validação, e a fila abre */
toca(5.4, "bt-validacao");
esconde("#mk-bt-validacao", 7.6);
esconde("#tela-contas", 7.9);
mostra("#tela-validacao", 8.0);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 8.0);

/* passo 2: os três números */
const mkNum = marcaEm("bl-numeros");
mostra(mkNum, 10.3);
esconde(mkNum, 13.8);

/* passo 3: Validar regra, o texto aberto e o Confirmar e validar */
toca(15.3, "bt-validar");
esconde("#mk-bt-validar", 16.5);
oculta("#bts-regra", 16.45);
exibe("#fm-regra", 16.45);
toca(17.6, "bt-confirmar", "bt-validar", "regraAberta", "inicio");
esconde("#mk-bt-confirmar", 18.9);
decide("#t-regra", 19.1);
troca("#n-aguardando", "3", 19.6);
troca("#n-contas", "1", 19.6);
troca("#n-valor", "R$ 389,00", 19.6);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 20.4);

/* passo 4: Enviar ao cadastro baixa a lista e o tema sai */
toca(23.3, "bt-cadastro", null, "semRegra");
esconde("#mk-bt-cadastro", 24.5);
mostra("#baixado", 24.5);
decide("#t-bloq", 24.9);
troca("#n-aguardando", "2", 25.4);
troca("#n-valor", "R$ 0,00", 25.4);
esconde("#baixado", 26.6);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 26.4);

/* passo 5: a leitura da IA, Responder ao time e Enviar resposta */
const mkLeitura = noEstado(ESTADO.semBloq, () => marcaEm("leitura"));
mostra(mkLeitura, 28.2);
esconde(mkLeitura, 29.8);
toca(29.9, "bt-responder", null, "semBloq");
esconde("#mk-bt-responder", 31.1);
oculta("#bts-obs", 31.05);
exibe("#fm-obs", 31.05);
tl.set("#resposta", { innerText: "Vale só para a prescrição de horário fixo. A dose de resgate entra se tiver registro." }, 31.6);
toca(32.4, "bt-enviar", "bt-responder", "obsAberta", "semBloq");
esconde("#mk-bt-enviar", 33.6);
decide("#t-obs", 33.8);
troca("#n-aguardando", "1", 34.3);
troca("#n-contas", "0", 34.3);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 34.6);

/* passo 6: Confirmar o termo e a fila vazia */
toca(36.0, "bt-termo", null, "soTermo");
esconde("#mk-bt-termo", 37.2);
decide("#t-termo", 37.4);
troca("#n-aguardando", "0", 37.9);
exibe("#vazio", 37.85);
mostra("#vazio", 37.9);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 38.2);

/* 3 · Fecho */
surge("#fc-titulo", 41.30, 18);
surge("#fc-carimbo", 41.80, 14);
surge("#fc-org", 42.20, 12);

window.__timelines.main = tl;
</script>
</body>
</html>
