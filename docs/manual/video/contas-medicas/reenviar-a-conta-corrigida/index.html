  <div id="slot-carimbo" data-composition-id="carimbo" data-composition-src="compositions/carimbo.html"
    data-variable-values='{"titulo":"Reenviar a conta corrigida","carimbo":"Manual · retrata o app em v0.196.1 · gerado em 14/10/2026"}'
    data-start="43" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
</div>

<script>
/* Ícones: os do lucide, os mesmos do app, no traço da cor do texto. */
const P = {
  alvo: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>', painel: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  calendario: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>',
  relogio: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', baixo: '<path d="m6 9 6 6 6-6"/>', direita: '<path d="m9 18 6-6-6-6"/>',
  megafone: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>', recibo: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/>',
  escudo: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  ajuda: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>', lupa: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  sino: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.41 5.956-2.738 7.326"/>',
  grafico: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  subir: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>', voltar: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  copiar: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  arquivo: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  carrega: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
};
const ic = (nome, s, traco) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${traco || 2}" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${P[nome]}</svg>`;

/* A casca do app (barra lateral e topo), como a Renata vê: AppShell, Sidebar e Header do frontend. */
const casca = `<div class="lado"><div class="marca"><img src="assets/logo-hsm.png" alt="Hospital São Matheus" /></div><nav>
    <div class="mi">${ic("alvo", 18, 1.5)}Reuniões e metas<span class="fim">${ic("baixo", 16)}</span></div>
    <div class="sub"><div class="mi">${ic("painel", 16, 1.5)}Dashboard</div><div class="mi">${ic("calendario", 16, 1.5)}Calendário</div><div class="mi">${ic("relogio", 16, 1.5)}Pendências<span class="fim">${ic("direita", 16)}</span></div></div>
    <div class="mi">${ic("megafone", 18, 1.5)}Ouvidoria</div><div class="mi on">${ic("recibo", 18, 2)}Contas médicas</div><div class="mi">${ic("escudo", 18, 1.5)}Admin</div><div class="mi" style="margin-top:8px">${ic("ajuda", 18, 1.5)}Ajuda</div></nav></div>
  <div class="topo"><div class="busca">${ic("lupa", 16)}Buscar...</div><div class="quem"><div class="sino">${ic("sino", 22, 1.75)}</div><div class="divisor"></div>
    <div class="pessoa"><div class="tx"><b>renata.lima</b><span>renata.lima@exemplo.local</span></div><div class="avatar">R<span class="seta">${ic("baixo", 12)}</span></div></div></div></div>`;

/* Tela Contas médicas (app/contas-medicas/page.tsx). Cada estado (aba Fila,
   aba Concluídas, depois do envio) é um quadro inteiro, trocado de uma vez. */
const linha = (at, comp, sit, cls, det, acao, id) => `<li class="fila-l" style="list-style:none"><div class="q"><b>Atendimento ${at}</b><span>${comp}</span></div><span class="sit ${cls}">${sit}</span>${det ? `<span class="det">${det}</span>` : ""}${acao ? `<span class="acao" ${id ? `id="${id}"` : ""}>${acao}</span>` : ""}</li>`;
const FILA = linha("900398", "conta 51190 · 28/09 a 02/10", "Em correção", "corr", "Nota 99, R$ 82,95, 2 de 3", "Continuar") + linha("900412", "conta 51230 · 03/10 a 08/10", "A fazer", "fazer", "Nota 97, R$ 73,10, 0 de 2", "Abrir") + linha("900431", "conta 51302 · 05/10 a 09/10", "Falta o prontuário", "cinza", "", "");
const soltar = (p) => `<div class="soltar" id="${p}-soltar"><div class="ic">${ic("subir", 32)}</div><p class="t1">Arraste aqui a conta e o prontuário do MV</p><p class="t2">Vários de uma vez, sem renomear: o app lê o tipo e o atendimento dentro de cada PDF. Até 10 atendimentos e 30 arquivos por envio, 100 MB por arquivo.</p><span class="bt cheio grande">Selecionar arquivos</span>
  <span class="soltar-on" id="${p}-on"></span><span class="enviando" id="${p}-enviando" style="background:var(--color-white);border-radius:var(--radius-2xl)">${ic("carrega", 16)}Enviando 2 arquivos e lendo cada PDF</span></div>`;
const contas = (p, aba, lista, ultimo, visivel) => `<div class="pagina" id="${p}" style="opacity:${visivel ? 1 : 0}">
  <div><div class="ap-cabeca"><h1>Contas médicas</h1><span class="atalho">${ic("grafico", 16)}Painel</span></div>
    <p class="dek">Envie a conta e o prontuário do MV e receba a lista do que corrigir antes de mandar para a operadora.</p></div>
  ${soltar(p)}${ultimo || ""}<div><div class="abas"><span class="aba${aba === "fila" ? " on" : ""}">Fila (3)</span><span class="aba${aba === "fila" ? "" : " on"}" id="${p}-aba-conc">Concluídas (2)</span></div><ul class="ap-cartao fila" id="${p}-lista">${lista}</ul></div></div>`;
const CONCLUIDAS = linha("900355", "conta 51102 · 20/09 a 26/09", "Concluída", "ok", "Nota 85, 1 pendência", "Abrir", "c1-abrir") + linha("900340", "conta 51077 · 13/09 a 19/09", "Concluída", "ok", "Nota 91", "Abrir");
const ULTIMO = `<section class="ap-cartao ultimo" id="c3-ultimo"><h2>Último envio</h2><ul><li>900355, reenvio da conta 51102: 2 corrigidas no MV, 1 ainda na conta, nota de saída 92</li><li>900340, reenvio da conta 51077: 3 corrigidas no MV, 0 ainda na conta, nota de saída 100</li></ul></section>`;
const telaContas = `<div class="rolo" id="rolo-c">${contas("c0", "fila", FILA, "", true)}${contas("c1", "conc", CONCLUIDAS)}${contas("c2", "fila", FILA)}${contas("c3", "fila", FILA, ULTIMO)}</div>`;

/* O guia da conta concluída (guia/[contaId]/page.tsx e LinhaDoGuia.tsx), antes e depois do reenvio. */
const cod = (c) => `<span class="cod">${c}${ic("copiar", 12)}</span>`;
const marca2 = (p, k, rot, cls, nome, c, v, reenvio) => `<article class="gm ${cls}" id="${p}-${k}"><span class="etq ${cls === "bloq" ? "amb" : "verde"}">${rot}</span>${reenvio ? `<span class="etq ${reenvio === "corrigida no MV" ? "verde" : "verm"}">${reenvio}</span>` : ""}<span class="nm">${nome}</span>${cod(c)}<span class="v">${v}</span></article>`;
const grupo = (rot, linhas) => `<section class="grupo"><div class="grupo-cab"><h2 class="rotulo">${rot}</h2></div>${linhas}</section>`;
const guia = (p, depois, visivel) => `<div class="pagina guia" id="${p}" style="opacity:${visivel ? 1 : 0}">
  <div><span class="volta" id="${p}-volta">${ic("voltar", 16)}Contas médicas</span><header class="g-cab"><div class="g-tit"><h1>Atendimento 900355</h1><span class="etq sit-ok">Concluída</span></div><p class="dek">Lia F. · conta 51102 · AURORA · coluna Comum · parcial de 20/09 a 26/09</p></header></div>
  <section class="g-nums"><div class="ap-cartao g-notas" id="${p}-notas"><div><p class="rotulo">Nota de entrada</p><p class="g-val">85</p></div>${depois ? `<div><p class="rotulo">Nota de saída</p><p class="g-val">92</p></div>` : ""}</div><div class="ap-cartao"><p class="rotulo">R$ a ajustar</p><p class="g-val">R$ 947,25</p><p class="g-apoio">em 4 itens</p></div><div class="ap-cartao"><p class="rotulo">Itens feitos</p><p class="g-val">4 de 4</p></div></section>
  <div id="${p}-linhas" style="display:flex;flex-direction:column;gap:20px">${grupo("22/09 · POSTO 3", marca2(p, "cateter", "Bloqueado", "bloq", "Cateter venoso central duplo lúmen", "70095001", "+R$ 389,00"))}
  <div id="${p}-feitas" style="display:flex;flex-direction:column;gap:20px">  ${grupo("23/09 · CTI ADULTO", marca2(p, "panto", "Feito", "feito", "Pantoprazol 40 mg injetável", "90123456", "+R$ 68,40", depois && "corrigida no MV"))}
  ${grupo("24/09 · CENTRO CIRURGICO", marca2(p, "ondan", "Feito", "feito", "Ondansetrona 4 mg injetável", "90187733", "+R$ 9,85", depois && "corrigida no MV"))}
  ${grupo("25/09 · POSTO 3", marca2(p, "diaria", "Feito", "feito", "Diária de enfermaria", "60000600", "-R$ 480,00", depois && "ainda na conta"))}</div></div>
  <footer class="ap-cartao g-rod2" id="${p}-rodape"><p class="msg">Conta concluída. As marcações não mudam mais.</p><span class="reenviar" id="${p}-reenviar">${ic("subir", 16)}Reenviar conta corrigida</span>${depois ? `<p class="resultado" id="${p}-resultado">2 corrigidas no MV, 1 ainda na conta, nota de saída 92</p>` : ""}<p class="ajuda">Opcional. Depois de corrigir no MV, envie só o PDF da conta para ver se a correção pegou. A conta já está na sua produção.</p></footer></div>`;
const telaGuia = `<div class="rolo" id="rolo-g">${guia("r0", false, true)}${guia("r1", true)}</div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url">app.hospitalsaomatheus.cloud/contas-medicas</div></div>
    <div class="vista"><div class="app" id="app">${casca}<div class="corpo"><div class="tela-app" id="tela-contas">${telaContas}</div><div class="tela-app" id="tela-guia" style="opacity:0">${telaGuia}</div></div></div></div></div>
  <div class="arraste" id="arraste"><span class="ic">${ic("arquivo", 24)}</span>conta-51102.pdf<span class="qtd">2</span></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera e a rolagem). Nada se mede na
   montagem: o script roda antes de a fonte do app carregar. Cada alvo é uma
   função que o GSAP chama quando o tween começa. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noApp(id) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x, y, w, h };
}
const valor = (v) => (typeof v === "function" ? v() : v);
function noQuadro(id, rolagem) { const r = noApp(id); return { x: APP_X + r.x * ESCALA_APP, y: APP_Y + (r.y - valor(rolagem)) * ESCALA_APP, w: r.w * ESCALA_APP, h: r.h * ESCALA_APP }; }
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, rolagem))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
/* Rolagem que põe o elemento a 24 px do topo do corpo, sem passar do fim da página. */
const ALTURA_CORPO = 579.2;
const rolagemAte = (id, pagina) => () => Math.max(0, Math.min(noApp(id).y - 64 - 24, document.getElementById(pagina).offsetHeight - ALTURA_CORPO));
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const troca = (sai, entra, t) => { tl.set(sai, { opacity: 0 }, t); tl.set(entra, { opacity: 1 }, t); };
const rola = (rolo, r, t) => tl.to(rolo, { y: () => -valor(r), duration: 0.8, ease: "power2.inOut" }, t);

/* A janela entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.0);

/* Passo 1 (4 a 9): a exportação é no MV; a câmera aproxima da área de envio. */
mira(4.4, 2.6, alvo("c0-soltar"), 1.15, 9.0);

/* Passo 2 (9 a 16): a aba Concluídas e o Abrir. */
const ROLA_ABAS = rolagemAte("c0-aba-conc", "c0");
rola("#rolo-c", ROLA_ABAS, 9.0);
const bAba = alvo("c0-aba-conc", ROLA_ABAS);
mira(9.0, 1.8, bAba, 1.4, 10.8);
toca(9.8, bAba);
troca("#c0", "#c1", 10.85);
const bAbrir = alvo("c1-abrir", ROLA_ABAS);
mira(10.8, 1.6, alvo("c1-lista", ROLA_ABAS), 1.35, 13.3);
marca(11.6, alvo("c1-lista", ROLA_ABAS), 12.6);
toca(12.0, bAbrir, bAba);
soltaDedo(13.1);
/* Transição com rastro: Contas médicas sai pela esquerda e o guia entra pela direita. */
tl.fromTo("#tela-contas", { x: 0, opacity: 1, filter: "blur(0px)" }, { x: -240, opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power2.in" }, 13.3);
tl.fromTo("#tela-guia", { x: 240, opacity: 0, filter: "blur(20px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out", immediateRender: false }, 13.5);
mira(13.3, 1.4, REPOUSO, 1.0, 16.0);

/* Passo 3 (16 a 24): Reenviar conta corrigida, no rodapé. */
const ROLA_RODAPE = rolagemAte("r1-rodape", "r1");
rola("#rolo-g", ROLA_RODAPE, 16.0);
const bReenviar = alvo("r0-reenviar", ROLA_RODAPE);
mira(16.2, 2.0, bReenviar, 1.45, 21.0);
marca(17.6, bReenviar, 19.4);
toca(18.0, bReenviar);
soltaDedo(19.6);
troca("#r0", "#r1", 21.0);
mira(21.0, 1.6, alvo("r1-rodape", ROLA_RODAPE), 1.3, 24.0);
marca(21.8, alvo("r1-resultado", ROLA_RODAPE), 23.8);

/* Passo 4 (24 a 32): a nota de saída e as marcas nas linhas. */
rola("#rolo-g", 0, 24.0);
const bNotas = alvo("r1-notas");
mira(24.0, 1.8, bNotas, 1.35, 27.4);
marca(25.0, bNotas, 27.2);
const bLinhas = alvo("r1-feitas");
mira(27.4, 1.6, bLinhas, 1.25, 32.0);
marca(28.2, bLinhas, 31.6);

/* Passo 5 (32 a 43): várias contas, arrastadas para a área de envio. */
const bVolta = alvo("r1-volta");
toca(31.9, bVolta);
soltaDedo(32.9);
troca("#c1", "#c2", 32.9);
tl.set("#rolo-c", { y: 0 }, 32.9);
tl.to("#tela-guia", { x: 240, opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power2.in" }, 32.9);
tl.to("#tela-contas", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 33.1);
const bSoltar = alvo("c2-soltar");
mira(33.1, 1.6, bSoltar, 1.2, 38.4);
tl.set("#arraste", { x: () => centro(bSoltar).x + 380, y: () => centro(bSoltar).y + 330 }, 34.3);
tl.to("#arraste", { opacity: 1, duration: 0.25 }, 34.4);
tl.to("#arraste", { x: () => centro(bSoltar).x - 110, y: () => centro(bSoltar).y + 20, duration: 1.4, ease: "power2.inOut" }, 34.6);
tl.to("#c2-on", { opacity: 1, duration: 0.2 }, 35.6);
tl.to("#arraste", { opacity: 0, duration: 0.2 }, 36.1);
tl.to("#c2-on", { opacity: 0, duration: 0.2 }, 36.2);
tl.to("#c2-enviando", { opacity: 1, duration: 0.2 }, 36.2);
troca("#c2", "#c3", 37.6);
const bUltimo = alvo("c3-ultimo");
mira(38.4, 1.8, bUltimo, 1.3, 43.0);
marca(39.2, bUltimo, 42.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 47 }, 0);
window.__timelines["main"] = tl;
</script>
