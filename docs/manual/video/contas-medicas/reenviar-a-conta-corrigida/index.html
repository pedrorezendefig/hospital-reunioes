document.getElementById("palco-tarefa").innerHTML =
  `<div style="position:absolute;inset:0;background:#EEF1F6"></div>` +
  `<div class="janela" id="janela"><div class="barra"><i></i><i></i><i></i><div class="url">plataforma do hospital · contas médicas</div></div>` +
  `<div class="tela" id="tela-contas">${telaContas}</div>` +
  `<div class="tela" id="tela-guia" style="opacity:0">${telaGuia}</div></div>` +
  `<div class="arquivo" id="arquivo"><div class="doc">PDF</div><div><b>conta-900355.pdf</b><span>Fatura Individual, corrigida no MV</span></div></div>` +
  `<div class="rodape-v">Manual · retrata o app em v0.193.0 · gerado em 13/10/2026</div>` +
  `<div class="ghost" id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1"><div class="n">1</div><h3>Exporte do MV só a conta corrigida</h3><p>A <b>Fatura Individual</b>, em PDF. O prontuário não precisa ir.</p></div>` +
  `<div class="passo" id="p2"><div class="n">2</div><h3>Em Concluídas, clique em Abrir</h3><p>A conta concluída abre o guia, com as linhas que você marcou.</p></div>` +
  `<div class="passo" id="p3"><div class="n">3</div><h3>Clique em Reenviar conta corrigida</h3><p>No rodapé do guia. Escolha o PDF da conta.</p></div>` +
  `<div class="passo" id="p4"><div class="n">4</div><h3>Leia o resultado</h3><p>Cada linha <b>Feito</b> ganha <b>corrigida no MV</b> ou <b>ainda na conta</b>, e a <b>Nota de saída</b> aparece ao lado.</p></div>` +
  `<div class="passo" id="p5"><div class="n">5</div><h3>Várias contas? Arraste todas</h3><p>Na tela <b>Contas médicas</b>. O <b>Último envio</b> mostra cada uma como reenvio.</p></div>`;

const PALCO = document.getElementById("palco-tarefa");
PALCO.querySelectorAll("*").forEach((el) => {
  el.setAttribute("data-layout-allow-overlap", "");
  el.setAttribute("data-layout-allow-occlusion", "");
  el.setAttribute("data-layout-allow-overflow", "");
});

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
const exibe = (sel, t) => tl.set(sel, { display: "block" }, t);
const oculta = (sel, t) => tl.set(sel, { display: "none" }, t);

function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;
  const el = document.getElementById(idAlvo);
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 4 : 2.5;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* A lista das Concluídas só existe depois da troca de aba: mede no estado em que estará. */
function noEstado(estado, fn) {
  const antes = {};
  for (const [id, disp] of Object.entries(estado)) {
    const el = document.getElementById(id);
    antes[id] = el.style.display;
    el.style.display = disp;
  }
  const r = fn();
  for (const [id, disp] of Object.entries(antes)) document.getElementById(id).style.display = disp;
  return r;
}
const ESTADO = { inicio: {}, concl: { "lista-fila": "none", "lista-concl": "block" } };
function toca(t, para, de, estado, estadoDe) {
  const a = noEstado(ESTADO[estado || "inicio"], () => ponto(para));
  const b = de ? noEstado(ESTADO[estadoDe || estado || "inicio"], () => ponto(de)) : { x: a.x + 34, y: Math.min(a.y + 70, 480) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota("#p1", 4.90, 9.55);
nota("#p2", 9.90, 16.05);
nota("#p3", 16.40, 22.55);
nota("#p4", 22.90, 30.55);
nota("#p5", 30.90, 39.25);

/* passo 1: o PDF da conta corrigida, exportado do MV */
surge("#arquivo", 5.6, 12);
esconde("#arquivo", 9.2);

/* passo 2: a aba Concluídas e o Abrir */
toca(10.3, "aba-concl");
tl.set("#aba-fila", { attr: { class: "" } }, 11.4);
tl.set("#aba-concl", { attr: { class: "on" } }, 11.4);
oculta("#lista-fila", 11.4);
exibe("#lista-concl", 11.4);
esconde("#mk-aba-concl", 12.0);
toca(12.6, "concl-abrir", "aba-concl", "concl", "concl");
esconde("#mk-concl-abrir", 14.6);
esconde("#tela-contas", 14.9);
mostra("#tela-guia", 15.0);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 15.0);

/* passo 3: o botão do rodapé e o PDF escolhido */
toca(16.9, "btn-reenviar");
mostra("#seletor", 18.1);
esconde("#mk-btn-reenviar", 18.1);
toca(19.0, "sel-abrir", "btn-reenviar");
esconde("#seletor", 20.2);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 20.4);

/* passo 4: as marcas por linha e a nota de saída */
mostra("#m1-marca", 23.4);
mostra("#m2-marca", 23.7);
mostra("#m3-marca", 24.0);
mostra("#status", 24.2);
mostra("#nota-saida", 24.6);
const mkNotas = marcaEm("bl-notas");
mostra(mkNotas, 25.4);
esconde(mkNotas, 28.0);
const mkM3 = marcaEm("m3");
mostra(mkM3, 28.1);
esconde(mkM3, 30.2);

/* passo 5: várias de uma vez, pela tela Contas médicas */
esconde("#tela-guia", 31.0);
mostra("#tela-contas", 31.1);
tl.set("#aba-fila", { attr: { class: "on" } }, 31.0);
tl.set("#aba-concl", { attr: { class: "" } }, 31.0);
oculta("#lista-concl", 31.0);
exibe("#lista-fila", 31.0);
tl.set("#arquivo", { x: 0, y: 0 }, 31.4);
surge("#arquivo", 31.6, 10);
tl.to("#arquivo", { x: -330, y: -255, scale: 0.7, duration: 1.2, ease: "power2.inOut" }, 32.5);
const mkSoltar = marcaEm("soltar");
mostra(mkSoltar, 32.8);
esconde("#arquivo", 33.8);
esconde(mkSoltar, 34.2);
exibe("#quadro", 34.3);
mostra("#quadro", 34.4);
const mkQuadro = marcaEm("quadro");
mostra(mkQuadro, 35.0);
esconde(mkQuadro, 38.6);

/* 3 · Fecho */
surge("#fc-titulo", 40.30, 18);
surge("#fc-carimbo", 40.80, 14);
surge("#fc-org", 41.20, 12);

window.__timelines.main = tl;
</script>
