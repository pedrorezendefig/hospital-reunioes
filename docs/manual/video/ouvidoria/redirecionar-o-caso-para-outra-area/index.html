  fechar: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
const ic = (nome, s, traco) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${traco || 2}" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${P[nome]}</svg>`;

/* A casca do app (barra lateral e topo), como a Claudia, da Ouvidoria, vê. */
const casca = `<div class="lado"><div class="marca"><img src="assets/logo-hsm.png" alt="Hospital São Matheus" /></div><nav>
    <div class="mi">${ic("alvo", 18, 1.5)}Reuniões e metas<span class="fim">${ic("baixo", 16)}</span></div>
    <div class="sub"><div class="mi">${ic("painel", 16, 1.5)}Dashboard</div><div class="mi">${ic("calendario", 16, 1.5)}Calendário</div><div class="mi">${ic("relogio", 16, 1.5)}Pendências<span class="fim">${ic("direita", 16)}</span></div></div>
    <div class="mi on">${ic("megafone", 18, 2)}Ouvidoria<span class="selo">5</span></div><div class="mi">${ic("escudo", 18, 1.5)}Admin</div><div class="mi" style="margin-top:8px">${ic("ajuda", 18, 1.5)}Ajuda</div></nav></div>
  <div class="topo"><div class="busca">${ic("lupa", 16)}Buscar...</div><div class="quem"><div class="sino">${ic("sino", 22, 1.75)}</div><div class="divisor"></div>
    <div class="pessoa"><div class="tx"><b>claudia.bastos</b><span>claudia.bastos@exemplo.l...</span></div><div class="avatar">C<span class="seta">${ic("baixo", 12)}</span></div></div></div></div>`;

/* O caso aberto, antes e depois do redirecionamento. */
const campo = (rot, val, id) => `<div${id ? ` id="${id}"` : ""}><dt>${rot}</dt><dd>${val}</dd></div>`;
const caso = (p, depois) => `<div class="pagina" id="${p}" style="padding:0;opacity:${depois ? 0 : 1}"><div class="caso">
  <div class="volta">${ic("voltar", 16)}Painel da Ouvidoria</div>
  <section class="ap-secao"><header class="ap-cab"><div class="esq"><span class="ic">${ic("pessoa", 20)}</span><div><h1>Manifestação 2026-0012</h1><p class="st">Aguardando área</p></div></div>
    <div class="acoes"><span class="acao branca" id="${p}-bt-redirecionar">${ic("trocar", 14)}Redirecionar</span><span class="acao verde">${ic("checkc", 14)}Encerrar</span></div></header>
    <div class="blocos">
      ${depois ? `<div class="faixa-info ok" id="${p}-aviso"><span class="ic">${ic("trocar", 16)}</span><span>Caso redirecionado para Faturamento. A área anterior foi avisada.</span></div>` : ""}
      <div class="faixa-info origem"><span class="ic">${ic("pin", 16)}</span><span><b>Registrada pela Ouvidoria</b> (telefone)</span></div>
      <dl class="campos">${campo("Quem manifestou", "Iris Camargo")}${campo("Contato", "iris.camargo@exemplo.local")}${campo("Vínculo", "acompanhante")}${campo("Paciente", "Não informado")}
        ${campo("Referência do atendimento", "Não informado")}${campo("Setor", depois ? "Faturamento" : "Recepção", `${p}-setor`)}${campo("Tipo", "Reclamação")}${campo("Rótulo do caso", "Atendimento")}${campo("Gravidade", "Médio")}</dl>
    </div></section></div></div>`;

/* A janela Redirecionar, preenchida com o que o caso já tinha. */
const MOTIVO = "O relato é de cobrança de exame, que a Recepção não apura. O caso é do Faturamento desde o começo.";
const EXTRATO = "Apurar a cobrança do exame feita na recepção e responder à Ouvidoria o que foi corrigido.";
const grav = (nome, ajuda, on) => `<div class="grav${on ? " on" : ""}"${on ? ' id="md-grav-medio"' : ""}><b>${nome}</b><small>${ajuda}</small></div>`;
const janelaRedirecionar = `<div class="veu" id="veu"></div>
  <div class="modal" id="modal">
    <header class="md-cab"><span class="ic">${ic("enviar", 20)}</span><div><h2>Redirecionar 2026-0012 para outra área</h2><p>A área nova recebe o email de acionamento com o prazo inteiro, e a anterior recebe um aviso curto de que não precisa mais responder.</p></div><span class="x">${ic("fechar", 20)}</span></header>
    <div class="md-corpo"><div class="md-rolo" id="md-rolo">
      <div id="md-tipo"><label class="rot">Tipo da manifestação</label><div class="campo sel">Reclamação<span class="ic">${ic("baixo", 16)}</span></div>
        <p class="dica">Denúncia e relato de conduta são sigilosos por natureza: o caso sai do painel de quem está fora da Ouvidoria e o email do setor vai sem a identificação de quem manifestou.</p></div>
      <div><label class="rot">Rótulo do caso <span>(opcional)</span></label><div class="campo">Atendimento</div></div>
      <div class="sigilo"><span class="qd"></span><span><b>Sigilo reforçado</b><small>Marque para restringir o caso ao Ouvidor e à Diretoria Executiva. Desmarque para devolver o caso ao painel de todos.</small></span></div>
      <div id="md-area-bloco"><label class="rot">Área responsável</label><div class="campo sel" id="md-area"><span><span id="md-area-vazia">Escolha o setor</span><span id="md-area-cheia" style="opacity:0;position:absolute;left:12px;top:8px">Faturamento</span></span><span class="ic">${ic("baixo", 16)}</span></div>
        <p class="dica">O caso está com Recepção. Escolha a área certa: a mesma área não vale, e para cobrar de novo quem já respondeu o caminho é a devolução por insuficiência.</p></div>
      <div id="md-motivo-bloco"><label class="rot">Motivo do redirecionamento <span>(obrigatório)</span></label><div class="campo alto" id="md-motivo"><span class="vazio" id="md-motivo-vazio">Ex.: o caso é de conduta médica, e a Recepção não tem como apurar.</span><span class="cheio" id="md-motivo-cheio" style="opacity:0">${MOTIVO}</span><span class="campo-foco" id="md-motivo-foco" style="opacity:0"></span></div>
        <p class="dica">Fica na trilha do caso, com o seu nome e a área de onde ele saiu. Não vai no aviso à área anterior, que só diz que a demanda foi encaminhada a outra área.</p></div>
      <div id="md-grav"><span class="rot">Gravidade</span><div class="gravs">${grav("Crítico", "Risco à vida, à segurança ou à imagem. A área é acionada na hora, fora do expediente inclusive.")}${grav("Alto", "Dano relevante ao paciente ou ao serviço. A área responde em 2 dias úteis.")}${grav("Médio", "Falha que precisa de correção, sem dano imediato.", true)}${grav("Baixo", "Sugestão, elogio ou queixa que a ouvidoria resolve direto.")}</div></div>
      <div id="md-extrato"><label class="rot">Extrato para o setor <span>(obrigatório)</span></label><div class="campo mais-alto">${EXTRATO}</div>
        <p class="dica">É este texto que vai no email do responsável, e só ele. Escreva com as suas palavras o que a área precisa resolver: o responsável do setor é de fora da Ouvidoria, e o relato de quem manifestou não sai daqui. Sem este texto o acionamento não sai.</p></div>
      <div><label class="rot">Observação da validação <span>(opcional)</span></label><div class="campo alto"><span class="vazio">Fica na trilha do caso, junto do movimento de acionamento.</span></div></div>
      <div class="md-botoes"><span class="bt-texto">Cancelar</span><span class="bt-ato" id="md-confirmar">${ic("checkc", 16)}Redirecionar para a área nova<span class="apagado" id="md-apagado"></span></span></div>
    </div>
</div>
  </div>
<div class="lista-sel" id="lista-sel"><div class="apagada">Escolha o setor</div><div class="op">Centro Médico</div><div class="op">Farmácia</div><div class="op" id="op-faturamento">Faturamento</div><div class="op">Recepção</div><div class="op">UTI</div>
      <div class="realce" id="realce"><div class="op sobre">Faturamento</div></div></div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url">app.hospitalsaomatheus.cloud/ouvidoria/m/2026-0012</div></div>
    <div class="vista"><div class="app" id="app">${casca}<div class="corpo"><div class="tela-app">${caso("c0")}${caso("c1", true)}</div></div>
      <div class="sobre-app" id="sobre-app">${janelaRedirecionar}</div></div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas: onde cada elemento fica no quadro com a câmera em repouso, pelo
   offset do layout (que ignora a câmera e a rolagem da janela). Nada se mede
   na montagem: o script roda antes de a fonte do app carregar, e a medida ali
   sai com a fonte de reserva (o anel caía ao lado do alvo, nota do Pedro no OK dos pilotos). Alvo e
   rolagem são funções que o GSAP chama quando o tween começa, e o render só
   busca o primeiro quadro depois da fonte. */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id, rolagem) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + (y - rolagem) * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const valor = (v) => (typeof v === "function" ? v() : v);
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, valor(rolagem)))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });
/* Rolagem da janela Redirecionar que deixa o alvo a 24 px do topo do corpo. */
const ROLO = document.getElementById("md-rolo"), CORPO_H = 493;
const MAX_ROLA = () => ROLO.offsetHeight - CORPO_H;
const rolagemPara = (id) => () => Math.max(0, Math.min(MAX_ROLA(), document.getElementById(id).offsetTop - 24));
const ROLA_AREA = rolagemPara("md-area-bloco");

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const rola = (y, t) => tl.to("#md-rolo", { y: () => -valor(y), duration: 0.8, ease: "power2.inOut" }, t);

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4.0);

/* Passo 1 (4 a 10): Redirecionar, no alto do caso. A janela abre por cima. */
const bRedirecionar = alvo("c0-bt-redirecionar");
mira(4.4, 2.6, bRedirecionar, 1.5, 7.9);
marca(6.0, bRedirecionar, 7.5);
toca(6.1, bRedirecionar);
soltaDedo(7.6);
tl.to("#sobre-app", { opacity: 1, duration: 0.25 }, 7.4);
tl.fromTo("#modal", { scale: 0.95 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 7.4);
const bModal = alvo("modal");
mira(7.9, 1.6, bModal, 1.05, 10.1);

/* Passo 2 (10 a 16): o que já vem preenchido. */
const bTipo = alvo("md-tipo");
mira(10.1, 1.8, bTipo, 1.35, 12.6);
marca(10.8, bTipo, 12.4);
const ROLA_GRAV = rolagemPara("md-grav");
rola(ROLA_GRAV, 12.5);
const bGrav = alvo("md-grav md-extrato", ROLA_GRAV);
mira(12.6, 1.4, bGrav, 1.2, 15.8);
marca(13.6, alvo("md-grav-medio", ROLA_GRAV), 15.5);

/* Passo 3 (16 a 23): a área nova, na lista do seletor. */
rola(ROLA_AREA, 15.8);
const bArea = alvo("md-area", ROLA_AREA);
mira(15.8, 1.6, bArea, 1.4, 23.0);
toca(16.6, bArea);
/* A lista do seletor abre logo abaixo do campo Área responsável, já rolado. */
const CAMPO_AREA = document.getElementById("md-area");
tl.set("#lista-sel", { top: () => `${32 + 86 + CAMPO_AREA.offsetTop + CAMPO_AREA.offsetHeight + 4 - ROLA_AREA()}px` }, 17.5);
tl.set("#realce", { top: () => `${document.getElementById("op-faturamento").offsetTop}px` }, 17.5);
tl.to("#lista-sel", { opacity: 1, duration: 0.15 }, 17.6);
const bOpcao = alvo("op-faturamento");
toca(18.2, bOpcao, bArea);
tl.to("#realce", { opacity: 1, duration: 0.12 }, 18.95);
tl.to("#lista-sel", { opacity: 0, duration: 0.12 }, 19.4);
tl.to("#md-area-vazia", { opacity: 0, duration: 0.1 }, 19.45);
tl.to("#md-area-cheia", { opacity: 1, duration: 0.1 }, 19.5);
soltaDedo(19.7);
marca(20.0, alvo("md-area md-area-bloco", ROLA_AREA), 22.6);

/* Passo 4 (23 a 31): o motivo, obrigatório. Com ele, o botão acende. */
const ROLA_MOTIVO = rolagemPara("md-motivo-bloco");
rola(ROLA_MOTIVO, 23.0);
const bMotivo = alvo("md-motivo", ROLA_MOTIVO);
mira(23.0, 1.6, bMotivo, 1.4, 31.0);
toca(24.0, bMotivo);
tl.to("#md-motivo-foco", { opacity: 1, duration: 0.15 }, 24.95);
tl.to("#md-motivo-vazio", { opacity: 0, duration: 0.15 }, 25.2);
tl.to("#md-motivo-cheio", { opacity: 1, duration: 0.8 }, 25.3);
tl.to("#md-apagado", { opacity: 0, duration: 0.3 }, 26.3);
soltaDedo(26.0);
marca(27.0, alvo("md-motivo-bloco", ROLA_MOTIVO), 30.2);

/* Passo 5 (31 a 38): Redirecionar para a área nova. A janela fecha. */
rola(MAX_ROLA, 31.0);
const bConfirmar = alvo("md-confirmar", MAX_ROLA);
mira(31.0, 1.8, bConfirmar, 1.45, 34.4);
toca(32.6, bConfirmar);
tl.to("#md-confirmar", { scale: 0.97, duration: 0.1 }, 33.55);
tl.to("#md-confirmar", { scale: 1, duration: 0.1 }, 33.65);
soltaDedo(34.0);
tl.to("#sobre-app", { opacity: 0, duration: 0.3 }, 34.2);
tl.set("#c0", { opacity: 0 }, 34.4);
tl.set("#c1", { opacity: 1 }, 34.4);
mira(34.4, 1.6, REPOUSO, 1.0, 38.0);

/* Passo 6 (38 a 46): a confirmação no caso e a área nova no campo Setor. */
const bAviso = alvo("c1-aviso");
mira(38.0, 2.0, bAviso, 1.4, 41.6);
marca(38.8, bAviso, 41.4);
const bSetor = alvo("c1-setor");
mira(41.6, 1.8, bSetor, 1.45, 46.0);
marca(42.6, bSetor, 45.4);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 50 }, 0);
window.__timelines["main"] = tl;
</script>
