<script>
/* Ícones no traço do app (mesma biblioteca das outras composições) */
function ic(nome, s, cls) {
  const P = {
    checkc: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    aviao: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    pessoa: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>'
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls || ""}" style="flex-shrink:0">${P[nome]}</svg>`;
}

function logo(w) {
  const h = Math.round(w * 0.42);
  return `<svg width="${w}" height="${h}" viewBox="0 0 100 42" fill="none" style="flex-shrink:0">
    <path d="M8 40 A24 24 0 0 1 56 40" stroke="#3B6FB6" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 40 A24 24 0 0 1 92 40" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>
  </svg>`;
}

function marca(w, cor) {
  return `${logo(w)}<div style="font-size:${Math.round(w*0.115)}px;font-weight:700;color:${cor || "#1E3A8A"};line-height:1.12;text-align:center;letter-spacing:.01em">HOSPITAL<br>SÃO MATHEUS</div>`;
}

const RELATO = "Fui muito bem atendida na recepção da Farmácia hoje de manhã. A atendente explicou com calma como retirar o medicamento e ainda conferiu a receita comigo. Queria registrar o elogio.";

const passo = (n, num, titulo, texto, topo) =>
  `<div class="passo" id="${n}" style="top:${topo}px"><div class="n">${num}</div><h3>${titulo}</h3><p>${texto}</p></div>`;

document.getElementById("palco-tarefa").innerHTML =
  `<div style="position:absolute;inset:0;background:#EEF1F6"></div>
  <div class="fone" data-layout-allow-overflow data-layout-allow-occlusion id="fone" style="left:66px;top:22px">
    <div class="tela" data-layout-allow-overflow data-layout-allow-occlusion>
      <div class="rolo" data-layout-allow-overflow data-layout-allow-occlusion id="rolo">
        <div class="pub" data-layout-allow-overflow data-layout-allow-occlusion>
          <div class="marca">${marca(56)}</div>
          <h1>Ouvidoria</h1>
          <div class="dek">Reclamação, elogio ou sugestão: conte para a gente e receba seu protocolo na hora.</div>
          <div class="cartao">
            <div class="lb">O que você quer registrar? <span>(opcional)</span></div>
            <div class="nat"><div id="nat-elogio">Elogio</div><div>Reclamação</div><div>Sugestão</div><div>Informação</div></div>
            <div class="nota">Não precisa escolher. A Ouvidoria confirma isso ao ler seu relato.</div>
            <div class="lb">O que aconteceu?</div>
            <div class="ta" id="ta" style="position:relative">
              <div id="ta-vazio" style="color:#667083">Conte com suas palavras o que você quer registrar: uma reclamação, um elogio ou uma sugestão.</div>
              <div id="ta-cheio" style="position:absolute;left:8px;right:8px;top:7px;opacity:0">${RELATO}</div>
            </div>
            <div class="cont"><span id="cont-0">0 / 10000</span><span id="cont-1" style="display:none">181 / 10000</span></div>
            <div class="anon" id="anon"><div class="qd"></div><div><b>Quero registrar de forma anônima.</b><p>Sem identificação não conseguimos dar retorno individual a você.</p></div></div>
            <div class="lb">Seu nome <span>(opcional)</span></div>
            <div class="inp" id="nome"><span id="nome-t" style="opacity:0">Marina Alves</span></div>
            <div class="lb">Telefone ou email <span>(opcional)</span></div>
            <div class="inp" id="contato"><span id="contato-t" style="opacity:0">marina.alves@exemplo.com</span></div>
            <div class="nota">É por aqui que a Ouvidoria fala com você sobre este caso.</div>
            <div class="enviar" id="enviar">${ic("aviao", 10)} Enviar manifestação</div>
            <div class="rod">Ao enviar, você recebe o número do protocolo nesta tela.</div>
          </div>
        </div>
      </div>
      <div class="recibo" id="recibo" style="position:absolute;inset:0;background:#fff;display:none;opacity:0">
        <div class="ok">${ic("checkc", 22)}</div>
        <h2>Manifestação registrada</h2>
        <p>A Ouvidoria já recebeu o seu relato e vai analisar.</p>
        <div class="cx"><div class="k">Protocolo</div><div class="p">2026-0042</div></div>
        <p>Guarde este número. É por ele que a Ouvidoria acompanha o seu caso.</p>
      </div>
    </div>
  </div>
  <div class="marcador" data-layout-allow-overlap data-layout-allow-occlusion id="mk-natureza" style="left:92px;top:174px;width:192px;height:62px"></div>
  <div class="marcador" data-layout-allow-overlap data-layout-allow-occlusion id="mk-anon" style="left:92px;top:350px;width:192px;height:48px"></div>
  <div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1">${ic("pessoa", 0)}<svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  passo("p1", 1, "Abra o formulário", "Pelo QR do cartaz do setor ou pelo link do site do hospital. Você não precisa de conta nem de senha.", 60) +
  passo("p2", 2, "Escolha o que você quer registrar", "<b>Elogio</b>, <b>Reclamação</b>, <b>Sugestão</b> ou <b>Informação</b>. Este passo é opcional: a Ouvidoria confirma isso ao ler o seu relato.", 60) +
  passo("p3", 3, "Conte o que aconteceu", "Escreva com as suas palavras em <b>O que aconteceu?</b>. Este é o único campo obrigatório.", 60) +
  passo("p4", 4, "Decida se quer se identificar", "Marque <b>Quero registrar de forma anônima</b> para não se identificar. Sem identificação, a Ouvidoria não tem como dar retorno a você.", 60) +
  passo("p5", 5, "Preencha nome e contato", "<b>Seu nome</b> e <b>Telefone ou email</b>. É por aí que a Ouvidoria fala com você sobre este caso.", 60) +
  passo("p6", 6, "Envie e guarde o protocolo", "Clique em <b>Enviar manifestação</b>. O número do protocolo aparece nesta mesma tela.", 60);

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const digita = (vazio, cheio, campo, t) => {
  tl.to(vazio, { opacity: 0, duration: 0.15 }, t);
  tl.to(cheio, { opacity: 1, duration: 0.22 }, t + 0.15);
  if (campo) tl.to(campo, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};

/* 1 · Abertura (0 a 4) */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa (4 a 37) */
tl.fromTo("#fone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.2);

/* passo 1: a tela abre */
nota("#p1", 4.9, 8.6);

/* passo 2: escolher a natureza */
nota("#p2", 8.9, 13.4);
tl.fromTo("#mk-natureza", { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, 9.2);
move("#g1", 9.6, 210, 230, 132, 182);
clique("#g1", 10.6);
tl.to("#nat-elogio", { borderColor: "#2B2E7E", backgroundColor: "#F5F6FE", color: "#2B2E7E", duration: 0.3 }, 10.7);
tl.to("#mk-natureza", { opacity: 0, duration: 0.3 }, 11.4);

/* passo 3: o relato */
nota("#p3", 13.7, 19.0);
move("#g1", 13.9, 132, 182, 150, 285);
clique("#g1", 14.8);
digita("#ta-vazio", "#ta-cheio", "#ta", 15.0);
tl.set("#cont-0", { display: "none" }, 15.5);
tl.set("#cont-1", { display: "inline" }, 15.5);
tl.to("#enviar", { backgroundColor: "#2B2E7E", duration: 0.4 }, 16.2);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 16.6);

/* passo 4: identificar-se ou não */
nota("#p4", 19.3, 24.0);
tl.fromTo("#mk-anon", { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, 19.8);
tl.to("#anon", { borderColor: "#2B2E7E", duration: 0.35 }, 19.8);
tl.to("#anon", { borderColor: "rgba(0,0,0,0)", duration: 0.35 }, 22.6);
tl.to("#mk-anon", { opacity: 0, duration: 0.3 }, 22.6);

/* passo 5: nome e contato */
nota("#p5", 24.3, 28.6);
tl.to("#rolo", { y: -74, duration: 0.9, ease: "power2.inOut" }, 24.6);
tl.to("#nome-t", { opacity: 1, duration: 0.3 }, 25.8);
tl.to("#contato-t", { opacity: 1, duration: 0.3 }, 26.6);

/* passo 6: enviar e guardar o protocolo */
nota("#p6", 28.9, 36.2);
move("#g1", 29.2, 232, 500, 150, 438);
clique("#g1", 30.1);
aperta("#enviar", 30.1);
tl.to("#rolo", { opacity: 0, duration: 0.3 }, 30.5);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 30.5);
tl.set("#recibo", { display: "flex" }, 30.8);
tl.to("#recibo", { opacity: 1, duration: 0.45 }, 30.85);

/* 3 · Fecho (37 a 42) */
surge("#fc-titulo", 37.3, 18);
surge("#fc-carimbo", 37.8, 14);
surge("#fc-org", 38.2, 12);

window.__timelines.main = tl;
</script>
