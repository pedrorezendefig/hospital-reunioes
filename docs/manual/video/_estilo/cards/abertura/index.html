<!doctype html>
<!--
  ESTILO DO MANUAL · card de tela cheia · abertura (3 a 5 s)
  Opaco: substitui o vídeo. Título da tarefa no infinitivo, igual ao da página,
  a seção do manual em cima e o selo de quem faz embaixo.
  Slots: secao (40), titulo (70), papel (24). **palavra** sai em negrito.
  Contrato dos cards: _estilo/DESIGN.md, seção "Cards e slots".
-->
<html lang="pt-BR" data-composition-variables='[
  {"id":"secao","type":"string","label":"Seção do manual","default":"Manual · Ouvidoria","maxLength":40},
  {"id":"titulo","type":"string","label":"Título da tarefa","default":"Registrar uma manifestação pelo formulário","maxLength":70},
  {"id":"papel","type":"string","label":"Quem faz","default":"Sem login","maxLength":24}
]'>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
</head>
<body>
<div id="abertura" data-composition-id="abertura" data-start="0" data-width="1920" data-height="1080" data-duration="4">
  <style>
    #abertura { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font-app); }
    .fundo { position: absolute; inset: 0; background: var(--video-cartao); }
    .camera { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    .logo { position: absolute; left: 160px; top: 110px; width: 200px; height: 113px; object-fit: contain; }
    .bloco { position: absolute; left: 160px; top: 260px; width: 1600px; height: 640px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    .secao { font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--video-foco); }
    .titulo { margin: 0; font-size: 84px; line-height: 1.1; font-weight: 400; color: var(--video-marca); }
    .papel { align-self: flex-start; height: 56px; margin-top: 20px; padding: 0 28px; display: flex; align-items: center; border: 2px solid var(--video-marca); border-radius: 999px; font-size: 28px; color: var(--video-marca); }
  </style>
  <div class="fundo"></div>
  <div class="camera" data-layout-allow-overflow>
    <img class="logo" src="assets/logo-hsm.png" alt="Hospital São Matheus" />
    <div class="bloco">
      <div class="secao" data-slot="secao">Manual · Ouvidoria</div>
      <h1 class="titulo" data-slot="titulo">Registrar uma manifestação pelo formulário</h1>
      <div class="papel" data-slot="papel">Sem login</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
/* Slots: o host preenche por data-variable-values; sem host, vale o default
   declarado no <html>. **palavra** vira negrito (a palavra da tela). */
const valores = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
document.querySelectorAll("#abertura [data-slot]").forEach((el) => {
  const bruto = valores[el.dataset.slot] || el.textContent;
  el.innerHTML = bruto
    .replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
});

const tl = gsap.timeline({ paused: true });
/* A câmera nunca para: aproximação lenta durante o card inteiro. */
tl.fromTo("#abertura .camera", { scale: 1 }, { scale: 1.03, duration: 5, ease: "none" }, 0);
tl.fromTo("#abertura .logo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
tl.fromTo("#abertura .secao", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.25);
tl.fromTo("#abertura .titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.45);
tl.fromTo("#abertura .papel", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.0);
/* Âncora do slot: o timeline cobre os 5 s que a abertura pode ter. */
tl.to({}, { duration: 5 }, 0);
window.__timelines["abertura"] = tl;
</script>
</body>
</html>
