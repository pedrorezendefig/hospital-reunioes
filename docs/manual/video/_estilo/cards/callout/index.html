<!doctype html>
<!--
  ESTILO DO MANUAL · card de apoio · callout (aviso antes da ação)
  O par em vídeo do :::caution da Página de tarefa: o que não tem volta ou o
  que a pessoa precisa saber antes de clicar. No máximo um por vídeo, antes do
  passo que dispara a ação. Transparente fora do cartão, no alto à direita,
  longe da placa da legenda.
  Slots: titulo (40), texto (110). **palavra** sai em negrito.
  Contrato dos cards: _estilo/DESIGN.md, seção "Cards e slots".
-->
<html lang="pt-BR" data-composition-variables='[
  {"id":"titulo","type":"string","label":"Título do aviso","default":"Não tem volta","maxLength":40},
  {"id":"texto","type":"string","label":"Texto do aviso","default":"Depois de **Finalizar sem assinatura**, a ata não volta para edição.","maxLength":110}
]'>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
</head>
<body>
<div id="callout" data-composition-id="callout" data-start="0" data-width="1920" data-height="1080" data-duration="6">
  <style>
    #callout { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font-app); }
    .cartao {
      position: absolute; right: 160px; top: 96px; width: 640px;
      box-sizing: border-box; padding: 32px 36px 34px 44px;
      background: var(--video-cartao); border: 2px solid var(--video-borda); border-radius: var(--radius-3xl);
      box-shadow: var(--video-sombra); overflow: hidden;
    }
    .faixa { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--video-atencao); }
    .cabeca { display: flex; align-items: center; gap: 18px; }
    .sinal {
      flex: 0 0 48px; width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--video-atencao); color: var(--video-legenda-fundo); font-size: 32px;
    }
    .titulo { font-size: 36px; color: var(--video-marca); }
    .texto { margin-top: 16px; font-size: 30px; line-height: 1.35; color: var(--video-texto); }
    .texto b { font-weight: 700; }
  </style>
  <div class="cartao">
    <div class="faixa"></div>
    <div class="cabeca">
      <div class="sinal">!</div>
      <div class="titulo" data-slot="titulo">Não tem volta</div>
    </div>
    <div class="texto" data-slot="texto">Depois de **Finalizar sem assinatura**, a ata não volta para edição.</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
/* Slots: o host preenche por data-variable-values; sem host, vale o default
   declarado no <html>. **palavra** vira negrito (a palavra da tela). */
const valores = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
document.querySelectorAll("#callout [data-slot]").forEach((el) => {
  const bruto = valores[el.dataset.slot] || el.textContent;
  el.innerHTML = bruto
    .replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
});

const tl = gsap.timeline({ paused: true });
tl.fromTo("#callout .cartao", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0);
tl.fromTo("#callout .texto", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
/* Um toque no sinal, uma vez só (nada de repetição infinita). */
tl.fromTo("#callout .sinal", { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power1.inOut", yoyo: true, repeat: 1 }, 0.6);
/* Âncora do slot: um Vídeo de tarefa tem no máximo 60 s. */
tl.to({}, { duration: 60 }, 0);
window.__timelines["callout"] = tl;
</script>
</body>
</html>
