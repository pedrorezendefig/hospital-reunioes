ding:3px 6px;border-left:1.6px solid transparent"><span style="width:9px;height:9px;border-radius:50%;background:#F1F5F9;color:#64748B;font-size:4.4px;font-weight:700;display:flex;align-items:center;justify-content:center">M</span><div><div style="font-size:5.8px;font-weight:700;color:#334155">Marcos Pereira</div><div style="font-size:4.8px;color:#626D80">Suprimentos</div></div></div></div><div id="pm-caixa" style="position:relative;border:1px solid #E2E8F0;border-radius:7px;background:#F8FAFC;padding:5px 6px;min-height:28px;font-size:6px;line-height:1.5;padding-right:16px"><span id="pm-ph" style="color:#626D80">Escreva algo... (@ para menção)</span><span id="pm-arroba" data-layout-allow-overlap style="position:absolute;left:6px;top:5px;opacity:0;color:#1E293B">@Mar</span><span id="pm-escrito" data-layout-allow-overlap style="position:absolute;left:6px;right:16px;top:5px;opacity:0"><span style="color:#2B2E7E;font-weight:600">@Marina Alves</span><span style="color:#1E293B"> a escala nova já está pronta?</span></span><span id="pm-enviar" style="position:absolute;right:4px;bottom:4px;width:11px;height:11px;border-radius:4px;background:#2B2E7E;color:#fff;display:flex;align-items:center;justify-content:center;opacity:0.4"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:3px"><span style="display:flex;align-items:center;gap:2px;font-size:4.8px;color:#626D80;font-weight:600"><svg width="5" height="5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>Mencione equipe com @</span><span style="font-size:4.8px;color:#CBD5E1;font-weight:600;border:1px solid #E2E8F0;border-radius:3px;padding:0.5px 3px">Cmd/Ctrl + Enter</span></div></div></div></div></div></div></div><div class="rodape-v">Manual · retrata o app em v0.142.1 · gerado em 17/09/2026</div><div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1" style="top:150px"><div class="n">1</div><h3>Abra a pendência</h3><p>Clique na linha, na <b>Lista</b>, ou no cartão, no <b>Kanban</b>.</p></div><div class="passo" id="p2" style="top:150px"><div class="n">2</div><h3>Desça até o histórico</h3><p>Sem nenhum comentário, ele mostra <b>Sem rastros de atividade.</b></p></div><div class="passo" id="p3" style="top:150px"><div class="n">3</div><h3>Escreva na caixa</h3><p>Ela avisa o atalho: <b>Escreva algo... (@ para menção)</b>.</p></div><div class="passo" id="p4" style="top:150px"><div class="n">4</div><h3>Para chamar alguém, digite arroba</h3><p>A lista de pessoas abre; escolha com as setas e confirme, ou clique no nome.</p></div><div class="passo" id="p5" style="top:150px"><div class="n">5</div><h3>Envie o comentário</h3><p>No botão azul ao lado da caixa, ou pelo atalho <b>Cmd/Ctrl + Enter</b>.</p></div><div class="passo" id="p6" style="top:150px"><div class="n">6</div><h3>A pessoa recebe um aviso no sino</h3><p>Com o texto <b>Fulano mencionou você</b>. Quem não entra na plataforma não recebe menção.</p></div>`;

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
/* Campo do app: o placeholder dá lugar ao valor, e a borda acende. */
const digita = (base, t) => {
  tl.to(base + "-ph", { opacity: 0, duration: 0.15 }, t);
  tl.to(base + "-val", { opacity: 1, duration: 0.22 }, t + 0.15);
  tl.to(base, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
/* Troca o texto de um rótulo no meio do passo (Lembrar → Enviado). */
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
/* Acende a borda de um bloco (coluna de destino, cartão em foco). */
const acende = (sel, t, cor) => tl.to(sel, { borderColor: cor || "#2B2E7E", duration: 0.25 }, t);

/* ── Ancoragem ao elemento, em vez de coordenada escrita à mão ──────────────
   O marcador nasce DENTRO do alvo e o dedo lê a posição do alvo no palco:
   assim nenhum dos dois pode apontar o campo de cima. Medidas por offset*,
   que ignoram o scale(2) do palco e não dependem da fonte ter carregado. */
const PALCO = document.getElementById("palco-tarefa");
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
/* Cria o marcador colado no alvo e devolve o seletor dele. */
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;   // dois passos no mesmo alvo reusam o marcador
  const el = document.getElementById(idAlvo);
  const antes = getComputedStyle(el).position;
  if (antes === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  // Alvo de ícone é pequeno: sem folga maior o contorno some na tela.
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 5 : 3;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
/* Ponto que o dedo toca: o centro do alvo, descontando a ponta do cursor. */
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* Encosta um flutuante (menu, lista de nomes) embaixo do alvo que o abre.
   Vira filho do alvo, como o marcador: medida nenhuma pode errar o lugar. */
function abaixoDe(idFlutuante, idAlvo, dx) {
  const alvo = document.getElementById(idAlvo);
  const f = document.getElementById(idFlutuante);
  if (getComputedStyle(alvo).position === "static") alvo.style.position = "relative";
  alvo.appendChild(f);
  f.style.left = (dx || 0) + "px";
  f.style.top = "calc(100% + 3px)";
}
/* O dedo sai de `de` e toca `para`, com marcador e pulso no compasso do passo.
   Sem `de`, entra pela borda de baixo do palco. */
function toca(t, para, de) {
  const a = ponto(para);
  const b = de ? ponto(de) : { x: a.x + 34, y: Math.min(a.y + 70, 458) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota('#p1', 4.90, 9.55);
nota('#p2', 9.90, 14.55);
nota('#p3', 14.90, 19.55);
nota('#p4', 19.90, 24.55);
nota('#p5', 24.90, 29.55);
nota('#p6', 29.90, 34.55);


/* passo 1: a pendência aberta */
mostra(marcaEm("pm-modal"), 5.5);
esconde("#mk-pm-modal", 8.5);

/* passo 2: o histórico vazio */
mostra(marcaEm("pm-vazio"), 10.5);
esconde("#mk-pm-vazio", 13.5);

/* passo 3: a caixa */
toca(15.3, "pm-caixa");
esconde("#mk-pm-caixa", 18.3);

/* passo 4: a arroba abre a lista */
tl.to("#pm-ph", { opacity: 0, duration: 0.15 }, 20.3);
tl.to("#pm-arroba", { opacity: 1, duration: 0.2 }, 20.45);
mostra("#pm-mencoes", 20.8);
toca(21.3, "pm-nome-0", "pm-caixa");
tl.to("#pm-mencoes", { opacity: 0, duration: 0.2 }, 22.6);
tl.to("#pm-arroba", { opacity: 0, duration: 0.15 }, 22.7);
tl.to("#pm-escrito", { opacity: 1, duration: 0.25 }, 22.85);
tl.to("#pm-enviar", { opacity: 1, duration: 0.2 }, 22.9);
esconde("#mk-pm-nome-0", 23.1);

/* passo 5: enviar */
toca(25.3, "pm-enviar", "pm-nome-0");
aperta("#pm-enviar", 26.5);
tl.to("#pm-escrito", { opacity: 0, duration: 0.2 }, 26.8);
tl.to("#pm-ph", { opacity: 1, duration: 0.2 }, 26.95);
tl.to("#pm-enviar", { opacity: 0.4, duration: 0.2 }, 26.95);
tl.to("#pm-vazio", { opacity: 0, duration: 0.25 }, 26.9);
mostra("#pm-comentario", 27.2);
troca("#pm-conta", "Atividade (1)", 27.2);
esconde("#mk-pm-enviar", 28.3);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 28.5);

/* passo 6: o aviso no sino */
mostra("#pm-aviso-sino", 30.7);
esconde("#pm-aviso-sino", 34.1);


/* 3 · Fecho */
surge("#fc-titulo", 36.30, 18);
surge("#fc-carimbo", 36.80, 14);
surge("#fc-org", 37.20, 12);

window.__timelines.main = tl;
</script>
