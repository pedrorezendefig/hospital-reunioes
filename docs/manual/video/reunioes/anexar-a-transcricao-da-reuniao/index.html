function preenche(base, t) { esconde(`#${base}-vazio`, t, 0.15); mostra(`#${base}-cheio`, t + 0.15, 0.5); }
const aperta = (sel, t) => { tl.to(sel, { scale: 0.97, duration: 0.1 }, t); tl.to(sel, { scale: 1, duration: 0.1 }, t + 0.1); };

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4);
/* O endereço muda quando a tela muda. */
tl.set("#url-0", { opacity: 0 }, 7.6); tl.set("#url-1", { opacity: 1 }, 7.6);

/* Passo 1 (4 a 10): o cartão da reunião, no calendário. */
const ROLA_CAL = rolagemPara("cal-rolo", 579.2, "c0-semana-2", 16);
rola("#cal-rolo", ROLA_CAL, 4.6);
const bEv = alvo("c0-ev-13", ROLA_CAL);
mira(4.6, 2.0, bEv, 1.6, 8.0);
marca(6.2, bEv, 7.2);
toca(6.3, bEv);
soltaDedo(7.6);
tl.fromTo("#pg-cal", { x: 0, filter: "blur(0px)", opacity: 1 }, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 7.5);
tl.fromTo("#pg-prog", { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 7.8);
mostra("#casca2", 7.6, 0.05);
mira(8.0, 1.6, REPOUSO, 1.0, 10.0);

/* Passo 2 (10 a 15): descer até o bloco Transcrição. */
const ROLA_TR = rolagemPara("prog-rolo", 579.2, "r0-transcricao", 40);
rola("#prog-rolo", ROLA_TR, 10.2);
const bBloco = alvo("r0-transcricao", ROLA_TR);
mira(10.4, 1.8, bBloco, 1.3, 15.0);
marca(12.0, bBloco, 14.7);

/* Passo 3 (15 a 23): Anexar Transcrição e Processar com IA, e o arquivo. */
const bAnexar = alvo("r0-anexar", ROLA_TR);
mira(15.0, 1.4, bAnexar, 1.5, 17.4);
toca(15.4, bAnexar);
soltaDedo(17.0);
mostra("#sobre-app", 16.6, 0.2);
mira(17.4, 1.2, alvo("fp"), 1.4, 21.4);
toca(18.0, alvo("fp-arq"));
mostra("#fp-esc", 18.95, 0.1);
esconde("#fp-abrir-off", 18.95, 0.1);
toca(19.6, alvo("fp-abrir"), alvo("fp-arq"));
soltaDedo(20.9);
esconde("#sobre-app", 20.7, 0.2);
mostra("#r0-enviando", 20.9, 0.15);
mira(21.4, 1.0, bAnexar, 1.5, 23.0);
marca(21.6, bAnexar, 22.8);

/* Passo 4 (23 a 31): a página volta com a IA lendo a transcrição. */
tl.to("#pg-prog", { opacity: 0, duration: 0.2 }, 23.0);
tl.fromTo("#pg-proc", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 23.4);
const ROLA_PROC = rolagemPara("proc-rolo", 579.2, "p1-proc", 140);
rola("#proc-rolo", ROLA_PROC, 24.2);
const bProc = alvo("p1-proc", ROLA_PROC);
mira(23.4, 1.8, bProc, 1.35, 27.6);
marca(25.0, bProc, 27.4);
const bAgora = alvo("p1-agora", ROLA_PROC);
mira(27.6, 1.4, bAgora, 1.6, 31.0);
marca(28.4, bAgora, 30.7);

/* Passo 5 (31 a 42): recarregada a página, a ata aparece escrita. */
tl.to("#pg-proc", { opacity: 0, duration: 0.2 }, 31.0);
tl.fromTo("#pg-escrita", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 31.4);
mira(31.4, 1.4, alvo("p2-agora"), 1.4, 33.6);
marca(32.2, alvo("p2-agora"), 33.4);
const ROLA_DISC = rolagemPara("p2-rolo", 579.2, "p2-sc-disc", 24);
rola("#p2-rolo", ROLA_DISC, 33.6);
const bDisc = alvo("p2-di-1", ROLA_DISC);
mira(33.8, 2.0, bDisc, 1.2, 42.0);
marca(36.0, bDisc, 41.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 46 }, 0);
window.__timelines["main"] = tl;
</script>
