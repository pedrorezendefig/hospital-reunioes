  <div class="ch" id="chat"><div class="ch-cab"><span class="ico">${ic("robo", 16)}</span><div><h3>Assistente da Ata</h3><p>Converse para montar a ata</p></div></div>
    <div class="ch-msgs" id="ch-msgs"><div class="ch-rolo" id="ch-rolo">${msg("m0", false, "Vamos montar a ata desta reunião por aqui. Conte o que foi tratado e o que ficou decidido. Eu organizo num resumo e num quadro de ações, perguntando o responsável e o prazo de cada uma. A ata vai tomando forma ao lado; quando estiver boa, é só concluir.")}
      ${msg("m1", true, M1)}<div style="position:relative">${msg("m2", false, "Anotei a ação no quadro. Quem fica responsável por ela, e até quando?")}${pontos("pts")}</div>${msg("m3", true, M3)}<div style="position:relative">${msg("m4", false, "Pronto: Otávio Serra, com prazo em 26/10/2026. Quer acrescentar mais alguma ação?")}${pontos("pts4")}</div>
      </div></div>
    <span class="ch-chip" id="ch-chip">${ic("mira", 12)}Apontando: Resumo Executivo${ic("fechar", 12)}</span>
    <div class="ch-in"><div class="ch-tx" id="ch-tx">Conte o que foi tratado na reunião...<span id="ch-tx-1">${M1}</span><span id="ch-tx-3">${M3}</span></div><span class="ch-bt" id="ch-anexo">${ic("clipe", 16)}</span><span class="ch-bt" id="ch-mic">${ic("mic", 16)}</span><span class="ch-bt env" id="ch-env">${ic("enviar", 16)}<i id="ch-env-off"></i></span></div></div></div>`;
const TELA = `${casca("calendario", { ...RENATA, sino: 1 })}${casca2("", { ...RENATA, sino: 1 })}<div class="corpo"><div class="pg" id="pg-cal"><div class="rolo" id="cal-rolo">${calendario("c0", { eventos: { 13: evCal("Acompanhamento da CME", "09:00 · Coordenação", "ev-programada") } })}</div></div>
  <div class="pg" id="pg-prog" style="opacity:0"><div class="rolo" id="prog-rolo">${programada("r0")}</div></div><div class="pg" id="pg-guiada" style="opacity:0">${guiada}</div>
  <div class="pg" id="pg-cal2" style="opacity:0"><div class="rolo">${calendario("c1", { eventos: { 13: evCal("Acompanhamento da CME", "09:00 · Coordenação", "ev-aprovada") } })}</div></div></div>
  <div class="toast" id="toast"><span class="ok">${ic("checkc", 20)}</span>Ata concluída. 1 pendência(s) gerada(s).<span class="x">${ic("fechar", 16)}</span></div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url" style="position:relative"><span id="url-0" style="position:absolute;left:16px;opacity:1">app.hospitalsaomatheus.cloud/reunioes/calendario</span><span id="url-1" style="position:absolute;left:16px;opacity:0">app.hospitalsaomatheus.cloud/reunioes/MANREU01?from=calendario&year=2026&month=9</span><span id="url-2" style="position:absolute;left:16px;opacity:0">app.hospitalsaomatheus.cloud/reunioes/MANREU01/ata-guiada</span><span id="url-3" style="position:absolute;left:16px;opacity:0">app.hospitalsaomatheus.cloud/reunioes/calendario</span></div></div>
    <div class="vista"><div class="app" id="app">${TELA}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas pelo offset do layout (ignora câmera e rolagem), nunca na montagem: o alvo é
   função que o GSAP chama no início do tween, já com a fonte do app (regra de 14/10/2026). */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id, rolagem) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + (y - rolagem) * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const valor = (v) => (typeof v === "function" ? v() : v);
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, valor(rolagem)))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });
/* Rolagem de um contêiner que deixa o alvo a `margem` px do topo da caixa visível. */
const rolagemPara = (rolo, altura, id, margem = 24) => () => { const r = document.getElementById(rolo); let el = document.getElementById(id), y = 0; while (el && el !== r) { y += el.offsetTop; el = el.offsetParent; } return Math.max(0, Math.min(r.offsetHeight - altura, y - margem)); };

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const rola = (sel, y, t) => tl.to(sel, { y: () => -valor(y), duration: 0.8, ease: "power2.inOut" }, t);
const mostra = (sel, t, d = 0.25) => tl.to(sel, { opacity: 1, duration: d }, t);
const esconde = (sel, t, d = 0.25) => tl.to(sel, { opacity: 0, duration: d }, t);
/* Campo do app: o texto de exemplo dá lugar ao valor, e a borda acende. */
function preenche(base, t) { esconde(`#${base}-vazio`, t, 0.15); mostra(`#${base}-cheio`, t + 0.15, 0.5); }
const aperta = (sel, t) => { tl.to(sel, { scale: 0.97, duration: 0.1 }, t); tl.to(sel, { scale: 1, duration: 0.1 }, t + 0.1); };

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4);
/* O endereço muda quando a tela muda. */
tl.set("#url-0", { opacity: 0 }, 7.6); tl.set("#url-1", { opacity: 1 }, 7.6);
tl.set("#url-1", { opacity: 0 }, 14.6); tl.set("#url-2", { opacity: 1 }, 14.6);
tl.set("#url-2", { opacity: 0 }, 43.7); tl.set("#url-3", { opacity: 1 }, 43.7);

/* Passo 1 (4 a 10): a reunião Programada, pelo cartão no calendário. */
const ROLA_CAL = rolagemPara("cal-rolo", 579.2, "c0-semana-2", 16);
rola("#cal-rolo", ROLA_CAL, 4.6);
const bEv = alvo("c0-ev-13", ROLA_CAL);
mira(4.6, 2.0, bEv, 1.6, 8.0);
marca(6.2, bEv, 7.2);
toca(6.3, bEv); soltaDedo(7.6);
tl.fromTo("#pg-cal", { x: 0, filter: "blur(0px)", opacity: 1 }, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 7.5);
tl.fromTo("#pg-prog", { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 7.8);
mostra("#casca2", 7.6, 0.05);
mira(8.0, 1.6, REPOUSO, 1.0, 10.0);

/* Passo 2 (10 a 17): Iniciar Ata Guiada. A tela dedicada abre. */
const ROLA_G = rolagemPara("prog-rolo", 579.2, "r0-guiada", 40);
rola("#prog-rolo", ROLA_G, 10.2);
const bBloco = alvo("r0-guiada", ROLA_G);
mira(10.4, 1.6, bBloco, 1.35, 13.0);
marca(11.4, bBloco, 12.8);
const bIniciar = alvo("r0-iniciar", ROLA_G);
mira(13.0, 1.0, bIniciar, 1.55, 15.0);
toca(13.2, bIniciar); soltaDedo(14.6);
tl.fromTo("#pg-prog", { x: 0, filter: "blur(0px)" }, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 14.5);
tl.fromTo("#pg-guiada", { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 14.8);
mira(15.0, 1.4, REPOUSO, 1.0, 17.0);
/* A página desce até o assistente caber inteiro; o topo da Ata Guiada fica preso no alto. */
tl.to("#ag-grade", { y: -58, duration: 0.8, ease: "power2.inOut" }, 16.0);
tl.to("#ag-topo", { y: -32, duration: 0.45, ease: "power2.in" }, 16.0);

/* Passo 3 (17 a 26): contar o que foi tratado, por texto ou por voz. */
const G = 58;
const bMic = alvo("ch-mic", G);
mira(17.0, 1.4, alvo("chat", G), 1.1, 26.0);
marca(17.8, bMic, 19.2);
const bTx = alvo("ch-tx", G);
toca(19.3, bTx, bMic);
mostra("#ch-tx-1", 20.3, 0.5); esconde("#ch-env-off", 20.3, 0.2);
toca(21.2, alvo("ch-env", G), bTx);
esconde("#ch-tx-1", 22.15, 0.1); tl.to("#ch-env-off", { opacity: 1, duration: 0.1 }, 22.15);
mostra("#m1", 22.2, 0.3);
mostra("#pts", 22.5, 0.2); soltaDedo(22.6);
const ROLA_M2 = rolagemPara("ch-rolo", 393, "m2", 393 - 110);
esconde("#pts", 24.0, 0.15);
rola("#ch-rolo", ROLA_M2, 22.3);
mostra("#m2", 24.1, 0.3);
esconde("#av0", 24.1, 0.2); mostra("#av1", 24.2, 0.4); esconde("#ag-concluir-off", 24.2, 0.3);
marca(24.6, alvo("av1-quadro", G), 25.8);

/* Passo 4 (26 a 34): responder quem faz e até quando. */
toca(26.2, bTx);
mostra("#ch-tx-3", 27.2, 0.4); esconde("#ch-env-off", 27.2, 0.2);
toca(27.8, alvo("ch-env", G), bTx);
esconde("#ch-tx-3", 28.75, 0.1); tl.to("#ch-env-off", { opacity: 1, duration: 0.1 }, 28.75);
const ROLA_M3 = rolagemPara("ch-rolo", 393, "m3", 393 - 60);
rola("#ch-rolo", ROLA_M3, 28.6);
mostra("#m3", 28.8, 0.3); soltaDedo(29.2);
const ROLA_M4 = rolagemPara("ch-rolo", 393, "m4", 393 - 100);
rola("#ch-rolo", ROLA_M4, 30.0);
mostra("#pts4", 29.4, 0.2);
esconde("#pts4", 30.5, 0.12);
mostra("#m4", 30.6, 0.3);
esconde("#av1", 30.6, 0.2); mostra("#av2", 30.6, 0.3);
mira(30.8, 1.4, alvo("av2-quadro", G), 1.35, 34.0);
marca(31.6, alvo("av2-quadro", G), 33.7);

/* Passo 5 (34 a 41): Apontar para esta seção, para mudar um trecho pronto. */
const bAlvo = alvo("av2-alvo", G);
mira(34.0, 1.4, alvo("av2-resumo", G), 1.4, 37.4);
toca(34.6, bAlvo); soltaDedo(36.2);
mostra("#av2-alvo-on", 35.55, 0.1);
marca(35.8, bAlvo, 37.2);
tl.set("#ch-msgs", { height: 361 }, 35.55);
mostra("#ch-chip", 35.55, 0.15);
mira(37.4, 1.2, alvo("ch-chip", G), 1.5, 41.0);

/* Passo 6 (41 a 50): Concluir e gerar pendências. */
const bConcluir = alvo("ag-concluir", 32);
mira(41.0, 1.4, bConcluir, 1.5, 44.2);
toca(41.8, bConcluir); soltaDedo(43.4);
aperta("#ag-concluir", 42.75);
tl.fromTo("#pg-guiada", { x: 0, filter: "blur(0px)" }, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 43.6);
tl.fromTo("#pg-cal2", { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 43.9);
esconde("#casca2", 43.7, 0.05);
tl.fromTo("#toast", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 44.2);
const bToast = alvo("toast");
mira(44.2, 1.4, bToast, 1.4, 50.0);
marca(45.4, bToast, 49.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 54 }, 0);
window.__timelines["main"] = tl;
</script>
