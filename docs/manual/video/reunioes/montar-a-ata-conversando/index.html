ht:1.5">Vamos montar a ata. Me conte o que foi tratado na reunião.</div></div><div style="display:flex;justify-content:flex-end;margin-bottom:6px"><div style="background:#2B2E7E;color:#fff;border-radius:7px;padding:5px 6px;font-size:6.2px;line-height:1.5;max-width:82%">Revisamos a escala da enfermagem e decidimos antecipar a compra do oxímetro.</div></div><div style="display:flex;gap:4px;margin-bottom:6px"><span style="width:12px;height:12px;border-radius:5px;background:rgba(43,46,126,.08);color:#2B2E7E;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></span><div style="background:#F1F5F9;border-radius:7px;padding:5px 6px;font-size:6.2px;color:#334155;line-height:1.5">Anotei. Quem fica responsável pela escala nova, e até quando?</div></div></div><div style="padding:6px;border-top:1px solid #F1F5F9"><div style="position:relative"><div id="c-ag-caixa" style="position:relative;border:1px solid #E2E8F0;border-radius:7px;background:#F8FAFC;padding:5px 6px;min-height:30px;font-size:6.2px;line-height:1.45"><span id="c-ag-ph" style="position:absolute;left:6px;right:6px;top:5px;color:#626D80">Conte o que foi tratado na reunião...</span><span id="c-ag-digitado" data-layout-allow-overlap style="position:absolute;left:6px;right:6px;top:5px;color:#1E293B;opacity:0">Revisamos a escala da enfermagem e decidimos antecipar a compra do oxímetro.</span></div><div style="display:flex;align-items:center;gap:4px;margin-top:4px;justify-content:flex-end"><span id="c-ag-clipe" style="color:#626D80"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span><span id="c-ag-mic" style="color:#626D80"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span><span style="width:12px;height:12px;border-radius:5px;background:#2B2E7E;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span></div></div></div></div></div></div></div><div class="rodape-v">Manual · retrata o app em v0.142.1 · gerado em 17/09/2026</div><div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1" style="top:150px"><div class="n">1</div><h3>Abra a reunião Programada pelo Calendário</h3><p>No bloco <b>Ata Guiada</b>, clique em <b>Iniciar Ata Guiada</b>.</p></div><div class="passo" id="p2" style="top:150px"><div class="n">2</div><h3>A tela abre dividida</h3><p>A ata em branco fica à esquerda e o <b>Assistente da Ata</b> à direita.</p></div><div class="passo" id="p3" style="top:150px"><div class="n">3</div><h3>Conte o que foi tratado</h3><p>Escreva na caixa, ou use o microfone para <b>Ditar por voz</b> e falar. O texto cai no campo para você revisar.</p></div><div class="passo" id="p4" style="top:150px"><div class="n">4</div><h3>O resumo e o quadro tomam forma ao vivo</h3><p>Responda o que ele perguntar: ele insiste em quem faz cada ação e até quando.</p></div><div class="passo" id="p5" style="top:150px"><div class="n">5</div><h3>Aponte um trecho ou anexe apoio</h3><p>O clipe anexa um documento de apoio; a mira aponta para uma seção pronta.</p></div><div class="passo" id="p6" style="top:150px"><div class="n">6</div><h3>Clique em Concluir e gerar pendências</h3><p>Esta ata termina sem assinatura digital.</p></div>`;

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
/* Campo do app: o placeholder dá lugar ao valor, e a borda acende. */
const digita = (base, t) => {
  tl.to(base + "-ph", { opacity: 0, duration: 0.15 }, t);
  tl.to(base + "-val", { opacity: 1, duration: 0.22 }, t + 0.15);
  tl.to(base, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
/* Troca o texto de um rótulo no meio do passo (Lembrar → Enviado). */
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
/* Acende a borda de um bloco (coluna de destino, cartão em foco). */
const acende = (sel, t, cor) => tl.to(sel, { borderColor: cor || "#2B2E7E", duration: 0.25 }, t);

/* ── Ancoragem ao elemento, em vez de coordenada escrita à mão ──────────────
   O marcador nasce DENTRO do alvo e o dedo lê a posição do alvo no palco:
   assim nenhum dos dois pode apontar o campo de cima. Medidas por offset*,
   que ignoram o scale(2) do palco e não dependem da fonte ter carregado. */
const PALCO = document.getElementById("palco-tarefa");
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
/* Cria o marcador colado no alvo e devolve o seletor dele. */
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;   // dois passos no mesmo alvo reusam o marcador
  const el = document.getElementById(idAlvo);
  const antes = getComputedStyle(el).position;
  if (antes === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  // Alvo de ícone é pequeno: sem folga maior o contorno some na tela.
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 5 : 3;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
/* Ponto que o dedo toca: o centro do alvo, descontando a ponta do cursor. */
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* Encosta um flutuante (menu, lista de nomes) embaixo do alvo que o abre.
   Vira filho do alvo, como o marcador: medida nenhuma pode errar o lugar. */
function abaixoDe(idFlutuante, idAlvo, dx) {
  const alvo = document.getElementById(idAlvo);
  const f = document.getElementById(idFlutuante);
  if (getComputedStyle(alvo).position === "static") alvo.style.position = "relative";
  alvo.appendChild(f);
  f.style.left = (dx || 0) + "px";
  f.style.top = "calc(100% + 3px)";
}
/* O dedo sai de `de` e toca `para`, com marcador e pulso no compasso do passo.
   Sem `de`, entra pela borda de baixo do palco. */
function toca(t, para, de) {
  const a = ponto(para);
  const b = de ? ponto(de) : { x: a.x + 34, y: Math.min(a.y + 70, 458) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota('#p1', 4.90, 9.55);
nota('#p2', 9.90, 14.55);
nota('#p3', 14.90, 19.55);
nota('#p4', 19.90, 24.55);
nota('#p5', 24.90, 29.55);
nota('#p6', 29.90, 34.55);


/* passo 1: o bloco e o botão da Ata Guiada */
toca(5.4, "bt-guiada");
aperta("#bt-guiada", 6.5);
esconde("#mk-bt-guiada", 7.7);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 7.9);

/* passo 2: a tela dedicada abre, ata em branco à esquerda, assistente à direita */
tl.to("#v-tela-guiada", { opacity: 1, duration: 0.25 }, 10.1);
mostra(marcaEm("v-ag-vazio"), 11.1);
mostra(marcaEm("v-ag-chat"), 11.1);
esconde("#mk-v-ag-vazio", 13.5);
esconde("#mk-v-ag-chat", 13.5);

/* passo 3: escrever ou ditar */
toca(15.2, "v-ag-caixa");
tl.to("#v-ag-ph", { opacity: 0, duration: 0.15 }, 16.4);
tl.to("#v-ag-digitado", { opacity: 1, duration: 0.25 }, 16.55);
esconde("#mk-v-ag-caixa", 17.3);
toca(17.5, "v-ag-mic", "v-ag-caixa");
esconde("#mk-v-ag-mic", 19.3);

/* passo 4: a ata cheia entra no lugar da vazia */
tl.to("#c-tela-guiada", { opacity: 1, duration: 0.25 }, 20.2);
tl.set("#v-tela-guiada", { opacity: 0 }, 20.5);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 20.2);
mostra(marcaEm("c-ag-cheio"), 21.1);
esconde("#mk-c-ag-cheio", 23.7);

/* passo 5: clipe e mira */
toca(25.3, "c-ag-clipe");
esconde("#mk-c-ag-clipe", 27.1);
toca(27.3, "c-ag-mira", "c-ag-clipe");
esconde("#mk-c-ag-mira", 29.2);

/* passo 6: concluir */
toca(30.3, "c-bt-concluir", "c-ag-mira");
aperta("#c-bt-concluir", 31.5);
esconde("#mk-c-bt-concluir", 32.7);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 32.9);


/* 3 · Fecho */
surge("#fc-titulo", 36.30, 18);
surge("#fc-carimbo", 36.80, 14);
surge("#fc-org", 37.20, 12);

window.__timelines.main = tl;
</script>
