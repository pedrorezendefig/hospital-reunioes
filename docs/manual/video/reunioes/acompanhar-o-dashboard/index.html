const ms = (rot, txt, id = "") => `<div class="pd-c"${id ? ` id="${id}"` : ""}><small>${rot}</small><div class="pd-ms"><span>${txt}</span><span>${ic("baixo", 16)}</span></div></div>`;
function listaPend(p, o = {}) {
  const linhas = (o.linhas || PENDENCIAS.map((x, i) => i)).map((i) => linhaPend(p, i, PENDENCIAS[i], (o.extra || {})[i])).join("");
  return `<div class="pd"><div class="pd-cab"><div><h1>Pendências</h1><p>Acompanhamento dinâmico hierárquico e por setor</p></div><div class="pd-vis"><span class="on">${ic("listacheck", 16)}Lista</span><span id="${p}-kanban">${ic("grade", 16)}Kanban</span></div></div>
  <div class="pd-fil" id="${p}-fil"><div class="tt">${ic("filtro", 16)}<span>Filtros Dinâmicos</span>${o.ativos ? '<span style="margin-left:4px;padding:2px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;background:color-mix(in srgb, var(--color-primary) 10%, transparent);color:var(--color-primary)">Ativos</span>' : ""}</div>
    <div class="pd-grade">${ms("Setor", "Todos os Setores")}${ms("Responsável", "Equipe Inteira")}${ms("Facilitador", "Todos os Facilitadores", `${p}-fac`)}<div class="pd-c" id="${p}-de"><small>A partir de</small><div class="pd-dt">dd/mm/aaaa${ic("cal", 14)}</div></div><div class="pd-c" id="${p}-ate"><small>Até</small><div class="pd-dt">dd/mm/aaaa${ic("cal", 14)}</div></div><div class="pd-limpar">Limpar Filtros</div></div></div>
  <div class="pd-st">${ms("Status", `Todos os status (${o.total || 7})`, `${p}-status`)}${o.criticas ? `<span class="pd-crit" id="${p}-crit">${ic("alertac", 16)}Críticas<i>2</i></span>` : ""}</div>
  <div class="pd-tab" id="${p}-tab"><table><thead><tr id="${p}-cab">${["Ação / Tarefa", "Responsável", "Setor", "Reunião", "Prazo", "Status", ""].map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${linhas}</tbody></table></div></div>`;
}

/* As cores do gráfico, pelo token mais perto do valor do app. */
const COR = { Pendente: "var(--color-amber-300)", "Em Progresso": "var(--color-sky-300)", "Concluído": "var(--color-green-300)", Atrasado: "var(--color-red-300)", Repactuada: "var(--color-violet-300)" };
const PIZZA = [["Pendente", 2], ["Em Progresso", 1], ["Concluído", 1], ["Atrasado", 1], ["Repactuada", 1]];
function rosca() {
  const C = 2 * Math.PI * 95, folga = 3 / 360 * C; let ini = 0;
  const arcos = PIZZA.map(([n, v]) => { const tam = v / 6 * C; const a = `<circle cx="130" cy="130" r="95" fill="none" stroke="${COR[n]}" stroke-width="40" stroke-dasharray="${tam - folga} ${C}" stroke-dashoffset="${-ini}" transform="rotate(-90 130 130)"/>`; ini += tam; return a; }).join("");
  return `<div class="rosca"><svg width="260" height="260">${arcos}</svg><div class="meio"><b>6</b><span>pendências</span></div></div>`;
}
const barra = (top, setor, partes) => `<div class="barra" style="top:${top}px"><small>${setor}</small>${partes.map(([n, v]) => `<i style="width:${v * 100}px;background:${COR[n]}"></i>`).join("")}</div>`;
const graficos = `<div class="db-graf"><div class="gf" id="g-status"><h2>Status das Pendências</h2><p>Visão geral por situação</p>${rosca()}<div class="leg">${PIZZA.map(([n, v]) => `<span><i style="background:${COR[n]}"></i>${n} <em>(${v})</em></span>`).join("")}</div></div>
  <div class="gf" id="g-setor"><h2>Pendências por Setor</h2><p>Distribuição de status por departamento</p><div class="barras">${barra(30, "CME", [["Pendente", 2], ["Atrasado", 1]])}${barra(115, "UTI Adulto", [["Em Progresso", 1], ["Repactuada", 1]])}${barra(200, "Farmácia", [["Concluído", 1]])}
    ${[0, 0.75, 1.5, 2.25, 3].map((v) => `<span class="eixo" style="left:${v * 100}px">${v}</span>`).join("")}</div><div class="leg2">${Object.keys(COR).map((n) => `<span style="color:${COR[n]}"><i style="background:${COR[n]}"></i>${n}</span>`).join("")}</div></div></div>`;
const filtros = `<div class="db-fil" id="db-fil"><div class="tt">${ic("filtro", 16)}<span>Filtros Dinâmicos de Desempenho</span></div><div class="pd-grade">${ms("Setor", "Todos os Setores")}${ms("Responsável", "Equipe Inteira")}<div class="pd-c"><small>A partir de</small><div class="pd-dt">dd/mm/aaaa${ic("cal", 14)}</div></div><div class="pd-c"><small>Até</small><div class="pd-dt">dd/mm/aaaa${ic("cal", 14)}</div></div><div class="pd-limpar">Restaurar</div></div></div>`;
const painel = () => painelTopo().replace(/<\/div><\/div>$/, `</div>${filtros}${graficos}</div>`);
const TELA = `${casca("calendario", { ...RENATA, sino: 1 })}${casca2("dashboard", { ...RENATA, sino: 1 })}${casca2("lista", { ...RENATA, sino: 1 }, "c-", "menu-c")}
  <div class="corpo"><div class="pg" id="pg-cal"><div class="rolo">${calendario("c0")}</div></div><div class="pg" id="pg-db" style="opacity:0"><div class="rolo" id="db-rolo">${painel()}</div></div>
  <div class="pg" id="pg-crit" style="opacity:0"><div class="rolo">${listaPend("l1", { linhas: [0, 2], criticas: true, ativos: true })}</div></div></div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url" style="position:relative"><span id="url-0" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1">app.hospitalsaomatheus.cloud/reunioes/calendario</span><span id="url-1" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0">app.hospitalsaomatheus.cloud/dashboard</span><span id="url-2" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0">app.hospitalsaomatheus.cloud/pendencias?criticas=true</span><span id="url-3" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0">app.hospitalsaomatheus.cloud/dashboard</span></div></div>
    <div class="vista"><div class="app" id="app">${TELA}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas pelo offset do layout (ignora câmera e rolagem), nunca na montagem: o alvo é
   função que o GSAP chama no início do tween, já com a fonte do app (regra de 14/10/2026). */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.0811, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id, rolagem) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + (y - rolagem) * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const valor = (v) => (typeof v === "function" ? v() : v);
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, valor(rolagem)))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });
/* Rolagem de um contêiner que deixa o alvo a `margem` px do topo da caixa visível. */
const rolagemPara = (rolo, altura, id, margem = 24) => () => { const r = document.getElementById(rolo); let el = document.getElementById(id), y = 0; while (el && el !== r) { y += el.offsetTop; el = el.offsetParent; } return Math.max(0, Math.min(r.offsetHeight - altura, y - margem)); };

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const rola = (sel, y, t) => tl.to(sel, { y: () => -valor(y), duration: 0.8, ease: "power2.inOut" }, t);
const mostra = (sel, t, d = 0.25) => tl.to(sel, { opacity: 1, duration: d }, t);
const esconde = (sel, t, d = 0.25) => tl.to(sel, { opacity: 0, duration: d }, t);
/* Campo do app: o texto de exemplo dá lugar ao valor, e a borda acende. */
function preenche(base, t) { esconde(`#${base}-vazio`, t, 0.15); mostra(`#${base}-cheio`, t + 0.15, 0.5); }
const aperta = (sel, t) => { tl.to(sel, { scale: 0.97, duration: 0.1 }, t); tl.to(sel, { scale: 1, duration: 0.1 }, t + 0.1); };

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4);
/* O endereço muda quando a tela muda. */
tl.set("#url-0", { opacity: 0 }, 6.65); tl.set("#url-1", { opacity: 1 }, 6.65);
tl.set("#url-1", { opacity: 0 }, 17.35); tl.set("#url-2", { opacity: 1 }, 17.35);
tl.set("#url-2", { opacity: 0 }, 22.35); tl.set("#url-3", { opacity: 1 }, 22.35);

const sai = (de, para, t) => { tl.to(de, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, t); tl.fromTo(para, { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, t + 0.3); };
/* Passo 1 (4 a 10): Dashboard, no menu. A tela abre com Olá e o seu nome. */
const bDash = alvo("mi-dashboard b-mi-dashboard");
mira(4.4, 1.8, bDash, 1.6, 7.6);
marca(5.6, bDash, 7.1);
toca(5.7, bDash); soltaDedo(7.2);
mostra("#casca2", 6.65, 0.05);
sai("#pg-cal", "#pg-db", 6.7);
mira(7.6, 1.4, alvo("db-rolo"), 1.0, 10.0);

/* Passo 2 (10 a 16): os quatro números do alto. */
const bKpis = alvo("k-conf k-vencem k-paradas k-assin");
mira(10.0, 1.4, bKpis, 1.15, 16.0);
marca(11.0, bKpis, 15.7);

/* Passo 3 (16 a 23): Vencem em 3 dias abre a lista só com as críticas. */
const bCard = alvo("k-vencem");
mira(16.0, 1.2, bCard, 1.5, 18.4);
toca(16.4, bCard); soltaDedo(17.8);
mostra("#menu-c", 17.35, 0.05);
sai("#pg-db", "#pg-crit", 17.4);
const bCrit = alvo("l1-crit");
mira(18.4, 1.4, alvo("l1-crit l1-tab"), 1.05, 21.6);
marca(19.2, bCrit, 21.3);
toca(21.4, alvo("c-mi-dashboard"), bCrit); soltaDedo(22.8);
esconde("#menu-c", 22.35, 0.05);
sai("#pg-crit", "#pg-db", 22.4);

/* Passo 4 (23 a 30): Status das Pendências, a divisão por situação. */
const ROLA_G = rolagemPara("db-rolo", 679.7, "g-status", 24);
rola("#db-rolo", ROLA_G, 23.2);
const bPizza = alvo("g-status", ROLA_G);
mira(23.2, 1.6, bPizza, 1.25, 30.0);
marca(25.0, bPizza, 29.7);

/* Passo 5 (30 a 37): Pendências por Setor, com as mesmas cores. */
const bSetor = alvo("g-setor", ROLA_G);
mira(30.0, 1.6, bSetor, 1.25, 37.0);
marca(31.6, bSetor, 36.7);

/* Passo 6 (37 a 46): Filtros Dinâmicos de Desempenho, para recortar tudo de uma vez. */
const ROLA_F = rolagemPara("db-rolo", 679.7, "db-fil", 80);
rola("#db-rolo", ROLA_F, 37.0);
const bFil = alvo("db-fil", ROLA_F);
mira(37.0, 1.6, bFil, 1.2, 46.0);
marca(38.6, bFil, 45.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 50 }, 0);
window.__timelines["main"] = tl;
</script>
</body>
</html>
