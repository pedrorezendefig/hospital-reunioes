>Todos os status (2)</span></div><span id="cr-chip-filtro" style="display:inline-flex;align-items:center;gap:3px;background:#FFE4E6;color:#BE123C;border-radius:999px;padding:2px 7px;font-size:5.8px;font-weight:700"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Críticas<span style="background:rgba(255,255,255,.6);border-radius:999px;padding:0 3px">2</span></span></div><div class="cartao" id="cr-bl-tabela" style="margin-top:6px"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#F8FAFC;border-bottom:1px solid #F1F5F9"><th style="padding:3.5px 6px;text-align:left;font-size:5px;font-weight:700;color:#626D80;text-transform:uppercase;letter-spacing:.06em">Ação / Tarefa</th><th style="padding:3.5px 6px;text-align:left;font-size:5px;font-weight:700;color:#626D80;text-transform:uppercase;letter-spacing:.06em">Responsável</th><th style="padding:3.5px 6px;text-align:left;font-size:5px;font-weight:700;color:#626D80;text-transform:uppercase;letter-spacing:.06em">Setor</th><th style="padding:3.5px 6px;text-align:left;font-size:5px;font-weight:700;color:#626D80;text-transform:uppercase;letter-spacing:.06em">Reunião</th><th style="padding:3.5px 6px;text-align:left;font-size:5px;font-weight:700;color:#626D80;text-transform:uppercase;letter-spacing:.06em">Prazo</th><th style="padding:3.5px 6px;text-align:left;font-size:5px;font-weight:700;color:#626D80;text-transform:uppercase;letter-spacing:.06em">Status</th></tr></thead><tbody><tr id="cr-linha-0" style="border-top:1px solid #F8FAFC"><td style="padding:4.5px 6px;font-size:6.2px;color:#334155;line-height:1.35">Apresentar a escala nova da enfermagem</td><td style="padding:4.5px 6px"><div style="font-size:6.2px;color:#334155;font-weight:600">Marina Alves</div></td><td style="padding:4.5px 6px"><span style="background:#F1F5F9;color:#475569;border-radius:3px;padding:1px 4px;font-size:5.4px;font-weight:600">Coordenação</span></td><td style="padding:4.5px 6px;color:#626D80"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></td><td style="padding:4.5px 6px;white-space:nowrap"><span style="font-size:6px;color:#475569">19/09/2026</span></td><td style="padding:4.5px 6px"><span class="selo" id="cr-selo-0" style="background:#FFC06733;color:#D99B4B"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Pendente</span></td></tr><tr id="cr-linha-1" style="border-top:1px solid #F8FAFC"><td style="padding:4.5px 6px;font-size:6.2px;color:#334155;line-height:1.35">Revisar o fluxo de alta hospitalar</td><td style="padding:4.5px 6px"><div style="font-size:6.2px;color:#334155;font-weight:600">Helena Duarte</div></td><td style="padding:4.5px 6px"><span style="background:#F1F5F9;color:#475569;border-radius:3px;padding:1px 4px;font-size:5.4px;font-weight:600">Enfermagem</span></td><td style="padding:4.5px 6px;color:#626D80"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></td><td style="padding:4.5px 6px;white-space:nowrap"><span style="font-size:6px;color:#475569">10/09/2026</span></td><td style="padding:4.5px 6px"><span class="selo" id="cr-selo-1" style="background:#FC9D9D33;color:#D32F2F"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Atrasado</span></td></tr></tbody></table></div></div></div></div><div class="rodape-v">Manual · retrata o app em v0.142.1 · gerado em 17/09/2026</div><div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1" style="top:150px"><div class="n">1</div><h3>No menu, clique em Dashboard</h3><p>A tela abre com <b>Olá</b> e o seu nome.</p></div><div class="passo" id="p2" style="top:150px"><div class="n">2</div><h3>Leia os quatro números do alto</h3><p><b>Conformidade</b>, <b>Vencem em 3 dias</b>, <b>Atas Paradas</b> e <b>Aguardam Assinatura</b>. Todos são clicáveis.</p></div><div class="passo" id="p3" style="top:150px"><div class="n">3</div><h3>Clique em Vencem em 3 dias</h3><p>Você cai na lista de pendências já filtrada pelas críticas.</p></div><div class="passo" id="p4" style="top:150px"><div class="n">4</div><h3>Em Status das Pendências, veja a divisão</h3><p><b>Pendente</b>, <b>Em Progresso</b>, <b>Concluído</b>, <b>Atrasado</b> e <b>Repactuada</b>.</p></div><div class="passo" id="p5" style="top:150px"><div class="n">5</div><h3>Em Pendências por Setor, compare os setores</h3><p>As barras usam as mesmas cores do gráfico de cima.</p></div><div class="passo" id="p6" style="top:150px"><div class="n">6</div><h3>Para recortar tudo de uma vez, use os filtros</h3><p><b>Filtros Dinâmicos de Desempenho</b>: setor, responsável e o intervalo entre <b>A partir de</b> e <b>Até</b>.</p></div>`;

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
/* Campo do app: o placeholder dá lugar ao valor, e a borda acende. */
const digita = (base, t) => {
  tl.to(base + "-ph", { opacity: 0, duration: 0.15 }, t);
  tl.to(base + "-val", { opacity: 1, duration: 0.22 }, t + 0.15);
  tl.to(base, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
/* Troca o texto de um rótulo no meio do passo (Lembrar → Enviado). */
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
/* Acende a borda de um bloco (coluna de destino, cartão em foco). */
const acende = (sel, t, cor) => tl.to(sel, { borderColor: cor || "#2B2E7E", duration: 0.25 }, t);

/* ── Ancoragem ao elemento, em vez de coordenada escrita à mão ──────────────
   O marcador nasce DENTRO do alvo e o dedo lê a posição do alvo no palco:
   assim nenhum dos dois pode apontar o campo de cima. Medidas por offset*,
   que ignoram o scale(2) do palco e não dependem da fonte ter carregado. */
const PALCO = document.getElementById("palco-tarefa");
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
/* Cria o marcador colado no alvo e devolve o seletor dele. */
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;   // dois passos no mesmo alvo reusam o marcador
  const el = document.getElementById(idAlvo);
  const antes = getComputedStyle(el).position;
  if (antes === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  // Alvo de ícone é pequeno: sem folga maior o contorno some na tela.
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 5 : 3;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
/* Ponto que o dedo toca: o centro do alvo, descontando a ponta do cursor. */
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* Encosta um flutuante (menu, lista de nomes) embaixo do alvo que o abre.
   Vira filho do alvo, como o marcador: medida nenhuma pode errar o lugar. */
function abaixoDe(idFlutuante, idAlvo, dx) {
  const alvo = document.getElementById(idAlvo);
  const f = document.getElementById(idFlutuante);
  if (getComputedStyle(alvo).position === "static") alvo.style.position = "relative";
  alvo.appendChild(f);
  f.style.left = (dx || 0) + "px";
  f.style.top = "calc(100% + 3px)";
}
/* O dedo sai de `de` e toca `para`, com marcador e pulso no compasso do passo.
   Sem `de`, entra pela borda de baixo do palco. */
function toca(t, para, de) {
  const a = ponto(para);
  const b = de ? ponto(de) : { x: a.x + 34, y: Math.min(a.y + 70, 458) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota('#p1', 4.90, 9.55);
nota('#p2', 9.90, 14.55);
nota('#p3', 14.90, 19.55);
nota('#p4', 19.90, 24.55);
nota('#p5', 24.90, 29.55);
nota('#p6', 29.90, 34.55);


/* passo 1: o menu */
toca(5.3, "mi-dashboard");
esconde("#mk-mi-dashboard", 8.3);

/* passo 2: os quatro números */
tl.to("#g1", { opacity: 0, duration: 0.2 }, 10.1);
mostra(marcaEm("kpi-0"), 10.4);
mostra(marcaEm("kpi-1"), 10.8);
mostra(marcaEm("kpi-2"), 11.2);
mostra(marcaEm("kpi-3"), 11.6);
esconde("#mk-kpi-0", 14.2);
esconde("#mk-kpi-2", 14.2);
esconde("#mk-kpi-3", 14.2);

/* passo 3: clicar em Vencem em 3 dias e cair na lista filtrada */
toca(15.2, "kpi-1");
aperta("#kpi-1", 16.3);
esconde("#mk-kpi-1", 16.8);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 16.8);
tl.to("#cr-tela-lista", { opacity: 1, duration: 0.25 }, 17.0);
mostra(marcaEm("cr-bl-tabela"), 17.7);
esconde("#mk-cr-bl-tabela", 19.2);
tl.to("#cr-tela-lista", { opacity: 0, duration: 0.25 }, 19.4);

/* passo 4: o gráfico de status */
mostra(marcaEm("g-status"), 20.4);
esconde("#mk-g-status", 24.2);

/* passo 5: as barras por setor */
mostra(marcaEm("g-setor"), 25.4);
esconde("#mk-g-setor", 29.2);

/* passo 6: os filtros */
toca(30.3, "db-filtros");
esconde("#mk-db-filtros", 33.3);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 33.5);


/* 3 · Fecho */
surge("#fc-titulo", 36.30, 18);
surge("#fc-carimbo", 36.80, 14);
surge("#fc-org", 37.20, 12);

window.__timelines.main = tl;
</script>
