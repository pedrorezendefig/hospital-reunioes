  const cols = ORDEM.map((s) => { const ids = PENDENCIAS.map((x, i) => i).filter((i) => est(i) === s);
    return `<div class="kb-col" id="${p}-col-${s}">${s === "EM_PROGRESSO" ? `<div class="kb-sobre" id="${p}-sobre"></div>` : ""}<div class="kb-cab kb-${s}" id="${p}-cab-${s}"><span>${ic(ESTADOS[s][0], 16, 2.5)}${ESTADOS[s][1]}</span><i>${ids.length}</i></div><div class="kb-lista">${ids.length ? ids.map((i) => cartao(p, i, PENDENCIAS[i])).join("") : '<div class="kb-solte">Solte aqui</div>'}</div></div>`; }).join("");
  return `<div class="pd"><div class="pd-cab"><div><h1>Kanban</h1><p>Arraste os cards para alterar o status das pendências</p></div><div class="pd-vis"><span>${ic("lista", 16)}Lista</span><span class="on">${ic("grade", 16)}Kanban</span></div></div>
  <div class="pd-fil" id="${p}-fil"><div class="tt">${ic("filtro", 16)}<span>Filtros Dinâmicos</span></div><div class="pd-grade">${ms("Setor", "Todos os Setores")}${ms("Responsável", "Equipe Inteira")}${ms("Facilitador", "Todos os Facilitadores")}<div class="pd-c"><small>A partir de</small><div class="pd-dt">dd/mm/aaaa${ic("cal", 14)}</div></div><div class="pd-c"><small>Até</small><div class="pd-dt">dd/mm/aaaa${ic("cal", 14)}</div></div><div class="pd-limpar">Limpar Filtros</div></div></div>
  <div style="overflow:hidden"><div class="kb-cols" id="${p}-cols">${cols}</div></div></div>`;
}
const MENU_ABERTO = { ...RENATA, sino: 1, aberto: true };
const TELA = `${casca("dashboard", { ...RENATA, sino: 1 })}${casca2("dashboard", MENU_ABERTO, "b-", "menu-b")}${casca2("kanban", { ...RENATA, sino: 1 }, "c-", "menu-c")}
  <div class="corpo"><div class="pg" id="pg-painel">${painelTopo()}</div><div class="pg" id="pg-k0" style="opacity:0"><div class="rolo" id="k0-rolo">${quadroKb("k0")}</div></div>
  <div class="pg" id="pg-k1" style="opacity:0"><div class="rolo" id="k1-rolo">${quadroKb("k1", 2)}</div></div></div>
  <div class="sobre-app" id="sobre-fantasma" style="opacity:1"><div class="kb-fantasma" id="fantasma">${cartao("f", 2, PENDENCIAS[2])}</div></div>
  <div class="sobre-app" id="sobre-app">${janelaPend("dm", [...PENDENCIAS[2].slice(0, 6), "EM_PROGRESSO"])}</div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url" style="position:relative"><span id="url-0" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1">app.hospitalsaomatheus.cloud/dashboard</span><span id="url-1" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0">app.hospitalsaomatheus.cloud/pendencias/kanban</span></div></div>
    <div class="vista"><div class="app" id="app">${TELA}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas pelo offset do layout (ignora câmera e rolagem), nunca na montagem: o alvo é
   função que o GSAP chama no início do tween, já com a fonte do app (regra de 14/10/2026). */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.0811, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id, rolagem) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + (y - rolagem) * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const valor = (v) => (typeof v === "function" ? v() : v);
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, valor(rolagem)))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });
/* Rolagem de um contêiner que deixa o alvo a `margem` px do topo da caixa visível. */
const rolagemPara = (rolo, altura, id, margem = 24) => () => { const r = document.getElementById(rolo); let el = document.getElementById(id), y = 0; while (el && el !== r) { y += el.offsetTop; el = el.offsetParent; } return Math.max(0, Math.min(r.offsetHeight - altura, y - margem)); };

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const rola = (sel, y, t) => tl.to(sel, { y: () => -valor(y), duration: 0.8, ease: "power2.inOut" }, t);
const mostra = (sel, t, d = 0.25) => tl.to(sel, { opacity: 1, duration: d }, t);
const esconde = (sel, t, d = 0.25) => tl.to(sel, { opacity: 0, duration: d }, t);
/* Campo do app: o texto de exemplo dá lugar ao valor, e a borda acende. */
function preenche(base, t) { esconde(`#${base}-vazio`, t, 0.15); mostra(`#${base}-cheio`, t + 0.15, 0.5); }
const aperta = (sel, t) => { tl.to(sel, { scale: 0.97, duration: 0.1 }, t); tl.to(sel, { scale: 1, duration: 0.1 }, t + 0.1); };

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4);
/* O endereço muda quando a tela muda. */
tl.set("#url-0", { opacity: 0 }, 7.75); tl.set("#url-1", { opacity: 1 }, 7.75);

const sai = (de, para, t) => { tl.to(de, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, t); tl.fromTo(para, { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, t + 0.3); };
/* Do quadro (frame) para o app (o cartão fantasma é desenhado dentro do app). */
const naApp = (r) => ({ x: (r.x - APP_X) / ESCALA_APP, y: (r.y - APP_Y) / ESCALA_APP });
/* Passo 1 (4 a 10): Reuniões e metas, Pendências, Kanban. */
const bPend = alvo("mi-pendencias");
mira(4.4, 1.8, bPend, 1.6, 8.6);
toca(5.0, bPend);
mostra("#menu-b", 5.95, 0.05);
const bKb = alvo("b-mi-kanban");
toca(6.8, bKb, bPend); soltaDedo(8.2);
marca(7.0, bKb, 7.7);
mostra("#menu-c", 7.75, 0.05);
sai("#pg-painel", "#pg-k0", 7.8);
mira(8.6, 1.4, REPOUSO, 1.0, 10.0);

/* Passo 2 (10 a 17): as seis colunas, sempre na mesma ordem. */
const ROLA_KB = rolagemPara("k0-rolo", 679.7, "k0-cols", 8);
rola("#k0-rolo", ROLA_KB, 10.0);
const bCabs = alvo("k0-cab-PENDENTE k0-cab-EM_PROGRESSO k0-cab-ATRASADO k0-cab-CONCLUIDO", ROLA_KB);
mira(10.0, 1.4, bCabs, 1.1, 17.0);
marca(11.2, bCabs, 12.9);
tl.to("#k0-cols", { x: -592, duration: 1.4, ease: "power2.inOut" }, 13.1);
tl.to("#k0-cols", { x: 0, duration: 1.2, ease: "power2.inOut" }, 15.6);

/* Passo 3 (17 a 23): Filtros Dinâmicos, quando o quadro está cheio. */
rola("#k0-rolo", 0, 17.0);
const bFil = alvo("k0-fil");
mira(17.0, 1.4, bFil, 1.15, 23.0);
marca(18.2, bFil, 22.6);

/* Passo 4 (23 a 31): arrastar o cartão; a coluna de destino acende. */
rola("#k0-rolo", ROLA_KB, 23.0);
tl.set("#k1-rolo", { y: () => -ROLA_KB() }, 23.0);
const bCard = alvo("k0-c2", ROLA_KB), bDest = alvo("k0-col-EM_PROGRESSO", ROLA_KB);
mira(23.0, 1.4, alvo("k0-col-PENDENTE k0-col-EM_PROGRESSO", ROLA_KB), 1.25, 31.0);
toca(23.8, bCard);
tl.set("#fantasma", { x: () => naApp(bCard.caixa()).x, y: () => naApp(bCard.caixa()).y }, 24.7);
tl.to("#k0-c2", { opacity: 0.5, scale: 0.95, rotation: 1, duration: 0.2 }, 24.8);
tl.to("#fantasma", { opacity: 0.85, rotation: -2, duration: 0.2 }, 24.8);
const destino = () => { const r = bDest.caixa(); return { x: r.x + 13 * ESCALA_APP, y: r.y + 56 * ESCALA_APP + 160 }; };
tl.to("#fantasma", { x: () => naApp(destino()).x, y: () => naApp(destino()).y, duration: 1.6, ease: "power2.inOut" }, 25.2);
tl.to("#dedo", { x: () => centro({ caixa: () => ({ ...destino(), w: 254 * ESCALA_APP, h: 120 }) }).x, y: () => centro({ caixa: () => ({ ...destino(), w: 254 * ESCALA_APP, h: 120 }) }).y, duration: 1.6, ease: "power2.inOut" }, 25.2);
mostra("#k0-sobre", 26.4, 0.2);
tl.to("#k0-col-EM_PROGRESSO", { scale: 1.01, duration: 0.2 }, 26.4);

/* Passo 5 (31 a 37): soltar. O estado muda na hora. */
tl.to("#fantasma", { opacity: 0, duration: 0.15 }, 31.2);
tl.set("#pg-k0", { opacity: 0 }, 31.3);
tl.set("#pg-k1", { opacity: 1 }, 31.3);
soltaDedo(31.6);
const bNovo = alvo("k1-c2", ROLA_KB);
mira(31.4, 1.4, bNovo, 1.45, 37.0);
marca(32.4, bNovo, 34.4);
marca(34.8, alvo("k1-cab-EM_PROGRESSO", ROLA_KB), 36.7);

/* Passo 6 (37 a 44): clicar no cartão abre a pendência inteira. */
toca(37.2, bNovo); soltaDedo(38.6);
mostra("#sobre-app", 38.15, 0.25);
tl.fromTo("#dm-dm", { scale: 0.97, y: 10 }, { scale: 1, y: 0, duration: 0.3, ease: "power2.out" }, 38.15);
mira(38.6, 1.4, alvo("dm-dm"), 1.05, 44.0);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 48 }, 0);
window.__timelines["main"] = tl;
</script>
