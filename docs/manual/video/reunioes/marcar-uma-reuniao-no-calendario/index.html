yle="flex-shrink:0;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span><span style="display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid #C7D2FE;color:#4338CA;border-radius:999px;padding:1.5px 5px;font-size:5.4px;font-weight:600">Rafael Nunes<svg width="5" height="5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span></div><div class="campo" id="ag-busca"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:#626D80;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="ph">Buscar participante...</span></div><div class="btn btn-indigo" id="ag-salvar" style="width:100%;justify-content:center;margin-top:8px">Agendar Reunião</div></div></div></div></div><div class="rodape-v">Manual · retrata o app em v0.142.1 · gerado em 17/09/2026</div><div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1" style="top:150px"><div class="n">1</div><h3>No menu, clique em Calendário</h3><p>Quem conduz reuniões acha ele dentro do grupo <b>Reuniões e metas</b>.</p></div><div class="passo" id="p2" style="top:150px"><div class="n">2</div><h3>Clique no dia da reunião</h3><p>A janela <b>Agendar Reunião</b> abre com a data já preenchida.</p></div><div class="passo" id="p3" style="top:150px"><div class="n">3</div><h3>Escreva o Título e escolha o Tipo</h3><p>Os tipos são <b>Diretoria</b>, <b>Gerencial</b>, <b>Coordenação</b>, <b>Mensal</b> e <b>Extraordinária</b>.</p></div><div class="passo" id="p4" style="top:150px"><div class="n">4</div><h3>Escolha a hora e escreva a Pauta</h3><p>Em <b>Horário da Reunião</b> você marca a hora de início. A <b>Pauta</b> é opcional.</p></div><div class="passo" id="p5" style="top:150px"><div class="n">5</div><h3>Inclua cada participante</h3><p>Procure a pessoa em <b>Buscar participante...</b> e clique no nome para incluir.</p></div><div class="passo" id="p6" style="top:150px"><div class="n">6</div><h3>Clique em Agendar Reunião</h3><p>Os participantes recebem o convite por email na hora.</p></div>`;

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
/* Campo do app: o placeholder dá lugar ao valor, e a borda acende. */
const digita = (base, t) => {
  tl.to(base + "-ph", { opacity: 0, duration: 0.15 }, t);
  tl.to(base + "-val", { opacity: 1, duration: 0.22 }, t + 0.15);
  tl.to(base, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
/* Troca o texto de um rótulo no meio do passo (Lembrar → Enviado). */
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
/* Acende a borda de um bloco (coluna de destino, cartão em foco). */
const acende = (sel, t, cor) => tl.to(sel, { borderColor: cor || "#2B2E7E", duration: 0.25 }, t);

/* ── Ancoragem ao elemento, em vez de coordenada escrita à mão ──────────────
   O marcador nasce DENTRO do alvo e o dedo lê a posição do alvo no palco:
   assim nenhum dos dois pode apontar o campo de cima. Medidas por offset*,
   que ignoram o scale(2) do palco e não dependem da fonte ter carregado. */
const PALCO = document.getElementById("palco-tarefa");
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
/* Cria o marcador colado no alvo e devolve o seletor dele. */
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;   // dois passos no mesmo alvo reusam o marcador
  const el = document.getElementById(idAlvo);
  const antes = getComputedStyle(el).position;
  if (antes === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  // Alvo de ícone é pequeno: sem folga maior o contorno some na tela.
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 5 : 3;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
/* Ponto que o dedo toca: o centro do alvo, descontando a ponta do cursor. */
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* Encosta um flutuante (menu, lista de nomes) embaixo do alvo que o abre.
   Vira filho do alvo, como o marcador: medida nenhuma pode errar o lugar. */
function abaixoDe(idFlutuante, idAlvo, dx) {
  const alvo = document.getElementById(idAlvo);
  const f = document.getElementById(idFlutuante);
  if (getComputedStyle(alvo).position === "static") alvo.style.position = "relative";
  alvo.appendChild(f);
  f.style.left = (dx || 0) + "px";
  f.style.top = "calc(100% + 3px)";
}
/* O dedo sai de `de` e toca `para`, com marcador e pulso no compasso do passo.
   Sem `de`, entra pela borda de baixo do palco. */
function toca(t, para, de) {
  const a = ponto(para);
  const b = de ? ponto(de) : { x: a.x + 34, y: Math.min(a.y + 70, 458) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota('#p1', 4.90, 9.55);
nota('#p2', 9.90, 14.55);
nota('#p3', 14.90, 19.55);
nota('#p4', 19.90, 24.55);
nota('#p5', 24.90, 29.55);
nota('#p6', 29.90, 34.55);


/* passo 1: o menu */
toca(5.3, "mi-calendario");
esconde("#mk-mi-calendario", 8.3);

/* passo 2: o dia, e a janela abre */
toca(10.3, "dia-22", "mi-calendario");
esconde("#mk-dia-22", 12.3);
mostra("#modal-agendar", 12.5);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 12.5);

/* passo 3: título e tipo */
toca(15.2, "ag-titulo");
digita("#ag-titulo", 16.4);
esconde("#mk-ag-titulo", 17.2);
toca(17.4, "ag-tipo", "ag-titulo");
digita("#ag-tipo", 18.6);
esconde("#mk-ag-tipo", 19.3);

/* passo 4: hora e pauta */
toca(20.2, "slot-0900", "ag-tipo");
tl.to("#slot-0900", { background: "#2B2E7E", color: "#ffffff", borderColor: "#2B2E7E", duration: 0.25 }, 21.5);
esconde("#mk-slot-0900", 22.1);
toca(22.3, "ag-pauta", "slot-0900");
digita("#ag-pauta", 23.5);
esconde("#mk-ag-pauta", 24.3);

/* passo 5: participantes */
toca(25.3, "ag-busca", "ag-pauta");
tl.set("#ag-chips", { height: 14, marginBottom: 4, paddingTop: 4, paddingBottom: 4 }, 26.9);
mostra("#ag-chips", 26.9);
esconde("#mk-ag-busca", 28.3);

/* passo 6: agendar */
toca(30.3, "ag-salvar", "ag-busca");
aperta("#ag-salvar", 31.4);
esconde("#mk-ag-salvar", 32.5);
tl.to("#g1", { opacity: 0, duration: 0.25 }, 32.7);


/* 3 · Fecho */
surge("#fc-titulo", 36.30, 18);
surge("#fc-carimbo", 36.80, 14);
surge("#fc-org", 37.20, 12);

window.__timelines.main = tl;
</script>
