const val = (p, nome, vazio, cheio, modo) => modo === "vazio" ? `<span class="vz">${vazio}</span>` : modo === "cheio" ? `<span>${cheio}</span>` : `<span class="vz" id="${p}-${nome}-vazio">${vazio}</span><span class="ch" id="${p}-${nome}-cheio" style="opacity:0">${cheio}</span>`;

  <div class="sobre-app" id="sobre-app">${janelaAgendar}</div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url" style="position:relative"><span id="url-0" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1">app.hospitalsaomatheus.cloud/dashboard</span><span id="url-1" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0">app.hospitalsaomatheus.cloud/reunioes/calendario</span></div></div>
    <div class="vista"><div class="app" id="app">${TELA}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas pelo offset do layout (ignora câmera e rolagem), nunca na montagem: o alvo é
   função que o GSAP chama no início do tween, já com a fonte do app (regra de 14/10/2026). */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id, rolagem) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + (y - rolagem) * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const valor = (v) => (typeof v === "function" ? v() : v);
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, valor(rolagem)))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });
/* Rolagem de um contêiner que deixa o alvo a `margem` px do topo da caixa visível. */
const rolagemPara = (rolo, altura, id, margem = 24) => () => { const r = document.getElementById(rolo); let el = document.getElementById(id), y = 0; while (el && el !== r) { y += el.offsetTop; el = el.offsetParent; } return Math.max(0, Math.min(r.offsetHeight - altura, y - margem)); };

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const rola = (sel, y, t) => tl.to(sel, { y: () => -valor(y), duration: 0.8, ease: "power2.inOut" }, t);
const mostra = (sel, t, d = 0.25) => tl.to(sel, { opacity: 1, duration: d }, t);
const esconde = (sel, t, d = 0.25) => tl.to(sel, { opacity: 0, duration: d }, t);
/* Campo do app: o texto de exemplo dá lugar ao valor, e a borda acende. */
function preenche(base, t) { esconde(`#${base}-vazio`, t, 0.15); mostra(`#${base}-cheio`, t + 0.15, 0.5); }
const aperta = (sel, t) => { tl.to(sel, { scale: 0.97, duration: 0.1 }, t); tl.to(sel, { scale: 1, duration: 0.1 }, t + 0.1); };

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4);
/* O endereço muda quando a tela muda. */
tl.set("#url-0", { opacity: 0 }, 6.9); tl.set("#url-1", { opacity: 1 }, 6.9);

/* Passo 1 (4 a 10): Calendário, no menu. A tela troca com rastro. */
const bMenu = alvo("mi-calendario b-mi-calendario");
mira(4.4, 2.2, bMenu, 1.6, 7.6);
marca(5.6, bMenu, 7.3);
toca(5.7, bMenu);
soltaDedo(7.2);
tl.fromTo("#pg-painel", { x: 0, filter: "blur(0px)", opacity: 1 }, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 6.8);
tl.fromTo("#pg-cal", { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 7.1);
mostra("#casca2", 6.9, 0.05);
mira(7.6, 1.6, REPOUSO, 1.0, 10.0);

/* Passo 2 (10 a 16): o dia 21. A janela Agendar Reunião abre com a data. */
const ROLA_CAL = rolagemPara("cal-rolo", 579.2, "c0-semana-4", 16);
rola("#cal-rolo", ROLA_CAL, 10.0);
tl.set("#cal2-rolo", { y: () => -ROLA_CAL() }, 10.9);
const bDia = alvo("c0-dia-21", ROLA_CAL);
mira(10.2, 1.8, bDia, 1.45, 13.4);
marca(11.6, bDia, 13.1);
toca(11.7, bDia);
soltaDedo(13.1);
mostra("#sobre-app", 13.2);
tl.fromTo("#ag-modal", { scale: 0.96, y: 12 }, { scale: 1, y: 0, duration: 0.35, ease: "power2.out" }, 13.2);
const bModal = alvo("ag-modal");
mira(13.4, 1.4, bModal, 1.05, 16.0);
marca(14.2, alvo("f0-data"), 15.7);

/* Passo 3 (16 a 23): Título e Tipo. */
const bTitulo = alvo("f0-titulo");
mira(16.0, 1.6, bTitulo, 1.45, 18.6);
toca(16.4, bTitulo);
preenche("f0-titulo", 17.4);
soltaDedo(18.0);
const bTipo = alvo("f0-tipo-bloco");
mira(18.6, 1.4, alvo("f0-tipo-bloco f0-menu"), 1.35, 23.0);
toca(18.8, alvo("f0-tipo"), bTitulo);
mostra("#f0-menu", 19.75, 0.15);
toca(20.5, alvo("f0-op-coord"), alvo("f0-tipo"));
esconde("#f0-menu", 21.5, 0.12);
preenche("f0-tipo", 21.5);
soltaDedo(21.9);
marca(22.0, bTipo, 22.8);

/* Passo 4 (23 a 30): a hora de início e a pauta. */
const ROLA_HORA = rolagemPara("f0", 481, "f0-horario", 16);
rola("#ag-rolo", ROLA_HORA, 23.0);
const bHora = alvo("f0-h0900", ROLA_HORA);
mira(23.0, 1.6, alvo("f0-horario", ROLA_HORA), 1.3, 26.0);
toca(23.9, bHora);
tl.set("#f0", { opacity: 0 }, 24.85);
tl.set("#f1", { opacity: 1 }, 24.85);
soltaDedo(25.3);
marca(25.1, alvo("f1-horario", ROLA_HORA), 26.2);
const ROLA_PAUTA = rolagemPara("f1", 481, "f1-pauta", 60);
rola("#ag-rolo", ROLA_PAUTA, 26.2);
const bPauta = alvo("f1-pauta", ROLA_PAUTA);
mira(26.2, 1.5, bPauta, 1.45, 30.0);
toca(26.8, bPauta);
preenche("f1-pauta", 27.8);
soltaDedo(28.4);
marca(28.5, bPauta, 29.8);

/* Passo 5 (30 a 38): procurar a pessoa e clicar no nome. */
const ROLA_PART = rolagemPara("f1", 481, "f1-part", 16);
rola("#ag-rolo", ROLA_PART, 30.0);
const bBusca = alvo("f1-busca", ROLA_PART);
mira(30.0, 1.6, alvo("f1-part", ROLA_PART), 1.15, 38.0);
toca(30.8, bBusca);
preenche("f1-busca", 31.8);
tl.set("#f1", { opacity: 0 }, 32.6);
tl.set("#f2", { opacity: 1 }, 32.6);
const bOtavio = alvo("f2-pes-0", ROLA_PART);
toca(33.4, bOtavio, bBusca);
tl.set("#f2", { opacity: 0 }, 34.4);
tl.set("#f3", { opacity: 1 }, 34.4);
soltaDedo(34.8);
marca(35.0, alvo("f3-chips", ROLA_PART), 37.6);

/* Passo 6 (38 a 44): Agendar Reunião. A janela fecha e o convite sai. */
const ROLA_FIM = rolagemPara("f3", 481, "f3-botoes", 380);
rola("#ag-rolo", ROLA_FIM, 38.0);
const bAgendar = alvo("f3-agendar", ROLA_FIM);
mira(38.0, 1.4, bAgendar, 1.5, 40.6);
toca(38.9, bAgendar);
aperta("#f3-agendar", 39.85);
soltaDedo(40.3);
esconde("#sobre-app", 40.3, 0.3);
tl.set("#pg-cal", { opacity: 0 }, 40.6);
tl.set("#pg-cal2", { opacity: 1 }, 40.6);
const bNova = alvo("c1-ev-21", ROLA_CAL);
mira(40.6, 1.2, bNova, 1.5, 42.6);
marca(41.2, bNova, 42.5);
/* No alto da página, o aviso de que o convite saiu. */
rola("#cal2-rolo", 0, 42.6);
const bOk = alvo("c1-ok");
mira(42.6, 1.2, bOk, 1.3, 45.0);
marca(43.6, bOk, 44.8);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 49 }, 0);
window.__timelines["main"] = tl;
</script>
