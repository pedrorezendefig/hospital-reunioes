18 6 6 18"/><path d="m6 6 12 12"/></svg></span></div></div><div data-layout-allow-overlap style="display:inline-flex;align-items:center;gap:3px;margin-top:5px;border:1.4px dashed #E2E8F0;border-radius:7px;padding:3px 6px;font-size:6px;color:#626D80;font-weight:600"><svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Adicionar participante</div></div></div></div></div><div id="dl-sem-assinatura" data-layout-allow-overlap data-layout-allow-overflow data-layout-allow-occlusion style="position:absolute;left:0;right:0;top:20px;bottom:0;background:rgba(15,23,42,.2);display:flex;align-items:center;justify-content:center;opacity:0"><div id="dl-card" style="width:220px;background:#fff;border-radius:11px;padding:11px 13px;box-shadow:0 18px 44px -12px rgba(0,0,0,.35)"><div style="display:flex;align-items:center;gap:5px;margin-bottom:5px"><span style="width:14px;height:14px;border-radius:5px;background:rgba(255,192,103,.16);display:flex;align-items:center;justify-content:center;color:#B26A16"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span><span style="font-size:8px;font-weight:700;color:#0F172A">Finalizar sem assinatura?</span></div><div style="font-size:6.2px;color:#475569;line-height:1.5">Isto criará 2 pendência(s) imediatamente e marcará a Ata como APROVADA.</div><div style="display:flex;justify-content:flex-end;gap:5px;margin-top:9px"><span style="font-size:6.4px;color:#475569;font-weight:600">Cancelar</span><div class="btn btn-cheio" style="padding:3.5px 7px;font-size:6.4px">Finalizar sem assinatura</div></div></div></div></div><div class="rodape-v">Manual · retrata o app em v0.142.1 · gerado em 17/09/2026</div><div class="ghost" data-layout-allow-overlap data-layout-allow-occlusion id="g1"><svg width="17" height="17" viewBox="0 0 24 24" fill="#16181d" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="pulse"></div></div>` +
  `<div class="passo" id="p1" style="top:150px"><div class="n">1</div><h3>Abra a reunião em Validação Necessária</h3><p>O bloco fica no fim da página: é o momento em que você assume o texto.</p></div><div class="passo" id="p2" style="top:150px"><div class="n">2</div><h3>Leia a ata e baixe o PDF</h3><p>Clique em <b>Baixar PDF</b> para conferir o documento final.</p></div><div class="passo" id="p3" style="top:150px"><div class="n">3</div><h3>Confira a lista de Participantes</h3><p>O <b>X</b> tira a pessoa da ata e da lista de quem vai assinar; a busca acrescenta quem faltou.</p></div><div class="passo" id="p4" style="top:150px"><div class="n">4</div><h3>Para mudar o texto, peça correção</h3><p>Clique em <b>Solicitar Correção</b> e diga o que muda. Ele nunca mexe na lista de participantes.</p></div><div class="passo" id="p5" style="top:150px"><div class="n">5</div><h3>Escolha o desfecho</h3><p><b>Enviar para assinatura</b> ou <b>Finalizar sem assinatura</b>.</p></div><div class="passo" id="p6" style="top:150px"><div class="n">6</div><h3>Finalizando sem assinatura, confirme</h3><p>A janela mostra quantas pendências vão nascer. Depois de fechar, não volta atrás.</p></div>`;

/* ============================================================
   Timeline: uma só, pausada, com tempos absolutos
   ============================================================ */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IR = { immediateRender: false };
const surge = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y === undefined ? 8 : y }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", ...IR }, t);
const some = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
const nota = (sel, t, ate) => { surge(sel, t, 14); some(sel, ate); };
const clique = (g, t) => tl.fromTo(`${g} .pulse`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power1.out", ...IR }, t);
const move = (g, t, x, y, dx, dy) => {
  tl.set(g, { x: x, y: y, opacity: 1 }, t);
  tl.to(g, { x: dx, y: dy, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
};
const aperta = (sel, t) => tl.to(sel, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 }, t);
const mostra = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ...IR }, t);
const esconde = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.3 }, t);
/* Campo do app: o placeholder dá lugar ao valor, e a borda acende. */
const digita = (base, t) => {
  tl.to(base + "-ph", { opacity: 0, duration: 0.15 }, t);
  tl.to(base + "-val", { opacity: 1, duration: 0.22 }, t + 0.15);
  tl.to(base, { borderColor: "#2B2E7E", duration: 0.2 }, t);
};
/* Troca o texto de um rótulo no meio do passo (Lembrar → Enviado). */
const troca = (sel, texto, t) => {
  tl.to(sel, { opacity: 0, duration: 0.12 }, t);
  tl.set(sel, { innerText: texto }, t + 0.13);
  tl.to(sel, { opacity: 1, duration: 0.12 }, t + 0.14);
};
/* Acende a borda de um bloco (coluna de destino, cartão em foco). */
const acende = (sel, t, cor) => tl.to(sel, { borderColor: cor || "#2B2E7E", duration: 0.25 }, t);

/* ── Ancoragem ao elemento, em vez de coordenada escrita à mão ──────────────
   O marcador nasce DENTRO do alvo e o dedo lê a posição do alvo no palco:
   assim nenhum dos dois pode apontar o campo de cima. Medidas por offset*,
   que ignoram o scale(2) do palco e não dependem da fonte ter carregado. */
const PALCO = document.getElementById("palco-tarefa");
function xy(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== PALCO) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
}
/* Cria o marcador colado no alvo e devolve o seletor dele. */
function marcaEm(idAlvo) {
  const jaTem = document.getElementById("mk-" + idAlvo);
  if (jaTem) return "#mk-" + idAlvo;   // dois passos no mesmo alvo reusam o marcador
  const el = document.getElementById(idAlvo);
  const antes = getComputedStyle(el).position;
  if (antes === "static") el.style.position = "relative";
  const m = document.createElement("div");
  m.className = "marcador";
  m.id = "mk-" + idAlvo;
  m.setAttribute("data-layout-allow-overlap", "");
  m.setAttribute("data-layout-allow-occlusion", "");
  // Alvo de ícone é pequeno: sem folga maior o contorno some na tela.
  const folga = (el.offsetWidth < 16 || el.offsetHeight < 16) ? 5 : 3;
  m.style.cssText = `position:absolute;left:${-folga}px;top:${-folga}px;right:${-folga}px;bottom:${-folga}px`;
  el.appendChild(m);
  return "#mk-" + idAlvo;
}
/* Ponto que o dedo toca: o centro do alvo, descontando a ponta do cursor. */
function ponto(idAlvo) {
  const r = xy(document.getElementById(idAlvo));
  return { x: r.x + r.w / 2 - 5, y: r.y + r.h / 2 - 3 };
}
/* Encosta um flutuante (menu, lista de nomes) embaixo do alvo que o abre.
   Vira filho do alvo, como o marcador: medida nenhuma pode errar o lugar. */
function abaixoDe(idFlutuante, idAlvo, dx) {
  const alvo = document.getElementById(idAlvo);
  const f = document.getElementById(idFlutuante);
  if (getComputedStyle(alvo).position === "static") alvo.style.position = "relative";
  alvo.appendChild(f);
  f.style.left = (dx || 0) + "px";
  f.style.top = "calc(100% + 3px)";
}
/* O dedo sai de `de` e toca `para`, com marcador e pulso no compasso do passo.
   Sem `de`, entra pela borda de baixo do palco. */
function toca(t, para, de) {
  const a = ponto(para);
  const b = de ? ponto(de) : { x: a.x + 34, y: Math.min(a.y + 70, 458) };
  const mk = marcaEm(para);
  mostra(mk, t);
  move("#g1", t + 0.15, b.x, b.y, a.x, a.y);
  clique("#g1", t + 1.05);
  return mk;
}

/* 1 · Abertura */
surge("#ab-eyebrow", 0.25, 22);
tl.fromTo("#ab-titulo", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", ...IR }, 0.5);
surge("#ab-sub", 1.1, 22);
surge("#ab-selos", 1.6, 18);

/* 2 · A tarefa */
tl.fromTo("#janela", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", ...IR }, 4.20);
nota('#p1', 4.90, 9.55);
nota('#p2', 9.90, 14.55);
nota('#p3', 14.90, 19.55);
nota('#p4', 19.90, 24.55);
nota('#p5', 24.90, 29.55);
nota('#p6', 29.90, 34.55);


/* passo 1: o bloco da validação */
mostra(marcaEm("bl-validacao"), 5.5);
esconde("#mk-bl-validacao", 8.5);

/* passo 2: baixar o PDF */
toca(10.3, "rd-pdf");
aperta("#rd-pdf", 11.5);
esconde("#mk-rd-pdf", 13.3);

/* passo 3: a lista, e o X que a legenda cita */
mostra(marcaEm("bl-participantes"), 15.3);
toca(15.9, "part-x-0", "rd-pdf");
esconde("#mk-part-x-0", 18.3);
esconde("#mk-bl-participantes", 18.5);

/* passo 4: solicitar correção */
toca(20.3, "bt-correcao", "bl-participantes");
aperta("#bt-correcao", 21.5);
esconde("#mk-bt-correcao", 23.3);

/* passo 5: os dois desfechos */
toca(25.2, "bt-enviar", "bt-correcao");
esconde("#mk-bt-enviar", 27.2);
toca(27.4, "bt-sem", "bt-enviar");
esconde("#mk-bt-sem", 29.3);

/* passo 6: a janela de confirmação, com a conta de pendências */
aperta("#bt-sem", 30.2);
tl.to("#g1", { opacity: 0, duration: 0.2 }, 30.4);
mostra("#dl-sem-assinatura", 30.7);
mostra(marcaEm("dl-card"), 31.3);
esconde("#mk-dl-card", 34.1);


/* 3 · Fecho */
surge("#fc-titulo", 36.30, 18);
surge("#fc-carimbo", 36.80, 14);
surge("#fc-org", 37.20, 12);

window.__timelines.main = tl;
</script>
