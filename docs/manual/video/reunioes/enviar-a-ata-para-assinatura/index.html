}

/* A reunião de exemplo do manual: Coordenação de 13 de outubro, com a ata escrita. */
const secao = (id, titulo, icone, corpo, acao = "") => `<div class="sc"${id ? ` id="${id}"` : ""}><div class="sc-cab"><div class="sc-tt">${ic(icone, 18, 1.5)}<h2>${titulo}</h2></div>${acao}</div><div class="sc-corpo">${corpo}</div></div>`;
const cabReuniao = (p, o = {}) => `<div><div class="re-volta">${ic("voltar", 14)}Calendário</div><div class="re-topo"><div>${o.programada ? `<span class="re-selo">${ic("calendario", 12)}Programada</span>` : ""}<h1>Coordenação, 13 de outubro de 2026</h1><p class="re-cod">MANREU01</p></div>
  <div class="re-bts"><span class="re-desmarcar">${ic("lixo", 16)}Desmarcar</span>${o.pdf ? `<span class="re-pdf" id="${p}-pdf">${ic("baixar", 16)}Baixar PDF</span>` : ""}</div></div></div>`;
const ETAPAS = [["Processando IA", "robo"], ["Resolver Participantes", "pessoas"], ["Aguard. Validação", "prancheta"], ["Aguard. Assinatura", "penline"], ["Assinada", "selo"]];
function linhaTempo(p, atual, aprovada) {
  const et = aprovada ? [...ETAPAS.slice(0, 3), ["Aprovada", "checkc"]] : ETAPAS;
  return `<div class="re-tl" id="${p}-tl">${et.map((e, i) => `<span class="pl${i < atual ? " feito" : i === atual ? " agora" : ""}"${i === atual ? ` id="${p}-agora"` : ""}>${ic(e[1], 14, i <= atual ? 2 : 1.5)}${e[0]}</span>${i < et.length - 1 ? `<span class="tr${i < atual ? " feito" : ""}"></span>` : ""}`).join("")}</div>`;
}
const metaReuniao = (acoes) => `<div class="re-meta">${[["calendario", "Data", "13/10/2026"], ["relogio", "Horário", "09:00:00 - 10:00:00"], ["arquivo", "Tipo", "Coordenação"], ["listacheck", "Ações", `${acoes} total`]].map((m) => `<div><small>${ic(m[0], 14, 1.5)}${m[1]}</small><b>${m[2]}</b></div>`).join("")}</div>`;
const PAUTA_REUNIAO = "Acompanhar os indicadores do setor e as ações da última reunião.";
const PESSOAS_ATA = [["Renata Fontes", "Coordenação"], ["Tiago Meireles", "Farmacêutico"], ["Luciana Braga", "Enfermeira"], ["Otávio Serra", "Técnico de Esterilização"]];
const pessoaAta = (p, n, x, i) => `<div class="pa" id="${p}-pa-${i}"><span class="av">${n[0][0]}</span><div><b>${n[0]}</b><small>${n[1]}</small></div><span class="fim">${ic("checkc", 16)}${x ? `<i id="${p}-pa-x-${i}">${ic("fechar", 14)}</i>` : ""}</span></div>`;
const participantesAta = (p, validacao, extra = "", pessoas = PESSOAS_ATA) => secao(`${p}-sc-part`, `Participantes (${pessoas.length})`, "pessoas", `<div class="pa-grade">${pessoas.map((n, i) => pessoaAta(p, n, validacao, i)).join("")}</div>${validacao ? `<div style="position:relative"><span class="pa-add" id="${p}-pa-add">${ic("mais", 16)}Adicionar participante</span>${extra}</div>` : ""}`);
const quadro = (p) => secao(`${p}-sc-quadro`, "Quadro de Atribuições (2 ações)", "listacheck", `<table class="qd"><thead><tr>${["Ação", "Responsável", "Objetivo / Meta", "Prazo", "Status"].map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>
  <tr><td>Revisar o fluxo de esterilização do instrumental cirúrgico</td><td>Otávio Serra<small>Técnico de Esterilização</small></td><td style="font-size:12px;line-height:16px">Reduzir a fila de material do fim da tarde</td><td>26/10/2026</td><td><span class="st">Aberto</span></td></tr>
  <tr><td>Atualizar a escala de plantão da UTI</td><td>Luciana Braga<small>Enfermeira</small></td><td style="font-size:12px;line-height:16px">Garantir cobertura no turno da noite</td><td>22/10/2026</td><td><span class="st">Aberto</span></td></tr></tbody></table>`);
const validacao = (p) => `<div class="va" id="${p}-va"><div class="va-cab"><span class="ico">${ic("alerta", 20)}</span><div><h2>Validação Necessária</h2><p>Por favor, revise o PDF da ata antes de prosseguir com a assinatura.</p></div></div>
  <div class="va-bts"><span class="env" id="${p}-enviar">${ic("penline", 16)}Enviar para assinatura</span><span class="sem" id="${p}-sem">${ic("checkc", 16)}Finalizar sem assinatura</span><span class="cor" id="${p}-corrigir">${ic("caneta", 16)}Solicitar Correção</span></div></div>`;

/* A reunião antes de enviar, aguardando as assinaturas e já assinada. */
const PAUTA_SC = () => secao("", "Pauta", "arquivo", `<p style="line-height:1.625">${PAUTA_REUNIAO}</p>`);
const antes = `<div class="rolo"><div class="re">${cabReuniao("a0", { pdf: true })}${linhaTempo("a0", 2)}${metaReuniao(2)}${validacao("a0").replace("Enviar para assinatura</span>", `Enviar para assinatura<b id="a0-enviando">${ic("penline", 16)}Enviando...</b></span>`)}${PAUTA_SC()}${participantesAta("a0", true)}</div></div>`;
const assinante = (id, n, email, quando, linha = "") => `<div class="sg${quando ? " ok" : ""}"${linha ? ` id="${linha}"` : ""}><span class="av">${n[0]}</span><div><b>${n}</b><small>${email}</small></div>${quando ? "" : `<span class="sg-lembrar" id="${id}">${ic("mail", 12)}Lembrar<b id="${id}-ok">${ic("mail", 12)}Enviado</b></span>`}<span class="sg-st">${ic(quando ? "checkc" : "relogio", 12)}${quando || "Pendente"}</span></div>`;
const cartaoAssinaturas = `<div class="sc" id="a1-sg"><div class="sg-cab" id="a1-sg-cab"><span class="ico">${ic("penline", 20)}</span><div style="flex:1"><h2>Aguardando assinatura digital</h2><p><b>2 de 4</b> assinaram<span> · atualizado agora</span></p></div>
  <span class="sg-bt" id="a1-sync">${ic("rotate", 14)}Sincronizar<b id="a1-sync-ok">${ic("rotate", 14)}Sincronizado</b></span><span class="sg-bt">${ic("refresh", 14)}Atualizar</span></div>
  <div class="sg-lista">${assinante("", "Renata Fontes", "renata.fontes@exemplo.local", "13/10 15:42", "a1-s0")}${assinante("", "Luciana Braga", "luciana.braga@exemplo.local", "13/10 16:05", "a1-s1")}${assinante("a1-lembrar", "Tiago Meireles", "tiago.meireles@exemplo.local")}${assinante("", "Otávio Serra", "otavio.serra@exemplo.local")}</div>
  <div class="sg-pe">Envelope: 3f6b1c2e-9a47-4d0b-8e51-2c7d9a6b1f04</div></div>`;
const aguardando = `<div class="rolo"><div class="re">${cabReuniao("a1", { pdf: true })}${linhaTempo("a1", 3)}${cartaoAssinaturas}${metaReuniao(2)}${PAUTA_SC()}</div></div>`;
const assinada = `<div class="rolo"><div class="re">${cabReuniao("a2", { pdf: true })}${linhaTempo("a2", 4)}<div class="ass" id="a2-ass"><div><span class="ico">${ic("selo", 20)}</span><div><b>Ata Assinada Digitalmente</b><small>Assinada em 15 de outubro de 2026</small></div></div><span class="bt" id="a2-pdf-ass">${ic("baixar", 16)}PDF Assinado</span></div>${metaReuniao(2)}${PAUTA_SC()}${participantesAta("a2", false)}</div></div>`;
const TELA = `${casca("calendario", { ...RENATA, sino: 1 })}${casca2("", { ...RENATA, sino: 1 })}<div class="corpo"><div class="pg" id="pg-cal"><div class="rolo" id="cal-rolo">${calendario("c0", { eventos: { 13: evCal("Acompanhamento da CME", "09:00 · Coordenação", "ev-validacao") } })}</div></div>
  <div class="pg" id="pg-a0" style="opacity:0">${antes}</div><div class="pg" id="pg-a1" style="opacity:0">${aguardando}</div><div class="pg" id="pg-a2" style="opacity:0">${assinada}</div></div>`;

document.getElementById("camera").innerHTML = `<div class="janela" id="janela">
    <div class="barra-nav"><i></i><i></i><i></i><div class="url" style="position:relative"><span id="url-0" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1">app.hospitalsaomatheus.cloud/reunioes/calendario</span><span id="url-1" style="position:absolute;left:16px;right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0">app.hospitalsaomatheus.cloud/reunioes/MANREU01?from=calendario&year=2026&month=9</span></div></div>
    <div class="vista"><div class="app" id="app">${TELA}</div></div></div>
  <div class="marcador" id="mk"></div><div class="dedo" id="dedo"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L9.6 19z"/></svg><div class="toque" id="toque"></div></div>`;
/* Réplica de tela: sobreposição e corte são de propósito. */
document.querySelectorAll("#camera, #camera *").forEach((el) => ["overlap", "occlusion", "overflow"].forEach((k) => el.setAttribute(`data-layout-allow-${k}`, "")));

/* Medidas pelo offset do layout (ignora câmera e rolagem), nunca na montagem: o alvo é
   função que o GSAP chama no início do tween, já com a fonte do app (regra de 14/10/2026). */
const APP = document.getElementById("app");
const APP_X = 160, APP_Y = 32 + 44, ESCALA_APP = 1.25, CENTRO = { x: 960, y: 452 }, JANELA = { x0: 160, y0: 32, x1: 1760, y1: 880 };
function noQuadro(id, rolagem) {
  let el = document.getElementById(id), x = 0, y = 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  while (el && el !== APP) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return { x: APP_X + x * ESCALA_APP, y: APP_Y + (y - rolagem) * ESCALA_APP, w: w * ESCALA_APP, h: h * ESCALA_APP };
}
const juntaCaixas = (rs) => { const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y)); return { x, y, w: Math.max(...rs.map((r) => r.x + r.w)) - x, h: Math.max(...rs.map((r) => r.y + r.h)) - y }; };
const valor = (v) => (typeof v === "function" ? v() : v);
/* Alvo: um ou mais ids (separados por espaço) e a rolagem em que ele é visto. */
const alvo = (ids, rolagem = 0) => ({ ids, caixa: () => juntaCaixas(ids.split(" ").map((id) => noQuadro(id, valor(rolagem)))) });
const REPOUSO = { ids: "", caixa: () => ({ x: 160, y: 32, w: 1600, h: 848 }) };
function enquadra(r, s) {
  const x = CENTRO.x - s * (r.x + r.w / 2), y = CENTRO.y - s * (r.y + r.h / 2);
  return { scale: s, x: Math.min(JANELA.x0 * (1 - s), Math.max(JANELA.x1 * (1 - s), x)), y: Math.min(JANELA.y0 * (1 - s), Math.max(JANELA.y1 * (1 - s), y)) };
}
const camera = (a, s) => ({ scale: s, x: () => enquadra(a.caixa(), s).x, y: () => enquadra(a.caixa(), s).y });
/* Rolagem de um contêiner que deixa o alvo a `margem` px do topo da caixa visível. */
const rolagemPara = (rolo, altura, id, margem = 24) => () => { const r = document.getElementById(rolo); let el = document.getElementById(id), y = 0; while (el && el !== r) { y += el.offsetTop; el = el.offsetParent; } return Math.max(0, Math.min(r.offsetHeight - altura, y - margem)); };

/* Timeline: uma só, pausada, com tempos absolutos. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#camera", { scale: 1, x: 0, y: 0 }, 0);
function mira(t, dur, a, s, ate) {
  tl.to("#camera", { ...camera(a, s), duration: dur, ease: "power2.inOut" }, t);
  tl.to("#camera", { ...camera(a, s * 1.025), duration: ate - t - dur, ease: "none" }, t + dur);
}
/* Anel em volta do alvo; o data-alvo é o que o gate do anel confere. */
function marca(t, a, ate) {
  tl.set("#mk", { attr: { "data-alvo": a.ids }, x: () => a.caixa().x - 8, y: () => a.caixa().y - 8, width: () => a.caixa().w + 16, height: () => a.caixa().h + 16, scale: 1.06 }, t - 0.02);
  tl.to("#mk", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mk", { opacity: 0, duration: 0.25 }, ate);
}
const centro = (a) => { const r = a.caixa(); return { x: r.x + r.w / 2 - 8, y: r.y + r.h / 2 - 6 }; };
function toca(t, a, de) {
  const b = de ? () => centro(de) : () => ({ x: centro(a).x + 120, y: centro(a).y + 150 });
  tl.set("#dedo", { x: () => b().x, y: () => b().y }, t - 0.02);
  tl.to("#dedo", { opacity: 1, duration: 0.2 }, t);
  tl.to("#dedo", { x: () => centro(a).x, y: () => centro(a).y, duration: 0.7, ease: "power2.inOut" }, t + 0.2);
  tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power1.out", immediateRender: false }, t + 0.95);
}
const soltaDedo = (t) => tl.to("#dedo", { opacity: 0, duration: 0.25 }, t);
const rola = (sel, y, t) => tl.to(sel, { y: () => -valor(y), duration: 0.8, ease: "power2.inOut" }, t);
const mostra = (sel, t, d = 0.25) => tl.to(sel, { opacity: 1, duration: d }, t);
const esconde = (sel, t, d = 0.25) => tl.to(sel, { opacity: 0, duration: d }, t);
/* Campo do app: o texto de exemplo dá lugar ao valor, e a borda acende. */
function preenche(base, t) { esconde(`#${base}-vazio`, t, 0.15); mostra(`#${base}-cheio`, t + 0.15, 0.5); }
const aperta = (sel, t) => { tl.to(sel, { scale: 0.97, duration: 0.1 }, t); tl.to(sel, { scale: 1, duration: 0.1 }, t + 0.1); };

/* A janela do navegador entra com um rastro curto, saindo do branco da abertura. */
tl.fromTo("#janela", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 4);
/* O endereço muda quando a tela muda. */
tl.set("#url-0", { opacity: 0 }, 6.3); tl.set("#url-1", { opacity: 1 }, 6.3);

/* Passo 1 (4 a 11): a reunião em Validação Necessária, e o documento em Baixar PDF. */
const ROLA_CAL = rolagemPara("cal-rolo", 579.2, "c0-semana-2", 16);
rola("#cal-rolo", ROLA_CAL, 4.4);
const bEv = alvo("c0-ev-13", ROLA_CAL);
mira(4.4, 1.6, bEv, 1.6, 6.8);
toca(5.0, bEv); soltaDedo(6.3);
tl.fromTo("#pg-cal", { x: 0, filter: "blur(0px)", opacity: 1 }, { x: -240, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 6.2);
tl.fromTo("#pg-a0", { x: 240, filter: "blur(20px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.6, ease: "power2.out" }, 6.5);
mostra("#casca2", 6.3, 0.05);
const bVa = alvo("a0-va");
mira(6.8, 1.4, bVa, 1.25, 8.6);
marca(7.4, bVa, 8.5);
const bPdf = alvo("a0-pdf");
mira(8.6, 1.2, bPdf, 1.6, 11.0);
marca(9.4, bPdf, 10.8);

/* Passo 2 (11 a 17): Enviar para assinatura. */
const bEnv = alvo("a0-enviar");
mira(11.0, 1.4, bEnv, 1.55, 14.6);
toca(11.6, bEnv); soltaDedo(13.2);
mostra("#a0-enviando", 12.55, 0.1);
tl.to("#pg-a0", { opacity: 0, duration: 0.2 }, 14.2);
tl.fromTo("#pg-a1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 14.4);
mira(14.6, 1.4, alvo("a1-agora"), 1.5, 17.0);
marca(15.4, alvo("a1-agora"), 16.8);

/* Passo 3 (17 a 24): Aguardando assinatura digital, com a conta de quem assinou. */
const bCab = alvo("a1-sg-cab");
mira(17.0, 1.4, alvo("a1-sg"), 1.2, 24.0);
marca(17.8, bCab, 20.6);
marca(21.0, alvo("a1-s0 a1-s1"), 23.6);

/* Passo 4 (24 a 31): Lembrar quem falta. O botão fica Enviado. */
const bLembrar = alvo("a1-lembrar");
mira(24.0, 1.4, bLembrar, 1.6, 31.0);
toca(24.8, bLembrar); soltaDedo(26.4);
mostra("#a1-lembrar-ok", 25.75, 0.15);
marca(26.6, bLembrar, 30.6);

/* Passo 5 (31 a 37): Sincronizar para conferir na hora. */
const bSync = alvo("a1-sync");
mira(31.0, 1.4, bSync, 1.6, 37.0);
toca(31.6, bSync); soltaDedo(33.2);
tl.to("#a1-sync svg", { rotation: 360, transformOrigin: "50% 50%", duration: 0.8, ease: "power1.inOut" }, 32.55);
mostra("#a1-sync-ok", 33.4, 0.15);
marca(33.8, bSync, 36.6);

/* Passo 6 (37 a 48): fechado o documento, a ata vira Assinada. */
tl.to("#pg-a1", { opacity: 0, duration: 0.2 }, 37.0);
tl.fromTo("#pg-a2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 37.4);
const bAss = alvo("a2-ass");
mira(37.4, 1.6, bAss, 1.3, 42.4);
marca(38.6, bAss, 42.0);
const bPdfOk = alvo("a2-pdf-ass");
mira(42.4, 1.2, bPdfOk, 1.6, 48.0);
marca(43.2, bPdfOk, 47.6);

/* Âncora: o timeline preenche o slot inteiro. */
tl.to({}, { duration: 52 }, 0);
window.__timelines["main"] = tl;
</script>
