 e draft do manual saem do rabo para uma Action no push da `main`.** A Action roda o `snapshot.py` (ambiente completo, sem o modo parcial do macOS) e o `tirar_draft_manual.py`, e commita direto na `main` com bypass do ruleset **s\u00f3 para `github-actions[bot]`**. Ela dispara no merge do PR de docs, quando o `history.json` com a vers\u00e3o nova j\u00e1 est\u00e1 na `main`, ent\u00e3o o fato que o draft precisa (vers\u00e3o em produ\u00e7\u00e3o) existe no momento certo. Push pelo `GITHUB_TOKEN` n\u00e3o redispara workflow: sem loop. *Emendada pela ADR 0065: o bypass do `github-actions[bot]` valia para qualquer workflow de qualquer branch; o ator passa a ser uma deploy key, usada s\u00f3 no job da Action que n\u00e3o instala nada.* *Emendada tamb\u00e9m pela ADR 0064 (decis\u00e3o 6b): o run que traz a vers\u00e3o nova ao `history.json` \u00e9 o que o rabo dispara por `workflow_dispatch` com o registro, e n\u00e3o o merge de um PR de docs; o `history.json` e o `state.json` entram no `paths-ignore` do push, junto com o resto do que a Action escreve.*\n\n## Emendas\n\n- **ADR 0022:** o Plano vivo do painel (PRD #101, ondas, prompts copi\u00e1veis, tempo t\u00edpico) deixa de existir como aba; o que resta \u00e9 o desenho das ondas dentro do PRD.\n- **ADR 0057:** quem tira a p\u00e1gina do `draft` passa a ser a Action do push da `main`, n\u00e3o o `fechar_onda.py`. O crit\u00e9rio n\u00e3o muda (s\u00f3 sai do draft o que est\u00e1 em produ\u00e7\u00e3o, lido do `history.json`).\n- **ADR 0061:** a emenda de 02/10 recusou bypass do ruleset para quem roda o rabo (uma pessoa). Esta ADR abre um bypass de escopo fixo para `github-actions[bot]`, um ator que n\u00e3o \u00e9 pessoa e s\u00f3 executa o workflow versionado no repo; a regra \"subir c\u00f3digo \u00e9 por PR, admin inclu\u00eddo\" continua intacta. A decis\u00e3o 5 (sem m\u00e9trica por pessoa) volta a valer no painel.\n\n## Alternativas descartadas\n\n- **Rabo publicar GitHub Release por vers\u00e3o e o painel ler s\u00f3 GitHub.** Mais aderente, mas health, build e migration n\u00e3o t\u00eam forma estruturada no Release, e Coolify e rollback leem o `state.json`.\n- **Manter snapshot e manual no rabo como best-effort.** J\u00e1 era best-effort (#844) e continuava custando tempo e falhando em sil\u00eancio.\n- **Action abrir PR autom\u00e1tico com auto-merge.** Zero bypass, mas dois commits de bookkeeping por vers\u00e3o e mais um PR por deploy.\n- **Snapshot n\u00e3o commitado, gerado ao abrir o Mapa.** `docs/ARQUITETURA.md` e o Manual perderiam a fonte.\n- **Manter o CHANGELOG escrito pelo rabo.** Duas fontes para a mesma timeline e um arquivo a mais para o CI vigiar travess\u00e3o.\n- **Aba PRs como lista com filtros ou como grafo issue, PR, deploy.** A lista repete a Issues; o grafo n\u00e3o responde \"o que est\u00e1 parado com quem\".\n- **Tr\u00eas abas (sem Mapa e Dom\u00ednio).** Custam zero coleta e o ER interativo (ADR 0025) \u00e9 o \u00fanico lugar onde o schema \u00e9 leg\u00edvel.\n- **Manter lead time por pessoa no visor.** Decidido contra na ADR 0061; compara gente.\n\n## Consequ\u00eancias\n\n- Nasce um PRD com as fatias: coletor (campos novos de PR, timeline em lote, branches remotas, fases), aba Issues (funil, chips, card, timeline, desenho das ondas no PRD), aba PRs, Produ\u00e7\u00e3o por vers\u00e3o com navega\u00e7\u00e3o interna, remo\u00e7\u00e3o de Plano, Pend\u00eancias, Guia e `plano.py`, rabo enxuto (sem snapshot, manual e CHANGELOG, `history.json` sem teto), Action do bot com o bypass no ruleset, e a troca de nome em `CLAUDE.md`, `/ask-pedro`, README e skills que citam o painel ou o CHANGELOG.\n- Os testes de `tools/workflow-dashboard/tests/` que cobrem Plano, Pend\u00eancias e o visor por respons\u00e1vel saem com o c\u00f3digo.\n- O `lint-adr` e o grep de travess\u00e3o do CI deixam de ter o CHANGELOG no escopo.\n- Quem roda o rabo deixa de precisar de venv, WeasyPrint e `DYLD` locais para o snapshot: a Action tem o ambiente.\n\n## Emenda de 06/10/2026: respons\u00e1vel \u00e9 s\u00f3 quem assumiu (issue #942)\n\nA triagem do PRD #938 deixou em aberto qual regra de respons\u00e1vel vale no Hospital OS: a da decis\u00e3o 5 desta ADR (\"ningu\u00e9m assumiu\" = sem assignee) ou a da emenda de 05/10/2026 da ADR 0061 (sem ningu\u00e9m designado, conta quem criou a issue, PR #930). O Pedro decidiu na triagem da #942 (coment\u00e1rio de 06/10/2026 na issue).\n\n**Decis\u00e3o:** no painel, respons\u00e1vel \u00e9 s\u00f3 quem est\u00e1 designado (assignee). O filtro de respons\u00e1vel, a cor da pessoa nos n\u00f3s das ondas e nas raias da aba PRs e o \"ningu\u00e9m assumiu\" leem s\u00f3 o assignee; issue sem assignee \u00e9 \"ningu\u00e9m assumiu\", tenha o autor que tiver. O autor pode continuar no card como informa\u00e7\u00e3o (`\u270e criada por fulano`), sem contar como respons\u00e1vel em lugar nenhum.\n\nRevoga a emenda de 05/10/2026 da ADR 0061 (\"respons\u00e1vel cai em quem criou\"). O visor da pessoa que separava assumidas de s\u00f3 criadas j\u00e1 tinha sa\u00eddo com a decis\u00e3o 5 desta ADR.\n\n> **Desfeita no filtro** pela issue #1039 (decis\u00e3o do Pedro de 06/10/2026, registrada no PR, ADR 0068): o chip da pessoa volta a trazer tamb\u00e9m as issues que ela criou e que ningu\u00e9m assumiu, com a marca `\u270e criou` no card, e o funil filtrado conta igual. Quem assumiu manda; \"ningu\u00e9m assumiu\" segue = sem assignee; a cor dos n\u00f3s das ondas e as raias da aba PRs continuam s\u00f3 pelo assignee.\n>\n> **Ampliada** em 06/10/2026 (decis\u00e3o do Pedro, registrada no PR): a pessoa tem tamb\u00e9m o que criou e outro assumiu, e o funil conta s\u00f3 issues abertas (o pendente), com um card grande do total e os cards das fases somando ele. A decis\u00e3o 5 muda junto: os filtros viram dropdowns do pr\u00f3prio painel no topo (o motivo de tirar o `<select>`, popup pintado pelo sistema, continua valendo) e o chip `ready-for-human` sai, porque o card Humana \u00e9 a mesma fila.\n>\n> **Amplia\u00e7\u00e3o recusada** no mesmo dia (06/10/2026, grilling do Pedro): a issue que a pessoa criou e **outro assumiu** sai do filtro dela (o PRD #646, criado pelo Pedro e assumido pelo Lucas, aparecia no pendente do Pedro). Vale a regra da #1039 e s\u00f3 ela: quem assumiu manda; o autor conta s\u00f3 quando ningu\u00e9m assumiu, com a marca `\u270e criou`. O card grande \"pendente para fulano\" e o funil filtrado seguem a mesma regra. Tr\u00eas regras testadas num dia; esta fecha o vai-e-vem.\n>\n> **No mesmo grilling (06/10/2026), decis\u00f5es 3 e 7 mudam de desenho:** (a) o desenho das ondas vira o **fluxo do PRD**: uma linha por fatia (bolinha na cor de quem assumiu, borda na cor da fase), seta para o PR dela com a borda na cor da fase do PR, e a vers\u00e3o quando est\u00e1 no ar; as ondas viram faixas, e o `blocked_by` aberto \u00e9 a seta no corredor da esquerda, da bloqueadora para a bloqueada. Motivo: colunas de n\u00f3s cheios na cor da pessoa viravam uma pilha de caixas quando o PRD n\u00e3o tinha depend\u00eancia, e a liga\u00e7\u00e3o issue \u2192 PR \u2192 produ\u00e7\u00e3o n\u00e3o aparecia em lugar nenhum. (b) Na aba PRs, a coluna Em produ\u00e7\u00e3o fica compacta (uma linha por PR) porque \u00e9 hist\u00f3rico e sempre a mais cheia; o filtro de pessoa aceita v\u00e1rias, uma raia para cada. (c) Nos dois lugares, os filtros ganham o bot\u00e3o `limpar`, que s\u00f3 existe com filtro fora do padr\u00e3o, e cada op\u00e7\u00e3o dos dropdowns da aba Issues mostra quantas issues traria com os outros filtros como est\u00e3o (faceta).", "cita": [25], "decisao": "Decis\u00e3o do Pedro (05/out/2026, grilling). O painel local `tools/workflow-dashboard/` cresceu em sete abas (Plano, Issues, Produ\u00e7\u00e3o, Pend\u00eancias, Mapa, Dom\u00ednio, Guia), com um m\u00f3dulo de 230 linhas calculando ondas, tempo t\u00edpico e caminho...", "emenda": [22, 57, 61], "emendada_por": [64, 65], "file": "docs/adr/0062-hospital-os-le-o-github-e-o-rabo-grava-so-a-verdade-do-deploy.md", "number": 62, "slug": "0062-hospital-os-le-o-github-e-o-rabo-grava-so-a-verdade-do-deploy", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Hospital OS l\u00ea o GitHub ao vivo; o rabo grava s\u00f3 a verdade do deploy"}, {"amended_by": "0064, 0066", "amends": "0061", "body_md": "Decis\u00e3o do Pedro (05/out/2026, grill do PRD #963). Em 05/10 cada PR levou de 13 a 16 minutos do merge \u00e0 produ\u00e7\u00e3o, e um conflito subiu isso para 25. Tr\u00eas PRs de ferramenta interna (#950, #954, #949), que n\u00e3o mudavam nada no app do hospital, pagaram o ciclo inteiro: CI repetido depois do commit de bump (cerca de 8 min), build de backend e frontend no Coolify (cerca de 5 min) e um PR de registro. Al\u00e9m do tempo, o fluxo parava o Pedro em v\u00e1rios pontos: o `/ship` no PR verde esperando algu\u00e9m rodar o rabo, a `/onda-enxuta` esperando o `vai #a #b`, a migration esperando o \"apliquei\", e o modo auto do Claude Code barrando o deploy sem o n\u00famero do PR citado no turno. Esta ADR fixa as quatro decis\u00f5es do PRD #963 que mudam a regra da ADR 0061: quem para o fluxo, de onde vem a vers\u00e3o, o que \u00e9 app e quem dispara o rabo.\n\n## Decis\u00f5es\n\n1. **Sem olho humano antes de produ\u00e7\u00e3o, exceto migration.** A prote\u00e7\u00e3o passa a ser CI, revisores agentes (`hr-revisor` e, em caminho sens\u00edvel, `hr-revisor-seguranca`), health e rollback autom\u00e1tico. Login e permiss\u00f5es n\u00e3o ganham parada pr\u00f3pria: o revisor de seguran\u00e7a \u00e9 o gate deles. O humano s\u00f3 \u00e9 acionado, por notifica\u00e7\u00e3o, em migration (colar o SQL no Studio), em fatia que esgotou as 3 tentativas e em rollback disparado.\n\n2. **Vers\u00e3o sem commit.** O rabo calcula a vers\u00e3o pelo tipo dos commits (como hoje), grava `APP_VERSION` nos dois servi\u00e7os do Coolify antes do merge e cria a tag `vX.Y.Z` no commit do squash. O `next.config` do frontend l\u00ea `APP_VERSION` e s\u00f3 cai no `package.json` se ela faltar; o `package.json` fica congelado. A verdade da vers\u00e3o \u00e9 `history.json`, `state.json` e a tag. Sem commit de bump, n\u00e3o h\u00e1 segundo CI antes do merge.\n\n3. **App \u00e9 `hospital-reunioes/`.** Qualquer arquivo ali torna o PR \"app\": vers\u00e3o, build, health e registro. O resto (`tools/`, `.claude/`, `.github/`, `docs/`, o painel) \u00e9 \"ferramenta\": s\u00f3 merge, sem vers\u00e3o, build ou PR de registro. PR misto conta como app. Substitui a regra de \"docs-only\" do `fechar_onda.py`.\n\n4. **Rabo autom\u00e1tico.** O `/ship` roda o `fechar_onda.py` quando os gates ficam verdes; a `/onda-enxuta` perde o checkpoint humano e mergeia os PRs verdes e limpos da onda num rabo s\u00f3; o `/pegar-issue` encadeia `/tdd`, `/ship` e rabo. Ficam o sem\u00e1foro de deploy e o teto de 3 tentativas por fatia. O rabo \u00e9 script e n\u00e3o chama agente: devolve um c\u00f3digo de sa\u00edda (conflito, rollback feito, migration pendente vencida), e a skill que o chamou aciona o agente, reabre a issue ou notifica.\n\n## Emenda \u00e0 ADR 0061\n\n- **Decis\u00e3o 2 (um pipeline s\u00f3).** O invariante herdado da 0022, \"subir \u00e9 decis\u00e3o humana por lote citando os PR#\", deixa de valer: o gate passa a ser CI, revisores agentes, health e rollback. Continuam valendo PR verde como CI, spec\u00d7diff e revisor independente, a baixa em 3 tentativas e o estado no GitHub. \"O bump acontece na hora do merge, na `main`\" passa a ser: a vers\u00e3o \u00e9 calculada na hora do merge e vive na tag e no Coolify, sem commit.\n- **Emenda de 02/10 (o rabo com a `main` protegida).** Sai o bump como commit na branch do PR, com o CI redisparado antes do merge. O resto continua: merge pela API com squash conferindo o `sha` do head, PR de entrega na onda, ruleset sem bypass. PR de registro e cancelamento do segundo build s\u00f3 existem em PR de app.\n- **Decis\u00f5es 1 e 3 continuam.** Cada s\u00f3cio sobe o pr\u00f3prio PR, agora sem precisar estar presente fora da migration, e a `main` segue protegida pelo mesmo ruleset.\n\n## Permiss\u00f5es na m\u00e1quina de quem roda\n\nSem parada humana, nada na m\u00e1quina pode deixar o agente desligar a prote\u00e7\u00e3o da `main` nem publicar segredo sem olhar. Tr\u00eas decis\u00f5es, revistas depois da revis\u00e3o de seguran\u00e7a do PR #973:\n\n- **A trava do ruleset \u00e9 do servidor.** As sess\u00f5es de agente de quem \u00e9 admin do reposit\u00f3rio (hoje s\u00f3 o Pedro, dono) usam um token fine-grained do GitHub sem a permiss\u00e3o Administration, na vari\u00e1vel `GH_TOKEN` do `tokens/.env`, e saem da m\u00e1quina o login guardado no `gh` com Administration e qualquer outro token do GitHub que o agente alcance (o PAT cl\u00e1ssico que o `tokens/.env` guardava, exportado inteiro para a sess\u00e3o). Sem Administration, o GitHub recusa mudar ou apagar ruleset, prote\u00e7\u00e3o de branch, colaborador ou webhook, venha o pedido de onde vier. A regra de deny do Claude Code n\u00e3o serve para isso: ela casa pelo come\u00e7o do texto do comando, e o mesmo endpoint se alcan\u00e7a com `-X DELETE`, `-XPUT`, `--method=PUT`, flag depois do caminho, `gh api graphql` (`updateRepositoryRuleset`) ou `curl`. Por isso n\u00e3o existe deny para o ruleset, nem como alarme. Colaborador com WRITE n\u00e3o tem Administration e n\u00e3o precisa do token; mudar o ruleset passa a ser pela tela do GitHub. As permiss\u00f5es do token, tiradas do que o pipeline chama, est\u00e3o na se\u00e7\u00e3o 5.1 do `docs/onboarding/claude-setup.md`: Actions, Contents, Issues, Pull requests e Workflows em escrita, Checks, Commit statuses e Metadata em leitura.\n- **A `main` \u00e9 travada pelo ruleset** (sem force push, sem apagar, sem bypass), que o token n\u00e3o consegue desligar. O deny de force push no `~/.claude/settings.json` mira s\u00f3 a `main` e pega as formas comuns (`--force`, `-f`, `--force-with-lease`, refspec `+main`), n\u00e3o `git -C <pasta> push` nem `--mirror`: \u00e9 alarme a mais; a branch do pr\u00f3prio PR segue recebendo `--force-with-lease` depois de rebase.\n- **Nada que publica texto, mexe em produ\u00e7\u00e3o ou roda c\u00f3digo do reposit\u00f3rio fica em `permissions.allow`**, nem no settings do usu\u00e1rio nem no `.claude/settings.json` e `settings.local.json` do projeto (o allow de l\u00e1 tamb\u00e9m vale). Ali a regra pula o classificador do modo auto. Allow de Bash com curinga s\u00f3 para leitura (`git status`, `gh pr view`, `jq`, `grep` e afins); os amplos do guia (`git`, `gh`, `coolify`, `curl`, `uv`, `pnpm`, `npx`, `docker`, `python3`, `find`) saem, e no modo auto o classificador libera esses comandos olhando cada um. O reposit\u00f3rio \u00e9 p\u00fablico e qualquer conta comenta em issue e PR, ent\u00e3o `gh issue create`, `comment` e `edit` e `gh pr create` e `comment` v\u00e3o em `autoMode.allow`, em prosa, restritos a `pedrorezendefig/hospital-reunioes` e a texto do pr\u00f3prio fluxo, para o classificador seguir olhando destino e conte\u00fado. O `fechar_onda.py` e a `/minhas-issues` tamb\u00e9m: o allow por caminho relativo rodaria, num worktree, a vers\u00e3o que o agente acabou de editar. O `autoMode` vai no settings do usu\u00e1rio porque o modo auto n\u00e3o l\u00ea `autoMode` do settings do projeto.\n\nO `/setup-maquina` (n\u00edvel 2) confere regra por regra e confere que nem o `gh` da sess\u00e3o nem o do chaveiro administram o reposit\u00f3rio (pergunta ao GitHub pelas deploy keys, que s\u00f3 respondem com Administration). Diz o que falta e por qu\u00ea, nunca grava o arquivo e nunca l\u00ea nem imprime o token.\n\n## Alternativas descartadas\n\n- **Aplicar a migration automaticamente.** O Postgres de produ\u00e7\u00e3o n\u00e3o \u00e9 exposto; o SQL segue colado no Studio pelo humano, e por isso a migration \u00e9 a \u00fanica parada.\n- **Quebra de vidro do ruleset ou runner pr\u00f3prio para incidente do GitHub Actions** (#958 e #955, wontfix). Num incidente, espera-se o Actions voltar.\n- **Manter o commit de bump no PR.** \u00c9 ele que redispara o CI antes de todo merge.\n\n## Consequ\u00eancias\n\n- O PRD #963 entrega as decis\u00f5es em fatias: esta ADR e o `/setup-maquina` (#964), PR de ferramenta s\u00f3 faz merge (#965), CI por pasta (#966), vers\u00e3o sem commit (#967), rollback autom\u00e1tico (#968), migration com recibo (#969), fluxo sem parada nas skills (#970) e backend em paralelo (#971). Cada decis\u00e3o vale quando a fatia dela entrar; at\u00e9 l\u00e1 segue o fluxo da ADR 0061.\n- \"Ferramenta\" \u00e9 a mesma palavra no `fechar_onda.py` e no detector do CI: as duas regras precisam bater.\n- Meta medida em 05/10: PR de ferramenta em 1 a 2 minutos, PR do app em 6 a 7.", "cita": [], "decisao": "Decis\u00e3o do Pedro (05/out/2026, grill do PRD #963). Em 05/10 cada PR levou de 13 a 16 minutos do merge \u00e0 produ\u00e7\u00e3o, e um conflito subiu isso para 25. Tr\u00eas PRs de ferramenta interna (#950, #954, #949), que n\u00e3o mudavam nada no app do hospital...", "emenda": [61], "emendada_por": [64, 66], "file": "docs/adr/0063-fluxo-automatico-ate-producao-so-a-migration-para.md", "number": 63, "slug": "0063-fluxo-automatico-ate-producao-so-a-migration-para", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Fluxo autom\u00e1tico at\u00e9 produ\u00e7\u00e3o: s\u00f3 a migration para no humano"}, {"amended_by": "0066, 0067", "amends": "0061, 0062, 0063", "body_md": "Decis\u00e3o do Pedro (06/out/2026, grilling sobre o tempo do rabo). Um dia depois da ADR 0063, com a vers\u00e3o sem commit j\u00e1 em produ\u00e7\u00e3o (#967, v0.163.2), os tr\u00eas \u00faltimos PRs de app levaram 918, 928 e 989 segundos do `fechar_onda.py`. O sem\u00e1foro em si custa segundos (\u00e9 um `mkdir` em `/tmp` que serializa builds na mesma m\u00e1quina) e fica. O que resta de tempo \u00e9 o CI que roda de novo sobre c\u00f3digo que j\u00e1 passou no CI, e o que resta de aten\u00e7\u00e3o humana \u00e9 a lista de should-fix que o revisor escreve e que, sem condi\u00e7\u00e3o no \"vai\" (que a 0063 j\u00e1 tirou), n\u00e3o muda o que entra. Esta ADR corta os dois.\n\n## Decis\u00f5es\n\n1. **O revisor reporta s\u00f3 o que impede o merge.** O veredito do `hr-revisor` (e do `/code-review` e do spec\u00d7diff no `/ship`) tem uma lista: must-fix (bug que o teste n\u00e3o pega, teste v\u00e1cuo, spec n\u00e3o cumprida, segredo, regress\u00e3o de permiss\u00e3o). Should-fix, nits e \"observa\u00e7\u00f5es para issue futura\" deixam de existir no veredito. **Uma rodada de corre\u00e7\u00e3o**: must-fix dispara o `hr-corretor` uma vez; se a segunda revis\u00e3o ainda tem must-fix, a fatia sai da onda com `ready-for-human` e o lote segue sem ela. O `hr-revisor-seguranca` continua em caminho sens\u00edvel, com a mesma r\u00e9gua (s\u00f3 must-fix), e o must-fix dele bloqueia o merge sem parar no humano (ADR 0063, decis\u00e3o 1). Rejeitado: tirar o revisor de c\u00f3digo e ficar s\u00f3 com CI (o CI n\u00e3o pega teste v\u00e1cuo nem spec n\u00e3o cumprida, e o revisor roda em paralelo com o CI, custando minutos); duas rodadas (a segunda falha \u00e9 quase sempre o mesmo problema mal entendido, e o `hr-corretor-max` j\u00e1 existe para isso).\n\n2. **O ruleset da `main` deixa de exigir a branch em dia com a base.** `strict_required_status_checks_policy` passa a `false` em `.github/rulesets/main.json`. Continuam: PR obrigat\u00f3rio, os tr\u00eas checks do `ci.yml` verdes no head do PR, sem force push, sem delete, sem bypass. O CI de push na `main` (j\u00e1 existe) \u00e9 o detector tardio: dois PRs que passam separados e quebram juntos aparecem vermelhos na `main` e viram corre\u00e7\u00e3o para frente, nunca rollback. Rejeitado: manter a exig\u00eancia (s\u00e3o 5 a 9 min de CI repetido por rodada, e a regra \"a `main` andou no meio, exit 2, roda de novo\" nasce dela); exigir s\u00f3 na onda (duas regras para o mesmo merge).\n\n3. **O rabo mergeia PR a PR pela API, em ordem, sem branch `onda/<sess\u00e3o>` e sem PR de entrega.** Cada PR do lote entra com squash no pr\u00f3prio n\u00famero (\"<t\u00edtulo> (#N)\"), como o avulso. A onda continua um build: o rabo cancela o deploy que o webhook do Coolify dispara para cada merge intermedi\u00e1rio e deixa buildar s\u00f3 o \u00faltimo (o mesmo mecanismo que j\u00e1 cancela o build do registro, issue #851). A tag `vX.Y.Z` vai no squash do \u00faltimo PR do lote; `history.json` e `CHANGELOG` listam todos os PRs e issues do lote, como hoje. Rejeitado: manter a branch de entrega (ela existia para atender \"em dia com a base\" com um CI s\u00f3; sem a exig\u00eancia, \u00e9 um CI, um PR e dois commits de merge a mais por onda).\n\n4. **Seguran\u00e7a por PRD, n\u00e3o por PR, com uma exce\u00e7\u00e3o estreita.** Medido em 06/10 nos \u00faltimos 80 PRs: cerca de 20 rodadas do `hr-revisor-seguranca` (11 min cada, em esfor\u00e7o m\u00e1ximo, repetida ap\u00f3s toda corre\u00e7\u00e3o, com o corretor esperando) e um \u00fanico must-fix de seguran\u00e7a real (#899, anexo de e-mail an\u00f4nimo sem teto, no canal p\u00fablico da Ouvidoria). O revisor de seguran\u00e7a por PR sai do fluxo padr\u00e3o; o `hr-auditor-prd`, que j\u00e1 roda quando o PRD fecha, ganha a lente de seguran\u00e7a sobre o diff acumulado dos PRs do PRD, uma rodada, e o que achar vira issue `ready-for-agent` no PRD (`ready-for-human` se for grave). **Exce\u00e7\u00e3o:** PR que toca rota sem login (canal p\u00fablico da Ouvidoria, webhook, e-mail recebido) ou migration mant\u00e9m o `hr-revisor-seguranca` por PR, uma vez s\u00f3 (n\u00e3o repete depois da corre\u00e7\u00e3o), em esfor\u00e7o `high`, em paralelo com o corretor: ningu\u00e9m espera por ele. Saem do gatilho \"rota nova\", \"middleware\", \"env\" e \"workflows\". Rejeitado: tirar de vez (o \u00fanico achado real foi num canal p\u00fablico, onde o custo de descobrir depois \u00e9 o backend fora do ar para o hospital); s\u00f3 por PRD (a auditoria acontece depois de produ\u00e7\u00e3o, horas de janela aberta no canal p\u00fablico); manter por PR (19 rodadas limpas em 20 para um achado).\n\n5. **Ondas mais paralelas, implementador mais leve.** Medido em 06/10 no PRD #963: 18,5 min de implementa\u00e7\u00e3o de uma fatia G (17 testes, 12 mutantes) e 4 min de mapa do terreno refeito por onda; as 8 fatias tocavam todas o `fechar_onda.py`, e o `--paralelo 3` virou 4 ondas em s\u00e9rie de uma issue. Quatro regras: (a) o `/to-issues` fatia para paralelismo real: fatias da mesma onda n\u00e3o compartilham arquivo de costura, fatia G que n\u00e3o bloqueia ningu\u00e9m vira duas M, e o PRD nasce com as ondas previstas no corpo; (b) o mapa do terreno \u00e9 feito uma vez por PRD e herdado pela passagem entre ondas, com a lista do que a onda anterior mergeou; refaz s\u00f3 se a passagem disser que a estrutura mudou; (c) teto de mutantes: um mutante por crit\u00e9rio de aceite, n\u00e3o por teste; a prova por muta\u00e7\u00e3o continua, para de provar o mesmo detector v\u00e1rias vezes; (d) `hr-implementador` em `effort: high` para fatia P e M, `xhigh` s\u00f3 em G. Rejeitado: sub-agentes por camada dentro da fatia (reintroduz o corte horizontal que a fatia vertical evita, e a integra\u00e7\u00e3o come o ganho; o mesmo ganho vem do fatiamento); tirar a muta\u00e7\u00e3o (\u00e9 o que separa teste de teste v\u00e1cuo).\n\n6. **Deploy fora do caminho cr\u00edtico.** Depois das decis\u00f5es 1 a 5, uma fatia G de app com uma corre\u00e7\u00e3o leva cerca de 36 min de m\u00e1quina: 18:30 de implementa\u00e7\u00e3o, 5:00 de revis\u00e3o, 5:30 de corre\u00e7\u00e3o, 5:30 de build, 1:30 de registro. Tr\u00eas cortes, em ordem de retorno por risco: (a) **a onda seguinte come\u00e7a no PR verde**, n\u00e3o no deploy: a sess\u00e3o da `/onda-enxuta` escreve a passagem e lan\u00e7a a pr\u00f3xima sess\u00e3o assim que os PRs ficam verdes e limpos, e o rabo roda em paralelo com os implementadores novos; fatia bloqueada por issue em deploy espera o `blocked_by` fechar, as outras come\u00e7am na hora (-7 min por onda; o deploy deixa de atrasar o trabalho seguinte); (b) **o registro \u00e9 gravado pela Action do bot**: o rabo termina no health e dispara a Action p\u00f3s-merge da ADR 0062 (decis\u00e3o 10, fatia #940), que j\u00e1 tem bypass do ruleset para `github-actions[bot]`, e ela commita `history.json` e `state.json` direto na `main`; some o PR de registro, o CI dele e o cancelamento do build que ele disparava (-1:30 por lote); (c) **a imagem \u00e9 constru\u00edda no CI e publicada no GHCR**, pelo sha do head do PR, e o Coolify s\u00f3 puxa e reinicia: o rabo retagueia a imagem para o sha do squash e dispara o deploy (5:30 de build viram cerca de 0:30); backend primeiro, frontend depois com a vers\u00e3o do rodap\u00e9 lida em tempo de execu\u00e7\u00e3o, porque a imagem nasce antes de a vers\u00e3o existir. Rejeitado: pular o health (10 s, \u00fanica prova de prod viva); fatia P em modelo menor (o must-fix que volta custa mais que os 2 min); corretor sendo o pr\u00f3prio implementador (ADR 0035); tirar o revisor de c\u00f3digo (1 em 3 PRs tem must-fix real). Meta: fatia G com uma corre\u00e7\u00e3o em cerca de 29 min de caminho cr\u00edtico; onda de 3 fatias M em cerca de 13 min; PRD de 8 fatias em 3 ondas em cerca de 45 min, contra cerca de 10 h de rel\u00f3gio medidas no PRD #963 em 05 e 06/10.\n\n   **Emenda de 06/10/2026 (grilling da #999), sob a decis\u00e3o 6a:** a onda seguinte n\u00e3o l\u00ea nada da anterior. O rabo assume a consequ\u00eancia do pr\u00f3prio fracasso antes de soltar o sem\u00e1foro: na sa\u00edda 6, reabre as issues e mergeia o revert dos squashes ainda dentro da trava; nas sa\u00eddas 3 e 4, marca a trava como parada, e o rabo seguinte sai na hora com 8 em vez de esperar 60 min ou for\u00e7ar. Rejeitado: a passagem como caixa de correio entre duas sess\u00f5es vivas (cada sa\u00edda do rabo virava um caso de protocolo, testado s\u00f3 por texto; quatro must-fix em duas rodadas no PR #1019). Custo aceito: o caminho de rollback segura a trava pelos cerca de 5 min do CI do revert, num caminho que n\u00e3o aconteceu nos 52 deploys de 17/09 a 06/10.\n\n## Emenda \u00e0 ADR 0062\n\n- **Decis\u00e3o 9 (o rabo grava s\u00f3 `history.json` e `state.json`).** Continua sendo o rabo quem sabe a verdade do deploy; muda quem escreve: o PR de docs por lote sai, e os dois JSONs entram na `main` pela Action do bot da decis\u00e3o 10, com o registro que o rabo lhe entrega. A alternativa \"Action abrir PR autom\u00e1tico com auto-merge\" segue rejeitada pelo mesmo motivo.\n\n## Emenda \u00e0 ADR 0061\n\n- **Decis\u00e3o 3 (`main` protegida).** \"CI obrigat\u00f3rio e atualizado com a base\" passa a \"CI obrigat\u00f3rio no head do PR\". O resto da decis\u00e3o continua.\n- **Emenda de 02/10 (o rabo com a `main` protegida).** Saem a branch `onda/<sess\u00e3o>` com merges `--no-ff`, o PR de entrega com `Closes` e a frase \"uma rodada que encontra a `main` andando no meio do CI para com c\u00f3digo 2\". Fica: merge pela API com squash conferindo o `sha` do head, PR de registro s\u00f3 em PR de app, ruleset sem bypass, `tools/test_ruleset_main.py` amarrando os checks ao `ci.yml`.\n- **Emenda \u00e0 ADR 0035 (gates de review).** \"No m\u00e1ximo 2 rodadas de corre\u00e7\u00e3o\" passa a uma rodada, e o veredito perde should-fix e nits.\n\n## Emenda \u00e0 ADR 0063\n\n- **Decis\u00e3o 1.** O humano continua acionado s\u00f3 em migration, fatia que esgotou as tentativas e rollback; \"esgotou\" agora inclui a segunda revis\u00e3o com must-fix. \"Em caminho sens\u00edvel, `hr-revisor-seguranca`\" passa a valer s\u00f3 para rota sem login e migration; o resto da seguran\u00e7a \u00e9 a lente do `hr-auditor-prd` no fechamento do PRD. O teto de 3 tentativas por fatia (ADR 0022) continua para CI vermelho e conflito.\n- **Decis\u00e3o 4 (rabo autom\u00e1tico).** \"Mergeia os PRs verdes e limpos da onda num rabo s\u00f3\" continua, agora PR a PR, sem PR de entrega.\n\n## Consequ\u00eancias\n\n- Oito fatias: onda seguinte no PR verde, registro pela Action, imagem do backend no CI, imagem do frontend no CI (decis\u00e3o 6); ondas mais paralelas (`/to-issues`, `/onda-enxuta` mapa e passagem, `hr-implementador`, `/tdd`); revisor e `/ship` com veredito s\u00f3 de must-fix e uma rodada, mais a seguran\u00e7a por PRD (prompts dos agentes `hr-revisor`, `hr-revisor-seguranca`, `hr-corretor`, `hr-auditor-prd`, skill `/onda-enxuta` e `/ship`); ruleset sem \"em dia com a base\" (`main.json`, `tools/test_ruleset_main.py`, `docs/onboarding/dev.md`; aplicar \u00e9 do admin, \u00e0 m\u00e3o, pela tela do GitHub, porque o token do agente n\u00e3o tem Administration, ADR 0063); rabo PR a PR (`fechar_onda.py` e os testes dele, docstring, `/onda-enxuta`, `/ship`, `CLAUDE.md`).\n- A ordem dos PRs no `--prs` continua sendo a ordem de merge. Conflito de um PR com a `main` depois do merge do anterior \u00e9 exit 2 s\u00f3 daquele PR: os j\u00e1 mergeados ficam, e o rabo sobe o que entrou.\n- Meta: PR de app com a `main` quieta ou n\u00e3o, do PR verde \u00e0 produ\u00e7\u00e3o em 6 a 8 min (build + health + registro), sem CI dentro do rabo; onda de N PRs no mesmo tempo de um PR.", "cita": [22, 35], "decisao": "Decis\u00e3o do Pedro (06/out/2026, grilling sobre o tempo do rabo). Um dia depois da ADR 0063, com a vers\u00e3o sem commit j\u00e1 em produ\u00e7\u00e3o (#967, v0.163.2), os tr\u00eas \u00faltimos PRs de app levaram 918, 928 e 989 segundos do `fechar_onda.py`. O sem\u00e1foro...", "emenda": [61, 62, 63], "emendada_por": [66, 67], "file": "docs/adr/0064-revisao-so-must-fix-e-merge-pr-a-pr-sem-em-dia-com-a-base.md", "number": 64, "slug": "0064-revisao-so-must-fix-e-merge-pr-a-pr-sem-em-dia-com-a-base", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Revis\u00e3o s\u00f3 de must-fix em uma rodada, seguran\u00e7a por PRD, e merge PR a PR sem exigir \"em dia com a base\""}, {"amended_by": null, "amends": "0062", "body_md": "Decis\u00e3o do Pedro (06/out/2026, veredito de seguran\u00e7a do PR #1012, issue #940). A ADR 0062 (decis\u00e3o 10) deu o bypass do ruleset da `main` ao `github-actions[bot]` (integration 15368) para a Action p\u00f3s-merge commitar snapshot e draft do Manual. O revisor de seguran\u00e7a mostrou que esse bypass n\u00e3o tem escopo fixo: ele vale para o `GITHUB_TOKEN` de qualquer workflow, de qualquer branch, e em modo `always` pula tamb\u00e9m o `non_fast_forward`. Quem tem escrita no repo (ou um agente, ou um token com escopo `workflow`) sobe numa branch qualquer um YAML com `contents: write` que faz `git push --force` na `main`, sem PR e sem CI, e o webhook do Coolify p\u00f5e o c\u00f3digo em produ\u00e7\u00e3o. Al\u00e9m disso, o token com bypass ficava no `.git/config` enquanto o job instalava o lock inteiro do backend e importava o app: um pacote comprometido no PyPI empurraria para a `main`.\n\n## Decis\u00f5es\n\n1. **O ator do bypass \u00e9 uma deploy key de escrita (`actor_type: DeployKey`), e s\u00f3 ela.** O `bypass_actors` do `.github/rulesets/main.json` sai da integration 15368. O tipo `DeployKey` cobre todas as deploy keys do repo, ent\u00e3o o repo tem uma s\u00f3 com escrita, a da Action. A chave privada vive no secret `POS_MERGE_DEPLOY_KEY` de um Environment `pos-merge`, restrito \u00e0 branch `main`: job de outra branch, ou de um `workflow_dispatch` nela, n\u00e3o chega ao secret.\n\n2. **A Action tem tr\u00eas jobs.** O `gerar` faz o que instala e executa c\u00f3digo de terceiros (setup do Python e do Node, ffmpeg, `uv sync`, `tirar_draft_manual.py`, `snapshot.py`) com `contents: read` e `persist-credentials: false`, e entrega por artefato um patch s\u00f3 dos tr\u00eas caminhos (`docs/spec/snapshots/`, `docs/ARQUITETURA.md`, `docs/manual/src/content/docs/`). O `commitar` declara o Environment, faz checkout da ponta da `main` com a deploy key, baixa o patch, aplica s\u00f3 o que cai nos tr\u00eas caminhos (`git apply --include`), recusa rename de fora para dentro e modo que n\u00e3o seja de arquivo comum (symlink, gitlink), e no Manual s\u00f3 aceita p\u00e1gina que j\u00e1 existe na `main` e volta igual, com o `true` da linha `draft:` trocado por `false`. Commita como `github-actions[bot]` com `[skip ci]` e empurra. Ele n\u00e3o instala nada. O terceiro, `avisar` (issue #951), roda depois do `commitar` e s\u00f3 se ele deu certo: comenta no PRD fechado o que ficou do Manual para o humano publicar. Ele s\u00f3 tem `issues: write`, n\u00e3o faz checkout nem instala nada, e a \u00fanica entrada s\u00e3o as sa\u00eddas do passo do draft do `gerar` (aviso, PRDs e vers\u00e3o), que roda antes do `uv sync`, lidas por `env` e n\u00e3o interpoladas no `run`.\n\n3. **O `[skip ci]` passa a carregar peso.** Push por deploy key dispara workflow, ao contr\u00e1rio do `GITHUB_TOKEN`. O `[skip ci]` no assunto e o `paths-ignore` da pr\u00f3pria Action impedem o loop.\n\n## Emendas\n\n- **ADR 0062, decis\u00e3o 10:** onde se l\u00ea \"bypass do ruleset s\u00f3 para `github-actions[bot]`\" e \"Push pelo `GITHUB_TOKEN` n\u00e3o redispara workflow\", vale esta ADR: o ator do bypass \u00e9 a deploy key da Action, o autor do commit continua `github-actions[bot]`, e quem evita o loop \u00e9 o `[skip ci]` com o filtro de caminhos. A frase da emenda \u00e0 ADR 0061 (\"bypass de escopo fixo\") s\u00f3 passa a ser verdade com esta ADR: a regra \"subir c\u00f3digo \u00e9 por PR, admin inclu\u00eddo\" volta a valer para todo workflow que n\u00e3o seja o job `commitar` na `main`.\n\n## Alternativas descartadas\n\n- **Manter a integration 15368 e s\u00f3 separar os jobs.** Fecha o caminho do PyPI, mas n\u00e3o o YAML de outra branch com `contents: write`.\n- **GitHub App pr\u00f3pria como ator.** Escopo igual ao da deploy key, com mais pe\u00e7as (app, instala\u00e7\u00e3o, troca de token por job) para um \u00fanico push.\n- **Passar os arquivos em vez de um patch.** O artefato n\u00e3o leva arquivo apagado, e sobrescrever os tr\u00eas caminhos apagaria a p\u00e1gina do Manual que um PR mergeasse entre os dois jobs.\n\n## Consequ\u00eancias\n\n- Criar a deploy key com escrita, o Environment `pos-merge` (s\u00f3 a branch `main`) e o secret `POS_MERGE_DEPLOY_KEY` \u00e9 tarefa do admin, na tela do GitHub, junto com aplicar o ruleset (pend\u00eancia #1011). Deploy key nova com escrita, para qualquer outro fim, ganha o mesmo bypass: o repo fica com uma s\u00f3.\n- O patch vem de um job que roda pacote de terceiros. O `commitar` limita o estrago aos tr\u00eas caminhos e, no Manual, \u00e0 troca do `draft`: a `.mdx` executa no `pnpm build` de quem roda o `publicar.sh`, ent\u00e3o nenhuma outra linha dela vem do patch. Nos tr\u00eas caminhos nada nasce nem \u00e9 apagado: no snapshot s\u00f3 entra a reescrita dos arquivos que o `snapshot.py` escreve (o `TARGET_FILES`), e o `ARQUITETURA.md` s\u00f3 muda. Neste repo o agente executa o que l\u00ea: um `CLAUDE.md` ou uma skill dentro de `docs/spec/snapshots/` viraria instru\u00e7\u00e3o de sess\u00e3o sem humano, como a `/onda-enxuta`. O texto desses arquivos continua livre, e um snapshot adulterado engana quem l\u00ea.", "cita": [61], "decisao": "Decis\u00e3o do Pedro (06/out/2026, veredito de seguran\u00e7a do PR #1012, issue #940). A ADR 0062 (decis\u00e3o 10) deu o bypass do ruleset da `main` ao `github-actions[bot]` (integration 15368) para a Action p\u00f3s-merge commitar snapshot e draft do...", "emenda": [62], "emendada_por": [], "file": "docs/adr/0065-bypass-da-main-e-uma-deploy-key-no-job-que-nao-instala-nada.md", "number": 65, "slug": "0065-bypass-da-main-e-uma-deploy-key-no-job-que-nao-instala-nada", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "O bypass da `main` \u00e9 uma deploy key, usada s\u00f3 no job da Action que n\u00e3o instala nada"}, {"amended_by": null, "amends": "0063, 0064", "body_md": "Decis\u00e3o do Pedro (06/out/2026). No PRD #938 (Hospital OS), as fatias #943 e #944 s\u00f3 compartilhavam `tools/workflow-dashboard/static/app.js`, em pontos diferentes, e o plano as p\u00f4s em ondas diferentes pela regra \"arquivo em comum n\u00e3o roda junto\". Sem essa regra, a fila de 5 ondas virou 3. Cada onda a mais \u00e9 uma sess\u00e3o, um rabo e um deploy em s\u00e9rie, e o conflito que a regra evitava j\u00e1 tem dono: desde a ADR 0064 (decis\u00e3o 3) o rabo mergeia PR a PR, e conflito tira s\u00f3 aquele PR, que o `hr-corretor` rebaseia (motivo `conflito`, skill `resolver-conflitos`) enquanto os outros sobem.\n\n## Decis\u00e3o\n\n1. **O \u00fanico separador de ondas \u00e9 a depend\u00eancia.** As ondas se montam pelo grafo de bloqueio: o `blocked_by` nativo (ADR 0028) mais o \"rodar depois da #N\" escrito na issue, que vira nativo no plano. Arquivo em comum, dentro de uma sess\u00e3o ou entre sess\u00f5es, n\u00e3o separa onda nem sess\u00e3o. Sess\u00f5es se separam por tema ou PRD.\n2. **Mesmo ponto \u00e9 depend\u00eancia, e vira `blocked_by` expl\u00edcito.** O mesmo ponto \u00e9 a mesma entrada: as duas fatias editam a mesma rota, o mesmo item de menu ou a mesma fun\u00e7\u00e3o, ou uma usa o que a outra cria. Cada fatia acrescentar a pr\u00f3pria linha de `include_router` no `main.py` ou o pr\u00f3prio item no `AdminSidebar.tsx` n\u00e3o \u00e9 mesmo ponto: as duas rodam juntas, e o rabo PR a PR resolve o conflito de texto. Exemplo: as fatias 1 e 2 criam as rotas `/pops` e `/ouvidoria`, cada uma com o pr\u00f3prio `include_router` no `main.py`, e andam na mesma onda; a fatia 3 muda a rota `/pops` que a 1 cria e anda depois da 1, com o `blocked_by` dela. Quando \u00e9 mesmo ponto, a de depois ganha o `blocked_by` nativo da de antes. Nunca uma regra impl\u00edcita de \"arquivo em comum\".\n3. **A onda \u00e9 toda issue desbloqueada da fila fixa**, at\u00e9 o `--paralelo`, mesmo que o plano ou a passagem a tenha posto numa onda posterior. A fila do prompt e da passagem lista, al\u00e9m das ondas, a depend\u00eancia de cada issue (\"#945, depois da #944\"), e o `--paralelo` da pr\u00f3xima sess\u00e3o \u00e9 o n\u00famero de issues desbloqueadas quando a passagem \u00e9 escrita, com teto 3.\n\nRejeitado: manter o arquivo como separador. Custava ondas em s\u00e9rie por um conflito que o rabo PR a PR j\u00e1 resolve sem parar a onda, e escondia a depend\u00eancia real atr\u00e1s do nome do arquivo.\n\n## Emenda \u00e0 ADR 0064\n\n- **Decis\u00e3o 5 (a).** \"Fatias da mesma onda n\u00e3o compartilham arquivo de costura\" passa a \"fatias que s\u00f3 compartilham o arquivo de costura andam na mesma onda; o mesmo ponto de registro \u00e9 depend\u00eancia, com `blocked_by`\". O resto da decis\u00e3o continua.\n\n## Emenda \u00e0 ADR 0063\n\n- **Fluxo sem humano no merge.** A regra derivada dela no `/pegar-issue` (passo 3: \"duas issues que tocam o mesmo arquivo n\u00e3o andam ao mesmo tempo (ADR 0063): o conflito s\u00f3 apareceria no rabo\", com o `arquivo_em_comum.py` gravando `blocked_by` e recusando o claim) e o eco dela no `/montar-ondas-enxutas` saem: o conflito aparece no rabo e \u00e9 resolvido l\u00e1, PR a PR, pelo `hr-corretor`.\n\n## Consequ\u00eancias\n\n- Mudam `/montar-ondas-enxutas` (passo 1, balde \"Bloqueada\"; passo 4; template da fila), `/to-issues` (paralelismo real, quiz e ondas previstas no PRD), `/onda-enxuta` (passos 1 e 7) e a passagem em `references/prompts.md`.\n- O `/pegar-issue` foi alinhado: no passo 3, o `arquivo_em_comum.py` s\u00f3 imprime um aviso de uma linha com os arquivos que coincidem com issues `in-progress`, n\u00e3o grava `blocked_by` e n\u00e3o impede o claim. Depend\u00eancia real continua sendo o `blocked_by` que quem fatia escreve, e o passo 2 do `/pegar-issue` segue recusando issue com bloqueadora aberta.\n- Mais conflitos no rabo, cada um custando uma rodada do `hr-corretor` e uma tentativa da fatia (teto de 3, ADR 0022), contra uma onda inteira a menos.", "cita": [22, 28], "decisao": "Rejeitado: manter o arquivo como separador. Custava ondas em s\u00e9rie por um conflito que o rabo PR a PR j\u00e1 resolve sem parar a onda, e escondia a depend\u00eancia real atr\u00e1s do nome do arquivo.", "emenda": [63, 64], "emendada_por": [], "file": "docs/adr/0066-ondas-por-dependencia-nao-por-arquivo.md", "number": 66, "slug": "0066-ondas-por-dependencia-nao-por-arquivo", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Ondas se separam por depend\u00eancia, n\u00e3o por arquivo"}, {"amended_by": null, "amends": "0064", "body_md": "Decis\u00e3o do Pedro (06/out/2026, depois de medir os PRDs #938 e #963). Implementar uma fatia leva de 10 a 25 min; a revis\u00e3o at\u00e9 o verde leva mediana de 28 min, com cauda de 1h a 3h, e \u00e9 a fase ativa mais cara. Em 05 e 06/10, 12 dos 13 PRs de implementa\u00e7\u00e3o n\u00e3o tocavam `hospital-reunioes/` e mesmo assim passaram por 2 a 7 rodadas de revis\u00e3o; o PR #1012 (s\u00f3 workflow) teve 4 rodadas de seguran\u00e7a, uma delas executando o passo de commit do workflow, e a sess\u00e3o parou 42 min oferecendo op\u00e7\u00f5es A, B e C a um humano que n\u00e3o estava olhando. Cada rodada nova achava algo novo fora do que a corre\u00e7\u00e3o mexeu. Esta ADR corta o la\u00e7o.\n\n## Decis\u00f5es\n\n1. **PR de ferramenta n\u00e3o tem revisor.** PR sem nenhum arquivo em `hospital-reunioes/` (skills, agentes, `tools/`, `.github/`, docs) n\u00e3o dispara `hr-revisor`, spec\u00d7diff nem `hr-revisor-seguranca`. O CI \u00e9 o gate. Emenda a decis\u00e3o 1 da 0064, que rejeitou \"ficar s\u00f3 com CI\": a r\u00e9gua vale para o app, onde o custo de um bug \u00e9 o hospital; para ferramenta interna, o bug aparece no CI ou no uso e se corrige para frente. O ruleset da `main` (PR obrigat\u00f3rio e CI verde) continua igual.\n\n2. **No app, uma revis\u00e3o, uma corre\u00e7\u00e3o, sem re-revis\u00e3o.** O `hr-revisor` (e o `hr-revisor-seguranca`, quando o PR toca rota sem login ou migration) roda uma vez. Must-fix vai ao `hr-corretor` uma vez; depois dele, quem confere \u00e9 o CI. N\u00e3o existe rodada 2. Corretor que termina com must-fix pendente \u00e9 baixa (`ready-for-human`) e o lote segue. Revisor que n\u00e3o d\u00e1 veredito tamb\u00e9m \u00e9 baixa, sem redisparo.\n\n3. **Revisor s\u00f3 olha o que o diff muda.** Achado em linha que o diff n\u00e3o toca \u00e9 descartado: n\u00e3o vira must-fix nem issue. O revisor de seguran\u00e7a julga lendo, sem executar c\u00f3digo, workflow ou ataque simulado. A seguran\u00e7a do resto continua com o `hr-auditor-prd`, uma vez, no fechamento do PRD (0064, decis\u00e3o 4).\n\n4. **Agente nunca para para perguntar.** Na sess\u00e3o de fundo, d\u00favida, impasse ou decis\u00e3o que o prompt n\u00e3o traz vira baixa com uma linha de motivo; ningu\u00e9m oferece op\u00e7\u00f5es nem espera resposta.\n\nRejeitado: manter a re-revis\u00e3o com teto (o teto da 0064 j\u00e1 existia e as sess\u00f5es fizeram de 3 a 7 rodadas mesmo assim); revis\u00e3o de ferramenta s\u00f3 por amostragem (\u00e9 regra a mais para o orquestrador decidir); revisor que abre issue com o achado fora do diff (\u00e9 o mesmo trabalho novo, s\u00f3 adiado).\n\n## Consequ\u00eancias\n\n- Uma fatia de ferramenta vai do claim ao merge em cerca de 20 min (implementar mais CI).\n- Bug em ferramenta interna passa a ser pego pelo CI, pelo CI de push na `main` ou pelo uso.\n- Uma corre\u00e7\u00e3o do app pode entrar sem olho de revisor sobre ela; o CI e o auditor do PRD s\u00e3o a rede.", "cita": [], "decisao": "Decis\u00e3o do Pedro (06/out/2026, depois de medir os PRDs #938 e #963). Implementar uma fatia leva de 10 a 25 min; a revis\u00e3o at\u00e9 o verde leva mediana de 28 min, com cauda de 1h a 3h, e \u00e9 a fase ativa mais cara. Em 05 e 06/10, 12 dos 13 PRs de...", "emenda": [64], "emendada_por": [], "file": "docs/adr/0067-ferramenta-sem-revisor-e-revisao-unica-no-app.md", "number": 67, "slug": "0067-ferramenta-sem-revisor-e-revisao-unica-no-app", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "PR de ferramenta sem revisor, revis\u00e3o \u00fanica no app e agente que nunca para para perguntar"}, {"amended_by": "0078, 0094", "amends": null, "body_md": "O que o pipeline faz hoje, de issue a produ\u00e7\u00e3o. O hist\u00f3rico de como se chegou aqui fica nas ADRs que esta substitui e nos PRs da poda (#1033, #1034, #1036).\n\n## Trabalho\n\n1. **O trabalho vive nas GitHub Issues.** PRD vira issues com depend\u00eancia (`blocked_by`). S\u00f3 entra na fila issue `ready-for-agent`, sem dono, sem bloqueio aberto e de autor de dentro do reposit\u00f3rio (`OWNER`, `MEMBER`, `COLLABORATOR`). O status da issue nunca mente e ningu\u00e9m o mant\u00e9m \u00e0 m\u00e3o: o `/ship` marca os crit\u00e9rios de aceite com os gates verdes, a Action de higiene limpa as labels no fechamento e fecha o PRD quando a \u00faltima filha fecha, e coment\u00e1rio do revisor (`revisor-comentou`) reabre e refaz na mesma issue. O bloqueio entre issues \u00e9 a depend\u00eancia nativa do GitHub (`blocked_by`), \u00fanica fonte da verdade: a fila \u00e9 `-is:blocked` e destrava sozinha quando a bloqueadora fecha.\n2. **Dois jeitos de andar:** \u00e0 m\u00e3o (`/pegar-issue`, `/tdd`, `/ship`) ou AFK (`/onda-enxuta`): uma sess\u00e3o de fundo por onda, at\u00e9 3 issues em paralelo. O \u00fanico separador de ondas \u00e9 a depend\u00eancia, n\u00e3o o arquivo.\n3. **Tr\u00eas agentes:** `hr-implementador` (claim, TDD, PR, morre), `hr-revisor` e `hr-corretor`. Esfor\u00e7o sobe por disparo (`xhigh` na fatia G, `max` na segunda falha de CI), n\u00e3o por agente novo.\n\n## Gates\n\n4. **PR de ferramenta** (nenhum arquivo em `hospital-reunioes/`): s\u00f3 o CI.\n5. **PR do app:** o `hr-revisor` roda uma vez, olha s\u00f3 as linhas que o diff muda e reporta s\u00f3 must-fix (spec n\u00e3o cumprida, bug que o teste n\u00e3o pega, teste v\u00e1cuo, segredo, regress\u00e3o de permiss\u00e3o). Rota sem login ou migration (`sensivel.py`) acrescenta a lente de seguran\u00e7a no mesmo revisor. Must-fix vai a um `hr-corretor` fresco, uma vez; depois dele, quem confere \u00e9 o CI.\n6. **Nenhum agente para para perguntar.** D\u00favida ou impasse \u00e9 baixa: `ready-for-human` com uma linha de motivo. A fatia tem 3 tentativas, somando implementa\u00e7\u00e3o, corre\u00e7\u00f5es e conflitos.\n\n6a. **N\u00e3o existe auditoria de PRD.** O PRD fecha quando a \u00faltima sub-issue fecha; a seguran\u00e7a e a spec s\u00e3o conferidas por PR, pelo `hr-revisor`.\n\n## At\u00e9 produ\u00e7\u00e3o\n\n7. **A `main` \u00e9 protegida:** PR e CI verde obrigat\u00f3rios, sem exigir a branch em dia com a base. O \u00fanico bypass \u00e9 a deploy key da Action p\u00f3s-merge, num job que n\u00e3o instala nada.\n8. **A subida \u00e9 uma s\u00f3, o `fechar_onda.py`**, para PR avulso e para onda: merge PR a PR pela API (squash, no head do CI verde), vers\u00e3o pelo tipo dos commits sem commit (`APP_VERSION` e tag), um build, health com confer\u00eancia de vers\u00e3o, registro em `history.json` e `state.json`. Health ruim: rollback autom\u00e1tico para a imagem anterior, revert dos squashes e issue reaberta. PR de ferramenta: s\u00f3 o merge.\n9. **Tr\u00eas coisas esperam o humano:** (1) a migration (ele cola no Studio; a subida espera o `/api/health` devolver o n\u00famero dela, at\u00e9 24 h); (2) o rollback que a subida n\u00e3o conseguiu sozinha (sa\u00eddas 3, 4 e 8 do `fechar_onda.py`: `/deploy rollback` \u00e0 m\u00e3o); (3) a baixa `ready-for-human` (3 tentativas esgotadas, d\u00favida, corretor pendente). A Fatia de manual sobe como qualquer outra fatia (emenda de 14/10/2026, abaixo).\n10. **A onda seguinte sai no PR verde**, antes da subida da atual; o sem\u00e1foro ordena os deploys.\n11. **Snapshot e draft do Manual** saem na Action do push da `main`, n\u00e3o na subida.\n\n## Regra de casa\n\n12. **Cada regra tem uma casa:** script ou skill, nunca as duas. Decis\u00e3o de ferramenta vai no corpo do PR, n\u00e3o em ADR nova; ADR \u00e9 para o app e para mudan\u00e7a deste fluxo inteiro. As skills de `.claude/skills/` s\u00e3o o kit completo do fluxo e a fonte de verdade do Hospital; a c\u00f3pia global \u00e9 outra linhagem, e a duplicata \u00e9 intencional. O fluxo chega a outro Projeto pelo instalador do PedroOS (`skills/fluxo/` de l\u00e1); skill do pipeline criada, renomeada ou apagada atualiza o `/ask-pedro` no mesmo commit.\n\n## Emenda (14/out/2026, o draft do V\u00eddeo de tarefa deixa de esperar o humano)\n\nDecis\u00e3o do Pedro, depois do piloto de dois V\u00eddeos de tarefa (#1231, PR #1246): \"Eu n\u00e3o quero mais checar draft. Eu confio at\u00e9 o final. Eu n\u00e3o quero que voc\u00ea me pergunte.\" A regra 9 listava quatro esperas, e a segunda era o draft do v\u00eddeo da Fatia de manual: o PR ficava verde fora da subida at\u00e9 algu\u00e9m assistir ao MP4 e rodar o `fechar_onda.py`. Agora a Fatia de manual faz o render final na pr\u00f3pria fatia, abre o PR e entra na subida como qualquer outra fatia, sem `PushNotification` pedindo OK. Quem segura a qualidade do v\u00eddeo s\u00e3o os gates que o piloto deixou: `hyperframes check`, as strips de cada corte, o `tools/checar_video_manual.py` e o `tools/anel_video_manual.py`. Nota que o Pedro mandar depois, com o v\u00eddeo no ar, vira conserto e regra num PR novo, como qualquer outro pedido.\n\nA regra 9 passa a listar tr\u00eas esperas. A emenda de 13/10/2026 \u00e0 ADR 0057, que pedia OK por v\u00eddeo no dia a dia e por m\u00f3dulo na campanha de rerender, cai junto (emenda de 14/10/2026 \u00e0 ADR 0057). O V\u00eddeo de percep\u00e7\u00e3o de valor da `/divulgar` n\u00e3o muda: ele n\u00e3o passa pela subida e continua com o OK humano dele (ADRs 0026 e 0045).", "cita": [26, 45, 57], "decisao": "O que o pipeline faz hoje, de issue a produ\u00e7\u00e3o. O hist\u00f3rico de como se chegou aqui fica nas ADRs que esta substitui e nos PRs da poda (#1033, #1034, #1036).", "emenda": [], "emendada_por": [78, 94], "file": "docs/adr/0068-o-fluxo-em-uma-pagina.md", "number": 68, "slug": "0068-o-fluxo-em-uma-pagina", "status": "accepted", "substitui": [20, 22, 28, 29, 35, 43, 53, 61, 62, 63, 64, 65, 66, 67], "substituida_por": [], "superseded_by": null, "supersedes": "0020, 0022, 0028, 0029, 0035, 0043, 0053, 0061, 0062, 0063, 0064, 0065, 0066, 0067", "title": "O fluxo em uma p\u00e1gina"}, {"amended_by": "0077", "amends": "0054", "body_md": "Decis\u00e3o do Pedro (07/out/2026, grilling). A aba Tecnologia (ADRs 0050, 0054, 0056) est\u00e1 em produ\u00e7\u00e3o e cumpre o papel, mas duas pontas continuam fora dela: o diretor n\u00e3o tem como anexar um print \u00e0 Demanda (o Assistente l\u00ea a imagem e joga fora), e a Etapa para em \"Entregue\" no merge, quando o que o diretor quer saber \u00e9 se j\u00e1 pode usar. Esta ADR fecha as duas pontas. O redesenho da aba decidido na mesma sess\u00e3o (tr\u00eas raias vivas, card de duas linhas, Produtos em tela pr\u00f3pria, Painel no lugar de \"Minha vez\" e \"Hist\u00f3rico\") \u00e9 vocabul\u00e1rio, est\u00e1 no `CONTEXT.md` e n\u00e3o precisa de ADR.\n\n## Contexto\n\n- O reposit\u00f3rio \u00e9 **p\u00fablico** (decis\u00e3o de 09/2026). A ADR 0060 j\u00e1 passa pela peneira de dado pessoal todo texto que o app manda para a issue. Um print de tela do hospital carrega nome de paciente, de colaborador, protocolo da Ouvidoria.\n- O GitHub n\u00e3o tem API para anexar imagem a issue: o que a tela faz ao arrastar um arquivo \u00e9 um endpoint n\u00e3o documentado de `user-attachments`, e o resultado \u00e9 uma URL p\u00fablica.\n- O app j\u00e1 tem o molde dos dois lados: bucket privado com URL assinada (anexos da Ouvidoria, migration 066) e token de servi\u00e7o por `X-API-Key` (API da Ana, ADR 0031).\n- A Action p\u00f3s-merge (`pos-merge.yml`) j\u00e1 recebe o registro do deploy por `workflow_dispatch` (vers\u00e3o, PRs do lote) e \u00e9 o \u00fanico lugar que sabe, com certeza, que uma vers\u00e3o subiu.\n- O webhook `issues` j\u00e1 grava a Etapa em segundos; a tela rel\u00ea a cada 30 s. A lat\u00eancia n\u00e3o \u00e9 o problema, a cobertura \u00e9: PR aberto e deploy n\u00e3o geram evento nenhum.\n- Quem pega a issue hoje \u00e9 o `/pegar-issue` no terminal ou o `hr-implementador` na `/onda-enxuta`, e os dois leem a issue pelo `gh`.\n\n## Decis\u00f5es\n\n1. **O Anexo da Demanda vive no app e nunca vai para o GitHub.** Imagem (png, jpg, webp, mesmo teto do Assistente), at\u00e9 dez por Demanda, por tr\u00eas portas: formul\u00e1rio, Assistente (o print que ele descreve vira Anexo se o diretor clicar \"Criar Demanda\") e resposta da Conversa. Bucket privado pr\u00f3prio (`anexos-tecnologia`), tela abre por URL assinada. A issue vinculada ganha s\u00f3 a frase \"Anexos: N imagens na Demanda\"; o coment\u00e1rio espelhado de uma resposta com imagem sai como texto mais \"(1 imagem na Demanda)\". Rejeitado: `![](url assinada)` na issue (expira, e enquanto vale \u00e9 p\u00fablica), base64 no corpo (teto de 65k caracteres), commitar a imagem no reposit\u00f3rio (p\u00fablico).\n\n2. **Quem desenvolve busca o Anexo pelo app, por uma boca s\u00f3.** Rota de leitura dos anexos de uma Demanda protegida por chave de automa\u00e7\u00e3o pr\u00f3pria (`TECNOLOGIA_AUTOMACAO_API_KEY`, molde do `require_ana_api_key`; vive no Coolify e no `tokens/.env` de cada s\u00f3cio). Um script na skill (`pegar-issue/scripts/anexos.py <issue>`) l\u00ea o id da Demanda no marcador que o corpo da issue j\u00e1 carrega, baixa as imagens para `local/anexos/<issue>/` (fora do git) e o agente as l\u00ea como arquivo. Tr\u00eas chamadores: `/pegar-issue`, o prompt do `hr-implementador` (no passo \"leia a issue\", quando o corpo diz \"Anexos\") e o `hr-corretor`. Rejeitado: cada skill chamar a API do seu jeito (tr\u00eas implementa\u00e7\u00f5es para divergir) e o orquestrador da onda baixar e passar os caminhos (o implementador roda em worktree pr\u00f3prio e o corretor \u00e9 outro agente).\n\n3. **O bin\u00e1rio \u00e9 apagado quando a Demanda chega a Conclu\u00edda ou Cancelada**, o ato humano que encerra, nunca pela Etapa: em \"Em produ\u00e7\u00e3o\" o diretor ainda confere com o print na m\u00e3o. Fica o registro (nome, quem anexou, quando), marcado apagado, para a Conversa n\u00e3o quebrar. Mesmo motivo da Ouvidoria (#631): bin\u00e1rio parado em bucket privado de assunto encerrado \u00e9 dado pessoal permanente. Na m\u00e1quina do s\u00f3cio, o `/ship` apaga `local/anexos/<issue>/` ao abrir o PR. Rejeitado: reten\u00e7\u00e3o por tempo (quem decide que acabou \u00e9 quem conclui) e apagar na Etapa Entregue (o diretor ainda n\u00e3o conferiu).\n\n4. **Nasce a s\u00e9tima Etapa, Em produ\u00e7\u00e3o, gravada pela Action p\u00f3s-merge.** O passo que aplica o registro do deploy chama `POST /webhooks/deploy` no app, com HMAC (segredo pr\u00f3prio), vers\u00e3o e PRs do lote; o app marca Em produ\u00e7\u00e3o, com a vers\u00e3o, as Demandas cujas issues foram fechadas por aqueles PRs, e grava a linha autom\u00e1tica \"Em produ\u00e7\u00e3o na vX.Y.Z\" na Conversa. Entregue continua sendo o fechamento da issue (decis\u00e3o 3 da ADR 0054 fica de p\u00e9 nisso): entre o merge e a subida o card diz Entregue, depois \"Em produ\u00e7\u00e3o desde vX.Y.Z\". O cron de reconcilia\u00e7\u00e3o cobre o que a Action n\u00e3o entregou, lendo o `history.json` da `main`. Rejeitado: o `fechar_onda.py` chamar o app da m\u00e1quina do s\u00f3cio (mais um passo que falha em sil\u00eancio num laptop; a Action tem o segredo e roda depois do registro) e o app ler o `state.json` (a ADR 0054 recusou acoplar ao arquivo, e continua recusado: o acoplamento \u00e9 por evento, e o arquivo \u00e9 s\u00f3 a reconcilia\u00e7\u00e3o).\n\n5. **A devolu\u00e7\u00e3o a quem pediu passa de Entregue para Em produ\u00e7\u00e3o** quando a issue fechou por PR. O diretor n\u00e3o tem como conferir o que ainda n\u00e3o subiu; devolver no merge era pedir que ele testasse o que n\u00e3o existia. Issue fechada \u00e0 m\u00e3o, sem PR (decis\u00e3o, consultoria, corre\u00e7\u00e3o fora do c\u00f3digo), devolve em Entregue como hoje. O e-mail de atribui\u00e7\u00e3o \u00e9 o mesmo. Isso emenda a decis\u00e3o 6 da ADR 0054.\n\n6. **O webhook passa a tratar `pull_request`.** PR aberto que fecha a issue (`closingIssuesReferences`) vira Em desenvolvimento na hora, sem depender de algu\u00e9m p\u00f4r a label `in-progress`. PR fechado sem merge n\u00e3o mexe na Etapa (a label e as sub-issues continuam dizendo o que vale).\n\n## Alternativas descartadas\n\n- **Guardar a imagem no GitHub como asset de Release ou em branch \u00f3rf\u00e3.** Continua p\u00fablico.\n- **Mandar a descri\u00e7\u00e3o da imagem (o texto que o Assistente j\u00e1 gera) em vez da imagem.** \u00datil para o diretor, cego para quem corrige um defeito visual; vai junto, n\u00e3o no lugar.\n- **Etapa Em produ\u00e7\u00e3o lida do `/health` do backend pelo app.** O app saberia a vers\u00e3o no ar, n\u00e3o quais issues subiram nela.\n\n## Consequ\u00eancias\n\n- Migration: tabela de anexos da Demanda (Demanda, caminho, nome, quem, quando, apagado em) e a Etapa `em_producao` com a vers\u00e3o na Demanda. Bucket `anexos-tecnologia` privado, RLS default-deny.\n- Backend: upload e leitura assinada de anexos, rota de automa\u00e7\u00e3o por `X-API-Key`, apagamento no Concluir/Cancelar, webhook `pull_request` e `deploy`, reconcilia\u00e7\u00e3o de Em produ\u00e7\u00e3o pelo `history.json`.\n- Action p\u00f3s-merge: um passo a mais, depois do registro, com `TECNOLOGIA_DEPLOY_WEBHOOK_SECRET` nos secrets do reposit\u00f3rio. Cadastro do segredo no Coolify \u00e9 passo humano.\n- Skills: `pegar-issue/scripts/anexos.py`; `/pegar-issue`, `hr-implementador` e `hr-corretor` chamam o script; `/ship` apaga a pasta local; `/ask-pedro` cita a boca \u00fanica.\n- Gloss\u00e1rio: Anexo da Demanda, Etapa com Em produ\u00e7\u00e3o, Quadro, Painel (j\u00e1 escritos).\n- Kit de conhecimento (arquivo da aba Tecnologia) e manual da aba (p\u00e1gina HTML pr\u00f3pria) mudam no mesmo PRD.\n\n## Emenda a este ADR (07/out/2026, auditoria do PRD #1056)\n\n**Decis\u00e3o 2, o que a rota de automa\u00e7\u00e3o responde quando recusa.** A rota de leitura dos anexos (`GET /api/automacao/tecnologia/demandas/{id}/anexos`) segue o molde da API da Ana em quase tudo: chave ausente, vazia ou errada responde **401**, igual. A diferen\u00e7a \u00e9 deliberada e vem da fatia #1063: quando `TECNOLOGIA_AUTOMACAO_API_KEY` **n\u00e3o est\u00e1 configurada no servidor**, a rota responde **503** (\"ponte desligada\"), enquanto a Ana responde 401 (`require_tecnologia_automacao_api_key` em `backend/app/dependencies.py`). O motivo \u00e9 quem chama: o `anexos.py` roda na m\u00e1quina do s\u00f3cio e precisa distinguir os dois casos, porque o conserto \u00e9 outro. No 503 ele diz que falta criar a chave na tela do Coolify; no 401, que a chave do `tokens/.env` est\u00e1 errada. N\u00e3o \u00e9 desvio a corrigir: trocar o 503 por 401 faria o s\u00f3cio trocar de chave \u00e0 toa quando o que falta \u00e9 o cadastro no servidor.\n\n## Emenda a este ADR (09/nov/2026, grilling em lote)\n\n**Decis\u00e3o 1, o Anexo da Demanda passa a aceitar documento.** O diretor relatou que preparou um Markdown com melhorias de auditoria e o chat recusou: a decis\u00e3o 1 s\u00f3 previa print. O Anexo passa a ser imagem ou documento, e o resto da decis\u00e3o fica de p\u00e9 (vive no app, nunca vai para o GitHub, bucket privado, mesma regra de apagar).\n\n- **Tipos.** Primeiro `.md`, `.txt`, `.pdf` e `.docx`, que o extrator de texto do app j\u00e1 l\u00ea em processo isolado (issue #758). Depois `.xlsx` e `.csv`, em fatia pr\u00f3pria, porque o `.xlsx` pede parser novo, que tamb\u00e9m nasce isolado. `.xls` antigo fica de fora. PDF escaneado \u00e9 recusado com a frase que manda enviar como print. Rejeitado: OCR.\n- **Leitura.** O texto inteiro do documento entra na conversa como material cercado, com teto de 100 mil caracteres; acima disso a recusa pede para dividir. Na tela a fala mostra s\u00f3 o nome e o tamanho do arquivo. Rejeitado: resumir antes de entregar ao agente (ele planejaria em cima de um resumo, e o que o resumo cortou n\u00e3o volta).\n- **Tetos.** Dez anexos por Demanda, somando imagens e documentos. 5 MB para `.md`, `.txt` e `.csv`; 15 MB para `.pdf`, `.docx` e `.xlsx`, os tetos do extrator. A imagem continua no teto do Assistente.\n- **GitHub.** A issue diz s\u00f3 a contagem (\"Anexos: 2 imagens e 1 documento na Demanda\"). O PRD que nasce da conversa segue passando pela peneira de dado pessoal (ADR 0060). O original chega a quem desenvolve pela mesma rota de automa\u00e7\u00e3o e pelo mesmo `anexos.py` (decis\u00e3o 2).\n- **V\u00e1rias melhorias num documento.** Continua sendo uma Demanda e um PRD do diretor, com as fatias saindo no `/to-issues`. Se o documento mistura m\u00f3dulos sem rela\u00e7\u00e3o, o agente avisa e prop\u00f5e um assunto por conversa. Rejeitado: o agente abrir um card por melhoria (quebra o par Demanda e issue-raiz da ADR 0077).\n\nConsequ\u00eancia: migration que alarga o CHECK de `content_type` e de `tamanho_bytes` da tabela de anexos (migration 115), e o texto extra\u00eddo guardado junto da fala, fora do limite de caracteres da mensagem. Kit de conhecimento da aba Tecnologia e a p\u00e1gina do manual mudam na primeira fatia.", "cita": [31, 50, 56, 60], "decisao": "Decis\u00e3o do Pedro (07/out/2026, grilling). A aba Tecnologia (ADRs 0050, 0054, 0056) est\u00e1 em produ\u00e7\u00e3o e cumpre o papel, mas duas pontas continuam fora dela: o diretor n\u00e3o tem como anexar um print \u00e0 Demanda (o Assistente l\u00ea a imagem e joga...", "emenda": [54], "emendada_por": [77], "file": "docs/adr/0069-anexo-da-demanda-fica-no-app-e-em-producao-devolve-ao-diretor.md", "number": 69, "slug": "0069-anexo-da-demanda-fica-no-app-e-em-producao-devolve-ao-diretor", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Anexo da Demanda fica no app, quem desenvolve busca; Em produ\u00e7\u00e3o \u00e9 a Etapa que devolve ao diretor"}, {"amended_by": "0073, 0074, 0081", "amends": null, "body_md": "Decis\u00e3o do Pedro (12/out/2026, grilling em modo lote) sobre a especifica\u00e7\u00e3o do Diretor Executivo para o m\u00f3dulo **Contas m\u00e9dicas** (spec v1.0 e adendos v1.1, v1.2 e v1.3, outubro/2026; os arquivos vivem em `local/contas-medicas/`, fora do git). A spec descreve o produto inteiro, 8 telas, 26 tabelas, dois passos de IA e a mem\u00f3ria de duas operadoras. Esta ADR fixa o que \u00e9 arquitetural e vale para os tr\u00eas PRDs em que o m\u00f3dulo foi partido; o vocabul\u00e1rio est\u00e1 em [`docs/contas-medicas/CONTEXT.md`](../contas-medicas/CONTEXT.md), terceiro contexto do reposit\u00f3rio.\n\n## Contexto\n\n- O SoulMV entrou em produ\u00e7\u00e3o no hospital h\u00e1 cerca de 60 dias. Tr\u00eas perdas nomeadas pelo diretor: parametriza\u00e7\u00e3o incompleta por operadora, dispensa\u00e7\u00e3o que n\u00e3o chega \u00e0 conta, e faturistas que n\u00e3o dominam o prontu\u00e1rio eletr\u00f4nico. O m\u00f3dulo existe para que toda conta de interna\u00e7\u00e3o saia corrigida antes do envio \u00e0 operadora e cada erro corrigido vire indicador de onde nasce.\n- O diretor mediu, em prontu\u00e1rio real de 952 p\u00e1ginas exportado do MV: a leitura por c\u00f3digo estrutura ou descarta 94% do texto (858 mil tokens viram 50 mil para a IA), em 12 segundos, e achou sozinha, sem IA, R$ 1.299 em tr\u00eas contas (pantoprazol prescrito em 6 dias e lan\u00e7ado em 3; dois medicamentos lan\u00e7ados sem nenhuma men\u00e7\u00e3o no prontu\u00e1rio; agulha com pre\u00e7o de coluna errada; oxig\u00eanio com c\u00f3digo de vaz\u00e3o errada). Custo estimado por conta com IA: US$ 0,11.\n- Cinco ou seis operadoras respondem por 90% das contas. A segunda (Unimed) j\u00e1 exige o que a primeira (ASSIM) n\u00e3o tem: pre\u00e7o por LPM com vers\u00e3o pela data do atendimento, di\u00e1ria global por acomoda\u00e7\u00e3o, transfer\u00eancia de setor sem di\u00e1ria extra, honor\u00e1rio por CBHPM com deflator, taxa de OPME. O modelo tem de ser gen\u00e9rico desde a primeira fatia.\n- O app n\u00e3o tem fila nem worker: um uvicorn de um worker, `BackgroundTasks` e um APScheduler no mesmo processo (`cron/scheduler.py`). N\u00e3o h\u00e1 rotina que recupere registro preso em `PROCESSANDO` ap\u00f3s restart. O extrator de documentos (`transcricao_extractor.py`) j\u00e1 roda `pdfplumber` em subprocesso com teto de mem\u00f3ria, prazo e 2 vagas.\n- A IA do app \u00e9 o OpenRouter pelo SDK `openai` (`ai_processor.py`), modelo por env, sa\u00edda s\u00f3 em `json_object`, sem cache de prompt, sem registro de `usage`. Doc do OpenRouter consultada em 12/10/2026: `response_format json_schema` com `strict` \u00e9 suportado por endpoint (conferir com `provider.require_parameters: true`; `google/gemini-3.7-flash` e `anthropic/claude-sonnet-5.5` t\u00eam `structured_outputs`); `provider.zdr: true` e `provider.data_collection: \"deny\"` restringem o roteamento a endpoints sem reten\u00e7\u00e3o; `cache_control: {\"type\": \"ephemeral\"}` no bloco de `content` cacheia para Anthropic (m\u00ednimo 1.024 tokens), Gemini 2.5+ cacheia implicitamente; `usage` sempre vem com `prompt_tokens`, `completion_tokens`, `cost` e `prompt_tokens_details.cached_tokens`.\n- O reposit\u00f3rio \u00e9 p\u00fablico. Mem\u00f3rias e tabelas de pre\u00e7o s\u00e3o termos de contrato do hospital com cada operadora; prontu\u00e1rios s\u00e3o dado pessoal sens\u00edvel (LGPD). A ADR 0060 j\u00e1 passa texto por peneira de dado pessoal antes de publicar, e `ouvidoria_pseudonimizacao.py` reconhece CPF, CNS, RG, data de nascimento, telefone e nome.\n- O c\u00f3digo de refer\u00eancia do diretor \u00e9 Python 3 (`leitura/`, 1.395 linhas) mais um contador de di\u00e1rias em JavaScript (`referencia-diarias.mjs`, 15 casos). O backend \u00e9 Python.\n\n## Decis\u00f5es\n\n1. **Aritm\u00e9tica no c\u00f3digo, IA s\u00f3 onde h\u00e1 julgamento.** Pre\u00e7o, di\u00e1ria, teto, nota, indicadores, prescri\u00e7\u00e3o contra conta, ficha anest\u00e9sica contra conta, g\u00e1s, exame e glicemia s\u00e3o confer\u00eancias por c\u00f3digo e geram linhas do Guia com `origem = CODIGO`. A IA entra em dois passos (A: ler texto livre e devolver eventos com p\u00e1gina e trecho; B: comparar eventos com a conta aplicando a mem\u00f3ria) e nunca devolve valor em reais, nunca conta di\u00e1ria, nunca confere pre\u00e7o. Toda linha da IA passa pela confer\u00eancia do c\u00f3digo (regra existe e est\u00e1 vigente, evid\u00eancia existe na p\u00e1gina, data dentro do per\u00edodo, teto recalculado) antes de chegar \u00e0 faturista.\n\n2. **Tr\u00eas PRDs encadeados, o primeiro sem IA.** PRD 1, Motor e carga: operadora, importa\u00e7\u00e3o de mem\u00f3ria e tabelas, leitura da conta e do prontu\u00e1rio por c\u00f3digo, di\u00e1rias, as confer\u00eancias por c\u00f3digo, Guia m\u00ednimo, upload e fila. PRD 2, IA e Painel: passos A e B, marca\u00e7\u00f5es de formul\u00e1rio, \"se necess\u00e1rio\", reenvio, nota e painel, custo por conta. PRD 3, Gest\u00e3o: Mem\u00f3ria por tela e ensinar regra, Valida\u00e7\u00e3o, Confer\u00eancia da coordena\u00e7\u00e3o, Contratos e aviso, Habilita\u00e7\u00e3o, ditado. O prazo de 48 a 72 horas da spec n\u00e3o cabe no pipeline (ADR 0068); o que o diretor v\u00ea primeiro \u00e9 o motor rodando nas contas reais dele.\n\n3. **A mem\u00f3ria da operadora mora no banco, n\u00e3o no c\u00f3digo.** O cabe\u00e7alho YAML do arquivo `MEMORIA-<SIGLA>-v<X.Y>.md` vira `parametros_json` inteiro: o c\u00f3digo l\u00ea as chaves que conhece com valor padr\u00e3o e preserva as demais na exporta\u00e7\u00e3o, para que `diaria_global`, `honorarios`, `opme` e o que a pr\u00f3xima operadora inventar entrem sem migration. As tabelas de regra viram uma linha de `cm_regra` cada. Tabela de pre\u00e7o tem vig\u00eancia por data e, por categoria, uma regra de pre\u00e7o do conjunto `COLUNA | PMC | PF | PF_MAIS_PERCENTUAL | LPM`; a categoria `HONORARIO` existe desde o in\u00edcio e, sem tabela carregada, o pre\u00e7o sai como \"n\u00e3o conferido\". Depois de importado, o banco \u00e9 a fonte; o arquivo passa a ser exporta\u00e7\u00e3o. Nada de uma operadora \u00e9 usado na an\u00e1lise de outra. Regra pendente nunca gera ordem: gera a a\u00e7\u00e3o Validar.\n\n4. **A operadora \u00e9 reconhecida pelo campo `Plano:` da conta.** A conta do MV n\u00e3o imprime o conv\u00eanio. Tabela `cm_operadora_plano` (nome do plano no MV \u2192 operadora \u2192 coluna de pre\u00e7o), mantida pela gest\u00e3o; plano desconhecido recusa a conta com o nome do plano, e nunca a analisa com regra de outra operadora.\n\n5. **Fila no banco, consumida pelo processo que j\u00e1 existe.** `cm_conta.situacao = NA_FILA`; um job do APScheduler faz claim at\u00f4mico por `UPDATE ... WHERE situacao = 'NA_FILA'` e roda a an\u00e1lise num executor pr\u00f3prio com 2 vagas; registro em `PROCESSANDO` h\u00e1 mais de 15 minutos volta para a fila. Sobrevive a restart e n\u00e3o cria servi\u00e7o novo no Coolify. Descartados: `BackgroundTasks` (morre no restart, sem recupera\u00e7\u00e3o) e worker em container separado (segundo servi\u00e7o, build concorrente d\u00e1 OOM na VPS; vira fatia de troca se a extra\u00e7\u00e3o de um prontu\u00e1rio de 900 p\u00e1ginas disputar CPU com as requisi\u00e7\u00f5es).\n\n6. **Extra\u00e7\u00e3o com `pdftotext -layout` (poppler-utils no Dockerfile) em subprocesso**, com o teto de mem\u00f3ria e as 2 vagas do extrator atual e prazo de 120 segundos. As express\u00f5es do c\u00f3digo de refer\u00eancia foram calibradas na sa\u00edda do `-layout`. `pdfplumber` (j\u00e1 no projeto) fica para coordenada de coluna da prescri\u00e7\u00e3o e para as marca\u00e7\u00f5es de caixa e bot\u00e3o, com Pillow. PyMuPDF (AGPL) n\u00e3o entra.\n\n7. **Nada do diretor \u00e9 versionado.** Specs, mem\u00f3rias, CSVs e PDFs reais ficam em `local/contas-medicas/` (ADR 0044) e entram no sistema por rota de upload com permiss\u00e3o \"Regra contratual e tabelas\", desde o PRD 1, numa tela m\u00ednima. Fixtures de teste s\u00e3o sint\u00e9ticas, em texto, uma por fam\u00edlia de documento, reproduzindo o layout do MV; PDF real nunca entra em teste. Fam\u00edlias, assinaturas e campos ficam no c\u00f3digo, com teste; mudam por PR quando o MV mudar de vers\u00e3o.\n\n8. **Dado de paciente: r\u00f3tulo e idade, mais nada.** Desidentifica\u00e7\u00e3o antes de qualquer envio \u00e0 IA e de qualquer grava\u00e7\u00e3o em banco, reaproveitando `ouvidoria_pseudonimizacao.py` e acrescentando a lista da spec (nome da capa e cada palavra dele, nome da m\u00e3e, CPF do m\u00e9dico na assinatura, carteira, RG no resumo de alta). No banco ficam `paciente_rotulo` (\"Maria S.\") e `idade_anos`. PDF e texto por p\u00e1gina ficam em bucket privado `contas-medicas` e s\u00e3o apagados 7 dias ap\u00f3s o envio por job di\u00e1rio do cron; sobrevivem os eventos desidentificados, os itens da conta e os trechos de evid\u00eancia de at\u00e9 300 caracteres. Teste autom\u00e1tico em toda conta: os valores lidos da capa n\u00e3o aparecem no texto de sa\u00edda. Log nunca carrega texto de prontu\u00e1rio.\n\n9. **IA pelo adaptador que existe, com o que faltava.** OpenRouter, modelo por passo via env (`CM_IA_MODELO_PASSO_A`, padr\u00e3o o flash em uso; `CM_IA_MODELO_PASSO_B`, padr\u00e3o `anthropic/claude-sonnet-5.5`); o teste de aceite do diretor nas 5 contas decide, e trocar \u00e9 env. Sa\u00edda por `response_format json_schema` com `strict` e `provider.require_parameters: true`, validada por Pydantic, 3 tentativas com espera crescente e depois `ERRO`. Toda requisi\u00e7\u00e3o do m\u00f3dulo vai com `provider.zdr: true` e `data_collection: \"deny\"`. A instru\u00e7\u00e3o e a mem\u00f3ria da operadora v\u00e3o num bloco com `cache_control`. Toda chamada grava tokens de entrada, sa\u00edda e cache, `usage.cost` e tempo por etapa em `cm_conta`. Registrar o provedor como operador de dados e avaliar transfer\u00eancia internacional \u00e9 decis\u00e3o do diretor com o jur\u00eddico, n\u00e3o da engenharia.\n\n10. **Permiss\u00e3o por eixo pr\u00f3prio.** `perfil_contas_medicas` em `participantes` (faturista, coordenadora, gest\u00e3o de contas m\u00e9dicas, diretoria m\u00e9dica, diretoria executiva, credenciamento), ortogonal aos eixos de Reuni\u00f5es, POPs e Ouvidoria, mais `cm_perfil_permissao` (perfil \u00d7 8 permiss\u00f5es, carga inicial na migration). Guard `require_permissao_cm(\"...\")` por rota; `is_super_admin` passa, como nos outros m\u00f3dulos. Faturista v\u00ea s\u00f3 as contas em que \u00e9 `faturista_id`, filtrado no servidor.\n\n11. **Uma migration por PRD** (116, 117, 118), RLS default-deny em toda tabela, recibo em `migracoes_aplicadas`, aplica\u00e7\u00e3o manual no Studio. Prefixo `cm_`. O tipo `CONTAS_MEDICAS` entra no CHECK de `notificacoes.tipo` na 116.\n\n12. **\"Auditoria\" n\u00e3o aparece** em tela, rota, texto, Manual nem nome de tabela do m\u00f3dulo. O `audit_log` gen\u00e9rico do app fica como est\u00e1.\n\n## Consequ\u00eancias\n\n- O diretor pode entregar a mem\u00f3ria de uma operadora nova e ela entra sem deploy; par\u00e2metro que o c\u00f3digo ainda n\u00e3o l\u00ea fica preservado e vis\u00edvel, n\u00e3o perdido.\n- A primeira entrega rende valor sem gastar token e sem risco de LGPD por IA. A IA chega com o motor j\u00e1 calibrado nas contas reais.\n- O contador de di\u00e1rias (`referencia-diarias.mjs`) e `leitura/*.py` s\u00e3o portados para `app/services/contas_medicas/` com os 15 casos da ASSIM e os 4 da Unimed como pytest; parametrizados pelo bloco `diaria` da mem\u00f3ria, n\u00e3o por constante.\n- A fila no mesmo processo \u00e9 a aposta mais arriscada desta ADR: se a extra\u00e7\u00e3o de um prontu\u00e1rio grande atrapalhar o app, a sa\u00edda \u00e9 o worker em container separado, numa fatia pr\u00f3pria, sem mudar o contrato da fila (claim por `UPDATE`).\n- O Manual ganha a se\u00e7\u00e3o Contas m\u00e9dicas quando o PRD 1 estiver em produ\u00e7\u00e3o (ADR 0057).", "cita": [44, 57, 60, 68], "decisao": "Decis\u00e3o do Pedro (12/out/2026, grilling em modo lote) sobre a especifica\u00e7\u00e3o do Diretor Executivo para o m\u00f3dulo **Contas m\u00e9dicas** (spec v1.0 e adendos v1.1, v1.2 e v1.3, outubro/2026; os arquivos vivem em `local/contas-medicas/`, fora do...", "emenda": [], "emendada_por": [73, 74, 81], "file": "docs/adr/0070-contas-medicas-aritmetica-no-codigo-ia-no-julgamento-memoria-no-banco.md", "number": 70, "slug": "0070-contas-medicas-aritmetica-no-codigo-ia-no-julgamento-memoria-no-banco", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Contas m\u00e9dicas: aritm\u00e9tica no c\u00f3digo, IA s\u00f3 onde h\u00e1 julgamento, mem\u00f3ria da operadora no banco, fila no banco"}, {"amended_by": "0078", "amends": "0057", "body_md": "Decis\u00e3o do Pedro (13/out/2026, grilling). O texto que o hospital l\u00ea (Manual do usu\u00e1rio, telas do app, PDFs de Ata e POP, hover do Hospital OS, mensagens e p\u00e1ginas de divulga\u00e7\u00e3o) \u00e9 escrito por agente, e carrega os cacoetes de texto gerado: \"n\u00e3o \u00e9 X, \u00e9 Y\", fecho de uma linha que repete o par\u00e1grafo, tr\u00edade, r\u00f3tulo em negrito. A ADR 0057 rejeitou em setembro uma \"humaniza\u00e7\u00e3o separada\" porque o texto do manual \"j\u00e1 era humano\"; um m\u00eas depois os cacoetes est\u00e3o nas 106 p\u00e1ginas, no front e nos 200 PRs que o Hospital OS resume. Esta ADR fixa a skill global `humanizer` como r\u00e9gua de tudo que sai para fora e decide a reescrita do que j\u00e1 existe.\n\n## Decis\u00f5es\n\n1. **Regra global, gate local.** O `~/.claude/CLAUDE.md` (regra 8) manda todo texto para leitor de fora passar pelo humanizer em modo embutido antes de ser gravado, em qualquer reposit\u00f3rio. No Hospital, as skills que produzem texto (`/manual`, `/ship`, `/divulgar`, `/mensagem-prd`, `/to-prd`, `/to-issues`) chamam o humanizer no fechamento, e o que d\u00e1 para pegar por regex trava no CI: `tools/lint_manual.py` e a regra do ESLint do front (que j\u00e1 travam travess\u00e3o) ganham os tells mec\u00e2nicos (contraste \"n\u00e3o \u00e9 X, \u00e9 Y\" e variantes \"n\u00e3o s\u00f3/apenas/somente... mas\", fecho repetido, \"n\u00e3o X: Y\"). Um reposit\u00f3rio pode somar amostra de voz, jarg\u00e3o e lint; nenhum dispensa a passagem. Rejeitado: s\u00f3 a regra global (ningu\u00e9m trava); s\u00f3 o gate no Hospital (os outros reposit\u00f3rios ficam sem r\u00e9gua).\n\n2. **Voz do canal manda no tom.** Onde h\u00e1 amostra aprovada (a regra 6 do CLAUDE.md global para WhatsApp, uma P\u00e1gina de tarefa publicada, o exemplo do template de PR), a skill casa o tom dela e s\u00f3 tira os cacoetes. O humanizer n\u00e3o escolhe registro: o canal escolhe.\n\n3. **O front do app passa uma vez e depois s\u00f3 a trava.** Uma issue \u00fanica varre o texto vis\u00edvel do frontend e dos templates de PDF do backend com o humanizer, uma vez. Da\u00ed em diante o ESLint trava o que entra. Rejeitado: s\u00f3 daqui para frente (o cliente continua lendo o que j\u00e1 est\u00e1 l\u00e1); varrer a cada PR (custo recorrente sem ganho).\n\n4. **O hover do Hospital OS mostra o que muda, n\u00e3o antes e depois.** A se\u00e7\u00e3o \"Valor entregue\" do template de PR deixa de ter `**Antes:**` e `**Depois:**` e vira um par\u00e1grafo \u00fanico, \"O que muda\", de 1 a 3 frases, como quem explica a um colega do hospital o que aquela issue entrega. O `/ship` escreve o par\u00e1grafo a partir da issue e passa pelo humanizer; o `collect.py` l\u00ea esse par\u00e1grafo e o `prs.js` o mostra sozinho no hover. Os PRs da janela do painel (os 200 mais recentes) s\u00e3o reescritos uma vez pela API, s\u00f3 nessa se\u00e7\u00e3o: `Closes #N`, a se\u00e7\u00e3o de migration conferida por hash e o resto do corpo ficam intactos. Rejeitado: fallback mostrando s\u00f3 o \"Depois\" dos antigos (hist\u00f3rico com duas caras); resumo gerado na hora por LLM no `collect.py` (o painel deixa de ser leitura de JSON e `gh`).\n\n5. **O Manual \u00e9 reescrito por m\u00f3dulo, dentro do molde.** Seis issues, uma por m\u00f3dulo, cada uma em worktree pr\u00f3prio como a `/montar-manual` j\u00e1 planeja, rodando o humanizer em modo arquivo p\u00e1gina a p\u00e1gina (Vis\u00e3o geral, P\u00e1ginas de tarefa, Como funciona e Novidades). O molde da ADR 0057 n\u00e3o muda: at\u00e9 6 passos, teto de 250 palavras, a palavra da tela em negrito, \"voc\u00ea\" e imperativo. A r\u00e9gua de linguagem da skill `/manual` cita o humanizer como passo obrigat\u00f3rio antes do lint. Rejeitado: uma issue para as 106 p\u00e1ginas (sess\u00e3o e PR grandes demais); s\u00f3 as P\u00e1ginas de tarefa (a Vis\u00e3o geral \u00e9 a primeira coisa que o leitor v\u00ea).\n\n6. **A busca \u00e9 a atual, afinada.** O Manual j\u00e1 tem busca em toda p\u00e1gina (Pagefind do Starlight, `Ctrl+K`); o que falta \u00e9 achar com a palavra que a pessoa fala. A barra de busca fica vis\u00edvel e larga no topo tamb\u00e9m no celular (hoje \u00e9 s\u00f3 a lupa); cada p\u00e1gina pode declarar `busca:` no frontmatter com as palavras do dia a dia (\"boleto\", \"guia\") e elas entram no \u00edndice; o resultado mostra o t\u00edtulo da tarefa com o m\u00f3dulo. A home abre com a barra de busca (\"O que voc\u00ea quer fazer?\") acima dos seis cart\u00f5es de m\u00f3dulo, e cada P\u00e1gina de tarefa pode terminar com at\u00e9 tr\u00eas **Tarefas pr\u00f3ximas** do mesmo m\u00f3dulo, escolhidas no frontmatter. A estrutura de pastas e o menu na ordem do app (ADR 0057, decis\u00e3o 1) n\u00e3o mudam. Rejeitado: busca pr\u00f3pria em JS (c
