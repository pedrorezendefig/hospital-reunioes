Rejeitado: s\u00f3 o sino; um aviso s\u00f3 no v\u00eddeo (card sem v\u00eddeo ficaria mudo).\n\n## Consequ\u00eancias\n\n- Aparece uma escrita nova no GitHub: fechar issue e partes como \"n\u00e3o planejada\", e regravar o corpo do PRD. O token do app continua s\u00f3 com Issues: write.\n- A Demanda deixa de nascer s\u00f3 do chat, e a tabela ganha a origem. Precisa de migration.\n- O formato fixo do bloco \"Para o diretor\" muda o `/to-prd` e o prompt do Planejamento da Demanda no mesmo PRD.\n- O PRD lista os dois cards velhos, #1426 e #1427, como primeiro uso da revis\u00e3o.\n\n## Emenda de 11/11/2026: filtros por categoria e card completo (issue #1578)\n\nCom os chips no ar, a lista continuou apertada. Eram dezesseis chips sem r\u00f3tulo, sete s\u00f3 de Etapa, numa coluna de 22rem, e o card mostrava pouco e s\u00f3 ganhava contorno no hover. O Pedro pediu filtros separados por categoria, em cima, e cards com mais informa\u00e7\u00e3o e mais ajuda para conversar. Grill no terminal, todas as recomenda\u00e7\u00f5es aceitas.\n\n1. **Barra de filtros em cima, na largura toda.** Fica acima da lista e do chat e recolhe junto com a lista quando a Demanda abre. Tipo, Etapa, Origem e Respons\u00e1vel s\u00e3o campos com r\u00f3tulo, no padr\u00e3o do Painel de Contas m\u00e9dicas. O recorte do Desenvolvedor (Para mim, Minhas, Todas) \u00e9 um controle segmentado, porque um dos tr\u00eas est\u00e1 sempre escolhido. \"S\u00f3 envio falhou\" \u00e9 um interruptor, porque Envio falhou n\u00e3o \u00e9 Etapa. \"Limpar filtros\" aparece s\u00f3 com filtro ativo e n\u00e3o mexe no recorte. Rejeitado: os chips agrupados com t\u00edtulo (continuavam ocupando v\u00e1rias linhas); um bot\u00e3o \"Filtros\" que abre painel (esconde o que est\u00e1 filtrado).\n2. **Card com contorno e com o que importa.** Borda sempre vis\u00edvel, data de abertura (\"Aberto em 01/11, h\u00e1 10 dias\", pelo calend\u00e1rio do hospital), quem pediu e o Respons\u00e1vel com as iniciais, a Etapa em destaque e, no PRD, as partes numa barra. No hover e no foco o card se destaca e sobe um pouco; quem pede menos anima\u00e7\u00e3o ao sistema n\u00e3o v\u00ea movimento.\n3. **Conversar sem procurar.** O card tem o bot\u00e3o \"Conversar\", que abre a Demanda com a caixa da Conversa da Demanda em foco. Na tela larga, a Demanda aberta mostra a Conversa da Demanda numa coluna \u00e0 direita, fixa na rolagem. Rejeitado: abrir a Demanda num modal, que esconde a lista e quebra o link direto do aviso do sino.\n\nA aba Entregas segue com os chips. A contagem de mensagens n\u00e3o lidas no card fica de fora, porque pede backend.\n\n## Emenda de 12/11/2026: o Desenvolvedor tira da lista o que n\u00e3o vale mais (issue #1637)\n\nNa limpeza da aba, dois tipos de pedido n\u00e3o sa\u00edam da lista. A conversa Registrada antiga do diretor s\u00f3 o autor apagava. O card fechado como n\u00e3o planejado pelo GitHub antes de algu\u00e9m apagar no app vai para N\u00e3o ser\u00e1 feita, e ali o Apagar recusava com 409. A decis\u00e3o 2 muda em dois pontos:\n\n1. **O Desenvolvedor tamb\u00e9m apaga a conversa Registrada de outra pessoa.** O autor continua apagando a pr\u00f3pria, e quem n\u00e3o \u00e9 Desenvolvedor segue sem apagar a conversa de outro.\n2. **O card em N\u00e3o ser\u00e1 feita tamb\u00e9m se apaga, s\u00f3 pelo Desenvolvedor.** A issue-raiz j\u00e1 fechada n\u00e3o fecha de novo nem ganha um segundo coment\u00e1rio, e as partes ainda abertas fecham como n\u00e3o planejadas. O estado da raiz vem da issue, e n\u00e3o da Etapa, porque a label `wontfix` leva a N\u00e3o ser\u00e1 feita com a issue aberta.\n\nEm desenvolvimento, Entregue e Em produ\u00e7\u00e3o continuam recusados.", "cita": [45, 79, 82], "decisao": "Decis\u00e3o do Pedro (11/11/2026, grill no terminal em duas rodadas, todas as recomenda\u00e7\u00f5es aceitas). A aba Tecnologia virou o chat do diretor com o agente (ADR 0077) e ganhou Respons\u00e1vel e a vis\u00e3o do Desenvolvedor (ADR 0083). No uso...", "emenda": [50, 54, 77, 83], "emendada_por": [90, 91, 92, 93], "file": "docs/adr/0084-tecnologia-entregas-documento-do-card-revisao-apagar-e-demonstracao.md", "number": 84, "slug": "0084-tecnologia-entregas-documento-do-card-revisao-apagar-e-demonstracao", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Tecnologia: Entregas, documento do card, revis\u00e3o com o c\u00f3digo de hoje, apagar e demonstra\u00e7\u00e3o"}, {"amended_by": null, "amends": "0058", "body_md": "> Emenda em prosa \u00e0 ADR 0034 (Consequ\u00eancias: \"pseudonimiza\u00e7\u00e3o antes de IA externa\") e \u00e0s regras de sa\u00edda do caso an\u00f4nimo e sigiloso das ADRs 0041 e 0052. Sem ponteiro `amends` para elas no frontmatter: o lint aceita um \u00fanico ponteiro por campo, e o ponteiro fica com a 0058, que \u00e9 a decis\u00e3o de onde o Conector mora.\n\n\nDecis\u00e3o do Pedro (11/11/2026), na triagem da issue #1571, a partir das decis\u00f5es do diretor na Demanda da aba Tecnologia. O diretor deixou com a Vitta a escolha t\u00e9cnica e respondeu as de neg\u00f3cio; aqui ficam as duas coisas, e o \u00fanico ponto em que a Vitta recomenda diferente do que ele pediu (decis\u00e3o 5).\n\n## Contexto\n\n- O Conector do Claude j\u00e1 existe desde a ADR 0058: transporte em `/api/mcp`, OAuth pelo WorkOS AuthKit, tr\u00eas ferramentas da Central de Comando (Ao vivo, Site e Instagram), todas globais. O `autorizar` exige participante ativo e Super admin, e o transporte descarta o participante que ele devolve.\n- O diretor quer perguntar ao pr\u00f3prio Claude, no celular e no computador, sobre pend\u00eancias, prazos, atas e casos da Ouvidoria, sem que o Claude leia a tela do navegador. Ele decidiu que o Claude s\u00f3 consulta, que o acesso \u00e9 s\u00f3 de quem tem `diretoria_executiva` no Perfil da Ouvidoria (hoje, ele), que outros Super admins ficam de fora, que POPs e Contas m\u00e9dicas ficam fora, e que \"metas\" s\u00e3o as pr\u00f3prias pend\u00eancias.\n- Na Ouvidoria ele pediu tudo: relato, trilha, respostas, casos sigilosos, nome e contato de quem manifestou e do paciente, e que a consulta pelo Claude n\u00e3o fique registrada no caso.\n- A `diretoria_executiva` j\u00e1 abre tudo isso na tela (ADR 0034, decis\u00e3o 8; Perfil da Ouvidoria no `CONTEXT.md`). O que muda \u00e9 o dado sair do app para a conta pessoal dele no Claude, que \u00e9 um servi\u00e7o fora do hospital.\n\n## Decis\u00f5es\n\n1. **Princ\u00edpio: o Conector entrega o que a tela de quem conectou entrega.** Nem mais, nem menos. Toda regra abaixo sai daqui: o Claude \u00e9 outro jeito de a mesma pessoa, com o mesmo acesso, ler o mesmo dado. Quem n\u00e3o abre o Dossi\u00ea na tela n\u00e3o o recebe pelo Claude.\n\n2. **Um Conector s\u00f3, com gate por ferramenta.** As ferramentas de Reuni\u00f5es e Ouvidoria entram no mesmo Conector da Central. O `autorizar` passa a aceitar participante ativo que seja Super admin ou tenha `diretoria_executiva`, e cada ferramenta tem o pr\u00f3prio gate: as da Central seguem para Super admin; as de Reuni\u00f5es e as da Ouvidoria s\u00e3o s\u00f3 de quem tem `diretoria_executiva`, Super admin ou n\u00e3o (decis\u00e3o 11 do diretor). O `tools/list` mostra s\u00f3 o que a pessoa pode chamar. Quem n\u00e3o tem acesso a nenhuma ferramenta recebe 401, como hoje; quem chama uma ferramenta fora do pr\u00f3prio gate recebe erro de ferramenta, sem dado. O transporte guarda o participante que o `autorizar` devolve e o passa \u00e0s ferramentas; quem \u00e9 nunca vem do corpo do pedido.\n   - Por qu\u00ea: o diretor j\u00e1 tem o Conector ligado no Claude. Um segundo Conector seria outra liga\u00e7\u00e3o para ele fazer no celular e no computador, outro Resource Indicator no WorkOS e outra p\u00e1gina de guia, para o mesmo login e o mesmo OAuth.\n   - Perder `diretoria_executiva`, ou ser desligado, corta as ferramentas na chamada seguinte, porque o gate \u00e9 lido no banco a cada chamada (como na decis\u00e3o 4 da ADR 0058).\n\n3. **S\u00f3 leitura, com a regra da tela.** Quatro ferramentas, nenhuma escreve:\n   - **Pend\u00eancias:** filtro por situa\u00e7\u00e3o (atrasada inclusive), respons\u00e1vel e prazo. Atrasada \u00e9 a mesma regra que a tela de Pend\u00eancias usa.\n   - **Reuni\u00f5es:** reuni\u00f5es por per\u00edodo ou termo, com a Ata, os participantes e as pend\u00eancias que sa\u00edram dela.\n   - **Casos da Ouvidoria:** a fila com protocolo, setor, situa\u00e7\u00e3o, gravidade e prazo, com filtro de prazo estourado e de setor. Prazo estourado \u00e9 o mesmo c\u00e1lculo que a fila da Ouvidoria mostra (Tabela de prazos e Calend\u00e1rio \u00fatil).\n   - **Caso da Ouvidoria:** o Dossi\u00ea de um protocolo, com a trilha.\n   As ferramentas chamam o mesmo c\u00f3digo que as rotas das telas usam; um segundo c\u00e1lculo de atraso ou de prazo faria o Claude discordar da tela, e bater com a tela \u00e9 o teste de aceite do diretor. Lista longa volta cortada num teto, com o total e o aviso de que h\u00e1 mais, para o Claude refinar o filtro.\n\n4. **Na Ouvidoria, o Claude recebe o Dossi\u00ea como a `diretoria_executiva` o v\u00ea.** Relato integral, trilha, respostas das \u00e1reas, casos com sigilo refor\u00e7ado e a identifica\u00e7\u00e3o que o caso gravou (quem manifestou e o Paciente do caso). No caso an\u00f4nimo vai o que o Dossi\u00ea mostra: o app n\u00e3o inventa identifica\u00e7\u00e3o que o caso n\u00e3o tem. Caso apagado ou retido chega com o aviso no lugar do relato, como na tela.\n   - Isto \u00e9 exce\u00e7\u00e3o consciente \u00e0 regra da ADR 0034 de pseudonimizar antes de IA externa e \u00e0s regras de sa\u00edda das ADRs 0041 e 0052. Aquelas regras valem para o que o **app** manda a terceiros (a IA do relat\u00f3rio, o e-mail e a tela da \u00e1rea). Aqui quem l\u00ea \u00e9 a pessoa autorizada, pela ferramenta dela, e pseudonimizar esconderia dela o que a tela j\u00e1 mostra.\n   - Pseudonimizar foi rejeitado tamb\u00e9m por outro motivo: a remo\u00e7\u00e3o autom\u00e1tica de nome em texto livre erra, e a Ouvidoria n\u00e3o teria como saber que errou (ADR 0041, ratifica\u00e7\u00e3o de 03/09/2026). Entregar o Dossi\u00ea inteiro a quem j\u00e1 o v\u00ea \u00e9 mais honesto do que entregar um Dossi\u00ea que parece limpo.\n\n5. **A consulta pelo Claude fica registrada, ao contr\u00e1rio do que o diretor pediu.** Abrir o Dossi\u00ea pela ferramenta do caso grava uma linha em `ouvidoria_acessos` com a a\u00e7\u00e3o `consulta_conector`, como abrir o Dossi\u00ea na tela grava `abrir_dossie`. As listas n\u00e3o gravam, como a fila na tela n\u00e3o grava.\n   - Por qu\u00ea: o diretor disse que n\u00e3o precisa registrar, n\u00e3o que n\u00e3o pode. O registro n\u00e3o aparece para ele, n\u00e3o pede nada a ele e n\u00e3o deixa a resposta mais lenta (falha no registro n\u00e3o derruba a leitura). E \u00e9 a \u00fanica prova do que saiu do hospital para uma conta pessoal se essa conta um dia vazar. A regra \"todo acesso \u00e0 Manifesta\u00e7\u00e3o gera registro\" fica inteira.\n   - O diretor fica sabendo pela Conversa da Demanda. Se ele insistir em n\u00e3o registrar, isso vira emenda a esta ADR.\n\n6. **O guia do Conector ganha a parte da diretoria executiva.** O guia em `docs/comunicacao/central/guia-conector/` passa a dizer quais ferramentas cada perfil v\u00ea e, para a diretoria executiva, a pedir que ela confira nas configura\u00e7\u00f5es de privacidade da conta do Claude se as conversas podem ser usadas para melhorar os modelos, e desligue essa op\u00e7\u00e3o.\n\n7. **O limite de 60 chamadas por minuto continua.** Uma conversa junta poucas chamadas (uma por ferramenta usada); o teto sobra. Se aparecer 429 no log do Conector, revisita.\n\n## Alternativas rejeitadas\n\n- **Conector separado para Reuni\u00f5es e Ouvidoria.** Isolaria o gate, mas o diretor faria duas liga\u00e7\u00f5es no Claude para o mesmo login, e o WorkOS ganharia outro Resource Indicator. O gate por ferramenta d\u00e1 o mesmo isolamento.\n- **Super admin para Reuni\u00f5es.** Era a primeira resposta do diretor; ele mesmo a trocou na decis\u00e3o 11.\n- **N\u00e3o registrar a consulta.** Ver decis\u00e3o 5.\n- **Mandar ao Claude s\u00f3 o \u00edndice da Ouvidoria.** N\u00e3o responderia o que o diretor quer perguntar (o relato e a resposta da \u00e1rea), e ele j\u00e1 v\u00ea tudo isso na tela.\n\n## Consequ\u00eancias\n\n- Dado pessoal e por vezes sens\u00edvel de manifestante e de paciente sai do hospital para a conta pessoal do diretor no Claude, e fica sob as regras de reten\u00e7\u00e3o dessa conta. O registro da decis\u00e3o 5 e a configura\u00e7\u00e3o de privacidade da decis\u00e3o 6 s\u00e3o o que limita o dano.\n- O acesso ao Conector deixa de ser \"s\u00f3 Super admin\": a Central continua assim, Reuni\u00f5es e Ouvidoria seguem a `diretoria_executiva`. Quem concede esse perfil na tela de Usu\u00e1rios concede tamb\u00e9m essa sa\u00edda pelo Claude.\n- Ferramenta nova de Reuni\u00f5es ou Ouvidoria no Conector segue o princ\u00edpio da decis\u00e3o 1. Abrir o Conector para outro perfil (ouvidor, facilitador) \u00e9 outra decis\u00e3o.\n- POPs e Contas m\u00e9dicas continuam fora do Conector.", "cita": [34, 41, 52], "decisao": "Decis\u00e3o do Pedro (11/11/2026), na triagem da issue #1571, a partir das decis\u00f5es do diretor na Demanda da aba Tecnologia. O diretor deixou com a Vitta a escolha t\u00e9cnica e respondeu as de neg\u00f3cio; aqui ficam as duas coisas, e o \u00fanico ponto...", "emenda": [58], "emendada_por": [], "file": "docs/adr/0085-conector-le-reunioes-e-ouvidoria-para-a-diretoria-executiva.md", "number": 85, "slug": "0085-conector-le-reunioes-e-ouvidoria-para-a-diretoria-executiva", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O Conector l\u00ea Reuni\u00f5es e Ouvidoria para a diretoria executiva, com o mesmo acesso que a tela dela tem"}, {"amended_by": null, "amends": "0036", "body_md": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, 27 decis\u00f5es de neg\u00f3cio) e do Pedro no grill t\u00e9cnico de 11/11/2026, sobre a especifica\u00e7\u00e3o \"Escuta por QR, Avalia\u00e7\u00f5es, NSP e Painel\" da Diretoria Executiva (10/11/2026). Hoje o cartaz abre direto o formul\u00e1rio p\u00fablico, e toda leitura vira protocolo com prazo. Em setores com muita insatisfa\u00e7\u00e3o, como a emerg\u00eancia e o centro m\u00e9dico, isso produziria mais casos do que a Ouvidoria consegue tratar, e transformaria em fila o que na maior parte \u00e9 uma avalia\u00e7\u00e3o r\u00e1pida.\n\n## Decis\u00f5es\n\n1. **O QR abre a Avalia\u00e7\u00e3o, que n\u00e3o gera protocolo.** A pessoa d\u00e1 uma nota de 1 a 5, escolhe se quiser os motivos (lista fechada de oito: aten\u00e7\u00e3o da equipe, tempo de espera, informa\u00e7\u00e3o recebida, limpeza, conforto, atendimento m\u00e9dico, atendimento de enfermagem, recep\u00e7\u00e3o) e deixa um coment\u00e1rio opcional de at\u00e9 500 caracteres. A avalia\u00e7\u00e3o \u00e9 gravada no envio, antes de qualquer escolha seguinte, e vira dado de gest\u00e3o, n\u00e3o caso.\n\n2. **A avalia\u00e7\u00e3o n\u00e3o guarda nada de quem avaliou.** Sem IP, sem identificador do aparelho, sem contato. O abuso \u00e9 contido por limite de envios (3 a cada 10 minutos por endere\u00e7o e cartaz; decis\u00e3o t\u00e9cnica do Pedro no grill, a diretoria pode rever na Conversa da Demanda), contado s\u00f3 na mem\u00f3ria do limitador e nunca gravado.\n\n3. **O funil depois da nota.** Notas 1, 2 e 3 perguntam se a pessoa quer retorno; o \"sim\" leva \u00e0 manifesta\u00e7\u00e3o guiada. Notas 4 e 5 agradecem e oferecem deixar um elogio (e o convite ao Google, ADR 0089). Quem segue para a manifesta\u00e7\u00e3o a partir da nota fica com o caso ligado \u00e0 avalia\u00e7\u00e3o e ao cartaz, **exceto quando escolhe o anonimato**: a\u00ed o caso guarda o local que a pessoa confirmou e n\u00e3o guarda o c\u00f3digo do cartaz nem a liga\u00e7\u00e3o com a nota, como j\u00e1 \u00e9 hoje.\n\n4. **A avalia\u00e7\u00e3o convertida pelo ouvidor guarda o cartaz e a liga\u00e7\u00e3o.** Converter em manifesta\u00e7\u00e3o \u00e9 ato do ouvidor na aba Avalia\u00e7\u00f5es: o caso nasce com canal `qr`, o setor e o ponto do cartaz, o coment\u00e1rio como relato, tipo vazio (logo sigiloso at\u00e9 a classifica\u00e7\u00e3o) e T0 igual \u00e0 hora da avalia\u00e7\u00e3o, como no e-mail recebido (ADR 0051). A pessoa n\u00e3o pediu anonimato, e o local ajuda a apurar.\n\n5. **A URL impressa passa a ser curta: `/a/{c\u00f3digo}` (emenda a decis\u00e3o 2 da ADR 0036).** As URLs antigas (`/ouvidoria/qr?p=` e `/manifestacao?p=`) redirecionam para ela. O c\u00f3digo continua o mesmo e continua sendo a \u00fanica coisa que o cartaz carrega (decis\u00e3o 4 da ADR 0036 segue). Ponto inativo leva \u00e0 manifesta\u00e7\u00e3o guiada sem origem, nunca a uma p\u00e1gina de erro (decis\u00e3o 6 segue). Quem chega pelo site vai direto \u00e0 manifesta\u00e7\u00e3o guiada, sem tela de nota, porque a nota \u00e9 sempre de um cartaz.\n\n6. **A manifesta\u00e7\u00e3o guiada tem cinco passos**: identifica\u00e7\u00e3o (com identifica\u00e7\u00e3o ou an\u00f4nimo, escolhido primeiro), sobre o qu\u00ea, quando e onde, o que aconteceu e contato. Os dados novos do caso s\u00e3o a data e o per\u00edodo da ocorr\u00eancia, a hora aproximada, o local informado (o setor que o manifestante escolheu, que n\u00e3o \u00e9 a \u00e1rea respons\u00e1vel), o quarto (s\u00f3 em ala de interna\u00e7\u00e3o), os profissionais citados, a data de nascimento do paciente e o que a pessoa espera (resposta, provid\u00eancia ou s\u00f3 registrar). Quem se identifica deixa telefone ou e-mail, ao menos um, e quem deixa s\u00f3 telefone v\u00ea o aviso de que as respostas saem por e-mail.\n\n7. **O an\u00f4nimo ganha c\u00f3digo de acompanhamento e a p\u00e1gina p\u00fablica de acompanhamento.** O c\u00f3digo \u00e9 mostrado uma vez e s\u00f3 o hash \u00e9 guardado. A p\u00e1gina recebe protocolo e c\u00f3digo (an\u00f4nimo) ou protocolo e contato (identificado), e mostra s\u00f3 o estado em linguagem simples, a data da \u00faltima movimenta\u00e7\u00e3o e a resposta institucional. Nunca setor interno, respons\u00e1vel ou anota\u00e7\u00e3o.\n\n8. **S\u00f3 o Perfil da Ouvidoria v\u00ea a aba Avalia\u00e7\u00f5es**, porque o coment\u00e1rio n\u00e3o \u00e9 classificado e pode trazer coisa s\u00e9ria. O Super admin fica de fora, como no Dossi\u00ea.\n\n9. **Reten\u00e7\u00e3o.** O coment\u00e1rio da avalia\u00e7\u00e3o \u00e9 apagado cinco anos depois de criado; a nota e os motivos ficam para os n\u00fameros. Os dados novos do caso (paciente atendido, data de nascimento, profissionais, quarto) saem junto com o relato, pelos cinco anos ou pela porta antecipada da diretoria executiva (ADR 0047).\n\n10. **O Ponto de escuta ganha os campos do cartaz**: nome p\u00fablico (o que o paciente v\u00ea, nunca o nome interno do setor), descri\u00e7\u00e3o do local, t\u00edtulo do cartaz (dois modelos), c\u00f3digo de controle impresso fora da moldura, marca de ala de interna\u00e7\u00e3o e a chave do teste do Google. O cartaz passa a A4 em PDF vetorial, no layout aprovado pela Diretoria.\n\n## Alternativas consideradas\n\n- **Manter o QR abrindo o formul\u00e1rio**: rejeitada. Todo descontentamento r\u00e1pido viraria protocolo com prazo.\n- **Guardar o IP para conter abuso**: rejeitada. A avalia\u00e7\u00e3o promete n\u00e3o identificar ningu\u00e9m; o limite em mem\u00f3ria basta para uma pessoa n\u00e3o mexer na m\u00e9dia.\n- **Um campo `origem` novo no caso**: rejeitado. O canal de origem que j\u00e1 existe, mais a liga\u00e7\u00e3o com a avalia\u00e7\u00e3o, j\u00e1 distinguem o caso que veio pela nota do que veio direto.\n\n## Consequ\u00eancias\n\n- A Ouvidoria passa a ter dois volumes: avalia\u00e7\u00f5es (sem fila, sem prazo) e manifesta\u00e7\u00f5es (com fila). Os n\u00fameros da avalia\u00e7\u00e3o vivem na aba Avalia\u00e7\u00f5es.\n- Os cartazes s\u00f3 v\u00e3o para a parede com a fase 1 inteira em produ\u00e7\u00e3o (decis\u00e3o 15 do diretor).", "cita": [47, 51, 89], "decisao": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, 27 decis\u00f5es de neg\u00f3cio) e do Pedro no grill t\u00e9cnico de 11/11/2026, sobre a especifica\u00e7\u00e3o \"Escuta por QR, Avalia\u00e7\u00f5es, NSP e Painel\" da Diretoria Executiva (10/11/2026). Hoje o cartaz...", "emenda": [36], "emendada_por": [], "file": "docs/adr/0086-qr-da-ouvidoria-vira-avaliacao-com-funil.md", "number": 86, "slug": "0086-qr-da-ouvidoria-vira-avaliacao-com-funil", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O QR da Ouvidoria vira Avalia\u00e7\u00e3o com funil para a manifesta\u00e7\u00e3o guiada"}, {"amended_by": null, "amends": "0082, 0039", "body_md": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, decis\u00f5es 5 e 18) e do Pedro no grill t\u00e9cnico de 11/11/2026. A especifica\u00e7\u00e3o da Diretoria pede que um agente escreva o assunto de cada caso, aponte os casos para o N\u00facleo de Seguran\u00e7a do Paciente e marque as avalia\u00e7\u00f5es graves. Duas ADRs aceitas impediam: a 0082 (nenhuma IA com custo roda sem a\u00e7\u00e3o humana) e a 0039, decis\u00e3o 4 (a IA da Ouvidoria recebe o agregado, nunca o relato).\n\n## Decis\u00f5es\n\n1. **Exce\u00e7\u00e3o \u00e0 decis\u00e3o 1 da ADR 0082.** O agente roda sozinho na chegada de toda manifesta\u00e7\u00e3o, de qualquer canal, e de toda avalia\u00e7\u00e3o com coment\u00e1rio. Quem dispara \u00e9 o envio, n\u00e3o um rel\u00f3gio: n\u00e3o h\u00e1 job, n\u00e3o h\u00e1 retentativa. \u00c9 uma chamada em segundo plano, uma vez por caso.\n\n2. **S\u00f3 sugere.** O agente escreve o **assunto** (uma linha, sem nome de pessoa nem dado cl\u00ednico identific\u00e1vel), o **apontamento ao N\u00facleo** (com uma justificativa simples, para o ouvidor, e uma t\u00e9cnica, para o N\u00facleo) e a marca **Para revisar** na avalia\u00e7\u00e3o cujo coment\u00e1rio sugere gravidade. Nunca grava tipo, gravidade, sigilo nem \u00e1rea (ADR 0037), e nada do que ele escreve sai para o paciente ou para um setor sem confirma\u00e7\u00e3o de uma pessoa.\n\n3. **Se o agente falhar, nada trava.** O caso entra na fila sem assunto e sem alerta, e o ouvidor l\u00ea e decide sozinho sobre o N\u00facleo. As listas mostram que o assunto n\u00e3o foi gerado.\n\n4. **O agente l\u00ea todos os relatos, inclusive os sigilosos (emenda a decis\u00e3o 4 da ADR 0039).** Uma den\u00fancia tamb\u00e9m pode descrever risco ao paciente. Antes de sair do app, o relato passa pelo `pseudonimizar` de `app/services/ouvidoria_pseudonimizacao.py`, como manda a ADR 0034 (pseudonimiza\u00e7\u00e3o antes de IA externa): nome, CPF, telefone, e-mail e os outros identificadores viram marcador, e o relato cru nunca vai para a Anthropic. O assunto e o alerta do N\u00facleo n\u00e3o dependem de nome. O texto pseudonimizado vai para a API da Anthropic com a reten\u00e7\u00e3o padr\u00e3o (at\u00e9 30 dias) e sem uso para treino, como na ADR 0074, que tamb\u00e9m desidentifica antes de enviar. O relat\u00f3rio mensal continua recebendo s\u00f3 o agregado.\n\n5. **Modelo, custo e teto.** O agente usa `claude-sonnet-5-5`, com custo estimado em cerca de US$ 0,01 por caso. O teto \u00e9 de 300 chamadas por dia no app inteiro (no m\u00e1ximo cerca de US$ 3 por dia, contra quem enche o formul\u00e1rio). Passado o teto, o agente pula o caso, com log e registro na trilha, e o caso segue o caminho da decis\u00e3o 3.\n\n6. **A salvaguarda da resposta n\u00e3o precisa de exce\u00e7\u00e3o.** No caso com o selo \"Em an\u00e1lise pelo NSP\", o agente l\u00ea a resposta ao manifestante antes do envio e aponta frases que admitem ou negam falha. Quem dispara \u00e9 o clique do ouvidor, o que j\u00e1 cabe na ADR 0082.\n\n7. **A sa\u00edda passa pelo sanitizador** (ADR 0013), como todo texto gerado.\n\n## Alternativas consideradas\n\n- **Bot\u00e3o \"Triar\" com estimativa, como manda a ADR 0082**: rejeitada. O assunto e o alerta do N\u00facleo s\u00f3 servem se estiverem l\u00e1 quando o ouvidor abre a fila.\n- **N\u00e3o mandar o relato sigiloso**: rejeitada pelo diretor. A den\u00fancia de maus-tratos \u00e9 justamente a que mais precisa do alerta.\n\n## Consequ\u00eancias\n\n- O custo da Ouvidoria passa a variar com o volume do canal p\u00fablico, limitado pelo teto di\u00e1rio.\n- Job novo que chame IA continua precisando de ADR que emende a 0082. Esta exce\u00e7\u00e3o vale s\u00f3 para a chegada de caso e de avalia\u00e7\u00e3o.", "cita": [13, 34, 37, 74], "decisao": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, decis\u00f5es 5 e 18) e do Pedro no grill t\u00e9cnico de 11/11/2026. A especifica\u00e7\u00e3o da Diretoria pede que um agente escreva o assunto de cada caso, aponte os casos para o N\u00facleo de...", "emenda": [82, 39], "emendada_por": [], "file": "docs/adr/0087-agente-de-triagem-da-ouvidoria.md", "number": 87, "slug": "0087-agente-de-triagem-da-ouvidoria", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O agente de triagem da Ouvidoria l\u00ea toda manifesta\u00e7\u00e3o e toda avalia\u00e7\u00e3o na chegada"}, {"amended_by": null, "amends": "0034, 0041, 0052", "body_md": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, decis\u00f5es 1, 9, 10, 22, 24 e 25) e do Pedro no grill t\u00e9cnico de 11/11/2026. A especifica\u00e7\u00e3o da Diretoria cria um segundo jeito de mandar um caso a um setor: o setor que s\u00f3 precisa confirmar que recebeu. Ele serve ao elogio e ao N\u00facleo de Seguran\u00e7a do Paciente (NSP), que precisa ver todo incidente relacionado \u00e0 assist\u00eancia (RDC 36/2013), inclusive o que chegou como den\u00fancia.\n\n## Decis\u00f5es\n\n1. **Nasce o acionamento como registro pr\u00f3prio, com dois tipos.** O de **resposta** \u00e9 o de hoje: a \u00e1rea responde no prazo. O de **ci\u00eancia** s\u00f3 pede o clique de recebido. O tipo \u00e9 decidido pelo sistema, nunca pelo ouvidor: elogio e N\u00facleo s\u00e3o ci\u00eancia, o resto \u00e9 resposta. Na fase 1 o registro guarda s\u00f3 as ci\u00eancias; o acionamento de resposta continua no caso e passa para o mesmo registro na fase 2, quando um caso puder ir a at\u00e9 tr\u00eas setores.\n\n2. **Elogio \u00e9 ci\u00eancia.** O ouvidor classifica, confirma o setor e escreve uma nota curta, como em todo acionamento. O respons\u00e1vel recebe o e-mail com o bot\u00e3o \"Elogio recebido\", sem login. O elogio n\u00e3o tem prazo de \u00e1rea e n\u00e3o entra nos vencidos. Sem clique em 5 dias \u00fateis, o e-mail \u00e9 reenviado uma \u00fanica vez, sem degraus. O clique devolve o caso ao ouvidor como **Pronto para encerrar**, e no encerramento o manifestante identificado recebe \"Seu elogio foi entregue \u00e0 equipe\".\n\n3. **O N\u00facleo \u00e9 um setor como os outros.** Fica na taxonomia de Setores, com titular (a presid\u00eancia do NSP), substituto e gestor no cadastro de Respons\u00e1veis do setor (ADR 0055). Qual setor \u00e9 o N\u00facleo fica na configura\u00e7\u00e3o da Ouvidoria.\n\n4. **A decis\u00e3o sobre o N\u00facleo \u00e9 do ouvidor.** Quando o agente aponta o caso (ADR 0087), \"Validar e acionar\" n\u00e3o conclui sem o ouvidor **confirmar** ou **descartar**, e o descarte pede motivo de uma linha. Sem alerta, o ouvidor pode mandar ao N\u00facleo por conta pr\u00f3pria, a qualquer momento. Confirmado, o caso ganha o selo **Em an\u00e1lise pelo NSP**.\n\n5. **O N\u00facleo recebe o relato integral, mesmo no caso sigiloso (emenda a decis\u00e3o 8 da ADR 0034, a decis\u00e3o 3 da ADR 0041 e a decis\u00e3o 4 da ADR 0052, s\u00f3 para o N\u00facleo).** A decis\u00e3o 8 da ADR 0034 deixa o sigilo refor\u00e7ado s\u00f3 com o ouvidor e a diretoria executiva e manda ao setor s\u00f3 o extrato; a exce\u00e7\u00e3o vale apenas para o N\u00facleo, e para nenhum outro setor. A tela que o link abre mostra o relato integral, a justificativa t\u00e9cnica do agente, o paciente atendido com a data de nascimento, os profissionais citados e o quarto. O nome de quem manifestou s\u00f3 vai quando o caso n\u00e3o \u00e9 sigiloso nem an\u00f4nimo. Os demais setores seguem a regra de sempre: no sigilo refor\u00e7ado, s\u00f3 a nota do ouvidor.\n\n6. **O e-mail ao N\u00facleo s\u00f3 avisa e traz o link.** O relato e a justificativa ficam s\u00f3 na tela, porque o e-mail passa por um processador fora do Brasil (ADR 0039, decis\u00e3o 2, que segue valendo).\n\n7. **O link do N\u00facleo abre sem senha, como o de qualquer \u00e1rea.** \u00c9 risco aceito pela diretoria: a presid\u00eancia do NSP cuida para n\u00e3o encaminhar.\n\n8. **Prazo e cobran\u00e7a.** Caso cr\u00edtico: o N\u00facleo \u00e9 avisado na hora. Os demais: 1 dia \u00fatil. Sem o clique em \"Recebido pelo NSP\", a cobran\u00e7a sobe em degraus como em qualquer \u00e1rea, at\u00e9 a diretoria executiva. A ci\u00eancia do N\u00facleo corre em paralelo e n\u00e3o bloqueia a resposta nem o encerramento do caso: a investiga\u00e7\u00e3o do NSP segue por fora at\u00e9 o m\u00f3dulo dele existir.\n\n## Alternativas consideradas\n\n- **O N\u00facleo receber s\u00f3 a nota do ouvidor no caso sigiloso**: rejeitada pelo diretor. O N\u00facleo investiga o incidente e precisa do relato como o paciente contou.\n- **Link do N\u00facleo com senha**: rejeitada pelo diretor, para n\u00e3o ter regra diferente das outras \u00e1reas.\n- **J\u00e1 mover o acionamento de resposta para o registro novo na fase 1**: adiada. Na fase 1 h\u00e1 um s\u00f3 setor de resposta por caso, e mudar o caminho que j\u00e1 funciona n\u00e3o paga o risco antes da fase 2.\n\n## Consequ\u00eancias\n\n- O caso sigiloso passa a ter um leitor fora da Ouvidoria e da diretoria executiva: a presid\u00eancia do NSP, por exce\u00e7\u00e3o \u00e0 decis\u00e3o 8 da ADR 0034 que vale s\u00f3 para o N\u00facleo. Isso entra no aviso de privacidade do hospital.\n- A fase 2 traz a migra\u00e7\u00e3o dos acionamentos de resposta que j\u00e1 existem para o registro novo.", "cita": [39, 55, 87], "decisao": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, decis\u00f5es 1, 9, 10, 22, 24 e 25) e do Pedro no grill t\u00e9cnico de 11/11/2026. A especifica\u00e7\u00e3o da Diretoria cria um segundo jeito de mandar um caso a um setor: o setor que s\u00f3 precisa...", "emenda": [34, 41, 52], "emendada_por": [], "file": "docs/adr/0088-acionamento-de-ciencia-elogio-e-nucleo-de-seguranca-do-paciente.md", "number": 88, "slug": "0088-acionamento-de-ciencia-elogio-e-nucleo-de-seguranca-do-paciente", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Acionamento de ci\u00eancia: o elogio e o N\u00facleo de Seguran\u00e7a do Paciente, com exce\u00e7\u00e3o de sigilo para o N\u00facleo"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, decis\u00f5es 2, 3, 4, 17 e 21) e do Pedro no grill t\u00e9cnico de 11/11/2026. Hoje o ouvidor digita a nota do Google \u00e0 m\u00e3o no di\u00e1rio de Nota externa, e o Objetivo da Central de Comando \"melhorar a nota no Google\" aparece como em constru\u00e7\u00e3o. Em 09/11/2026 o Google mostrava 2,5 com 1.629 avalia\u00e7\u00f5es.\n\n## Decis\u00f5es\n\n1. **A nota do Google \u00e9 buscada uma vez por semana pela Places API (New).** O pedido de detalhes do lugar devolve a nota (`rating`) e o total de avalia\u00e7\u00f5es (`userRatingCount`). O Place ID e o link de avalia\u00e7\u00e3o ficam na configura\u00e7\u00e3o da Ouvidoria; a chave da API \u00e9 segredo de ambiente, criada na tela do Coolify. A busca \u00e9 um job sem IA e grava no di\u00e1rio de Nota externa com o total de avalia\u00e7\u00f5es e a marca de leitura autom\u00e1tica.\n\n2. **A digita\u00e7\u00e3o \u00e0 m\u00e3o da nota do Google sai.** O hist\u00f3rico digitado fica. O Reclame Aqui continua digitado \u00e0 m\u00e3o, e o relat\u00f3rio da Diretoria continua usando o \u00faltimo valor de cada fonte.\n\n3. **A Central de Comando mostra a nota.** O Objetivo \"melhorar a nota no Google\" deixa de estar em constru\u00e7\u00e3o (decis\u00e3o t\u00e9cnica do Pedro no grill; a diretoria pode rever na Conversa da Demanda). A tela mostra a nota, o n\u00famero de avalia\u00e7\u00f5es novas do m\u00eas e se a nota melhorou ou piorou frente ao m\u00eas anterior. Como a API n\u00e3o entrega a avalia\u00e7\u00e3o de cada m\u00eas, \"avalia\u00e7\u00f5es do m\u00eas\" \u00e9 a diferen\u00e7a do total entre a primeira e a \u00faltima leitura do m\u00eas, e a tela diz isso. A tend\u00eancia compara a nota geral no fim do m\u00eas com a do fim do m\u00eas anterior.\n\n4. **A Ouvidoria repete a nota, s\u00f3 para leitura.** O ouvidor n\u00e3o v\u00ea a Central, ent\u00e3o a tela de Nota externa mostra a nota do Google, sem edi\u00e7\u00e3o. **Pendente da diretoria:** repetir ali tamb\u00e9m os n\u00fameros do teste do convite, para quem n\u00e3o \u00e9 Super admin, \u00e9 sugest\u00e3o ainda sem resposta da diretoria, n\u00e3o decis\u00e3o. At\u00e9 ela responder na Conversa da Demanda, os n\u00fameros do teste ficam s\u00f3 na Central.\n\n5. **O convite ao Google aparece s\u00f3 para as notas 4 e 5.** A pol\u00edtica do Google para empresas pro\u00edbe pedir avalia\u00e7\u00e3o s\u00f3 a quem ficou satisfeito, e quem desobedece pode ter avalia\u00e7\u00f5es removidas ou o perfil punido. **A diretoria aceita esse risco.** O convite aparece s\u00f3 no QR, s\u00f3 quando a chave geral e a chave do ponto est\u00e3o ligadas, e as duas nascem desligadas.\n\n6. **Quem liga e desliga \u00e9 a diretoria executiva**, na tela de Pontos de escuta, e toda mudan\u00e7a grava quem, quando, o valor anterior e o novo. A Central de Comando s\u00f3 l\u00ea.\n\n7. **O teste dura 60 dias, mas n\u00e3o se desliga sozinho.** No fim do prazo, a Central mostra um aviso lembrando de reavaliar, e o convite continua aparecendo at\u00e9 algu\u00e9m desligar. A Central mostra, por ponto e por per\u00edodo, os convites exibidos, os cliques e a taxa de clique, ao lado da s\u00e9rie da nota. O clique \u00e9 registrado antes do redirecionamento ao Google.\n\n8. **Proibido no convite**: oferecer incentivo, pedir conte\u00fado espec\u00edfico, pedir men\u00e7\u00e3o a profissional e dar meta de avalia\u00e7\u00f5es \u00e0 equipe.\n\n## Alternativas consideradas\n\n- **Business Profile API**: rejeitada para a fase 1. Entrega cada avalia\u00e7\u00e3o com data e daria a m\u00e9dia exata do m\u00eas, mas exige OAuth do dono do perfil e aprova\u00e7\u00e3o de acesso pelo Google.\n- **Busca di\u00e1ria, como pedia a especifica\u00e7\u00e3o**: o diretor escolheu semanal.\n- **Convite a todas as notas, como recomenda o Google**: rejeitada pela diretoria.\n\n## Consequ\u00eancias\n\n- A tend\u00eancia do m\u00eas anda devagar: com mais de 1.600 avalia\u00e7\u00f5es, a nota geral muda pouco de um m\u00eas para outro.\n- Se o Google punir o perfil, o caminho \u00e9 desligar a chave geral; o hist\u00f3rico do teste fica para explicar o que aconteceu.", "cita": [], "decisao": "Decis\u00e3o do diretor no Planejamento da Demanda (PRD #1527, decis\u00f5es 2, 3, 4, 17 e 21) e do Pedro no grill t\u00e9cnico de 11/11/2026. Hoje o ouvidor digita a nota do Google \u00e0 m\u00e3o no di\u00e1rio de Nota externa, e o Objetivo da Central de Comando...", "emenda": [], "emendada_por": [], "file": "docs/adr/0089-nota-do-google-automatica-e-convite-so-para-notas-4-e-5.md", "number": 89, "slug": "0089-nota-do-google-automatica-e-convite-so-para-notas-4-e-5", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Nota do Google buscada toda semana e convite ao Google s\u00f3 para as notas 4 e 5"}, {"amended_by": "0091, 0092, 0093", "amends": "0077, 0083, 0084", "body_md": "Decis\u00e3o do Pedro (12/11/2026, grill no terminal em duas rodadas, todas as recomenda\u00e7\u00f5es aceitas). Depois da emenda de 11/11 da ADR 0084, a aba Conversas ficou com a barra de filtros em cima e, embaixo, a lista de cards numa coluna de 24rem com rolagem pr\u00f3pria, ao lado do chat do Assistente, que ocupa a direita o tempo todo. O Pedro achou a lista apertada e a rolagem cansativa, e pediu uma p\u00e1gina s\u00f3 dos cards, em colunas pelas Etapas, com os filtros em cima e o agente aparecendo s\u00f3 quando um card \u00e9 escolhido. A tela vale para o diretor e para o Desenvolvedor.\n\nA ADR 0077 aposentou o Quadro, e a 0083 rejeitou \"Painel ou Quadro com raias por pessoa\". O Quadro que saiu tinha colunas de Estado manual, cart\u00e3o arrastado \u00e0 m\u00e3o, Prioridade e Prazo: era o gestor de tarefas que a 0077 desmontou. Esta ADR traz a palavra de volta com outro sentido.\n\n## Decis\u00f5es\n\n1. **O Quadro volta, redefinido.** As colunas s\u00e3o as Etapas, lidas do GitHub. Ningu\u00e9m arrasta card nem muda Etapa no app (ADR 0054, decis\u00e3o 3). A aba Conversas passa a se chamar Quadro; Entregas continua como est\u00e1. Rejeitado: o mesmo desenho com outro nome na tela (o diretor j\u00e1 chama de quadro); s\u00f3 alargar a lista de hoje (o aperto continua).\n\n2. **Cinco colunas.** Registrada, Em an\u00e1lise, Planejada, Em desenvolvimento e Entregue. A coluna Entregue junta Entregue e Em produ\u00e7\u00e3o dos \u00faltimos 30 dias, com o selo da vers\u00e3o, e mostra os 8 mais recentes com \"Ver todos nas Entregas\", que abre a aba Entregas. N\u00e3o ser\u00e1 feita fica fora das colunas e aparece por um interruptor na barra. Rejeitado: as sete Etapas com rolagem lateral (a 1300px cada coluna fica com 185px); colunas estreitas que abrem no clique.\n\n3. **A p\u00e1gina rola inteira.** As colunas n\u00e3o t\u00eam rolagem pr\u00f3pria e o cabe\u00e7alho de cada uma, com o nome da Etapa e a contagem, fica fixo no topo. Dentro da coluna, o card mais novo vem primeiro, pela data de abertura, a ordem que a lista j\u00e1 usa. Rejeitado: rolagem por coluna (repete o aperto cinco vezes); ordem pela \u00faltima movimenta\u00e7\u00e3o (pede campo novo no backend).\n\n4. **Card compacto.** N\u00famero da Demanda, t\u00edtulo, selo Bug ou Melhoria, iniciais do Respons\u00e1vel, barra de partes no PRD e os selos \"Tem demonstra\u00e7\u00e3o\" e \"Envio falhou\". Data por extenso, quem pediu e o bot\u00e3o \"Conversar\" v\u00e3o para o painel. Rejeitado: o card completo da emenda de 11/11 dentro da coluna (alonga e traz a rolagem de volta).\n\n5. **O card abre num painel \u00e0 direita, por cima do Quadro.** O painel tem o Documento do card e a Conversa da Demanda, a URL acompanha o card aberto e o \"Ampliar\" leva \u00e0 largura toda. Painel lateral n\u00e3o \u00e9 o modal que a emenda de 11/11 da 0084 rejeitou: o Quadro continua vis\u00edvel e o link do sino abre o card direto. Rejeitado: o card sempre na largura toda.\n\n6. **O Assistente sai da tela inicial.** O bot\u00e3o \"Novo pedido\" e o clique num card Registrada abrem a conversa com o agente na largura toda, com o Documento do card montando ao vivo ao lado. Rejeitado: o chat no painel lateral (estreito para o documento ao vivo); um bot\u00e3o flutuante com o chat numa janela pequena.\n\n7. **O agente s\u00f3 mexe no card pelos caminhos que j\u00e1 existem.** Continuar a conversa antes do \"Criar o card\" e o \"Revisar com o c\u00f3digo de hoje\" (ADR 0084, decis\u00e3o 3), com o bot\u00e3o certo no painel conforme a Etapa. Rejeitado: chat livre com o agente em qualquer card e em qualquer Etapa (backend, prompt e custo de IA novos; se vier, \u00e9 outra Demanda).\n\n8. **Barra de filtros sem Etapa.** Ficam Busca, Tipo, Origem, Respons\u00e1vel, o recorte do Desenvolvedor (Para mim, Minhas, Todas), \"S\u00f3 envio falhou\" e o interruptor de N\u00e3o ser\u00e1 feita. A Etapa j\u00e1 \u00e9 a coluna. Rejeitado: o campo de Etapa escolhendo quais colunas aparecem.\n\n9. **No celular fica a lista de hoje**, com o filtro de Etapa. O Quadro \u00e9 da tela larga. Rejeitado: uma coluna por vez com abas de Etapa.\n\n## Consequ\u00eancias\n\n- O verbete Quadro sai da lista de aposentados do `CONTEXT.md` e volta com a defini\u00e7\u00e3o nova.\n- O trabalho \u00e9 s\u00f3 de tela: nenhuma rota, migration ou prompt muda.\n- As fatias nascem bloqueadas pelas issues #1585 (N\u00famero da Demanda no card) e #1586 (a URL acompanha o card aberto), que mexem nos mesmos componentes. A #1588 (Copiar link) segue como est\u00e1.\n- A aba Entregas segue com os chips, como a emenda de 11/11 da 0084 deixou.", "cita": [54], "decisao": "Decis\u00e3o do Pedro (12/11/2026, grill no terminal em duas rodadas, todas as recomenda\u00e7\u00f5es aceitas). Depois da emenda de 11/11 da ADR 0084, a aba Conversas ficou com a barra de filtros em cima e, embaixo, a lista de cards numa coluna de 24rem...", "emenda": [77, 83, 84], "emendada_por": [91, 92, 93], "file": "docs/adr/0090-quadro-da-tecnologia-por-etapa.md", "number": 90, "slug": "0090-quadro-da-tecnologia-por-etapa", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Quadro da Tecnologia por Etapa"}, {"amended_by": null, "amends": "0054, 0083, 0084, 0090", "body_md": "Decis\u00e3o do Pedro (13/11/2026, grill no terminal em duas rodadas, todas as recomenda\u00e7\u00f5es aceitas). A aba Entregas da ADR 0084 \u00e9 uma lista de texto (\"Semana de dd/mm: N\") com os cards embaixo, sem gr\u00e1fico. O Pedro pediu uma tela moderna, com motion discreto, para acompanhar a entrega: quanto o diretor pediu, quanto tempo cada card ficou em cada Etapa e os n\u00fameros de cada Desenvolvedor.\n\nA ADR 0083 rejeitou \"Painel ou Quadro com raias por pessoa\", e a 0084 escreveu que a Entregas \"n\u00e3o \u00e9 o quadro por pessoa\". As duas rejeitavam o gestor de tarefas que a 0077 desmontou: colunas por pessoa, card movido \u00e0 m\u00e3o. N\u00fameros por pessoa, s\u00f3 de leitura, n\u00e3o movem nada. Esta ADR libera o corte por pessoa e mant\u00e9m a rejei\u00e7\u00e3o das raias.\n\n## Decis\u00f5es\n\n1. **A Entregas ganha n\u00fameros em cima da lista.** Vaz\u00e3o, tempo do pedido at\u00e9 a produ\u00e7\u00e3o, Tempo na Etapa, cards em andamento por Etapa, cards parados e um gr\u00e1fico de pedidos que chegam contra entregas por semana. Embaixo, a lista de cards de hoje. O nome continua Entregas. Rejeitado: taxa de N\u00e3o ser\u00e1 feita e issue reaberta (ru\u00eddo com cerca de 20 Demandas); renomear para \"Indicadores\".\n\n2. **O corte por pessoa \u00e9 o Respons\u00e1vel da raiz.** O card inteiro conta para quem o diretor escolheu, numa tabela com uma linha por Respons\u00e1vel, e o filtro de Respons\u00e1vel vale para a tela toda. Rejeitado: quem pegou cada parte (dado novo, que depende de algu\u00e9m p\u00f4r assignee em cada fatia); uma p\u00e1gina por pessoa.\n\n3. **Todos que veem a aba veem a mesma tela**, diretor e Desenvolvedores. O diretor j\u00e1 v\u00ea o Respons\u00e1vel e as datas em cada card; os n\u00fameros s\u00f3 somam isso. Rejeitado: esconder o corte por pessoa do diretor; tela s\u00f3 do Pedro.\n\n4. **O Tempo na Etapa vem de passagens gravadas.** Uma tabela nova guarda cada mudan\u00e7a de Etapa com a data. O passado \u00e9 reconstru\u00eddo pela linha do tempo das issues no GitHub (labels, fechamento, PRs). Registrada conta da abertura da conversa at\u00e9 o \"Criar o card\". Rejeitado: s\u00f3 daqui para frente (o painel nasceria vazio); s\u00f3 os carimbos que j\u00e1 existem (n\u00e3o separam Em an\u00e1lise, Planejada e Em desenvolvimento).\n\n5. **O PRD n\u00e3o volta para Planejada.** Emenda a decis\u00e3o 3 da ADR 0054: depois que a primeira parte come\u00e7a, a Demanda fica Em desenvolvimento at\u00e9 a raiz fechar, mesmo entre uma onda e outra. A regra continua derivada (alguma parte entregue ou em andamento, com a raiz aberta), sem estado novo. Vale tamb\u00e9m para o Quadro da ADR 0090. Rejeitado: manter o vaiv\u00e9m, que mostra \"4 de 13 partes\" em Planejada e quebra o Tempo na Etapa em peda\u00e7os.\n\n6. **Pedidos do diretor.** Quantos pedidos por per\u00edodo, de que tipo, quantas partes cada melhoria gerou e o custo de IA do Planejamento da Demanda. Entram as Demandas das duas Origens, separ\u00e1veis pelo filtro. Rejeitado: o tempo entre a primeira e a \u00faltima pergunta (mede a agenda do diretor, n\u00e3o o esfor\u00e7o).\n\n7. **Como os n\u00fameros se contam.** Mediana, e cada n\u00famero abre os cards que entraram na conta. Dias corridos, e horas quando passou menos de um dia. Abre nos \u00faltimos 30 dias, com a varia\u00e7\u00e3o contra os 30 anteriores escrita em texto, sem seta, e um seletor de semana, m\u00eas, trimestre e tudo. Card parado \u00e9 o que passou do prazo da Etapa: Em an\u00e1lise 5 dias, Planejada 5, Em desenvolvimento 3; Registrada n\u00e3o conta, porque ali o ritmo \u00e9 do diretor. Parado aparece s\u00f3 numa lista das Entregas, nunca no card do Quadro. Rejeitado: m\u00e9dia (um PRD grande puxa sozinho); dias \u00fateis (a onda roda no fim de semana); prazo ajust\u00e1vel na tela; selo de parado no Quadro.\n\n8. **Visual com motion discreto.** `recharts`, que j\u00e1 est\u00e1 no app, com anima\u00e7\u00e3o em CSS: n\u00fameros que sobem contando, barras que crescem e cards que entram em sequ\u00eancia, tudo curto e parado para quem pede menos movimento. O padr\u00e3o visual \u00e9 o do Painel de Contas m\u00e9dicas. Um prot\u00f3tipo com os n\u00fameros reais vem antes do PRD. Rejeitado: instalar `framer-motion`.\n\n## Consequ\u00eancias\n\n- Uma migration nova (a tabela de passagens) e a carga do passado lida do GitHub.\n- A deriva\u00e7\u00e3o da Etapa muda num ponto (decis\u00e3o 5), e o Quadro passa a mostrar o PRD fixo em Em desenvolvimento.\n- O `CONTEXT.md` ganha Vaz\u00e3o, Tempo na Etapa e Card parado, e a Entregas \u00e9 redefinida.", "cita": [], "decisao": "Decis\u00e3o do Pedro (13/11/2026, grill no terminal em duas rodadas, todas as recomenda\u00e7\u00f5es aceitas). A aba Entregas da ADR 0084 \u00e9 uma lista de texto (\"Semana de dd/mm: N\") com os cards embaixo, sem gr\u00e1fico. O Pedro pediu uma tela moderna, com...", "emenda": [54, 83, 84, 90], "emendada_por": [], "file": "docs/adr/0091-entregas-com-numeros-por-responsavel-e-tempo-na-etapa.md", "number": 91, "slug": "0091-entregas-com-numeros-por-responsavel-e-tempo-na-etapa", "status": "superseded", "substitui": [], "substituida_por": [92], "superseded_by": "0092", "supersedes": null, "title": "Entregas com n\u00fameros por Respons\u00e1vel, Tempo na Etapa e o PRD que n\u00e3o volta para Planejada"}, {"amended_by": "0093", "amends": "0054, 0084, 0090", "body_md": "Decis\u00e3o do Pedro (13/11/2026, mesmo dia da ADR 0091, antes de qualquer fatia). Com o prot\u00f3tipo da 0091 na m\u00e3o, o Pedro achou a tela cheia demais e com controle demais: tempo do card at\u00e9 a produ\u00e7\u00e3o, Tempo na Etapa, Parados e n\u00fameros por pessoa d\u00e3o ao diretor um instrumento de cobran\u00e7a que n\u00e3o \u00e9 o objetivo da aba. O que ele quer \u00e9 sentir o ritmo, quantos pedidos chegam e quantas entregas saem por semana, e que qualquer pessoa entenda o que cada entrega fez. Esta ADR substitui a 0091 inteira e repete dela s\u00f3 a regra do PRD em Em desenvolvimento.\n\n## Decis\u00f5es\n\n1. **A aba Entregas mostra o ritmo, n\u00e3o controla quem entrega.** No topo, dois n\u00fameros: pedidos e entregas das \u00faltimas 4 semanas, com a varia\u00e7\u00e3o contra as 4 anteriores escrita em texto. Abaixo, o gr\u00e1fico das \u00faltimas 12 semanas, com pedidos e entregas lado a lado. Embaixo, as entregas agrupadas por semana, a mais nova em cima, com \"Ver semanas anteriores\" no fim. Rejeitado: tudo o que a 0091 trazia de tempo e cobran\u00e7a, ou seja, do card at\u00e9 a produ\u00e7\u00e3o, Tempo na Etapa, Parados com prazo, tabela por Respons\u00e1vel e custo de IA; manter o seletor de per\u00edodo (a semana \u00e9 a unidade da tela).\n\n2. **Sem tabela de passagens.** Sem o Tempo na Etapa, nada mais l\u00ea as passagens, ent\u00e3o saem a tabela, a migration e a reconstru\u00e7\u00e3o do passado pelo GitHub. Rejeitado: deixar a tabela gravando para um uso futuro que ningu\u00e9m pediu.\n\n3. **Tamanho da entrega: P, M ou G, pelas partes.** At\u00e9 1 parte \u00e9 P, de 2 a 5 \u00e9 M, 6 ou mais \u00e9 G. Calculado do GitHub, nunca estimado nem digitado, como a Etapa e o O que muda. No gr\u00e1fico, a barra de entregas da semana empilha G, M e P. Rejeitado: story points estimados no planejamento (ritual de estimativa que ningu\u00e9m faz hoje); tamanho escolhido \u00e0 m\u00e3o no card.\n\n4. **Expandir e recolher com o mouse.** Passar o mouse num n\u00famero mostra a composi\u00e7\u00e3o (bugs e melhorias; G, M e P). Passar o mouse numa barra mostra a pr\u00e9via da semana, com os t\u00edtulos e o tamanho de cada entrega; o clique filtra a lista para aquela semana e rola at\u00e9 ela. Passar o mouse numa entrega por 150 ms abre o O que muda e os links, uma por vez; o clique fixa. No celular, o toque faz o papel do mouse. Rejeitado: abrir s\u00f3 no clique.\n\n5. **Cada entrega diz o que fez.** Recolhida, a linha mostra o Tamanho da entrega, o t\u00edtulo, o tipo, a vers\u00e3o e o \u00edcone de v\u00eddeo quando h\u00e1 Demonstra\u00e7\u00e3o. Aberta, mostra o O que muda e tr\u00eas links: Demonstra\u00e7\u00e3o (o link que o card j\u00e1 guarda, a p\u00e1gina onde o v\u00eddeo toca), Abrir o card (o Documento do card) e Copiar link. Rejeitado: guardar tamb\u00e9m o link do v\u00eddeo \u00e0 parte.\n\n6. **O PRD n\u00e3o volta para Planejada** (repete a decis\u00e3o 5 da 0091, emenda a decis\u00e3o 3 da ADR 0054). Depois que a primeira parte come\u00e7a, a Demanda fica Em desenvolvimento at\u00e9 a raiz fechar, mesmo entre uma onda e outra. A regra continua derivada, sem estado novo, e vale para o Quadro (ADR 0090).\n\n7. **Mesma tela para todos e motion discreto.** Diretor e Desenvolvedores veem a mesma coisa. Os filtros de Tipo, Origem e Respons\u00e1vel que a aba j\u00e1 tem continuam. N\u00fameros que sobem contando, barras que crescem em sequ\u00eancia e linhas que abrem com um deslize curto, tudo parado para quem pede menos movimento, com o `recharts` e anima\u00e7\u00e3o em CSS.\n\n## Consequ\u00eancias\n\n- A 0091 passa a `superseded`. A 0083 volta a valer sem emenda: n\u00e3o h\u00e1 n\u00famero por pessoa.\n- O PRD da 0091 \u00e9 reescrito na mesma issue, sem migration.\n- O `CONTEXT.md` perde Vaz\u00e3o, Tempo na Etapa e Card parado, ganha Tamanho da entrega e redefine a Entregas.", "cita": [], "decisao": "Decis\u00e3o do Pedro (13/11/2026, mesmo dia da ADR 0091, antes de qualquer fatia). Com o prot\u00f3tipo da 0091 na m\u00e3o, o Pedro achou a tela cheia demais e com controle demais: tempo do card at\u00e9 a produ\u00e7\u00e3o, Tempo na Etapa, Parados e n\u00fameros por...", "emenda": [54, 84, 90], "emendada_por": [93], "file": "docs/adr/0092-entregas-como-ritmo-semanal-com-tamanho-da-entrega.md", "number": 92, "slug": "0092-entregas-como-ritmo-semanal-com-tamanho-da-entrega", "status": "accepted", "substitui": [91], "substituida_por": [], "superseded_by": null, "supersedes": "0091", "title": "Entregas como ritmo semanal, com Tamanho da entrega e o que cada entrega fez"}, {"amended_by": null, "amends": "0054, 0084, 0090, 0092", "body_md": "Decis\u00e3o do Pedro (13/11/2026, grill no terminal, rodadas 4 e 5, todas as recomenda\u00e7\u00f5es aceitas). A Ana, agente de atendimento do mesmo hospital, tem reposit\u00f3rio pr\u00f3prio e privado (`pedrorezendefig/programa-ana`), com o mesmo pacote do fluxo, as mesmas labels de triagem e PRDs com sub-issues. O Pedro quer que o diretor e os Desenvolvedores vejam, na aba Tecnologia, os cards da Ana ao lado dos do app, com um filtro por projeto. Os cards abertos da Ana entram agora; os j\u00e1 conclu\u00eddos n\u00e3o s\u00e3o carregados, e daqui para frente o que for conclu\u00eddo aparece.\n\nA aba inteira supunha um reposit\u00f3rio s\u00f3: uma vari\u00e1vel de repo, um token que s\u00f3 l\u00ea o Hospital, um webhook que descarta outro reposit\u00f3rio, a Demanda achada s\u00f3 pelo n\u00famero da issue (\u00edndice \u00fanico) e o espelho que exige labels que a Ana n\u00e3o usa.\n\n## Decis\u00f5es\n\n1. **Projeto \u00e9 a palavra.** Dois valores: Aplicativo do Hospital e Ana. Rejeitado: \"Produto\" (\u00e9 o m\u00f3dulo do kit de conhecimento, e o Produto com dono foi aposentado na 0077); \"Sistema\".\n\n2. **A Demanda ganha o Projeto, e a chave do V\u00ednculo passa a ser projeto mais n\u00famero da issue.** Emenda a decis\u00e3o 1 da ADR 0054. A issue #50 da Ana e a #50 do Hospital s\u00e3o Demandas diferentes. Quadro, Entregas, Documento do card e Conversa da Demanda servem aos dois. Migration nova. Rejeitado: uma tabela separada para a Ana (duplica tela e c\u00f3digo).\n\n3. **Uma sequ\u00eancia s\u00f3 para o N\u00famero da Demanda.** \"Demanda 42\" nunca \u00e9 amb\u00edgua, seja do Hospital ou da Ana. Rejeitado: sequ\u00eancia por projeto.\n\n4. **Da Ana, s\u00f3 as ra\u00edzes de produto viram card.** PRDs e issues soltas, sem as partes e sem as de ferramenta (`area:os`). Hoje s\u00e3o tr\u00eas cards, cada um com \"X de Y partes\". Toda Demanda da Ana \u00e9 da Origem Vitta. O espelho ganha a regra da Ana ao lado da do Hospital (ADR 0084). Rejeitado: toda issue virar card, inclusive partes; s\u00f3 os PRDs.\n\n5. **Os cards da Ana s\u00e3o s\u00f3 leitura neste passo.** T\u00eam Etapa, Documento do card e Conversa da Demanda, mas o Assistente de Tecnologia continua criando card s\u00f3 no Aplicativo do Hospital. Criar card da Ana pelo Assistente fica para outra Demanda, com grill pr\u00f3prio. Rejeitado: o Assistente perguntar \"Hospital ou Ana?\" agora (traz um segundo reposit\u00f3rio para o Assistente, o formato de card da Ana e as labels dela).\n\n6. **Na Ana, a \u00faltima Etapa \u00e9 Entregue.** A Ana n\u00e3o tem Subida com vers\u00e3o: o prompt \u00e9 aplicado \u00e0 m\u00e3o na plataforma. Sem \"Em produ\u00e7\u00e3o\" at\u00e9 ela ganhar deploy pelo reposit\u00f3rio, quando o carimbo vem sozinho. Rejeitado: marcar \"Em produ\u00e7\u00e3o\" \u00e0 m\u00e3o no app (Etapa nunca \u00e9 digitada, ADR 0054).\n\n7. **Um token e um webhook a mais.** O token da integra\u00e7\u00e3o passa a incluir o reposit\u00f3rio da Ana, com leitura de conte\u00fado e de PRs al\u00e9m de Issues (emenda a decis\u00e3o 8 da ADR 0054: deixa de ser \"s\u00f3 este reposit\u00f3rio\"). O reposit\u00f3rio da Ana ganha um webhook para o mesmo endere\u00e7o, com o mesmo segredo, e o app aceita os dois reposit\u00f3rios; a confer\u00eancia de hora em hora l\u00ea os dois. Cadastrar token e webhook \u00e9 tarefa humana. Rejeitado: um segundo token (mesmo servidor, nenhuma prote\u00e7\u00e3o a mais); s\u00f3 a confer\u00eancia de hora em hora para a Ana.\n\n8. **Filtro Projeto no Quadro e nas Entregas.** Campo \"Projeto\" na barra de filtros (Todos, Aplicativo do Hospital, Ana) e um selo pequeno do projeto em cada card. Emenda a decis\u00e3o 8 da ADR 0090 e a decis\u00e3o 7 da 0092. Rejeitado: uma aba por projeto.\n\n9. **O bloco para leigo da Ana se l\u00ea pelos dois t\u00edtulos.** O O que muda vem do bloco \"Para o diretor\" ou, na Ana, \"Para quem decide\". Parte sem bloco mostra \"Descri\u00e7\u00e3o em prepara\u00e7\u00e3o\". Rejeitado: renomear o bloco no reposit\u00f3rio da Ana.\n\n## Consequ\u00eancias\n\n- O reposit\u00f3rio da Ana \u00e9 privado: nada do conte\u00fado dele vai para o reposit\u00f3rio do Hospital, que \u00e9 p\u00fablico. A Conversa da Demanda de um card da Ana fica s\u00f3 no app.\n- A Ana segue sem deploy; o Tamanho da entrega e as Entregas funcionam igual, s\u00f3 sem vers\u00e3o.", "cita": [], "decisao": "Decis\u00e3o do Pedro (13/11/2026, grill no terminal, rodadas 4 e 5, todas as recomenda\u00e7\u00f5es aceitas). A Ana, agente de atendimento do mesmo hospital, tem reposit\u00f3rio pr\u00f3prio e privado (`pedrorezendefig/programa-ana`), com o mesmo pacote do...", "emenda": [54, 84, 90, 92], "emendada_por": [], "file": "docs/adr/0093-projeto-na-tecnologia-aplicativo-do-hospital-e-ana.md", "number": 93, "slug": "0093-projeto-na-tecnologia-aplicativo-do-hospital-e-ana", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Projeto na Tecnologia: Aplicativo do Hospital e Ana"}, {"amended_by": null, "amends": "0078, 0068", "body_md": "Decis\u00e3o do Pedro (13/11/2026, grill no terminal, rodadas 4 e 6, todas as recomenda\u00e7\u00f5es aceitas). A ADR 0078 aposentou o manual antigo (site na Vercel, com v\u00eddeo por m\u00f3dulo e fatia de manual em todo PRD) e deixou o manual novo para uma decis\u00e3o pr\u00f3pria. Esta \u00e9 ela. O Pedro quer um manual que qualquer pessoa abra pelo canto inferior esquerdo, com uma aba para o app e outra para a Ana, no molde do Retrato da Ana: bem explicado, desenhado com fluxogramas. Sem v\u00eddeo; print de tela pode.\n\n## Decis\u00f5es\n\n1. **O manual mora dentro do app, atr\u00e1s do login.** Um item \"Manual\", com \u00edcone de livro, no rodap\u00e9 das duas barras laterais (a do app e a do Admin), acima do bot\u00e3o de recolher, abre o manual na largura toda com duas abas: Aplicativo do Hospital e Ana. Rejeitado: site separado na Vercel (o prompt da Ana n\u00e3o pode ficar p\u00fablico, e o endere\u00e7o do manual antigo ficou livre); o manual no menu do usu\u00e1rio.\n\n2. **Quem v\u00ea o qu\u00ea.** A aba Aplicativo do Hospital \u00e9 de todo usu\u00e1rio logado, e cada pessoa v\u00ea s\u00f3 as p\u00e1ginas dos m\u00f3dulos que j\u00e1 acessa no menu. A aba Ana \u00e9 s\u00f3 de Super admin, porque mostra o prompt, as chamadas e as ferramentas. Rejeitado: todos veem tudo; o manual inteiro s\u00f3 para Super admin.\n\n3. **A aba Ana \u00e9 o Retrato da Ana.** O backend serve a p\u00e1gina do Retrato, como ela \u00e9, direto do reposit\u00f3rio privado da Ana, pelo token da integra\u00e7\u00e3o (ADR 0093), s\u00f3 para Super admin logado. O Retrato \u00e9 regenerado no reposit\u00f3rio da Ana sempre que o prompt muda. Rejeitado: refazer as abas e os fluxogramas do Retrato em componentes do app; publicar o Retrato na Vercel com senha; copiar o Retrato para o reposit\u00f3rio do Hospital, que \u00e9 p\u00fablico.\n\n4. **A aba Aplicativo do Hospital \u00e9 uma p\u00e1gina por m\u00f3dulo.** Reuni\u00f5es e Pend\u00eancias, POPs, Ouvidoria, Contas m\u00e9dicas, Central de Comando, Dados do Atendimento e Tecnologia. Cada p\u00e1gina tem as tarefas em passo a passo, prints de tela e fluxogramas. A fonte \u00e9 um Markdown por m\u00f3dulo dentro do frontend, com Mermaid para os fluxogramas e PNG para os prints, desenhado pelo pr\u00f3prio app e revisado em PR. Rejeitado: texto no banco editado numa tela; uma p\u00e1gina \u00fanica e longa; perguntas e respostas.\n\n5. **Print s\u00f3 com dado fict\u00edcio.** Tirado pelo `playwright-cli` contra o app local, com dados de seed. Nenhum nome, dado de sa\u00fade ou contrato real, porque o reposit\u00f3rio \u00e9 p\u00fablico. Rejeitado: print de produ\u00e7\u00e3o borrado \u00e0 m\u00e3o.\n\n6. **A fatia de manual volta ao fluxo, sem v\u00eddeo.** Todo PRD com tela ganha uma fatia de manual com texto, prints e fluxograma. O `/to-prd` e o `/to-issues` voltam a cri\u00e1-la, no reposit\u00f3rio do OS e na c\u00f3pia do Hospital. Emenda a decis\u00e3o 3 da ADR 0078 e a ADR 0068 (a fatia de manual volta \u00e0 lista do que sobe sem parada humana). O que fez a 0078 tirar a fatia era o peso do v\u00eddeo, que n\u00e3o volta. Rejeitado: um card de manual por m\u00eas; atualizar \u00e0 m\u00e3o.\n\n## Consequ\u00eancias\n\n- Continua valendo da 0078: o site antigo, as skills `/manual` e `/montar-manual`, a pasta `docs/manual/` e os v\u00eddeos do manual n\u00e3o voltam.\n- As p\u00e1ginas nascem numa onda s\u00f3, uma fatia por m\u00f3dulo, depois da fatia que monta o manual. A da Tecnologia espera as fatias das Entregas novas (ADR 0092).\n- O Kit de conhecimento continua sendo o que o Assistente de Tecnologia l\u00ea; o manual \u00e9 para a pessoa.\n\n## Emenda a este ADR (13/11/2026, antes de qualquer fatia)\n\n**Decis\u00e3o 4, o fluxograma.** O Pedro trocou o Mermaid por um componente pr\u00f3prio do app, no design system e com anima\u00e7\u00e3o, para o manual ter acabamento profissional. O fluxograma \u00e9 desenhado em SVG pelo pr\u00f3prio app, com a fonte da casa, os tokens de cor, os cantos e as sombras do app. O autor da p\u00e1gina declara num bloco `fluxograma` do Markdown os passos, as decis\u00f5es, as liga\u00e7\u00f5es e a posi\u00e7\u00e3o de cada passo numa grade (linha e coluna); as liga\u00e7\u00f5es saem em \u00e2ngulo reto, com seta.\n\nA anima\u00e7\u00e3o \u00e9 discreta. Quando o fluxograma entra na tela, os passos aparecem em sequ\u00eancia e cada liga\u00e7\u00e3o se desenha do passo de origem ao de destino. Passar o mouse num passo destaca o caminho dele e mostra o detalhe. O bot\u00e3o \"Percorrer\" anda um passo de cada vez, no molde do \"percorrer a jornada\" do Retrato da Ana. Com movimento reduzido, tudo aparece pronto, e o leitor de tela recebe o mesmo fluxo como lista numerada.\n\nRejeitado: Mermaid (o visual dele n\u00e3o \u00e9 o do app, e animar o que ele desenha \u00e9 remendo); biblioteca de diagrama com layout autom\u00e1tico (depend\u00eancia nova para fluxos que cabem numa grade).\n\nAs demais decis\u00f5es ficam intactas.", "cita": [92, 93], "decisao": "Decis\u00e3o do Pedro (13/11/2026, grill no terminal, rodadas 4 e 6, todas as recomenda\u00e7\u00f5es aceitas). A ADR 0078 aposentou o manual antigo (site na Vercel, com v\u00eddeo por m\u00f3dulo e fatia de manual em todo PRD) e deixou o manual novo para uma...", "emenda": [78, 68], "emendada_por": [], "file": "docs/adr/0094-manual-novo-dentro-do-app-com-abas-hospital-e-ana.md", "number": 94, "slug": "0094-manual-novo-dentro-do-app-com-abas-hospital-e-ana", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Manual novo dentro do app, com as abas Aplicativo do Hospital e Ana"}], "fluxo": {"arestas": [{"de": "grill", "para": "porta"}, {"de": "porta", "meio": 0.3, "para": "toprd", "rotulo": "A: pedido grande"}, {"de": "porta", "para": "issue", "rotulo": "B: uma tarefa s\u00f3"}, {"de": "porta", "meio": 0.3, "para": "ship", "rotulo": "C: ajuste pequeno"}, {"de": "toprd", "para": "toissues"}, {"de": "toissues", "para": "montar"}, {"de": "montar", "para": "onda"}, {"de": "issue", "para": "onda"}, {"de": "onda", "para": "revisao"}, {"de": "ship", "modo": "lado", "para": "revisao"}, {"de": "revisao", "para": "merge", "rotulo": "tudo certo"}, {"de": "merge", "para": "deploy"}, {"de": "deploy", "para": "demonstracao", "rotulo": "no ar"}, {"de": "pedido-app", "para": "demanda"}, {"de": "demanda", "para": "refino"}, {"de": "refino", "modo": "direita", "para": "porta", "rotulo": ["entra pela", "porta A ou pela B"]}], "fonte": "Pacote do fluxo (ADR 0023 do PedroOS). Mude aqui e vale em todo Projeto; a raia pr\u00f3pria de um Projeto fica em `raias`, no bloco `fluxo` de projetos/<nome>.json.", "grade": {"coluna": 90, "largura": 1110, "linha": 96}, "legenda": [{"classe": "auto", "texto": "autom\u00e1tico: o agente faz sozinho"}, {"classe": "humano", "texto": "parada humana: uma pessoa precisa agir"}, {"classe": "decisao", "texto": "decis\u00e3o: uma pergunta escolhe o caminho"}], "nos": [{"classe": "humano", "comando": "app do hospital", "detalhe": "O diretor pede um ajuste ou conta um problema pelo app do hospital, sem abrir o GitHub. O pedido j\u00e1 sai com o que ele planejou.", "id": "pedido-app", "sub": "o diretor pede pelo app", "titulo": "Pedido no app", "w": 220, "x": 1.8, "y": 0.5}, {"classe": "auto", "comando": "a issue nasce sozinha", "detalhe": "O pedido vira uma issue com o Selo de Demanda, que acompanha a tarefa at\u00e9 ela estar em produ\u00e7\u00e3o.", "id": "demanda", "sub": "vira issue com o Selo de Demanda", "titulo": "Demanda", "w": 220, "x": 5.4, "y": 0.5}, {"classe": "auto", "comando": "/triage", "detalhe": "O Pedro l\u00ea a Demanda, diz se ela \u00e9 vi\u00e1vel e decide s\u00f3 o que \u00e9 dele. A Demanda refinada entra pela porta A, quando \u00e9 grande, ou pela B, quando \u00e9 uma tarefa s\u00f3.", "id": "refino", "skill": "triage", "sub": "o Pedro v\u00ea se d\u00e1 para fazer", "titulo": "/triage com Refino", "w": 220, "x": 9, "y": 0.5}, {"classe": "auto", "comando": "/grill-with-docs, e /express para fechar em lote", "detalhe": "O agente faz perguntas, uma rodada por vez, at\u00e9 o pedido ficar claro, e anota no gloss\u00e1rio e nas decis\u00f5es o que ficou combinado. Se voc\u00ea n\u00e3o quiser responder tudo, o /express fecha o grill em lote: responde o que falta com a recomenda\u00e7\u00e3o dele e mostra uma tabela para voc\u00ea aprovar. Depois disso, o trabalho segue pelos passos de baixo.", "id": "grill", "skill": "grill-with-docs", "sub": ["perguntas at\u00e9 o plano ficar claro", "o /express fecha em lote"], "titulo": "/grill-with-docs", "w": 300, "x": 6, "y": 1.4}, {"classe": "decisao", "comando": "o grill escolhe a porta no fim", "detalhe": "No fim do grill, o pedido ganha uma porta. A: pedido grande, que vira v\u00e1rias tarefas, mexe no banco ou precisa de quem decide. B: uma tarefa s\u00f3, que cabe numa sess\u00e3o. C: um ajuste pequeno, que vai direto para o PR.", "id": "porta", "sub": "o tamanho do pedido decide", "titulo": "Qual porta?", "w": 300, "x": 6, "y": 2.5}, {"classe": "auto", "comando": "/to-prd", "detalhe": "Transforma a conversa num plano escrito, o PRD, e publica como issue no GitHub. O come\u00e7o dele \u00e9 em linguagem simples, para quem decide entender o que vai mudar sem ler c\u00f3digo.", "id": "toprd", "skill": "to-prd", "sub": "escreve o plano e publica", "titulo": "/to-prd", "w": 240, "x": 2, "y": 4.3}, {"classe": "auto", "comando": "/to-issues", "detalhe": "Divide o PRD em fatias que podem ser entregues sozinhas, cada uma com os crit\u00e9rios de aceite. O GitHub guarda qual fatia depende de qual.", "id": "toissues", "skill": "to-issues", "sub": "quebra o plano em tarefas", "titulo": "/to-issues", "w": 240, "x": 2, "y": 5.25}, {"classe": "auto", "comando": "/montar-ondas-enxutas", "detalhe": "Olha as fatias abertas, separa as que mexem nos mesmos arquivos e monta as Ondas em ordem. No fim pergunta se pode lan\u00e7ar.", "id": "montar", "skill": "montar-ondas-enxutas", "sub": "monta as Ondas sem conflito", "titulo": "/montar-ondas-enxutas", "w": 240, "x": 2, "y": 6.199999999999999}, {"classe": "auto", "comando": "/triage", "detalhe": "O pedido vira uma issue s\u00f3, com a lista do que conta como pronto. Essa lista vira os testes, e \u00e9 ela que o revisor confere. Depois a issue entra na pr\u00f3xima Onda.", "id": "issue", "skill": "triage", "sub": "uma tarefa que diz o que \u00e9 pronto", "titulo": "Issue com crit\u00e9rios", "w": 240, "x": 6, "y": 4.3}, {"classe": "auto", "comando": "/ship \"<descri\u00e7\u00e3o>\"", "detalhe": "Para o ajuste pequeno que j\u00e1 est\u00e1 pronto: salva a mudan\u00e7a, roda os testes e abre o PR, sem PRD e sem issue.", "id": "ship", "skill": "ship", "sub": "o ajuste vai direto para o PR", "titulo": "/ship", "w": 240, "x": 10, "y": 4.3}, {"classe": "auto", "comando": "/onda-enxuta #PRD", "detalhe": "Uma sess\u00e3o de fundo pega as tarefas da Onda, uma por agente, e cada agente abre o PR da sua. Voc\u00ea s\u00f3 entra quando alguma coisa precisa de voc\u00ea, e o aviso chega no celular.", "id": "onda", "notas": ["/tdd: cada tarefa come\u00e7a pelo teste que falha, e o c\u00f3digo vem depois.", "Checagens: os testes, o CI e as lentes de seguran\u00e7a e de design rodam em todo PR.", "Retro: quando a Onda termina, a /retro-onda pode tirar dela o que melhorar no fluxo."], "skill": "onda-enxuta", "sub": ["o agente faz as tarefas em lotes", "e abre um PR por tarefa"], "titulo": "/onda-enxuta", "w": 420, "x": 4, "y": 7.4}, {"classe": "auto", "comando": "agentes onda-revisor e onda-corretor", "detalhe": "Um agente que n\u00e3o escreveu o c\u00f3digo l\u00ea o PR procurando s\u00f3 o que \u00e9 grave. Se achar problema, outro agente corrige e os testes rodam de novo. Depois de tr\u00eas tentativas sem sucesso, a tarefa volta para uma pessoa com o motivo escrito.", "id": "revisao", "sub": ["um revisor l\u00ea o PR uma vez", "o corretor conserta o que ele achar"], "titulo": "Revis\u00e3o", "w": 420, "x": 6, "y": 8.7}, {"classe": "auto", "comando": "fechar_onda.py", "detalhe": "Com a revis\u00e3o e o CI verdes, a subida junta os PRs na main um de cada vez. Se um der problema, s\u00f3 ele sai do lote e os outros seguem.", "id": "merge", "sub": "um PR de cada vez", "titulo": "Merge", "w": 240, "x": 6, "y": 9.8}, {"classe": "auto", "comando": "fechar_onda.py", "detalhe": "Um deploy por Onda: a vers\u00e3o nova sobe, e a subida confere se o app responde com ela. No Projeto que n\u00e3o tem deploy, o caminho termina no merge.", "id": "deploy", "sub": "a vers\u00e3o nova vai para o ar", "titulo": "Deploy", "w": 240, "x": 6, "y": 10.9}, {"classe": "fim", "comando": "/divulgar, ou Gerar demonstra\u00e7\u00e3o na aba Ondas", "detalhe": "Com a entrega no ar, o v\u00eddeo narrado e a p\u00e1gina mostram o que mudou para quem usa. Um PRD tem uma Demonstra\u00e7\u00e3o s\u00f3, com as fatias juntas.", "id": "demonstracao", "sub": "o v\u00eddeo do que mudou", "titulo": "Demonstra\u00e7\u00e3o", "w": 240, "x": 6, "y": 12.0}], "portas": [{"caminho": "/to-prd, /to-issues, /montar-ondas-enxutas, /onda-enxuta", "porta": "A. PRD e fatias", "quando": "Pedido grande: vira v\u00e1rias tarefas, mexe no banco ou quem decide precisa saber"}, {"caminho": "/triage, e a issue entra na Onda", "porta": "B. Issue \u00fanica", "quando": "Uma tarefa s\u00f3, que cabe numa sess\u00e3o"}, {"caminho": "/ship \"<descri\u00e7\u00e3o>\"", "porta": "C. PR direto", "quando": "Ajuste pequeno, que j\u00e1 est\u00e1 pronto"}], "raias": [{"id": "diretor", "titulo": "Demanda do diretor", "x1": 0.1, "x2": 11.933333333333334, "y1": 0.05, "y2": 1.25}, {"id": "a", "titulo": "A. PRD e fatias", "x1": 0.1, "x2": 4.0, "y1": 3.75, "y2": 7.1}, {"id": "b", "titulo": "B. Issue \u00fanica", "x1": 4.1, "x2": 8.0, "y1": 3.75, "y2": 7.1}, {"id": "c", "titulo": "C. PR direto", "x1": 8.1, "x2": 11.9, "y1": 3.75, "y2": 7.1}], "tipo": "fluxo", "titulo": "Fluxo do time"}, "glossario": "# Hospital Reuni\u00f5es\n\nAutomatiza o ciclo de vida de reuni\u00f5es corporativas de um hospital de alta complexidade: grava\u00e7\u00e3o \u2192 transcri\u00e7\u00e3o por IA \u2192 gera\u00e7\u00e3o de **Ata** \u2192 aprova\u00e7\u00e3o (com ou sem assinatura digital) \u2192 acompanhamento de **Pend\u00eancias**. Este arquivo \u00e9 o gloss\u00e1rio do dom\u00ednio \u2014 define o que os termos **s\u00e3o**. Use esta terminologia em issues, testes e propostas; n\u00e3o derive para sin\u00f4nimos marcados como _Evitar_.\n\n## Pessoas e pap\u00e9is\n\n**Facilitador**:\nQuem conduz uma Reuni\u00e3o e responde pela Ata: marca, revisa, aprova e envia para assinatura. \u00c9 quem **loga** no sistema. Hoje s\u00e3o 5 (1 diretor + 4 diretoras).\n_Evitar_: admin, gestor, usu\u00e1rio.\n\n**Colaborador**:\nPessoa citada numa Reuni\u00e3o e/ou respons\u00e1vel por uma Pend\u00eancia. **N\u00e3o loga** no sistema \u2014 s\u00f3 recebe emails da ClickSign e links diretos para suas Pend\u00eancias.\n_Evitar_: funcion\u00e1rio, membro, usu\u00e1rio comum.\n\n**Secret\u00e1ria**:\nPapel de Facilitador com vis\u00e3o global: enxerga Reuni\u00f5es de toda a organiza\u00e7\u00e3o e pode editar participantes e corrigir Atas al\u00e9m das suas pr\u00f3prias.\n_Evitar_: assistente, operador.\n\n**Super admin**:\nFacilitador com permiss\u00f5es irrestritas (inclui a\u00e7\u00f5es de _bypass_ usadas em debug). Marcado por `is_super_admin`.\n\n**Role (faixa hier\u00e1rquica)**:\nEtiqueta interna de administra\u00e7\u00e3o (`diretor`, `gerente`, `coordenador`, `presidente`), derivada do cargo, com poder de permiss\u00e3o quase nulo (a permiss\u00e3o real vive em `access_profile` e `perfil_pop`). **Nunca aparece para o pr\u00f3prio Facilitador**; s\u00f3 o Super admin a v\u00ea, no painel de usu\u00e1rios (ADR 0033, risco trabalhista). O texto p\u00fablico de identifica\u00e7\u00e3o de uma pessoa nas telas \u00e9 o **cargo**.\n_Evitar_: exibir role em tela de usu\u00e1rio final; confundir role com perfil de acesso.\n\n**Participante**:\nV\u00ednculo entre um Colaborador e uma **Reuni\u00e3o** espec\u00edfica. \u00c9 o roster que a IA tenta casar na **Resolu\u00e7\u00e3o**, para alocar Pend\u00eancias ao respons\u00e1vel certo: interno vira respons\u00e1vel real (com cobran\u00e7a), externo fica s\u00f3 como nome. Os nomes v\u00eam detectados da Transcri\u00e7\u00e3o.\n_Evitar_: convidado, presente.\n\n**Resolu\u00e7\u00e3o**:\nO casamento de um nome citado (na Transcri\u00e7\u00e3o ou na conversa de uma Ata Guiada) com um Colaborador do cadastro, para que a Pend\u00eancia nas\u00e7a atribu\u00edda \u00e0 pessoa certa. Prioriza o roster de Participantes da Reuni\u00e3o e cai para o cadastro geral; nome que n\u00e3o casa fica como **externo** (s\u00f3 o nome, sem v\u00ednculo nem cobran\u00e7a). Na Ata Guiada acontece **ao vivo**: o agente conversa usando os nomes can\u00f4nicos do cadastro e pergunta quando h\u00e1 ambiguidade (\"qual Lucas?\") ou quando n\u00e3o encontra ningu\u00e9m.\n_Evitar_: matching, match, reconhecimento, identifica\u00e7\u00e3o.\n\n**Signat\u00e1rio**:\nParticipante que precisa assinar a Ata dentro de um Envelope da ClickSign.\n_Evitar_: assinante, signer.\n\n> **Ambiguidade sinalizada \u2014 \"usu\u00e1rio\":** evite o termo cru. Quem age no sistema \u00e9 o **Facilitador** (loga) ou o **Colaborador** (n\u00e3o loga). Dizer \"usu\u00e1rio\" esconde essa distin\u00e7\u00e3o, que \u00e9 central para acesso e notifica\u00e7\u00e3o.\n\n## Reuni\u00e3o e Ata\n\n**Reuni\u00e3o**:\nA entidade central. Nasce PROGRAMADA e caminha por uma m\u00e1quina de estados at\u00e9 um estado terminal (ASSINADA, APROVADA ou CANCELADA). A partir de AGUARDANDO_VALIDACAO o Facilitador escolhe entre dois caminhos: **enviar para assinatura** (cria o Envelope na ClickSign) ou **finalizar sem assinatura** (vai direto para APROVADA). Estados: `PROGRAMADA \u2192 PROCESSANDO \u2192 (AGUARDANDO_RESOLUCAO) \u2192 AGUARDANDO_VALIDACAO \u2192 (CORRIGINDO) \u2192 AGUARDANDO_ASSINATURA \u2192 ASSINADA`; ramo terminal sem assinatura `AGUARDANDO_VALIDACAO \u2192 APROVADA`; ramos `ERRO` e `CANCELADA`.\n_Evitar_: encontro, meeting, evento.\n\n**Transcri\u00e7\u00e3o**:\nO texto bruto da Reuni\u00e3o (colado manualmente ou sincronizado via Fireflies). \u00c9 a entrada do Pipeline de IA.\n_Evitar_: grava\u00e7\u00e3o, \u00e1udio (o \u00e1udio em si n\u00e3o entra no sistema).\n\n**Ata**:\nO documento estruturado da Reuni\u00e3o \u2014 t\u00f3picos, decis\u00f5es e a\u00e7\u00f5es. Tem **dois modos de gera\u00e7\u00e3o**: **por Transcri\u00e7\u00e3o** (o Pipeline de IA extrai a Ata completa a partir do texto da Reuni\u00e3o; vira PDF e pode ser assinada) ou **Guiada** (ver **Ata Guiada**). Uma Reuni\u00e3o tem no m\u00e1ximo **uma** Ata, por um dos dois modos.\n_Evitar_: minuta, relat\u00f3rio, documento.\n\n**Ata Guiada**:\nA Ata de uma Reuni\u00e3o **sem Transcri\u00e7\u00e3o**, montada pelo Facilitador numa **tela dedicada** (a partir de uma Reuni\u00e3o PROGRAMADA) no formato **ata viva**: o `Resumo Executivo` e o `Quadro de Atribui\u00e7\u00f5es` tomam forma ao vivo \u2014 com o mesmo visual da Ata final \u2014 enquanto um **chat lateral** (por texto ou voz) organiza o relato e pergunta as lacunas cr\u00edticas (sobretudo respons\u00e1vel e prazo de cada a\u00e7\u00e3o). Os respons\u00e1veis citados passam por **Resolu\u00e7\u00e3o** ao vivo: o quadro exibe o nome can\u00f4nico do cadastro e sinaliza quem ficou sem v\u00ednculo. O Facilitador pode **apontar uma se\u00e7\u00e3o** (\u2316) e corrigi-la pela conversa, e anexar opcionalmente um **Documento de apoio** como contexto. Segue o caminho **sem assinatura** (valida \u2192 APROVADA, liberando as Pend\u00eancias); n\u00e3o tem Envelope nem, por ora, PDF. \u00c9 o modo leve da Ata, para reuni\u00f5es operacionais que n\u00e3o justificam Transcri\u00e7\u00e3o.\n_Evitar_: ata lite, ata r\u00e1pida, registro, nota da reuni\u00e3o.\n\n**Documento de apoio**:\nUm arquivo que o Facilitador **opcionalmente** anexa durante a montagem de uma **Ata Guiada** (`.txt`, `.md`, `.pdf` ou `.docx`) para dar ao agente o contexto do que ele j\u00e1 tem escrito (anota\u00e7\u00f5es, slides, um rascunho). \u00c9 **contexto sob demanda**: o agente s\u00f3 o consulta quando o Facilitador pede (\"tira as a\u00e7\u00f5es do anexo\", \"resume o documento\") e **nunca** despeja seu conte\u00fado na ata sozinho. \u00c9 **ef\u00eamero** \u2014 vive s\u00f3 durante a montagem e n\u00e3o persiste na Reuni\u00e3o.\n_Evitar_: fonte, transcri\u00e7\u00e3o, anexo da ata, base da ata.\n\n**APROVADA**:\nEstado terminal de uma Ata finalizada **sem assinatura digital**. Na valida\u00e7\u00e3o, o Facilitador escolhe \"Finalizar sem assinatura\": as Pend\u00eancias nascem na hora e a Reuni\u00e3o vai direto para APROVADA \u2014 sem Envelope, sem ClickSign, sem aguardar assinaturas. \u00c9 paralela a ASSINADA (que exige a assinatura no ClickSign) e igualmente terminal \u2014 sem reversibilidade (\"assinar depois\" n\u00e3o existe). Serve a reuni\u00f5es operacionais, onde o valor est\u00e1 em registrar a Ata e disparar as tarefas, n\u00e3o na formalidade da assinatura.\n_Evitar_: conclu\u00edda, fechada, validada.\n\n**Pipeline de IA** (ou **Pipeline**):\nA sequ\u00eancia de chamadas LLM que transforma Transcri\u00e7\u00e3o em Ata (extrair fala \u2192 casar participantes \u2192 resumir \u2192 estruturar JSON \u2192 gerar Ata em portugu\u00eas \u2192 PDF). A API da Anthropic \u00e9 o provedor \u00fanico da IA de texto, no Claude Sonnet 5.5 (issue #1302); sem chave configurada, em desenvolvimento, o Pipeline cai num mock.\n_Evitar_: processamento, job de IA.\n\n## Pend\u00eancias\n\n**Pend\u00eancia**:\nUma a\u00e7\u00e3o atribu\u00edda a um respons\u00e1vel, com prazo e m\u00e1quina de estados pr\u00f3pria (`PENDENTE \u2192 EM_PROGRESSO \u2192 CONCLUIDO`; ramos `ATRASADO`, `CANCELADO` e `REPACTUADA`). Nasce quando o compromisso do respons\u00e1vel se firma, e desde o primeiro segundo \u00e9 plena (painel, prazo, cobran\u00e7a). No caminho com assinatura o nascimento \u00e9 **incremental** (ADR 0030): a assinatura do respons\u00e1vel no ClickSign cria as dele; a assinatura do Facilitador cria as de quem est\u00e1 fora do Envelope; o Aceite interno cria as do aceitante; a finaliza\u00e7\u00e3o do documento cria todo o resto. No caminho sem assinatura, todas nascem na aprova\u00e7\u00e3o (**APROVADA**, ADR 0003).\n_Evitar_: tarefa, to-do, meta (o diretor chama de meta a Pend\u00eancia com prazo; no app n\u00e3o existe cadastro de metas), a\u00e7\u00e3o (use \"a\u00e7\u00e3o\" s\u00f3 para a linha da Ata que origina a Pend\u00eancia).\n\n**Repactua\u00e7\u00e3o**:\nO ato de o Facilitador remarcar o prazo de uma Pend\u00eancia. **N\u00e3o cria Pend\u00eancia nova**: a mesma Pend\u00eancia passa ao estado `REPACTUADA` e tem o prazo apagado, ficando \"A repactuar\" na tela at\u00e9 algu\u00e9m marcar a data nova. \u00c9 o caso mais comum a partir de `ATRASADO`.\n_Evitar_: adiamento, remarca\u00e7\u00e3o, prorroga\u00e7\u00e3o.\n\n## Assinatura digital\n\n**Envelope**:\nO container da ClickSign que agrupa o PDF da Ata e seus Signat\u00e1rios. Identificado por `envelope_key_clicksign`. Fecha de dois jeitos, e ambos s\u00e3o **finaliza\u00e7\u00e3o**: todos assinam, ou o deadline (30 dias) estoura e a ClickSign fecha com as assinaturas que tiver. Nos dois casos a Reuni\u00e3o vira
