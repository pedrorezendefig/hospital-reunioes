direcionamento, ato do ouvidor.** Bot\u00e3o \"Redirecionar\" no Dossi\u00ea e no menu secund\u00e1rio da linha da fila, para caso em `aguardando_area` ou `respondido`. Abre a [Valida\u00e7\u00e3o e acionamento] pr\u00e9-preenchida (tipo, gravidade, extrato) com a \u00e1rea em branco e um **motivo obrigat\u00f3rio**. Numa requisi\u00e7\u00e3o s\u00f3, o servidor tira o caso da \u00e1rea antiga (consome o link, para o rel\u00f3gio, zera os carimbos de cobran\u00e7a e escalonamento, grava o movimento \"Redirecionado pelo ouvidor (de <setor>): motivo\") e aciona a \u00e1rea nova pela mesma porta de sempre. Se a \u00e1rea nova n\u00e3o tem titular nem gestor vigente, nada acontece e o caso continua com a \u00e1rea antiga. Rejeitado: dois atos (\"Retirar da \u00e1rea\" e depois validar), porque deixa o caso parado em classifica\u00e7\u00e3o sem ningu\u00e9m cobrando; pausa e devolu\u00e7\u00e3o por insufici\u00eancia j\u00e1 cobrem quem precisa de tempo.\n\n2. **Mesma conta de prazo da devolu\u00e7\u00e3o (ADR 0048, decis\u00e3o 2).** T1 novo, prazo cheio para a \u00e1rea nova, o tempo perdido com a \u00e1rea errada entra na Triagem da Ouvidoria. Rejeitado: a \u00e1rea nova herdar o prazo restante. O erro de despacho \u00e9 o mesmo fato, s\u00f3 que percebido pelo ouvidor em vez da \u00e1rea, e o relat\u00f3rio n\u00e3o pode mostrar a \u00e1rea certa atrasada por culpa de quem despachou errado. O prazo conclusivo com o manifestante n\u00e3o se move.\n\n3. **Caso pausado n\u00e3o redireciona.** Em `aguardando_manifestante` o ouvidor retoma primeiro. Rejeitado: aceitar a pausa como origem, porque o rel\u00f3gio parado da pausa e o prazo cheio da \u00e1rea nova se embolam na mesma requisi\u00e7\u00e3o.\n\n4. **A \u00e1rea antiga \u00e9 avisada.** Email curto ao mesmo destinat\u00e1rio do acionamento: a demanda daquele protocolo foi encaminhada a outra \u00e1rea e n\u00e3o \u00e9 preciso responder. Sem motivo, sem dizer qual \u00e1rea. Gatilho novo `redirecionamento_area` na [Notifica\u00e7\u00e3o da Ouvidoria], registrado e reenvi\u00e1vel. Rejeitado: sil\u00eancio, como na devolu\u00e7\u00e3o. L\u00e1 a pr\u00f3pria \u00e1rea abriu m\u00e3o; aqui ela pode estar no meio de apurar, e descobrir s\u00f3 quando o link falhar \u00e9 desperdi\u00e7ar trabalho e criar ru\u00eddo com a Ouvidoria.\n\n5. **O `ouvidor` passa a manter o cadastro de Respons\u00e1vel do setor**, ao lado da `diretoria_executiva`. Trocar a pessoa que responde \u00e9 encerrar a vig\u00eancia do titular e cadastrar o novo; um Cobrar em seguida leva o caso ao novo (issue #536). Vale para todos os casos do setor, presentes e futuros. Rejeitado: destinat\u00e1rio por caso (o ouvidor escolher titular, substituto ou gestor ao acionar). Respons\u00e1vel \u00e9 atributo do setor, n\u00e3o do caso, e a cadeia de cobran\u00e7a e escalonamento inteira (v\u00e9spera ao titular, vencimento ao substituto, +24h gestor) parte do cadastro; um destinat\u00e1rio por caso teria que carregar a cadeia junto, ou a cobran\u00e7a iria para uma pessoa e o escalonamento para outra. A [Tabela de prazos] continua s\u00f3 da Diretoria.\n\n6. **Sem limite de redirecionamentos, sem relat\u00f3rio nesta leva.** Mesma regra da devolu\u00e7\u00e3o: a cada volta h\u00e1 o ouvidor decidindo, e a trilha guarda cada redirecionamento com o motivo.\n\n## Consequ\u00eancias\n\n- A trilha ganha dois movimentos na mesma requisi\u00e7\u00e3o (retirada e acionamento), e o Dossi\u00ea passa a distinguir \"Devolvido pela \u00e1rea\" de \"Redirecionado pelo ouvidor\" pelo prefixo da observa\u00e7\u00e3o; a contagem de devolu\u00e7\u00f5es n\u00e3o muda.\n- A resposta da \u00e1rea errada, quando existir, fica na trilha como est\u00e1 (imut\u00e1vel) e n\u00e3o viaja para a \u00e1rea nova.\n- A \u00e1rea antiga j\u00e1 recebeu o relato integral por email e nada desfaz isso; o aviso apenas encerra a demanda dela. Em caso sigiloso o aviso continua sem detalhe algum, como a decis\u00e3o 4 j\u00e1 fixa.\n- Trocar o titular no cadastro n\u00e3o invalida o link que o antigo recebeu: ele expira ou \u00e9 consumido como hoje. Se o caso precisa sair das m\u00e3os do antigo na hora, o ouvidor cobra (o link novo vai ao vigente) ou redireciona.\n- Quem l\u00ea m\u00e9tricas de Triagem ver\u00e1 o trecho crescer tamb\u00e9m nos casos redirecionados. \u00c9 o efeito desejado, o mesmo do ADR 0048.\n- A tela `/ouvidoria/responsaveis` e as rotas de escrita de `/responsaveis` passam a aceitar o [Perfil da Ouvidoria] inteiro. Quando esta ADR foi escrita, ela dizia que o hist\u00f3rico de vig\u00eancia j\u00e1 registrava quem mexeu; n\u00e3o registrava, e a linha do cadastro sozinha n\u00e3o responde mais \"quem trocou o titular\" agora que a porta tem dois donos. O rastro entrou na issue #711 pelo `audit_log`, a mesma tabela dos outros atos administrativos do app, com o setor e o papel no `metadata`. Rejeitada a coluna de autor na pr\u00f3pria tabela de respons\u00e1veis: custa uma migration aplicada \u00e0 m\u00e3o em produ\u00e7\u00e3o para guardar o que a auditoria do app j\u00e1 sabe guardar.", "cita": [], "decisao": "Decis\u00e3o do Pedro (14/set/2026, grilling a partir da pergunta do diretor: \"o ouvidor ou o superadmin consegue, de forma f\u00e1cil, alterar o respons\u00e1vel pela resposta ou a \u00e1rea respons\u00e1vel?\"). A resposta era \"em parte\": a \u00e1rea conseguia...", "emenda": [48], "emendada_por": [], "file": "docs/adr/0055-redirecionamento-pelo-ouvidor-e-cadastro-de-responsaveis-pelo-ouvidor.md", "number": 55, "slug": "0055-redirecionamento-pelo-ouvidor-e-cadastro-de-responsaveis-pelo-ouvidor", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O ouvidor redireciona o caso para outra \u00e1rea num ato s\u00f3, e passa a manter o cadastro de respons\u00e1veis"}, {"amended_by": "0057, 0075, 0077", "amends": null, "body_md": "Decis\u00e3o do Pedro (15/set/2026, grilling, na v\u00e9spera de uma viagem em que os s\u00f3cios e o diretor passam a usar a aba Tecnologia sozinhos). O Quadro de Demandas (ADR 0050) est\u00e1 em produ\u00e7\u00e3o, mas abrir uma Demanda bem escrita exige que o diretor saiba de antem\u00e3o o tipo, o produto e o que a Vitta vai perguntar depois. Esta ADR p\u00f5e um agente de IA na porta de entrada, o **Assistente de Tecnologia**, e fixa tr\u00eas escolhas que seriam caras de desfazer: quem grava, de onde ele sabe o que sabe, e quando ele pode responder sem registrar.\n\n## Contexto\n\n- O app j\u00e1 replicou tr\u00eas vezes o mesmo molde de agente conversacional (Ata Guiada, corre\u00e7\u00e3o de Ata, elabora\u00e7\u00e3o de POP): sem estado no servidor, resposta JSON `{reply, rascunho}`, prompts em `.md`, sanitizador de travess\u00e3o (ADR 0013), modo mock sem chave. A Ata Guiada (ADR 0005 e 0006) tem tela dedicada com chat de um lado e rascunho vivo do outro, voz gravada no navegador e transcrita no backend, e Documento de apoio ef\u00eamero.\n- A aba Tecnologia n\u00e3o toca o LLM em ponto nenhum: o \"Copiar para IA\" \u00e9 texto para o humano colar fora do app.\n- A Demanda n\u00e3o tem anexo; a descri\u00e7\u00e3o \u00e9 texto puro sem limite. A cria\u00e7\u00e3o exige t\u00edtulo, tipo e produto, e o backend decide estado e respons\u00e1vel (ADR 0050, decis\u00e3o 4).\n- Todos os agentes usam a mesma `LLM_MODEL` (em produ\u00e7\u00e3o o Gemini 3.7 Flash via OpenRouter, que l\u00ea imagem). Nenhuma chamada do app manda imagem ao modelo hoje; PDF e DOCX viram texto localmente, sem OCR.\n- A imagem do backend leva s\u00f3 `backend/app/`. O gloss\u00e1rio (`CONTEXT.md`) e os manuais (`docs/manual/`) ficam fora do build, o gloss\u00e1rio fala de labels, issues e ADRs que o diretor n\u00e3o deve ver (ADR 0054, decis\u00e3o 9), e os manuais s\u00e3o HTML com prints para gente ler.\n- A Ana vive em outro reposit\u00f3rio; o app n\u00e3o tem de onde ler o que ela faz.\n\n## Decis\u00f5es\n\n1. **O agente monta, a pessoa grava.** O chat produz um Rascunho da Demanda com os campos do formul\u00e1rio, todos edit\u00e1veis \u00e0 m\u00e3o, e a Demanda s\u00f3 nasce no bot\u00e3o \"Criar Demanda\", pela mesma rota e com as mesmas guardas de hoje. O bot\u00e3o nunca \u00e9 segurado por falta de informa\u00e7\u00e3o: o que faltou sai no roteiro como \"n\u00e3o informado\". Rejeitado: o agente criar por tool call ao fim da conversa (um clique a menos, e o erro do modelo virando Demanda sem ningu\u00e9m olhar); s\u00f3 texto para colar no formul\u00e1rio (n\u00e3o resolve a usabilidade).\n\n2. **O conhecimento \u00e9 um kit pr\u00f3prio, escrito para o diretor, embarcado no prompt inteiro.** Um arquivo `.md` por Produto (Ana, Integra\u00e7\u00e3o Ana x MV, Reuni\u00f5es, Ouvidoria, POPs, Site, Infra) mais um sobre a pr\u00f3pria aba, em `backend/app/conhecimento/`, viajando no deploy. Sem n\u00famero de issue, label, nome de tabela ou vocabul\u00e1rio do reposit\u00f3rio. Curado por gente, com a regra do manual: mudou o comportamento de um m\u00f3dulo, o arquivo dele muda no mesmo PR. Rejeitado: RAG com embeddings (infraestrutura para cinco pessoas e oito documentos que cabem na janela do modelo); copiar `CONTEXT.md` e os manuais para a imagem (o leitor errado: vocabul\u00e1rio interno e HTML); gerar o kit por script a partir do gloss\u00e1rio (um filtro em que ningu\u00e9m confia). Custo aceito: uma terceira escrita do mesmo conhecimento, e kit desatualizado vira agente mentindo.\n\n3. **Responde do kit ou registra.** Pergunta cuja resposta est\u00e1 no kit \u00e9 respondida ali mesmo, dizendo de onde saiu, com a sa\u00edda oferecida (\"resolveu, ou quer registrar mesmo assim?\"); se o diretor sai satisfeito, nada \u00e9 gravado. Fora do kit o agente n\u00e3o responde de cabe\u00e7a: diz que n\u00e3o sabe e monta a Demanda (Informa\u00e7\u00e3o ou Consultoria). Rejeitado: sempre registrar (desperdi\u00e7a o conhecimento e faz o diretor esperar um dia pelo que est\u00e1 escrito); responder e gravar uma Demanda j\u00e1 Conclu\u00edda (enche o Hist\u00f3rico do que ningu\u00e9m pediu).\n\n4. **Tudo que entra \u00e9 ef\u00eamero.** Texto, voz gravada, arquivo de texto, imagem e arquivo de \u00e1udio s\u00e3o lidos e viram descri\u00e7\u00e3o; nenhum \u00e9 guardado, e a conversa tamb\u00e9m n\u00e3o (nem na Conversa da Demanda, nem em tabela pr\u00f3pria). O produto \u00e9 a Demanda. A imagem \u00e9 a primeira chamada multimodal do app. Rejeitado nesta leva: Anexo da Demanda persistente (storage, tabela, card, e-mail), que pode entrar depois como PRD pr\u00f3prio sem desfazer nada.\n\n5. **\"Nova Demanda\" abre o assistente**, em tela dedicada no molde da Ata Guiada, com o formul\u00e1rio antigo a um clique (\"prefiro preencher \u00e0 m\u00e3o\"). O agente enxerga as Demandas abertas do Quadro (t\u00edtulo, tipo, produto, estado, Etapa; nunca a Conversa) e avisa quando j\u00e1 existe uma sobre o mesmo assunto. Sem nome pr\u00f3prio: persona compete com a Ana na cabe\u00e7a do hospital. Mesma `LLM_MODEL` de todo mundo. Uma linha fixa avisa que o conte\u00fado \u00e9 lido por uma IA, como o \"Copiar para IA\" j\u00e1 avisa.\n\n## Consequ\u00eancias\n\n- O gloss\u00e1rio ganhou Assistente de Tecnologia, Kit de conhecimento e Roteiro por Tipo.\n- Nasce uma pasta de conhecimento no backend que o `/to-prd` e o `/to-issues` precisam tratar como parte da entrega: fatia que muda comportamento vis\u00edvel de um m\u00f3dulo lista o arquivo do kit a atualizar, como j\u00e1 faz com o manual.\n- A rota do chat \u00e9 nova, atr\u00e1s de `require_super_admin`, com o mesmo teto de taxa dos outros chats; a rota de voz existente serve como est\u00e1 (Super admin passa pelo gate de Reuni\u00f5es). O arquivo de texto reaproveita o extrator dos outros m\u00f3dulos; imagem e \u00e1udio enviados por upload s\u00e3o caminhos novos, com teto de tamanho e sem persist\u00eancia.\n- Nada muda na cria\u00e7\u00e3o, no Kanban, na Conversa, no V\u00ednculo (ADR 0054) nem no e-mail: a Demanda que o assistente monta \u00e9 indistingu\u00edvel de uma digitada no formul\u00e1rio.\n- Fora do escopo, de prop\u00f3sito: ajuda do agente dentro de uma Demanda existente (rascunhar resposta na Conversa) e Demandas fechadas no contexto.", "cita": [5, 6, 13, 50, 54], "decisao": "Decis\u00e3o do Pedro (15/set/2026, grilling, na v\u00e9spera de uma viagem em que os s\u00f3cios e o diretor passam a usar a aba Tecnologia sozinhos). O Quadro de Demandas (ADR 0050) est\u00e1 em produ\u00e7\u00e3o, mas abrir uma Demanda bem escrita exige que o...", "emenda": [], "emendada_por": [57, 75, 77], "file": "docs/adr/0056-assistente-de-tecnologia-rascunho-confirmado-kit-proprio.md", "number": 56, "slug": "0056-assistente-de-tecnologia-rascunho-confirmado-kit-proprio", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Assistente de Tecnologia: rascunho confirmado por gente, kit pr\u00f3prio embarcado, responde do kit ou registra"}, {"amended_by": "0058, 0062, 0071, 0072, 0076", "amends": "0044, 0056", "body_md": "Decis\u00e3o do Pedro (15/set/2026, grilling). O hospital tem um manual s\u00f3, o da Ouvidoria (#563): uma p\u00e1gina HTML feita \u00e0 m\u00e3o, com p\u00fablico declarado \"Pedro e time interno\", num projeto Vercel pr\u00f3prio, sem skill que o produza nem cadeia que o atualize. Cada PRD novo entrega c\u00f3digo, v\u00eddeo de percep\u00e7\u00e3o e p\u00e1gina de divulga\u00e7\u00e3o, e o manual fica para tr\u00e1s. Esta ADR fixa o que \u00e9 o manual, onde mora, como se produz e como entra no pipeline.\n\n## Decis\u00f5es\n\n1. **Um site, um endere\u00e7o, por m\u00f3dulo.** O manual \u00e9 um site \u00fanico (`manual.hospitalsaomatheus.cloud`, projeto Vercel \u00fanico), com se\u00e7\u00f5es na ordem do menu do app: Primeiros passos, Reuni\u00f5es e metas, Ouvidoria, POPs, Admin. Papel n\u00e3o \u00e9 estrutura, \u00e9 selo na p\u00e1gina (\"S\u00f3 admin\", \"Sem login\"). A aba Tecnologia fica fora, e a Central de Comando tamb\u00e9m (emenda da ADR 0058, decis\u00e3o 10: s\u00f3 Super admin v\u00ea, e \u00e9 leitura, n\u00e3o tarefa). O manual da Ouvidoria \u00e9 reescrito no molde novo e o endere\u00e7o antigo redireciona. Rejeitado: um site por m\u00f3dulo (N deploys, usu\u00e1rio que erra o m\u00f3dulo cai fora); manual por papel (a mesma tela em tr\u00eas trilhas, envelhece r\u00e1pido).\n\n2. **Markdown por p\u00e1gina, gerado com Astro Starlight.** Conte\u00fado em `docs/manual/src/content/docs/<modulo>/<tarefa>.md`, tema vestido com o design system do app (HP Simplified, navy, logo), busca, menu mobile e sum\u00e1rio de gra\u00e7a. Rejeitado: HTML \u00e0 m\u00e3o por p\u00e1gina (cada p\u00e1gina nova sai diferente e custa caro); gerador pr\u00f3prio em Python (busca e mobile s\u00e3o o que mais d\u00e1 trabalho de manter).\n\n3. **`docs/manual/` \u00e9 o site e \u00e9 dono dos v\u00eddeos de tarefa.** Composi\u00e7\u00e3o HyperFrames de cada v\u00eddeo em `docs/manual/video/<modulo>/<slug>/` (versionada, `assets` para `_assets`), MP4 renderizado em `public/video/` (fora do git), prints em `src/assets/<modulo>/`, roteiro de prints em `prints/<modulo>.py`. Os sete v\u00eddeos de cap\u00edtulo da Ouvidoria migram de `docs/comunicacao/ouvidoria/manual-cap-N/` para c\u00e1. `docs/comunicacao/` fica s\u00f3 com o que a `/divulgar` gera por PRD; o manual l\u00ea os MP4 de l\u00e1 para Novidades. Fecha a pend\u00eancia da decis\u00e3o 3 do ADR 0044: o manual n\u00e3o entra em `docs/comunicacao/`, porque os ciclos de vida s\u00e3o outros (a divulga\u00e7\u00e3o \u00e9 marco e envelhece de prop\u00f3sito; o manual \u00e9 vivo).\n\n4. **P\u00e1gina de tarefa, curta, com v\u00eddeo por tarefa.** A unidade \u00e9 a a\u00e7\u00e3o (\"Registrar uma manifesta\u00e7\u00e3o\"), no molde fixo do gloss\u00e1rio (quando usar, quem faz, v\u00eddeo, at\u00e9 6 passos, se der errado), \"voc\u00ea\" e imperativo, palavra da tela. V\u00eddeo gerado (mesma receita da `/divulgar`, mudo, sem esperar OK humano desde a emenda de 14/10/2026), 30 a 60 s, reger\u00e1vel. P\u00e1gina publica sem v\u00eddeo, com aviso. Rejeitado: grava\u00e7\u00e3o de tela com voz (n\u00e3o regera quando a tela muda); v\u00eddeo por cap\u00edtulo como unidade; v\u00eddeo obrigat\u00f3rio para publicar.\n\n5. **S\u00f3 produ\u00e7\u00e3o no ar.** P\u00e1gina de funcionalidade n\u00e3o deployada nasce com `draft: true` (fora do build e da busca) e perde o draft no deploy do PRD. Sem selo \"em desenvolvimento\" para o usu\u00e1rio. Cada p\u00e1gina traz `prd:` no frontmatter para o deploy saber o que liberar.\n\n6. **MP4 no pr\u00f3prio site, comprimido, com trava.** A publica\u00e7\u00e3o reencoda cada v\u00eddeo para 720p H.264 e trava se a pasta passar de 90 MB (limite de 100 MB do plano Hobby). Rejeitado por ora: Supabase Storage de produ\u00e7\u00e3o (exige chave de servi\u00e7o fora do Coolify); Vercel Pro desde j\u00e1 (a trava avisa antes; subir de plano \u00e9 a sa\u00edda sem mudar nada).\n\n7. **Prints s\u00e3o tela real, por roteiro.** Um script versionado por m\u00f3dulo abre o app local com dados de exemplo e captura os prints. Rejeitado: quadro do v\u00eddeo no lugar do print (\u00e9 desenho da tela, n\u00e3o a tela).\n\n8. **Fatia de manual por PRD, n\u00e3o mesmo PR.** O `/to-issues` cria em todo PRD com tela uma fatia final \"docs: manual do PRD\" (`type:docs`), bloqueada pelas fatias de c\u00f3digo, que roda na `/onda` como qualquer issue e sobe como qualquer fatia (emendado em 14/10/2026: a fatia parava no merge at\u00e9 algu\u00e9m ver o v\u00eddeo). O `/deploy ship` tira o draft das p\u00e1ginas dos PRDs que subiram e republica o manual. O `/to-prd` ganha a se\u00e7\u00e3o \"Manual: p\u00e1ginas que nascem ou mudam\". Isto emenda o ADR 0056, decis\u00e3o 2 e consequ\u00eancia: a regra \"mudou o comportamento, o arquivo muda no mesmo PR\" vale para o kit de conhecimento (s\u00f3 texto) e **n\u00e3o** para o manual, cuja p\u00e1gina precisa da tela pronta para print e v\u00eddeo. A regra compartilhada entre kit e manual \u00e9 \"no mesmo PRD\". Rejeitado: manual no mesmo PR de c\u00f3digo (p\u00e1gina nasce sem print e sem v\u00eddeo, PR inflado); manual fora da fila (some da cobran\u00e7a).\n\n9. **Duas skills.** `/manual <m\u00f3dulo | #PRD | publicar>` produz (p\u00e1ginas, prints, v\u00eddeos, Novidades; `publicar` = build, lint, trava, deploy). `/montar-manual` planeja como a `/montar-ondas`: inventaria m\u00f3dulo por m\u00f3dulo o que falta (p\u00e1gina, print, v\u00eddeo, Novidades por PRD), presta contas de tudo e entrega **um prompt por terminal, um terminal por m\u00f3dulo**, cada um em worktree pr\u00f3prio mexendo s\u00f3 nas pastas do seu m\u00f3dulo, teto de 3 (render de v\u00eddeo disputa a CPU). A funda\u00e7\u00e3o (Starlight, tema, home, `publicar.sh`, redirecionamento, item Ajuda) \u00e9 uma issue sozinha, antes. Publicar na Vercel \u00e9 um passo s\u00f3, depois dos merges.\n\n10. **Lint trava a publica\u00e7\u00e3o.** Travess\u00e3o e meia-risca (ADR 0013), a lista de jarg\u00e3o da `/divulgar` (migration, endpoint, API, PR, deploy, RLS, backend, frontend...) e aviso para p\u00e1gina de tarefa acima de 250 palavras.\n\n11. **O app aponta para o manual.** Item \"Ajuda\" na sidebar abre, em nova aba, a se\u00e7\u00e3o do m\u00f3dulo em que a pessoa est\u00e1 (por m\u00f3dulo, n\u00e3o por tela: mapa por tela envelhece a cada rota).\n\n12. **Novidades por PRD.** Uma entrada por PRD entregue, com o v\u00eddeo de percep\u00e7\u00e3o quando existe e links para as tarefas que mudaram. N\u00e3o \u00e9 changelog.\n\n## Emenda a este ADR (16/set/2026, o dom\u00ednio pr\u00f3prio foi abandonado)\n\n**Decis\u00e3o 1, o endere\u00e7o do manual.** A decis\u00e3o nomeia `manual.hospitalsaomatheus.cloud` como o endere\u00e7o do site, e a se\u00e7\u00e3o de consequ\u00eancias trata o DNS como ato humano pendente. O Pedro decidiu abandonar o dom\u00ednio pr\u00f3prio: o endere\u00e7o definitivo do Manual do usu\u00e1rio passa a ser **`https://manual-hsm.vercel.app`**, o alias de produ\u00e7\u00e3o do projeto Vercel, sem vari\u00e1vel de ambiente e sem DNS pendente.\n\nO que mudou desde a decis\u00e3o original: o registro nunca foi criado. A zona de `hospitalsaomatheus.cloud` n\u00e3o \u00e9 servida pela Hostinger, como a consequ\u00eancia supunha, e sim pela Cloudflare, ent\u00e3o o ato humano n\u00e3o era o que estava escrito. Enquanto isso, o app j\u00e1 apontava para o dom\u00ednio, que responde \"endere\u00e7o n\u00e3o encontrado\", e o item Ajuda abria uma aba em branco para todo mundo. O custo do endere\u00e7o bonito era o manual inacess\u00edvel na tela, e o alias da Vercel j\u00e1 funciona. O `site:` do Astro, de onde saem as URLs can\u00f4nicas e o mapa do site, passa a ser o mesmo endere\u00e7o; ele apontava para um dom\u00ednio que n\u00e3o resolve.\n\nA vari\u00e1vel `NEXT_PUBLIC_MANUAL_URL` continua existindo, com o mesmo papel de sempre: apontar um ambiente para uma pr\u00e9via. S\u00f3 o valor padr\u00e3o mudou. Voltar a ter dom\u00ednio pr\u00f3prio um dia \u00e9 decis\u00e3o nova, e o caminho \u00e9 o mesmo de qualquer troca de endere\u00e7o: o padr\u00e3o no app, o `site:` do Astro e um redirecionamento.\n\n**Decis\u00e3o 11, por onde o app aponta.** A decis\u00e3o diz \"item Ajuda na sidebar\", no singular, e a implementa\u00e7\u00e3o p\u00f4s o item s\u00f3 na `Sidebar`. O app tem duas barras: a `AppShell` troca a `Sidebar` pela `AdminSidebar` quando a pessoa entra no /admin. A se\u00e7\u00e3o Admin do manual estava publicada e ningu\u00e9m chegava nela pela barra, porque justamente l\u00e1 a barra que tinha o item n\u00e3o \u00e9 a que aparece. A decis\u00e3o passa a valer para as duas barras, e cada uma abre a se\u00e7\u00e3o do lugar em que a pessoa est\u00e1.\n\nAs demais decis\u00f5es ficam intactas.\n\n## Emenda a este ADR (17/set/2026, a camada did\u00e1tica: print de passo, fluxograma de caminho e aviso)\n\nDecis\u00e3o do Pedro (grilling de 17/09/2026, com a recomenda\u00e7\u00e3o seguida em todas as perguntas). O Manual estava no ar com 86 p\u00e1ginas, o molde certo e o texto j\u00e1 humano, mas 39 das 57 P\u00e1ginas de tarefa n\u00e3o tinham nenhuma imagem, 48 exibiam \"V\u00eddeo em produ\u00e7\u00e3o\" e nenhuma p\u00e1gina tinha fluxograma nem aviso destacado. Quem l\u00ea no celular, sem som e com pressa, n\u00e3o d\u00e1 play: olha a figura. Esta emenda acrescenta a camada visual que o leitor leigo precisa e fixa como ela se produz.\n\n**Decis\u00e3o 4, a P\u00e1gina de tarefa ganha uma segunda camada obrigat\u00f3ria.** O V\u00eddeo de tarefa continua a unidade de \"ver a fazer\". Ao lado dele, toda P\u00e1gina de tarefa leva **um print por mudan\u00e7a de tela, com bal\u00e3o numerado igual ao n\u00famero do passo**, colocado logo abaixo do passo que ele ilustra. Passos que acontecem na mesma tela dividem um print com v\u00e1rios bal\u00f5es; a regra \u00e9 \"por tela\", n\u00e3o \"por passo\". O print continua sendo tela real do app (decis\u00e3o 7): o bal\u00e3o \u00e9 desenhado pelo pr\u00f3prio Roteiro de prints por cima da tela, antes da captura, nunca em editor de imagem. O aviso \"V\u00eddeo em produ\u00e7\u00e3o\" sai da tela do usu\u00e1rio; a p\u00e1gina sem v\u00eddeo publica sem dizer nada, e a lacuna continua no invent\u00e1rio da `/montar-manual`. Rejeitado: print como camada principal e v\u00eddeo s\u00f3 para tarefa com movimento (o ADR j\u00e1 decidiu v\u00eddeo por tarefa e a campanha de 48 v\u00eddeos estava pronta; o que custa caro no v\u00eddeo, a r\u00e9plica, n\u00e3o se aproveita no print, que \u00e9 barato); bal\u00e3o desenhado \u00e0 m\u00e3o (envelhece e n\u00e3o regera); quadro do v\u00eddeo no lugar do print (j\u00e1 rejeitado na decis\u00e3o 7).\n\n**Decis\u00e3o 13, fluxograma de caminho.** Fluxograma entra **s\u00f3 onde h\u00e1 caminho ou estado**: nas cinco Vis\u00f5es gerais, ilustrando \"O caminho de ponta a ponta\", e nas p\u00e1ginas de Como funciona que descrevem estados ou desvios. No m\u00e1ximo um por p\u00e1gina, com as palavras da tela e do gloss\u00e1rio. A fonte \u00e9 texto versionado (`docs/manual/fluxogramas/<modulo>/<slug>.mmd`, sintaxe Mermaid), o SVG \u00e9 gerado por script do site em `src/assets/<modulo>/fluxo-<slug>.svg` com as cores do app, e a p\u00e1gina aponta para o SVG como aponta para um print. N\u00e3o confundir com o fluxograma do POP, que \u00e9 se\u00e7\u00e3o do documento gerado pelo app. Rejeitado: Mermaid renderizado no build (exige navegador no build da Vercel e muda o pipeline por causa de oito imagens); SVG desenhado \u00e0 m\u00e3o pelo agente (cada um sai diferente e n\u00e3o regera); fluxograma em P\u00e1gina de tarefa (a tarefa \u00e9 linear, o print de passo cobre).\n\n**Decis\u00e3o 14, aviso destacado.** O aviso do que \u00e9 irrevers\u00edvel ou do que a pessoa precisa saber antes de clicar (\"Finalizar sem assinatura n\u00e3o tem volta\", \"a senha aparece uma vez s\u00f3\") vira um callout do Starlight (`:::caution[T\u00edtulo]`) no corpo da P\u00e1gina de tarefa, no m\u00e1ximo um por p\u00e1gina, colocado antes do passo que dispara a a\u00e7\u00e3o. \"Se der errado\" continua lista, como est\u00e1. Rejeitado: callout em toda ressalva (vira ru\u00eddo e o leitor para de ler).\n\n**Decis\u00e3o 2, o tema desenha o passo.** O tema do site passa a numerar os passos das P\u00e1ginas de tarefa com n\u00famero grande e a acomodar a figura dentro do item da lista, e o v\u00eddeo ganha capa (`poster`) gerada pelo `publicar.sh` a partir do primeiro quadro do MP4. Nenhuma dessas mudan\u00e7as toca o Markdown das p\u00e1ginas.\n\n**Decis\u00e3o 10, o lint.** O texto alternativo das imagens deixa de contar no teto de 250 palavras: ningu\u00e9m l\u00ea o `alt`, e tr\u00eas prints por p\u00e1gina empurrariam toda tarefa para o aviso.\n\n**Produ\u00e7\u00e3o.** A camada did\u00e1tica \u00e9 uma segunda campanha de prompts em `docs/prompts/` (07 a 09), na mesma mec\u00e2nica dos v\u00eddeos: um worktree por terminal, um terminal por m\u00f3dulo, teto de tr\u00eas terminais de print (o app local e o banco s\u00e3o compartilhados), o tema sozinho e antes de todos, os fluxogramas em paralelo com os prints porque n\u00e3o tocam P\u00e1gina de tarefa, e o 06 (enxugar a escrita) por \u00faltimo, porque mexe no texto de todas. Humaniza\u00e7\u00e3o separada foi rejeitada: o texto j\u00e1 \u00e9 humano, e os tr\u00eas cacoetes encontrados (\"\u00e9 assim mesmo\", \"de prop\u00f3sito\", \"n\u00e3o \u00e9 X: \u00e9 Y\") entram no 06.\n\nAs demais decis\u00f5es ficam intactas.\n\n## Emenda a este ADR (13/out/2026, o V\u00eddeo de tarefa ganha estilo pr\u00f3prio e a campanha de rerender, ADR 0071)\n\nDecis\u00e3o do Pedro (grilling de 13/10/2026). Os 61 V\u00eddeos de tarefa s\u00e3o r\u00e9plicas fi\u00e9is do app, mas cada um saiu de uma sess\u00e3o diferente, sem estilo compartilhado nem gate de verifica\u00e7\u00e3o al\u00e9m do `check` e do olhar humano. O [HyperFrames Student Kit](https://github.com/nateherkai/hyperframes-student-kit) de Nate Herk traz o que faltava: um contrato de estilo (`DESIGN.md` + `tokens.css` + cards como sub-composi\u00e7\u00f5es com slots nomeados), um vocabul\u00e1rio de movimento, gates de verifica\u00e7\u00e3o por frames e o loop \"nota do revisor vira regra na skill\". A filosofia visual do kit (canvas preto, tipo cromado, 1,5 s por cena) \u00e9 de reel, e n\u00e3o entra.\n\n**Decis\u00e3o 4, o V\u00eddeo de tarefa ganha a disciplina do kit com a cara do hospital.** O corpo continua r\u00e9plica fiel do app, mudo, 30 a 60 s (\"na d\u00favida, fiel vence\"). Entram do kit: (a) um **Estilo do manual** em `docs/manual/video/_estilo/`, no formato da style-library do kit, com `DESIGN.md`, `tokens.css` tirado do `globals.css` do frontend e cards reus\u00e1veis (legenda de passo, callout, lower-third, abertura, carimbo) como sub-composi\u00e7\u00f5es com slots; (b) o vocabul\u00e1rio de movimento: push-in no elemento do passo, c\u00e2mera que nunca para, transi\u00e7\u00e3o com rastro entre telas, e a lei do timeline que preenche o slot inteiro (sem quadro preto); (c) os gates de verifica\u00e7\u00e3o: strips de frames a cada corte, `VERIFY.md` por v\u00eddeo, al\u00e9m do carimbo e do gate anti-t\u00e9cnica que j\u00e1 existem; (d) o loop em que cada nota humana no draft vira regra na skill `/manual`, para a nota n\u00e3o se repetir. Rejeitado: visual do kit s\u00f3 na abertura e no fecho (dois mundos num v\u00eddeo de 45 s); adotar o kit inteiro (bonito e deixa de parecer o app).\n\n**O kit mora fora do reposit\u00f3rio.** Clone em `~/PedroDev/hyperframes-student-kit` como refer\u00eancia de leitura; o que o manual usa \u00e9 adaptado \u00e0 m\u00e3o para `.claude/skills/manual/references/` e para o Estilo do manual. Nenhuma skill do kit \u00e9 instalada globalmente (tr\u00eas t\u00eam o mesmo nome das skills globais de HyperFrames). O HyperFrames continua na vers\u00e3o do manual, n\u00e3o na do kit. Os v\u00eddeos de refer\u00eancia gerados pelo Opus 5.5 ficam em `local/manual-video-referencias/` (fora do git, como os masters) e cada um tem uma **Ficha de refer\u00eancia** em `_estilo/references/`: o que copiar dele e o que n\u00e3o copiar. O `DESIGN.md` cita as fichas.\n\n**Gate da campanha de rerender dos 61 v\u00eddeos.** (Emendado em 14/10/2026: o OK humano por v\u00eddeo e por m\u00f3dulo caiu; a Folha de contato vai no corpo do PR como evid\u00eancia, sem esperar resposta.) A regra pedia OK humano por v\u00eddeo no dia a dia e no piloto, e por m\u00f3dulo na campanha. Ordem: a funda\u00e7\u00e3o (estilo, cards, gates, skill) \u00e9 uma issue sozinha; depois um piloto de dois v\u00eddeos com OK por v\u00eddeo e nota virando regra; depois um terminal por m\u00f3dulo, teto de tr\u00eas (render disputa CPU), cada um entregando uma **Folha de contato** (quadros-chave de todos os v\u00eddeos do m\u00f3dulo e um MP4 inteiro) para um OK por m\u00f3dulo. O texto que aparece no v\u00eddeo passa pelo humanizer (ADR 0071). Rejeitado: 61 OKs (campanha presa \u00e0 agenda); sem OK humano (o primeiro v\u00eddeo errado vai ao ar sem ningu\u00e9m ver).\n\nA rejei\u00e7\u00e3o de \"humaniza\u00e7\u00e3o separada\" registrada na se\u00e7\u00e3o Produ\u00e7\u00e3o abaixo deixa de valer: a ADR 0071 decide a reescrita.\n\n## Emenda a este ADR (14/out/2026, o draft do V\u00eddeo de tarefa deixa de esperar o humano)\n\nDecis\u00e3o do Pedro, depois do piloto de dois v\u00eddeos (#1231, PR #1246): \"Eu n\u00e3o quero mais checar draft. Eu confio at\u00e9 o final. Eu n\u00e3o quero que voc\u00ea me pergunte.\" A Fatia de manual parava no PR verde, fora da subida, at\u00e9 algu\u00e9m assistir ao draft e rodar o `fechar_onda.py`; a emenda de 13/10/2026 pedia o mesmo OK por v\u00eddeo no dia a dia e por m\u00f3dulo na campanha de rerender.\n\n**Decis\u00f5es 4 e 8, o v\u00eddeo sobe sem OK humano.** O agente faz o draft, passa pelos gates (`hyperframes check`, strips de cada corte, `tools/checar_video_manual.py`, `tools/anel_video_manual.py`, quadros olhados e `VERIFY.md`), faz o render final na pr\u00f3pria fatia e abre o PR, que entra na subida como qualquer outro. Na campanha de rerender, a Folha de contato continua sendo feita e vai no corpo do PR como evid\u00eancia, sem esperar resposta. O loop \"nota vira regra\" continua: a nota do Pedro chega depois, com o v\u00eddeo no ar, e o conserto e a regra saem num PR novo. Rejeitado: manter o OK s\u00f3 para v\u00eddeo novo (a nota do piloto, o anel fora do lugar, virou o gate `anel_video_manual.py`, e a espera segurava a fatia inteira). As paradas humanas da ADR 0068, regra 9, passam a ser tr\u00eas.\n\n## Emenda a este ADR (14/out/2026, um v\u00eddeo por m\u00f3dulo e or\u00e7amento de 40 MB, ADR 0072)\n\nDecis\u00e3o do Pedro (PRD #1259). O v\u00eddeo do Manual deixa de ser por tarefa: cada m\u00f3dulo abre com um **V\u00eddeo de vis\u00e3o geral** do caminho principal, \"Conhe\u00e7a a plataforma\" aparece tamb\u00e9m na p\u00e1gina inicial, e o Admin fica sem v\u00eddeo (decis\u00f5es 3 e 4). As 61 P\u00e1ginas de tarefa perdem o v\u00eddeo, e as composi\u00e7\u00f5es dos V\u00eddeos de tarefa e dos cap\u00edtulos da Ouvidoria saem do reposit\u00f3rio; os masters ficam em `local/`. O `publicar.sh` ganha tr\u00eas travas depois do reencode: soma dos MP4 at\u00e9 40 MB, um v\u00eddeo por m\u00f3dulo, nenhum acima de 8 MB, com o teto de 90 MB mantido (decis\u00e3o 6). Novidades levam link para a p\u00e1gina de divulga\u00e7\u00e3o no lugar do v\u00eddeo embutido (decis\u00e3o 12), e a Fatia de manual s\u00f3 pede v\u00eddeo quando o PRD muda o caminho principal do m\u00f3dulo (decis\u00e3o 8). O detalhe e os rejeitados est\u00e3o na ADR 0072.\n\n## Emenda a este ADR (01/nov/2026, v\u00eddeo narrado em Remotion, refeito a cada PRD, e a Tecnologia no Manual, ADR 0076)\n\nDecis\u00e3o do Pedro (PRD #1365). **Decis\u00e3o 1:** a aba Tecnologia entra no Manual como m\u00f3dulo, o \u00faltimo do menu, com abertura, P\u00e1ginas de tarefa migradas dos 11 cap\u00edtulos da p\u00e1gina separada e V\u00eddeo de vis\u00e3o geral; o `manual-tecnologia-hsm` redireciona para a se\u00e7\u00e3o nova. A Central de Comando continua fora. **Decis\u00e3o 4, na emenda de 13/10/2026:** o Estilo do manual (HyperFrames) sai m\u00f3dulo a m\u00f3dulo; o v\u00eddeo do m\u00f3dulo passa a ser narrado e feito em Remotion pela skill `motion`, no molde da `/divulgar`. **Decis\u00e3o 8:** todo PRD que muda p\u00e1gina de um m\u00f3dulo refaz o v\u00eddeo daquele m\u00f3dulo, salvo exce\u00e7\u00e3o escrita na Fatia de manual. O detalhe e os rejeitados est\u00e3o na ADR 0076.\n\n## Consequ\u00eancias\n\n- `docs/manual/ouvidoria/` (p\u00e1gina \u00fanica) deixa de existir como est\u00e1: vira a se\u00e7\u00e3o `ouvidoria/` do site, recortada em tarefas e \"Como funciona\". Nada do conte\u00fado se perde; o formato muda.\n- `CLAUDE.md` (\"Docs vivos\") e `README.md` passam a descrever `docs/manual/` como o site do manual; o `/ask-pedro` ganha `/manual` e `/montar-manual` no mapa; a `/divulgar` n\u00e3o muda, s\u00f3 passa a ser lida pelo manual.\n- Node >= 22.12 entra nos pr\u00e9-requisitos de m\u00e1quina (`/setup-maquina`). Busca s\u00f3 funciona no build, n\u00e3o no `dev`.\n- O DNS de `manual.hospitalsaomatheus.cloud` \u00e9 ato humano na Hostinger; at\u00e9 l\u00e1 o alias `vercel.app` serve.\n- O QR da apresenta\u00e7\u00e3o em pptx e a p\u00e1gina de m\u00f3dulo da divulga\u00e7\u00e3o apontam para o endere\u00e7o antigo; o redirecionamento cobre, e os dois links s\u00e3o trocados na funda\u00e7\u00e3o.", "cita": [13, 68], "decisao": "Decis\u00e3o do Pedro (15/set/2026, grilling). O hospital tem um manual s\u00f3, o da Ouvidoria (#563): uma p\u00e1gina HTML feita \u00e0 m\u00e3o, com p\u00fablico declarado \"Pedro e time interno\", num projeto Vercel pr\u00f3prio, sem skill que o produza nem cadeia que o...", "emenda": [44, 56], "emendada_por": [58, 62, 71, 72, 76], "file": "docs/adr/0057-manual-do-usuario-site-unico-por-modulo-e-fatia-de-manual-por-prd.md", "number": 57, "slug": "0057-manual-do-usuario-site-unico-por-modulo-e-fatia-de-manual-por-prd", "status": "superseded", "substitui": [], "substituida_por": [78], "superseded_by": "0078", "supersedes": null, "title": "Manual do usu\u00e1rio: um site por m\u00f3dulo, v\u00eddeo por tarefa, fatia de manual por PRD"}, {"amended_by": "0059, 0085", "amends": "0057", "body_md": "Decis\u00e3o do Pedro (18/set/2026, grilling). A Central de Comando, o painel dos n\u00fameros do site e do Instagram do hospital, nasceu em junho de 2026 como aplica\u00e7\u00e3o separada (`pedroribbe/central-de-comando-hsm`, em `central.mala-ia.cloud`). Ela vira uma se\u00e7\u00e3o da \u00e1rea de Administra\u00e7\u00e3o do app, o que funciona hoje passa a funcionar aqui, e o app antigo \u00e9 desligado. Esta ADR fixa como.\n\n## Contexto\n\nFatos que pesaram:\n\n- A Central \u00e9 um Next.js 16 s\u00f3, sem backend \u00e0 parte: o servidor em TypeScript busca GA4 e Instagram, guarda cache de 1 hora em mem\u00f3ria e exp\u00f5e um conector MCP com OAuth 2.1 pelo WorkOS AuthKit. N\u00e3o tem banco, volume, fila nem tarefa agendada. No Coolify \u00e9 1 app com 13 vari\u00e1veis de ambiente.\n- O app do hospital \u00e9 Next.js 15 no front e FastAPI no back. O front n\u00e3o guarda segredo: toda API externa e todo controle de acesso vivem em Python (ADR 0002, ADR 0038).\n- A Central tinha login pr\u00f3prio (usu\u00e1rio e senha em vari\u00e1vel de ambiente), casca pr\u00f3pria, CSS Modules, gr\u00e1ficos em SVG caseiro e tema escuro. O app tem Supabase Auth, `AppShell`, Tailwind v4, `recharts` e s\u00f3 tema claro.\n- O que funciona de verdade: Vis\u00e3o Geral, Objetivos (4 de 6 com n\u00famero), Dados do Google, Instagram e o conector MCP com 3 ferramentas. Mapa de Calor, Google Ads, Editor do Site e Blog eram s\u00f3 tela de \"em breve\".\n- O diretor j\u00e1 \u00e9 Super admin do app e usa o app do hospital muito mais do que a Central.\n- A ADR 0050 j\u00e1 tinha decidido o mesmo movimento para a aba Tecnologia: mora no app, s\u00f3 Super admin, visual do app.\n\n## Decis\u00f5es\n\n1. **Mora no app, em se\u00e7\u00e3o pr\u00f3pria do menu da Administra\u00e7\u00e3o, s\u00f3 para Super admin.** A se\u00e7\u00e3o \"Central de Comando\" entra entre Atendimento e Tecnologia, no mesmo molde das outras (r\u00f3tulo e itens embaixo), e a Ajuda continua sendo o \u00faltimo item (ADR 0057, decis\u00e3o 11, intacta). O gate \u00e9 `super_admin`, sem eixo de permiss\u00e3o pr\u00f3prio: todo Super admin v\u00ea, e quem precisa ver precisa ser Super admin. Cada rota ganha guard de Super admin no `layout.tsx`, al\u00e9m do 403 do backend, porque secret\u00e1ria e facilitador entram em `/admin`. Rejeitado: `perfil_central` (n\u00e3o existe ningu\u00e9m que precise ver os n\u00fameros sem poder ser Super admin); item literalmente depois da Ajuda (custaria emendar a 0057 e deixaria o menu do Super admin diferente do dos outros pap\u00e9is).\n\n2. **O servidor \u00e9 portado para o FastAPI. A Central se adapta ao app, nunca o contr\u00e1rio.** Endpoints em `/api/admin/central-de-comando/*` com `require_super_admin`, clientes do Google e do Instagram em `services/` no molde do Espelho da Global Health (segredo ausente \u00e9 503 honesto, falha n\u00e3o vira lista vazia), cache de 1 hora em mem\u00f3ria no processo do backend, que roda com 1 processo s\u00f3, como a Central rodava. O front vira tela Tailwind com os tokens e os componentes do app, gr\u00e1ficos em `recharts`, e as barras simples em Tailwind puro. Morrem o login pr\u00f3prio, a casca pr\u00f3pria, os CSS Modules e a matem\u00e1tica de gr\u00e1fico caseira. Os testes da Central s\u00e3o a especifica\u00e7\u00e3o do porte: cada teste de regra vira um pytest equivalente antes de a fatia fechar. Rejeitado: manter o servidor em TypeScript dentro do front do hospital (barato, os testes viriam de gra\u00e7a, mas poria a credencial do Google e o token do Instagram no servi\u00e7o do front, criaria um segundo gate de Super admin fora do Python e um segundo jeito de fazer backend no mesmo app, para sempre).\n\n3. **O conector MCP vai para o backend e mant\u00e9m o WorkOS AuthKit.** Mesmas 3 ferramentas, mesmo contrato, em `https://api.hospitalsaomatheus.cloud/api/mcp`. \u00c9 o \u00fanico OAuth da casa, e \u00e9 for\u00e7ado: conector personalizado do claude.ai s\u00f3 aceita OAuth ou nenhuma autentica\u00e7\u00e3o, ent\u00e3o o `X-API-Key` da API da Ana n\u00e3o serve. No corte, cada pessoa remove o conector antigo e adiciona o novo, uma vez. Rejeitado: manter `central.mala-ia.cloud` apontando para o backend (dom\u00ednio pessoal, prenderia o desligamento); trocar o MCP por um assistente dentro do app no molde da ADR 0056 (\u00e9 funcionalidade nova paga na chave do projeto, n\u00e3o migra\u00e7\u00e3o, e entrega menos do que o Claude de quem j\u00e1 tem assinatura).\n\n4. **Quem pode conectar o MCP \u00e9 quem \u00e9 Super admin.** O backend pega o e-mail verificado do token, acha o participante e exige ativo e `super_admin`. A lista de e-mails em vari\u00e1vel de ambiente morre. Rebaixou ou desligou a pessoa, o conector dela para na hora. Custo aceito: o e-mail usado no WorkOS tem de ser o do cadastro no app, o que vira item do checklist do corte. Rejeitado: portar a lista como est\u00e1 (segunda lista de acesso, que diverge da primeira em sil\u00eancio).\n\n5. **O menu s\u00f3 lista o que funciona.** Quatro itens: Vis\u00e3o Geral, Objetivos, Dados do Google, Instagram. O que ainda n\u00e3o existe aparece num bloco \u00fanico no p\u00e9 da Vis\u00e3o Geral, \"O que vem por a\u00ed\". Rejeitado: portar as quatro telas de \"em breve\" como itens (a Central sozinha ficaria maior que o resto do menu, metade abrindo tela vazia, num app que n\u00e3o tem nenhum item assim); cortar o roadmap de vez (a vis\u00e3o de futuro para a diretoria era inten\u00e7\u00e3o do desenho original).\n\n6. **Paridade de 100% \u00e9 de dado e de fun\u00e7\u00e3o, n\u00e3o de apar\u00eancia.** Todo n\u00famero, todo per\u00edodo, o Ao vivo, o Atualizar agora, a degrada\u00e7\u00e3o honesta e o MCP t\u00eam de bater. O **tema escuro n\u00e3o vem**: o app s\u00f3 tem tema claro, tema escuro s\u00f3 no miolo ficaria quebrado dentro de uma casca clara, e tema escuro no app inteiro \u00e9 outro projeto. Perda consciente.\n\n7. **Vocabul\u00e1rio alinhado ao do app.** \"Bra\u00e7o do Hospital\" vira **\u00c1rea do site** (o n\u00famero fala das p\u00e1ginas do site, n\u00e3o da procura pelo servi\u00e7o, e n\u00e3o tem v\u00ednculo com a taxonomia de Setores). \"Objetivo\" nunca \u00e9 chamado de meta. \"Origem\" \u00e9 sempre \"Origem do p\u00fablico\". \"Site Oficial\" e \"Site Novo\" viram s\u00f3 \"Site\". Os guarda-chuvas \"Analytics\" e \"Marketing\" e o estado \"Em breve\" morrem. Defini\u00e7\u00f5es no `CONTEXT.md`. O vocabul\u00e1rio muda tamb\u00e9m em duas chaves do contrato do conector MCP (decis\u00e3o 3), e quem lia o conector antigo l\u00ea as chaves novas: as \u00e1reas saem em `areasDoSite` (era `bracos`), e o canal Fale Conosco, em `contatos[].chave`, \u00e9 `fale-conosco` (era `leads`, o nome interno da Central antiga). A troca de `leads` apareceu na confer\u00eancia de paridade e foi mantida por decis\u00e3o do Pedro (23/set/2026): `fale-conosco` \u00e9 o nome do canal no app.\n\n8. **Entrega dormente, valida\u00e7\u00e3o em localhost, a \u00faltima fatia liga.** Cada fatia \u00e9 validada no ambiente local com as credenciais reais e sobe para a `main` em PR pequeno, pelo `/ship` de sempre. Em produ\u00e7\u00e3o o c\u00f3digo chega desligado: o item de menu s\u00f3 aparece fora de `production` (pela `NEXT_PUBLIC_ENVIRONMENT`, que j\u00e1 existe) e as credenciais n\u00e3o entram no Coolify at\u00e9 o fim. A \u00faltima fatia tira a condi\u00e7\u00e3o, cola as vari\u00e1veis, e a Central aparece inteira, de uma vez. Rejeitado: branch longa com merge \u00fanico (a `main` recebe v\u00e1rios deploys por dia e a migra\u00e7\u00e3o mexe em `main.py`, `config.py` e `AdminSidebar.tsx`; os gates do `/ship` revisariam milhares de linhas de uma vez; o primeiro encontro do c\u00f3digo com a produ\u00e7\u00e3o seria o pacote inteiro); fatias vis\u00edveis em produ\u00e7\u00e3o conforme ficam prontas (o Pedro quer ver tudo surgir de uma vez).\n\n9. **Corte em quatro tempos, com quarentena.** Constru\u00e7\u00e3o em paralelo com o app antigo intacto; prova de paridade lado a lado (mesma fonte, mesmo per\u00edodo, n\u00famero id\u00eantico, diverg\u00eancia \u00e9 bug de porte); dia do corte (conferir cada e-mail da lista antiga do MCP contra o cadastro, trocar o Resource Indicator no WorkOS, reconectar os conectores, refazer o guia do conector em `docs/comunicacao/`); e o app antigo **parado**, n\u00e3o apagado, por 14 dias. S\u00f3 depois: apagar o app no Coolify, remover o DNS e **arquivar** o reposit\u00f3rio antigo, que guarda as specs e o hist\u00f3rico.\n\n10. **Fora do Manual do usu\u00e1rio.** A Central n\u00e3o tem tarefa, tem leitura, \u00e9 did\u00e1tica na pr\u00f3pria tela e s\u00f3 Super admin v\u00ea. O PRD da migra\u00e7\u00e3o n\u00e3o gera fatia de manual. A ADR 0057, decis\u00e3o 1, passa a ter duas exce\u00e7\u00f5es: a aba Tecnologia e a Central de Comando. O que precisa de instru\u00e7\u00e3o \u00e9 conectar o MCP, e isso \u00e9 o guia do conector.\n\n11. **O Blog n\u00e3o entra aqui.** Escrever post por dentro da Central \u00e9 o destino combinado (o Sanity \u00e9 a solu\u00e7\u00e3o intermedi\u00e1ria), mas \u00e9 produto novo com decis\u00f5es pr\u00f3prias em aberto. Vira o PRD seguinte, com grilling pr\u00f3prio. As issues vivas do reposit\u00f3rio antigo (#13, #17, #18) s\u00e3o recriadas neste repo como semente dele; as #1 a #4, j\u00e1 entregues, s\u00e3o fechadas l\u00e1 sem recriar.\n\n## Decis\u00f5es herdadas do reposit\u00f3rio antigo\n\nContinuam valendo, e o racioc\u00ednio completo fica em `pedroribbe/central-de-comando-hsm`, `docs/adr/`:\n\n- **0002 de l\u00e1:** os n\u00fameros v\u00eam da GA4 Data API e s\u00e3o desenhados em tela pr\u00f3pria, sem embutir Looker nem iframe.\n- **0003 de l\u00e1:** s\u00f3 se mostra o que o site de fato exp\u00f5e; o que n\u00e3o \u00e9 medido aparece como \"em constru\u00e7\u00e3o\" ou \"n\u00e3o medido\". \u00c9 a origem da honestidade do dado.\n- **0004 de l\u00e1:** o site novo reporta para a mesma propriedade GA4 do antigo, para a s\u00e9rie hist\u00f3rica n\u00e3o quebrar.\n- **0005 de l\u00e1:** Instagram s\u00f3 org\u00e2nico, pela API do Instagram, com a terminologia nativa da rede.\n- **0006 de l\u00e1:** os dados saem por um conector MCP s\u00f3 de leitura.\n\n**Revertida:** a 0001 de l\u00e1, \"a Central \u00e9 um app separado e somente leitura\". Separada deixou de ser com esta ADR; somente leitura deixar\u00e1 de ser com o Blog.\n\n## Consequ\u00eancias\n\n- Quem for Super admin v\u00ea os n\u00fameros do hospital e pode lig\u00e1-los ao pr\u00f3prio Claude. Promover algu\u00e9m a Super admin passa a significar isso tamb\u00e9m.\n- O backend ganha a primeira integra\u00e7\u00e3o com Google e com Instagram e o primeiro resource server OAuth. Todo teste desses clientes precisa dublar a rede, por causa da trava de rede da su\u00edte.\n- O token do Instagram expira e \u00e9 renovado \u00e0 m\u00e3o, como hoje. S\u00f3 muda onde a vari\u00e1vel \u00e9 colada.\n- Risco a responder na primeira fatia do MCP: se o AuthKit aceita dois Resource Indicators ao mesmo tempo. Se n\u00e3o aceitar, o MCP novo s\u00f3 \u00e9 testado no dia do corte, com o antigo j\u00e1 parado.\n- Deploy do backend zera o cache de 1 hora. O backend do hospital sobe com muito mais frequ\u00eancia do que a Central subia, ent\u00e3o a primeira leitura depois de cada deploy vai \u00e0 fonte. Emendado pela ADR 0059 (issue #867): o backend aquece o per\u00edodo padr\u00e3o de cada tela uma vez, logo depois de subir, e a troca de per\u00edodo e a abertura depois de horas sem ningu\u00e9m olhando continuam indo \u00e0 fonte.", "cita": [2, 38, 50, 56], "decisao": "Decis\u00e3o do Pedro (18/set/2026, grilling). A Central de Comando, o painel dos n\u00fameros do site e do Instagram do hospital, nasceu em junho de 2026 como aplica\u00e7\u00e3o separada (`pedroribbe/central-de-comando-hsm`, em `central.mala-ia.cloud`). Ela...", "emenda": [57], "emendada_por": [59, 85], "file": "docs/adr/0058-central-de-comando-migra-para-dentro-do-app.md", "number": 58, "slug": "0058-central-de-comando-migra-para-dentro-do-app", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Central de Comando migra para dentro do app do hospital, s\u00f3 para Super admin, com o servidor portado para o FastAPI"}, {"amended_by": null, "amends": "0058", "body_md": "Decis\u00e3o do dono na triagem da issue #867 (23/set/2026), depois da confer\u00eancia da #858. Emenda a \u00faltima consequ\u00eancia da ADR 0058, que dizia que a primeira leitura depois de cada deploy vai \u00e0 fonte.\n\n## Contexto\n\n- O cache da Central \u00e9 da mem\u00f3ria do processo, vale 1 hora e \u00e9 zerado a cada deploy do backend (ADR 0058, decis\u00e3o 2). O backend sobe v\u00e1rias vezes por dia.\n- Na confer\u00eancia de 23/09 (#858), com o cache cheio as telas responderam em 0,1 a 0,6 s. Com ele vazio, a primeira leitura foi \u00e0 fonte na hora, e a galeria dos Objetivos, que junta Google e Instagram, chegou a 29 s.\n- Depois da #858, uma aba aberta renova a mem\u00f3ria na hora certa. A espera sobra quase s\u00f3 para a primeira abertura depois de um deploy e para a abertura depois de horas sem ningu\u00e9m olhando.\n\n## Decis\u00f5es\n\n1. **Uma rodada de aquecimento por processo, logo depois do boot.** O `lifespan` do backend dispara a rodada, e ela l\u00ea cada chave que a primeira abertura de cada tela pede: os dois blocos de fonte da Vis\u00e3o Geral, Dados do Google, Instagram, a galeria dos Objetivos e a lente de cada Objetivo naveg\u00e1vel.\n2. **S\u00f3 o per\u00edodo padr\u00e3o, 28 dias.** A troca para 7 ou 90 dias continua indo \u00e0 fonte na primeira vez.\n3. **Pelas mesmas leituras das rotas, sem for\u00e7ar.** A chave aquecida \u00e9 a que a rota l\u00ea, e a rodada n\u00e3o vence as telas vizinhas como o Atualizar agora vence. A lista sai dos registros de telas e de Objetivos, ent\u00e3o tela nova entra sem regra duplicada.\n4. **Numa thread pr\u00f3pria, nunca no event loop, e o boot n\u00e3o espera.** O backend \u00e9 um processo s\u00f3 e atende o app inteiro. Uma leitura s\u00edncrona de dezenas de segundos no event loop travaria reuni\u00f5es, atas, POPs e Ouvidoria, e poderia reprovar o health check do deploy. Uma tela aberta durante a rodada espera a ida que j\u00e1 est\u00e1 no ar, sem abrir outra (uma ida por chave, #858).\n5. **Falha n\u00e3o derruba nada.** Falha da fonte, credencial ausente ou defeito numa chave vai para o log, e a rodada segue para a pr\u00f3xima. Sem credencial (CI, localhost sem `.env`), nenhuma ida \u00e0 rede.\n6. **Deslig\u00e1vel sem deploy de c\u00f3digo.** `CENTRAL_AQUECER_NO_BOOT=false` e um restart desligam a rodada. A su\u00edte de testes roda com ela desligada, para nenhum teste ir ao Google ou ao Instagram.\n\nRejeitado:\n\n- **Renovar as chaves antes de vencer, o dia todo.** A Central nunca ficaria fria, mas gastaria cota das fontes 24 horas por dia, com ou sem algu\u00e9m olhando, e ganharia uma tarefa agendada que ela n\u00e3o tem.\n- **N\u00e3o fazer**, aceitando a primeira abertura lenta como a ADR 0058 registrava. O backend sobe v\u00e1rias vezes por dia, e a primeira pessoa a abrir a Central depois de cada deploy esperava dezenas de segundos.\n- **Aquecer tamb\u00e9m 7 e 90 dias.** Triplicaria as idas por deploy para per\u00edodos pouco abertos.\n\n## Consequ\u00eancias\n\n- O deploy continua zerando o cache, mas o backend aquece o per\u00edodo padr\u00e3o logo depois de subir. A primeira abertura de cada tela depois do deploy, no per\u00edodo padr\u00e3o, sai do cache quando a rodada j\u00e1 passou por ela. Continuam indo \u00e0 fonte: a troca de per\u00edodo, a abertura depois de horas sem ningu\u00e9m olhando e a abertura que chega antes de a rodada passar pela chave (essa espera a ida no ar, sem abrir outra).\n- A Central continua sem tarefa agendada: a rodada \u00e9 uma por processo, fora do scheduler.\n- Cada deploy custa 9 leituras, uma por chave aquecida, com ou sem algu\u00e9m abrindo a Central. Em chamadas \u00e0s fontes, isso d\u00e1 cerca de 14 \u00e0 GA4 e 33 + 3N \u00e0 Graph API do Instagram (N = publica\u00e7\u00f5es dos \u00faltimos 28 dias, at\u00e9 25), porque cada leitura faz v\u00e1rias chamadas e a galeria roda de novo os quatro montadores. \u00c9 esse o custo a pesar se a cota apertar.\n- O Ao vivo continua fora do cache e fora da rodada.\n- Nada muda no estado: sem banco, sem volume, um processo s\u00f3.", "cita": [], "decisao": "Decis\u00e3o do dono na triagem da issue #867 (23/set/2026), depois da confer\u00eancia da #858. Emenda a \u00faltima consequ\u00eancia da ADR 0058, que dizia que a primeira leitura depois de cada deploy vai \u00e0 fonte.", "emenda": [58], "emendada_por": [], "file": "docs/adr/0059-central-de-comando-aquece-o-cache-no-boot.md", "number": 59, "slug": "0059-central-de-comando-aquece-o-cache-no-boot", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Central de Comando aquece o cache uma vez no boot, s\u00f3 no per\u00edodo padr\u00e3o"}, {"amended_by": null, "amends": "0054", "body_md": "Decis\u00e3o do diretor na triagem da issue #772 (27/set/2026). Estende ao dado de paciente a regra que a review do PR #688 fixou para o nome de quem pede: \"nome civil nenhum sai daqui\". O reposit\u00f3rio das issues \u00e9 p\u00fablico.\n\n## Contexto\n\n- O \"Levar para desenvolvimento\" (ADR 0054, decis\u00e3o 1) publica o t\u00edtulo e a descri\u00e7\u00e3o da Demanda numa issue do reposit\u00f3rio p\u00fablico, e toda resposta da Conversa de uma Demanda vinculada vira coment\u00e1rio na issue (decis\u00e3o 4). O \u00fanico tratamento do texto era o escape de `<` e de estrutura de Markdown.\n- Desde o #730 a descri\u00e7\u00e3o pode ser a transcri\u00e7\u00e3o, feita pelo modelo de vis\u00e3o, de um print de sistema hospitalar: nome de paciente, leito, prontu\u00e1rio. O prompt do print manda omitir dado pessoal e a tela avisa quem anexa, mas as duas barreiras dependem do modelo e da pessoa. E o diretor tamb\u00e9m digita: dado de paciente digitado vaza igual.\n- Na varredura de 27/09 nenhuma issue do reposit\u00f3rio tinha sido criada pelo bot\u00e3o. Esta decis\u00e3o \u00e9 preven\u00e7\u00e3o, e precisa estar em produ\u00e7\u00e3o antes do primeiro uso real.\n\n## Decis\u00f5es\n\n1. **Todo texto da Tecnologia que sai para o GitHub passa pela peneira, sempre.** T\u00edtulo e descri\u00e7\u00e3o da issue criada, e o texto do coment\u00e1rio espelhado, no envio e na corre\u00e7\u00e3o. Sempre, e n\u00e3o s\u00f3 quando a descri\u00e7\u00e3o veio de print: n\u00e3o h\u00e1 coluna que diga a origem, e o texto digitado vaza igual.\n2. **A peneira \u00e9 o `pseudonimizar` da Ouvidoria, como est\u00e1.** Os mesmos marcadores (`[CPF]`, `[CNS]`, `[RG]`, `[TELEFONE]`, `[EMAIL]`, `[DATA_NASCIMENTO]`, `[NOME]`, `[REDE_SOCIAL]` e os demais) e as mesmas garantias e limites, j\u00e1 testados com fuzz nas issues #412 e #441. N\u00e3o existe uma segunda peneira, e esta fatia n\u00e3o muda o comportamento do m\u00f3dulo para quem mais o usa.\n3. **A peneira roda sobre o texto cru, e o escape vem por \u00faltimo.** Assim o escape \u00e9 a \u00faltima palavra sobre a sa\u00edda: nenhum `<` e nenhuma estrutura em coluna zero sobrevive, venha do autor ou da peneira. O escape tamb\u00e9m p\u00f5e uma barra antes do colchete do marcador quando ele encosta em `:`, `(` ou `[`, porque `[NOME]: [TELEFONE]` na coluna zero \u00e9 uma defini\u00e7\u00e3o de link de refer\u00eancia e o GitHub some com a linha, e `[TELEFONE](x)` vira link. A barra n\u00e3o se repete numa segunda passada. O t\u00edtulo da issue fica sem a barra: l\u00e1 o GitHub mostra texto puro, sem link a desligar, e a barra apareceria.\n4. **S\u00f3 o que sai \u00e9 peneirado.** A Demanda no app e a linha da Conversa guardam o texto original. O bloco \"Para o diretor\", que volta ao card lido da issue, pode voltar com marcadores, e isso \u00e9 aceito.\n5. **No coment\u00e1rio espelhado, a peneira roda nos trechos entre as men\u00e7\u00f5es do app.** A men\u00e7\u00e3o escolhida no autocomplete continua virando `@login` ou \"Pessoa do hospital\" (emenda de 11/09 da ADR 0054), e esse r\u00f3tulo n\u00e3o passa pela peneira. O `@` digitado \u00e0 m\u00e3o, esse sim, passa: a peneira o l\u00ea como perfil de rede social, e ele sai `[REDE_SOCIAL]` em vez do `@ fulano` que a emenda de 11/09 descrevia. Pode ser o perfil do paciente. O espa\u00e7o depois do `@` continua valendo para o que a peneira n\u00e3o pega, o `@` seguido de d\u00edgito.\n6. **A peneira \u00e9 camada a mais, n\u00e3o substituta.** A regra do prompt do print e o aviso na tela continuam.\n\n## Consequ\u00eancias\n\n- Perde contexto, nunca vaza pessoa. A regra de desenho do `pseudonimizar` l\u00ea duas palavras capitalizadas seguidas como nome, e nomes de tela e de fornecedor saem como `[NOME]` (\"Painel de Reuni\u00f5es\", \"Assistente de Tecnologia\", \"Global Health\"). Sigla com tr\u00eas letras e quatro d\u00edgitos tem o desenho de placa e sai `[PLACA]` (`RFC7231`, `ISO8601`). No corpo, a barra do marcador aparece dentro de bloco de c\u00f3digo e no \"O que muda\" do card, que o Markdown n\u00e3o l\u00ea. Vers\u00e3o, c\u00f3digo de erro, porta, stack trace, identificador e n\u00famero de issue saem intactos.\n- O `@login` do GitHub digitado \u00e0 m\u00e3o pela Vitta numa resposta sai `[REDE_SOCIAL]`: a peneira n\u00e3o distingue login de perfil de paciente. Quem quer chamar algu\u00e9m usa a men\u00e7\u00e3o do app.\n- Nome fora da base de nomes, em min\u00fasculas e sem pista, atravessa: \u00e9 o limite conhecido do m\u00f3dulo, documentado no pr\u00f3prio `pseudonimizar`. Por isso o prompt e o aviso continuam de p\u00e9.\n\nRejeitado:\n\n- **Confirma\u00e7\u00e3o no bot\u00e3o, ou o print sair s\u00f3 como link.** As op\u00e7\u00f5es (b) e (c) da issue #772 pediam migration e mudavam o fluxo; a peneira fecha o vazamento sem isso.\n- **Peneirar s\u00f3 quando a descri\u00e7\u00e3o veio de print.** N\u00e3o h\u00e1 como saber a origem sem migration, e o texto digitado vaza igual.\n- **Afrouxar o `pseudonimizar` para o texto t\u00e9cnico.** Mudaria o comportamento da Ouvidoria, que manda o mesmo texto para uma IA externa.", "cita": [], "decisao": "Decis\u00e3o do diretor na triagem da issue #772 (27/set/2026). Estende ao dado de paciente a regra que a review do PR #688 fixou para o nome de quem pede: \"nome civil nenhum sai daqui\". O reposit\u00f3rio das issues \u00e9 p\u00fablico.", "emenda": [54], "emendada_por": [], "file": "docs/adr/0060-texto-que-sai-para-a-issue-publica-passa-pela-peneira-de-dado-pessoal.md", "number": 60, "slug": "0060-texto-que-sai-para-a-issue-publica-passa-pela-peneira-de-dado-pessoal", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Texto que sai para a issue p\u00fablica passa pela peneira de dado pessoal"}, {"amended_by": "0062, 0063, 0064", "amends": "0022, 0035", "body_md": "Decis\u00e3o do Pedro (01/out/2026, grilling na volta das f\u00e9rias). Entre 16 e 29/09 dois s\u00f3cios trabalharam no reposit\u00f3rio sem o Pedro, cada um pelo pr\u00f3prio clone, e a regra escrita n\u00e3o dizia quem sobe o que para produ\u00e7\u00e3o. Um mergeou e deployou 44 PRs sozinho; o outro parou com 4 PRs verdes esperando, um deles com migration e webhook p\u00fablico. A `main` n\u00e3o tinha prote\u00e7\u00e3o. E existiam dois pipelines para a mesma coisa: a `/onda` + `/ship` originais (ADRs 0022, 0029, 0035) e a `/onda-enxuta` (PR #879), que entrou \"sem mudar as originais\". Esta ADR fixa um caminho s\u00f3 e diz quem \u00e9 dono de qu\u00ea.\n\n## Contexto\n\nFatos que pesaram:\n\n- O `dev.md` dizia \"self-approval \u00e9 OK, cada um aprova o pr\u00f3prio PR\", mas nada travava o push direto na `main`, e a regra n\u00e3o dizia que migration de produ\u00e7\u00e3o e `APP_VERSION` s\u00e3o de quem mergeia. Na pr\u00e1tica, quem tinha o h\u00e1bito subiu; quem n\u00e3o tinha, esperou.\n- O `/ship` original faz o bump de vers\u00e3o **dentro do PR**. Com uma pessoa, isso funcionava. Com dois PRs verdes ao mesmo tempo \u00e9 colis\u00e3o garantida (bump fantasma, pilha de PRs sem CI, corrida de vers\u00e3o), j\u00e1 registrada nas notas do `history.json`.\n- A `/onda-enxuta` tirou o bump do PR (`/ship --no-bump`) e concentrou merge, bump, `APP_VERSION` no Coolify, um push, um build, health com confer\u00eancia de vers\u00e3o e registro num script s\u00f3, o `fechar_onda.py`, rodado contra a `main`. Subiu 14 vers\u00f5es em produ\u00e7\u00e3o nas f\u00e9rias (v0.143 a v0.156.6) sem incidente.\n- O `issue-tracker.md` dizia que \"o claim e o paralelismo acontecem nas fatias, n\u00e3o no PRD\": o PRD n\u00e3o tinha dono. Resultado: a fila `ready-for-agent` \u00e9 de quem chegar primeiro, e n\u00e3o h\u00e1 como ver quem est\u00e1 puxando o qu\u00ea.\n- O `tools/workflow-dashboard/` j\u00e1 l\u00ea issues, PRs e deploys pelo `gh` e \u00e9 a \u00fanica exce\u00e7\u00e3o permitida de \"painel\" no reposit\u00f3rio (`CLAUDE.md`): \u00e9 local, somente leitura, e cada s\u00f3cio roda o seu.\n- A ADR 0054 fixou que o GitHub \u00e9 a \u00fanica fonte do estado do desenvolvimento e o app \u00e9 a porta do diretor. Vis\u00e3o de equipe dentro do app foi rejeitada neste grilling pela mesma raz\u00e3o: \u00e9 necessidade interna da Vitta, n\u00e3o do hospital.\n- Numera\u00e7\u00e3o de migration \u00e9 sequencial (`110_`, `111_`, `112_`) e citada por n\u00famero em ADRs, PRs e no `history.json`. Dois PRs nascem com o mesmo n\u00famero, cada um passa no CI contra a `main` do seu momento, e o segundo merge entra repetido.\n\n## Decis\u00f5es\n\n1. **Cada s\u00f3cio mergeia e sobe para produ\u00e7\u00e3o o pr\u00f3prio PR.** N\u00e3o h\u00e1 fila humana \u00fanica nem dono de PRD mergeando fatia alheia. Quem mergeia aplica a migration em produ\u00e7\u00e3o (Studio) e cuida do `APP_VERSION`, e por isso todo s\u00f3cio precisa de acesso ao Studio e ao Coolify. Rejeitado: s\u00f3 o Pedro mergeia (foi o gargalo das f\u00e9rias); dono do PRD mergeia as fatias dos outros (recria o gargalo por PRD).\n\n2. **Um pipeline s\u00f3, no molde enxuto.** O `/ship` para no PR verde (3 gates, sem bump). O \u00fanico rabo de merge, bump, `APP_VERSION`, push, build, health e registro (`state.json`, `history.json`, `CHANGELOG`, snapshot) \u00e9 o `fechar_onda.py`, tanto para um PR avulso quanto para o lote de uma onda. A `/onda` original (ADR 0022) se aposenta; a `/onda-enxuta` passa a ser **a** onda, e os invariantes da 0022, 0029 e 0035 (subir \u00e9 decis\u00e3o humana por lote citando os PR#, PR verde \u00e9 CI + spec\u00d7diff + revisor independente, baixa em 3 tentativas, estado no GitHub) continuam valendo nela. O bump acontece **na hora do merge, na `main`**, nunca no PR. Rejeitado: dois pipelines com uma regra de merge (duas formas de chegar ao mesmo lugar para quem clona); deixar como est\u00e1 (\u00e9 a aus\u00eancia de defini\u00e7\u00e3o que produziu as f\u00e9rias).\n\n3. **`main` protegida, sem aprova\u00e7\u00e3o humana.** Ruleset do GitHub na `main`: PR obrigat\u00f3rio, CI (`ci.yml`) obrigat\u00f3rio e atualizado com a base, force push e delete bloqueados, regra valendo para admin. Zero aprova\u00e7\u00f5es exigidas: os gates continuam sendo o CI e os revisores agentes (revisor e revisor de seguran\u00e7a). Rejeitado: uma aprova\u00e7\u00e3o de outro s\u00f3cio em caminho sens\u00edvel (reintroduz a espera exatamente nos PRs mais demorados; volta a valer se entrar quarto s\u00f3cio ou dev externo).\n\n4. **Dono do PRD.** Todo PRD nasce com um assignee, quem fez o grilling, posto pelo `/to-prd`. Uma fatia sem claim pertence, para efeito de vis\u00e3o, ao dono do PRD; o claim de quem a pega \u00e9 que muda o dono de fato. Pegar fatia de PRD alheio n\u00e3o \u00e9 proibido, mas se combina antes com o dono. Issue avulsa (sem PRD) tem como dono quem a pegou, e s\u00f3.\n\n5. **Vis\u00e3o por respons\u00e1vel no painel local, n\u00e3o no app.** A aba Issues do `tools/workflow-dashboard/` ganha o modo **agrupar por respons\u00e1vel**, ligado por padr\u00e3o, para abertas, fechadas e todas: um grupo por pessoa mais \"sem respons\u00e1vel\". Dentro do grupo, em andamento primeiro (com estado do PR: CI, merge\u00e1vel, h\u00e1 quantos dias espera), depois planejadas; nas fechadas, a vers\u00e3o em que subiu. Sem aba nova, sem m\u00e9trica por pessoa (lead time, volume): compara gente, n\u00e3o separa trabalho. Rejeitado: tela na aba Tecnologia do app atr\u00e1s de `github_login` (c\u00f3digo em produ\u00e7\u00e3o para necessidade interna, e a ADR 0054 reserva o app ao diretor); GitHub Projects (terceira tela que ningu\u00e9m abre).\n\n6. **Guarda de migration em dois tempos.** No CI: o PR falha se o n\u00famero da migration que ele adiciona j\u00e1 existe na `main`. No `fechar_onda.py`: antes do merge, a confer\u00eancia se repete contra a `main` **atual**, e o script para com mensagem clara se colidiu; renumerar \u00e9 do autor. Lockfile e arquivos de costura (`main.py`, `config.py`, `AdminSidebar.tsx`) ficam com o `git`: conflito real aparece no `mergeStateStatus` e a `/resolver-conflitos` resolve. Rejeitado: nome de migration com carimbo de data e hora (robusto, mas quebra o jeito de falar \"migration 110 aplicada no Studio\" que ADRs e `history.json` usam).\n\n7. **\u00c1rvore principal sempre na `main`.** Todo trabalho, inclusive doc e ADR, acontece em worktree. A \u00e1rvore principal de cada clone fica na `main` e s\u00f3 recebe `git pull`. \u00c9 o que impede o \"voltei e meu local est\u00e1 11 dias atr\u00e1s numa branch de issue com 4 worktrees \u00f3rf\u00e3os\".\n\n## Emenda \u00e0 ADR 0022\n\n- O comando `/onda` e a forma do loop (sess\u00e3o humana orquestrando, bump no PR, `/deploy ship` ao fim) deixam de ser o caminho. O que a 0022 fixou de **princ\u00edpio** (ondas de issues desbloqueadas, 2-3 em paralelo, 1 worktree por issue, um checkpoint humano de merge por lote, um deploy por onda, reabastecer e repetir) continua valendo e \u00e9 herdado pela `/onda-enxuta`.\n\n## Emenda \u00e0 ADR 0035\n\n- Os gates de review continuam pertencendo ao orquestrador, como agentes frescos e independentes que comentam o veredito no PR. Na enxuta eles s\u00e3o o `hr-revisor` e o `hr-revisor-seguranca`, disparados assim que o PR abre, com no m\u00e1ximo 2 rodadas de corre\u00e7\u00e3o. Nada do racioc\u00ednio da 0035 muda; muda s\u00f3 o nome dos agentes.\n\n## Consequ\u00eancias\n\n- Nasce um PRD com as fatias: ruleset da `main`; `/to-prd` p\u00f5e o dono; painel com agrupar por respons\u00e1vel; `/ship` sem bump e `fechar_onda.py` como rabo \u00fanico do PR avulso; guarda de migration no CI e no script; aposentadoria da `/onda` e da `/montar-ondas`; `/ask-pedro`, `CLAUDE.md`, `dev.md` e `issue-tracker.md` apontando para o caminho \u00fanico (o `/ask-pedro` muda no mesmo commit que mexe nas skills, regra do `CLAUDE.md`).\n- `dev.md` e `issue-tracker.md` j\u00e1 foram emendados em prosa com as regras de gente (decis\u00f5es 1, 4 e 7), que valem desde j\u00e1. O que depende de c\u00f3digo (decis\u00f5es 2, 3, 5 e 6) vale quando a fatia correspondente entrar.\n- Promover algu\u00e9m a colaborador `write` passa a significar: pode mergear e deployar o que fez, e precisa de Studio e Coolify.\n- `CONTEXT.md` n\u00e3o muda: \u00e9 gloss\u00e1rio do hospital, n\u00e3o do time.\n\n## Emenda de 02/10/2026: o rabo com a `main` protegida (issue #910)\n\nA decis\u00e3o 3 deixou em aberto como o `fechar_onda.py`, que mergeava localmente e dava um push direto na `main` com o bookkeeping junto, convive com um ruleset que exige pull request. Havia duas sa\u00eddas: (a) tudo entra por PR e o merge sai pela API do GitHub; (b) ruleset com bypass para um ator de deploy, e o script segue como estava.\n\n**Decis\u00e3o: sa\u00edda (a).** O bypass da (b) recria a depend\u00eancia de uma pessoa, porque quem roda o rabo precisa ser o ator com bypass, e a forma sem pessoa (uma GitHub App pr\u00f3pria) est\u00e1 fora do escopo do PRD #902. Com a (a), a regra vale para todos, admin inclusive, sem exce\u00e7\u00e3o. Rejeitado: (b), pelo mesmo motivo que a decis\u00e3o 1 rejeitou \"s\u00f3 o Pedro mergeia\".\n\nComo fica:\n\n- **PR avulso.** O bump entra como commit na pr\u00f3pria branch do PR. Se a `main` andou, ela vem antes, por merge, porque o ruleset exige a branch em dia com a base (emendado pela ADR 0064, decis\u00e3o 2: o ruleset deixou de exigir, e o PR entra no head com o CI verde, sem a `main` trazida). O script espera o CI desse head ficar verde, p\u00f5e o `APP_VERSION` no Coolify e mergeia pela API com squash, conferindo o `sha` do head. Squash porque \u00e9 o \u00fanico m\u00e9todo que o reposit\u00f3rio permite.\n- **Onda.** Os PRs do lote entram por merge local `--no-ff` numa branch `onda/<sessao>`, com o bump em cima, e o script abre um **PR de entrega** com `Closes` de cada issue do lote, mergeado pela API como o avulso. Continua um merge de c\u00f3digo na `main` e um build por onda; os PRs do lote fecham com coment\u00e1rio apontando o PR de entrega.\n- **Registro.** `history.json`, `state.json`, `CHANGELOG`, snapshot e draft do Manual sobem **depois do health**, num PR s\u00f3 de docs que o script abre e mergeia pela API. O registro deixa de nascer com o resultado presumido e passa a gravar o que aconteceu.\n- **Segundo build.** O merge do registro \u00e9 um push na `main`, e o webhook do Coolify rebuilda os apps sem olhar o caminho (issue #851). Enquanto o Coolify n\u00e3o filtra caminho, o script cancela o deploy do commit do registro, e s\u00f3 dele.\n- **CI que sempre reporta.** O `ci.yml` deixou de ter `paths-ignore` no `pull_request`: workflow pulado por filtro de caminho n\u00e3o reporta check, e o ruleset deixaria todo PR s\u00f3 de docs (o registro, ADR, skill) esperando para sempre. Um job `mudancas` decide se o PR mexe fora de `docs/`, `.claude/` e Markdown; os tr\u00eas jobs obrigat\u00f3rios pulam por `if` (job pulado conta como verde) e rodam se o detector falhar.\n- **Ruleset versionado** em `.github/rulesets/main.json`: PR obrigat\u00f3rio com zero aprova\u00e7\u00f5es, os tr\u00eas jobs do `ci.yml` obrigat\u00f3rios (vindos do GitHub Actions) e em dia com a base (emendado pela ADR 0064, decis\u00e3o 2: os checks valem no head do PR, sem exigir a branch em dia com a base), force push e delete bloqueados, sem bypass. Aplicar e conferir \u00e9 do admin, \u00e0 m\u00e3o, com os comandos do `docs/onboarding/dev.md`. O `tools/test_ruleset_main.py` amarra o nome de cada check ao job do `ci.yml`.\n\nCusto aceito: o commit de bump redispara o CI antes do merge (alguns minutos com o sem\u00e1foro preso), e uma rodada que encontra a `main` andando no meio do CI para com c\u00f3digo 2 e roda de novo, reaproveitando o bump que ficou na branch.\n\n## Emenda de 02/10/2026: filtro por respons\u00e1vel no painel (decis\u00e3o 5)\n\nO agrupar por respons\u00e1vel n\u00e3o mostrou quem cuida de qu\u00ea: a fatia sem claim aparecia no grupo do dono do PRD, e a lista ficava parecendo de gente que n\u00e3o estava trabalhando nela. O Pedro trocou a vis\u00e3o.\n\n**Decis\u00e3o:** a aba Issues do painel local filtra por **um** respons\u00e1vel de cada vez, em vez de agrupar. Respons\u00e1vel \u00e9 quem est\u00e1 designado na issue (assignee), sem herdar o dono do PRD; \"sem respons\u00e1vel\" mostra as issues sem ningu\u00e9m designado. Com o filtro ligado, um visor abaixo dos cards gerais mostra as contas da pessoa: abertas (e quantas em andamento), entregues (e quantas nos \u00faltimos 30 dias), lead time m\u00e9dio e prontas para agente. O coletor passa a trazer todas as issues e PRs, sem o teto de 200.\n\nRevoga, na decis\u00e3o 5, o agrupamento ligado por padr\u00e3o, a heran\u00e7a do dono do PRD **na vis\u00e3o do painel** e o \"sem m\u00e9trica por pessoa\": o Pedro quer ver quanto cada um entregou. O dono do PRD continua valendo como responsabilidade (decis\u00e3o 2 e `issue-tracker.md`); s\u00f3 deixa de redistribuir as fatias no painel.\n\n## Emenda de 05/10/2026: respons\u00e1vel cai em quem criou (decis\u00e3o 5)\n\n> **Revogada** pela emenda de 06/10/2026 da ADR 0062 (issue #942): no painel, respons\u00e1vel \u00e9 s\u00f3 quem est\u00e1 designado; sem assignee, a issue \u00e9 \"ningu\u00e9m assumiu\", e o autor fica no card s\u00f3 como informa\u00e7\u00e3o. O texto abaixo \u00e9 hist\u00f3rico. **Restaurada no filtro de respons\u00e1vel** pela issue #1039: veja a nota no fim da emenda de 06/10/2026 da ADR 0062.\n\nCom o filtro da emenda de 02/10, 120 issues apareciam \"sem respons\u00e1vel\", 32 delas abertas, embora toda issue nas\u00e7a do Claude Code de algu\u00e9m. O Pedro quer que nenhuma issue fique sem dono no painel.\n\n**Decis\u00e3o:** no painel, respons\u00e1vel \u00e9 quem est\u00e1 designado (assignee) e, sem ningu\u00e9m designado, quem criou a issue (author do GitHub). Quem assumiu manda sobre quem criou. Para n\u00e3o repetir o problema da emenda de 02/10 (fatia sem claim parecendo trabalho de quem rodou o `/to-issues`), a origem fica vis\u00edvel: o cart\u00e3o mostra `\ud83d\udc64 fulano` para quem assumiu e `\u270e criada por fulano` para quem s\u00f3 criou, o visor da pessoa separa assumidas de s\u00f3 criadas, e o \"em andamento\" conta s\u00f3 issue com assignee. O \"sem respons\u00e1vel\" vira **\"ningu\u00e9m assumiu\"**: as issues sem assignee, a fila sem claim. O PRD sem assignee segue marcado \"sem dono\", agora com quem o criou ao lado.\n\nNada muda no GitHub: o assignee continua sendo o claim do protocolo paralelo (`issue-tracker.md`), e o painel n\u00e3o designa ningu\u00e9m. Limite conhecido: a issue aberta pela integra\u00e7\u00e3o do app (Demanda vira issue) tem como autor o dono do token, e conta apagada vem do `gh` como `ghost`.", "cita": [29, 54], "decisao": "Decis\u00e3o do Pedro (01/out/2026, grilling na volta das f\u00e9rias). Entre 16 e 29/09 dois s\u00f3cios trabalharam no reposit\u00f3rio sem o Pedro, cada um pelo pr\u00f3prio clone, e a regra escrita n\u00e3o dizia quem sobe o que para produ\u00e7\u00e3o. Um mergeou e deployou...", "emenda": [22, 35], "emendada_por": [62, 63, 64], "file": "docs/adr/0061-um-pipeline-dono-por-prd-e-main-protegida.md", "number": 61, "slug": "0061-um-pipeline-dono-por-prd-e-main-protegida", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Um pipeline s\u00f3, dono por PRD e `main` protegida: a esteira para tr\u00eas s\u00f3cios em paralelo"}, {"amended_by": "0064, 0065", "amends": "0022, 0057, 0061", "body_md": "Decis\u00e3o do Pedro (05/out/2026, grilling). O painel local `tools/workflow-dashboard/` cresceu em sete abas (Plano, Issues, Produ\u00e7\u00e3o, Pend\u00eancias, Mapa, Dom\u00ednio, Guia), com um m\u00f3dulo de 230 linhas calculando ondas, tempo t\u00edpico e caminho cr\u00edtico, cards de vaidade (total de issues, lead time m\u00e9dio) e um visor com lead time por pessoa que a ADR 0061 (decis\u00e3o 5) tinha rejeitado. Do outro lado, o `fechar_onda.py` gasta uma rodada inteira de PR por lote s\u00f3 para registrar: snapshot, draft do manual, `history.json`, `state.json` e `CHANGELOG.md`, empurrados numa branch, abertos em PR, esperando tr\u00eas checks e mergeados pela API. O snapshot ainda falha em modo parcial na m\u00e1quina do s\u00f3cio (sem venv, `DYLD`), e o CHANGELOG sai com travess\u00e3o no t\u00edtulo. Esta ADR d\u00e1 nome ao painel, fixa o que ele mostra e de onde l\u00ea, e tira do caminho cr\u00edtico do rabo tudo que n\u00e3o \u00e9 a verdade do deploy.\n\n## Decis\u00f5es\n\n1. **O painel se chama Hospital OS.** Na tela, no README, no `CLAUDE.md` e no `/ask-pedro`. O vocabul\u00e1rio dele (fase, funil, raia, tentativa) vive no README do painel; o `CONTEXT.md` segue gloss\u00e1rio do hospital (ADR 0061).\n\n2. **Uma fonte por aba.** Issues e PRs leem o GitHub ao vivo pelo `gh` (issues, sub-issues, bloqueios, PRs com checks, `mergeStateStatus`, reviews, timeline de eventos, branches remotas). Produ\u00e7\u00e3o l\u00ea `history.json` e `state.json` da `origin/main`. Mapa e Dom\u00ednio leem o clone. Nada no painel deriva de arquivo o que o GitHub j\u00e1 diz.\n\n3. **Cinco abas: Issues (home), PRs, Produ\u00e7\u00e3o, Mapa, Dom\u00ednio.** Plano sai: as ondas viram um desenho dentro do card de cada PRD aberto (colunas = ondas por depend\u00eancia, n\u00f3s = fatias na cor do respons\u00e1vel, setas = `blocked_by`, borda = fase); tempo t\u00edpico, caminho cr\u00edtico e comando copi\u00e1vel por fatia saem com o `plano.py`. Pend\u00eancias sai: vira o filtro `ready-for-human` da aba Issues, com o contador no chip. Guia sai: o conte\u00fado \u00e9 o `docs/onboarding/` e o README do painel.\n\n4. **R\u00e9gua de nove fases por issue, derivada s\u00f3 de fatos do GitHub:** Triagem (`needs-triage`, `needs-info`) \u00b7 Fila (`ready-for-agent`, sem assignee, sem bloqueio aberto) \u00b7 Bloqueada \u00b7 Em andamento (assignee + `in-progress`; sub-estado \"branch criada\" quando existe branch remota terminada em `-N` sem PR) \u00b7 PR aberto (com o sinal do PR: CI pendente, vermelho ou verde, revisor comentou, conflito, tentativa anterior se houve PR fechado sem merge) \u00b7 Mergeada (PR merged, sem vers\u00e3o no `history.json`) \u00b7 Em produ\u00e7\u00e3o (vers\u00e3o e data) \u00b7 Humana (`ready-for-human`) \u00b7 Encerrada sem PR. \"Clonada\" significa branch remota, fato que vale para qualquer s\u00f3cio; worktree \u00e9 local e n\u00e3o entra.\n\n5. **Aba Issues: funil de fases no topo, filtros em chips.** Os cards de topo (total, abertas, lead time m\u00e9dio, fila) saem; entra a faixa das nove fases com contagem, clic\u00e1vel. Filtros: estado, fase, respons\u00e1vel (chip na cor da pessoa, mais \"ningu\u00e9m assumiu\"), PRD, labels agrupadas por prefixo (`type:`, `area:`, `fatia:`), busca. Os `<select>` nativos saem (o popup \u00e9 pintado pelo sistema, fora do tema). Com respons\u00e1vel filtrado, o funil mostra as contagens dele e nada de lead time: a decis\u00e3o 5 da ADR 0061 volta a valer e o visor do PR #928 \u00e9 removido.\n\n6. **Card da issue compacto, linha do tempo sob demanda.** Fechado: fase, pessoa, idade, progresso dos crit\u00e9rios, PR e vers\u00e3o como chips. Expandido: a linha do tempo com data e hora (criada, designada, branch, PR aberto, CI vermelho n vezes, revisor comentou, PR fechado sem merge, novo PR, mergeado, vers\u00e3o em produ\u00e7\u00e3o). A timeline das abertas vem na coleta, em lote; a das fechadas s\u00f3 ao expandir, como os coment\u00e1rios.\n\n7. **Aba PRs: quadro por fase com raias por pessoa.** Colunas = fase do PR (aberto sem CI, CI vermelho, esperando revisor, verde esperando merge, mergeado sem deploy, em produ\u00e7\u00e3o); uma raia por s\u00f3cio, na cor fixa da pessoa; card = PR com issue, branch e h\u00e1 quantos dias est\u00e1 na coluna. Coluna cheia e card velho ganham destaque: o gargalo aparece sem m\u00e9trica. PRs fechados sem merge (tentativas) ficam numa faixa cinza, com data e issue. Filtros: pessoa, PRD, s\u00f3 abertos.\n\n8. **Navega\u00e7\u00e3o interna por URL.** Aba, item e filtros vivem no hash (`#issues/930`, `#prs/930`, `#producao/v0.161.0`, `#issues?resp=...&fase=...`). Chip de issue, PR ou vers\u00e3o abre o card certo na aba certa; o GitHub \u00e9 o link secund\u00e1rio `\u2197` em todo card. Produ\u00e7\u00e3o lista vers\u00f5es; cada vers\u00e3o expande PRs, issues, migration, health e build, e cada card de issue ou PR mostra a vers\u00e3o em que subiu como chip de volta.\n\n9. **O rabo grava s\u00f3 `history.json` e `state.json`.** \u00c9 a verdade que o GitHub n\u00e3o tem (health, dura\u00e7\u00e3o do build, migration aplicada, env, rollback). O PR de docs por lote continua, com dois JSONs e sem script rodando antes. `history.json` perde o teto de 50 (`HISTORY_MAX`) e guarda tudo. `CHANGELOG.md` \u00e9 apagado: a timeline \u00e9 render do `history.json` no Hospital OS, e `CLAUDE.md`, `/ask-pedro` e as skills param de cit\u00e1-lo. *Emendada pela ADR 0064 (decis\u00e3o 6b; issue #1000): o PR de docs sai. O rabo monta a entrada nova do `history.json` e o `state.json` e dispara a Action da decis\u00e3o 10 na `main` por `workflow_dispatch`, com os dois no input `registro`; ela os grava na `main` pela deploy key (ADR 0065), conferidos contra o input, no mesmo run do snapshot e do draft. O rabo espera a entrada no `history.json` da `main`.*\n\n10. **Snapshot
