ara sempre e as Pend\u00eancias nunca nasciam. Segundo, quem assinava cedo j\u00e1 tinha se comprometido com as a\u00e7\u00f5es dele, mas as Pend\u00eancias s\u00f3 apareciam dias depois, quando o \u00faltimo signat\u00e1rio (ou o deadline) fechava o documento.\n\n## Decis\u00f5es\n\n**1. Gatilho incremental por assinatura.** A Pend\u00eancia nasce assim que o compromisso do respons\u00e1vel se firma, sem esperar o estado terminal:\n\n- Signat\u00e1rio assina no ClickSign: nascem na hora todas as Pend\u00eancias cujo respons\u00e1vel \u00e9 ele. A Pend\u00eancia \u00e9 **plena** desde o primeiro segundo (painel, prazo correndo, cobran\u00e7a, pode virar ATRASADO), indistingu\u00edvel das demais.\n- O Facilitador da Reuni\u00e3o assina: nascem tamb\u00e9m as Pend\u00eancias de respons\u00e1veis que **n\u00e3o** s\u00e3o Signat\u00e1rios do Envelope (a assinatura de quem conduziu autoriza os demais). Se o Facilitador n\u00e3o estiver no Envelope, essas ficam para a finaliza\u00e7\u00e3o.\n- Documento finaliza: nasce todo o resto, e a Reuni\u00e3o vai a `ASSINADA`.\n\n**2. Deadline \u00e9 finaliza\u00e7\u00e3o, n\u00e3o morte.** Quando o prazo da ClickSign estoura, o documento fecha com as assinaturas que tiver. O sistema trata esse evento como fechamento normal: cria as Pend\u00eancias restantes, avan\u00e7a a Reuni\u00e3o para `ASSINADA` e registra quem n\u00e3o assinou. O banner terminal ganha um selo **discreto** \"N de M assinaram\" apenas quando houve faltantes ou Aceites internos; com 100% de assinaturas ClickSign, o visual atual permanece intacto. Nuance da doc oficial (evento `deadline`, comportamento default `deadline_partial_signature_action: closed`): a ClickSign s\u00f3 finaliza se houver **ao menos uma** assinatura; com zero assinaturas ela **cancela** o documento, e a\u00ed vale a decis\u00e3o 3 (modo de Aceite interno).\n\n**3. Recusa ou cancelamento abrem o modo de Aceite interno.** O Envelope morre de verdade e **n\u00e3o h\u00e1 reenvio ao ClickSign**. A Reuni\u00e3o permanece em `AGUARDANDO_ASSINATURA` num sub-modo interno (flag no banco, sem estado novo na m\u00e1quina):\n\n- As Pend\u00eancias j\u00e1 nascidas s\u00e3o mantidas; as a\u00e7\u00f5es correspondentes ficam travadas para edi\u00e7\u00e3o. S\u00f3 a\u00e7\u00f5es sem Pend\u00eancia seguem edit\u00e1veis.\n- Cada Signat\u00e1rio pendente com a\u00e7\u00f5es recebe email do pr\u00f3prio sistema com link p\u00fablico tokenizado para o **Aceite interno**: a p\u00e1gina mostra a ata completa e um bot\u00e3o \u00fanico \"Li e aceito\"; o aceite faz nascer todas as Pend\u00eancias dele de uma vez e conta como o \"assinou\" dele no desfecho. Signat\u00e1rio sem a\u00e7\u00e3o n\u00e3o recebe link e n\u00e3o trava nada.\n- O Super admin pode **registrar o aceite em nome de um signat\u00e1rio** pendente, por signat\u00e1rio, com registro em `audit_log` (quem for\u00e7ou, quando) e origem marcada.\n- Terminal: quando toda a\u00e7\u00e3o do quadro tem Pend\u00eancia nascida, a Reuni\u00e3o vira `ASSINADA` com o selo de assinaturas mistas.\n\n**4. Reconcilia\u00e7\u00e3o ativa.** Al\u00e9m de tratar o evento de deadline no webhook, um cron di\u00e1rio varre as Reuni\u00f5es em `AGUARDANDO_ASSINATURA` com Envelope e consulta a ClickSign: documento j\u00e1 fechado aplica o mesmo fluxo do webhook (idempotente). O card de Signat\u00e1rios ganha um \"Sincronizar\" manual como atalho. Isso resolve o passivo de atas j\u00e1 travadas e protege contra webhook perdido.\n\n**5. Persist\u00eancia do aceite por signat\u00e1rio.** Passa a existir registro por signat\u00e1rio com a origem do compromisso (`clicksign`, `aceite_interno`, `super_admin`) e timestamp. Hoje nada disso \u00e9 persistido: o status de assinatura \u00e9 consultado ao vivo na API, o que impede selo, desfecho e auditoria.\n\n**6. Idempot\u00eancia por a\u00e7\u00e3o.** `liberar_pendencias` ganha modo incremental: a guarda deixa de ser \"j\u00e1 existe alguma Pend\u00eancia desta Reuni\u00e3o\" e passa a ser por a\u00e7\u00e3o do quadro. A numera\u00e7\u00e3o `A###` precisa aguentar cria\u00e7\u00e3o concorrente (webhooks de assinatura chegam em paralelo).\n\n## Por que \u00e9 surpreendente\n\n- Pend\u00eancia agora nasce **antes** do estado terminal: quem l\u00ea o c\u00f3digo (ou o ADR 0003) esperando \"Pend\u00eancia implica Reuni\u00e3o encerrada\" quebra. `AGUARDANDO_ASSINATURA` passa a conviver com Pend\u00eancias plenas e ativas.\n- Recusa e cancelamento **n\u00e3o devolvem mais** a Reuni\u00e3o para `AGUARDANDO_VALIDACAO`. O retorno com ata edit\u00e1vel deixa de existir nesse caso; o caminho \u00e9 seguir em frente colhendo Aceites internos.\n- `ASSINADA` deixa de garantir \"todos assinaram digitalmente\": pode conter aceites internos, aceites for\u00e7ados e faltantes de deadline. A verdade fina vive no registro por signat\u00e1rio.\n\n## Alternativas descartadas\n\n- **Pend\u00eancia provis\u00f3ria at\u00e9 a finaliza\u00e7\u00e3o** (nasce marcada, prazo n\u00e3o corre): criaria um sub-estado novo na m\u00e1quina da Pend\u00eancia e a pergunta \"o que o Colaborador pode fazer com ela\". A assinatura do respons\u00e1vel j\u00e1 \u00e9 o compromisso; a Pend\u00eancia nasce plena.\n- **Criar as Pend\u00eancias de n\u00e3o-signat\u00e1rios na primeira assinatura de qualquer um**: o compromisso dos outros nasceria da assinatura de algu\u00e9m sem papel de condu\u00e7\u00e3o. O gatilho \u00e9 a assinatura do Facilitador; sem ela, finaliza\u00e7\u00e3o.\n- **Estado novo `ASSINATURA_INTERNA` na m\u00e1quina**: mais claro na leitura, por\u00e9m mexe em migration, tipos duplicados de StatusAta no frontend, calend\u00e1rio, filtros e relat\u00f3rios. A flag de sub-modo dentro de `AGUARDANDO_ASSINATURA` entrega o mesmo com menos superf\u00edcie.\n- **Terminal `APROVADA` para o caso misto**: esconderia que houve assinaturas digitais reais. `ASSINADA` com origem registrada por signat\u00e1rio preserva a auditoria.\n- **Cancelar as Pend\u00eancias nascidas quando o Envelope morre**: jogaria fora compromissos j\u00e1 firmados por quem assinou. Elas s\u00e3o mantidas, e a edi\u00e7\u00e3o da ata fica limitada \u00e0s a\u00e7\u00f5es ainda sem Pend\u00eancia.\n- **Permitir reenvio ao ClickSign ap\u00f3s recusa/cancelamento**: reabriria o risco de Envelopes duplicados e de Pend\u00eancias duplicadas entre envios. O caminho p\u00f3s-morte do Envelope \u00e9 interno.\n\n## Consequ\u00eancias\n\n- O ADR 0003 fica **amendado**: cai o invariante \"Pend\u00eancia nasce somente de estado terminal\". O caminho sem assinatura (`APROVADA`) permanece intacto: l\u00e1 as Pend\u00eancias continuam nascendo todas na aprova\u00e7\u00e3o.\n- O webhook passa a tratar os eventos de assinatura individual e de fechamento por deadline (hoje ignorados); o ramo que devolvia expira\u00e7\u00e3o para `AGUARDANDO_VALIDACAO` est\u00e1 errado e sai.\n- Tabela nova de aceites por signat\u00e1rio; `SignatariosCard` ganha a linha \"Pend\u00eancias criadas: X de Y\" (Y = a\u00e7\u00f5es do quadro) pelo polling existente.\n- Surge edi\u00e7\u00e3o **parcial** de ata em `AGUARDANDO_ASSINATURA` (modo interno, s\u00f3 a\u00e7\u00f5es sem Pend\u00eancia), coisa que hoje n\u00e3o existe em nenhum estado p\u00f3s-valida\u00e7\u00e3o.\n- O gloss\u00e1rio ganha o termo **Aceite interno**; \"assinar\" continua reservado ao ClickSign.", "cita": [], "decisao": "O ADR 0003 fixou que Pend\u00eancia nasce de estado terminal (ASSINADA ou APROVADA). No caminho com ClickSign isso significava esperar o Envelope fechar com todas as assinaturas, e a pr\u00e1tica exp\u00f4s dois problemas. Primeiro, a ClickSign finaliza...", "emenda": [3], "emendada_por": [], "file": "docs/adr/0030-pendencia-nasce-por-assinatura-gatilho-incremental.md", "number": 30, "slug": "0030-pendencia-nasce-por-assinatura-gatilho-incremental", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Pend\u00eancia nasce por assinatura: gatilho incremental e Aceite interno"}, {"amended_by": "0032", "amends": null, "body_md": "Decis\u00e3o do Pedro (14/ago/2026, grilling conduzido no repo da Ana, ADR-0015 de l\u00e1): o Hospital Reuni\u00f5es vira a casa dos dados que alimentam a **Ana**, a agente de IA de atendimento via WhatsApp do mesmo hospital (produto irm\u00e3o, repo `~/PedroDev/Ana`). As 5 tabelas que hoje vivem num NocoDB na mesma VPS migram para o Postgres deste app; o app ganha um m\u00f3dulo de edi\u00e7\u00e3o na \u00e1rea admin, um painel de ouvidoria e uma API de servi\u00e7o para a Ana; o NocoDB se aposenta.\n\n## Contexto\n\n- A Ana l\u00ea 4 tabelas de refer\u00eancia (pre\u00e7os de consultas particulares, exames, estimativas de cirurgias, conv\u00eanios por especialidade) e escreve 1 tabela operacional (protocolos de ouvidoria) num NocoDB no Coolify desta mesma VPS. O hospital n\u00e3o visita o NocoDB; quem loga todo dia \u00e9 neste app.\n- A API deste app s\u00f3 autentica usu\u00e1rio logado (JWT do Supabase Auth); n\u00e3o existe caminho m\u00e1quina-a-m\u00e1quina. As regras de neg\u00f3cio vivem no Python (ADR 0002), ent\u00e3o escrita externa direta no banco furaria invariantes.\n- As vari\u00e1veis `ANA_READONLY_*` do `.env` (usu\u00e1rio Postgres read-only provisionado para a Ana, nunca usado por c\u00f3digo) ficam obsoletas: o caminho decidido \u00e9 API, n\u00e3o banco direto.\n- Pesquisa em fonte prim\u00e1ria (14/ago/2026, docs e c\u00f3digo do NocoDB) descartou mant\u00ea-lo no meio: webhooks sem retry, escrita externa n\u00e3o dispara webhook, data source externo com sync manual de schema.\n\n## Decis\u00f5es\n\n1. **Cinco tabelas novas no Postgres**, com as colunas equivalentes \u00e0s atuais (sem remodelagem nesta passada): consultas particulares, exames, estimativas de cirurgias, conv\u00eanios por especialidade e protocolos de ouvidoria.\n2. **M\u00f3dulo \"Dados do Atendimento\" na \u00e1rea admin**: super admins e secret\u00e1rias editam as tabelas de valores; facilitadores enxergam em leitura. Edi\u00e7\u00e3o vale imediatamente para a Ana (leitura direta, sem cache).\n3. **Painel de ouvidoria**: facilitadores e secret\u00e1rias veem os protocolos (categoria, setor, resumo, prazo) e mudam o status (aberto/respondido). Invariante herdada: **\u00edndice, n\u00e3o dossi\u00ea**. Nenhum dado pessoal do manifestante entra neste app; nome, CPF e relato vivem na conversa do Chatwoot da Ana, ligados pelo campo `conversa_id`.\n4. **API de servi\u00e7o `/api/ana/*`**: endpoints de leitura das 4 tabelas de valores, POST de registro de protocolo e GET de consulta de protocolo, autenticados por **API key de servi\u00e7o** dedicada (header), fora do fluxo JWT. A chave vive no vault da plataforma da Ana; escopo restrito a esses endpoints.\n5. **Protocolo de ouvidoria**: formato `ANO-NNNN`, gerado pelo banco (sequence), nunca pela aplica\u00e7\u00e3o cliente nem por IA. A migra\u00e7\u00e3o importa os protocolos existentes e a sequence continua do \u00faltimo n\u00famero usado: n\u00fameros j\u00e1 informados a pacientes seguem consult\u00e1veis. O NNNN \u00e9 cont\u00ednuo, n\u00e3o reinicia por ano.\n6. **Fases**: fase 1 entrega valores (tabelas, CRUD admin, GETs); fase 2 entrega ouvidoria (migra\u00e7\u00e3o com continuidade, POST/GET, painel). O NocoDB s\u00f3 desliga ap\u00f3s a fase 2 validada do lado da Ana.\n7. **Defesa contra escrita vazia**: nos endpoints de escrita, campos cr\u00edticos s\u00e3o NOT NULL no banco e validados na API (a plataforma da Ana tem falha silenciosa conhecida de interpola\u00e7\u00e3o que grava vazio com HTTP 200; o banco deve recusar).\n\n## Considered options\n\n- **Expor o Postgres \u00e0 Ana (usu\u00e1rio read-only j\u00e1 provisionado):** rejeitado. Furaria as regras que vivem no Python e acoplaria o produto irm\u00e3o ao schema interno.\n- **Manter o NocoDB como camada de edi\u00e7\u00e3o sobre este Postgres:** rejeitado pela pesquisa citada (sync manual, webhooks sem garantia); dois sistemas para sempre.\n- **Usu\u00e1rio t\u00e9cnico no Supabase Auth para a Ana:** rejeitado; o executor HTTP da plataforma da Ana n\u00e3o renova JWT.\n- **Leitura p\u00fablica sem auth (como as shared views atuais):** rejeitado; endpoints an\u00f4nimos na API de produ\u00e7\u00e3o por economia de um header n\u00e3o compensa.\n\n## Consequences\n\n- Primeira integra\u00e7\u00e3o de servi\u00e7o do app com outro sistema: nasce o conceito de API key de servi\u00e7o ao lado do JWT (uma depend\u00eancia de auth nova, pequena e isolada).\n- O app passa a guardar dado operacional de ouvidoria (anonimizado). O painel d\u00e1 \u00e0 diretoria visibilidade que o NocoDB nunca deu.\n- A disponibilidade da API deste app passa a afetar as respostas da Ana sobre pre\u00e7os e o registro de protocolos: o comportamento de indisponibilidade do lado dela j\u00e1 existe (Regra H\u00edbrida, sem n\u00famero inventado).\n- O detalhamento de produto (hist\u00f3rias, crit\u00e9rios) vive no PRD desta feature no GitHub; o lado Ana (troca de URLs das tools, credencial, desligamento do NocoDB) vive no repo da Ana (ADR-0015 e proposta P9 de l\u00e1).", "cita": [2], "decisao": "Decis\u00e3o do Pedro (14/ago/2026, grilling conduzido no repo da Ana, ADR-0015 de l\u00e1): o Hospital Reuni\u00f5es vira a casa dos dados que alimentam a **Ana**, a agente de IA de atendimento via WhatsApp do mesmo hospital (produto irm\u00e3o, repo...", "emenda": [], "emendada_por": [32], "file": "docs/adr/0031-dados-do-atendimento-ana-migram-para-o-app.md", "number": 31, "slug": "0031-dados-do-atendimento-ana-migram-para-o-app", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Dados do atendimento da Ana migram para o app: m\u00f3dulo admin, painel de ouvidoria e API de servi\u00e7o"}, {"amended_by": "0038", "amends": "0031", "body_md": "O ADR 0031 criou a API da Ana devolvendo cada tabela inteira, com todos os campos. A plataforma que hospeda a Ana (fazer.ai agents) corta o corpo de **toda** resposta de HTTP tool em **4.000 caracteres** antes de entregar ao modelo: limite fixo no runtime dela (`maxResponseChars` em `src/graph/tools/http.ts`), sem env nem configura\u00e7\u00e3o. O que passa do teto o modelo n\u00e3o l\u00ea, e o corte \u00e9 mudo: a Ana afirma que o item n\u00e3o existe, ou repete a chamada em loop.\n\nA medi\u00e7\u00e3o de 18/ago/2026 contra a produ\u00e7\u00e3o mostrou o tamanho do problema: exames 7.698 chars, conv\u00eanios 4.970, consultas 5.008, cirurgias 3.347 (\u00fanica que cabe, com 1.089 chars por linha, ou seja, a 4\u00aa cirurgia cadastrada estoura). Na pr\u00e1tica a Ana j\u00e1 n\u00e3o enxergava Pediatria nem Urologia, e desativar a Dermatologia no admin encolhia a resposta e fazia a Pediatria reaparecer: hoje editar um item muda quais **outros** itens a agente consegue ver.\n\nO teto \u00e9 do cliente, n\u00e3o deste app, e nenhum acordo verbal o segura. Ele vira, ent\u00e3o, uma regra do servidor.\n\n## Decis\u00f5es\n\n**1. Filtro por termo em cada GET de tabela.** `?especialidade=` (consultas), `?exame=` (exames), `?procedimento=` (cirurgias), `?convenio=` e `?especialidade=` combin\u00e1veis (conv\u00eanios). Par\u00e2metro **ausente ou string vazia significa sem filtro**: o cliente interpola vari\u00e1vel n\u00e3o preenchida como string vazia, em sil\u00eancio, e a API n\u00e3o pode ler isso como busca por vazio.\n\n**2. Compara\u00e7\u00e3o normalizada.** O termo casa ignorando caixa, acento e pontua\u00e7\u00e3o, e exige que todas as palavras dele apare\u00e7am no nome do registro (`obstetricia` acha \"Obstetr\u00edcia\"; `raio x` acha \"Raio-X (RX)\"). O filtro roda na aplica\u00e7\u00e3o, sobre as linhas j\u00e1 lidas (3 a 20 por tabela), sem extens\u00e3o nova no Postgres.\n\n**3. Tr\u00eas degraus de resposta, escolhidos pelo tamanho.** O endpoint monta a resposta **completa**; se ela passar de **3.500 caracteres** (o teto de 4.000 com folga), cai para o **resumo** (nome e valor de vitrine); se ainda passar, cai para o **\u00edndice** (s\u00f3 os nomes). O degrau \u00e9 sempre decidido no servidor, com ou sem filtro: nenhuma resposta da API da Ana sai maior que 3.500 caracteres.\n\n**4. Item nunca some.** A degrada\u00e7\u00e3o tira campo, jamais linha. Cortar a lista \u00e9 exatamente o defeito que esta decis\u00e3o existe para matar.\n\n**5. O degrau \u00e9 declarado no corpo.** Toda resposta traz `modo` (`completo`, `resumo` ou `indice`) e `dica`, a frase que ensina o gesto seguinte (\"chame de novo com `?exame=NOME` para os detalhes\"). Sem isso o modelo l\u00ea campo ausente como dado inexistente e responde errado.\n\n**6. O aviso obrigat\u00f3rio n\u00e3o se perde no resumo.** As cirurgias carregam `caveat_obrigatorio_ana`, que a Ana precisa dizer junto do valor. No resumo ele sai da linha e entra uma vez no envelope, com o texto vindo do banco (\u00e9 conte\u00fado edit\u00e1vel pelas secret\u00e1rias, n\u00e3o literal no c\u00f3digo).\n\n**7. Filtro sem resultado devolve 200 com lista vazia e `disponiveis`**, os nomes que existem, sem valor. O modelo v\u00ea que n\u00e3o achou, v\u00ea o nome certo e reencaminha, em vez de insistir na mesma chamada. Sem pre\u00e7o junto, n\u00e3o h\u00e1 como confundir a lista com resultado.\n\n**8. A regra vale para todo endpoint futuro de `/api/ana/*`** que devolva lista, e \u00e9 provada por teste com a tabela inflada a 3x o volume de hoje, n\u00e3o s\u00f3 com os dados atuais.\n\n## Considered options\n\n- **S\u00f3 o filtro, sem regra de tamanho:** rejeitado pela medi\u00e7\u00e3o. Termo curto casa quase tudo (`?exame=a` devolve 9 exames, 6.878 chars) e o estouro volta em sil\u00eancio.\n- **Pagina\u00e7\u00e3o (`?limite=`, `?pagina=`):** rejeitado. Transfere ao modelo a responsabilidade de saber que existe p\u00e1gina 2, e a falha \u00e9 a mesma de hoje: ele conclui a partir do que veio.\n- **Cortar a lista no servidor at\u00e9 caber:** rejeitado pela decis\u00e3o 4. Seria reproduzir o corte da plataforma com outro nome.\n- **Pedir limite configur\u00e1vel \u00e0 plataforma:** j\u00e1 registrado do lado da Ana como report ao fornecedor, mas n\u00e3o \u00e9 depend\u00eancia: a corre\u00e7\u00e3o n\u00e3o pode esperar terceiro.\n- **Resumo s\u00f3 quando n\u00e3o houver filtro, sem degrau no meio:** rejeitado. Conv\u00eanios com 46 linhas (6 conv\u00eanios por 8 especialidades, tamanho plaus\u00edvel j\u00e1 em 2026) passa de 3.500 mesmo resumido, e sem o terceiro degrau a resposta estouraria.\n\n## Consequ\u00eancias\n\n- A forma da resposta passa a depender do volume dos dados: a mesma chamada devolve `completo` hoje e `resumo` depois de o hospital cadastrar mais linhas. \u00c9 intencional, e por isso o `modo` \u00e9 expl\u00edcito no corpo.\n- Um registro sozinho maior que 3.500 caracteres cairia para resumo mesmo filtrado, e a\u00ed o detalhe pedido n\u00e3o chega. N\u00e3o acontece hoje (maior registro: 1.181 chars, uma cirurgia); se acontecer, o caminho \u00e9 encurtar o texto no admin, n\u00e3o subir o teto.\n- O consumidor precisa acompanhar: do lado da Ana, cada tool ganha o campo opcional de filtro no `input_schema` e uma linha na descri\u00e7\u00e3o. Enquanto isso n\u00e3o \u00e9 feito, a Ana enxerga a tabela inteira em vitrine (nome e valor), o que \u00e9 melhor que a cegueira atual.\n- O teto de 4.000 \u00e9 fato externo e pode mudar quando a plataforma da Ana mudar. Ele vive numa constante \u00fanica, comentada com a origem, e \u00e9 o \u00fanico ponto a ajustar.", "cita": [], "decisao": "O ADR 0031 criou a API da Ana devolvendo cada tabela inteira, com todos os campos. A plataforma que hospeda a Ana (fazer.ai agents) corta o corpo de **toda** resposta de HTTP tool em **4.000 caracteres** antes de entregar ao modelo: limite...", "emenda": [31], "emendada_por": [38], "file": "docs/adr/0032-resposta-da-api-da-ana-cabe-no-teto-do-cliente.md", "number": 32, "slug": "0032-resposta-da-api-da-ana-cabe-no-teto-do-cliente", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A resposta da API da Ana \u00e9 dimensionada pelo teto de leitura do cliente"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do diretor (20/ago/2026, grilling): o campo `participantes.role` (`diretor`, `gerente`, `coordenador`, `presidente`) \u00e9 uma etiqueta interna de administra\u00e7\u00e3o. Ele nunca \u00e9 exibido ao pr\u00f3prio Facilitador; s\u00f3 o Super admin o v\u00ea, no painel de usu\u00e1rios.\n\n## Contexto\n\n- Um profissional da ouvidoria foi cadastrado como Facilitador. O formul\u00e1rio de cadastro for\u00e7a a escolha de um role e o default \u00e9 `coordenador`; nenhum valor do enum descreve a fun\u00e7\u00e3o dele.\n- A p\u00e1gina \"Meu Perfil\" exibia um badge com o role. Um Facilitador que n\u00e3o \u00e9 coordenador de fato veria \"Coordenador\" na pr\u00f3pria tela, poderia fotografar e usar como ind\u00edcio de desvio de fun\u00e7\u00e3o num processo trabalhista. O risco \u00e9 jur\u00eddico, n\u00e3o t\u00e9cnico.\n- O role tem poder de permiss\u00e3o quase nulo: a permiss\u00e3o real vive em `access_profile` (Reuni\u00f5es) e `perfil_pop` (POPs). O role \u00e9 lido em `require_role` em 7 pontos: invite (`auth.py:24`), soft delete (`participantes.py:289`), uma rota de reuni\u00f5es (`reunioes.py:861`) e 4 rotas legadas de admin (`admin/legacy.py`, todas exigem `diretor`); h\u00e1 ainda uma policy RLS que o backend bypassa (service_role). O valor `coordenador` s\u00f3 \u00e9 aceito explicitamente no invite; nos demais gates ele n\u00e3o d\u00e1 acesso a nada.\n- O role \u00e9 derivado do cargo por mapa hardcoded (`cargo_mapping.py`); o texto p\u00fablico de identifica\u00e7\u00e3o nas telas de reuni\u00e3o \u00e9 o **cargo**, texto livre que pode dizer \"Ouvidoria\" sem risco.\n\n## Decis\u00f5es\n\n1. **O badge de role sai da p\u00e1gina \"Meu Perfil\" para todos os Facilitadores.** O cargo continua exibido e \u00e9 o texto p\u00fablico de identifica\u00e7\u00e3o.\n2. **A coluna Role permanece no painel `/admin/usuarios`**, que j\u00e1 \u00e9 restrito a super admins. N\u00e3o h\u00e1 restri\u00e7\u00e3o adicional a um \u00fanico admin.\n3. **O contexto POPs fica inalterado.** O cabe\u00e7alho \"seu perfil: Coordenador\" reflete uma permiss\u00e3o real de elabora\u00e7\u00e3o. Aviso registrado: s\u00f3 conceder `perfil_pop = coordenador` a coordenadores de fato; conceder a outra pessoa recria o mesmo risco jur\u00eddico.\n4. **O campo `role` permanece no banco e no cadastro** como faixa hier\u00e1rquica interna, sem mudan\u00e7a de schema.\n\n## Considered options\n\n- **Criar um role novo (ex.: `ouvidoria`):** rejeitado. O role quase n\u00e3o controla nada; crescer o enum para cada fun\u00e7\u00e3o nova s\u00f3 espalha a etiqueta que se quer esconder.\n- **Apagar a coluna/enum `role`:** rejeitado. Ainda alimenta os 7 gates de `require_role` (invite, soft delete, reuni\u00f5es, rotas legadas de admin) e o mapa de cargos; a cirurgia \u00e9 maior que o problema.\n- **Esconder o badge s\u00f3 de quem \"n\u00e3o \u00e9 coordenador de verdade\":** rejeitado. O sistema n\u00e3o tem como saber isso; exigiria um campo novo para alimentar uma exce\u00e7\u00e3o.\n\n## Consequences\n\n- Nenhuma tela futura voltada ao pr\u00f3prio Facilitador deve exibir o role dele. Quem precisar mostrar \"quem \u00e9 a pessoa\" usa o **cargo**.\n- O painel admin segue sendo o \u00fanico lugar onde o role aparece, para o conjunto de super admins.", "cita": [], "decisao": "Decis\u00e3o do diretor (20/ago/2026, grilling): o campo `participantes.role` (`diretor`, `gerente`, `coordenador`, `presidente`) \u00e9 uma etiqueta interna de administra\u00e7\u00e3o. Ele nunca \u00e9 exibido ao pr\u00f3prio Facilitador; s\u00f3 o Super admin o v\u00ea, no...", "emenda": [], "emendada_por": [], "file": "docs/adr/0033-role-etiqueta-interna-invisivel-ao-usuario.md", "number": 33, "slug": "0033-role-etiqueta-interna-invisivel-ao-usuario", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Role \u00e9 etiqueta interna: o pr\u00f3prio usu\u00e1rio nunca v\u00ea o seu role"}, {"amended_by": "0036, 0047, 0048, 0088", "amends": null, "body_md": "> Emenda em prosa ao ADR 0031 (decis\u00e3o 3, \"\u00edndice, n\u00e3o dossi\u00ea\"). Sem ponteiro `amends` no frontmatter: o 0031 j\u00e1 est\u00e1 emendado pelo 0032 e o lint de ADR aceita um \u00fanico ponteiro por campo.\n\n\nDecis\u00e3o do Pedro (20/ago/2026, grilling a partir do \u00e1udio do diretor e da especifica\u00e7\u00e3o funcional dele, `Especificacao_Modulo_Ouvidoria.md` v1.0 de 19/ago): a ouvidoria deixa de ser um \u00edndice passivo e vira o **centralizador de manifesta\u00e7\u00f5es** do hospital. A manifesta\u00e7\u00e3o completa passa a viver neste app, tramita por setores com prazo por gravidade em calend\u00e1rio \u00fatil, e o sistema cobra sozinho com escalonamento progressivo. Este ADR emenda a decis\u00e3o 3 do ADR 0031 (invariante \"\u00edndice, n\u00e3o dossi\u00ea\"), que deixa de valer.\n\n## Contexto\n\n- O ouvidor hoje trabalha com papel, planilha manual e cobran\u00e7a por email \u00e0 m\u00e3o. Manifesta\u00e7\u00f5es chegam por muitos canais sem registro \u00fanico; h\u00e1 caso aberto 13 dias sem retorno.\n- A especifica\u00e7\u00e3o do diretor \u00e9 a **fonte funcional** (princ\u00edpios, regras RN-xx, prazos, pap\u00e9is). A adequa\u00e7\u00e3o t\u00e9cnica parte da stack existente: nomes de campo, formato de protocolo e mecanismos seguem o app, n\u00e3o a letra da spec.\n- O que j\u00e1 existe (ADR 0031, prod v0.58.1): tabela `ouvidoria_protocolos` com n\u00famero `ANO-NNNN` por sequence, API `/api/ana/ouvidoria/*`, painel `/ouvidoria`, e a Ana registrando protocolo em produ\u00e7\u00e3o. \u00c9 a funda\u00e7\u00e3o; nada disso se perde.\n- A Ana ainda n\u00e3o est\u00e1 no WhatsApp oficial (que segue no Kommo, com humanos); o canal vivo dela \u00e9 o Telegram de teste.\n\n## Decis\u00f5es\n\n1. **Dossi\u00ea no app** (emenda o ADR 0031, decis\u00e3o 3): a manifesta\u00e7\u00e3o completa (relato integral sem edi\u00e7\u00e3o, nome e contato do manifestante, anexos) \u00e9 gravada neste banco. Aceita manifesta\u00e7\u00e3o an\u00f4nima. Den\u00fancia e relato de conduta nascem com sigilo refor\u00e7ado.\n2. **Protocolo mant\u00e9m `ANO-NNNN`** cont\u00ednuo por sequence (ADR 0031, decis\u00e3o 5), rejeitando o formato `OUV-ANO-NNNNN` com rein\u00edcio anual da spec: n\u00fameros j\u00e1 foram comunicados a pacientes e reiniciar numera\u00e7\u00e3o \u00e9 proibido. Prefixo \"OUV-\" pode virar exibi\u00e7\u00e3o, nunca dado.\n3. **Valida\u00e7\u00e3o antes do despacho**: toda manifesta\u00e7\u00e3o nasce aguardando classifica\u00e7\u00e3o; s\u00f3 `ouvidor` ou `diretoria_executiva` valida e aciona a \u00e1rea; nenhum processo autom\u00e1tico despacha. O manifestante recebe o protocolo na hora do registro.\n4. **O link tokenizado \u00c9 o portal do setor**: o titular recebe email com link seguro, sem login, que abre a manifesta\u00e7\u00e3o e permite responder, anexar e pedir prorroga\u00e7\u00e3o, inclusive no celular. Mesmo padr\u00e3o do Aceite interno (ADR 0030). Login de `responsavel_setor` foi rejeitado nesta leva: a fun\u00e7\u00e3o da spec \u00e9 atendida sem gest\u00e3o de contas.\n5. **Setor ganha respons\u00e1veis nomeados**: titular e ao menos um substituto, com vig\u00eancia (`setor_responsavel`). Setor sem titular vigente n\u00e3o \u00e9 acion\u00e1vel: a demanda sobe ao gestor da \u00e1rea com alerta \u00e0 Diretoria. Conduta m\u00e9dica roteia ao coordenador da especialidade, nunca ao m\u00e9dico; queixa de call center vai direto \u00e0 Diretoria.\n6. **Prazo por gravidade, configur\u00e1vel, em calend\u00e1rio \u00fatil**: tabela de prazos em banco (edit\u00e1vel pela `diretoria_executiva`, com hist\u00f3rico), 4 n\u00edveis (cr\u00edtico, alto, m\u00e9dio, baixo), contagem em horas/dias \u00fateis com feriados administr\u00e1veis, e os 4 marcos de tempo (T0 entrada, T1 valida\u00e7\u00e3o, T2 resposta da \u00e1rea, T3 conclusiva), medindo ouvidoria e \u00e1rea separadamente. Prazo hardcoded foi rejeitado: a tabela do diretor ainda muda em 28/08.\n7. **Cobran\u00e7a com escalonamento progressivo**: v\u00e9spera avisa o titular; vencimento, titular + substituto; +24h, gestor da \u00e1rea; +48h, Diretoria Executiva. Cr\u00edtico notifica a Diretoria j\u00e1 na valida\u00e7\u00e3o. Emails via Resend, registrados e reenvi\u00e1veis. A vers\u00e3o simples (setor + c\u00f3pia ao ouvidor) foi substitu\u00edda pela cadeia da spec: o pr\u00f3prio diretor pediu para entrar no circuito.\n8. **Acesso**: nascem os perfis `ouvidor` e `diretoria_executiva`. Dossi\u00ea completo: s\u00f3 os dois. Sigilo refor\u00e7ado: s\u00f3 os dois, e o Super admin t\u00e9cnico fica **fora** (RN-40; precedente da \u00e1rea Controle, mais estreita que Super admin). Demais pap\u00e9is de Reuni\u00f5es veem apenas o \u00edndice. O setor recebe s\u00f3 o extrato necess\u00e1rio, sem identifica\u00e7\u00e3o quando sigiloso.\n9. **Canais da primeira leva**: registro manual pelo ouvidor (telefone, balc\u00e3o, email, com data retroativa e anexos) + **formul\u00e1rio p\u00fablico** sem login com rate limit e protocolo na tela. **QR code setorial** imprime URL pr\u00f3pria parametrizada (`/ouvidoria/qr?setor=X&ponto=Y`): hoje ela abre o formul\u00e1rio pr\u00e9-preenchido; quando a Ana entrar no WhatsApp oficial, o servidor passa a oferecer a conversa primeiro, sem reimprimir cartaz. Deep link direto do WhatsApp foi rejeitado enquanto l\u00e1 atende humano do Kommo. Instagram/Facebook/email/Google/Reclame Aqui: fases seguintes. _Nota de 15/09/2026:_ a entrada **manual** por WhatsApp (humano no Kommo), Instagram, Reclame Aqui e Google chegou antes da integra\u00e7\u00e3o, como quatro valores novos do canal de origem no registro do ouvidor; a integra\u00e7\u00e3o autom\u00e1tica desses canais segue como fase seguinte. Facebook e carta ficaram de fora por ningu\u00e9m ter pedido.\n10. **Sem IA de triagem pr\u00f3pria nesta leva**: entrada por formul\u00e1rio ou manual chega sem classifica\u00e7\u00e3o e o ouvidor classifica na valida\u00e7\u00e3o. A classifica\u00e7\u00e3o sugerida que j\u00e1 vem da Ana \u00e9 persistida \u00e0 parte (`classificacao_ia`) e nunca sobrescreve a validada.\n11. **O POST da Ana cresce**: campos opcionais de dossi\u00ea (nome, contato, relato integral, gravidade sugerida com confian\u00e7a) para n\u00e3o quebrar a Ana atual; depois o prompt dela (repo `~/PedroDev/Ana`) passa a preench\u00ea-los. Entregas casadas, uma por repo.\n12. **Fatiamento em 3 PRDs sequenciais**: (1) N\u00facleo + entrada: modelo, estados, registro manual, valida\u00e7\u00e3o, despacho por link, prazos configur\u00e1veis em calend\u00e1rio \u00fatil, notifica\u00e7\u00f5es b\u00e1sicas, formul\u00e1rio + QR, API da Ana adaptada; (2) Governan\u00e7a de prazo: prorroga\u00e7\u00e3o \u00fanica pr\u00e9-vencimento, devolu\u00e7\u00e3o por insufici\u00eancia com meio prazo, pausa aguardando manifestante, cadeia completa de escalonamento, emails com estratifica\u00e7\u00e3o de cor; (3) Intelig\u00eancia: relat\u00f3rios quinzenal/mensal autom\u00e1ticos, painel da Diretoria, reincid\u00eancia.\n\n## Considered options\n\n- **Manter \"\u00edndice, n\u00e3o dossi\u00ea\" e o setor ler no Chatwoot:** rejeitado. Setores n\u00e3o t\u00eam Chatwoot e a maioria dos canais n\u00e3o gera conversa l\u00e1.\n- **Login para respons\u00e1vel de setor (portal com conta):** rejeitado nesta leva; o link tokenizado entrega as mesmas fun\u00e7\u00f5es sem gest\u00e3o de senha. Revisita se o uso provar necessidade.\n- **Prazo fixo no c\u00f3digo, dias corridos:** rejeitado; contraria RN-21/22 e a tabela ainda em valida\u00e7\u00e3o.\n- **Super admin v\u00ea tudo:** rejeitado; RN-40 exige sigilo de den\u00fancia restrito a ouvidor e diretoria.\n- **Protocolo `OUV-` com rein\u00edcio anual:** rejeitado; quebraria continuidade j\u00e1 p\u00fablica (ADR 0031).\n- **Google Forms como paliativo:** desnecess\u00e1rio; a funda\u00e7\u00e3o j\u00e1 est\u00e1 em produ\u00e7\u00e3o.\n\n## Consequences\n\n- O app passa a guardar dado pessoal e por vezes sens\u00edvel (LGPD): acesso m\u00ednimo por perfil, trilha imut\u00e1vel de movimentos, log de acesso, pseudonimiza\u00e7\u00e3o antes de IA externa, reten\u00e7\u00e3o de 5 anos com anonimiza\u00e7\u00e3o.\n- **O texto da resposta do setor \u00e9 dado imut\u00e1vel** (a partir da issue #374): a resposta viaja inteira para `ouvidoria_movimentos.observacao`, uma c\u00f3pia por ciclo de resposta. A trilha \u00e9 append-only por gatilho (migration 064): DELETE \u00e9 recusado sem exce\u00e7\u00e3o, inclusive para o super admin, e a manifesta\u00e7\u00e3o tem `ON DELETE RESTRICT`. O \u00fanico UPDATE aceito \u00e9 o da reten\u00e7\u00e3o (migration 064, revista pela 079): zerar a coluna `observacao` de manifesta\u00e7\u00e3o encerrada h\u00e1 mais de cinco anos, e nada al\u00e9m disso. Consequ\u00eancia pr\u00e1tica: **esse texto n\u00e3o tem caminho de reda\u00e7\u00e3o sob demanda**. A reten\u00e7\u00e3o n\u00e3o substitui um: ela \u00e9 autom\u00e1tica, por prazo, e apaga o caso inteiro, sem escolher trecho nem titular. Se o relato do manifestante trouxer detalhe identificador de paciente, ele fica no banco at\u00e9 o prazo vencer.\n- Nasce o segundo link p\u00fablico tokenizado do sistema (padr\u00e3o do Aceite interno) e o primeiro conjunto de jobs de SLA (c\u00e1lculo peri\u00f3dico, calend\u00e1rio \u00fatil, escalonamento).\n- O Setor deixa de ser s\u00f3 taxonomia: ganha titular, substituto e gestor como destinat\u00e1rios operacionais.\n- A m\u00e1quina de estados atual (aberto/respondido/encerrado) \u00e9 substitu\u00edda pela da spec (novo, em classifica\u00e7\u00e3o, aguardando \u00e1rea, aguardando manifestante, respondido, encerrado), com mapeamento dos registros existentes; o detalhe vive nos PRDs.\n- O lado Ana ganha entrega casada (prompt preenchendo o dossi\u00ea); enquanto n\u00e3o sobe, protocolos da Ana chegam resumidos e o ouvidor completa na valida\u00e7\u00e3o.\n- A expans\u00e3o da Ana como primeira camada de TODO o atendimento (se\u00e7\u00e3o 3 da spec) \u00e9 assunto do programa da Ana, no repo dela, n\u00e3o destes PRDs.\n\n## Em aberto\n\n- **Caminho de reda\u00e7\u00e3o para pedido de titular (LGPD, artigo 18).** N\u00e3o existe hoje, e a decis\u00e3o acima o descarta por constru\u00e7\u00e3o. A consequ\u00eancia \u00e9 aceita nesta leva porque a trilha j\u00e1 guardava texto livre antes da issue #374 (motivo da devolu\u00e7\u00e3o, motivo da pausa), ent\u00e3o a mudan\u00e7a foi de volume, n\u00e3o de natureza. Fica registrado como item aberto, n\u00e3o como decis\u00e3o de que nunca ser\u00e1 preciso: se o hospital receber pedido de elimina\u00e7\u00e3o ou anonimiza\u00e7\u00e3o de titular sobre manifesta\u00e7\u00e3o viva, hoje s\u00f3 h\u00e1 como responder que o dado permanece at\u00e9 a reten\u00e7\u00e3o. O desenho de sa\u00edda (por exemplo, guardar o texto em coluna apag\u00e1vel e deixar no movimento apenas a refer\u00eancia ao ciclo) sai em issue pr\u00f3pria quando o hospital pedir.", "cita": [30, 31], "decisao": "Decis\u00e3o do Pedro (20/ago/2026, grilling a partir do \u00e1udio do diretor e da especifica\u00e7\u00e3o funcional dele, `Especificacao_Modulo_Ouvidoria.md` v1.0 de 19/ago): a ouvidoria deixa de ser um \u00edndice passivo e vira o **centralizador de...", "emenda": [], "emendada_por": [36, 47, 48, 88], "file": "docs/adr/0034-ouvidoria-vira-tramitacao-dossie-despacho-cobranca.md", "number": 34, "slug": "0034-ouvidoria-vira-tramitacao-dossie-despacho-cobranca", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Ouvidoria vira tramita\u00e7\u00e3o: dossi\u00ea no app, despacho por link tokenizado e cobran\u00e7a com escalonamento"}, {"amended_by": "0061", "amends": "0029", "body_md": "Na onda do PRD #317 (24-25/08), os gates internos de `/code-review` e `/security-review` do sub-agente travaram em 4 de 4 fatias sem devolver veredito, mesmo com re-engajamento. A causa \u00e9 estrutural: essas skills fazem fan-out de review-agents, e as notifica\u00e7\u00f5es de t\u00e9rmino chegam no **orquestrador**, n\u00e3o no sub-agente que as disparou. O sub-agente espera um veredito que nunca chega; o orquestrador espera o sub-agente, espera de novo, re-engaja e dispara revisores v2. Resultado medido: ~40 minutos por issue, dos quais ~25-30 s\u00e3o espera pura (caso do PR #351: 48 minutos de sess\u00e3o, a maior parte em polling de `gh pr view`).\n\nO formato que funcionou (2 de 2 vezes na mesma onda): o orquestrador dispara um `Agent` fresco de revis\u00e3o, s\u00f3-leitura, contexto limpo, que comenta o resultado no PR. E a revis\u00e3o independente \u00e9 melhor que a interna: a auto-revis\u00e3o do autor no PR #348 deixou passar 2 achados ALTOS que o revisor independente pegou.\n\n## Decis\u00f5es\n\n1. **Sub-agente da onda n\u00e3o roda mais review interna.** O sub-agente executa `/ship \"<desc>\" --issue <N> --no-merge --skip-review`: commit, push, PR, CI. Ele n\u00e3o invoca `/code-review` nem `/security-review`. O Gate 1.5 (spec \u00d7 diff) continua dentro do sub-agente: n\u00e3o faz fan-out, funciona em worktree e j\u00e1 reprovou bugs reais (#325, duas vezes, at\u00e9 a corre\u00e7\u00e3o).\n\n2. **O orquestrador \u00e9 o dono do gate de review.** Assim que o PR abre, o orquestrador dispara **1 revisor independente** (Agent fresco, sem `isolation: worktree`, prompt s\u00f3-leitura: \"ache problemas, n\u00e3o aprove, n\u00e3o edite\") com **2 lentes no mesmo prompt**: c\u00f3digo e seguran\u00e7a. O revisor l\u00ea o diff do PR via `gh` (GitHub), nunca a working tree, e comenta o resultado no PR. Exce\u00e7\u00e3o: diff que toca auth, permissions, migrations, endpoint p\u00fablico ou env vars ganha um **segundo revisor** dedicado s\u00f3 a seguran\u00e7a, em paralelo.\n\n3. **Loop de fix com teto.** Achado must-fix volta ao sub-agente da issue via `SendMessage` (worktree ainda vivo); ele corrige, pusha, e o orquestrador dispara nova rodada de revis\u00e3o. M\u00e1ximo **2 rodadas**; sem veredito limpo, a issue vira `ready-for-human` (mesma pol\u00edtica de baixa do ADR 0022).\n\n4. **Nada de espera dupla.** O orquestrador n\u00e3o faz Monitor esperando gate interno do sub-agente e n\u00e3o dispara revisores \"v2\" por timeout. O \u00fanico wait de review \u00e9 a task-notification do revisor que ele mesmo disparou.\n\nO invariante do ADR 0022 n\u00e3o muda: merge e deploy continuam atr\u00e1s do checkpoint humano. \"PR verde\" para o checkpoint passa a significar: CI verde + spec \u00d7 diff verde + veredito limpo do revisor independente.\n\n## Considered options\n\n- **Manter os gates internos e re-engajar quando travarem:** rejeitado. Foi a pol\u00edtica vigente e falhou 4 de 4; cada trava custa duas esperas longas e um re-engajamento. Prompt n\u00e3o conserta o problema de roteamento das notifica\u00e7\u00f5es (fan-out dentro de Agent async).\n- **Manter os gates internos e s\u00f3 cortar a segunda espera:** rejeitado. Economiza menos (a primeira espera continua) e mant\u00e9m um gate que estruturalmente n\u00e3o responde.\n- **Orquestrador corrige os achados direto no worktree:** rejeitado. Quebra o orquestrador magro (ADR 0029) e mistura autor e revisor no mesmo contexto.\n- **2 revisores sempre (c\u00f3digo + seguran\u00e7a separados):** rejeitado como default. Dobra o custo de tokens com ganho marginal em fatia comum; a lente dedicada de seguran\u00e7a fica reservada a diffs de \u00e1rea sens\u00edvel.\n\n## Consequences\n\n- Tempo por issue cai de ~40 min para ~15-20 min (o trabalho real de tdd + PR).\n- A revis\u00e3o fica mais confi\u00e1vel: revisor independente com contexto limpo, n\u00e3o auto-revis\u00e3o de quem escreveu o c\u00f3digo.\n- O bug do `/security-review` ler o diff da \u00e1rvore principal em worktree ([[project_security_review_diff_errado]]) deixa de afetar a onda: o revisor l\u00ea o diff do PR no GitHub.\n- O `/ship` interativo (humano rodando fora da onda) n\u00e3o muda: os 3 gates internos continuam l\u00e1; a mudan\u00e7a vale para o contexto async da `/onda`.", "cita": [22], "decisao": "Na onda do PRD #317 (24-25/08), os gates internos de `/code-review` e `/security-review` do sub-agente travaram em 4 de 4 fatias sem devolver veredito, mesmo com re-engajamento. A causa \u00e9 estrutural: essas skills fazem fan-out de...", "emenda": [29], "emendada_por": [61], "file": "docs/adr/0035-gates-de-review-da-onda-pertencem-ao-orquestrador.md", "number": 35, "slug": "0035-gates-de-review-da-onda-pertencem-ao-orquestrador", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Gates de review da onda pertencem ao orquestrador"}, {"amended_by": "0086", "amends": "0034", "body_md": "Decis\u00e3o do Pedro (26/ago/2026, grilling): o QR setorial da Ouvidoria deixa de ser uma URL montada \u00e0 m\u00e3o e passa a nascer de um cadastro no app. Nasce a entidade **Ponto de escuta**, e o que vai impresso no cartaz passa a ser um c\u00f3digo curto, n\u00e3o o nome do setor por extenso. Este ADR emenda a decis\u00e3o 9 do ADR 0034 na parte da URL do cartaz.\n\n## Contexto\n\n- O ADR 0034 (decis\u00e3o 9) definiu a URL do cartaz como `/ouvidoria/qr?setor=X&ponto=Y`, e a issue #323 a implementou: o backend resolve o setor contra a taxonomia e redireciona ao formul\u00e1rio p\u00fablico.\n- O que ficou de fora: **nada no app gera o QR**. N\u00e3o h\u00e1 imagem, n\u00e3o h\u00e1 cadastro, n\u00e3o h\u00e1 lista. Quem quisesse um cartaz teria que montar a URL na m\u00e3o e gerar o c\u00f3digo num site qualquer.\n- Consequ\u00eancia pr\u00e1tica: **nenhum cartaz foi impresso at\u00e9 hoje**. O canal `qr` existe no banco e nunca foi usado de verdade. Aposentar o formato antigo n\u00e3o quebra nada que esteja na parede.\n- O `ponto` \u00e9 texto livre de at\u00e9 80 caracteres, sem entidade por tr\u00e1s. O ouvidor n\u00e3o tem como saber quais cartazes existem, nem onde est\u00e3o.\n- A revis\u00e3o da issue #375 registrou duas arestas do formato atual: o texto de origem na query string aparece na p\u00e1gina com a marca do hospital (item 9, superf\u00edcie de golpe), e `canal = 'qr'` n\u00e3o prova presen\u00e7a f\u00edsica (item 10).\n- A spec da Diretoria (RN-14) pede pontos de instala\u00e7\u00e3o nomeados, cada um com c\u00f3digo pr\u00f3prio, e observa que o cartaz converte muito mais com convite direto do que com a palavra \"Ouvidoria\" sozinha.\n\n## Decis\u00f5es\n\n1. **Nasce o Ponto de escuta**: entidade pr\u00f3pria (setor, r\u00f3tulo do ponto, c\u00f3digo, ativo). Cada linha \u00e9 um cartaz. Fica sobre a taxonomia de Setores da casa, sem cadastro paralelo, como os [Respons\u00e1veis do setor].\n2. **O cartaz leva c\u00f3digo curto**: a URL impressa passa a ser `https://<app>/ouvidoria/qr?p=<codigo>`, e o servidor resolve o setor e o ponto. Tr\u00eas raz\u00f5es: QR com menos dados tem m\u00f3dulos maiores e a c\u00e2mera l\u00ea melhor de longe; renomear o ponto n\u00e3o obriga reimprimir; e a origem deixa de ser texto que qualquer pessoa monta, o que fecha o item 9 da #375.\n3. **C\u00f3digo aleat\u00f3rio de 6 caracteres**, sem os pares amb\u00edguos (0/O, 1/I). N\u00e3o sugere ordem e n\u00e3o depende de sigla de setor, que o contexto Reuni\u00f5es n\u00e3o tem.\n4. **O formato antigo \u00e9 aposentado**: `/ouvidoria/qr` passa a aceitar somente `?p=`. Manter as duas portas anularia a decis\u00e3o 2, porque a brecha do texto arbitr\u00e1rio continuaria aberta pela porta velha. Nenhum cartaz impresso \u00e9 afetado, porque n\u00e3o existe nenhum.\n5. **Lista fechada tamb\u00e9m para o ponto**: `canal_ponto` s\u00f3 \u00e9 gravado quando o c\u00f3digo resolve um Ponto de escuta ativo. \u00c9 o mesmo tratamento que o setor j\u00e1 recebe hoje. O que n\u00e3o resolve entra sem origem, nunca com texto cru.\n6. **Ponto desativa, nunca apaga**: o hist\u00f3rico de casos aponta para ele. QR de ponto inativo abre o formul\u00e1rio p\u00fablico normal, **sem origem**, e nunca uma p\u00e1gina de erro: ningu\u00e9m parado na frente de um cartaz pode ficar sem canal por causa de faxina no cadastro.\n7. **Quem gere \u00e9 o [Perfil da Ouvidoria]** (`ouvidor` e `diretoria_executiva`), e n\u00e3o s\u00f3 a Diretoria. Cartaz \u00e9 opera\u00e7\u00e3o do canal, n\u00e3o governan\u00e7a: n\u00e3o carrega dado de paciente e n\u00e3o muda prazo nem responsabilidade. O ouvidor \u00e9 quem sabe qual cartaz caiu da parede.\n8. **A tela entrega os dois artefatos**: o PNG do QR vis\u00edvel e baix\u00e1vel, e o **cartaz A5 em PDF** pronto para a gr\u00e1fica, com logo, convite direto, o QR grande e o setor. A gera\u00e7\u00e3o \u00e9 no backend, com `segno` (Python puro, sem Pillow), porque o PDF \u00e9 montado l\u00e1 pelo weasyprint que j\u00e1 serve Ata e POP.\n\n## Considered options\n\n- **Gerador solto, sem cadastro:** rejeitado. \"Gerir\" pede lista: sem entidade ningu\u00e9m sabe quantos cartazes existem nem onde, e o r\u00f3tulo do ponto continuaria ref\u00e9m de erro de digita\u00e7\u00e3o.\n- **Manter setor e ponto por extenso na URL:** rejeitado. URL leg\u00edvel n\u00e3o paga o pre\u00e7o de QR mais denso, cartaz que morre ao renomear o ponto, e a superf\u00edcie de golpe do item 9 da #375.\n- **C\u00f3digo leg\u00edvel (`REC-01`, `PS-03`):** rejeitado. Exigiria cadastro de siglas de setor, que s\u00f3 o contexto POPs tem, e a tela mostra setor e ponto ao lado do c\u00f3digo de qualquer forma.\n- **Manter as duas URLs por compatibilidade:** rejeitado. N\u00e3o h\u00e1 o que compatibilizar: zero cartazes impressos.\n- **Gerar o QR no navegador:** rejeitado. O PDF do cartaz precisa da imagem no backend, ent\u00e3o o front duplicaria a l\u00f3gica.\n- **S\u00f3 a Diretoria Executiva gere:** rejeitado. Poria a Diretoria no caminho de todo cartaz novo, sem ganho de prote\u00e7\u00e3o.\n\n## Consequences\n\n- O `canal_ponto` deixa de ser texto de canal aberto e passa a ser dado derivado de cadastro. O que o ouvidor l\u00ea no Dossi\u00ea passa a ter um cartaz de verdade por tr\u00e1s.\n- Entra depend\u00eancia nova no backend (`segno`), e nasce a primeira imagem gerada pelo app.\n- O item 10 da #375 continua valendo em parte: quem passar na frente do cartaz l\u00ea o c\u00f3digo e pode montar a URL depois, em casa. `qr` segue sendo sinal de origem, n\u00e3o prova de presen\u00e7a f\u00edsica, e a tela do Dossi\u00ea precisa dizer isso.\n- A decis\u00e3o 12 da #375 (n\u00e3o gravar `canal_ponto` em caso an\u00f4nimo) continua de p\u00e9 e vale sobre o ponto cadastrado do mesmo jeito.\n- O dia em que a Ana entrar no WhatsApp oficial, o destino muda no servidor e o cartaz com c\u00f3digo curto continua valendo, que \u00e9 o mesmo ganho que o ADR 0034 j\u00e1 buscava.", "cita": [], "decisao": "Decis\u00e3o do Pedro (26/ago/2026, grilling): o QR setorial da Ouvidoria deixa de ser uma URL montada \u00e0 m\u00e3o e passa a nascer de um cadastro no app. Nasce a entidade **Ponto de escuta**, e o que vai impresso no cartaz passa a ser um c\u00f3digo...", "emenda": [34], "emendada_por": [86], "file": "docs/adr/0036-qr-da-ouvidoria-vira-ponto-de-escuta-cadastrado.md", "number": 36, "slug": "0036-qr-da-ouvidoria-vira-ponto-de-escuta-cadastrado", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O QR da Ouvidoria vira Ponto de escuta cadastrado, com c\u00f3digo curto no cartaz"}, {"amended_by": "0040", "amends": null, "body_md": "> Emenda em prosa \u00e0 decis\u00e3o 1 do ADR 0034. Sem ponteiro `amends` no frontmatter: o 0034 j\u00e1 est\u00e1 emendado pelo 0036 (Ponto de escuta) e o lint de ADR aceita um \u00fanico ponteiro por campo, como o pr\u00f3prio 0034 fez com o 0031.\n\n\nA decis\u00e3o 1 do ADR 0034 diz que den\u00fancia e relato de conduta nascem com sigilo refor\u00e7ado. Na implementa\u00e7\u00e3o, \"den\u00fancia\" era uma **palavra digitada**: a regra procurava os termos `denuncia` e `relato de conduta` dentro de um campo de texto livre. Quatro revis\u00f5es independentes (PRs #328, #337, #348 e #351) mostraram as quatro faces do mesmo buraco, e a issue #372 as fechou.\n\nO caso classificado como \"Ass\u00e9dio moral\" n\u00e3o casava com termo nenhum, n\u00e3o elevava o sigilo, e o email de acionamento chegava ao setor acusado com o nome de quem manifestou. Nenhuma rota elevava o sigilo depois da cria\u00e7\u00e3o, e nenhuma o abaixava: a manifesta\u00e7\u00e3o vinda do QR, que nasce fail-closed, ficava invis\u00edvel para facilitador, secret\u00e1ria e super admin **para sempre**, mesmo depois de o ouvidor classific\u00e1-la como elogio. E a consulta de protocolo da API da Ana devolvia o \u00edndice de qualquer caso pelo n\u00famero, que \u00e9 sequencial e enumer\u00e1vel.\n\n## Decis\u00f5es\n\n1. **Tipo \u00e9 lista fechada, no banco**: `denuncia`, `reclamacao`, `sugestao`, `elogio`, `relato_de_conduta` (coluna `tipo_manifestacao`, CHECK na migration 077). \u00c9 o tipo que decide o sigilo. O texto livre continua existindo na coluna `categoria`, como r\u00f3tulo humano do caso, e n\u00e3o decide mais nada. `categoria` n\u00e3o foi renomeada: renomear exigiria app e banco subindo no mesmo instante, e o ganho seria s\u00f3 o nome.\n\n2. **Sigiloso por natureza**: `denuncia` e `relato_de_conduta`, nos tr\u00eas canais, sem ato humano. A regra autom\u00e1tica \u00e9 **piso, nunca teto**: o ouvidor pode elevar o sigilo de um caso que a lista n\u00e3o previu, e n\u00e3o pode retirar o de um tipo sigiloso por natureza.\n\n3. **Sem tipo \u00e9 fail-closed**: `tipo_manifestacao` nulo significa \"ainda n\u00e3o classificado\", e o caso n\u00e3o classificado \u00e9 tratado como sigiloso. Vale para o formul\u00e1rio p\u00fablico, para o QR e **tamb\u00e9m para o canal da Ana**, que antes entrava aberto: o `resumo` do \u00edndice \u00e9 texto gerado a partir da conversa com quem manifestou e frequentemente j\u00e1 identifica a pessoa. A sa\u00edda \u00e9 a classifica\u00e7\u00e3o, n\u00e3o afrouxar a entrada.\n\n4. **A Ana n\u00e3o manda o tipo**: o campo entra na lista de decis\u00f5es do ouvidor que o POST da API de servi\u00e7o recusa, junto de estado, desfecho e sigilo. Mant\u00e9m a decis\u00e3o 10 do ADR 0034: a Ana registra manifesta\u00e7\u00e3o, n\u00e3o classifica caso. Aceitar o tipo dela seria deixar a IA decidir quem enxerga o caso.\n\n5. **A porta do sigilo \u00e9 a classifica\u00e7\u00e3o**: uma rota (`POST /ouvidoria/manifestacoes/{id}/classificacao`) que grava tipo, r\u00f3tulo e sigilo, atr\u00e1s de `require_perfil_ouvidoria`, com movimento na trilha e registro no log de acesso. A valida\u00e7\u00e3o e acionamento aplica a **mesma** regra, pela mesma fun\u00e7\u00e3o: quem classifica ali n\u00e3o precisa de uma segunda tela. Sem pedido expl\u00edcito de sigilo, o sigilo de hoje \u00e9 mantido: descer \u00e9 ato consciente, n\u00e3o efeito colateral de reclassificar.\n\n6. **Consulta de protocolo sigiloso devolve s\u00f3 o andamento**: `protocolo`, `status` e a data. Sem resumo, sem categoria, sem setor. O caso n\u00e3o sigiloso segue com o contrato de hoje, sem mudan\u00e7a: o time da Ana s\u00f3 perde campos no caso sigiloso.\n\n## Consequ\u00eancias\n\n- Casos que j\u00e1 estavam no banco receberam tipo por backfill, pelo mesmo crit\u00e9rio que a regra antiga reconhecia, para nenhum caso hoje sigiloso ficar aberto. O r\u00f3tulo \"A classificar\" do canal aberto continua sem tipo, porque ele de fato n\u00e3o foi classificado.\n- Enquanto o ouvidor n\u00e3o classifica, o caso da Ana some do painel de quem est\u00e1 fora da Ouvidoria. \u00c9 a troca aceita: antes ele aparecia com um resumo que identificava quem relatou.\n- A reabertura por reincid\u00eancia s\u00f3 **eleva** o sigilo, e por isso n\u00e3o usa a mesma fun\u00e7\u00e3o: reabrir n\u00e3o \u00e9 classificar, ent\u00e3o n\u00e3o devolve caso nenhum ao \u00edndice geral.\n- O time da Ana precisa ser avisado da mudan\u00e7a no contrato da consulta, depois do deploy.", "cita": [34], "decisao": "A decis\u00e3o 1 do ADR 0034 diz que den\u00fancia e relato de conduta nascem com sigilo refor\u00e7ado. Na implementa\u00e7\u00e3o, \"den\u00fancia\" era uma **palavra digitada**: a regra procurava os termos `denuncia` e `relato de conduta` dentro de um campo de texto...", "emenda": [], "emendada_por": [40], "file": "docs/adr/0037-tipo-da-manifestacao-e-lista-fechada-e-decide-o-sigilo.md", "number": 37, "slug": "0037-tipo-da-manifestacao-e-lista-fechada-e-decide-o-sigilo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O tipo da manifesta\u00e7\u00e3o \u00e9 lista fechada, e \u00e9 ele que decide o sigilo"}, {"amended_by": null, "amends": "0032", "body_md": "Decis\u00e3o do Pedro (26/ago/2026, grilling neste repo, par do ADR-0025 do repo da Ana). A tabela curada `convenios_especialidade` (ADR 0031, migration 062) se aposenta. A cobertura de conv\u00eanio por especialidade passa a ter uma fonte \u00fanica: a agenda online da Global Health (GH). No lugar da tabela, a tela `/admin/dados-atendimento` ganha o **Espelho da Global Health**, uma se\u00e7\u00e3o somente leitura que mostra ao vivo o que a GH publica. Este ADR emenda o 0032 (o endpoint de conv\u00eanios deixa de existir, com seus filtros e degraus) e, em prosa, o 0031 (o m\u00f3dulo passa de 4 tabelas de valores para 3; o campo `amended_by` dele j\u00e1 est\u00e1 ocupado pelo 0032).\n\n## Contexto\n\n- Em 26/ago/2026 ficou provado (repo da Ana, ADR-0025) que `GET /convenios?idItemAgendamento=` da GH responde cobertura por especialidade, direto da fonte que decide se o agendamento acontece.\n- As duas fontes j\u00e1 divergiam: a tabela local tinha Amil, Golden Cross e Hapvida; a agenda de Cardiologia da GH n\u00e3o tem nenhum dos tr\u00eas. C\u00f3pia local de dado que a plataforma sabe envelhece e vira mentira.\n- Do lado da Ana o corte j\u00e1 foi feito: a tool 4 saiu do grant e a Se\u00e7\u00e3o 3.2 do prompt verifica cobertura pela cadeia da agenda (3 casos: na lista, fora da lista, especialidade n\u00e3o publicada). Nenhuma men\u00e7\u00e3o \u00e0 tabela sobrou no prompt.\n- A anota\u00e7\u00e3o por especialidade (diferenciais, instru\u00e7\u00f5es de conversa) j\u00e1 existe e fica: colunas `descricao_servico`, `diferencial_1..3` e `observacoes_ana` de `consultas_particulares`.\n\n## Decis\u00f5es\n\n1. **A tabela `convenios_especialidade` sai inteira**, em camadas de fora para dentro: se\u00e7\u00e3o da tela, rotas admin (`GET/POST/PATCH /api/admin/dados-atendimento/convenios-especialidade`), endpoint `GET /api/ana/convenios-especialidade`, spec da factory, testes e fixture. A migration de drop vem por \u00faltimo, em commit separado, revers\u00edvel sozinha.\n2. **Sem dump de produ\u00e7\u00e3o.** O conte\u00fado ser\u00e1 refeito depois (decis\u00e3o do Pedro). O seed de mar\u00e7o/2026 (20 linhas, com os textos de `observacao`) permanece preservado no git dentro da migration 062; edi\u00e7\u00f5es feitas em produ\u00e7\u00e3o depois disso se perdem, conscientemente.\n3. **Sem camada de anota\u00e7\u00f5es de conv\u00eanio nesta passada.** Os 20 textos existentes s\u00e3o frases de cobertura, exatamente o dado que a GH agora responde. Vale a regra do ADR-0025 da Ana: se um aviso humano (ex.: \"sujeito a autoriza\u00e7\u00e3o pr\u00e9via\") fizer falta real na conversa, a tabela de anota\u00e7\u00f5es nasce num PRD pr\u00f3prio, com texto novo. Guardar por precau\u00e7\u00e3o \u00e9 o caminho de volta para a diverg\u00eancia.\n4. **Mapa da verdade entre GH e Dados do Atendimento.** A GH \u00e9 dona da agenda: o que existe, quem atende, quem \u00e9 aceito, quando. As tabelas locais s\u00e3o donas do que a GH n\u00e3o tem: pre\u00e7o particular e diferenciais (consultas), pre\u00e7o e preparo (exames), estimativa e aviso obrigat\u00f3rio (cirurgias). As 3 tabelas restantes e as tools 1-3 da Ana ficam at\u00e9 a GH publicar esses dados; quando publicar, revisita-se tabela a tabela.\n5. **Espelho da Global Health**: se\u00e7\u00e3o somente leitura na tela `/admin/dados-atendimento`, onde ficava a tabela de conv\u00eanios. Bot\u00e3o \"Atualizar\" dispara a chamada; nada \u00e9 gravado no banco (espelho, n\u00e3o c\u00f3pia). Quatro elos: especialidades publicadas, conv\u00eanios aceitos + profissionais (em paralelo, ao clicar na especialidade), planos (ao clicar no conv\u00eanio), hor\u00e1rios livres. Blocos de exames e instru\u00e7\u00f5es de hor\u00e1rio s\u00e3o fatia opcional, fora do n\u00facleo.\n6. **Seguran\u00e7a e ambiente**: o backend \u00e9 o \u00fanico que fala com a GH (proxy; o token jamais chega ao navegador). Token em env var `GH_TOKEN_HOMOLOG`, no mesmo lugar do `ANA_API_KEY`. Base fixa em constante \u00fanica comentada, apontando homologa\u00e7\u00e3o (`dem.agenda.globalhealth.mv`); produ\u00e7\u00e3o jamais \u00e9 chamada por este c\u00f3digo, e trocar a base exige commit consciente. S\u00f3 leitura: nenhum POST/PUT/DELETE contra a GH.\n7. **Honestidade da tela**: timeout curto por chamada; falha de rede aparece como falha, nunca como lista vazia; cada bloco vazio diz por qu\u00ea. `GET /agendas/v2` s\u00f3 \u00e9 chamado com os tr\u00eas ids vindos dos elos anteriores (id errado devolve 200 com `agendas: []`, indistingu\u00edvel de \"sem hor\u00e1rio\"; faltando id, HTTP 500).\n8. **P\u00fablico**: o mesmo da tela, super admin, secret\u00e1ria e facilitador, tudo leitura.\n\n## Considered options\n\n- **Camada de anota\u00e7\u00f5es de conv\u00eanio j\u00e1 nesta entrega**: rejeitada depois de ler os 20 textos reais (todos frases de cobertura) e o ADR-0025 da Ana, que manda esperar a falta real.\n- **Dump fiel de produ\u00e7\u00e3o antes do drop** (psql via Coolify Terminal): rejeitado pelo Pedro; o conte\u00fado ser\u00e1 refeito e o seed de mar\u00e7o j\u00e1 vive no git.\n- **Base da GH em env var com guarda contra produ\u00e7\u00e3o**: rejeitada; constante fixa \u00e9 mais simples e a troca vira revis\u00e3o de c\u00f3digo.\n- **Ana 100% GH j\u00e1 (desligar tamb\u00e9m as tools 1-3)**: rejeitada por fato: a GH hoje n\u00e3o publica pre\u00e7o nenhum (`/consultas` devolve s\u00f3 `id`, `nome`, `bloqueado`), e o fluxo particular da Ana vive de pre\u00e7o.\n\n## Consequences\n\n- Morre a segunda verdade de cobertura; a diverg\u00eancia deixa de existir por constru\u00e7\u00e3o.\n- A tela admin passa a depender da disponibilidade da GH de homologa\u00e7\u00e3o para o Espelho (as 3 tabelas curadas n\u00e3o dependem).\n- O endpoint da antiga tool 4 morre; no repo da Ana a defini\u00e7\u00e3o da tool fica preservada sem grant (ADR-0025) e passa a apontar para rota inexistente, o que \u00e9 aceit\u00e1vel e documentado.\n- Pautas registradas para o repo da Ana, fora desta entrega: cirurgia sempre transborda a humano (inclina\u00e7\u00e3o do diretor, a amadurecer) e a d\u00favida do `idPlano` na disponibilidade.\n- Nasce o primeiro consumo de API externa por tela admin (padr\u00e3o proxy backend + bot\u00e3o Atualizar), reutiliz\u00e1vel para futuros espelhos.", "cita": [31], "decisao": "Decis\u00e3o do Pedro (26/ago/2026, grilling neste repo, par do ADR-0025 do repo da Ana). A tabela curada `convenios_especialidade` (ADR 0031, migration 062) se aposenta. A cobertura de conv\u00eanio por especialidade passa a ter uma fonte \u00fanica: a...", "emenda": [32], "emendada_por": [], "file": "docs/adr/0038-convenios-sai-cobertura-vem-da-agenda-e-espelho-gh.md", "number": 38, "slug": "0038-convenios-sai-cobertura-vem-da-agenda-e-espelho-gh", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Conv\u00eanios por especialidade sai do app: cobertura vem da agenda online e o Espelho da Global Health entra no lugar"}, {"amended_by": "0041, 0051, 0087", "amends": null, "body_md": "Registro de uma decis\u00e3o que j\u00e1 vale em produ\u00e7\u00e3o desde o primeiro email do app e nunca foi escrita (issue #435, achado da review do PR #401). Todo email do sistema, inclusive os do m\u00f3dulo Ouvidoria, \u00e9 entregue pelo **Resend**, um servi\u00e7o de terceiro cuja infraestrutura fica fora do Brasil. O conte\u00fado de cada mensagem (assunto, corpo, anexos e endere\u00e7o do destinat\u00e1rio) passa pelos servidores dele para ser entregue. Este ADR registra a decis\u00e3o, delimita o que sai e prende as regras que j\u00e1 existem no c\u00f3digo para que o que sai continue sendo s\u00f3 isso.\n\n## Contexto\n\n- O m\u00f3dulo Ouvidoria trata a manifesta\u00e7\u00e3o como dado sens\u00edvel: sigilo por tipo (ADR 0037), Dossi\u00ea separado da estat\u00edstica, reten\u00e7\u00e3o de cinco anos com anonimiza\u00e7\u00e3o (ADR 0034), acesso registrado. Nada disso vale para o trecho do caminho que sai do hospital, e email sai do hospital por defini\u00e7\u00e3o.\n- O transporte \u00e9 escolhido em `app/services/email_service.py`: Resend quando h\u00e1 `RESEND_API_KEY`, SMTP quando h\u00e1 `SMTP_USER`, e modo mock (log local, nada sai) quando n\u00e3o h\u00e1 nenhum dos dois. Em produ\u00e7\u00e3o \u00e9 o Resend.\n- O remetente \u00e9 `noreply@hospitalsaomatheus.cloud`; o hospital n\u00e3o opera servidor de email pr\u00f3prio, e n\u00e3o h\u00e1 inten\u00e7\u00e3o de operar.\n- **Quatorze tipos de email saem do m\u00f3dulo hoje.** Doze construtores em `ouvidoria_notificacoes.py` (`montar_nova_demanda`, `montar_alerta_sem_titular`, `montar_prazo_rompido`, `montar_vespera_vencimento`, `montar_resposta_devolvida`, `montar_caso_reaberto`, `montar_escalonamento_gestor`, `montar_escalonamento_diretoria`, `montar_alerta_cadastro_setor`, `montar_critico_imediato`, `montar_prorrogacao_solicitada`, `montar_prorrogacao_decidida`), mais o aviso operacional ao admin t\u00e9cnico (`avisar_admins_tecnicos`) e mais o relat\u00f3rio quinzenal/mensal \u00e0 Diretoria Executiva. Este invent\u00e1rio \u00e9 o que a decis\u00e3o 2 abaixo governa, e \u00e9 ele que a pr\u00f3xima pessoa confere antes de acrescentar um campo a um template: um invent\u00e1rio que erra o tamanho n\u00e3o sustenta a regra.\n- A decis\u00e3o nunca foi registrada. Sem registro, a pr\u00f3xima pessoa a acrescentar um campo a um template n\u00e3o tem onde ler que aquele texto atravessa uma fronteira.\n\n## Decis\u00f5es\n\n1. **O processador externo fica.** Entregar email por servi\u00e7o de terceiro \u00e9 a pr\u00e1tica do mercado e a alternativa (servidor pr\u00f3prio) troca um risco de processamento por um risco de opera\u00e7\u00e3o (reputa\u00e7\u00e3o de IP, fila, disponibilidade) que este hospital n\u00e3o tem como sustentar. Resend continua sendo o prim\u00e1rio e SMTP a reserva.\n2. **O que pode sair est\u00e1 fechado campo a campo, e do relato sai o extrato, nunca a palavra crua.** `_CAMPOS_DO_EMAIL` em `ouvidoria_notificacoes.py` \u00e9 a lista fechada do que um email do caso pode carregar. `resumo` e `relato_integral` ficam de fora de prop\u00f3sito: o que viaja \u00e9 `extrato_para_o_setor`, escrito pelo ouvidor na valida\u00e7\u00e3o. Caso sem extrato manda o setor procurar a Ouvidoria pelo protocolo, e n\u00e3o o relato cru. Coluna nova no Dossi\u00ea n\u00e3o entra em email sem uma decis\u00e3o expl\u00edcita nessa lista.\n3. **O NOME de quem manifestou tamb\u00e9m atravessa a fronteira, e \u00e9 por desenho.** `manifestante_nome` est\u00e1 em `_CAMPOS_DO_EMAIL`, e `_identificacao()` (`ouvidoria_notificacoes.py`) devolve o nome sempre que o caso N\u00c3O \u00e9 an\u00f4nimo e N\u00c3O tem sigilo refor\u00e7ado; o email de nova demanda o imprime como \"Quem manifestou\" (`email_ouvidoria_nova_demanda.html`). O setor precisa saber com quem falar para resolver, e o sigilo \u00e9 decidido pelo tipo da manifesta\u00e7\u00e3o (ADR 0037), n\u00e3o pelo transporte. Fica escrito aqui porque este documento \u00e9 a base do aviso de privacidade do hospital, e um aviso que diz \"sai o extrato\" enquanto sai tamb\u00e9m o nome do titular erra no ponto que mais conta. Caso an\u00f4nimo e caso sigiloso saem sem identifica\u00e7\u00e3o nenhuma (ADR 0034, decis\u00e3o 8).\n4. **O relat\u00f3rio que sai por email \u00e9 agregado.** O PDF do relat\u00f3rio quinzenal e do mensal n\u00e3o carrega protocolo de manifesta\u00e7\u00e3o nenhuma (RN-40, ADR 0034 decis\u00e3o 8, migration 080). O \u00fanico nome pr\u00f3prio nele \u00e9 o do respons\u00e1vel por cada setor, que \u00e9 gente do hospital. O mesmo vale para o que a IA do relat\u00f3rio mensal recebe: agregado, nunca o relato.\n5. **O endere\u00e7o do destinat\u00e1rio \u00e9 dado do hospital.** Todo email do m\u00f3dulo vai para gente do hospital (respons\u00e1vel de setor, gestor, Diretoria Executiva, admin t\u00e9cnico). O manifestante n\u00e3o recebe email do sistema, e o contato dele (`manifestante_contato`) n\u00e3o \u00e9 usado como destinat\u00e1rio em caminho nenhum.\n6. **O carimbo de entrega s\u00f3 nasce de envio real, e a falta de transporte n\u00e3o enterra a edi\u00e7\u00e3o.** O modo mock devolve sucesso sem nada ter sa\u00eddo, e quem persiste estado a partir do envio pergunta antes por `email_service.transporte_configurado()` (issue #435). Uma chave rotacionada para vazio em produ\u00e7\u00e3o passa a aparecer como falha honesta, com motivo pr\u00f3prio, em vez de \"enviado\". Essa falha N\u00c3O consome o teto de tentativas do relat\u00f3rio (issue #434): ela n\u00e3o \u00e9 da edi\u00e7\u00e3o, \u00e9 da m\u00e1quina, e passa sozinha no minuto em que a vari\u00e1vel volta. Cont\u00e1-la levaria a quinzena a um estado terminal cujo \u00fanico aviso previsto sai justamente pelo canal quebrado, trocando um \"enviado\" falso por um \"desistido\" silencioso. O sinal aqui \u00e9 `logger.error` mais a trilha no `audit_log`, e a recupera\u00e7\u00e3o \u00e9 o retry di\u00e1rio.\n7. **A chave do processador \u00e9 secret de ambiente, e o modo mock N\u00c3O \u00e9 exclusividade do desenvolvimento.** `RESEND_API_KEY` vive s\u00f3 no Coolify, nunca no reposit\u00f3rio. Sem ela e sem SMTP, `_enviar_email` cai no modo mock: nada sai da m\u00e1quina, e a mensagem \u00e9 gravada com `logger.warning` (o `texto_fallback` inteiro s\u00f3 em desenvolvimento, desde a issue #450; fora dele fica o cabe\u00e7alho). No desenvolvimento local \u00e9 o desenho. **Em produ\u00e7\u00e3o tamb\u00e9m acontece**, e \u00e9 a premissa desta issue: chave rotacionada para vazio derruba o app inteiro em modo mock. Duas consequ\u00eancias, e as duas valem em produ\u00e7\u00e3o:\n   - o corpo do email ia para o log da aplica\u00e7\u00e3o. Para os emails do caso isso significava `extrato_para_o_setor` leg\u00edvel no log do container, para quem tem acesso ao Coolify e n\u00e3o tem perfil nenhum no m\u00f3dulo. O relat\u00f3rio \u00e9 o caminho leve aqui (o texto dele \u00e9 s\u00f3 per\u00edodo e total), mas os doze construtores de notifica\u00e7\u00e3o n\u00e3o s\u00e3o. **Fechado na issue #450:** o corpo s\u00f3 vai para o log quando `ENVIRONMENT=development`, e a guarda \u00e9 fail-closed nas duas pontas (o default de `ENVIRONMENT` \u00e9 `production`, ent\u00e3o a vari\u00e1vel sumir n\u00e3o abre o log; e valor fora de `{development, ci, staging, production}` faz o app recusar subir, para um typo n\u00e3o desligar em sil\u00eancio esta guarda nem as duas valida\u00e7\u00f5es de produ\u00e7\u00e3o do `Settings`). Sobram dois residuais, os dois pendentes de decis\u00e3o humana e nenhum deles conte\u00fado de relato:\n     - **o assunto continua no log, e ele n\u00e3o \u00e9 neutro.** A issue #450 decidiu manter destinat\u00e1rio e assunto, porque s\u00e3o o que responde \"o email deste caso saiu?\" quando algu\u00e9m liga dizendo que n\u00e3o recebeu. S\u00f3 que os assuntos dos construtores carregam protocolo, setor e estado do caso (`Ouvidoria 2026-0042: caso CRITICO validado no setor Recepcao`), ent\u00e3o quem l\u00ea o log do Coolify sem perfil no m\u00f3dulo ainda monta um \u00edndice de casos com cronologia. Truncar o protocolo no assunto do log, ou aceitar o residual, \u00e9 decis\u00e3o que n\u00e3o foi tomada. O teste `test_o_assunto_real_de_construtor_ainda_deixa_indice` mede o que sobra, para a afirma\u00e7\u00e3o n\u00e3o ficar mais forte do que a verdade;\n     - **a trilha pode dizer \"recuperada\" para uma edi\u00e7\u00e3o que n\u00e3o registrou entrega.** Quando a escrita da entrega falha depois de o email ter sa\u00eddo (a RPC da migration 089 ausente, por exemplo), `entrega.saiu` continua verdadeiro, porque o email saiu de fato, e `entregar_atrasados` grava `RELATORIO_OUVIDORIA_RECUPERADO`. O `logger.error` do mesmo instante diz que o registro n\u00e3o gravou, ent\u00e3o quem investiga tem os dois lados; fazer a trilha saber se a escrita pegou \u00e9 mudan\u00e7a de desenho, e ficou fora da issue #450;\n   - quem persiste estado a partir do envio n\u00e3o pode ler esse mock como entrega, que \u00e9 a decis\u00e3o 6.\n\n## Considered options\n\n- **Servidor SMTP pr\u00f3prio do hospital**: rejeitado. Elimina o processador externo e cria opera\u00e7\u00e3o cont\u00ednua de reputa\u00e7\u00e3o de IP e entregabilidade; um relat\u00f3rio que n\u00e3o chega \u00e0 Diretoria porque o IP caiu em lista \u00e9 pior do que o risco que se quis evitar. O caminho SMTP continua no c\u00f3digo como reserva configur\u00e1vel, n\u00e3o como plano.\n- **Provedor com processamento no Brasil**: n\u00e3o descartado por m\u00e9rito, e sim por custo de troca hoje. A decis\u00e3o fica revisit\u00e1vel: o ponto de troca \u00e9 \u00fanico (`email_service.py`), e nenhum chamador conhece o provedor.\n- **Cifrar o corpo dos emails**: rejeitado. O destinat\u00e1rio \u00e9 gente do hospital lendo em cliente comum de email; cifra ponta a ponta exigiria chave em cada leitor e derrubaria o uso real.\n- **N\u00e3o registrar (seguir como estava)**: rejeitado. \u00c9 justamente a decis\u00e3o invis\u00edvel que faz um campo novo atravessar a fronteira sem ningu\u00e9m notar.\n\n## Consequences\n\n- Assunto, corpo, anexo e endere\u00e7o de destino de todo email do app passam por um processador fora do Brasil. Isso \u00e9 fato do sistema, e agora \u00e9 fato escrito.\n- Acrescentar campo a template de email da Ouvidoria passa a ser mudan\u00e7a com este ADR do lado: se o campo n\u00e3o est\u00e1 em `_CAMPOS_DO_EMAIL`, a pergunta \u00e9 se ele pode sair, n\u00e3o como faz\u00ea-lo caber.\n- O caminho para trocar de provedor continua estreito de prop\u00f3sito: um arquivo, nenhum chamador acoplado.\n- O aviso de privacidade do hospital precisa dizer duas coisas que este ADR agora nomeia: que o email do caso atravessa um processador fora do Brasil, e que ele leva o NOME de quem manifestou quando o caso n\u00e3o \u00e9 an\u00f4nimo nem sigiloso (decis\u00e3o 3).\n- Fica pendente para o humano, fora do escopo desta issue: conferir se o contrato com o Resend e o aviso de privacidade do hospital refletem o que est\u00e1 escrito aqui.", "cita": [34, 37], "decisao": "Registro de uma decis\u00e3o que j\u00e1 vale em produ\u00e7\u00e3o desde o primeiro email do app e nunca foi escrita (issue #435, achado da review do PR #401). Todo email do sistema, inclusive os do m\u00f3dulo Ouvidoria, \u00e9 entregue pelo **Resend**, um servi\u00e7o de...", "emenda": [], "emendada_por": [41, 51, 87], "file": "docs/adr/0039-email-da-ouvidoria-sai-por-processador-externo.md", "number": 39, "slug": "0039-email-da-ouvidoria-sai-por-processador-externo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O email da Ouvidoria sai por processador externo (Resend, fora do Brasil)"}, {"amended_by": null, "amends": "0037", "body_md": "O diagn\u00f3stico da Diretoria Executiva de 31/08/2026 (D-11, RN-57) apontou a diverg\u00eancia entre a aplica\u00e7\u00e3o (5 tipos, ADR 0037) e a Especifica\u00e7\u00e3o da Diretoria, que previa `informacao` e n\u00e3o previa `relato_de_conduta`. A RN-57 unifica as duas listas em seis tipos. O cartaz do ponto de escuta, j\u00e1 em arte final, promete quatro naturezas ao manifestante, e uma delas \u00e9 informa\u00e7\u00e3o (RN-88): sem o tipo no banco, o formul\u00e1rio p\u00fablico n\u00e3o cumpre o que o papel promete.\n\n## Decis\u00f5es\n\n1. **Sexto tipo: `informacao`**, sem sigilo por natureza. Entra no CHECK do banco (migration nova sobre a 077) e nas taxonomias espelhadas do backend (`ouvidoria_taxonomia.py`) e do frontend (`taxonomia.ts`). Todas as demais regras do ADR 0037 permanecem: fail-closed sem tipo, porta \u00fanica do sigilo, Ana n\u00e3o manda tipo.\n\n2. **`relato_de_conduta` n\u00e3o \u00e9 renomeado.** A RN-57 escreveu `relato_conduta`, mas renomear valor em uso em produ\u00e7\u00e3o \u00e9 migration de dado com risco e sem ganho funcional. A diverg\u00eancia de grafia \u00e9 registrada na resposta \u00e0 Diretoria; a Especifica\u00e7\u00e3o \u00e9 atualizada com o valor real.\n\n3. **O formul\u00e1rio p\u00fablico ganha o seletor das quatro naturezas como sugest\u00e3o** (RN-88): elogio primeiro, escolha opcional, gravada em campo pr\u00f3prio (`natureza_informada`). N\u00e3o classifica, n\u00e3o decide sigilo, n\u00e3o muda estado: o que o manifestante diz que o caso \u00e9 n\u00e3o \u00e9 o que o caso \u00e9. O ouvidor v\u00ea a sugest\u00e3o no dossi\u00ea e segue soberano na classifica\u00e7\u00e3o, como j\u00e1 acontece com a `classificacao_ia` da Ana.\n\n## Consequ\u00eancias\n\n- A lista fechada do ADR 0037 passa de 5 para 6 valores; este ADR o emenda.\n- A Especifica\u00e7\u00e3o da Diretoria deve ser atualizada na mesma vers\u00e3o (a pr\u00f3pria RN-57 exige).\n- O cartaz impresso fica honrado: as quatro naturezas que ele promete existem na tela de destino com igual destaque.", "cita": [], "decisao": "O diagn\u00f3stico da Diretoria Executiva de 31/08/2026 (D-11, RN-57) apontou a diverg\u00eancia entre a aplica\u00e7\u00e3o (5 tipos, ADR 0037) e a Especifica\u00e7\u00e3o da Diretoria, que previa `informacao` e n\u00e3o previa `relato_de_conduta`. A RN-57 unifica as duas...", "emenda": [37], "emendada_por": [], "file": "docs/adr/0040-informacao-entra-na-lista-de-tipos.md", "number": 40, "slug": "0040-informacao-entra-na-lista-de-tipos", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "`informacao` entra na lista de tipos; os nomes atuais ficam"}, {"amended_by": "0052, 0088", "amends": "0039", "body_md": "> Revoga a proibi\u00e7\u00e3o do gloss\u00e1rio de mandar o relato ou o resumo por email ao setor (verbete Extrato para o setor) e **emenda a decis\u00e3o 2 do ADR 0039**: `resumo` e `relato_integral` entram na lista fechada `_CAMPOS_DO_EMAIL`, por decis\u00e3o expl\u00edcita da Diretoria (RN-78), exatamente pelo mecanismo que aquela decis\u00e3o exige. O extrato continua obrigat\u00f3rio; o que cai \u00e9 a exclusividade dele. A decis\u00e3o 5 do 0039 \u00e9 emendada \u00e0 parte, pelo ADR 0042.\n\n\nAt\u00e9 aqui, o respons\u00e1vel de setor lia apenas o Extrato para o setor: o texto que o ouvidor escreve com as pr\u00f3prias palavras na valida\u00e7\u00e3o. A regra existia para proteger a palavra do manifestante (nome, leito, detalhes) de viajar por email, superf\u00edcie que encaminha e vaza.\n\nO diagn\u00f3stico da Diretoria Executiva de 31/08/2026 (RN-78, RN-60) determinou o contr\u00e1rio, com fundamento operacional: quem l\u00ea s\u00f3 a interpreta\u00e7\u00e3o da Ouvidoria responde \u00e0 interpreta\u00e7\u00e3o, n\u00e3o ao paciente. O resumo permite decidir em segundos se o caso \u00e9 da \u00e1rea; o relato integral \u00e9 o que permite responder ao manifestante; a nota separada evita que a \u00e1rea responda ao intermedi\u00e1rio. A Diretoria conhece o risco do email e o aceitou; a decis\u00e3o foi seguir a RN-78 integralmente.\n\n## Decis\u00f5es\n\n1. **Tr\u00eas blocos, nos dois lugares.** O email de acionamento e a tela do respons\u00e1vel (`/ouvidoria-setor/{token}`) apresentam, nesta ordem e visualmente separados: RESUMO, RELATO INTEGRAL e NOTA DA OUVIDORIA (o Extrato para o setor). Os blocos nunca s\u00e3o fundidos nem formatados iguais (RN-60).\n\n2. **O extrato continua obrigat\u00f3rio.** A valida\u00e7\u00e3o segue recusada sem ele. O que muda \u00e9 a companhia: ele deixa de ser o \u00fanico conte\u00fado.\n\n3. **Sigilo refor\u00e7ado \u00e9 a exce\u00e7\u00e3o (RN-79).** Caso sigiloso n\u00e3o leva identifica\u00e7\u00e3o do manifestante em email nem na tela do token, e o relato integral \u00e9 substitu\u00eddo pelo extrato. Vale nos dois lugares, sem exce\u00e7\u00e3o. **Ver a emenda de 01/09/2026 abaixo: a exce\u00e7\u00e3o chegou a alcan\u00e7ar tamb\u00e9m o caso an\u00f4nimo, ratificada em 03/09/2026, e a emenda de 07/10/2026 a devolveu ao tamanho desta frase: s\u00f3 o sigilo refor\u00e7ado.**\n\n4. **O reenvio manda os mesmos tr\u00eas blocos** gravados no caso, para provar o que a \u00e1rea recebeu.\n\n## Emenda de 01/09/2026: o alcance real da exce\u00e7\u00e3o (issue #481)\n\nA decis\u00e3o 3 fala de sigilo refor\u00e7ado e do relato integral. Quando a issue #481 implementou os tr\u00eas blocos, dois testes que j\u00e1 existiam no reposit\u00f3rio (`TestExtratoParaOSetor`, decis\u00e3o de 25/08/2026) mostraram que a frase era estreita demais para o que o pr\u00f3prio m\u00f3dulo j\u00e1 protegia. O c\u00f3digo entregue faz o seguinte, e esta emenda registra isso de forma factual, para que ningu\u00e9m leia a decis\u00e3o 3 ao p\u00e9 da letra e reabra o buraco:\n\n1. **O caso an\u00f4nimo recebe a mesma prote\u00e7\u00e3o do sigiloso.** Quem escolheu n\u00e3o se identificar costuma se identificar dentro do pr\u00f3prio texto (\"sou a Maria Silva, do leito 302\"). Mandar esse texto ao setor desfaria o anonimato que o canal prometeu. \u00c9 a mesma porta por onde `_identificacao` j\u00e1 tratava os dois casos igual desde o ADR 0034, decis\u00e3o 8.\n\n2. **Na exce\u00e7\u00e3o, o resumo \u00e9 cortado junto com o relato.** O resumo n\u00e3o \u00e9 texto da Ouvidoria: no canal aberto s\u00e3o os primeiros caracteres do que o cidad\u00e3o digitou, e no canal da Ana \u00e9 texto gerado da conversa. Os dois carregam nome e leito. Mant\u00ea-lo entregaria justamente a identifica\u00e7\u00e3o que a mesma frase da RN-79 manda tirar.\n\n3. **Na exce\u00e7\u00e3o n\u00e3o h\u00e1 bloco de relato repetindo o extrato.** O extrato j\u00e1 \u00e9 a nota da ouvidoria, e duas caixas com o mesmo texto seriam ru\u00eddo na tela e no email. O que a \u00e1rea l\u00ea no lugar do relato \u00e9 a nota, e um aviso expl\u00edcito diz por que o resto do caso n\u00e3o veio (um texto para o sigilo, outro para o anonimato). Quem distingue as variantes l\u00ea a chave de cada bloco, nunca a posi\u00e7\u00e3o.\n\n### Ratifica\u00e7\u00e3o de 03/09/2026: no caso an\u00f4nimo, o anonimato pesa mais que a RN-78 (issue #514)\n\nO item 1 tinha um efeito que ningu\u00e9m havia escolhido: **todo caso an\u00f4nimo** chega \u00e0 \u00e1rea s\u00f3 com a nota da ouvidoria, o que estreita a RN-78 para uma classe inteira de casos, e o canal aberto produz muito caso an\u00f4nimo. As duas sa\u00eddas em cima da mesa eram deixar como est\u00e1 (o anonimato pesa mais que a RN-78) ou mandar resumo e relato de caso an\u00f4nimo depois de uma pseudonimiza\u00e7\u00e3o, que hoje n\u00e3o existe nesse caminho.\n\n**Em 03/09/2026 ficou ratificada a primeira sa\u00edda: o acionamento de caso an\u00f4nimo sai s\u00f3 com a nota da ouvidoria, e o comportamento em produ\u00e7\u00e3o desde a v0.94.0 \u00e9 o comportamento decidido.** Dois fundamentos:\n\n1. **\u00c9 o lado conservador do erro.** O relato bruto do canal p\u00fablico pode trazer nome, telefone ou detalhe que identifique quem escreveu, sem que a pessoa perceba que se entregou. Vazar isso \u00e9 dano irrevers\u00edvel a quem confiou no anonimato; entregar pouco \u00e0 \u0
