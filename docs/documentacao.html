0e1rea \u00e9 dano repar\u00e1vel, porque a \u00e1rea pode voltar \u00e0 Ouvidoria pelo protocolo.\n\n2. **O projeto j\u00e1 decidiu igual na mesma encruzilhada.** A IA do relat\u00f3rio mensal recebe o agregado e nunca o relato, exatamente por causa do furo de nome em texto livre (ADR 0039, decis\u00e3o 4). Remo\u00e7\u00e3o autom\u00e1tica de identificador em texto livre erra, e a Ouvidoria n\u00e3o teria como saber que errou.\n\nO pre\u00e7o aceito \u00e9 conhecido: em uma fatia grande dos casos do canal p\u00fablico a \u00e1rea trabalha com o extrato do ouvidor e mais nada, ent\u00e3o a **qualidade do extrato passa a ser o gargalo do anonimato**, n\u00e3o um detalhe de reda\u00e7\u00e3o. \u00c9 o que a decis\u00e3o 2 j\u00e1 protege ao manter o extrato obrigat\u00f3rio, e \u00e9 o sinal a acompanhar: \u00e1rea que volta pedindo contexto com frequ\u00eancia \u00e9 a evid\u00eancia que reabre esta escolha.\n\nA pseudonimiza\u00e7\u00e3o n\u00e3o foi descartada por m\u00e9rito, foi adiada por falta de demanda comprovada. Se a \u00e1rea pedir, ela vira PRD pr\u00f3prio, com o crit\u00e9rio de qualidade da remo\u00e7\u00e3o e o que o sistema faz quando n\u00e3o tem confian\u00e7a suficiente definidos l\u00e1, e n\u00e3o aqui.\n\n## Emenda de 07/10/2026: o caso an\u00f4nimo volta a levar resumo e relato integral (issue #1051)\n\nReverte o item 1 da emenda de 01/09/2026 e a ratifica\u00e7\u00e3o de 03/09/2026 na parte do anonimato. Os itens 2 e 3 daquela emenda seguem valendo, agora s\u00f3 para o sigilo refor\u00e7ado.\n\nO sinal que a ratifica\u00e7\u00e3o mandava acompanhar apareceu: a respons\u00e1vel de um setor recebeu o caso 2026-0079 (an\u00f4nimo, sem sigilo refor\u00e7ado) s\u00f3 com a nota da ouvidoria e o aviso de que o relato n\u00e3o era encaminhado, e n\u00e3o conseguiu trabalhar o caso. Decis\u00e3o do Pedro em 07/10/2026: o setor precisa do relato integral tamb\u00e9m no caso an\u00f4nimo.\n\n1. **S\u00f3 o sigilo refor\u00e7ado protege o relato.** `caso_protegido` deixa de olhar o anonimato. Caso an\u00f4nimo sem sigilo refor\u00e7ado leva RESUMO, RELATO INTEGRAL e NOTA DA OUVIDORIA, como o caso comum, no email de acionamento, no reenvio e na tela do respons\u00e1vel, porque a montagem \u00e9 uma s\u00f3 (`montar_blocos`). Caso com sigilo refor\u00e7ado, an\u00f4nimo ou n\u00e3o, segue s\u00f3 com a nota (decis\u00e3o 3, RN-79).\n\n2. **O anonimato continua tirando quem manifestou.** A linha \"quem manifestou\" segue \"Sem identifica\u00e7\u00e3o\" no caso an\u00f4nimo (ADR 0034, decis\u00e3o 8): o que muda \u00e9 o relato, n\u00e3o o nome.\n\n3. **O aviso do caso an\u00f4nimo muda de assunto.** Deixa de dizer que relato e resumo n\u00e3o s\u00e3o encaminhados; s\u00f3 avisa que a manifesta\u00e7\u00e3o \u00e9 an\u00f4nima e pede para n\u00e3o tentar descobrir a autoria.\n\nO risco que a ratifica\u00e7\u00e3o de 03/09 apontava continua real e agora \u00e9 aceito: o relato do canal p\u00fablico pode carregar nome ou leito de quem preferiu n\u00e3o se identificar, e esse texto passa a chegar ao setor. A mitiga\u00e7\u00e3o \u00e9 a de sempre: o ouvidor sobe o sigilo refor\u00e7ado quando o relato exp\u00f5e quem escreveu.\n\nFora desta emenda: os emails de degrau, de prazo rompido e de encaminhamento a outra \u00e1rea continuam sem relato, por desenho; o caso anonimizado pela Reten\u00e7\u00e3o continua com \"relato n\u00e3o registrado\"; os casos an\u00f4nimos j\u00e1 acionados n\u00e3o s\u00e3o reenviados de of\u00edcio (a Ouvidoria usa o reenvio que j\u00e1 existe, se quiser).\n\n## Consequ\u00eancias\n\n- O relato do manifestante, em caso n\u00e3o sigiloso, passa a viajar por email, e email do sistema \u00e9 entregue por processador externo com infraestrutura fora do Brasil (ADR 0039). Risco conhecido e aceito pela Diretoria; a mitiga\u00e7\u00e3o permanente \u00e9 o sigilo refor\u00e7ado subir sempre que o tipo ou o ouvidor pedirem, e o aviso de privacidade do hospital (que o 0039 alimenta) deve refletir a mudan\u00e7a.\n- O verbete Extrato para o setor do CONTEXT.md foi reescrito nesta data.\n- A tela do respons\u00e1vel \u00e9 reorganizada na ordem da RN-59, com o relato integral aberto por padr\u00e3o.\n- De 01/09 a 07/10/2026, pela emenda ratificada em 03/09, o acionamento de caso an\u00f4nimo saiu s\u00f3 com a nota da ouvidoria. Desde a emenda de 07/10/2026, a RN-78 vale integralmente no caso comum e no an\u00f4nimo, e cede s\u00f3 ao sigilo refor\u00e7ado.\n- As hist\u00f3rias 5 e 6 do PRD #469 (relato integral aberto por padr\u00e3o, nota da ouvidoria em bloco distinto) valem para o caso comum e para o an\u00f4nimo. No caso sob sigilo refor\u00e7ado a \u00e1rea l\u00ea a nota e o aviso que diz por que o resto n\u00e3o veio. \u00c9 o resultado decidido, n\u00e3o uma entrega parcial.", "cita": [34, 42], "decisao": "At\u00e9 aqui, o respons\u00e1vel de setor lia apenas o Extrato para o setor: o texto que o ouvidor escreve com as pr\u00f3prias palavras na valida\u00e7\u00e3o. A regra existia para proteger a palavra do manifestante (nome, leito, detalhes) de viajar por email...", "emenda": [39], "emendada_por": [52, 88], "file": "docs/adr/0041-acionamento-leva-resumo-relato-integral-e-nota.md", "number": 41, "slug": "0041-acionamento-leva-resumo-relato-integral-e-nota", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O acionamento leva resumo, relato integral e nota da ouvidoria"}, {"amended_by": null, "amends": null, "body_md": "> Emenda em prosa \u00e0s decis\u00f5es 2 e 5 do ADR 0039: o manifestante passa a receber email do sistema em dois caminhos fechados (decis\u00e3o 5), e este ADR \u00e9 a decis\u00e3o expl\u00edcita que a decis\u00e3o 2 exige para os campos desses dois emails novos, o destinat\u00e1rio `manifestante_contato` e o corpo com protocolo e desfecho em linguagem simples. Sem ponteiro `amends` no frontmatter: o 0039 j\u00e1 \u00e9 emendado pelo 0041 e o lint de ADR aceita um \u00fanico ponteiro por campo, como o pr\u00f3prio 0037 fez com o 0034.\n\n\nO cat\u00e1logo de notifica\u00e7\u00f5es da Ouvidoria tem 12 gatilhos e todos s\u00e3o internos (setor, gestor, Diretoria). Depois de receber o protocolo na abertura, o manifestante nunca mais ouve do sistema: n\u00e3o h\u00e1 acuse de recebimento (D-07) e o encerramento no sistema n\u00e3o \u00e9 encerramento para o paciente (RN-80). A migration 065 excluiu o marco `acusar_recebimento` do motor de prazos \u00fateis de prop\u00f3sito, apontando que ele pertence ao cat\u00e1logo de notifica\u00e7\u00f5es; o cat\u00e1logo nunca o recebeu.\n\n## Decis\u00f5es\n\n1. **O marco `acusar_recebimento` entra na tabela de prazos em horas corridas** (RN-56): 24 horas para todas as gravidades, mesmo dia para `critico`. Fora do calend\u00e1rio \u00fatil: acuse \u00e9 promessa ao paciente e corre em rel\u00f3gio de parede. Quem reclama sexta \u00e0 noite recebe o aviso no s\u00e1bado, n\u00e3o na ter\u00e7a. \u00c9 o \u00fanico marco da tabela fora do calend\u00e1rio \u00fatil, e a unidade fica expl\u00edcita na linha.\n\n2. **O acuse sai autom\u00e1tico na abertura** quando o caso tem contato utiliz\u00e1vel, por qualquer canal. Com isso o marco fica cumprido no segundo zero e o prazo de 24h vira rede de seguran\u00e7a para falha de envio, n\u00e3o meta de trabalho manual. O acuse ignora a janela comercial das notifica\u00e7\u00f5es internas: segurar o acuse at\u00e9 a pr\u00f3xima abertura quebraria as 24 horas corridas.\n\n3. **O aviso de encerramento (RN-80) dispara na transi\u00e7\u00e3o de encerramento**, com protocolo, desfecho em linguagem simples e o canal para reabrir. Nasce como registro em `ouvidoria_notificacoes` antes do envio, como toda notifica\u00e7\u00e3o da casa. O marco T3 continua sendo `encerrada_em`.\n\n4. **v1 por email.** Caso an\u00f4nimo ou sem email utiliz\u00e1vel no contato \u00e9 encerrado sem disparo, com marca\u00e7\u00e3o pr\u00f3pria, e sai do denominador do indicador de resposta conclusiva (RN-81). O canal de origem completo (WhatsApp via plataforma da Ana, resposta p\u00fablica no Google) \u00e9 fase seguinte; a diverg\u00eancia com a letra da RN-80 fica registrada na resposta \u00e0 Diretoria.\n\n## Consequ\u00eancias\n\n- Migration nova amplia os dois CHECKs de `ouvidoria_prazos`, travados desde a migration 065: o marco `acusar_recebimento` entra na lista de marcos, e a unidade de horas corridas entra na lista de unidades.\n- Dois gatilhos novos no CHECK de `ouvidoria_notificacoes`: `acusar_recebimento` e `encerramento_manifestante`. S\u00e3o os primeiros com o manifestante como destinat\u00e1rio: a decis\u00e3o 5 do ADR 0039 deixa de valer para esses dois caminhos, e `manifestante_contato` passa a ser usado como destinat\u00e1rio exclusivamente neles. O conte\u00fado desses emails \u00e9 m\u00ednimo (protocolo, desfecho em linguagem simples, canal para reabrir), sem relato e sem identifica\u00e7\u00e3o de terceiros; a lista `_CAMPOS_DO_EMAIL` dos emails internos n\u00e3o muda por este ADR.\n- O contato do manifestante \u00e9 texto livre; o envio depende de reconhecer um email nele. O caso sem email reconhec\u00edvel segue o caminho da marca\u00e7\u00e3o pr\u00f3pria da decis\u00e3o 4.\n- O detalhe do caso e a tabela de prazos exibem o marco novo (RN-56).\n- Quando o caminho WhatsApp existir, as decis\u00f5es 3 e 4 n\u00e3o mudam: muda s\u00f3 o transporte.", "cita": [39], "decisao": "O cat\u00e1logo de notifica\u00e7\u00f5es da Ouvidoria tem 12 gatilhos e todos s\u00e3o internos (setor, gestor, Diretoria). Depois de receber o protocolo na abertura, o manifestante nunca mais ouve do sistema: n\u00e3o h\u00e1 acuse de recebimento (D-07) e o...", "emenda": [], "emendada_por": [], "file": "docs/adr/0042-retornos-ao-manifestante-acuse-e-encerramento.md", "number": 42, "slug": "0042-retornos-ao-manifestante-acuse-e-encerramento", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Retornos ao manifestante: acuse em horas corridas e aviso de encerramento"}, {"amended_by": "0049", "amends": null, "body_md": "O repo versiona em `.claude/skills/` todas as skills do ciclo de ponta a ponta (`grill-with-docs`, `to-prd`, `to-issues`, `triage`, `pegar-issue`, `tdd`, `ship`, `deploy`, mais as de apoio e as exclusivas da casa). Onze delas tamb\u00e9m existem na pasta global do Pedro (`~/.claude/skills/`) em vers\u00e3o gen\u00e9rica, e uma sess\u00e3o de limpeza pode ser tentada a \"desduplicar\" apagando as c\u00f3pias locais. N\u00e3o apague.\n\n## Decis\u00f5es\n\n1. **O repo \u00e9 autossuficiente em skills.** Um s\u00f3cio clona o reposit\u00f3rio no GitHub e recebe o workflow inteiro funcionando, sem depender de nenhuma pasta global da m\u00e1quina do Pedro. Isso \u00e9 requisito, n\u00e3o acidente.\n\n2. **A c\u00f3pia local \u00e9 a fonte de verdade do Hospital.** As skills locais carregam adapta\u00e7\u00f5es de prop\u00f3sito: vocabul\u00e1rio do `CONTEXT.md` (Reuni\u00e3o, Ata, Facilitador), comandos reais de verifica\u00e7\u00e3o (`ruff`, `pytest`, `tsc`) e refer\u00eancias aos ADRs e a `docs/agents/`. Melhoria de skill para este repo se faz aqui, na c\u00f3pia local.\n\n3. **A vers\u00e3o global \u00e9 outra linhagem.** A global \u00e9 a generaliza\u00e7\u00e3o que o Pedro usa nos demais projetos; ela delega os detalhes ao `CLAUDE.md` de cada repo. Diverg\u00eancia entre local e global n\u00e3o \u00e9 drift a corrigir, \u00e9 especializa\u00e7\u00e3o registrada. Sincronizar as duas \u00e9 decis\u00e3o humana, caso a caso, nunca limpeza autom\u00e1tica.", "cita": [], "decisao": "O repo versiona em `.claude/skills/` todas as skills do ciclo de ponta a ponta (`grill-with-docs`, `to-prd`, `to-issues`, `triage`, `pegar-issue`, `tdd`, `ship`, `deploy`, mais as de apoio e as exclusivas da casa). Onze delas tamb\u00e9m...", "emenda": [], "emendada_por": [49], "file": "docs/adr/0043-skills-locais-sao-o-kit-do-workflow.md", "number": 43, "slug": "0043-skills-locais-sao-o-kit-do-workflow", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Skills locais s\u00e3o o kit completo do workflow, duplicata com as globais \u00e9 intencional"}, {"amended_by": "0045, 0046, 0057", "amends": null, "body_md": "Em 5 meses de pipeline com agentes o reposit\u00f3rio acumulou 74 GB de worktrees mortas, PDFs de insumo na raiz, tr\u00eas c\u00f3pias da mesma fonte e do mesmo logo, HTMLs de um formato aposentado, e skills de 50 KB lidas inteiras a cada `/ship`. Uma sess\u00e3o de limpeza sem regra escrita desfaz o arranjo na sess\u00e3o seguinte (foi o que motivou o ADR 0043 para as skills). Este ADR fixa o layout.\n\n## Decis\u00f5es\n\n1. **Hist\u00f3rico \u00e9 o git.** O que sai do reposit\u00f3rio sai de vez. N\u00e3o existe pasta `_arquivo/`, `_historico/` ou equivalente: o agente l\u00ea tudo que est\u00e1 na \u00e1rvore, e material morto na \u00e1rvore custa token e induz erro. Quem precisar de uma vers\u00e3o antiga usa `git log`.\n\n2. **`local/` \u00e9 o \u00fanico lugar fora do git para insumo humano.** PDFs recebidos, transcri\u00e7\u00f5es, atas de migra\u00e7\u00e3o, rascunhos de spec, dumps de produ\u00e7\u00e3o: tudo em `local/<assunto>/`, ignorado por uma regra s\u00f3 (`/local/`). Cada m\u00e1quina cria a sua. O agente l\u00ea quando pedido. Nada mais fica solto na raiz al\u00e9m de `CLAUDE.md`, `CONTEXT.md`, `CONTEXT-MAP.md` e `skills-lock.json`.\n\n3. **`docs/comunicacao/` \u00e9 o material que vai para o diretor e para o usu\u00e1rio funcional.** Dentro: `percepcao/` (v\u00eddeos de percep\u00e7\u00e3o de valor, ADR 0026), `divulgacao/` (p\u00e1ginas de divulga\u00e7\u00e3o publicadas na Vercel) e `_assets/` (uma fonte, um logo). A composi\u00e7\u00e3o HyperFrames e o HTML s\u00e3o a fonte versionada; MP4, `renders/`, `node_modules/` e `.vercel/` s\u00e3o reger\u00e1veis e ficam fora do git. A pasta `docs/manual/` (manual do usu\u00e1rio, #563) nasceu em paralelo a este ADR e permanece onde est\u00e1 at\u00e9 o pr\u00f3ximo ciclo de comunica\u00e7\u00e3o decidir se entra aqui.\n\n4. **Uma c\u00f3pia de asset, e o deploy copia.** Fonte e logo vivem s\u00f3 em `docs/comunicacao/_assets/`. V\u00eddeos apontam para l\u00e1 por link simb\u00f3lico `assets`. P\u00e1ginas que a Vercel serve como pasta autossuficiente (divulga\u00e7\u00e3o, manual) referenciam `logo-hsm.png` e `HPSimplified_Rg.ttf` relativos, e o passo de deploy da skill copia os dois de `_assets/` para a pasta tempor\u00e1ria antes de publicar. Duplicata no git \u00e9 regress\u00e3o.\n\n5. **Skill grande carrega o raro em `references/`.** O `SKILL.md` traz o caminho comum. Modos raros (setup do zero, rollback, migra\u00e7\u00e3o de blueprint), exemplos de sa\u00edda e integra\u00e7\u00f5es opcionais v\u00e3o para `references/<nome>.md` ao lado, e o `SKILL.md` diz em uma frase quando ler cada um. A `description` no frontmatter tem at\u00e9 200 caracteres: o que faz, quando usar, sintaxe. Lista de frases-gatilho n\u00e3o entra. O conte\u00fado do passo a passo n\u00e3o muda de lugar para mudar de sentido: mover \u00e9 mover.\n\n6. **Um `.env.example` completo por lugar que l\u00ea `.env`.** `hospital-reunioes/.env.example` \u00e9 o molde do `docker-compose` local (backend + `NEXT_PUBLIC_*`). `hospital-reunioes/backend/.env.example` espelha 1:1 a classe `Settings` e \u00e9 o que o gate `env_example_sync` do `/deploy` confere. `hospital-reunioes/frontend/.env.example` serve o `pnpm dev` sem Docker. `tokens/.env.example` lista as chaves da m\u00e1quina (Coolify, GitHub, Ana). Cada chave leva um coment\u00e1rio curto. Chave que o c\u00f3digo n\u00e3o l\u00ea n\u00e3o fica no exemplo.\n\n7. **Scripts de opera\u00e7\u00e3o vivem em `backend/scripts/`**, fora da imagem de produ\u00e7\u00e3o, e rodam de dentro de `backend/` com `uv run python -m scripts.<nome>`. Script de uso \u00fanico n\u00e3o viaja no container.\n\n## Consequ\u00eancias\n\n- Uma faxina futura tem r\u00e9gua: se algo na \u00e1rvore n\u00e3o \u00e9 c\u00f3digo, doc viva, decis\u00e3o ou material de comunica\u00e7\u00e3o, ou est\u00e1 em `local/` ou sai.\n- O s\u00f3cio clona e roda: os quatro `.env.example` dizem o que preencher, e nenhuma skill depende de pasta global (ADR 0043).\n- O custo por sess\u00e3o cai: descri\u00e7\u00f5es curtas de skill e mem\u00f3ria do agente podada; o custo por `/ship` cai porque o `SKILL.md` do `/deploy` deixa de carregar os modos que quase nunca rodam.\n- O ADR 0026 cita `docs/percepcao/`; o endere\u00e7o final \u00e9 o do ADR 0045 (`docs/comunicacao/<contexto>/<PRD>-<slug>/video/`). A decis\u00e3o dele (v\u00eddeo como percep\u00e7\u00e3o, composi\u00e7\u00e3o versionada) n\u00e3o muda.", "cita": [26, 43], "decisao": "Em 5 meses de pipeline com agentes o reposit\u00f3rio acumulou 74 GB de worktrees mortas, PDFs de insumo na raiz, tr\u00eas c\u00f3pias da mesma fonte e do mesmo logo, HTMLs de um formato aposentado, e skills de 50 KB lidas inteiras a cada `/ship`. Uma...", "emenda": [], "emendada_por": [45, 46, 57], "file": "docs/adr/0044-layout-do-repositorio.md", "number": 44, "slug": "0044-layout-do-repositorio", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Layout do reposit\u00f3rio: o que fica no git, onde fica, e o que vive fora"}, {"amended_by": null, "amends": "0044, 0026", "body_md": "At\u00e9 aqui a entrega para o diretor era feita por duas skills e duas pastas: `/perceber` gerava o v\u00eddeo em `docs/comunicacao/percepcao/<contexto>/<PRD>-<slug>/` e `/divulgar` gerava a p\u00e1gina em `docs/comunicacao/divulgacao/<PRD>-<slug>/`, copiando o MP4 de uma pasta para a outra. Uma entrega, dois comandos, uma c\u00f3pia que envelhece.\n\n## Decis\u00f5es\n\n1. **Uma skill: `/divulgar <PRD> [--so-video | --so-pagina]`.** O passo 1 gera o v\u00eddeo (todo o conte\u00fado do antigo `/perceber`, incluindo o gate humano no draft). O passo 2 gera a p\u00e1gina e publica na Vercel. `--so-video` cobre o caso WhatsApp. O `/perceber` deixa de existir.\n\n2. **Uma pasta por PRD: `docs/comunicacao/<contexto>/<PRD>-<slug>/`.** Dentro: `video/` (composi\u00e7\u00e3o HyperFrames, versionada, com `assets` apontando para `../../../_assets`), `<PRD>-<slug>.mp4` na raiz (gerado, fora do git) e `index.html` (a p\u00e1gina, versionada). Isto substitui a decis\u00e3o 3 do ADR 0044, que separava `percepcao/` e `divulgacao/`: a separa\u00e7\u00e3o era por tipo de artefato, e o que o leitor procura \u00e9 a entrega.\n\n3. **O deploy copia s\u00f3 o que a p\u00e1gina precisa.** A Vercel recebe `index.html`, o MP4, `.vercel/` e os dois assets de `_assets/`. A composi\u00e7\u00e3o n\u00e3o sobe.\n\n4. **P\u00e1gina de m\u00f3dulo \u00e9 o caso especial, n\u00e3o a regra.** Quando um contexto quer uma vitrine com v\u00e1rios v\u00eddeos (hoje `ouvidoria/modulo/`), ela \u00e9 s\u00f3 uma p\u00e1gina que embute c\u00f3pias git-ignored dos MP4s dos PRDs. Regerou o v\u00eddeo de um PRD, atualiza a c\u00f3pia l\u00e1.\n\n## Consequ\u00eancias\n\n- O ADR 0026 (percep\u00e7\u00e3o em v\u00eddeo) continua valendo no que decide: composi\u00e7\u00e3o versionada, MP4 fora do git, gate humano. Muda s\u00f3 o endere\u00e7o.\n- As quatro entregas existentes (317, 318, 210, 272) e a p\u00e1gina da Ouvidoria foram movidas; nada foi regerado. A p\u00e1gina do 272 passa a embutir `272-pendencia-nasce-na-assinatura.mp4` no lugar de `demonstracao.mp4`.\n- A c\u00f3pia local dos MP4s nas pastas antigas fica \u00f3rf\u00e3 na m\u00e1quina de quem tinha; s\u00e3o reger\u00e1veis.", "cita": [], "decisao": "At\u00e9 aqui a entrega para o diretor era feita por duas skills e duas pastas: `/perceber` gerava o v\u00eddeo em `docs/comunicacao/percepcao/<contexto>/<PRD>-<slug>/` e `/divulgar` gerava a p\u00e1gina em `docs/comunicacao/divulgacao/<PRD>-<slug>/`...", "emenda": [44, 26], "emendada_por": [], "file": "docs/adr/0045-video-e-pagina-de-divulgacao-sao-uma-entrega-so.md", "number": 45, "slug": "0045-video-e-pagina-de-divulgacao-sao-uma-entrega-so", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "V\u00eddeo de percep\u00e7\u00e3o e p\u00e1gina de divulga\u00e7\u00e3o s\u00e3o uma entrega s\u00f3, numa pasta s\u00f3 por PRD"}, {"amended_by": null, "amends": "0044", "body_md": "O mapa do reposit\u00f3rio (o que \u00e9 cada pasta, por que existe, o que tem dentro, para que serve, onde as chaves moram) nasceu em `.claude/skills/setup-maquina/references/mapa-do-repo.md`, como refer\u00eancia da skill. Ali s\u00f3 o agente achava. Quem clona abre a p\u00e1gina do repo no GitHub e n\u00e3o v\u00ea nada: a raiz n\u00e3o tinha `README.md`, por decis\u00e3o do ADR 0044 (decis\u00e3o 2), que limitava a raiz a `CLAUDE.md`, `CONTEXT.md`, `CONTEXT-MAP.md` e `skills-lock.json`.\n\n## Decis\u00f5es\n\n1. **O mapa mora em `README.md`, na raiz.** \u00c9 o \u00fanico arquivo que o GitHub mostra sem clicar, e \u00e9 onde qualquer pessoa procura. A decis\u00e3o 2 do ADR 0044 passa a admitir `README.md` na lista da raiz. Nada mais muda ali: continua proibido documento paralelo de estado ou processo (`CLAUDE.md`).\n\n2. **Uma c\u00f3pia s\u00f3.** O `/setup-maquina --mapa` l\u00ea o `README.md`; o script de diagn\u00f3stico confere a lista de cobertura dele. `references/mapa-do-repo.md` deixa de existir. Um guia de organiza\u00e7\u00e3o em outro arquivo (`GUIA-DE-ORGANIZACAO.md`, `docs/ESTRUTURA.md`) \u00e9 regress\u00e3o: dois mapas, um envelhece.\n\n3. **O README abre com \"Primeiro dia\".** Clonar (ou atualizar o clone), rodar `/setup-maquina`, abrir `/ask-pedro`. O passo a passo humano continua em `docs/onboarding/`; o README aponta, n\u00e3o repete.\n\n4. **O README diz onde as chaves de produ\u00e7\u00e3o moram e quem mexe.** S\u00f3 no Coolify, por servi\u00e7o, com a lista em `docs/spec/deploy/project.json` e a confer\u00eancia pelo `/deploy setup`. Na m\u00e1quina de quem desenvolve ficam s\u00f3 os tokens do Coolify e tr\u00eas valores fict\u00edcios para o snapshot importar o app. O `/setup-maquina` deixa de comparar o `.env` local com o `.env.example`: chave a mais ou a menos no local n\u00e3o muda o pipeline.\n\n## Consequ\u00eancias\n\n- O `/setup-maquina` passa a acusar clone com a `main` atr\u00e1s da `origin/main`, com o `git pull --ff-only` como conserto. O script s\u00f3 diagnostica; quem puxa \u00e9 a skill, com confirma\u00e7\u00e3o.\n- Pasta nova no repo entra no `README.md` no mesmo commit; o script avisa quando falta.\n- O ADR 0044 continua valendo em tudo o mais.", "cita": [], "decisao": "O mapa do reposit\u00f3rio (o que \u00e9 cada pasta, por que existe, o que tem dentro, para que serve, onde as chaves moram) nasceu em `.claude/skills/setup-maquina/references/mapa-do-repo.md`, como refer\u00eancia da skill. Ali s\u00f3 o agente achava. Quem...", "emenda": [44], "emendada_por": [], "file": "docs/adr/0046-readme-e-o-mapa-do-repositorio.md", "number": 46, "slug": "0046-readme-e-o-mapa-do-repositorio", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O `README.md` da raiz \u00e9 o mapa do reposit\u00f3rio"}, {"amended_by": null, "amends": "0034", "body_md": "Decis\u00e3o do Pedro (04/set/2026, grilling a partir do pedido do diretor): a Ouvidoria ganha dois atos sobre o caso encerrado, **arquivar** (esconde da lista, tem volta) e **apagar** (some o relato, n\u00e3o tem volta). O \"apagar totalmente\" que o diretor pediu **n\u00e3o apaga a linha** da manifesta\u00e7\u00e3o nem a tira dos n\u00fameros: ele faz hoje, por ato humano, o que a Reten\u00e7\u00e3o do ADR 0034 faria em cinco anos.\n\n## Contexto\n\nO ADR 0034 fez a trilha do caso imut\u00e1vel (trigger recusa UPDATE e DELETE em `ouvidoria_movimentos`), amarrou toda tabela filha \u00e0 manifesta\u00e7\u00e3o com `ON DELETE RESTRICT` e criou a Reten\u00e7\u00e3o: cinco anos depois do encerramento, o Dossi\u00ea some e o caso vira estat\u00edstica. A migration 079 abriu na trilha uma \u00fanica fresta, zerar `observacao` de caso encerrado h\u00e1 mais de cinco anos, e \u00e9 por ela que a Reten\u00e7\u00e3o passa.\n\nO diretor quer poder apagar reclama\u00e7\u00f5es, principalmente encerradas, ou pelo menos esconder da lista. Um DELETE de verdade exigiria derrubar as travas de prop\u00f3sito do 0034 e faria um relat\u00f3rio quinzenal j\u00e1 enviado deixar de bater com o banco.\n\n## Decis\u00f5es\n\n1. **Apagar = Reten\u00e7\u00e3o antecipada.** A `diretoria_executiva` marca o caso encerrado, um por vez, com motivo escrito obrigat\u00f3rio. O mesmo servi\u00e7o da Reten\u00e7\u00e3o varre os mesmos cinco lugares (manifesta\u00e7\u00e3o, anexos, `observacao` da trilha, texto das tentativas e prorroga\u00e7\u00f5es, `detalhe` das notifica\u00e7\u00f5es). Ficam o protocolo, a trilha, as datas, o tipo, a \u00e1rea, a gravidade e o desfecho. O ato entra na trilha com autor e motivo. Rejeitado: DELETE da linha (abre a porta para sumir com reclama\u00e7\u00e3o inc\u00f4moda e quebra a presta\u00e7\u00e3o de contas).\n\n2. **A trava da trilha ganha uma segunda chave.** A guarda de UPDATE (migration 079) passa a aceitar zerar `observacao` tamb\u00e9m do caso que a Diretoria marcou para apagar, al\u00e9m do caso com cinco anos. DELETE continua barrado sem exce\u00e7\u00e3o.\n\n3. **S\u00f3 a Diretoria apaga; os dois pap\u00e9is arquivam.** Apagar n\u00e3o volta, ent\u00e3o fica com quem responde pelo hospital. O `ouvidor` sozinho n\u00e3o pode sumir com o relato de um caso sobre a pr\u00f3pria equipe. Super admin continua de fora (RN-40).\n\n4. **Arquivar \u00e9 organiza\u00e7\u00e3o da lista, n\u00e3o fato do caso.** S\u00f3 caso `encerrado` arquiva, por caso ou em lote. N\u00e3o muda estado, n\u00e3o grava movimento (acenderia novidade), n\u00e3o sai das m\u00e9tricas. A lista nasce sem arquivados e os mostra atr\u00e1s de um filtro. Caso apagado entra no arquivo sozinho.\n\n5. **Caso apagado n\u00e3o reabre.** Reabrir por reincid\u00eancia exige o relato para a \u00e1rea trabalhar. Vale para os dois apagados, o da Diretoria e o dos cinco anos. Quem volta abre caso novo. O Dossi\u00ea de caso apagado mostra o aviso (quando, quem, motivo) no lugar do relato.\n\n## Consequ\u00eancias\n\n- Hoje nada no app l\u00ea `anonimizada_em`, porque nenhum caso tem cinco anos. Com a porta antecipada, o Dossi\u00ea, a reabertura e a lista passam a ler o carimbo. Isso conserta de gra\u00e7a o comportamento da Reten\u00e7\u00e3o dos cinco anos, que hoje abriria como caso de relato vazio.\n- O prazo de cinco anos continua escrito em dois lugares (`ANOS_DE_RETENCAO` e a guarda da migration 079); a segunda chave da trava tamb\u00e9m fica nos dois.", "cita": [], "decisao": "Decis\u00e3o do Pedro (04/set/2026, grilling a partir do pedido do diretor): a Ouvidoria ganha dois atos sobre o caso encerrado, **arquivar** (esconde da lista, tem volta) e **apagar** (some o relato, n\u00e3o tem volta). O \"apagar totalmente\" que o...", "emenda": [34], "emendada_por": [], "file": "docs/adr/0047-apagar-manifestacao-e-retencao-antecipada-nao-delete.md", "number": 47, "slug": "0047-apagar-manifestacao-e-retencao-antecipada-nao-delete", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Apagar manifesta\u00e7\u00e3o \u00e9 reten\u00e7\u00e3o antecipada, n\u00e3o DELETE"}, {"amended_by": "0055", "amends": "0034", "body_md": "Decis\u00e3o do Pedro (04/set/2026, grilling a partir do \u00e1udio do diretor): a \u00e1rea que recebe um caso que n\u00e3o \u00e9 dela **devolve ao ouvidor**, com motivo obrigat\u00f3rio, pela pr\u00f3pria tela do link. O caso volta a \"em classifica\u00e7\u00e3o\", o ouvidor reaciona a \u00e1rea certa pela tela de valida\u00e7\u00e3o j\u00e1 preenchida, e o reacionamento grava **T1 novo com prazo cheio**. O tempo perdido com a \u00e1rea errada fica na conta da Ouvidoria.\n\n## Contexto\n\nO ADR 0034 (decis\u00e3o 4) fez do link tokenizado o portal do setor, e o PRD #318 fixou dois bot\u00f5es na tela do respons\u00e1vel (RN-62): responder e pedir prorroga\u00e7\u00e3o. A \u00e1rea n\u00e3o tinha como dizer \"n\u00e3o \u00e9 meu\". O caminho hoje \u00e9 torto: a Recep\u00e7\u00e3o escreve na resposta que o caso \u00e9 do m\u00e9dico, o ouvidor encerra e abre outro protocolo. A trilha se parte em dois casos e o manifestante ganha dois n\u00fameros.\n\nO diretor pediu: \"a recep\u00e7\u00e3o percebe que n\u00e3o \u00e9 dela, devolve, para o ouvidor encaminhar para outro destinat\u00e1rio\". Quatro coisas do modelo pesaram na forma:\n\n- A \u00e1rea nunca escolhe a \u00e1rea (gloss\u00e1rio, Canal aberto e Valida\u00e7\u00e3o e acionamento).\n- T1 \u00e9 o marco da valida\u00e7\u00e3o e abre o prazo da \u00e1rea; o trecho T0 at\u00e9 T1 \u00e9 a Triagem da Ouvidoria e T1 at\u00e9 T2 \u00e9 o tempo da \u00e1rea (ouvidoria_marcos).\n- A m\u00e1quina de estados j\u00e1 tem o la\u00e7o da devolu\u00e7\u00e3o por insufici\u00eancia, na dire\u00e7\u00e3o contr\u00e1ria (ouvidor devolve resposta fraca ao mesmo setor, meio prazo).\n- A RN-59 fixa a ordem da tela do respons\u00e1vel, porque quem a abre \u00e9 o usu\u00e1rio menos treinado do m\u00f3dulo.\n\n## Decis\u00f5es\n\n1. **Volta a \"em classifica\u00e7\u00e3o\", sem estado novo.** A transi\u00e7\u00e3o `aguardando_area -> em_classificacao` entra no grafo. O caso devolvido \u00e9 um caso a despachar de novo, e a fila, o Dossi\u00ea e o bot\u00e3o de validar j\u00e1 sabem lidar com isso. Rejeitado: estado pr\u00f3prio \"devolvido pela \u00e1rea\" (vis\u00edvel na fila, mas todo relat\u00f3rio, sem\u00e1foro e contador teria que aprender o estado; a fila em classifica\u00e7\u00e3o j\u00e1 \u00e9 a fila de quem espera o ouvidor).\n\n2. **T1 novo e prazo cheio no reacionamento.** Reacionar passa pela mesma porta da valida\u00e7\u00e3o e carimba `validada_em` de novo; o motor calcula o prazo da \u00e1rea certa do zero. O trecho da Triagem passa a conter o desvio. Rejeitado: manter o T1 original e a \u00e1rea certa herdar o prazo restante (o relat\u00f3rio mostraria a \u00e1rea certa atrasada por culpa de quem despachou errado; a Ouvidoria, que errou o destino, sairia limpa). A primeira valida\u00e7\u00e3o continua na trilha, ent\u00e3o o hist\u00f3rico n\u00e3o se perde.\n\n3. **A \u00e1rea n\u00e3o aponta destino.** S\u00f3 o motivo, em texto livre. Se quiser, escreve ali \"acho que \u00e9 do Centro M\u00e9dico\". Rejeitado: campo com lista de setores na tela p\u00fablica (exp\u00f5e a taxonomia sem login e d\u00e1 \u00e0 \u00e1rea uma decis\u00e3o que \u00e9 do ouvidor).\n\n4. **Reacionar \u00e9 pr\u00e9-preenchido.** O Dossi\u00ea mostra \"Devolvido pela Recep\u00e7\u00e3o: motivo\" e o bot\u00e3o de encaminhar abre a valida\u00e7\u00e3o com tipo, gravidade e extrato do acionamento anterior. O ouvidor troca a \u00e1rea e confirma. Tudo continua edit\u00e1vel.\n\n5. **Link discreto, n\u00e3o terceiro bot\u00e3o.** \"Este caso n\u00e3o \u00e9 do meu setor?\" abaixo dos dois bot\u00f5es, \u00faltimo elemento da RN-59, que passa a ter onze. Ao clicar, abre o campo do motivo e o bot\u00e3o de devolver. Rejeitado: bot\u00e3o do mesmo peso (aperta o celular e convida a devolver por pregui\u00e7a).\n\n6. **Motivo obrigat\u00f3rio, sem piso, teto de 10.000.** O motivo de \"n\u00e3o \u00e9 meu\" \u00e9 curto por natureza; o teto \u00e9 o dos outros textos da \u00e1rea, porque ele vai para a trilha imut\u00e1vel. Devolver consome o link (uso \u00fanico, como responder) e s\u00f3 vale em `aguardando_area`.\n\n7. **Sem limite de devolu\u00e7\u00f5es, sem relat\u00f3rio nesta leva.** A cada volta h\u00e1 o ouvidor decidindo. A trilha guarda cada devolu\u00e7\u00e3o com o motivo, e o Dossi\u00ea mostra a contagem. Linha no relat\u00f3rio mensal fica para quando houver hist\u00f3rico.\n\n## Consequ\u00eancias\n\n- Nasce um gatilho interno de notifica\u00e7\u00e3o (a Ouvidoria \u00e9 avisada da devolu\u00e7\u00e3o) e um movimento novo na trilha. A \u00e1rea que devolveu n\u00e3o recebe nada.\n- A guarda que separa acionamento de devolu\u00e7\u00e3o por insufici\u00eancia na rota de validar continua valendo: o reacionamento chega de `em_classificacao`, ent\u00e3o n\u00e3o \u00e9 devolu\u00e7\u00e3o.\n- O teste \"apenas os dois bot\u00f5es da RN-62\" muda de prop\u00f3sito: passa a garantir dois bot\u00f5es mais o link discreto.\n- Quem l\u00ea m\u00e9tricas de Triagem ver\u00e1 o trecho crescer nos casos devolvidos. \u00c9 o efeito desejado: despacho errado \u00e9 custo da Ouvidoria.\n- Reincid\u00eancia e devolu\u00e7\u00e3o por insufici\u00eancia n\u00e3o mudam.", "cita": [], "decisao": "Decis\u00e3o do Pedro (04/set/2026, grilling a partir do \u00e1udio do diretor): a \u00e1rea que recebe um caso que n\u00e3o \u00e9 dela **devolve ao ouvidor**, com motivo obrigat\u00f3rio, pela pr\u00f3pria tela do link. O caso volta a \"em classifica\u00e7\u00e3o\", o ouvidor...", "emenda": [34], "emendada_por": [55], "file": "docs/adr/0048-devolucao-a-ouvidoria-volta-a-classificacao-e-t1-novo.md", "number": 48, "slug": "0048-devolucao-a-ouvidoria-volta-a-classificacao-e-t1-novo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Devolu\u00e7\u00e3o \u00e0 Ouvidoria volta o caso \u00e0 classifica\u00e7\u00e3o, e o reacionamento carimba T1 novo"}, {"amended_by": null, "amends": "0027, 0043", "body_md": "O ADR 0027 deixou a `wayfinder` **preparada, n\u00e3o instalada**: a se\u00e7\u00e3o \"Wayfinding operations\" entrou em `docs/agents/issue-tracker.md`, e a skill em si s\u00f3 entraria quando aparecesse o primeiro \u00e9pico com n\u00e9voa multi-sess\u00e3o. O gatilho ainda n\u00e3o apareceu. A skill entra assim mesmo, por decis\u00e3o do Pedro, e o motivo que sustentava o adiamento deixou de valer.\n\n## Por qu\u00ea\n\nO custo que o 0027 queria evitar era **context load permanente**: uma skill a mais competindo pela aten\u00e7\u00e3o do modelo em toda sess\u00e3o. A vers\u00e3o upstream da `wayfinder` declara `disable-model-invocation: true`, igual ao `/ask-pedro` e ao `/improve-codebase-architecture`. Com isso ela n\u00e3o \u00e9 carregada por iniciativa do modelo: s\u00f3 entra quando o humano digita `/wayfinder`. O custo passa a ser o de um arquivo no reposit\u00f3rio, n\u00e3o o de um item permanente no contexto.\n\nO segundo motivo \u00e9 de disponibilidade. O gatilho do 0027 \u00e9 \"o primeiro \u00e9pico com n\u00e9voa\", e \u00e9 exatamente na hora desse \u00e9pico que ningu\u00e9m quer parar para importar, traduzir e adaptar uma skill. Adaptada e versionada agora, ela est\u00e1 pronta quando o caso chegar.\n\nA porta da frente do planejamento **n\u00e3o muda**: continua sendo `/grill-with-docs`. A `wayfinder` \u00e9 on-ramp situacional, para o que n\u00e3o couber numa sess\u00e3o de grilling. O `/ask-pedro` roteia com essa ressalva escrita.\n\n## O que a adapta\u00e7\u00e3o preservou\n\nConforme o 0027 j\u00e1 determinava: narra\u00e7\u00e3o e corpo de issue em pt-BR, labels `wayfinder:map` e `wayfinder:<tipo>` em ingl\u00eas, handoff final para `/to-prd` e `/to-issues` (n\u00e3o o `to-spec`/`to-tickets` do upstream), e tickets wayfinder fora da m\u00e1quina de estados do `/triage`, sem `ready-for-agent`, para que as duas filas n\u00e3o colidam.\n\n## O `skills-lock.json` passa a fixar `ref`\n\nAuditoria do lock contra o upstream mostrou que 3 dos 8 `skillPath` registrados respondiam **404**: o upstream renomeou `diagnose` para `diagnosing-bugs` (12/06/2026) e unificou `to-prd` e `to-issues` em `to-spec` e `to-tickets` (08/07/2026). O lock n\u00e3o guardava o commit de origem, ent\u00e3o os caminhos eram resolvidos contra o `main` de hoje, onde as pastas n\u00e3o existem mais.\n\nA decis\u00e3o: **cada entrada do lock guarda o `ref`**, o commit de origem da importa\u00e7\u00e3o. Com o `ref`, o caminho volta a ser v\u00e1lido (`git show <ref>:<skillPath>`), o rename vira hist\u00f3rico em vez de link quebrado, e o `computedHash` passa a descrever uma \u00e1rvore identific\u00e1vel. Os hashes das 8 entradas existentes foram conferidos contra o upstream e batem exatamente com a \u00e1rvore do `ref` registrado, ent\u00e3o nenhum valor foi reescrito: s\u00f3 o `ref` foi acrescentado.\n\nQuatro skills que vieram do mesmo upstream estavam fora do lock (`codebase-design`, `domain-modeling`, `research` e `resolver-conflitos`, esta \u00faltima do upstream `resolving-merge-conflicts`) e entram com o `ref` da data em que chegaram ao reposit\u00f3rio.\n\nO lock continua sendo **rastreabilidade, n\u00e3o instala\u00e7\u00e3o** (ADR 0043): as skills v\u00eam no clone, adaptadas em pt-BR, e o lock diz de onde cada uma saiu.\n\n## Consequ\u00eancias\n\n- `npx skills add mattpocock/skills --copy`, o comando citado em `docs/ARQUITETURA.md` e no onboarding, traz hoje os **nomes novos** do upstream. Rod\u00e1-lo cria pastas paralelas (`diagnosing-bugs`, `to-spec`, `to-tickets`) em vez de atualizar as nossas. Atualizar uma skill do Pocock \u00e9 trabalho manual: comparar com o `ref` do lock, trazer o que interessa, manter a adapta\u00e7\u00e3o em pt-BR e regravar `ref` e `computedHash`.\n- A diverg\u00eancia com o upstream \u00e9 **intencional e permanente** (ADR 0043). O lock mede a dist\u00e2ncia; n\u00e3o existe meta de zer\u00e1-la.\n- A `wayfinder` n\u00e3o mergeia e n\u00e3o sobe nada: o invariante \"subir para produ\u00e7\u00e3o \u00e9 decis\u00e3o humana\" n\u00e3o \u00e9 tocado.", "cita": [], "decisao": "O ADR 0027 deixou a `wayfinder` **preparada, n\u00e3o instalada**: a se\u00e7\u00e3o \"Wayfinding operations\" entrou em `docs/agents/issue-tracker.md`, e a skill em si s\u00f3 entraria quando aparecesse o primeiro \u00e9pico com n\u00e9voa multi-sess\u00e3o. O gatilho ainda...", "emenda": [27, 43], "emendada_por": [], "file": "docs/adr/0049-wayfinder-instalada-e-lock-com-ref.md", "number": 49, "slug": "0049-wayfinder-instalada-e-lock-com-ref", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A wayfinder entra instalada no clone, e o `skills-lock.json` fixa o commit de origem"}, {"amended_by": "0077, 0084", "amends": null, "body_md": "> Nasceu como 0049 no grilling de 08/09/2026, na \u00e1rvore local. O n\u00famero 0049 j\u00e1 tinha sido tomado no `origin/main` pela ADR da wayfinder, ent\u00e3o esta cedeu o n\u00famero e virou 0050 em 09/09/2026. O PRD #634 e a issue #636 citam 0050.\n\n\nDecis\u00e3o do Pedro (08/set/2026, grilling): a conversa entre a Vitta e o diretor sobre as aplica\u00e7\u00f5es (hoje no WhatsApp, onde se perdia) vira a aba **Tecnologia** da \u00e1rea admin do app, com uma entidade pr\u00f3pria, a **Demanda**, um Kanban de cinco estados e uma Conversa por card. S\u00f3 quem \u00e9 Super admin v\u00ea a aba. Nada disso encosta nas Pend\u00eancias de Ata.\n\n## Contexto\n\nO Pedro e o diretor trocam dezenas de pedidos por WhatsApp: perguntas de decis\u00e3o sobre a Ana, cobran\u00e7as a terceiros (Global Health, analista de TI), defeitos, testes, pedidos de mudan\u00e7a. O diretor n\u00e3o consegue responder algumas, pede outras, e as duas pontas se perdem. O pedido inicial era um site pr\u00f3prio na Vercel com banco pr\u00f3prio, no visual do Ana OS em azul claro.\n\nFatos que pesaram:\n\n- O app do hospital roda em Coolify na VPS, com Supabase self-hosted e login pelo Supabase Auth. N\u00e3o est\u00e1 na Vercel.\n- Na Vercel, o plano Hobby \u00e9 s\u00f3 para uso pessoal; um site da Vitta para o hospital exigiria o plano Pro. O banco seria Neon pelo Marketplace (Vercel Postgres acabou em dez/2024).\n- \"Pend\u00eancia\" \u00e9 termo reservado do gloss\u00e1rio (a\u00e7\u00e3o de Ata com respons\u00e1vel e prazo). \"TI\", no programa Ana, \u00e9 o analista de TI do hospital, um terceiro.\n- O perfil da Ouvidoria (`perfil_ouvidoria` em `participantes`) \u00e9 o molde de eixo de permiss\u00e3o \u00e0 parte, concedido pelo Super admin.\n\n## Decis\u00f5es\n\n1. **Dentro do app, n\u00e3o num site pr\u00f3prio.** Um login s\u00f3 para o diretor, o banco e o e-mail (Resend) j\u00e1 existem, e o deploy \u00e9 o mesmo. Rejeitado: site pr\u00f3prio na Vercel com Neon (segundo link e segunda senha para o diretor, plano Pro para uso comercial, mais uma infraestrutura para a Vitta manter). Custo aceito: cada s\u00f3cio da Vitta que for usar precisa de conta no app do hospital, e cada mudan\u00e7a segue o pipeline do repo.\n\n2. **S\u00f3 `is_super_admin` v\u00ea a aba.** Rejeitado: eixo pr\u00f3prio de permiss\u00e3o no molde da Ouvidoria (`perfil_tecnologia` com pap\u00e9is hospital e vitta). Consequ\u00eancia assumida: s\u00f3cio da Vitta que usar a aba \u00e9 Super admin do app, com poder irrestrito. O lado de cada pessoa (hospital ou Vitta) n\u00e3o \u00e9 dado do sistema: aparece pelo autor e pelo respons\u00e1vel de cada Demanda.\n\n3. **Entidade \"Demanda\", aba \"Tecnologia\".** Tipo em lista fechada de sete (Decis\u00e3o, Informa\u00e7\u00e3o, Terceiro, Ajuste, Novo, Defeito, Consultoria), cada um com s\u00edmbolo desenhado. Rejeitado: \"Pedido\" (fraco para o que a Vitta pede ao diretor) e \"Demandas TI\" (colide com o analista de TI).\n\n4. **Produto com dono.** Cada Demanda pertence a um Produto (Ana, Integra\u00e7\u00e3o Ana x MV, Reuni\u00f5es, Ouvidoria, POPs, Site, Infra; lista edit\u00e1vel pelo Super admin) e nasce atribu\u00edda ao dono do Produto, do lado da Vitta, que pode repassar.\n\n5. **Kanban de cinco estados** (Nova, Em andamento, Aguardando, Conclu\u00edda, Cancelada), com Respons\u00e1vel, Prioridade em tr\u00eas n\u00edveis e Prazo opcional. Sem prazo o card n\u00e3o atrasa, s\u00f3 envelhece (idade em dias, vermelha a partir de 14). Rejeitado: tr\u00eas estados com o campo \"com quem est\u00e1\" virando sozinho a cada resposta (mais fiel ao WhatsApp, mas o Pedro preferiu colunas).\n\n6. **Conversa por card, com @men\u00e7\u00e3o, e \"Copiar para IA\".** O bot\u00e3o copia a Demanda inteira (t\u00edtulo, tipo, produto, descri\u00e7\u00e3o e a Conversa) em texto simples, para o diretor colar na IA dele e voltar com a resposta. E-mail em tr\u00eas gatilhos: atribui\u00e7\u00e3o (inclui a cria\u00e7\u00e3o), @men\u00e7\u00e3o e resposta nova numa Demanda de que a pessoa \u00e9 respons\u00e1vel. Rejeitado: e-mail por mudan\u00e7a de coluna e resumo di\u00e1rio.\n\n7. **Tr\u00eas abas:** Quadro (as colunas, Conclu\u00edda e Cancelada recolhidas, filtros por tipo, produto e respons\u00e1vel), Minha vez (o que espera por quem est\u00e1 logado) e Hist\u00f3rico (conclu\u00eddas e canceladas, com busca).\n\n8. **Visual do pr\u00f3prio app** (Tailwind e lucide). Rejeitado: o Ledger do Ana OS recolorido de azul-piscina, que era o pedido inicial; o Pedro preferiu uma cara s\u00f3 no sistema.\n\n9. **Atualiza\u00e7\u00e3o por consulta peri\u00f3dica** (a cada 30 segundos e ao voltar o foco). Rejeitado: Supabase Realtime, pe\u00e7a a mais para 5 pessoas.\n\n10. **Sem integra\u00e7\u00e3o com o Ana OS.** As Demandas nascem \u00e0 m\u00e3o; as primeiras s\u00e3o as seis perguntas ao diretor sobre o encerramento de conversas da Ana (Decis\u00e3o, produto Ana). Rejeitado: importar os itens \"aguardando\" do `roadmap.json`.\n\n11. **Todos iguais dentro da aba.** Quem entra cria, edita, move, atribui e responde. Nada se apaga: a sa\u00edda \u00e9 Cancelada. Cada movimento vira linha autom\u00e1tica na Conversa, com quem e quando. Rejeitado: s\u00f3 a Vitta move e atribui.\n\n## Consequ\u00eancias\n\n- Tabelas novas por migration no Supabase do app (Demanda, Produto, Conversa), separadas das tabelas de Pend\u00eancia. Nenhum relat\u00f3rio, painel ou e-mail das Pend\u00eancias l\u00ea essas tabelas.\n- O gloss\u00e1rio ganhou a se\u00e7\u00e3o \"Tecnologia\" com Demanda, Tipo da Demanda, Produto, Estado da Demanda e Conversa da Demanda.\n- A tela de Usu\u00e1rios n\u00e3o muda: o acesso \u00e9 o `is_super_admin` que j\u00e1 existe.", "cita": [], "decisao": "Decis\u00e3o do Pedro (08/set/2026, grilling): a conversa entre a Vitta e o diretor sobre as aplica\u00e7\u00f5es (hoje no WhatsApp, onde se perdia) vira a aba **Tecnologia** da \u00e1rea admin do app, com uma entidade pr\u00f3pria, a **Demanda**, um Kanban de...", "emenda": [], "emendada_por": [77, 84], "file": "docs/adr/0050-demandas-de-tecnologia-moram-no-app-apartadas-das-pendencias.md", "number": 50, "slug": "0050-demandas-de-tecnologia-moram-no-app-apartadas-das-pendencias", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Demandas de tecnologia moram no app do hospital, s\u00f3 para Super admin, apartadas das Pend\u00eancias"}, {"amended_by": null, "amends": "0039", "body_md": "Decis\u00e3o do Pedro (09/set/2026, grilling a partir de duas d\u00favidas do diretor; PRD #646). O e-mail que chega em `ouvidoria@hospitalsaomatheus.com.br` passa a entrar no app, mas **n\u00e3o como canal aberto**: cai numa [Triagem de e-mail], onde o ouvidor decide se vira manifesta\u00e7\u00e3o, se junta a um caso que j\u00e1 existe ou se \u00e9 descartado. O transporte \u00e9 uma c\u00f3pia por regra de roteamento do Google Workspace para um subdom\u00ednio de recebimento do Resend, o mesmo processador que j\u00e1 entrega os e-mails do app.\n\n## Contexto\n\n- Hoje o canal `email` \u00e9 registro manual: o ouvidor l\u00ea a caixa no Gmail e digita o caso. Nenhum ADR, issue ou nota de deploy tratava de e-mail de entrada. O diretor perguntou se a caixa j\u00e1 estava integrada e se dava para integrar.\n- O formul\u00e1rio p\u00fablico e o QR (Canal aberto, ADR 0036) criam o caso direto, \"em classifica\u00e7\u00e3o\", sem tipo e sigiloso por padr\u00e3o (ADR 0037). Isso funciona porque o formul\u00e1rio tem honeypot, rate limit e campos definidos: quem chega ali quis manifestar.\n- E-mail n\u00e3o tem nada disso. A mesma caixa recebe spam, newsletter, resposta de \u00e1rea, e-mail interno e a segunda mensagem de quem j\u00e1 tem protocolo. E manifesta\u00e7\u00e3o, uma vez criada, **n\u00e3o se apaga** (ADR 0047): o que entrar errado fica na estat\u00edstica para sempre.\n- O ADR 0039 registrou que todo e-mail do m\u00f3dulo **sai** pelo Resend, fora do Brasil, e fechou campo a campo o que atravessa a fronteira. Ele n\u00e3o previa e-mail **entrando** pelo mesmo processador.\n- Pesquisa em fonte prim\u00e1ria (09/09/2026, docs do Resend e do Google Workspace): o Resend recebe e-mail por dom\u00ednio inteiro via MX, e recomenda subdom\u00ednio; a Gmail API exige projeto no Google Cloud, delega\u00e7\u00e3o por super admin e renova\u00e7\u00e3o da escuta a cada 7 dias; IMAP exige senha de app que morre na troca de senha. O Google Workspace tem regra de roteamento pelo admin que copia o que chega num endere\u00e7o para outro, sem verifica\u00e7\u00e3o e sem depender do usu\u00e1rio da caixa.\n\n## Decis\u00f5es\n\n1. **E-mail recebido n\u00e3o \u00e9 Canal aberto. Passa pela Triagem de e-mail.** Cada e-mail vira um item de triagem que s\u00f3 o Perfil da Ouvidoria v\u00ea. O ouvidor tem tr\u00eas a\u00e7\u00f5es: virar manifesta\u00e7\u00e3o, juntar a um caso existente, descartar. Nenhum e-mail vira caso sem esse ato. O motivo \u00e9 o ADR 0047: o filtro tem de vir antes do que n\u00e3o se apaga.\n2. **Virar manifesta\u00e7\u00e3o abre o registro manual que j\u00e1 existe, pr\u00e9-preenchido.** Canal `email`, T0 igual \u00e0 data do e-mail (n\u00e3o a do clique, como j\u00e1 vale para telefone), nome e contato do remetente, corpo como relato, anexos do e-mail como anexos do caso. O ouvidor escolhe o tipo e salva: o caso nasce classificado, como o telefone hoje. N\u00e3o se cria um segundo caminho de cria\u00e7\u00e3o.\n3. **Nada responde na chegada.** O \u00fanico e-mail que o manifestante recebe \u00e9 o acuse de recebimento do ADR 0042, que sai quando o e-mail vira caso, com protocolo. Resposta autom\u00e1tica na chegada responderia a spam e a rob\u00f4, abriria loop de auto-resposta e mandaria dois e-mails para a mesma pessoa. A contrapartida \u00e9 operacional: a triagem tem de ser di\u00e1ria, e o e-mail novo acende o ponto de novidade da fila.\n4. **Juntar a um caso existente grava Movimento, n\u00e3o estado.** A resposta ao acuse e a segunda mensagem sobre o mesmo protocolo s\u00e3o o gesto mais comum de quem reclama por e-mail. Juntar p\u00f5e texto e anexos na trilha do caso, sem mudar estado nem prazo. Se o assunto traz o protocolo, o app sugere o caso; a escolha \u00e9 do ouvidor.\n5. **Descartado guarda s\u00f3 o cabe\u00e7alho.** Remetente, assunto, data, quem descartou e quando. Corpo e anexos s\u00e3o apagados. Item descartado n\u00e3o \u00e9 manifesta\u00e7\u00e3o, ent\u00e3o o ADR 0047 n\u00e3o o alcan\u00e7a, e o corpo de um e-mail pode carregar nome, CPF e leito sem uso nenhum. O cabe\u00e7alho basta para responder \"sumiu o e-mail de fulano, quem descartou?\".\n6. **O transporte \u00e9 c\u00f3pia por roteamento do Workspace mais Resend Inbound, num subdom\u00ednio do dom\u00ednio que o app j\u00e1 controla.** O admin do Workspace do hospital cria a regra: o que chega em `ouvidoria@hospitalsaomatheus.com.br` vai tamb\u00e9m para `ouvidoria@inbound.hospitalsaomatheus.cloud`, com a caixa original continuando a receber. O subdom\u00ednio \u00e9 verificado no Resend com MX pr\u00f3prio, e o Resend chama um webhook do app. O endere\u00e7o p\u00fablico n\u00e3o muda, a caixa humana continua viva, e nada depende de senha, token, cron ou consentimento OAuth. O webhook valida a assinatura, deduplica pelo identificador do evento, e busca corpo e anexos pela API **na hora**, porque o Resend guarda o e-mail por 30 dias e depois apaga.\n\n## Alternativas consideradas\n\n- **E-mail como Canal aberto (vira caso direto)**: rejeitado. Spam e resposta interna virariam manifesta\u00e7\u00e3o, e manifesta\u00e7\u00e3o n\u00e3o se apaga.\n- **Resposta autom\u00e1tica na chegada**: rejeitado. Loop com rob\u00f4s, dois e-mails para a mesma pessoa, e o acuse do ADR 0042 j\u00e1 cumpre o papel.\n- **Gmail API (push ou polling)**: rejeitado por pe\u00e7a m\u00f3vel. Projeto no Google Cloud, delega\u00e7\u00e3o por super admin e cron de renova\u00e7\u00e3o para uma equipe sem opera\u00e7\u00e3o.\n- **IMAP com senha de app**: rejeitado. Sess\u00e3o curta e credencial que morre na troca de senha da caixa.\n- **Trocar o MX do dom\u00ednio do hospital para o Resend**: rejeitado. Sequestraria todo o e-mail do hospital, n\u00e3o s\u00f3 a Ouvidoria.\n- **Encaminhamento configurado pelo usu\u00e1rio da caixa** (em vez de regra do admin): n\u00e3o descartado, \u00e9 a reserva. Exige confirmar o endere\u00e7o de destino por link, que chega no painel do Resend.\n\n## Consequ\u00eancias\n\n- O Resend passa a ser processador tamb\u00e9m do que **entra**. O corpo cru do e-mail do manifestante, com o que ele quis escrever, atravessa a fronteira de fora para dentro. O ADR 0039 fecha o que sai; este ADR registra que o que entra chega inteiro, e \u00e9 o app que decide o que fica (decis\u00f5es 2 e 5). O aviso de privacidade do hospital precisa citar o e-mail como canal que passa pelo processador.\n- Cada e-mail recebido conta na cota do Resend (plano Free: 100 por dia, enviados e recebidos juntos). Conferir o plano antes de ligar a regra \u00e9 pr\u00e9-requisito humano.\n- Dois passos s\u00e3o humanos e ficam fora do c\u00f3digo: a regra de roteamento no admin do Workspace e a confirma\u00e7\u00e3o do plano do Resend. O PRD os registra como issues `ready-for-human`.\n- O canal de origem `email` n\u00e3o muda de significado: continua sendo \"chegou por e-mail e o ouvidor registrou\". O que muda \u00e9 que o registro agora nasce pr\u00e9-preenchido.\n- Ficam fora deste ADR, mas nasceram na mesma conversa: a aba de Ouvidoria no site do hospital (o s\u00f3cio do Pedro implementa, o app entrega o kit) e a resposta padr\u00e3o nas avalia\u00e7\u00f5es do Google apontando para essa p\u00e1gina, enquanto o PRD #472 espera a API do Google. Os dois viraram tickets `task` no mapa das avalia\u00e7\u00f5es do Google (#616).", "cita": [36, 37, 42, 47], "decisao": "Decis\u00e3o do Pedro (09/set/2026, grilling a partir de duas d\u00favidas do diretor; PRD #646). O e-mail que chega em `ouvidoria@hospitalsaomatheus.com.br` passa a entrar no app, mas **n\u00e3o como canal aberto**: cai numa [Triagem de e-mail], onde o...", "emenda": [39], "emendada_por": [], "file": "docs/adr/0051-email-recebido-passa-por-triagem-antes-de-virar-manifestacao.md", "number": 51, "slug": "0051-email-recebido-passa-por-triagem-antes-de-virar-manifestacao", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "E-mail recebido em ouvidoria@ passa por triagem antes de virar manifesta\u00e7\u00e3o"}, {"amended_by": "0088", "amends": "0041", "body_md": "> Emenda a exce\u00e7\u00e3o do ADR 0041 (decis\u00e3o 3 e emenda de 01/09/2026): o **caso an\u00f4nimo** continua sem identifica\u00e7\u00e3o de quem manifestou e sem relato integral, mas passa a levar para a \u00e1rea o nome e a refer\u00eancia do Paciente do caso. O sigilo refor\u00e7ado n\u00e3o muda: ali nada do paciente viaja fora do extrato do ouvidor.\n\n\nA Diretoria observou em 09/09/2026 que quem reclama pelo QR setorial muitas vezes \u00e9 acompanhante (m\u00e3e, pai, c\u00f4njuge) em nome de um paciente, assina o relato e n\u00e3o diz de quem fala. O caso chega, o ouvidor aciona, e a \u00e1rea devolve porque n\u00e3o acha o atendimento. O formul\u00e1rio do canal aberto n\u00e3o perguntava nada sobre o paciente, e o caso n\u00e3o tinha onde guardar isso.\n\n## Decis\u00f5es\n\n1. **O caso ganha dois dados opcionais do paciente**: nome e refer\u00eancia do atendimento (texto curto: data, setor ou leito). Nascem no formul\u00e1rio p\u00fablico e no registro manual do ouvidor; a Ana fica para leva pr\u00f3pria. N\u00e3o s\u00e3o edit\u00e1veis depois, como o resto da identifica\u00e7\u00e3o.\n\n2. **O formul\u00e1rio pergunta \"Este relato \u00e9 sobre quem?\"** logo depois do relato, com resposta obrigat\u00f3ria de um toque: \"Sobre mim\" grava o v\u00ednculo `paciente`; \"Sobre outra pessoa\" grava `acompanhante` e abre os dois campos. Os campos s\u00e3o opcionais: o canal aberto nunca barra o envio por dado faltando.\n\n3. **Os campos ficam vis\u00edveis com \"an\u00f4nimo\" marcado.** O anonimato protege quem manifesta. O paciente \u00e9 outra pessoa, e sem ele o caso an\u00f4nimo do acompanhante n\u00e3o serve para nada.\n\n4. **O paciente viaja para a \u00e1rea no caso comum e no caso an\u00f4nimo.** Email de acionamento e tela do respons\u00e1vel levam o paciente onde levam \"quem manifestou\", e no caso an\u00f4nimo levam o paciente mesmo com \"Sem identifica\u00e7\u00e3o\" na linha do manifestante. **N\u00e3o viaja no sigilo refor\u00e7ado** (den\u00fancia e relato de conduta): o paciente pode ser a v\u00edtima, e quem decide o que sai \u00e9 o ouvidor, pelo extrato.\n\n5. **Relato em nome de outra pessoa sem nome do paciente acende um aviso no Dossi\u00ea**, antes do acionamento, sem travar. \u00c9 o ponto mais barato de pegar o caso: antes de a \u00e1rea descobrir e devolver.\n\n6. **A Reten\u00e7\u00e3o passa a varrer o paciente.** Nome e refer\u00eancia s\u00e3o dado pessoal de terceiro e saem junto com os cinco lugares de hoje.\n\n## Alternativas rejeitadas\n\n- **S\u00f3 uma frase de instru\u00e7\u00e3o no relato.** N\u00e3o for\u00e7a nada, some ao digitar, e o dado continua n\u00e3o vindo.\n- **Colar o nome dentro do relato.** O relato \u00e9 integral e sem edi\u00e7\u00e3o; Reten\u00e7\u00e3o e pseudonimiza\u00e7\u00e3o passariam a depender de achar texto.\n- **Paciente seguir a mesma guarda de \"quem manifestou\".** Mais simples de explicar, mas o acompanhante an\u00f4nimo volta a gerar caso que a \u00e1rea n\u00e3o acha, que \u00e9 o problema que motivou a decis\u00e3o.\n\n## Consequ\u00eancias\n\n- \"Acompanhante da Maria, leito 12\" \u00e0s vezes entrega quem falou. O formul\u00e1rio diz isso \u00e0 pessoa no aviso do campo, e a escolha \u00e9 dela.\n- A guarda do caso protegido deixa de ser uma regra s\u00f3: identifica\u00e7\u00e3o do manifestante e relato integral seguem a regra do 0041; o paciente segue a regra deste ADR.", "cita": [], "decisao": "A Diretoria observou em 09/09/2026 que quem reclama pelo QR setorial muitas vezes \u00e9 acompanhante (m\u00e3e, pai, c\u00f4njuge) em nome de um paciente, assina o relato e n\u00e3o diz de quem fala. O caso chega, o ouvidor aciona, e a \u00e1rea devolve porque...", "emenda": [41], "emendada_por": [88], "file": "docs/adr/0052-paciente-do-caso-viaja-para-a-area-no-caso-anonimo.md", "number": 52, "slug": "0052-paciente-do-caso-viaja-para-a-area-no-caso-anonimo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O Paciente do caso viaja para a \u00e1rea, inclusive no caso an\u00f4nimo"}, {"amended_by": null, "amends": null, "body_md": "O fluxo deste reposit\u00f3rio (painel de 7 abas, skills do pipeline, labels, CIs de higiene, contrato de deploy) passou a ser pedido por gente de fora, come\u00e7ando por um parceiro que est\u00e1 come\u00e7ando a programar e quer o mesmo sistema num projeto de stack diferente. A primeira ideia foi \"um prompt grande que recria tudo\". Este ADR fixa o outro caminho.\n\n## Decis\u00f5es\n\n1. **A instala\u00e7\u00e3o \u00e9 um roteiro versionado em `tools/instalar-fluxo/`**, n\u00e3o um prompt que circula por mensagem. O prompt que a pessoa cola tem tr\u00eas linhas: clonar este reposit\u00f3rio, ler o roteiro, seguir. A intelig\u00eancia mora no `ROTEIRO.md`, o invent\u00e1rio no `MANIFESTO.md`.\n\n2. **Copia da \u00e1rvore viva, n\u00e3o recria por descri\u00e7\u00e3o.** O painel tem 3.400 linhas e um design system de um bloco `:root`. Recriar por descri\u00e7\u00e3o nunca sai igual. O roteiro copia o que \u00e9 neutro byte a byte, adapta o que cita o Hospital, e s\u00f3 gera do zero o que depende da stack (`/deploy`, `/snapshot`, `/atualizar-app`, `ci.yml`). O manifesto aponta para os arquivos deste reposit\u00f3rio; nada \u00e9 duplicado dentro de `tools/instalar-fluxo/`.\n\n3. **O instalador \u00e9 um agente explorat\u00f3rio com entrevista.** Antes de perguntar, l\u00ea a base do destino e monta uma ficha. Depois entrevista uma pergunta por vez, duas op\u00e7\u00f5es, recomenda\u00e7\u00e3o derivada da ficha na frente. Fato se acha no c\u00f3digo; decis\u00e3o se pergunta.\n\n4. **O contrato que n\u00e3o pode quebrar** \u00e9 o que o painel l\u00ea: os tr\u00eas JSONs de `docs/spec/deploy/`, os sete arquivos de `docs/spec/snapshots/` no formato que `areas.py` e `diagramas.py` esperam, `CONTEXT.md`, `docs/adr/` com frontmatter de `status`, e as labels can\u00f4nicas. As skills geradas para outra stack podem mudar por dentro, mas escrevem nesse contrato.\n\n5. **As regras v\u00e3o fechadas.** Idioma pt-BR, zero travess\u00e3o, merge \u00e9 decis\u00e3o humana, estado vive nas Issues e nos JSONs, ADR s\u00f3 `accepted`, os tr\u00eas workflows de CI. S\u00f3 o nome do router muda (`/ask-pedro` vira `/ask-<nome>`). Quem quiser mudar uma regra faz por ADR no pr\u00f3prio reposit\u00f3rio, como aqui.\n\n6. **O roteiro termina com o fluxo em uso, n\u00e3o s\u00f3 instalado.** PR aberto (o merge \u00e9 do humano) e uma issue `ready-for-human` na fila. O primeiro merge e a aba Pend\u00eancias ensinam o gate humano e a fila sem ningu\u00e9m explicar.\n\n7. **Fica de fora o que \u00e9 do Hospital e n\u00e3o \u00e9 m\u00e9todo:** `/divulgar`, `docs/manual/`, `docs/comunicacao/`, `docs/pops/`, as ADRs de dom\u00ednio. As ADRs que explicam o fluxo (0013, 0020, 0022, 0025, 0027, 0028, 0043, 0044) viram resumo de um par\u00e1grafo cada na ADR 0001 do destino, com link para o arquivo daqui.\n\n## Consequ\u00eancias\n\n- Quem cria, renomeia ou apaga skill do pipeline atualiza o `MANIFESTO.md` no mesmo commit, junto com o `/ask-pedro`.\n- O roteiro se prova num reposit\u00f3rio de brinquedo: painel de p\u00e9 com as 7 abas, CI verde no PR, issue na aba Pend\u00eancias. Sem isso, o roteiro est\u00e1 quebrado.\n- A regra \"toda pasta de n\u00edvel 1 e 2 aparece no `README.md`\" vale para `tools/instalar-fluxo/`.\n- O reposit\u00f3rio precisa estar acess\u00edvel a quem instala (p\u00fablico, ou colaborador). O roteiro l\u00ea de um clone local, ent\u00e3o acesso de leitura basta.\n\n## Alternativas descartadas\n\n- **Prompt auto-suficiente que recria tudo.** Port\u00e1til por WhatsApp, mas cada c\u00f3pia envelhece, ningu\u00e9m v\u00ea a vers\u00e3o nova, e o design nunca sai id\u00eantico.\n- **Instalar sem `/deploy`, `/snapshot` e `/atualizar-app`.** Mais r\u00e1pido, mas o `/ship` para no merge e as abas Produ\u00e7\u00e3o e Mapa ficam vazias: meio framework.\n- **Perguntar regra por regra na entrevista.** Cada \"n\u00e3o\" quebra um peda\u00e7o do CI ou do painel, e quem est\u00e1 come\u00e7ando aceita tudo mesmo.", "cita": [1], "decisao": "O fluxo deste reposit\u00f3rio (painel de 7 abas, skills do pipeline, labels, CIs de higiene, contrato de deploy) passou a ser pedido por gente de fora, come\u00e7ando por um parceiro que est\u00e1 come\u00e7ando a programar e quer o mesmo sistema num projeto...", "emenda": [], "emendada_por": [], "file": "docs/adr/0053-fluxo-exportavel-por-roteiro-versionado.md", "number": 53, "slug": "0053-fluxo-exportavel-por-roteiro-versionado", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "O fluxo de trabalho \u00e9 export\u00e1vel por um roteiro versionado no reposit\u00f3rio, n\u00e3o por prompt solto"}, {"amended_by": "0060, 0069, 0075, 0077, 0084, 0091, 0092, 0093", "amends": "0020", "body_md": "Decis\u00e3o do Pedro (10/set/2026, grilling). A aba Tecnologia (ADR 0050) est\u00e1 em produ\u00e7\u00e3o, mas a Demanda n\u00e3o sabe nada do que acontece no GitHub, onde o trabalho de fato \u00e9 planejado, desenvolvido e entregue. O diretor n\u00e3o entra no GitHub e n\u00e3o deve entrar: nada t\u00e9cnico no app, nada de leigo no reposit\u00f3rio. Este ADR liga os dois mundos por um v\u00ednculo expl\u00edcito, com o GitHub como \u00fanica fonte do estado do desenvolvimento e o app como \u00fanica porta do diretor.\n\n## Contexto\n\n- O ADR 0020 previa o diretor como revisor can\u00f4nico **usando o GitHub web** (decis\u00e3o 3) e a label `revisor-comentou` acesa pelo **login** do autor (decis\u00e3o 5, `REVIEWER_LOGINS`). Na pr\u00e1tica o \u00fanico login configurado sempre foi o do Pedro; o diretor nunca comentou no GitHub.\n- Todo PRD e toda fatia abrem com o bloco **\"Para o diretor\"** (ADR 0020, decis\u00e3o 7), escrito para leitor n\u00e3o t\u00e9cnico e curado pelo `/to-prd` e `/to-issues`. Esse texto existe e n\u00e3o chega ao diretor.\n- O backend j\u00e1 tem o molde: router de webhooks com HMAC (ClickSign, Fireflies) e cron APScheduler que reconcilia a ClickSign de tempos em tempos.\n- Fatos da API do GitHub, conferidos na doc oficial em 10/09/2026: coment\u00e1rio criado com PAT dispara `issue_comment.created` nas Actions (s\u00f3 o `GITHUB_TOKEN` \u00e9 filtrado); o GitHub n\u00e3o reentrega webhook que falhou e exige resposta em 10 s; a API de sub-issues est\u00e1 GA e o objeto da issue traz `parent_issue_url` e `sub_issues_summary`; marcador HTML `<!-- -->` sobrevive no `body` e n\u00e3o aparece renderizado; a permiss\u00e3o m\u00ednima do token fine-grained \u00e9 Issues: write.\n\n## Decis\u00f5es\n\n1. **V\u00ednculo: 1 Demanda para 1 issue-raiz** (o PRD, ou uma issue simples de fix). As fatias s\u00e3o as sub-issues dessa raiz, nunca vinculadas uma a uma. O par \u00e9 guardado nos dois lados: a Demanda guarda o n\u00famero da issue, a issue guarda o id da Demanda num marcador oculto no corpo. Criado de duas formas: **vincular por n\u00famero** (o caso comum, quando o PRD nasceu do grilling) ou **\"Levar para desenvolvimento\"** (o app cria a issue com `needs-triage`, o bloco \"Para o diretor\" preenchido com t\u00edtulo e descri\u00e7\u00e3o da Demanda, o marcador, e o tipo mapeado: Defeito vira `type:fix`, Ajuste e Novo viram `type:feature`). Rejeitado: s\u00f3 v\u00ednculo manual (o app ficaria cego) e s\u00f3 cria\u00e7\u00e3o pelo app (o grilling continua sendo a porta de qualidade do PRD).\n\n2. **O app aprende do GitHub por webhook mais reconcilia\u00e7\u00e3o no cron**, o molde da ClickSign. Webhook `issues` (s\u00f3 esse evento) com HMAC no router de webhooks; cron de hora em hora rel\u00ea as issues vinculadas abertas e corrige o que o webhook perdeu. Rejeitado: s\u00f3 webhook (o GitHub n\u00e3o reentrega, a Etapa mentiria para sempre); s\u00f3 cron (atraso e consulta o dia inteiro); as skills empurrarem para o app (cada skill vira ponto de falha e um `gh issue close` na m\u00e3o nunca chegaria).\n\n3. **Etapa \u00e9 um segundo eixo, derivado, nunca edit\u00e1vel**, ao lado do Kanban. Seis valores, cada um lido de labels, sub-issues e fechamento: Registrada (sem v\u00ednculo), Em an\u00e1lise (`needs-triage` ou `needs-info`), Planejada (`ready-for-agent`, `ready-for-human`, ou PRD com sub-issues e nenhuma em andamento), Em desenvolvimento (`in-progress` na raiz ou em alguma sub-issue, ou PR aberto), Entregue (issue fechada como conclu\u00edda), N\u00e3o ser\u00e1 feita (fechada como n\u00e3o planejada ou `wontfix`). PRD mostra ainda \"X de Y partes entregues\" do `sub_issues_summary`. Escolhas dentro disso: Entregue \u00e9 o fechamento da issue (no merge), n\u00e3o o deploy confirmado, para n\u00e3o acoplar o app ao `state.json`; `needs-info` fica dentro de Em an\u00e1lise, a pergunta chega ao diretor pela Conversa. Rejeitado: Etapa digitada \u00e0 m\u00e3o (voltaria a mentir) e s\u00e9tima Etapa \"Aguardando o hospital\".\n\n4. **Toda resposta da Conversa de uma Demanda vinculada \u00e9 espelhada na issue**, para o agente que curar ler o fio inteiro. A label `revisor-comentou` acende s\u00f3 para resposta de quem **n\u00e3o tem login no GitHub**: `participantes` ganha o campo opcional `github_login`; a resposta de quem tem login sai com `<!-- automacao -->` (a Action j\u00e1 ignora), a de quem n\u00e3o tem sai com `<!-- revisor-app autor=\"Nome\" -->`, que a Action passa a reconhecer al\u00e9m de `REVIEWER_LOGINS`. Rejeitado: acender em toda resposta espelhada (a resposta \"vou ver\" do Pedro travaria a `/onda`, o falso positivo conhecido) e bot\u00e3o \"Encaminhar\" por linha (volta a depender de algu\u00e9m lembrar). Nota sobre o ADR 0050, decis\u00e3o 2: `github_login` \u00e9 um fato, n\u00e3o um lado; a decis\u00e3o de n\u00e3o modelar o lado continua valendo.\n\n5. **Nenhum coment\u00e1rio do GitHub volta para a Conversa.** O que volta \u00e9 s\u00f3 a mudan\u00e7a de Etapa, como linha autom\u00e1tica (\"Entrou em desenvolvimento\", \"Voltou para desenvolvimento\", \"Entregue: 3 de 7 partes\"). O diretor fica sabendo o resultado da curadoria pela Etapa; pergunta dele na Conversa \u00e9 respondida por gente. Rejeitado: bloco `<!-- para-o-diretor -->` no coment\u00e1rio de curadoria espelhado como linha \"Equipe Vitta\" (fura a regra e depende de o agente escrever para leigo toda vez; pode entrar depois como fatia sem desfazer nada).\n\n6. **A Entrega devolve a bola a quem pediu.** \u00c9 a \u00fanica regra autom\u00e1tica de movimento do Kanban: quando a Etapa chega a Entregue, a Demanda vai para Aguardando com o autor como respons\u00e1vel, dispara o e-mail de atribui\u00e7\u00e3o que j\u00e1 existe e cai na Minha vez dele com o recado \"Entregue, confira e conclua\". Quem conclui \u00e9 o diretor. Se n\u00e3o estiver bom, a resposta dele na Conversa acende `revisor-comentou` na issue fechada, que \u00e9 o loop de reabrir do ADR 0020, decis\u00e3o 4. \"N\u00e3o ser\u00e1 feita\" s\u00f3 informa; a Vitta explica na Conversa e cancela \u00e0 m\u00e3o. Rejeitado: concluir sozinho (rouba o momento em que o diretor v\u00ea o valor) e s\u00f3 informar (a bola morre na Vitta).\n\n7. **\"O que muda\" \u00e9 lido do GitHub, nunca digitado no app.** O card ganha uma se\u00e7\u00e3o com o bloco \"Para o diretor\" da issue-raiz e, embaixo, a lista das partes (sub-issues), cada uma com o pr\u00f3prio \"Para o diretor\" e a situa\u00e7\u00e3o (planejada, em desenvolvimento, entregue). O t\u00edtulo da fatia n\u00e3o aparece (\u00e9 t\u00e9cnico). Issue sem o bloco mostra \"Descri\u00e7\u00e3o em prepara\u00e7\u00e3o\", nunca o corpo t\u00e9cnico. Rejeitado: s\u00f3 Etapa e barra (o diretor n\u00e3o v\u00ea por que cada parte agrega) e o Pedro reescrever o valor na descri\u00e7\u00e3o da Demanda (duplica e apodrece).\n\n8. **Identidade: token pessoal fine-grained do Pedro**, s\u00f3 neste reposit\u00f3rio, s\u00f3 Issues: write, na vari\u00e1vel `GITHUB_INTEGRACAO_TOKEN` do Coolify (nunca `GITHUB_TOKEN`, reservado das Actions). Tudo que o app publica aparece como `pedrorezendefig`; o marcador carrega o autor verdadeiro. Rejeitado por ora: GitHub App pr\u00f3pria (`aplicativo-hospital[bot]`, JWT, token de instala\u00e7\u00e3o renovado a cada hora), uma engrenagem a mais para cinco pessoas. A troca pela App n\u00e3o mexe no resto, porque o marcador \u00e9 igual nas duas.\n\n9. **O que \u00e9 da Vitta fica atr\u00e1s de `github_login`.** O bot\u00e3o \"Levar para desenvolvimento\", o campo \"Vincular issue\" e o link \"Abrir no GitHub\" s\u00f3 aparecem para quem tem o login preenchido. O diretor n\u00e3o v\u00ea n\u00famero de issue, link nem label. O selo de Etapa s\u00f3 aparece no card quando h\u00e1 v\u00ednculo; Registrada \u00e9 a aus\u00eancia do selo.\n\n## Emenda ao ADR 0020\n\n- **Decis\u00e3o 3** (o revisor usa o GitHub nativo): o revisor can\u00f4nico passa a comentar **no app**, na Conversa da Demanda vinculada; o app leva o coment\u00e1rio ao GitHub. O acesso Triage no reposit\u00f3rio deixa de ser necess\u00e1rio para o diretor.\n- **Decis\u00e3o 5** (a Action acende pelo login): a Action acende `revisor-comentou` tamb\u00e9m pelo marcador `<!-- revisor-app -->`, independente do login do autor no GitHub. `REVIEWER_LOGINS` continua valendo para quem comenta direto no GitHub.\n- As decis\u00f5es 1, 2, 4, 6 e 7 ficam intactas. A 7 (bloco \"Para o diretor\") passa a ser a **fonte** do que o app mostra ao diretor: quem editar um corpo de issue precisa preservar o bloco, ou a Demanda mostra \"Descri\u00e7\u00e3o em prepara\u00e7\u00e3o\".\n\n## Emenda a este ADR (10/set/2026, descoberta na implementa\u00e7\u00e3o)\n\n**Decis\u00e3o 6, borda das Demandas fechadas.** A decis\u00e3o diz que a Entrega devolve a bola a quem pediu. Na implementa\u00e7\u00e3o (issues #678 e #679) ficou claro que ela n\u00e3o pode valer para Demanda j\u00e1 Conclu\u00edda ou Cancelada, e a fatia #678 decidiu que a sincroniza\u00e7\u00e3o **sai antes de ler o GitHub** quando a Demanda est\u00e1 fechada, pelos dois gatilhos (o webhook e o lote de hora em hora). A #679 herdou essa guarda.\n\nA consequ\u00eancia, consciente e aceita: **o selo de Etapa de uma Demanda fechada congela no dia do fechamento.** Se a issue vinculada for entregue depois, o card no Hist\u00f3rico n\u00e3o fica calado sobre isso, ele continua afirmando a Etapa velha (\"Em desenvolvimento\"), junto com o \"O que muda\" e o resumo de partes daquele momento. Quem quiser o selo atualizado **reabre a Demanda**: a\u00ed a foto volta a ser lida e a linha autom\u00e1tica sai.\n\nA alternativa seria p\u00f4r as Demandas fechadas de volta no filtro do lote de hora em hora. Foi rejeitada: contradiz a hist\u00f3ria 49 do PRD #673 por escrito e paga cota da API do GitHub, de hora em hora, sobre um Hist\u00f3rico que s\u00f3 cresce e nunca esvazia.\n\nO crit\u00e9rio de aceite da #679 foi reescrito para dizer o que de fato existe. As decis\u00f5es 1 a 5 e 7 a 9 ficam intactas.\n\n## Emenda a este ADR (11/set/2026, rodada de seguran\u00e7a do PR #696)\n\n**Decis\u00e3o 4, o que da pessoa sai no coment\u00e1rio espelhado.** A decis\u00e3o escrevia o marcador como `<!-- revisor-app autor=\"Nome\" -->`, e a issue #680 pedia o cabe\u00e7alho \"**Nome** escreveu na Demanda:\". Isso contradiz a decis\u00e3o do diretor na review do PR #688 (emenda na issue #677): **nome civil n\u00e3o sai para o GitHub**, porque o reposit\u00f3rio \u00e9 p\u00fablico. A decis\u00e3o posterior vale, e a implementa\u00e7\u00e3o da #680 segue ela:\n\n- quem tem `github_login` sai como `@login` no cabe\u00e7alho (identificador que a pr\u00f3pria pessoa j\u00e1 tornou p\u00fablico), com o marcador `<!-- automacao -->`;\n- quem n\u00e3o tem sai com o r\u00f3tulo neutro **\"Pessoa do hospital\"** no cabe\u00e7alho e no `autor` do marcador: `<!-- revisor-app autor=\"Pessoa do hospital\" demanda=\"id\" -->`. Quem tem acesso ao app v\u00ea o autor pelo link da Demanda, que j\u00e1 est\u00e1 no corpo da issue;\n- a **@men\u00e7\u00e3o do app** no texto (`@Nome Completo`, gravada pelo autocomplete) vira o r\u00f3tulo da pessoa mencionada (`@login` ou o neutro), e qualquer outra men\u00e7\u00e3o digitada \u00e0 m\u00e3o sai com um espa\u00e7o depois do `@` (`@ fulano`): sem isso, \"@Pedro Vitta\" notificaria a conta `Pedro` do GitHub e publicaria o nome de um colaborador. As duas formas mais \u00f3bvias ca\u00edram no `gh api /markdown` deste reposit\u00f3rio: o escape de barra do CommonMark (`\\@`) \u00e9 consumido antes do filtro de men\u00e7\u00e3o e acende igual (rodada 2 do PR #696), e a crase (`` `@fulano` ``, code span) funciona em texto limpo mas quebra em dois o code span de quem j\u00e1 escreveu crase, acendendo uma men\u00e7\u00e3o que estava apagada (rodada 3). O espa\u00e7o n\u00e3o abre nem fecha delimitador nenhum, ent\u00e3o sai neutro inclusive dentro da crase e do it\u00e1lico do autor;\n- a **caixa de resposta avisa** que a resposta \u00e9 publicada fora do app quando a Demanda tem V\u00ednculo, sem n\u00famero, link nem label (decis\u00e3o 9 intacta). O mesmo aviso que o PR #688 p\u00f4s no bot\u00e3o \"Levar para desenvolvimento\", agora para quem escreve sem ver o V\u00ednculo.\n\nA frase \"com o meu nome no texto\" da hist\u00f3ria 37 do PRD #673 fica superada por esta emenda. As demais decis\u00f5es ficam intactas.\n\n## Emenda a este ADR (11/set/2026, auditoria de conclus\u00e3o do PRD #673)\n\n**Decis\u00e3o 3, o que conta como recusa e de onde sai a barra.** A decis\u00e3o j\u00e1 dizia que \"N\u00e3o ser\u00e1 feita\" \u00e9 a issue fechada como n\u00e3o planejada ou marcada `wontfix`, mas o c\u00f3digo s\u00f3 tirava a entrega pelo motivo do fechamento. Como o protocolo de triagem n\u00e3o obriga ningu\u00e9m a escolher esse motivo, quem recusava marcava a label e fechava pelo bot\u00e3o padr\u00e3o do GitHub, que fecha como conclu\u00edda, e a Demanda aparecia como **Entregue**. Isso n\u00e3o parava no selo: Entregue \u00e9 a \u00fanica Etapa que move o Kanban (decis\u00e3o 6), ent\u00e3o a Demanda recusada era devolvida a quem pediu com o e-mail \"Entregue, confira e conclua\". A issue #701 corrigiu, e a implementa\u00e7\u00e3o volta a bater com o que esta decis\u00e3o sempre disse.\n\nA mesma decis\u00e3o nomeia o `sub_issues_summary` do GitHub como fonte do \"X de Y partes entregues\", e agora h\u00e1 uma exce\u00e7\u00e3o declarada. O GitHub conta como conclu\u00edda toda sub-issue fechada pelo bot\u00e3o padr\u00e3o, label nenhuma importa, ent\u00e3o uma fatia recusada entraria no n\u00famero dele como entregue, e o card mostraria \"2 de 3 partes\" logo acima de uma lista em que uma parte diz \"N\u00e3o ser\u00e1 feita\". Quando h\u00e1 parte **recusada e fechada** entre as que lemos, a conta pr\u00f3pria manda; no resto, o n\u00famero do GitHub continua mandando, que \u00e9 o que a tela do GitHub mostra. Recusada aqui s\u00e3o as duas formas, a label e o fechamento como n\u00e3o planejada: o crit\u00e9rio \u00e9 \"fechada e n\u00e3o entregue\", escrito com o mesmo predicado de entrega que a Etapa usa, para n\u00e3o existirem duas defini\u00e7\u00f5es de entrega no mesmo m\u00f3dulo.\n\nFica registrado o que n\u00e3o foi tratado: `ler_sub_issues` n\u00e3o pagina, e o padr\u00e3o do GitHub \u00e9 30 por p\u00e1gina. Numa raiz com mais de 30 sub-issues em que alguma das lidas seja recusada, o total passa a ser o da nossa lista. O maior PRD do reposit\u00f3rio tem 7 sub-issues.\n\nAs demais decis\u00f5es ficam intactas.\n\n## Consequ\u00eancias\n\n- `tecnologia_demandas` ganha as colunas do v\u00ednculo (n\u00famero da issue, Etapa, resumo de partes, \"O que muda\" em cache, \u00faltima sincroniza\u00e7\u00e3o). `participantes` ganha `github_login`. Migration com o pr\u00f3ximo n\u00famero livre na hora da fatia.\n- Backend: cliente GitHub m\u00ednimo (criar issue, comentar, ler issue e sub-issues), endpoint de webhook `issues` com HMAC e o segredo `GITHUB_WEBHOOK_SECRET`, job de reconcilia\u00e7\u00e3o no cron existente, servi\u00e7o puro que traduz labels e fechamento em Etapa. Cadastro do webhook no reposit\u00f3rio \u00e9 passo humano do deploy.\n- Action de higiene: reconhecer `<!-- revisor-app -->`; `/triage` e `/pegar-issue` j\u00e1 lidam com a label, sem mudan\u00e7a de protocolo.\n- O gloss\u00e1rio (CONTEXT.md, se\u00e7\u00e3o Tecnologia) ganha V\u00ednculo com o desenvolvimento, Etapa e O que muda, e a Conversa da Demanda ganha o espelhamento.\n- Sem travess\u00e3o em nada que o usu\u00e1rio v\u00ea, inclusive nas linhas autom\u00e1ticas e no \"O que muda\" trazido do GitHub (o sanitizador cobre o que a IA gera; o bloco \"Para o diretor\" j\u00e1 nasce sob o lint do CI).", "cita": [50], "decisao": "Decis\u00e3o do Pedro (10/set/2026, grilling). A aba Tecnologia (ADR 0050) est\u00e1 em produ\u00e7\u00e3o, mas a Demanda n\u00e3o sabe nada do que acontece no GitHub, onde o trabalho de fato \u00e9 planejado, desenvolvido e entregue. O diretor n\u00e3o entra no GitHub e...", "emenda": [20], "emendada_por": [60, 69, 75, 77, 84, 91, 92, 93], "file": "docs/adr/0054-demanda-vinculada-a-issue-etapa-derivada-e-revisor-no-app.md", "number": 54, "slug": "0054-demanda-vinculada-a-issue-etapa-derivada-e-revisor-no-app", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Demanda vinculada a issue do GitHub: Etapa derivada, coment\u00e1rio do diretor espelhado e a bola volta a quem pediu"}, {"amended_by": null, "amends": "0048", "body_md": "Decis\u00e3o do Pedro (14/set/2026, grilling a partir da pergunta do diretor: \"o ouvidor ou o superadmin consegue, de forma f\u00e1cil, alterar o respons\u00e1vel pela resposta ou a \u00e1rea respons\u00e1vel?\"). A resposta era \"em parte\": a \u00e1rea conseguia devolver (ADR 0048), mas o ouvidor n\u00e3o conseguia tirar o caso de uma \u00e1rea e mandar para outra, e a pessoa que responde s\u00f3 mudava pela m\u00e3o da Diretoria. Esta ADR fecha as duas pontas.\n\n## Contexto\n\n- A troca de \u00e1rea existia s\u00f3 no sentido \u00e1rea -> ouvidor (ADR 0048). Com o caso em `aguardando_area`, a rota de validar recusa (\"Este caso j\u00e1 est\u00e1 com a \u00e1rea\") e o Dossi\u00ea n\u00e3o oferece caminho. A transi\u00e7\u00e3o gen\u00e9rica `aguardando_area -> em_classificacao` aceitava um POST direto sem motivo, mas era porta de fundo: n\u00e3o consumia o link da \u00e1rea antiga nem parava o rel\u00f3gio.\n- Quando a \u00e1rea errada responde \"isso \u00e9 do Centro M\u00e9dico\" em vez de devolver pelo link, o caso chega `respondido` e a \u00fanica sa\u00edda era devolver por insufici\u00eancia ao mesmo setor ou encerrar e abrir outro protocolo, o cen\u00e1rio torto que o ADR 0048 quis matar.\n- O acionamento vai ao titular vigente do [Respons\u00e1vel do setor], cadastro mantido s\u00f3 pela `diretoria_executiva`. Desde a issue #536, Cobrar manda para o vigente, decidido no servidor. Ou seja, trocar a pessoa j\u00e1 tinha metade do caminho; faltava quem opera a Ouvidoria poder mexer no cadastro.\n\n## Decis\u00f5es\n\n1. **Nasce o Re
