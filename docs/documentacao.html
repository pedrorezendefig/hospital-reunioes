ado**: r\u00e1pido de entregar, mas regride a navega\u00e7\u00e3o por teclado em rela\u00e7\u00e3o ao nativo.\n\n## Consequ\u00eancias\n\n- Novo componente `components/ui/Select.tsx`, irm\u00e3o do `MultiSelect`, passa a ser a \u00fanica forma de dropdown de sele\u00e7\u00e3o \u00fanica daqui pra frente. O `<select>` nativo fica banido (candidato a regra de lint).\n- O `MultiSelect` segue como est\u00e1; se a duplica\u00e7\u00e3o de l\u00f3gica de listbox incomodar, extrair um primitivo compartilhado vira tarefa de `/improve-codebase-architecture`.\n- As 15 telas trocam o `<select>` pelo `Select`; o comportamento de teclado precisa de teste.", "cita": [], "decisao": "O `<select>` nativo do HTML n\u00e3o deixa estilizar a lista aberta: o sistema operacional a desenha (no macOS, com fundo escuro), fora do Design System. Hoje 15 telas (admin, POPs, reuni\u00f5es, secretaria, pend\u00eancias, notas) usam `<select>`...", "emenda": [], "emendada_por": [], "file": "docs/adr/0012-ds-select-proprio-sem-select-nativo.md", "number": 12, "slug": "0012-ds-select-proprio-sem-select-nativo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "DS Select pr\u00f3prio para sele\u00e7\u00e3o \u00fanica, sem `<select>` nativo"}, {"amended_by": null, "amends": null, "body_md": "O travess\u00e3o (`\u2014`) \u00e9 marca de texto gerado por IA e foi banido de tudo que o produto exibe ou gera (Atas, POPs, emails). O travess\u00e3o que aparece dentro desses documentos n\u00e3o est\u00e1 no c\u00f3digo est\u00e1tico: nasce do texto que o LLM escreve. Limpar s\u00f3 template e string de UI n\u00e3o resolve o miolo do documento gerado.\n\nA decis\u00e3o: defesa em duas camadas. (1) Os prompts de sistema (`extracao_ata.md`, `chat_ata_guiada_system.md`, `chat_elaboracao_pop_system.md` e afins) passam a instruir o modelo a nunca usar travess\u00e3o. (2) Um sanitizador determin\u00edstico processa a sa\u00edda da IA antes de virar Ata/POP/email: troca `\u2014` e `\u2013` por v\u00edrgula, e por h\u00edfen quando est\u00e1 entre d\u00edgitos. O prompt reduz na origem; o sanitizador garante no destino.\n\n## Por que \u00e9 surpreendente\n\nUm dev vai encontrar uma fun\u00e7\u00e3o que reescreve a sa\u00edda do LLM e pode achar que \u00e9 frescura ou remov\u00ea-la. Sem este registro n\u00e3o fica claro que \u00e9 uma garantia de produto (o dono n\u00e3o quer ver travess\u00e3o em lugar nenhum) e que o prompt sozinho n\u00e3o basta, porque o modelo escorrega.\n\n## Alternativas descartadas\n\n- **S\u00f3 instruir no prompt**: mais simples, mas LLM n\u00e3o \u00e9 determin\u00edstico; um travess\u00e3o vaza pro PDF de vez em quando, e o dono quer garantia, n\u00e3o probabilidade.\n- **S\u00f3 sanitizar, sem tocar no prompt**: funciona, mas deixa o modelo gerando travess\u00e3o que depois \u00e9 mascarado; instruir tamb\u00e9m melhora o texto na origem.\n- **Sanitizar gen\u00e9rico demais** (remover tudo ou trocar tudo por h\u00edfen): erra em casos de n\u00famero e empobrece a pontua\u00e7\u00e3o; a regra v\u00edrgula + h\u00edfen-entre-d\u00edgitos cobre o uso real em portugu\u00eas.\n\n## Consequ\u00eancias\n\n- Passa a existir uma fun\u00e7\u00e3o de sanitiza\u00e7\u00e3o de texto de IA no pipeline de gera\u00e7\u00e3o (Ata, Ata Guiada, POP, email), com teste.\n- A conven\u00e7\u00e3o \"sem travess\u00e3o\" vive nos prompts e no `CLAUDE.md` (global do dono e, se preciso, do projeto), al\u00e9m de um lint no CI para o c\u00f3digo est\u00e1tico.\n- Mudar a pol\u00edtica (por exemplo, voltar a permitir travess\u00e3o) exige mexer em prompt, sanitizador e lint juntos.", "cita": [], "decisao": "O travess\u00e3o (`\u2014`) \u00e9 marca de texto gerado por IA e foi banido de tudo que o produto exibe ou gera (Atas, POPs, emails). O travess\u00e3o que aparece dentro desses documentos n\u00e3o est\u00e1 no c\u00f3digo est\u00e1tico: nasce do texto que o LLM escreve. Limpar...", "emenda": [], "emendada_por": [], "file": "docs/adr/0013-saida-ia-sem-travessao-sanitizador.md", "number": 13, "slug": "0013-saida-ia-sem-travessao-sanitizador", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Sa\u00edda da IA sem travess\u00e3o: sanitizador determin\u00edstico + conven\u00e7\u00e3o nos prompts"}, {"amended_by": null, "amends": null, "body_md": "O ADR 0007 criou o eixo `perfil_pop` ortogonal ao `access_profile` das Reuni\u00f5es e j\u00e1 previa que \"o admin de usu\u00e1rios existente vira pe\u00e7a central e ganha o eixo `perfil_pop`\". O que ele n\u00e3o definiu foi **quem concede** o perfil. A primeira implementa\u00e7\u00e3o (issue #81) fechou a concess\u00e3o no pr\u00f3prio contexto: o endpoint que grava `perfil_pop` exigia `require_perfil_pop(\"superadmin\")` \u2014 s\u00f3 um Superadmin POP concede perfil POP.\n\nIsso criou um ovo-e-galinha: n\u00e3o h\u00e1 como o **primeiro** Superadmin POP nascer pela aplica\u00e7\u00e3o, porque conceder o papel j\u00e1 exige t\u00ea-lo. Em produ\u00e7\u00e3o a sa\u00edda virou um UPDATE manual no banco (issue #128), repet\u00edvel a cada ambiente novo.\n\nA decis\u00e3o: **a autoridade de administra\u00e7\u00e3o da concess\u00e3o \u00e9 unificada no Super Admin de Reuni\u00f5es.** O endpoint que grava `perfil_pop` passa a aceitar **Super Admin de Reuni\u00f5es OU Superadmin POP**, e o controle de concess\u00e3o ganha lugar na edi\u00e7\u00e3o do usu\u00e1rio, na tela de Usu\u00e1rios, onde o Super Admin de Reuni\u00f5es j\u00e1 administra o eixo das Reuni\u00f5es. A concess\u00e3o a quem ainda n\u00e3o loga continua provisionando o acesso automaticamente (comportamento herdado do contexto POPs).\n\n## Por que \u00e9 surpreendente\n\n- O ADR 0007 enfatiza a ortogonalidade (\"o Super admin das Reuni\u00f5es **n\u00e3o** bypassa o `perfil_pop`\"). \u00c0 primeira vista, deixar o Super Admin de Reuni\u00f5es conceder perfil POP parece furar essa regra. N\u00e3o fura: o que o 0007 pro\u00edbe \u00e9 o bypass de **acesso a dados** (ter `super_admin` n\u00e3o te deixa *ver* POPs). O que esta ADR unifica \u00e9 a **autoridade de administra\u00e7\u00e3o** da concess\u00e3o, uma camada distinta. Administrar quem entra num contexto n\u00e3o \u00e9 o mesmo que acessar o contexto.\n- A ortogonalidade preservada \u00e9 a de **acesso impl\u00edcito**: nenhum acesso aos dados dos POPs vem de inferir `is_super_admin`. O guard `require_perfil_pop` **n\u00e3o** foi afrouxado, ent\u00e3o um Super Admin de Reuni\u00f5es sem `perfil_pop` continua recebendo 403 na \u00e1rea interna dos POPs (listagem do admin POPs, Setores, POPs). Acessar o contexto exige um `perfil_pop` gravado, sempre um ato expl\u00edcito e auditado.\n\n## Alternativas descartadas\n\n- **Manter a concess\u00e3o fechada no Superadmin POP (status quo).** Preserva a pureza do eixo, mas perpetua o ovo-e-galinha: todo ambiente novo exige UPDATE manual no banco para nascer o primeiro Superadmin POP. Fr\u00e1gil, n\u00e3o-autosservi\u00e7o, e fora da UI audit\u00e1vel.\n- **Bootstrap por migration/seed.** Seedar o primeiro Superadmin POP por migration. Mas o e-mail do respons\u00e1vel varia por ambiente, e seed hardcoded \u00e9 fr\u00e1gil e fora do controle do administrador. Empurra a decis\u00e3o de quem manda nos POPs pro c\u00f3digo, n\u00e3o pra quem opera.\n- **H\u00edbrido: Super Admin de Reuni\u00f5es concede apenas o perfil `superadmin` (o bootstrap), e da\u00ed o Superadmin POP distribui os demais.** Cruzamento m\u00ednimo entre contextos, mas regra mais dif\u00edcil de explicar e auditar, sem ganho real: o admin raiz do app j\u00e1 \u00e9 confi\u00e1vel para administrar o eixo inteiro.\n\n## Consequ\u00eancias\n\n- O endpoint de grava\u00e7\u00e3o de `perfil_pop` passa a ter dois caminhos de autoriza\u00e7\u00e3o (Super Admin de Reuni\u00f5es e Superadmin POP) e segue candidato permanente de `/security-review`, como todo gate do POPs (ADR 0007).\n- O Super Admin de Reuni\u00f5es pode conceder e revogar qualquer perfil POP, inclusive promover/revogar outro Superadmin POP \u2014 coerente com o papel de admin raiz do app.\n- O Super Admin de Reuni\u00f5es pode conceder o perfil POP **a si mesmo**, e \u00e9 assim que o bootstrap do primeiro Superadmin POP acontece (a Diretoria, j\u00e1 admin raiz das Reuni\u00f5es, marca o pr\u00f3prio acesso pela tela de Usu\u00e1rios). N\u00e3o \u00e9 um bypass: grava o `perfil_pop` de forma expl\u00edcita e audit\u00e1vel, n\u00e3o \u00e9 acesso inferido de `is_super_admin`, e \u00e9 revers\u00edvel por qualquer administrador. S\u00f3 a auto-**revoga\u00e7\u00e3o** \u00e9 barrada, para ningu\u00e9m se trancar para fora por engano.\n- A issue #128 (bootstrap manual do primeiro Superadmin POP) fica **aposentada**: o primeiro perfil POP nasce pela tela de Usu\u00e1rios, concedido pelo Super Admin de Reuni\u00f5es, que j\u00e1 est\u00e1 seedado no banco (migra\u00e7\u00e3o 017). Nenhum UPDATE manual \u00e9 necess\u00e1rio.\n- A auditoria (`POPS_PERFIL_POP`) registra o ator real da a\u00e7\u00e3o, seja ele Super Admin de Reuni\u00f5es ou Superadmin POP.\n- Os demais endpoints do admin POPs (listagem de pessoas, v\u00ednculos de Setor) permanecem restritos a `perfil_pop`: a \u00e1rea interna do contexto n\u00e3o \u00e9 afetada por esta ADR.", "cita": [7], "decisao": "O ADR 0007 criou o eixo `perfil_pop` ortogonal ao `access_profile` das Reuni\u00f5es e j\u00e1 previa que \"o admin de usu\u00e1rios existente vira pe\u00e7a central e ganha o eixo `perfil_pop`\". O que ele n\u00e3o definiu foi **quem concede** o perfil. A primeira...", "emenda": [], "emendada_por": [], "file": "docs/adr/0014-autoridade-concessao-perfil-pop-unificada.md", "number": 14, "slug": "0014-autoridade-concessao-perfil-pop-unificada", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Autoridade de concess\u00e3o do perfil POP unificada no Super Admin de Reuni\u00f5es"}, {"amended_by": null, "amends": null, "body_md": "Elaborador, Revisor e Validador s\u00e3o designados na cria\u00e7\u00e3o do POP e vivem na tabela-m\u00e3e `pops`. At\u00e9 aqui eram imut\u00e1veis por design: n\u00e3o existe endpoint de edi\u00e7\u00e3o, e um teste-guarda (`test_codigo_e_imutavel_nenhum_endpoint_o_altera`) quebra se algu\u00e9m criar um `PATCH`/`PUT` em `/pops/{id}`, blindando o C\u00f3digo travado. S\u00f3 que pessoas saem e trocam de fun\u00e7\u00e3o: um Revisor designado pode estar fora quando a Vers\u00e3o chega \u00e0 Revis\u00e3o. Travar os pap\u00e9is para sempre obrigaria a recriar o POP (perdendo o C\u00f3digo, que \u00e9 refer\u00eancia institucional, e o hist\u00f3rico de Vers\u00f5es) s\u00f3 para trocar um nome.\n\nA decis\u00e3o: passa a existir edi\u00e7\u00e3o de Elaborador, Revisor e Validador depois da cria\u00e7\u00e3o, enquanto a **Vers\u00e3o ativa** (a mais recente) estiver antes da assinatura, ou seja nos estados `A_ELABORAR`, `EM_ELABORACAO`, `EM_REVISAO` ou `EM_VALIDACAO`. A edi\u00e7\u00e3o trava quando o envelope ClickSign nasce (`EM_ASSINATURA`) e em `PUBLICADO`, porque a\u00ed os Signat\u00e1rios j\u00e1 est\u00e3o no envelope e o PDF assinado registra quem assinou; mexer desincronizaria a assinatura. Se um designado precisa mudar num POP j\u00e1 publicado, isso acontece ao iniciar a pr\u00f3xima Revis\u00e3o peri\u00f3dica: a nova Vers\u00e3o volta a `A_ELABORAR` e destrava. Quem pode editar \u00e9 o mesmo escopo de quem cria o POP (Superadmin POP e Gestor de Qualidade no escopo institucional; Gerente e Coordenador nos seus Setores). Ao trocar, a pessoa nova da etapa ativa \u00e9 notificada. O C\u00f3digo continua imut\u00e1vel: o endpoint edita apenas os tr\u00eas campos de papel.\n\n## Por que \u00e9 surpreendente\n\nO teste-guarda existente afirma \"nenhum endpoint altera o POP\". Um dev que adicionar o `PATCH` de pap\u00e9is vai quebr\u00e1-lo e pode achar que est\u00e1 ferindo o C\u00f3digo travado. Precisa ficar claro que a imutabilidade vale para o C\u00f3digo, n\u00e3o para os pap\u00e9is, e que a trava por estado (livre antes da assinatura, travada a partir dela) \u00e9 deliberada.\n\n## Alternativas descartadas\n\n- **Manter imut\u00e1vel e recriar o POP para trocar de pessoa**: perde o C\u00f3digo (presente em treinamentos e na Biblioteca) e o hist\u00f3rico de Vers\u00f5es. Pesado demais para uma troca de nome.\n- **Edit\u00e1vel em qualquer estado, inclusive ap\u00f3s assinar**: desincroniza o envelope ClickSign e contradiz o PDF assinado, que registra quem assinou. Quebra a cadeia de assinatura.\n- **Edit\u00e1vel at\u00e9 `PUBLICADO`, inclusive num POP est\u00e1vel sem Vers\u00e3o em fluxo**: conveni\u00eancia marginal a troco de editar um POP que j\u00e1 foi assinado. Preferimos a regra limpa \"antes da assinatura\".\n\n## Consequ\u00eancias\n\n- Novo endpoint `PATCH /pops/{id}` restrito aos campos `elaborador_id`, `revisor_id` e `validador_id`, com a trava pelo estado da Vers\u00e3o ativa, mais a UI de edi\u00e7\u00e3o na gest\u00e3o do POP.\n- O teste-guarda muda de \"n\u00e3o existe `PATCH`/`PUT`\" para \"o `PATCH` existe, mas rejeita `codigo` e qualquer campo fora dos pap\u00e9is\".\n- Notifica\u00e7\u00e3o \u00e0 pessoa nova da etapa ativa ao trocar.\n- A trava depende do estado da Vers\u00e3o mais recente: um POP com Vers\u00e3o vigente Publicada e nenhuma em fluxo fica travado at\u00e9 come\u00e7ar a pr\u00f3xima Revis\u00e3o peri\u00f3dica.", "cita": [], "decisao": "Elaborador, Revisor e Validador s\u00e3o designados na cria\u00e7\u00e3o do POP e vivem na tabela-m\u00e3e `pops`. At\u00e9 aqui eram imut\u00e1veis por design: n\u00e3o existe endpoint de edi\u00e7\u00e3o, e um teste-guarda (`test_codigo_e_imutavel_nenhum_endpoint_o_altera`) quebra...", "emenda": [], "emendada_por": [], "file": "docs/adr/0015-papeis-fluxo-pop-editaveis-ate-assinatura.md", "number": 15, "slug": "0015-papeis-fluxo-pop-editaveis-ate-assinatura", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Pap\u00e9is do fluxo de POP edit\u00e1veis at\u00e9 a assinatura"}, {"amended_by": "0021", "amends": null, "body_md": "O conte\u00fado de uma Vers\u00e3o de POP era um JSON de chaves fixas (`objetivo`, `abrangencia`, e mais oito se\u00e7\u00f5es), e o agente de Elabora\u00e7\u00e3o era obrigado a devolver exatamente essas se\u00e7\u00f5es: o template institucional de onze se\u00e7\u00f5es (Identifica\u00e7\u00e3o preenchida pelo sistema, mais dez do agente), alinhado a ONA N\u00edvel 3 e JCI. Na pr\u00e1tica a estrutura real varia por procedimento, e em quase todos os casos o Elaborador anexa um modelo de POP (Material de refer\u00eancia) e espera que o resultado siga aquela estrutura. O template fixo for\u00e7ava se\u00e7\u00f5es irrelevantes e ignorava a estrutura pedida.\n\nA decis\u00e3o: a estrutura do POP passa a ser **din\u00e2mica**. O rascunho deixa de ser um JSON de chaves fixas e vira uma **lista ordenada de se\u00e7\u00f5es** (`id`, `t\u00edtulo`, `conte\u00fado`). O agente cria, renomeia, reordena e remove se\u00e7\u00f5es livremente. Com um Material de refer\u00eancia que traz um modelo, o agente **espelha a estrutura dele**; sem modelo, prop\u00f5e o template institucional como ponto de partida edit\u00e1vel. Nenhuma se\u00e7\u00e3o \u00e9 for\u00e7ada, exceto a Identifica\u00e7\u00e3o, que segue preenchida pelo sistema e fora da lista. A rede de seguran\u00e7a de acredita\u00e7\u00e3o \u00e9 o pr\u00f3prio agente, consultor de ONA e JCI: ele **sinaliza** quando falta uma se\u00e7\u00e3o que um auditor esperaria (Objetivo, Responsabilidades, Descri\u00e7\u00e3o do procedimento, Refer\u00eancias normativas), mas n\u00e3o trava o fluxo. Cada se\u00e7\u00e3o carrega um **ID est\u00e1vel**, n\u00e3o o t\u00edtulo, para o apontar-se\u00e7\u00e3o (\u2316) e a atualiza\u00e7\u00e3o ao vivo sobreviverem a renomear e reordenar.\n\n## Por que \u00e9 surpreendente\n\nAcredita\u00e7\u00e3o costuma implicar estrutura padronizada, ent\u00e3o um POP sem template fixo pode parecer regresso de conformidade. O registro deixa claro que a padroniza\u00e7\u00e3o migrou do c\u00f3digo (chaves fixas) para o agente (sugest\u00e3o mais sinaliza\u00e7\u00e3o de lacuna) e para o modelo anexado, e que isso \u00e9 decis\u00e3o da Diretoria, dona do padr\u00e3o institucional.\n\n## Alternativas descartadas\n\n- **Manter as chaves fixas e s\u00f3 relaxar o prompt**: n\u00e3o permite criar nem renomear se\u00e7\u00f5es, nem espelhar um modelo arbitr\u00e1rio. Resolve metade do problema.\n- **N\u00facleo m\u00ednimo obrigat\u00f3rio mais resto din\u00e2mico**: garante acredita\u00e7\u00e3o, mas viola \"o modelo anexado manda\" quando o modelo omite uma se\u00e7\u00e3o do n\u00facleo. Preferimos sugerir a for\u00e7ar.\n- **Estrutura totalmente livre sem rede**: arrisca POPs incompletos com um Elaborador descuidado. A sinaliza\u00e7\u00e3o do agente \u00e9 barata e mitiga.\n\n## Consequ\u00eancias\n\n- Reescreve o shape persistido do rascunho (JSONB: de objeto de chaves para lista de se\u00e7\u00f5es com ID), o schema de resposta do agente e os prompts de sistema e de usu\u00e1rio da Elabora\u00e7\u00e3o.\n- O render na tela (`PopVivoView`) e no PDF (`pop_template.html`) passam a iterar se\u00e7\u00f5es din\u00e2micas e a renderizar markdown (negrito, listas, blocos) na linguagem visual da Ata, no lugar do `pre-wrap` atual.\n- O apontar-se\u00e7\u00e3o (\u2316) passa a referenciar IDs de se\u00e7\u00e3o.\n- Exige migra\u00e7\u00e3o dos rascunhos existentes (de chaves fixas para lista de se\u00e7\u00f5es).\n- O Fluxograma deixa de ser uma chave fixa e vira uma se\u00e7\u00e3o como as outras, com tipo pr\u00f3prio (ver [ADR 0017](0017-fluxograma-pop-mermaid-svg-no-pdf.md)).", "cita": [17], "decisao": "O conte\u00fado de uma Vers\u00e3o de POP era um JSON de chaves fixas (`objetivo`, `abrangencia`, e mais oito se\u00e7\u00f5es), e o agente de Elabora\u00e7\u00e3o era obrigado a devolver exatamente essas se\u00e7\u00f5es: o template institucional de onze se\u00e7\u00f5es (Identifica\u00e7\u00e3o...", "emenda": [], "emendada_por": [21], "file": "docs/adr/0016-estrutura-dinamica-pop-guiada-material.md", "number": 16, "slug": "0016-estrutura-dinamica-pop-guiada-material", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Estrutura din\u00e2mica do POP guiada pelo material de refer\u00eancia"}, {"amended_by": "0024", "amends": null, "body_md": "O Fluxograma do POP era texto estruturado (linhas numeradas; decis\u00e3o escrita como `Pergunta? Sim: a\u00e7\u00e3o. N\u00e3o: a\u00e7\u00e3o.`) convertido por um parser determin\u00edstico em n\u00f3s e renderizado como **CSS puro** no PDF via WeasyPrint. Essa escolha (PRD #76) veio do fato de o WeasyPrint n\u00e3o rodar JavaScript. O preview na tela nem chegava a renderizar o fluxograma. O dono quer um fluxograma rico: bonito, com zoom, preview e download em PNG ou SVG com legenda. E o LLM gera diagramas com naturalidade.\n\nA decis\u00e3o: o Fluxograma passa a ser **Mermaid**. O agente emite sintaxe Mermaid na se\u00e7\u00e3o de fluxograma. Na tela, o `mermaid.js` renderiza com zoom e pan e oferece export em PNG e SVG (preview e download). No PDF, como o WeasyPrint n\u00e3o roda JS, embute-se o **SVG que o `mermaid.js` j\u00e1 rendeu no cliente**: o SVG \u00e9 capturado no frontend e persistido com a Vers\u00e3o, e o template do PDF o embute (o WeasyPrint suporta SVG). N\u00e3o entra Chromium nem headless no backend, e nenhum servi\u00e7o externo de render, para o conte\u00fado de POP n\u00e3o sair do ambiente self-hosted, coerente com a postura de privacidade. Se o agente emitir Mermaid inv\u00e1lido, a tela cai num fallback (texto bruto e op\u00e7\u00e3o de regerar) sem quebrar a Vers\u00e3o.\n\n## Por que \u00e9 surpreendente\n\nUm dev encontra uma biblioteca de diagrama em JavaScript no meio de um pipeline de PDF deliberadamente sem JS (WeasyPrint), e um SVG que viaja do frontend para o backend. Sem este registro parece invers\u00e3o de arquitetura. O ponto \u00e9 que o render acontece onde existe JS (o cliente) e o backend apenas embute o SVG pronto.\n\n## Alternativas descartadas\n\n- **Manter texto e CSS puro (PRD #76)**: consistente e leve, mas limitado a fluxo linear com decis\u00e3o simples, sem interatividade, zoom ou export. N\u00e3o entrega o \"rico\" pedido.\n- **Mermaid na tela e CSS no PDF**: evita a captura de SVG, mas a tela e o PDF divergem (o download n\u00e3o bate com o preview) e dobra a manuten\u00e7\u00e3o.\n- **Render no servidor com mermaid-cli ou Chromium headless**: server-authoritative, mas adiciona Chromium pesado \u00e0 imagem do backend. A captura no cliente entrega o mesmo SVG sem esse peso.\n- **Servi\u00e7o externo (por exemplo kroki.io)**: trivial, mas manda conte\u00fado de POP para fora do self-hosted. Descartado por privacidade.\n\n## Consequ\u00eancias\n\n- Nova depend\u00eancia `mermaid` no frontend, mais um wrapper de zoom e pan e o export PNG/SVG.\n- Caminho de captura do SVG no cliente e persist\u00eancia do SVG com a Vers\u00e3o, com re-captura quando o fluxograma muda.\n- O template do PDF passa a embutir o SVG no lugar dos n\u00f3s CSS; saem o parser determin\u00edstico e o CSS de fluxograma.\n- Fallback para Mermaid inv\u00e1lido.\n- Reverte a decis\u00e3o de render do fluxograma do PRD #76.", "cita": [], "decisao": "O Fluxograma do POP era texto estruturado (linhas numeradas; decis\u00e3o escrita como `Pergunta? Sim: a\u00e7\u00e3o. N\u00e3o: a\u00e7\u00e3o.`) convertido por um parser determin\u00edstico em n\u00f3s e renderizado como **CSS puro** no PDF via WeasyPrint. Essa escolha (PRD...", "emenda": [], "emendada_por": [24], "file": "docs/adr/0017-fluxograma-pop-mermaid-svg-no-pdf.md", "number": 17, "slug": "0017-fluxograma-pop-mermaid-svg-no-pdf", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Fluxograma de POP em Mermaid: interativo na tela, SVG no PDF"}, {"amended_by": null, "amends": null, "body_md": "> **Superseded pelo [ADR 0021](0021-rollback-natureza-elaboracao-ancorada-no-material.md)**: a Natureza foi removida; o prompt voltou a ser \u00fanico, ancorado no Material anexado, com a curadoria normativa das tr\u00eas \u00e1reas em forma compacta.\n\nO agente de Elabora\u00e7\u00e3o de POP era um system prompt \u00fanico (`chat_elaboracao_pop_system.md`) que se declara \"consultor s\u00eanior de qualidade hospitalar, especialista em ONA N\u00edvel 3 e JCI\" e lista s\u00f3 normas assistenciais (RDC ANVISA, CFM, COFEN, ONA, JCI, ABNT). O Setor entrava no prompt apenas como o nome (string). Na pr\u00e1tica, o agente \"geral\" era assistencial: um POP administrativo (DP, Faturamento) ou de apoio (higieniza\u00e7\u00e3o, manuten\u00e7\u00e3o) sa\u00eda enviesado, redigido sob a lente da acredita\u00e7\u00e3o assistencial.\n\nDuas sa\u00eddas estavam na mesa. Especializar deixando o Elaborador **escolher** o prompt por Setor ou tema (mais barreira para quem est\u00e1 na ponta, e risco de escolher errado). Ou manter um \u00fanico agente \"geral\" e confiar que a IA evoca sozinha o corpo certo de normas conforme o tema (o que o c\u00f3digo desmente: o prompt \u00fanico n\u00e3o evoca trabalhista para o DP, ele imp\u00f5e acredita\u00e7\u00e3o a tudo).\n\nA decis\u00e3o une as duas: especializa\u00e7\u00e3o **real** por **Natureza** (assistencial, administrativa, de apoio), com **sele\u00e7\u00e3o sempre autom\u00e1tica, nunca do usu\u00e1rio final**.\n\n1. **A Natureza \u00e9 atributo do Setor, inferida no cadastro.** Uma coluna em `pops_setores`, com o valor sugerido a partir do nome do Setor (como a sigla j\u00e1 \u00e9), pr\u00e9-preenchido, edit\u00e1vel e persistido. O POP herda a Natureza do seu Setor; o Elaborador n\u00e3o ganha campo novo nem escolhe nada.\n2. **O system prompt \u00e9 composto, n\u00e3o \u00fanico.** N\u00facleo comum (o que \u00e9 um POP, estrutura din\u00e2mica do ADR 0016, rede de acredita\u00e7\u00e3o, formato JSON, tipografia do ADR 0013) + bloco detalhado da Natureza do Setor (persona e corpo de normas) + \u00edndice compacto das outras duas Naturezas. A persona fica focada no caso comum sem cegar a IA para as demais.\n3. **A IA refina pelo objetivo e sinaliza.** Quando o objetivo do procedimento destoa da Natureza do Setor (uma higieniza\u00e7\u00e3o de superf\u00edcie num Setor assistencial), o agente adapta a abordagem ao objetivo real e avisa o Elaborador, sem bloquear. A Natureza herdada \u00e9 a \u00e2ncora; o refino cobre o caso de borda.\n\n## Por que \u00e9 surpreendente\n\nParece que \"um prompt s\u00f3\" seria mais simples, e foi o que a Diretoria defendeu. O registro deixa claro que \u00fanico, na pr\u00e1tica, virou enviesado: a persona assistencial estava hardcoded e servia mal metade do hospital. A composi\u00e7\u00e3o d\u00e1 foco (persona certa por Natureza) sem reintroduzir a barreira que a Diretoria com raz\u00e3o rejeitou (o usu\u00e1rio na ponta n\u00e3o escolhe nada sobre IA). E a Natureza ser inferida, n\u00e3o preenchida, segue o padr\u00e3o que a sigla do Setor j\u00e1 estabeleceu.\n\n## Alternativas descartadas\n\n- **Elaborador escolhe o prompt/agente** (por Setor ou tema): barreira cognitiva para quem est\u00e1 na ponta e risco de escolha errada. Era a tenta\u00e7\u00e3o inicial; a Diretoria a vetou e o veto procede.\n- **Um perfil por Setor ou por Tema**: explode a matriz de manuten\u00e7\u00e3o, e o Tema ainda exige classificar o procedimento (a IA classifica, sem ganho sobre hoje; ou algu\u00e9m taggeia, a barreira de novo). A Natureza (3 valores) captura a diferen\u00e7a que importa, o corpo de normas, com custo baixo.\n- **Agente \u00fanico \"geral\" melhorado**: dilui a persona (especialista em tudo, especialista em nada) e mant\u00e9m o vi\u00e9s. \u00c9 o status quo que motivou a mudan\u00e7a.\n- **Blob com as tr\u00eas Naturezas detalhadas sempre presentes**: o refino usaria a curadoria completa, mas dilui a persona prim\u00e1ria e \u00e9 o maior prompt. O \u00edndice compacto das outras duas d\u00e1 o ponteiro necess\u00e1rio sem o peso.\n- **Re-roteamento din\u00e2mico** (classificar a Natureza real e trocar o bloco): poderoso, mas adiciona classifica\u00e7\u00e3o, recomposi\u00e7\u00e3o e a ambiguidade \"Setor ou classificador, quem manda\". Over-engineering; o refino do agente cobre o caso de borda sem isso.\n- **Natureza s\u00f3 em runtime, sem persistir**: economiza a coluna, mas a classifica\u00e7\u00e3o fica invis\u00edvel e um Setor classificado errado gera POPs enviesados em sil\u00eancio. Num sistema de acredita\u00e7\u00e3o, a auditabilidade do campo persistido vale a coluna.\n\n## Consequ\u00eancias\n\n- Nova coluna `natureza` em `pops_setores` (enum: assistencial | administrativa | apoio), com migration e backfill por infer\u00eancia nos Setores existentes. O gating segue o do Setor (Superadmin POPs); o verbete Natureza do `docs/pops/CONTEXT.md`, que dizia \"o Gestor de Qualidade a define\", \u00e9 corrigido.\n- `chat_elaboracao_pop_system.md` deixa de ser monol\u00edtico: extrai-se o n\u00facleo comum e o bloco assistencial (hoje embutido), e escrevem-se os blocos administrativo e de apoio mais o \u00edndice. A composi\u00e7\u00e3o por `setor.natureza` entra na montagem do prompt (`ai_processor.py`).\n- A infer\u00eancia da Natureza entra no cadastro de Setor (`SetoresManager`), espelhando a sugest\u00e3o de sigla. Inferir Natureza \u00e9 sem\u00e2ntico (mais dif\u00edcil que as iniciais da sigla); o campo edit\u00e1vel e o refino do agente s\u00e3o as duas redes que tornam um erro de infer\u00eancia barato.\n- O sanitizador determin\u00edstico e a conven\u00e7\u00e3o \"sem travess\u00e3o\" (ADR 0013) seguem no n\u00facleo, valendo para os tr\u00eas blocos. O espelhamento de estrutura por Material de refer\u00eancia (ADR 0016) \u00e9 ortogonal e n\u00e3o muda.\n- O conte\u00fado normativo de cada bloco parte do que o CONTEXT.md j\u00e1 lista por Natureza; o detalhamento vai para o PRD e a implementa\u00e7\u00e3o.", "cita": [13, 16], "decisao": "O agente de Elabora\u00e7\u00e3o de POP era um system prompt \u00fanico (`chat_elaboracao_pop_system.md`) que se declara \"consultor s\u00eanior de qualidade hospitalar, especialista em ONA N\u00edvel 3 e JCI\" e lista s\u00f3 normas assistenciais (RDC ANVISA, CFM...", "emenda": [], "emendada_por": [], "file": "docs/adr/0018-elaboracao-pop-especializada-por-natureza.md", "number": 18, "slug": "0018-elaboracao-pop-especializada-por-natureza", "status": "superseded", "substitui": [], "substituida_por": [21], "superseded_by": "0021", "supersedes": null, "title": "Elabora\u00e7\u00e3o de POP especializada por Natureza, com sele\u00e7\u00e3o autom\u00e1tica"}, {"amended_by": "0054", "amends": null, "body_md": "> Emendado pelo ADR 0054 em 10/09/2026 nas decis\u00f5es 3 e 5: o revisor can\u00f4nico comenta no app (Conversa da Demanda vinculada), e a Action acende `revisor-comentou` tamb\u00e9m pelo marcador `<!-- revisor-app -->`.\n\n> Renumerado de 0007 para 0020 em 06/07/2026 por colis\u00e3o de numera\u00e7\u00e3o com o ADR 0007 (POPs segundo contexto). Refer\u00eancias antigas a \"ADR 0007, decis\u00e3o N\" sobre ciclo de vida de issue apontam para este documento.\n\nO ciclo issue \u2192 PR \u2192 deploy deixava o status **mentir**: a label `in-progress` ficava presa em issues fechadas (15 casos, porque o `Closes #N` fecha mas n\u00e3o mexe em label \u2014 e a doc afirmava, falsamente, que \"sai no merge\"), os crit\u00e9rios de aceite `- [ ]` nunca eram marcados (teatro do \"0/9 conclu\u00eddas\" mesmo em issue entregue), e PRDs com todas as filhas fechadas n\u00e3o fechavam sozinhos. Al\u00e9m disso, o diretor do hospital (um dos cinco Facilitadores) n\u00e3o tinha entrada no fluxo. Decidimos tornar o status **sempre verdadeiro sem trabalho manual** e dar ao diretor um loop de revis\u00e3o \u2014 mantendo o fluxo enxuto.\n\nDecis\u00f5es:\n\n1. **Crit\u00e9rios viram verdade no merge.** O `/ship` marca todos os crit\u00e9rios de aceite como `[x]` no corpo da issue no momento do merge \u2014 porque o merge s\u00f3 passa com os tr\u00eas gates verdes (CI + code-review + verifica\u00e7\u00e3o) e os crit\u00e9rios **s\u00e3o** a lista de testes do `/tdd`, logo \"verde \u27f9 crit\u00e9rios cumpridos\". Um crit\u00e9rio descopado no meio do PR \u00e9 **riscado** (`~~...~~`), nunca marcado \u2014 \"marcado\" sempre significa \"entregue\". Issue fechada l\u00ea N/N.\n\n2. **Higiene de fechamento \u00e9 event-driven, n\u00e3o um passo de skill.** Uma GitHub Action dispara em `issues.closed` e remove `in-progress`/`ready-for-agent`/`blocked`, e fecha o PRD pai quando a \u00faltima filha aberta fecha. Escolhido sobre \"o `/ship` faz no merge\" justamente porque o passo manual/impl\u00edcito foi o que apodreceu antes \u2014 uma Action n\u00e3o pode ser esquecida e funciona para qualquer fechamento (via `/ship`, pela web, ou pelo diretor).\n\n3. **O revisor usa o GitHub nativo.** Entra como colaborador com papel **Triage** (v\u00ea, comenta e rotula; n\u00e3o toca em c\u00f3digo) e usa o GitHub web/mobile \u2014 v\u00ea issues abertas, a barra \"X de Y\" das sub-issues, os crit\u00e9rios e a caixa de coment\u00e1rio. Zero build, e o coment\u00e1rio j\u00e1 nasce machine-readable. O **diretor** (um dos Facilitadores) \u00e9 o **revisor can\u00f4nico**, mas a ideia **independe da pessoa**: quem \u00e9 revisor \u00e9 **configura\u00e7\u00e3o** (`REVIEWER_LOGINS`, default `pedrorezendefig`).\n\n4. **Coment\u00e1rio do diretor reabre e refaz \u2014 na mesma issue.** Um coment\u00e1rio dele numa issue j\u00e1 entregue (fechada) **reabre** a issue e o trabalho \u00e9 refeito ali (n\u00e3o vira fatia nova). O crit\u00e9rio novo entra **desmarcado**, mantendo a contagem honesta (ex.: 6/7). Reabrir n\u00e3o desfaz o deploy \u2014 o \"refazer\" \u00e9 um ship de follow-up por cima do que j\u00e1 est\u00e1 em produ\u00e7\u00e3o. Consequ\u00eancia aceita de prop\u00f3sito: **\"fechada\" significa \"entregue e sem obje\u00e7\u00e3o do diretor at\u00e9 agora\"** \u2014 provis\u00f3rio por design. Escolhido sobre \"vira fatia nova ligada\" e sobre \"est\u00e1gio de aceite bloqueante\" (mais estado/espera, contra o enxuto).\n\n5. **A Action s\u00f3 sinaliza; o agente julga \u2014 o que importa \u00e9 o coment\u00e1rio, n\u00e3o quem comentou.** Em qualquer coment\u00e1rio de um login configurado como **revisor** (`REVIEWER_LOGINS`, default `pedrorezendefig`), a Action aplica a label `revisor-comentou` (event-driven, nunca se perde) \u2014 e **n\u00e3o** reabre nem edita sozinha. O mecanismo **independe da pessoa**: reage ao coment\u00e1rio e ao **contexto que ele adiciona**, n\u00e3o \u00e0 autoridade de quem o deixou; trocar o revisor \u00e9 trocar a config. O agente, numa sess\u00e3o, l\u00ea o coment\u00e1rio, **extrai o contexto/mudan\u00e7a que ele traz**, classifica (pedido de mudan\u00e7a vs. elogio/observa\u00e7\u00e3o) e s\u00f3 ent\u00e3o reabre + ajusta os crit\u00e9rios (HITL). Escolhido sobre auto-reabrir todo coment\u00e1rio (thrash por \"\u00f3timo trabalho!\") e sobre exigir um marcador no texto (fric\u00e7\u00e3o para um revisor n\u00e3o-t\u00e9cnico).\n\n6. **Sem encurtar texto.** As fatias j\u00e1 eram enxutas (crit\u00e9rios objetivos e test\u00e1veis); a verbosidade morava s\u00f3 nos PRDs, lidos uma vez no corte. O \"enxuto\" veio de matar o ru\u00eddo (caixa n\u00e3o marcada + label presa + PRD aberto \u00e0 toa), n\u00e3o de cortar conte\u00fado.\n\n7. **Cada issue/PRD abre com um resumo para o revisor n\u00e3o-t\u00e9cnico.** No topo do corpo, antes da parte t\u00e9cnica, um bloco **Para o diretor** em linguagem simples e no m\u00ednimo de palavras: (a) o que muda e o valor no sistema; (b) 2\u20133 regras que ele precisa saber pra reconhecer o que est\u00e1 sendo desenvolvido. Gerado pelo `/to-issues` e `/to-prd`. Racional: como o revisor l\u00ea as issues direto no GitHub (decis\u00e3o 3), a parte t\u00e9cnica (\"Action event-driven em `issues.closed`\u2026\") \u00e9 ru\u00eddo pra ele \u2014 esse bloco \u00e9 a porta de entrada que faz ele enxergar valor sem jarg\u00e3o.\n\n> **Para um futuro agente:** a Action reabrindo issues e o `/ship` marcando crit\u00e9rios **n\u00e3o s\u00e3o bugs** \u2014 s\u00e3o este contrato. N\u00e3o \"conserte\" removendo-os. A higiene de label vive na Action (`.github/workflows/`), n\u00e3o em passo manual; o(s) login(s) de revisor s\u00e3o configura\u00e7\u00e3o da Action (`REVIEWER_LOGINS`). Cada issue/PRD abre com o bloco **Para o diretor** (decis\u00e3o 7) \u2014 n\u00e3o remova ao editar corpos.", "cita": [7], "decisao": "O ciclo issue \u2192 PR \u2192 deploy deixava o status **mentir**: a label `in-progress` ficava presa em issues fechadas (15 casos, porque o `Closes #N` fecha mas n\u00e3o mexe em label \u2014 e a doc afirmava, falsamente, que \"sai no merge\"), os crit\u00e9rios de...", "emenda": [], "emendada_por": [54], "file": "docs/adr/0020-ciclo-de-vida-da-issue-status-fiel-e-loop-do-diretor.md", "number": 20, "slug": "0020-ciclo-de-vida-da-issue-status-fiel-e-loop-do-diretor", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Ciclo de vida da issue: status fiel, crit\u00e9rios auto-verificados e loop do diretor"}, {"amended_by": null, "amends": "0016", "body_md": "O ADR 0018 especializou a Elabora\u00e7\u00e3o de POP por Natureza do Setor (assistencial, administrativa, de apoio): coluna em `pops_setores`, infer\u00eancia pelo nome no cadastro, e system prompt composto por blocos (persona da Natureza + \u00edndice + refino + n\u00facleo). As quatro fatias foram entregues em produ\u00e7\u00e3o (v0.35.0 a v0.38.0, PRD #167).\n\nO uso real mostrou que a arquitetura resolve um problema menor que o verdadeiro. Em 99% dos casos o Elaborador anexa um Material de refer\u00eancia com o modelo do POP, e o que decide a qualidade do resultado \u00e9 a fidelidade a esse modelo, n\u00e3o a persona da Natureza. Enquanto isso, o campo Natureza no cadastro de Setor virou atrito sem retorno: mais uma decis\u00e3o para quem mant\u00e9m Setores, sustentando um mecanismo cuja contribui\u00e7\u00e3o o documento anexado atropela.\n\nA decis\u00e3o reverte o mecanismo e reancora o prompt:\n\n1. **A Natureza deixa de existir como atributo do Setor.** Sai a coluna, a infer\u00eancia pelo nome, o endpoint de sugest\u00e3o e o campo no cadastro. Nenhum usu\u00e1rio classifica nada.\n2. **O system prompt volta a ser \u00fanico, com curadoria compacta.** O corpo de normas curado nas fatias #171/#172 (trabalhista/eSocial/faturamento; sanit\u00e1ria/biosseguran\u00e7a/ABNT) n\u00e3o \u00e9 descartado: entra resumido no prompt \u00fanico como refer\u00eancia das tr\u00eas \u00e1reas, que a IA evoca conforme o caso.\n3. **O Setor \u00e9 interpretado pela IA na requisi\u00e7\u00e3o, de forma rasa.** O nome do Setor j\u00e1 viaja no contexto; o system prompt orienta a IA a inferir dele a \u00e1rea e o corpo de normas pertinente. Interpreta\u00e7\u00e3o leve, sem classifica\u00e7\u00e3o persistida e sem c\u00f3digo de roteamento.\n4. **A \u00e2ncora \u00e9 o Material anexado.** A estrutura do POP obedece fielmente ao modelo anexado (ordem, t\u00edtulos, conte\u00fado), refor\u00e7ando o ADR 0016. Sem Material com modelo, vale o template institucional como ponto de partida.\n5. **O Fluxograma \u00e9 a \u00fanica exce\u00e7\u00e3o \u00e0 fidelidade.** A IA sempre produz a se\u00e7\u00e3o de Fluxograma (ADR 0017), mesmo quando o modelo anexado n\u00e3o traz uma. \u00c9 o \u00fanico ponto em que o app melhora o modelo; isso emenda o \"nenhuma se\u00e7\u00e3o \u00e9 for\u00e7ada\" do ADR 0016.\n\n## Por que \u00e9 surpreendente\n\nUm futuro leitor ver\u00e1 quatro fatias entregues e removidas semanas depois. O 0018 descartou o \"agente \u00fanico geral melhorado\" por diluir a persona; este ADR o adota de olhos abertos porque o dado novo inverte o peso: com o modelo anexado dominando a estrutura e o conte\u00fado, a persona especializada contribui pouco, e o custo dela (campo no cadastro, coluna, heur\u00edstica de infer\u00eancia, quatro arquivos de prompt) passou a ser o lado caro da balan\u00e7a. O vi\u00e9s assistencial que motivou o 0018 \u00e9 mitigado agora pela curadoria compacta das tr\u00eas \u00e1reas dentro do prompt \u00fanico, algo que o prompt original de antes do 0018 n\u00e3o tinha.\n\n## Alternativas descartadas\n\n- **Manter a coluna dormente e esconder s\u00f3 a UI**: economiza a migration, mas deixa uma classifica\u00e7\u00e3o invis\u00edvel influenciando prompts, exatamente a opacidade que o 0018 quis evitar. Reverter \u00e9 reverter.\n- **Manter a composi\u00e7\u00e3o por Natureza com sele\u00e7\u00e3o 100% autom\u00e1tica**: mant\u00e9m quatro prompts para sincronizar e a heur\u00edstica de infer\u00eancia para manter, pagando o custo de manuten\u00e7\u00e3o por um ganho que o Material anexado torna marginal.\n- **Descartar tamb\u00e9m a curadoria normativa** (rollback seco): joga fora conte\u00fado curado e barato de manter em forma compacta; a refer\u00eancia resumida \u00e9 a rede contra o vi\u00e9s assistencial voltar.\n\n## Consequ\u00eancias\n\n- Migration de drop da coluna `natureza` em `pops_setores`; a 054 (backfill), nunca aplicada em produ\u00e7\u00e3o, sai do reposit\u00f3rio sem ser executada.\n- Removem-se `services/natureza.py`, o endpoint `GET /pops/setores/sugerir-natureza`, os schemas de Natureza, o select e a coluna no `SetoresManager`, e a composi\u00e7\u00e3o em `montar_system_elaboracao`.\n- Os quatro arquivos de prompt da composi\u00e7\u00e3o colapsam em um `chat_elaboracao_pop_system.md` \u00fanico, que ganha: refer\u00eancia normativa compacta das tr\u00eas \u00e1reas, instru\u00e7\u00e3o de interpretar o Setor pelo nome, fidelidade refor\u00e7ada ao modelo anexado e Fluxograma obrigat\u00f3rio.\n- O ADR 0018 passa a superseded; o ADR 0016 fica emendado no ponto do Fluxograma; o verbete Natureza sai do `docs/pops/CONTEXT.md`.", "cita": [17], "decisao": "O ADR 0018 especializou a Elabora\u00e7\u00e3o de POP por Natureza do Setor (assistencial, administrativa, de apoio): coluna em `pops_setores`, infer\u00eancia pelo nome no cadastro, e system prompt composto por blocos (persona da Natureza + \u00edndice +...", "emenda": [16], "emendada_por": [], "file": "docs/adr/0021-rollback-natureza-elaboracao-ancorada-no-material.md", "number": 21, "slug": "0021-rollback-natureza-elaboracao-ancorada-no-material", "status": "accepted", "substitui": [18], "substituida_por": [], "superseded_by": null, "supersedes": "0018", "title": "Rollback da Natureza: Elabora\u00e7\u00e3o \u00fanica ancorada no Material anexado"}, {"amended_by": "0029, 0061, 0062", "amends": null, "body_md": "Adapta\u00e7\u00e3o do \"loop engineering\" (artigo \"Getting started with loops\", Claude Code, 30/06/2026) ao nosso pipeline `grill \u2192 to-prd \u2192 to-issues \u2192 pegar-issue \u2192 tdd \u2192 ship \u2192 deploy`. Em vez de uma sess\u00e3o humana por issue, um comando \u00fanico (`/onda`) executa a fila de forma aut\u00f4noma: seleciona issues **desbloqueadas**, roda 2-3 em paralelo (1 worktree por issue) at\u00e9 cada uma virar um PR com os 3 gates verdes, e para **uma vez** para o gate humano de merge. Aprovado o lote, mergeia sequencialmente e faz **um** deploy no fim da onda. Depois reabastece com as issues rec\u00e9m-destravadas e repete at\u00e9 a fila esvaziar.\n\nComp\u00f5e os primitivos de loop do artigo: cada issue \u00e9 um loop **goal-based** (para quando o PR fica verde, teto de 3 tentativas); a onda inteira \u00e9 um loop **proactive** com um checkpoint humano; o executor coordena via **agentes em worktrees isolados**.\n\n## Por qu\u00ea\n\nO gargalo do nosso fluxo era humano: cada issue exigia uma sess\u00e3o dedicada, e o merge exige OK expl\u00edcito por PR (merge = deploy em prod). O loop tira de n\u00f3s a parte mec\u00e2nica (claim, tdd, gates, PR) e nos devolve como **revisores de um lote pronto**, n\u00e3o bab\u00e1s do processo. Um \u00fanico toque humano por onda preserva a regra de que push na main \u00e9 a\u00e7\u00e3o humana (o gate continua real), e o deploy \u00fanico por onda evita N rebuilds do Coolify (`watch_paths=null` rebuilda tudo a cada push).\n\n## Considered options\n\n- **Branches empilhadas (stacked PRs)** para 1 \u00fanico OK cobrindo a fila inteira, incluindo dependentes: rejeitado. Rebases em cascata quando a base muda e concentra\u00e7\u00e3o das corridas conhecidas de migration/bump/lockfile. As ondas com checkpoint d\u00e3o o mesmo resultado (fila inteira, um OK por onda) sem a fragilidade da pilha.\n- **Branch de integra\u00e7\u00e3o** (merge aut\u00f4nomo em staging, humano s\u00f3 aprova staging\u2192main) para ter literalmente 1 deploy por N issues: rejeitado. Mudaria o contrato de deploy (Coolify assiste a `main`) e adicionaria uma branch de longa dura\u00e7\u00e3o. O deploy \u00fanico **por onda** j\u00e1 entrega \"poucos deploys pra muitas issues\" sem tocar no contrato.\n- **Aprova\u00e7\u00e3o por PR** (pausa a cada merge): rejeitado. Devolve o humano ao papel de gargalo N vezes por rodada, matando a autonomia que \u00e9 o objetivo.\n- **Revogar o gate de merge** (autonomia total at\u00e9 prod): rejeitado. Confiaria s\u00f3 nos 3 gates + health + rollback, mas o rollback nunca foi exercitado em produ\u00e7\u00e3o e a `/security-review` l\u00ea o diff errado em worktree. O risco n\u00e3o vale a economia de um clique.\n- **Paralelismo total na onda** (todas as destravadas de uma vez): rejeitado a favor de 2-3. Concentra as corridas de migration/lockfile/bump no checkpoint e cria pico de custo de tokens; 2-3 d\u00e1 paralelismo real com merge sequencial re-conferido.\n\n## Consequences\n\n- **Pol\u00edtica de falha \"marcar e seguir\":** issue que n\u00e3o fecha os gates em 3 tentativas \u00e9 rotulada `ready-for-human` com o estado comentado (branch, o que falhou, hip\u00f3tese) e a onda segue. A fila nunca trava por uma issue ruim; as baixas aparecem no checkpoint.\n- **Merge sequencial obrigat\u00f3rio** mesmo com execu\u00e7\u00e3o paralela: segue o playbook manual (bump um a um, `APP_VERSION` antes do deploy, re-conferir `origin/main` antes de cada push). Ver [[project_deploy_ops_manual_ship]] e [[project_bump_race_sessoes_paralelas]].\n- **Gate de seguran\u00e7a em worktree \u00e9 fr\u00e1gil:** a `/security-review` l\u00ea o diff da \u00e1rvore principal, n\u00e3o do worktree (ver [[project_security_review_diff_errado]]). O agente de cada issue precisa escopar o diff explicitamente e o checkpoint sinaliza quando o escopo n\u00e3o p\u00f4de ser confirmado.\n- **`/onda` n\u00e3o substitui** o fluxo interativo (`/pegar-issue` + `/tdd` em terminais separados continua v\u00e1lido para trabalho que quer acompanhamento fino); \u00e9 o modo AFK de esvaziar a fila.", "cita": [], "decisao": "Adapta\u00e7\u00e3o do \"loop engineering\" (artigo \"Getting started with loops\", Claude Code, 30/06/2026) ao nosso pipeline `grill \u2192 to-prd \u2192 to-issues \u2192 pegar-issue \u2192 tdd \u2192 ship \u2192 deploy`. Em vez de uma sess\u00e3o humana por issue, um comando \u00fanico...", "emenda": [], "emendada_por": [29, 61, 62], "file": "docs/adr/0022-onda-execucao-autonoma-da-fila.md", "number": 22, "slug": "0022-onda-execucao-autonoma-da-fila", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Onda: execu\u00e7\u00e3o aut\u00f4noma da fila em ondas com checkpoint por lote e deploy \u00fanico"}, {"amended_by": null, "amends": null, "body_md": "A lista de participantes exibida na Ata e no PDF vinha de `json_ata.participantes`, output cru da IA, sem filtro nem confirma\u00e7\u00e3o, desacoplada do roster oficial (`reuniao_participantes`, que dirige ClickSign e Pend\u00eancias). A IA inflava a lista incluindo pessoas apenas citadas na transcri\u00e7\u00e3o (uma reuni\u00e3o de 6 presentes virava 28), e n\u00e3o havia caminho determin\u00edstico para corrigir: pedir a remo\u00e7\u00e3o via corre\u00e7\u00e3o por IA reacionava o `correcao_ata`, que por regra preserva tudo e re-emite a lista inteira, readicionando os citados; o passo de resolu\u00e7\u00e3o (\"ignorar\") s\u00f3 mexia no roster, nunca na lista exibida.\n\nDecidimos que **a lista de participantes da Ata \u00e9 proposta pela IA apenas na extra\u00e7\u00e3o inicial (a partir da transcri\u00e7\u00e3o) e passa a ser governada pelo Facilitador a partir da\u00ed**:\n\n- A **corre\u00e7\u00e3o por IA nunca reescreve `participantes`**. Ela edita narrativa, discuss\u00e3o, quadro e objetivo; a lista de participantes \u00e9 preservada como est\u00e1. A corre\u00e7\u00e3o da lista \u00e9 sempre determin\u00edstica (manual).\n- O Facilitador **edita a lista diretamente** na valida\u00e7\u00e3o (`AGUARDANDO_VALIDACAO`): excluir (X por participante) e adicionar (picker do cadastro). A edi\u00e7\u00e3o \u00e9 determin\u00edstica, sem IA.\n- Toda edi\u00e7\u00e3o manual **espelha no roster**: excluir remove de `json_ata.participantes` e de `reuniao_participantes`, mantendo tela, PDF e ClickSign consistentes. Excluir algu\u00e9m que \u00e9 respons\u00e1vel de uma a\u00e7\u00e3o no Quadro \u00e9 bloqueado com aviso (preserva o invariante do ADR 0008: respons\u00e1vel escolh\u00edvel \u2286 roster).\n- No passo de resolu\u00e7\u00e3o, **\"ignorar\" um n\u00e3o reconhecido tamb\u00e9m o remove de `json_ata.participantes`**, n\u00e3o s\u00f3 do roster, tornando o passo um filtro real sobre a lista exibida.\n\nConsideramos gatear na origem toda proposta da IA (confirmar cada participante antes de entrar), mas escolhemos o controle manual determin\u00edstico: resolve a dor aguda com menos mudan\u00e7a no pipeline e sem fric\u00e7\u00e3o de confirmar nome a nome. Um ajuste leve no prompt de extra\u00e7\u00e3o (remover o incentivo contradit\u00f3rio a \"incluir normalmente\" e refor\u00e7ar a regra de n\u00e3o incluir citados) reduz o volume inicial, mas n\u00e3o substitui o controle humano, porque a transcri\u00e7\u00e3o n\u00e3o distingue com seguran\u00e7a quem participou de quem foi s\u00f3 mencionado.", "cita": [8], "decisao": "A lista de participantes exibida na Ata e no PDF vinha de `json_ata.participantes`, output cru da IA, sem filtro nem confirma\u00e7\u00e3o, desacoplada do roster oficial (`reuniao_participantes`, que dirige ClickSign e Pend\u00eancias). A IA inflava a...", "emenda": [], "emendada_por": [], "file": "docs/adr/0023-governanca-lista-participantes-ata.md", "number": 23, "slug": "0023-governanca-lista-participantes-ata", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Governan\u00e7a da lista de participantes da Ata"}, {"amended_by": null, "amends": "0017", "body_md": "O ADR 0017 tornou o Fluxograma uma se\u00e7\u00e3o em sintaxe Mermaid: o agente emite `flowchart TD`, o mermaid.js desenha na tela e o SVG capturado no cliente \u00e9 persistido com a Vers\u00e3o para o PDF embutir. A arquitetura entregou o pipeline certo, mas o desenho parou no tema de f\u00e1brica: n\u00f3s todos iguais, sem hierarquia entre passo, decis\u00e3o e terminal; losangos desproporcionais; roteamento do dagre; fonte gen\u00e9rica. Vestir o Mermaid no design system (themeVariables + classDef) foi prototipado e melhora bastante, mas esbarra no teto da biblioteca: formas, propor\u00e7\u00f5es e rotas continuam decis\u00e3o do Mermaid, n\u00e3o do app.\n\nA decis\u00e3o: o Fluxograma passa a ser **estrutura, n\u00e3o sintaxe**. O agente emite a se\u00e7\u00e3o como **JSON de uma gram\u00e1tica restrita ao dom\u00ednio**: sequ\u00eancia de passos, decis\u00f5es com 2 ou mais ramos rotulados (default Sim e N\u00e3o), retornos a passos anteriores e terminais de in\u00edcio e fim. Um renderer pr\u00f3prio do app desenha o SVG com as pe\u00e7as do design system (cards com badge numerado, decis\u00f5es em \u00e2mbar, chips de ramo, terminais navy e verde, roteamento ortogonal em coluna principal com desvios laterais), num layout determin\u00edstico calculado em c\u00f3digo, sem motor de layout externo. Paralelismo e raias por papel ficam fora da gram\u00e1tica; quando o procedimento os tiver, o texto da Descri\u00e7\u00e3o os cobre.\n\nTudo o que o 0017 decidiu de arquitetura permanece: render no cliente, captura do SVG persistida com a Vers\u00e3o, sanitiza\u00e7\u00e3o na entrada, PDF (WeasyPrint) embutindo o mesmo desenho, nenhum render fora do self-hosted.\n\nO legado converte de uma vez: uma migra\u00e7\u00e3o parseia o Mermaid persistido (as conven\u00e7\u00f5es do prompt eram um subset pequeno: terminais, passos, decis\u00f5es bin\u00e1rias, retornos) para o JSON novo, e a depend\u00eancia `mermaid` sai do frontend. PDFs assinados n\u00e3o mudam um byte (usam o SVG persistido); apenas a tela viva passa a desenhar no renderer novo. Conte\u00fado que n\u00e3o parsear mant\u00e9m o fallback de texto bruto que j\u00e1 existia para sintaxe inv\u00e1lida.\n\n## Por que \u00e9 surpreendente\n\nO 0017 escolheu Mermaid justamente porque \"o LLM gera diagramas com naturalidade\", e este ADR o remove pouco depois. O dado novo \u00e9 que a naturalidade da sintaxe cobra caro na sa\u00edda: o desenho tem teto visual baixo e a sintaxe livre produz erros de parse que a tela precisa tratar. Com uma gram\u00e1tica restrita, o JSON validado por schema \u00e9 t\u00e3o natural quanto para o agente (que j\u00e1 emite as demais se\u00e7\u00f5es em JSON), erra menos, e devolve ao app o controle total do desenho. Tamb\u00e9m surpreende um layout escrito \u00e0 m\u00e3o em vez de um motor: s\u00f3 \u00e9 vi\u00e1vel porque a gram\u00e1tica restrita faz do layout um problema fechado (coluna principal + desvios + retornos), n\u00e3o um grafo arbitr\u00e1rio.\n\n## Alternativas descartadas\n\n- **Vestir o Mermaid no design system (tema + classDef, opcionalmente layout ELK)**: 1 issue, ganho real da ordem de 80%, arquitetura intacta. Descartado porque o objetivo \u00e9 o teto visual do documento oficial, e o teto do Mermaid s\u00e3o as suas formas e o seu roteamento. Essa rota n\u00e3o jogaria nada fora: as conven\u00e7\u00f5es por tipo de n\u00f3 s\u00e3o as mesmas que o JSON formaliza.\n- **React Flow (xyflow)**: interatividade de produto, mas n\u00f3s em HTML quebram o caminho vetorial do PDF: raster borrado no A4, ou um segundo render s\u00f3 para impress\u00e3o (a dupla manuten\u00e7\u00e3o que o 0017 j\u00e1 rejeitou). S\u00f3 se justificaria se o Elaborador precisasse editar o diagrama arrastando n\u00f3s.\n- **Grafo livre com elkjs**: cobre topologias arbitr\u00e1rias, mas troca a garantia de desenho sempre limpo por um motor de ~100KB e devolve ao agente a liberdade de gerar estruturas estranhas, o problema que o JSON veio resolver.\n- **D2, Graphviz, servi\u00e7os externos (Kroki, Mermaid Chart)**: peso de compilador WASM no cliente, est\u00e9tica datada, ou conte\u00fado de POP saindo do self-hosted (vetado desde o 0017).\n\n## Consequ\u00eancias\n\n- O `conteudo` da se\u00e7\u00e3o `fluxograma` deixa de ser string Mermaid e vira objeto JSON validado (pydantic no backend, types no frontend), eliminando escaping duplo no prompt.\n- Novo componente de desenho substitui `FluxogramaMermaid.tsx`, reusando a barra de zoom/pan/export, a legenda e a captura de SVG existentes.\n- O prompt da Elabora\u00e7\u00e3o troca as conven\u00e7\u00f5es Mermaid pela gram\u00e1tica JSON com exemplo.\n- Migra\u00e7\u00e3o converte o Mermaid persistido e remove a depend\u00eancia `mermaid` (o bundle do frontend encolhe centenas de KB).\n- Os n\u00fameros dos passos s\u00e3o refer\u00eancia visual do fluxo, sem promessa de correspond\u00eancia com a numera\u00e7\u00e3o da Descri\u00e7\u00e3o do procedimento.\n- Sombras aparecem na tela e s\u00e3o ignoradas pelo WeasyPrint no PDF, sem preju\u00edzo de leitura.", "cita": [], "decisao": "O ADR 0017 tornou o Fluxograma uma se\u00e7\u00e3o em sintaxe Mermaid: o agente emite `flowchart TD`, o mermaid.js desenha na tela e o SVG capturado no cliente \u00e9 persistido com a Vers\u00e3o para o PDF embutir. A arquitetura entregou o pipeline certo...", "emenda": [17], "emendada_por": [], "file": "docs/adr/0024-fluxograma-pop-renderer-proprio-json.md", "number": 24, "slug": "0024-fluxograma-pop-renderer-proprio-json", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Fluxograma de POP: o agente emite estrutura JSON e o app desenha o SVG"}, {"amended_by": null, "amends": null, "body_md": "A aba Mapa do workflow-dashboard renderizava os diagramas dos snapshots com mermaid.js carregado de CDN: o ER do `SCHEMA.md` (auto-gerado pelo `/snapshot`) e os 5 diagramas curados do `FLUXOGRAMAS.md` (2 m\u00e1quinas de estado, 2 sequ\u00eancias, 1 flowchart). O resultado era o pior dos dois mundos: offline nada renderiza (fica o c\u00f3digo cru), e online o Mermaid espalha as ~19 tabelas num grafo gen\u00e9rico ileg\u00edvel, sem hierarquia, sem intera\u00e7\u00e3o, encolhido na caixa.\n\nA decis\u00e3o: o dashboard passa a desenhar os diagramas com **renderers pr\u00f3prios em SVG**, e o mermaid.js sai do painel por completo. A mesma filosofia do ADR 0024 (estrutura, n\u00e3o sintaxe), aplicada \u00e0 ferramenta: quem manda no desenho \u00e9 o app, n\u00e3o a biblioteca.\n\nOs `.md` dos snapshots **continuam em Mermaid**, porque renderizam nativo no GitHub e no GitHub Mobile; eles seguem como \u00fanica fonte de verdade. Quem extrai a estrutura \u00e9 o `collect.py`: parseia os subsets de linha usados (rela\u00e7\u00f5es `A ||--o{ B` e blocos de tabela do `erDiagram`; transi\u00e7\u00f5es `A --> B: r\u00f3tulo` do `stateDiagram-v2`; mensagens `A->>B: texto` do `sequenceDiagram`; n\u00f3s e arestas do `flowchart`) e entrega JSON estruturado no `/api/data`, com testes em `tools/workflow-dashboard/tests`. Bloco que n\u00e3o parsear (ou tipo desconhecido) cai no fallback de c\u00f3digo cru que j\u00e1 existia.\n\nO desenho, por fam\u00edlia:\n\n- **ER**: clusters por dom\u00ednio (Pessoas, Reuni\u00f5es, POPs, Infra) em layout determin\u00edstico, mapeamento tabela para cluster curado num dict no c\u00f3digo com fallback \"outras\". Hover numa tabela acende as FKs dela com tra\u00e7o animado e esmaece o resto; clique expande as colunas completas; zoom/pan com bot\u00e3o de ajustar. O ER interativo vira a capa da aba Mapa, com as pills de documento abaixo.\n- **M\u00e1quinas de estado e flowchart**: espinha do caminho feliz na vertical, desvios (ERRO, CORRIGINDO, ATRASADO, REPACTUADA) pendurados na lateral, retornos em curva. Layout fechado calculado em c\u00f3digo, sem motor de grafo, vi\u00e1vel porque os diagramas curados s\u00e3o ciclos de vida com happy path claro.\n- **Sequ\u00eancia**: colunas de participantes + linhas de mensagem (layout trivialmente determin\u00edstico), com bot\u00e3o de play que percorre as mensagens em ordem descendo as lifelines.\n\nToda anima\u00e7\u00e3o respeita o `reduceMotion` j\u00e1 existente no painel.\n\n## Por que \u00e9 surpreendente\n\nUm leitor futuro vai perguntar por que o `collect.py` parseia Mermaid na m\u00e3o se o mermaid.js existe e os arquivos j\u00e1 est\u00e3o nessa sintaxe. A resposta \u00e9 o teto visual e a depend\u00eancia: o Mermaid decide formas, rotas e escala (e decide mal para 19 tabelas), e o painel local de trabalho dependia de CDN para a sua aba mais visual. Como o ER \u00e9 gerado por m\u00e1quina numa gram\u00e1tica fixa e os diagramas curados usam subsets pequenos e est\u00e1veis, o parse \u00e9 um problema fechado e barato, n\u00e3o um parser de Mermaid geral.\n\n## Alternativas descartadas\n\n- **Vestir o mermaid.js no design system (theme + classDef) e vendorizar o script**: resolveria offline e melhoraria a est\u00e9tica, mas formas, propor\u00e7\u00f5es e roteamento continuariam decis\u00e3o da biblioteca, exatamente o teto que o ADR 0024 j\u00e1 mediu no produto.\n- **Inverter a fonte (FLUXOGRAMAS curado em JSON, Mermaid gerado para o GitHub)**: mais fiel ao 0024, por\u00e9m muda o formato de curadoria humana e exige um gerador extra; o ganho n\u00e3o paga o custo numa ferramenta read-only.\n- **Parsear no browser (JS)**: zero mudan\u00e7a no backend, mas l\u00f3gica de parse sem teste unit\u00e1rio decente e misturada com render.\n- **Motor de layout gen\u00e9rico (dagre/elk caseiro ou vendorizado)**: aguentaria grafos arbitr\u00e1rios que o painel n\u00e3o tem; os diagramas reais t\u00eam estrutura conhecida (clusters, happy path, lifelines) que layouts fechados desenham sempre limpo.\n\n## Consequ\u00eancias\n\n- `loadMermaid`/`mermaidify` e a depend\u00eancia de CDN saem do `app.js`; o painel volta a funcionar 100% offline.\n- `collect.py` ganha um m\u00f3dulo de parse de diagramas com testes; o `/api/data` passa a servir a estrutura junto dos snapshots.\n- Tabela nova no schema aparece no cluster \"outras\" at\u00e9 algu\u00e9m curar o dict de dom\u00ednios.\n- Mudan\u00e7a nos diagramas curados que sair dos subsets parseados degrada para c\u00f3digo cru no painel (nunca quebra), e continua bonita no GitHub.", "cita": [24], "decisao": "A aba Mapa do workflow-dashboard renderizava os diagramas dos snapshots com mermaid.js carregado de CDN: o ER do `SCHEMA.md` (auto-gerado pelo `/snapshot`) e os 5 diagramas curados do `FLUXOGRAMAS.md` (2 m\u00e1quinas de estado, 2 sequ\u00eancias, 1...", "emenda": [], "emendada_por": [], "file": "docs/adr/0025-dashboard-diagramas-renderer-proprio.md", "number": 25, "slug": "0025-dashboard-diagramas-renderer-proprio", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Dashboard desenha os diagramas com renderer pr\u00f3prio; mermaid.js sai do painel"}, {"amended_by": "0045", "amends": null, "body_md": "O documento de Percep\u00e7\u00e3o de Valor (skill `/perceber`) nasceu como HTML autocontido com simula\u00e7\u00e3o animada interativa: stepper manual (quem apresenta controla o ritmo) mais play/pause por cima. Quatro percep\u00e7\u00f5es circularam nesse formato (panorama do ciclo de vida, #187, #210, #200).\n\nA decis\u00e3o: percep\u00e7\u00f5es novas s\u00e3o **v\u00eddeo MP4 renderizado com HyperFrames** (framework open-source da HeyGen que transforma HTML + CSS + anima\u00e7\u00f5es em MP4 determin\u00edstico via Chrome headless + FFmpeg). A simula\u00e7\u00e3o continua sendo escrita em HTML no design system r\u00e9plica do app, agora como composi\u00e7\u00e3o HyperFrames com timeline determin\u00edstica. Divis\u00e3o de pap\u00e9is:\n\n- **Fonte**: a composi\u00e7\u00e3o (HTML + assets) vive versionada em `docs/percepcao/<contexto>/<PRD>-<slug>/`. \u00c9 edit\u00e1vel e reger\u00e1vel.\n- **Entreg\u00e1vel**: o MP4 renderizado na mesma pasta, **fora do git** (`.gitignore`). Render determin\u00edstico: a mesma fonte reproduz o mesmo v\u00eddeo, ent\u00e3o versionar o bin\u00e1rio s\u00f3 duplicaria dezenas de MB no hist\u00f3rico a cada regera\u00e7\u00e3o.\n\nRoteiro fixo do v\u00eddeo: abertura editorial (t\u00edtulo + o que melhorou, cards tipogr\u00e1ficos) \u2192 bloco \"Antes\" de 5 a 10s s\u00f3 quando a issue documenta dor real (nunca inventada) \u2192 demonstra\u00e7\u00e3o atuada ponta a ponta cobrindo todos os crit\u00e9rios de aceite \u2192 fecho com carimbo (PRD, vers\u00e3o do app, data). Sem narra\u00e7\u00e3o de voz na v1: comunica\u00e7\u00e3o 100% em tela, o v\u00eddeo funciona no mudo; voz sintetizada pode entrar depois sem retrabalho de formato. Especifica\u00e7\u00e3o: 1920x1080, 30fps, 60 a 120s.\n\nGate de qualidade em duas camadas, no esp\u00edrito dos gates do `/ship`: auto-revis\u00e3o de frames extra\u00eddos do render draft (fidelidade ao design system, crit\u00e9rios cobertos, gate anti-t\u00e9cnica, zero travess\u00e3o) e OK humano assistindo o draft antes do render final.\n\nAs ferramentas vivem fora do repo: skills HyperFrames instaladas globalmente em `~/.claude/skills/` (pacote completo via `npx skills add heygen-com/hyperframes`), com FFmpeg e Node 22+ na m\u00e1quina.\n\n## Por que \u00e9 surpreendente\n\nUm leitor futuro vai estranhar duas coisas. Primeiro, `docs/percepcao/` mistura `.html` soltos (formato antigo) com pastas de composi\u00e7\u00e3o sem o v\u00eddeo dentro: os HTML antigos s\u00e3o retratos hist\u00f3ricos v\u00e1lidos com links j\u00e1 circulados, ficam como est\u00e3o e s\u00f3 migram sob demanda; os MP4 novos s\u00e3o reger\u00e1veis e por isso n\u00e3o s\u00e3o versionados. Segundo, o formato novo **abre m\u00e3o do stepper interativo**, que era o trunfo do HTML (apresentador controla o ritmo passo a passo). A troca foi consciente: o v\u00eddeo circula sozinho por email, WhatsApp e TV, sem depender de navegador nem de apresentador, e esse alcance vale mais para a \u00e1rea de neg\u00f3cio do que o controle manual de ritmo.\n\n## Alternativas descartadas\n\n- **Manter os dois entreg\u00e1veis (HTML interativo + MP4)**: preservaria o stepper, mas cada percep\u00e7\u00e3o exigiria manter duas vers\u00f5es da mesma simula\u00e7\u00e3o sincronizadas, o dobro de produ\u00e7\u00e3o por PRD.\n- **Narra\u00e7\u00e3o TTS ou avatar HeyGen desde j\u00e1**: mais \"apresenta\u00e7\u00e3o\", por\u00e9m adiciona chave de API, custo por v\u00eddeo e sincroniza\u00e7\u00e3o \u00e1udio-cena ao pipeline. Fica como evolu\u00e7\u00e3o poss\u00edvel.\n- **MP4 versionado (direto ou via Git LFS)**: hist\u00f3rico dos v\u00eddeos exatos que circularam, ao custo de inchar o repo ou configurar LFS em cada worktree/sess\u00e3o paralela; o determinismo do render torna o bin\u00e1rio redundante.\n- **Gravar a tela do app real (screencast)**: fidelidade m\u00e1xima, mas exige ambiente com dados encenados, n\u00e3o \u00e9 determin\u00edstico nem reger\u00e1vel, e n\u00e3o comporta a camada editorial (abertura, antes, legendas) sem editor de v\u00eddeo.\n\n## Consequ\u00eancias\n\n- A skill `/perceber` foi reescrita para o pipeline de v\u00eddeo (fontes da verdade, gate anti-t\u00e9cnica, r\u00e9plica do design system e carimbos permanecem).\n- `docs/percepcao/**/*.mp4` e `node_modules` de composi\u00e7\u00e3o entram no `.gitignore`.\n- Quem precisa de um v\u00eddeo antigo regenera a partir da fonte (minutos de render) ou usa o arquivo que j\u00e1 circulou.\n- Depend\u00eancia de m\u00e1quina (n\u00e3o de repo): FFmpeg, Node 22+ e as skills globais do HyperFrames.\n\n## Emenda (ADR 0045)\n\nO caminho `docs/percepcao/<contexto>/<PRD>-<slug>/` e a regra `docs/percepcao/**/*.mp4` citados acima foram substitu\u00eddos: a composi\u00e7\u00e3o vive em `docs/comunicacao/<contexto>/<PRD>-<slug>/video/` e o `.gitignore` cobre `docs/comunicacao/**/*.mp4` (ADR 0044 e 0045). A decis\u00e3o deste ADR (v\u00eddeo como percep\u00e7\u00e3o, composi\u00e7\u00e3o versionada, MP4 fora do git) n\u00e3o muda.", "cita": [44], "decisao": "O documento de Percep\u00e7\u00e3o de Valor (skill `/perceber`) nasceu como HTML autocontido com simula\u00e7\u00e3o animada interativa: stepper manual (quem apresenta controla o ritmo) mais play/pause por cima. Quatro percep\u00e7\u00f5es circularam nesse formato...", "emenda": [], "emendada_por": [45], "file": "docs/adr/0026-percepcao-de-valor-em-video-hyperframes.md", "number": 26, "slug": "0026-percepcao-de-valor-em-video-hyperframes", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Percep\u00e7\u00e3o de Valor passa a ser v\u00eddeo renderizado (HyperFrames); o HTML interativo com stepper \u00e9 aposentado"}, {"amended_by": "0049", "amends": null, "body_md": "Ado\u00e7\u00e3o **preparada, n\u00e3o instalada** da skill `wayfinder` (mattpocock/skills v1.1) para esfor\u00e7os grandes demais para uma sess\u00e3o de planejamento: um **mapa** compartilhado no GitHub (issue `wayfinder:map`) cujos **tickets** s\u00e3o sub-issues, cada um resolvendo uma decis\u00e3o ou investiga\u00e7\u00e3o. O protocolo operacional (mapa, tickets, frontier, claim, resolu\u00e7\u00e3o) vive na se\u00e7\u00e3o \"Wayfinding operations\" de `docs/agents/issue-tracker.md`; a skill em si s\u00f3 ser\u00e1 instalada quando aparecer o primeiro \u00e9pico com n\u00e9voa multi-sess\u00e3o que n\u00e3o caiba num grilling.\n\n## Por qu\u00ea\n\nHoje, planejamento que atravessa sess\u00f5es vira uma cadeia de grillings + `/passagem`, e o estado morre num documento ef\u00eamero no tmp do OS, invis\u00edvel para o revisor. O mapa como GitHub Issue d\u00e1 persist\u00eancia, retomada por qualquer sess\u00e3o e visibilidade pro diretor (loop do revisor, ADR 0020). Ao mesmo tempo, o hist\u00f3rico do projeto mostra que quase tudo coube no fluxo atual (PRDs #113, #180 e #210 sa\u00edram de grillings de uma sess\u00e3o), ent\u00e3o instalar j\u00e1 seria pagar contexto por um caso raro.\n\nA prepara\u00e7\u00e3o antecipada tem um motivo t\u00e9cnico: a wayfinder v1.1 procura a se\u00e7\u00e3o \"Wayfinding operations\" no doc de issue tracker apontado pelo `CLAUDE.md`; sem ela, a skill cai num fallback de tracker local em markdown, exatamente o tipo de doc de estado paralelo que o `CLAUDE.md` pro\u00edbe.\n\n## Considered options\n\n- **Instalar a skill agora**: rejeitado. Paga context load permanente por um caso que ainda n\u00e3o apareceu; a porta da frente continua sendo a cadeia liderada pelo grill (posi\u00e7\u00e3o do pr\u00f3prio upstream: \"situational on-ramp, not the new main entry flow\").\n- **N\u00e3o preparar nada e instalar quando precisar**: rejeitado. Sem a se\u00e7\u00e3o no issue-tracker.md, a primeira invoca\u00e7\u00e3o criaria o tracker markdown paralelo proibido; o custo da prepara\u00e7\u00e3o \u00e9 uma se\u00e7\u00e3o de doc.\n- **Usar /passagem para planejamento multi-sess\u00e3o**: mantido para travessia de contexto de UMA linha de trabalho, mas rejeitado como mapa de \u00e9pico: o doc \u00e9 ef\u00eamero, local e invis\u00edvel pro revisor.\n\n## Consequences\n\n- Tickets wayfinder **nunca** recebem `ready-for-agent` nem entram na m\u00e1quina de estados do `/triage`: `/pegar-issue` e `/onda` continuam enxergando s\u00f3 a fila de execu\u00e7\u00e3o; as filas n\u00e3o colidem.\n- Quando o mapa limpar (nada mais a decidir), o handoff \u00e9 para `/to-prd` + `/to-issues` (n\u00e3o o to-spec/to-tickets do upstream). Tickets tipo grilling usam `/grill-with-docs`, com o gate de uma pergunta por vez e recomenda\u00e7\u00e3o destacada.\n- O wayfinder planeja e n\u00e3o mergeia: o invariante \"push na main \u00e9 a\u00e7\u00e3o humana\" n\u00e3o \u00e9 tocado.\n- Ao instalar a skill (gatilho: primeiro \u00e9pico com n\u00e9voa), traduzir narra\u00e7\u00e3o e corpos de issue para pt-BR, manter os labels `wayfinder:*` em ingl\u00eas e trocar o handoff final, conforme a se\u00e7\u00e3o do issue-tracker.md.\n\n**Instalada em 2026-09-07** (gatilho: PRD #472, avalia\u00e7\u00f5es do Google, em `needs-info` por depend\u00eancia externa), em `.claude/skills/wayfinder/`, com as adapta\u00e7\u00f5es acima aplicadas.", "cita": [20], "decisao": "Ado\u00e7\u00e3o **preparada, n\u00e3o instalada** da skill `wayfinder` (mattpocock/skills v1.1) para esfor\u00e7os grandes demais para uma sess\u00e3o de planejamento: um **mapa** compartilhado no GitHub (issue `wayfinder:map`) cujos **tickets** s\u00e3o sub-issues...", "emenda": [], "emendada_por": [49], "file": "docs/adr/0027-wayfinder-on-ramp-situacional.md", "number": 27, "slug": "0027-wayfinder-on-ramp-situacional", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Wayfinder: on-ramp situacional para planejamento multi-sess\u00e3o, sob demanda"}, {"amended_by": null, "amends": null, "body_md": "O bloqueio entre issues passa a usar as **issue dependencies nativas** do GitHub (\"blocked by\", GA desde 08/2025, dispon\u00edvel no plano Free e validado no repo). A conven\u00e7\u00e3o anterior, se\u00e7\u00e3o `Bloqueada por: #X` no corpo + label `blocked` + varredura manual de destravamento, foi aposentada. A rela\u00e7\u00e3o nativa \u00e9 a **\u00fanica fonte da verdade**; texto remanescente em issues antigas \u00e9 hist\u00f3rico.\n\nMigra\u00e7\u00e3o executada em 13/07/2026: 19 depend\u00eancias criadas via API para as 16 issues abertas que usavam o formato textual (fam\u00edlias #114-122, #181-184, #214-219), label `blocked` removida das 3 que a tinham e `ready-for-agent` normalizada.\n\n## Por qu\u00ea\n\nTr\u00eas ganhos concretos:\n\n1. **A fila vira uma busca server-side.** `gh issue list --label ready-for-agent --search \"no:assignee -is:blocked\"` substitui parse de corpo + gest\u00e3o de label em `/pegar-issue`, `/onda` e no protocolo do issue-tracker.\n2. **Destravamento autom\u00e1tico.** Quando a \u00faltima bloqueadora fecha, `is:blocked` deixa de casar e a dependente reaparece na fila sozinha. A varredura manual (remover `blocked`, adicionar `ready-for-agent`), um passo que podia ser esquecido entre sess\u00f5es, deixa de existir.\n3. **Estado estrutural, n\u00e3o textual.** A UI mostra o \u00edcone \"Blocked\" e o painel de depend\u00eancias; webhooks ficam dispon\u00edveis para automa\u00e7\u00e3o futura.\n\n## Considered options\n\n- **Migra\u00e7\u00e3o h\u00edbrida** (nativa manda, corpo mant\u00e9m a linha como leitura humana): rejeitada. Duas fontes que podem divergir; a UI do GitHub j\u00e1 mostra a rela\u00e7\u00e3o de forma proeminente.\n- **N\u00e3o migrar agora** (esperar `gh` >= 2.94.0, que traz `--add-blocked-by`): rejeitada. A escrita j\u00e1 funciona hoje via `gh api` POST (custo de um GET extra para resolver n\u00famero \u2192 id global), e a leitura da fila (`-is:blocked` no `gh issue list --search`) funciona na vers\u00e3o instalada.\n- **Manter o esquema textual**: rejeitada. Era a origem da varredura manual e do risco de fila mentirosa.\n\n## Consequences\n\n- A fatia bloqueada **nasce com `ready-for-agent`**: quem esconde ela da fila \u00e9 o `-is:blocked`, n\u00e3o a aus\u00eancia de label. O `/to-issues` cria a depend\u00eancia nativa no publish (uma por bloqueadora, em ordem de depend\u00eancia).\n- O endpoint de escrita exige o **id global** da bloqueadora (`gh api .../dependencies/blocked_by -F issue_id=<id>`), n\u00e3o o n\u00famero. Com `gh` >= 2.94.0, simplificar para `gh issue edit <N> --add-blocked-by <X>`.\n- Automa\u00e7\u00e3o que use o REST **legado** `GET /search/issues` precisa de `advanced_search=true`, sen\u00e3o `is:blocked` \u00e9 ignorado em sil\u00eancio (falso \"nada bloqueado\"). O `gh issue list --search` n\u00e3o sofre disso.\n- A label `blocked` est\u00e1 aposentada (`docs/agents/triage-labels.md`); a Action de higiene pode continuar tentando remov\u00ea-la em fechamentos, sem efeito.\n- Limite nativo de 50 depend\u00eancias por rela\u00e7\u00e3o: folgado para o padr\u00e3o espinha \u2192 fatias.", "cita": [], "decisao": "O bloqueio entre issues passa a usar as **issue dependencies nativas** do GitHub (\"blocked by\", GA desde 08/2025, dispon\u00edvel no plano Free e validado no repo). A conven\u00e7\u00e3o anterior, se\u00e7\u00e3o `Bloqueada por: #X` no corpo + label `blocked` +...", "emenda": [], "emendada_por": [], "file": "docs/adr/0028-bloqueio-por-dependencia-nativa.md", "number": 28, "slug": "0028-bloqueio-por-dependencia-nativa", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Bloqueio entre issues por depend\u00eancia nativa do GitHub"}, {"amended_by": "0035", "amends": "0022", "body_md": "O ADR 0022 definiu a onda com goal \"fila-alvo vazia + deploys verdes\". Na pr\u00e1tica, uma `/onda #PRD` podia terminar com todas as fatias mergeadas e deployadas sem ningu\u00e9m conferir se o **PRD inteiro** funciona (integra\u00e7\u00e3o entre fatias), e o orquestrador confiava num retorno estruturado que o sub-agente \u00e0s vezes n\u00e3o emite (caso conhecido: parar no `/code-review` esperando os review-agents e notificar \"completed\" sem wrap-up, ver [[project_onda_subagente_async_sem_json]]). Este ADR registra tr\u00eas refinamentos ao contrato da onda; tudo o mais do 0022 permanece.\n\n## Decis\u00f5es\n\n1. **Goal de conclus\u00e3o do PRD (auditoria p\u00f3s-fechamento).** Com `/onda #PRD`, ap\u00f3s a \u00faltima onda e deploy verde, um sub-agente fresco l\u00ea o PRD, verifica os crit\u00e9rios de aceite **do PRD** ponta a ponta contra o app deployado (smoke via API/UI, incluindo a integra\u00e7\u00e3o entre fatias, n\u00e3o s\u00f3 os crit\u00e9rios de cada fatia) e comenta o resultado no PRD. Nesse momento o PRD normalmente **j\u00e1 est\u00e1 fechado**: a Action de higiene (ADR 0020) fecha o PRD sozinha quando a \u00faltima fatia fecha. A verifica\u00e7\u00e3o \u00e9, portanto, uma **auditoria p\u00f3s-fechamento**: tudo verde, o coment\u00e1rio com a evid\u00eancia encerra o assunto; qualquer falha, o sub-agente **reabre** o PRD com `ready-for-human` e o que falhou. O invariante do 0022 n\u00e3o muda: merge e push na main continuam atr\u00e1s do checkpoint humano; a autonomia nova \u00e9 comentar/reabrir a issue do PRD (revers\u00edvel), n\u00e3o deploy.\n\n2. **GitHub como fonte de verdade da conclus\u00e3o do sub-agente.** O status estruturado que o sub-agente retorna (`{issue, pr, verde, tentativas, notas}`) passa a ser dica, n\u00e3o contrato. A cada notifica\u00e7\u00e3o de t\u00e9rmino, o orquestrador confere o estado real via `gh` (PR aberto? gates verdes? labels corretas?) e re-engaja o agente via `SendMessage(nome)` quando o estado real n\u00e3o bate com o notificado.\n\n3. **Orquestrador magro por design.** O orquestrador n\u00e3o l\u00ea c\u00f3digo, diff nem spec inteira; mant\u00e9m apenas a tabela da fila e o status por issue. Toda leitura pesada (PRD, crit\u00e9rios de aceite, diffs) acontece dentro dos sub-agentes, que j\u00e1 nascem com contexto fresco. Isso protege a sess\u00e3o orquestradora do incha\u00e7o de contexto em PRDs com muitas ondas.\n\n## Considered options\n\n- **Fechamento condicional pela /onda (fechar s\u00f3 se a verifica\u00e7\u00e3o passar):** foi a reda\u00e7\u00e3o original desta decis\u00e3o, rejeitada na revis\u00e3o do PR #242. A Action de higiene (ADR 0020, `higiene-issues.yml`) fecha o PRD quando a \u00faltima fatia fecha, antes de a verifica\u00e7\u00e3o rodar; o fechamento condicional era inalcan\u00e7\u00e1vel e o \"sem fechar\" em falha, imposs\u00edvel de honrar. A auditoria p\u00f3s-fechamento com reopen entrega a mesma garantia sem colidir com a automa\u00e7\u00e3o.\n- **Action pular PRDs (a /onda fecharia):** rejeitado. Altera o contrato do ADR 0020 e deixa PRDs entregues fora da onda abertos \u00e0 toa.\n- **Verificar antes do \u00faltimo merge:** rejeitado. Verificaria contra um app sem a \u00faltima fatia deployada, quebrando o prop\u00f3sito do smoke ponta a ponta.\n- **S\u00f3 comentar a verifica\u00e7\u00e3o e deixar o humano reagir:** rejeitado. Reabrir com `ready-for-human` \u00e9 revers\u00edvel, audit\u00e1vel (o coment\u00e1rio fica no PRD) e evita que uma falha de integra\u00e7\u00e3o durma num PRD fechado.\n- **N\u00e3o verificar o PRD inteiro:** rejeitado. Os crit\u00e9rios por fatia via `/tdd` n\u00e3o cobrem a integra\u00e7\u00e3o entre fatias; \u00e9 exatamente a lacuna que o goal de PRD fecha.\n- **Endurecer o contrato de retorno no prompt do sub-agente:** rejeitado como mecanismo principal. J\u00e1 falhou na pr\u00e1tica; prompt n\u00e3o \u00e9 garantia. O contrato continua no prompt, mas a confian\u00e7a migra para o estado verific\u00e1vel no GitHub.\n- **Sess\u00f5es independentes de verdade (claude -p headless, /passagem --bg por issue) no lugar dos sub-agentes:** rejeitado. O Agent tool j\u00e1 entrega contexto fresco por issue e worktree isolado; sess\u00f5es separadas perderiam o checkpoint de merge centralizado e multiplicariam o custo de coordena\u00e7\u00e3o (estado s\u00f3 via GitHub).\n- **Passagem entre ondas para conter o incha\u00e7o do orquestrador:** rejeitado. Quebraria o fluxo do checkpoint humano e adicionaria uma engrenagem por onda; o orquestrador magro + sumariza\u00e7\u00e3o nativa de contexto bastam.\n\n## Consequences\n\n- O relat\u00f3rio final da onda escopada em PRD ganha o **veredito do PRD** (verificado com evid\u00eancia comentada, ou reaberto `ready-for-human` com o que falhou).\n- O orquestrador precisa de verifica\u00e7\u00e3o ativa via `gh` a cada t\u00e9rmino de sub-agente; o custo \u00e9 pequeno e elimina a depend\u00eancia do wrap-up.\n- A regra do orquestrador magro vira restri\u00e7\u00e3o operacional da skill: se o orquestrador precisar de um fato do c\u00f3digo, delega a leitura a um sub-agente.", "cita": [20], "decisao": "O ADR 0022 definiu a onda com goal \"fila-alvo vazia + deploys verdes\". Na pr\u00e1tica, uma `/onda #PRD` podia terminar com todas as fatias mergeadas e deployadas sem ningu\u00e9m conferir se o **PRD inteiro** funciona (integra\u00e7\u00e3o entre fatias), e o...", "emenda": [22], "emendada_por": [35], "file": "docs/adr/0029-onda-goal-prd-fonte-verdade-github.md", "number": 29, "slug": "0029-onda-goal-prd-fonte-verdade-github", "status": "superseded", "substitui": [], "substituida_por": [68], "superseded_by": "0068", "supersedes": null, "title": "Onda escopada em PRD: goal de conclus\u00e3o, fonte de verdade no GitHub e orquestrador magro"}, {"amended_by": null, "amends": "0003", "body_md": "O ADR 0003 fixou que Pend\u00eancia nasce de estado terminal (ASSINADA ou APROVADA). No caminho com ClickSign isso significava esperar o Envelope fechar com todas as assinaturas, e a pr\u00e1tica exp\u00f4s dois problemas. Primeiro, a ClickSign finaliza o documento sozinha ap\u00f3s o deadline (30 dias) mesmo com assinaturas faltando, e esse evento ca\u00eda no ramo \"sem a\u00e7\u00e3o definida\" do webhook: a Reuni\u00e3o ficava presa em `AGUARDANDO_ASSINATURA` p
