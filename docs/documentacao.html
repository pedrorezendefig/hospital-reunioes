\u00f3digo para manter num site que entrega isso de gra\u00e7a); reestruturar por jornada (desalinha do item Ajuda do app, que abre por m\u00f3dulo).\n\n7. **Dois PRDs.** Um para o texto (regra, lints, varredura do front, hover do Hospital OS, reescrita do Manual, busca e home) e um para os v\u00eddeos do Manual (emenda \u00e0 ADR 0057, abaixo). Gates, sess\u00f5es e ritmo s\u00e3o diferentes; o de v\u00eddeo depende s\u00f3 da regra do primeiro. A regra global foi gravada na pr\u00f3pria sess\u00e3o do grilling, porque vive fora do reposit\u00f3rio.\n\n## Consequ\u00eancias\n\n- `~/.claude/CLAUDE.md` ganha a regra 8. Os CLAUDE.md dos outros reposit\u00f3rios n\u00e3o precisam repetir; podem somar amostra de voz.\n- `.github/PULL_REQUEST_TEMPLATE.md`, `/ship`, `collect.py` e `prs.js` mudam juntos na mesma fatia; o `README.md` do Hospital OS descreve o hover novo.\n- `tools/lint_manual.py` e o ESLint do front ganham os tells regex\u00e1veis. Falso positivo leg\u00edtimo (contraste em que as duas metades informam) se resolve reescrevendo, como j\u00e1 \u00e9 com o travess\u00e3o.\n- A `/manual` e a `/divulgar` ganham o passo do humanizer na r\u00e9gua; o `/ask-pedro` cita a ADR.\n- A reescrita dos 200 PRs mergeados altera corpo de PR fechado; \u00e9 ru\u00eddo no hist\u00f3rico do GitHub, aceito uma vez.", "cita": [], "decisao": "Decis\u00e3o do Pedro (13/out/2026, grilling). O texto que o hospital l\u00ea (Manual do usu\u00e1rio, telas do app, PDFs de Ata e POP, hover do Hospital OS, mensagens e p\u00e1ginas de divulga\u00e7\u00e3o) \u00e9 escrito por agente, e carrega os cacoetes de texto gerado...", "emenda": [57], "emendada_por": [78], "file": "docs/adr/0071-humanizer-e-a-regua-do-texto-para-fora.md", "number": 71, "slug": "0071-humanizer-e-a-regua-do-texto-para-fora", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Humanizer \u00e9 a r\u00e9gua de todo texto para fora; o manual e o Hospital OS s\u00e3o reescritos por ela"}, {"amended_by": "0076", "amends": "0057", "body_md": "Decis\u00e3o do Pedro (14/out/2026, PRD #1259). O Manual tinha 61 V\u00eddeos de tarefa, um por P\u00e1gina de tarefa, mais sete v\u00eddeos de cap\u00edtulo na abertura da Ouvidoria. Com o rerender no Estilo do manual, cada v\u00eddeo ficou maior, e o site inteiro encostou no teto de 90 MB que o `publicar.sh` imp\u00f5e para caber nos 100 MB do plano gr\u00e1tis da Vercel. Pagar o plano Pro ou hospedar v\u00eddeo fora do site s\u00e3o decis\u00f5es maiores do que o problema. A sa\u00edda \u00e9 ter menos v\u00eddeo e v\u00eddeo mais \u00fatil: um por m\u00f3dulo, mostrando o caminho principal de ponta a ponta.\n\n## Decis\u00f5es\n\n1. **Um V\u00eddeo de vis\u00e3o geral por m\u00f3dulo, na abertura.** Cada m\u00f3dulo abre com um v\u00eddeo de 90 a 120 s, mudo, com legendas, que mostra o caminho principal do m\u00f3dulo com dados de exemplo, no Estilo do manual (tokens, cards, gates por quadros, `VERIFY.md`, carimbo). O v\u00eddeo entra pelo campo `video:` do frontmatter da abertura (`<modulo>/index.md`), que o tema j\u00e1 sabia ler. \"Conhe\u00e7a a plataforma\" \u00e9 o v\u00eddeo de Primeiros passos, e a p\u00e1gina inicial do Manual mostra o mesmo arquivo. Emenda as decis\u00f5es 3 e 4 da ADR 0057: a composi\u00e7\u00e3o continua em `docs/manual/video/<modulo>/<slug>/`, e a unidade do v\u00eddeo passa a ser o m\u00f3dulo. Rejeitado: manter o v\u00eddeo por tarefa com compress\u00e3o mais forte (a soma continua crescendo a cada tarefa nova); v\u00eddeo por cap\u00edtulo (j\u00e1 rejeitado na 0057).\n\n2. **O V\u00eddeo de tarefa sai do Manual.** As 61 P\u00e1ginas de tarefa perdem o v\u00eddeo e ficam com o texto e os prints. As composi\u00e7\u00f5es dos V\u00eddeos de tarefa e dos sete cap\u00edtulos da Ouvidoria saem do reposit\u00f3rio; o `_estilo/` fica, e as composi\u00e7\u00f5es antigas continuam no hist\u00f3rico do git (o \u00faltimo commit com elas \u00e9 `72a3781f`). Os masters em `local/manual-video-masters/` n\u00e3o s\u00e3o apagados: s\u00e3o a \u00fanica c\u00f3pia dos MP4 e v\u00e3o servir a um link externo, fora do deploy, que \u00e9 outro PRD. O tema s\u00f3 desenha v\u00eddeo na abertura e na p\u00e1gina inicial, e o conferidor recusa `video:` em qualquer outra p\u00e1gina.\n\n3. **O Admin fica sem v\u00eddeo.** Quem usa s\u00e3o poucas pessoas, e o texto da p\u00e1gina basta. O invent\u00e1rio da `/montar-manual` n\u00e3o cobra v\u00eddeo dele.\n\n4. **Or\u00e7amento como trava no `publicar.sh`.** Depois do reencode 720p, tr\u00eas travas: a soma dos MP4 at\u00e9 **40 MB**, no m\u00e1ximo **um v\u00eddeo por m\u00f3dulo** (a p\u00e1gina inicial usa o arquivo de Primeiros passos e conta uma vez s\u00f3) e nenhum v\u00eddeo acima de **8 MB**. O teto de 90 MB do site inteiro continua. A recusa diz a regra que quebrou e o v\u00eddeo. Emenda a decis\u00e3o 6 da ADR 0057. Rejeitado: s\u00f3 o teto de 90 MB (avisa tarde, quando o site j\u00e1 n\u00e3o cabe); or\u00e7amento s\u00f3 na receita da skill (ningu\u00e9m trava).\n\n5. **Novidades levam link, n\u00e3o v\u00eddeo.** O V\u00eddeo de percep\u00e7\u00e3o de valor embutido nas Novidades de Ouvidoria, POPs e Reuni\u00f5es vira link para a p\u00e1gina de divulga\u00e7\u00e3o da entrega. Entrega sem p\u00e1gina de divulga\u00e7\u00e3o perde o v\u00eddeo da p\u00e1gina, sem link (o caso do PRD #210, dos POPs). Emenda a decis\u00e3o 12 da ADR 0057. O conferidor do build passa a recusar `<video>` fora da abertura do m\u00f3dulo.\n\n6. **A Fatia de manual s\u00f3 pede v\u00eddeo quando o caminho principal muda.** O `/to-issues` escreve na Fatia de manual se o PRD muda o caminho principal do m\u00f3dulo; s\u00f3 a\u00ed o V\u00eddeo de vis\u00e3o geral \u00e9 refeito. PRD que mexe numa tarefa do canto muda a p\u00e1gina e n\u00e3o o v\u00eddeo. Emenda a decis\u00e3o 8 da ADR 0057.\n\n## Consequ\u00eancias\n\n- O `checar_video_manual.py` olha as aberturas e para de exigir composi\u00e7\u00e3o por tarefa; o `checar_build_manual.py` confere no HTML gerado que a abertura com `video:` mostra o player com a capa e que nenhuma outra p\u00e1gina tem v\u00eddeo.\n- A `/montar-manual` troca a lacuna `sem-video` por tarefa pela `sem-visao-geral` por m\u00f3dulo, com o Admin isento. A receita da `/manual` passa a ser `references/video-de-visao-geral.md`.\n- O Manual fica sem v\u00eddeo at\u00e9 as cinco fatias de v\u00eddeo do PRD #1259 subirem, uma por m\u00f3dulo.\n- O termo \"V\u00eddeo de tarefa\" fica no `CONTEXT.md` marcado como fora do Manual; o v\u00eddeo do Manual de hoje \u00e9 o \"V\u00eddeo de vis\u00e3o geral\".\n\n## Emenda a esta ADR (01/nov/2026, ADR 0076)\n\nDecis\u00e3o do Pedro (PRD #1365). O v\u00eddeo de 14/10 envelheceu sem ningu\u00e9m ver e n\u00e3o cobria o m\u00f3dulo.\n\n- **Decis\u00e3o 1, o formato:** o V\u00eddeo de vis\u00e3o geral passa a ter de 2 a 3 min (a Tecnologia, at\u00e9 3 min e meio), mostra o m\u00f3dulo ponto a ponto, \u00e9 narrado com a voz A com a fala escrita na tela e \u00e9 feito em Remotion pela skill `motion`. O player perde o `muted` e continua sem autoplay. A Tecnologia ganha v\u00eddeo; Admin e Central de Comando continuam sem.\n- **Decis\u00e3o 2, os masters dos V\u00eddeos de tarefa:** deixam de ser guardados para um link externo. Depois que os seis v\u00eddeos novos est\u00e3o no ar, um script idempotente que o Pedro roda apaga os V\u00eddeos de tarefa e os v\u00eddeos substitu\u00eddos de `~/Videos/Hospital/Manual/`.\n- **Decis\u00e3o 4, o or\u00e7amento:** at\u00e9 10 MB por v\u00eddeo e at\u00e9 60 MB somando, com o site inteiro at\u00e9 90 MB, depois do reencode 720p H.264 com \u00e1udio AAC de 64 kbps. Um v\u00eddeo por m\u00f3dulo continua.\n- **Decis\u00e3o 6, quando refazer:** todo PRD que muda p\u00e1gina de um m\u00f3dulo refaz o v\u00eddeo daquele m\u00f3dulo, salvo exce\u00e7\u00e3o escrita na Fatia de manual. O `meta.json` do v\u00eddeo guarda os `prds_cobertos`, e a `/montar-manual` acusa `video-desatualizado`.\n\nO detalhe e os rejeitados est\u00e3o na ADR 0076.", "cita": [], "decisao": "Decis\u00e3o do Pedro (14/out/2026, PRD #1259). O Manual tinha 61 V\u00eddeos de tarefa, um por P\u00e1gina de tarefa, mais sete v\u00eddeos de cap\u00edtulo na abertura da Ouvidoria. Com o rerender no Estilo do manual, cada v\u00eddeo ficou maior, e o site inteiro...", "emenda": [57], "emendada_por": [76], "file": "docs/adr/0072-manual-com-um-video-de-visao-geral-por-modulo-e-orcamento-de-40-mb.md", "number": 72, "slug": "0072-manual-com-um-video-de-visao-geral-por-modulo-e-orcamento-de-40-mb", "status": "superseded", "substitui": [], "substituida_por": [78], "superseded_by": "0078", "supersedes": null, "title": "Manual com um V\u00eddeo de vis\u00e3o geral por m\u00f3dulo e or\u00e7amento de 40 MB"}, {"amended_by": null, "amends": "0070", "body_md": "A decis\u00e3o 10 da ADR 0070, seguindo a spec v1.0 do diretor (\"Faturista v\u00ea s\u00f3 as pr\u00f3prias contas\"), amarrou a conta a quem subiu os PDFs: o envio grava `cm_conta.faturista_id` com o id de quem enviou, e a fila, a abertura do Guia, o \"Concluir e abrir a pr\u00f3xima\" e a linha de Produ\u00e7\u00e3o do Painel filtram por ele. No primeiro uso real (29/10/2026) o diretor subiu as contas pelo login da Adriana; no dia seguinte as faturistas, cada uma com o seu login, viram a fila zerada. O modelo de trabalho que ele descreveu \u00e9 outro: qualquer pessoa sobe a conta (at\u00e9 a secret\u00e1ria), as faturistas v\u00e3o puxando da fila, e a produtividade conta quem analisou.\n\nA decis\u00e3o separa os dois pap\u00e9is:\n\n1. **Fila comum, a conta ganha dono na abertura.** Toda conta com Guia pronto (`A_FAZER`) \u00e9 livre, qualquer que seja o `faturista_id`. Quem abre o Guia primeiro vira a faturista da conta, no mesmo UPDATE condicional `A_FAZER -> EM_CORRECAO` que j\u00e1 existia; quem perde a corrida recebe 409 e volta para a fila. O \"Concluir e abrir a pr\u00f3xima\" pega a primeira conta livre na ordem de envio.\n2. **`faturista_id` passa a ser s\u00f3 quem analisa.** Nasce nulo no envio. Quem enviou sai de `cm_envio.usuario_id`, pelo `cm_arquivo`. O aviso de envio processado vai para quem enviou; o Retorno da Valida\u00e7\u00e3o e a Produ\u00e7\u00e3o do Painel continuam no `faturista_id`.\n3. **A faturista v\u00ea duas listas:** \"Fila\" (livres, em ordem de envio) e \"Minhas\" (as que puxou e n\u00e3o concluiu). A conta que espera arquivo, processa ou deu erro n\u00e3o entra na Fila: fica em \"Meus envios\" de quem enviou, que \u00e9 quem tem o PDF que falta. Quem tem \"painel completo\" v\u00ea tudo.\n4. **Duas permiss\u00f5es no lugar de uma.** A chave `enviar_corrigir_contas` fica com o r\u00f3tulo \"Analisar contas\" e soma-se `enviar_contas`, ligada pela migration para todo perfil que j\u00e1 tinha a antiga. Perfil novo `apoio_faturamento` (nome de tela a confirmar com o diretor), s\u00f3 com \"Enviar contas\".\n5. **Devolver \u00e0 fila.** A faturista devolve a conta dela em `EM_CORRECAO`, e quem tem \"painel completo\" devolve a de qualquer uma: volta a `A_FAZER` com `faturista_id` nulo, mantendo marca\u00e7\u00f5es e `aberta_em`. Conta em Retorno n\u00e3o se devolve. Na produ\u00e7\u00e3o conta quem concluiu.\n\n## Por que \u00e9 surpreendente\n\nContraria a spec do pr\u00f3prio diretor e a decis\u00e3o 10 da 0070, escritas antes do primeiro uso. Quem ler o c\u00f3digo antigo vai achar que \"faturista v\u00ea s\u00f3 as dela\" \u00e9 regra de sigilo entre faturistas; n\u00e3o era, era a suposi\u00e7\u00e3o de que quem sobe \u00e9 quem analisa.\n\n## Consequ\u00eancias\n\n- A fatia 1 (fila comum, dono na abertura) n\u00e3o tem migration: as contas de ontem, ainda em `A_FAZER` com a Adriana no `faturista_id`, voltam livres sem UPDATE em produ\u00e7\u00e3o.\n- A migration da fatia 2 s\u00f3 acrescenta (chave e perfil novos). O c\u00f3digo velho continua funcionando entre a aplica\u00e7\u00e3o da migration e a subida.\n- O que as faturistas conclu\u00edrem pelo login da Adriana antes da fatia 1 conta como produ\u00e7\u00e3o da Adriana, e n\u00e3o d\u00e1 para separar depois.\n\n## Alternativas descartadas\n\n- **Coordena\u00e7\u00e3o distribui a conta antes do trabalho**: p\u00f5e um ato manual entre o envio e a an\u00e1lise, que o diretor n\u00e3o pediu.\n- **Fila sem dono, produ\u00e7\u00e3o por quem concluiu**: duas faturistas podem trabalhar a mesma conta ao mesmo tempo, e o track record perde o come\u00e7o da an\u00e1lise.\n- **Coluna nova `enviado_por` em `cm_conta`**: migration para guardar o que `cm_envio.usuario_id` j\u00e1 guarda.\n- **Renomear a chave para `analisar_contas`**: aplicada a migration antes do c\u00f3digo, tira o acesso de todas as faturistas, a indisponibilidade que o diretor quer evitar.\n- **Paliativo de ligar \"painel completo\" para faturista**: libera a fila, mas mostra o Painel inteiro e continua contando tudo para quem enviou.", "cita": [], "decisao": "A decis\u00e3o 10 da ADR 0070, seguindo a spec v1.0 do diretor (\"Faturista v\u00ea s\u00f3 as pr\u00f3prias contas\"), amarrou a conta a quem subiu os PDFs: o envio grava `cm_conta.faturista_id` com o id de quem enviou, e a fila, a abertura do Guia, o...", "emenda": [70], "emendada_por": [], "file": "docs/adr/0073-contas-medicas-fila-comum-quem-envia-nao-e-quem-analisa.md", "number": 73, "slug": "0073-contas-medicas-fila-comum-quem-envia-nao-e-quem-analisa", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Contas m\u00e9dicas: fila comum, e quem envia n\u00e3o \u00e9 quem analisa"}, {"amended_by": null, "amends": "0070", "body_md": "A decis\u00e3o 9 da ADR 0070 p\u00f4s a IA do m\u00f3dulo no OpenRouter e mandou toda requisi\u00e7\u00e3o com `provider.zdr: true` e `data_collection: \"deny\"`, para que o prontu\u00e1rio desidentificado s\u00f3 fosse a provedor sem reten\u00e7\u00e3o. Em 30/10/2026 o cr\u00e9dito do OpenRouter acabou, a fila parou com `402 Payment Required` em todas as chamadas, e o Pedro decidiu tirar a IA de texto do OpenRouter (issue #1302).\n\nDecis\u00e3o do Pedro (30/10/2026):\n\n1. **A IA de texto do app vai para a API da Anthropic**, toda no `claude-sonnet-5-5`, com a chave da org do Pedro e o cr\u00e9dito mensal dela. Isso vale para Contas m\u00e9dicas (Passo A, Passo B e o resto de `contas_medicas/ia.py`), para Atas, POP e Ouvidoria (`ai_processor.py`) e para o assistente de Tecnologia. A transcri\u00e7\u00e3o de \u00e1udio fica no OpenRouter, porque a API da Anthropic n\u00e3o transcreve.\n2. **Sem ZDR.** Vale a reten\u00e7\u00e3o padr\u00e3o da API da Anthropic: o que o app envia e o que a IA responde fica guardado por at\u00e9 30 dias, para controle de abuso, e n\u00e3o \u00e9 usado para treino. O Pedro decidiu n\u00e3o pedir ZDR \u00e0 Anthropic. O m\u00f3dulo continua obrigado a desidentificar antes de enviar (decis\u00e3o 8 da ADR 0070), e \u00e9 isso que limita o que chega \u00e0 Anthropic: r\u00f3tulo e idade, nunca nome, CPF ou carteira.\n3. **O resto da decis\u00e3o 9 continua**, agora no SDK `anthropic`: sa\u00edda estruturada validada por Pydantic, instru\u00e7\u00e3o e mem\u00f3ria da operadora em bloco com `cache_control`, tokens e custo gravados por chamada. Como a Anthropic n\u00e3o devolve o custo pronto, o custo sai dos tokens com uma tabela de pre\u00e7o no c\u00f3digo. A \u00fanica mudan\u00e7a nas tentativas \u00e9 a falta de cr\u00e9dito, que deixa de ser repetida e vai direto para Erro com uma frase que diz o que fazer.\n\n## Consequ\u00eancias\n\n- At\u00e9 30 dias de reten\u00e7\u00e3o do texto desidentificado de prontu\u00e1rio fora do hospital. Se o diretor ou o jur\u00eddico pedirem reten\u00e7\u00e3o zero, o caminho \u00e9 pedir ZDR \u00e0 Anthropic, sem mudar c\u00f3digo.\n- Registrar a Anthropic como operadora de dados continua sendo decis\u00e3o do diretor com o jur\u00eddico, como a ADR 0070 j\u00e1 dizia para o provedor anterior.\n- Um fornecedor e um saldo para toda a IA de texto. O OpenRouter fica s\u00f3 com o \u00e1udio e precisa de cr\u00e9dito pr\u00f3prio para a transcri\u00e7\u00e3o das Atas.", "cita": [], "decisao": "A decis\u00e3o 9 da ADR 0070 p\u00f4s a IA do m\u00f3dulo no OpenRouter e mandou toda requisi\u00e7\u00e3o com `provider.zdr: true` e `data_collection: \"deny\"`, para que o prontu\u00e1rio desidentificado s\u00f3 fosse a provedor sem reten\u00e7\u00e3o. Em 30/10/2026 o cr\u00e9dito do...", "emenda": [70], "emendada_por": [], "file": "docs/adr/0074-contas-medicas-ia-na-api-da-anthropic-sem-zdr.md", "number": 74, "slug": "0074-contas-medicas-ia-na-api-da-anthropic-sem-zdr", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Contas m\u00e9dicas: IA na API da Anthropic, com a reten\u00e7\u00e3o padr\u00e3o e sem ZDR"}, {"amended_by": "0076", "amends": "0054, 0056", "body_md": "Decis\u00e3o do Pedro (01/11/2026, grilling fechado em lote pelo `/express` e aprovado no painel). O planejamento de uma melhoria hoje \u00e9 todo no terminal: o Pedro roda o `/grill-with-docs`, responde pelo diretor o que \u00e9 de neg\u00f3cio, e s\u00f3 depois o PRD chega \u00e0 aba Tecnologia pelo V\u00ednculo. Esta ADR leva a metade de neg\u00f3cio desse grill para dentro do app, na m\u00e3o do diretor, e deixa no terminal s\u00f3 o que depende de c\u00f3digo.\n\n## Contexto\n\n- O Assistente de Tecnologia (ADR 0056) j\u00e1 \u00e9 um chat sem estado na API da Anthropic, com rascunho vivo, kit de conhecimento embarcado e nada gravado at\u00e9 o clique. O bot\u00e3o \"Levar para desenvolvimento\" (ADR 0054) j\u00e1 cria a issue-raiz com o bloco \"Para o diretor\", o marcador e o tipo mapeado.\n- O grill do terminal tem duas metades. A de neg\u00f3cio (problema, quem usa, regras, o que fica de fora, o que \u00e9 \"pronto\") o diretor decide melhor que o Pedro. A t\u00e9cnica (m\u00f3dulo, seam, schema, teste) exige o reposit\u00f3rio, que o backend em produ\u00e7\u00e3o n\u00e3o tem.\n- A ADR 0054, decis\u00e3o 1, rejeitou \"s\u00f3 cria\u00e7\u00e3o pelo app\" dizendo que \"o grilling continua sendo a porta de qualidade do PRD\". A ADR 0056, decis\u00e3o 4, fez toda conversa do assistente ef\u00eamera. As duas dizem o contr\u00e1rio do que este plano faz.\n- Custo medido no cat\u00e1logo de 01/11/2026 (Opus 5.5: US$ 4 entrada, US$ 20 sa\u00edda, US$ 0,20 leitura de cache por milh\u00e3o de tokens): um planejamento de 15 perguntas com o prefixo fixo em cache sai por volta de US$ 1,50; sem cache, por volta de US$ 3. Custo n\u00e3o \u00e9 o crit\u00e9rio; o desenho \u00e9.\n\n## Decis\u00f5es\n\n1. **O que sai \u00e9 o PRD do diretor**, n\u00e3o o PRD inteiro. Bloco \"Para o diretor\", Problema, Solu\u00e7\u00e3o, Hist\u00f3rias de usu\u00e1rio e Decis\u00f5es de neg\u00f3cio, mais a se\u00e7\u00e3o \"Ficou em aberto\" com o que o grill n\u00e3o perguntou. As se\u00e7\u00f5es t\u00e9cnicas (Decis\u00f5es de implementa\u00e7\u00e3o e de teste) continuam nascendo no terminal: `/grill-with-docs #N` l\u00ea a issue, pula o que o diretor decidiu, pergunta s\u00f3 o t\u00e9cnico, e o `/to-prd` completa a mesma issue, sem criar outra. Emenda a decis\u00e3o 1 da ADR 0054: o app passa a criar PRD, mas s\u00f3 a metade que o diretor decide; a porta de qualidade do t\u00e9cnico continua no terminal. Rejeitado: o PRD inteiro com o modelo chutando as decis\u00f5es t\u00e9cnicas a partir do kit (inventaria m\u00f3dulo e seam sem ver o c\u00f3digo).\n\n2. **O planejamento come\u00e7a numa Demanda que j\u00e1 existe**, pelo bot\u00e3o \"Planejar com a IA\" no card aberto de uma Demanda de tipo Novo ou Ajuste ainda sem V\u00ednculo. O agente parte do t\u00edtulo e da descri\u00e7\u00e3o j\u00e1 registrados no Roteiro por Tipo. Rejeitado: emendar o grill na conversa do assistente de \"Nova Demanda\" (puxa o diretor para 15 perguntas quando ele s\u00f3 queria registrar).\n\n3. **A conversa do planejamento persiste na Demanda**, um planejamento por Demanda, retom\u00e1vel de onde parou, e segue a regra de vida do Anexo (ADR 0069): some quando a Demanda chega a Conclu\u00edda ou Cancelada. Emenda a decis\u00e3o 4 da ADR 0056 s\u00f3 para este modo; a conversa do assistente de entrada continua ef\u00eamera. Rejeitado: ef\u00eamera (um grill longo com o diretor interrompido perde 10 respostas ao fechar a aba).\n\n4. **O agente conhece a casa s\u00f3 pelo kit**, e cada arquivo de Produto ganha uma se\u00e7\u00e3o \"O que j\u00e1 foi decidido\", em linguagem de diretor, mantida pela mesma regra de sincronia do kit (mudou o m\u00f3dulo, muda o kit no mesmo PR). \u00c9 com ela que o agente desafia o pedido. Rejeitado de novo: ADRs peneiradas por script no deploy (ADR 0056: um filtro em que ningu\u00e9m confia).\n\n5. **Quem decide o fim \u00e9 o modelo, com teto de 12 perguntas**, e o diretor tem sempre o bot\u00e3o \"Fechar e resumir\". O que n\u00e3o foi perguntado sai no resumo como \"ficou em aberto\", nunca como decis\u00e3o inventada (mesmo princ\u00edpio do Roteiro por Tipo). Cada pergunta traz uma ou duas frases de contexto, duas op\u00e7\u00f5es clic\u00e1veis com a recomendada destacada e um campo livre. O diretor responde por texto ou voz; imagem continua entrando pelo Anexo da Demanda. Rejeitado: roteiro fixo de perguntas por tipo (pergunta o que o diretor j\u00e1 respondeu na descri\u00e7\u00e3o); imagem no chat do planejamento.\n\n6. **O \"sim\" do resumo cria a issue pelo mesmo caminho do \"Levar para desenvolvimento\"** (`needs-triage`, `type:feature`, marcador, bloco \"Para o diretor\"), com o PRD do diretor no corpo. Sem label nova: o marcador e a se\u00e7\u00e3o \"Ficou em aberto\" j\u00e1 dizem de onde a issue veio. O \"n\u00e3o\" abre um campo \"o que n\u00e3o bateu\", devolve a resposta \u00e0 conversa e o resumo \u00e9 refeito. Rejeitado: label `planejado-no-app` (uma label a mais para manter); editar o resumo \u00e0 m\u00e3o (descola o resumo da conversa que o justifica).\n\n7. **Modelo e custo.** O planejamento roda no `claude-opus-5-5`, por uma vari\u00e1vel pr\u00f3pria (`LLM_MODEL_PLANEJAMENTO`), com o effort padr\u00e3o; o resto da IA de texto fica no `claude-sonnet-5-5` (ADR 0074). O bloco fixo do prompt (instru\u00e7\u00e3o de sistema mais kit) vai com `cache_control`, primeira vez no assistente; o acerto se confere por `cache_read_input_tokens`. Tokens e custo s\u00e3o gravados por chamada, no molde de Contas m\u00e9dicas (ADR 0074, decis\u00e3o 3), e nunca aparecem na tela do diretor. Falha do provedor \u00e9 erro claro com a conversa intacta, sem failover. Rejeitado: Opus em tudo (dobra o custo do volume de Contas m\u00e9dicas sem ganho medido); failover para Sonnet (troca o julgamento no meio do grill).\n\n8. **O que n\u00e3o muda.** Qualquer Super admin da aba pode planejar, sem papel novo (ADR 0050). O card fechado n\u00e3o ganha selo; no card aberto o bot\u00e3o vira \"Continuar planejamento\" quando h\u00e1 conversa e some quando h\u00e1 V\u00ednculo. O teto de taxa \u00e9 o dos outros chats. Tecnologia continua fora do Manual (ADR 0057): o que o agente faz est\u00e1 no kit `tecnologia.md`.\n\n## Consequ\u00eancias\n\n- O gloss\u00e1rio ganha Planejamento da Demanda e PRD do diretor; o Kit de conhecimento ganha a se\u00e7\u00e3o \"O que j\u00e1 foi decidido\" por Produto, que \u00e9 uma rodada de escrita nos 10 arquivos e entra como fatia do PRD.\n- Nasce persist\u00eancia nova no app (a conversa do planejamento na Demanda), portanto migration e parada humana da regra 9 da ADR 0068.\n- O `/grill-with-docs` precisa aprender a ler uma issue com PRD do diretor e pular o que j\u00e1 foi decidido; o `/to-prd`, a completar uma issue em vez de criar. O `/minhas-issues` precisa distinguir uma `needs-triage` com PRD do diretor de uma comum (\u00e9 o risco aceito da decis\u00e3o 6).\n- Risco aceito da decis\u00e3o 7: se as perguntas sa\u00edrem rasas no effort padr\u00e3o, o ajuste \u00e9 subir para `high`, n\u00e3o trocar de modelo.\n\n## Emenda a esta ADR (01/nov/2026, a Tecnologia no Manual, ADR 0076)\n\n**Decis\u00e3o 8, a frase \"Tecnologia continua fora do Manual\":** deixa de valer. A Tecnologia vira m\u00f3dulo do Manual, o \u00faltimo do menu, com as p\u00e1ginas migradas da p\u00e1gina separada e um V\u00eddeo de vis\u00e3o geral cuja cena central \u00e9 o Planejamento da Demanda. O resto da decis\u00e3o 8 fica (qualquer Super admin da aba planeja, sem papel novo; o bot\u00e3o do card; o teto de taxa), e o kit `tecnologia.md` continua sendo o que o agente l\u00ea. O detalhe est\u00e1 na ADR 0076.", "cita": [50, 57, 68, 69, 74], "decisao": "Decis\u00e3o do Pedro (01/11/2026, grilling fechado em lote pelo `/express` e aprovado no painel). O planejamento de uma melhoria hoje \u00e9 todo no terminal: o Pedro roda o `/grill-with-docs`, responde pelo diretor o que \u00e9 de neg\u00f3cio, e s\u00f3 depois...", "emenda": [54, 56], "emendada_por": [76], "file": "docs/adr/0075-planejamento-da-demanda-grill-no-app-e-prd-do-diretor.md", "number": 75, "slug": "0075-planejamento-da-demanda-grill-no-app-e-prd-do-diretor", "status": "superseded", "substitui": [], "substituida_por": [77], "superseded_by": "0077", "supersedes": null, "title": "Planejamento da Demanda: o grill de neg\u00f3cio roda no app, e o \"sim\" do diretor cria o PRD do diretor"}, {"amended_by": "0077", "amends": "0057, 0072, 0075", "body_md": "Decis\u00e3o do Pedro (01/11/2026, grill em lote aprovado, PRD #1365). Desde 14/10 (ADR 0072) cada m\u00f3dulo do Manual abre com um V\u00eddeo de vis\u00e3o geral do caminho principal, de 90 a 120 s, mudo, feito em HyperFrames no Estilo do manual. Tr\u00eas coisas incomodam: o v\u00eddeo envelhece sem ningu\u00e9m ver (Contas m\u00e9dicas recebeu tr\u00eas PRDs depois do v\u00eddeo, e ele continua o de 14/10, porque a regra s\u00f3 o refaz quando o caminho principal muda); o v\u00eddeo n\u00e3o cobre o m\u00f3dulo (Fila comum, devolver \u00e0 fila, Valida\u00e7\u00e3o, Coordena\u00e7\u00e3o e Painel n\u00e3o aparecem no de Contas m\u00e9dicas); e o formato, tela quase parada com legenda, n\u00e3o prende quem abre o Manual. A Tecnologia, por sua vez, est\u00e1 fora do Manual (ADR 0057, decis\u00e3o 1; ADR 0075, decis\u00e3o 8), numa p\u00e1gina HTML separada, e o diretor n\u00e3o tem um v\u00eddeo do Planejamento da Demanda, a sess\u00e3o de perguntas que ele mesmo responde no app.\n\n## Decis\u00f5es\n\n1. **Um v\u00eddeo narrado por m\u00f3dulo, ponto a ponto.** Seis m\u00f3dulos t\u00eam V\u00eddeo de vis\u00e3o geral: Primeiros passos (tamb\u00e9m na p\u00e1gina inicial), Reuni\u00f5es e metas, Ouvidoria, POPs, Contas m\u00e9dicas e Tecnologia. O v\u00eddeo tem de 2 a 3 min (a Tecnologia, at\u00e9 3 min e meio) e mostra cada funcionalidade relevante uma vez, na ordem em que a pessoa usa; a fonte \u00e9 a p\u00e1gina do m\u00f3dulo e o `novidades.md`, e fato s\u00f3 entra com fonte. Narra\u00e7\u00e3o com a voz A do VoiceStudio e a fala escrita na tela palavra a palavra, para funcionar com e sem som. O player continua sem autoplay e perde o atributo `muted`. Admin e Central de Comando seguem sem v\u00eddeo. Emenda a decis\u00e3o 1 da ADR 0072 (90 a 120 s, mudo, s\u00f3 o caminho principal). Rejeitado: manter o v\u00eddeo mudo com legenda (\u00e9 o formato que n\u00e3o prende); manter s\u00f3 o caminho principal (no de Contas m\u00e9dicas, deixa de fora Fila comum, Valida\u00e7\u00e3o, Coordena\u00e7\u00e3o e Painel).\n\n2. **Remotion pela skill global `motion`, no molde da `/divulgar`.** Projeto de trabalho descart\u00e1vel fora do reposit\u00f3rio, composi\u00e7\u00e3o versionada em `docs/manual/video/<modulo>/<slug>/` (`roteiro.md`, `narracao.txt`, `tempos.json`, as cenas em `cena/*.tsx`, `meta.json` com o carimbo e os `prds_cobertos`, `VERIFY.md`) e MP4 em `~/Videos/Hospital/Manual/<modulo>/<slug>.mp4`. A tela \u00e9 o print real do app, animado (zoom, foco, cursor, destaque), e sai do Roteiro de prints do m\u00f3dulo (ADR 0057, decis\u00e3o 7). O roteiro passa pela skill `copy` (nota m\u00ednima 12 de 14) e depois pelo `humanizer` (ADR 0071). Identidade da `marca-hsm` e dos tokens do app, sem gr\u00e3o de filme. O carimbo \u00e9 s\u00f3 o `meta.json`: nada de vers\u00e3o, PRD ou data escrito no v\u00eddeo. O HyperFrames e o Estilo do manual saem m\u00f3dulo a m\u00f3dulo: a composi\u00e7\u00e3o HyperFrames antiga (a pasta com `index.html`) continua aceita pelo conferidor at\u00e9 o v\u00eddeo do m\u00f3dulo ser refeito, a fatia que sobe o v\u00eddeo novo apaga a antiga no mesmo PR, e o `_estilo/` sai com o \u00faltimo m\u00f3dulo. Emenda a decis\u00e3o 4 da ADR 0057 na emenda de 13/10/2026 (o Estilo do manual). Rejeitado: refazer no HyperFrames com narra\u00e7\u00e3o (o Pedro quer o padr\u00e3o de motion j\u00e1 usado na `/divulgar`); r\u00e9plica da tela desenhada \u00e0 m\u00e3o (o print do roteiro regera quando a tela muda).\n\n3. **Or\u00e7amento de 10, 60 e 90 MB.** O `publicar.sh` reencoda cada v\u00eddeo para 720p H.264 com \u00e1udio AAC de 64 kbps e trava acima de **10 MB por v\u00eddeo**, de **60 MB somando** os v\u00eddeos e de **90 MB** o site inteiro, com a regra e o v\u00eddeo na mensagem. Um v\u00eddeo por m\u00f3dulo continua. A base: a Vercel Hobby aceita at\u00e9 100 MB por deploy pela CLI e 100 GB por m\u00eas de transfer\u00eancia, e o site sem v\u00eddeo mede 20 MB (medido pelo `publicar.sh` em 01/11/2026). Emenda a decis\u00e3o 4 da ADR 0072 (8 e 40 MB). Rejeitado: plano Pro ou v\u00eddeo hospedado fora da Vercel (decis\u00f5es maiores que o problema; fora do PRD).\n\n4. **Todo PRD que muda p\u00e1gina do m\u00f3dulo refaz o v\u00eddeo do m\u00f3dulo**, uma vez por PRD, na Fatia de manual. A exce\u00e7\u00e3o \u00e9 escrita na fatia (\"o v\u00eddeo segue v\u00e1lido porque ...\"), o revisor confere, e o PRD entra nos `prds_cobertos` sem render novo. O `meta.json` do v\u00eddeo guarda os `prds_cobertos`; a `/montar-manual` acusa a lacuna `video-desatualizado` quando uma p\u00e1gina do m\u00f3dulo cita no `prd:` um PRD fora da lista; o `/to-issues` escreve \"Refazer o v\u00eddeo do m\u00f3dulo\" na Fatia de manual. Emenda a decis\u00e3o 6 da ADR 0072 e a decis\u00e3o 8 da ADR 0057. Rejeitado: refazer s\u00f3 quando o caminho principal muda (\u00e9 a regra que deixou o v\u00eddeo de Contas m\u00e9dicas tr\u00eas PRDs para tr\u00e1s).\n\n5. **A Tecnologia vira m\u00f3dulo do Manual**, o \u00faltimo do menu, com abertura, P\u00e1ginas de tarefa migradas dos 11 cap\u00edtulos da p\u00e1gina separada e o v\u00eddeo, cuja cena central \u00e9 o Planejamento da Demanda. O `manual-tecnologia-hsm` redireciona para a se\u00e7\u00e3o nova, e o item Ajuda da aba Tecnologia aponta para ela. Emenda a decis\u00e3o 1 da ADR 0057 (a aba Tecnologia ficava fora) e a decis\u00e3o 8 da ADR 0075 (Tecnologia continuava fora do Manual). O kit de conhecimento `tecnologia.md` continua sendo o que o Assistente de Tecnologia l\u00ea. Rejeitado: manter a p\u00e1gina HTML separada (um segundo manual, fora da Fatia de manual e do invent\u00e1rio).\n\n6. **Faxina dos v\u00eddeos aposentados.** Os V\u00eddeos de tarefa, `_antigos/`, `_sem-master/`, os `.draft.mp4` e os cinco HyperFrames substitu\u00eddos, uns 978 MB em `~/Videos/Hospital/Manual/`, s\u00e3o apagados por script idempotente que o Pedro roda com `! bash`, depois que os seis v\u00eddeos novos est\u00e3o no ar. Emenda a decis\u00e3o 2 da ADR 0072, que guardava os masters dos V\u00eddeos de tarefa para um link externo. Rejeitado: guardar os masters para sempre (978 MB de v\u00eddeo que nenhuma p\u00e1gina usa; as composi\u00e7\u00f5es ficam no hist\u00f3rico do git).\n\n## Consequ\u00eancias\n\n- O `checar_video_manual.py` confere a composi\u00e7\u00e3o nova (roteiro, cenas, `meta.json` com carimbo e `prds_cobertos`, `VERIFY.md`) e continua aceitando a HyperFrames antiga; o `checar_build_manual.py` confere que o player da abertura sai sem `muted` e sem `autoplay`; o invent\u00e1rio da `/montar-manual` ganha a lacuna `video-desatualizado`.\n- A receita da `/manual` (`references/video-de-visao-geral.md`) passa a ser a do Remotion; a do HyperFrames fica no hist\u00f3rico do git.\n- Os gates do v\u00eddeo s\u00e3o `tsc --noEmit`, `ffprobe` com fps constante, `freezedetect` sem congelamento fora do planejado, tamanho dentro do or\u00e7amento e reprodu\u00e7\u00e3o no Chrome real. Render disputa a CPU: no m\u00e1ximo dois ao mesmo tempo na mesma m\u00e1quina.\n- O piloto (Contas m\u00e9dicas) tem uma parada \u00fanica: o Pedro olha o rascunho antes dos outros cinco come\u00e7arem. Os outros cinco sobem do PR verde, como qualquer Fatia de manual (emenda de 14/10/2026 \u00e0 ADR 0057).\n- O gloss\u00e1rio muda em V\u00eddeo de vis\u00e3o geral, Estilo do manual e Manual (agora com a Tecnologia).", "cita": [71], "decisao": "Decis\u00e3o do Pedro (01/11/2026, grill em lote aprovado, PRD #1365). Desde 14/10 (ADR 0072) cada m\u00f3dulo do Manual abre com um V\u00eddeo de vis\u00e3o geral do caminho principal, de 90 a 120 s, mudo, feito em HyperFrames no Estilo do manual. Tr\u00eas...", "emenda": [57, 72, 75], "emendada_por": [77], "file": "docs/adr/0076-manual-video-narrado-por-modulo-em-remotion-refeito-a-cada-prd-e-tecnologia-no-manual.md", "number": 76, "slug": "0076-manual-video-narrado-por-modulo-em-remotion-refeito-a-cada-prd-e-tecnologia-no-manual", "status": "superseded", "substitui": [], "substituida_por": [78], "superseded_by": "0078", "supersedes": null, "title": "Manual: um v\u00eddeo narrado por m\u00f3dulo, em Remotion, refeito a cada PRD, e a Tecnologia no Manual"}, {"amended_by": "0078, 0079, 0083, 0084, 0090", "amends": "0050, 0054, 0056, 0069, 0076", "body_md": "Decis\u00e3o do Pedro (02/11/2026, grill fechado pelo `/express` e aprovado no terminal). A aba Tecnologia cresceu para um gestor de tarefas entre o hospital e a Vitta: sete tipos, Produto com dono, Respons\u00e1vel, Prioridade, Prazo, tr\u00eas raias, Painel, Conversa espelhada, e-mail, e por cima o Assistente de entrada e o Planejamento da Demanda (ADR 0075, em produ\u00e7\u00e3o desde os PRs #1354 a #1361). Quem usa \u00e9 o diretor, e o que ele faz de verdade \u00e9 relatar um bug ou pedir uma melhoria. Esta ADR reduz a aba a isso: uma tela, o chat do agente, que conduz a conversa como o Pedro conduz o `/grill-with-docs` no terminal e termina num card no GitHub, sem ningu\u00e9m da Vitta precisar assumir.\n\n## Decis\u00f5es\n\n1. **A aba \u00e9 uma tela s\u00f3: o chat do agente**, com uma lista lateral das conversas passadas e a Etapa de cada uma lida do GitHub. Saem Quadro, Painel, os sete Tipos, Produto com dono, Respons\u00e1vel, Prioridade, Prazo, Estado, Conversa espelhada, men\u00e7\u00f5es, e-mail, formul\u00e1rio \u00e0 m\u00e3o e V\u00ednculo por n\u00famero. Ficam a Etapa derivada (webhook do GitHub), o Anexo e o Kit. Quem v\u00ea continua sendo s\u00f3 o Super admin (ADR 0050). Rejeitado: esconder o antigo atr\u00e1s de um \"modo antigo\" (c\u00f3digo vivo sem uso).\n\n2. **A Demanda continua no banco como o registro de cada conversa**, sem os campos que sa\u00edram. Para o diretor ela \u00e9 s\u00f3 uma linha na lista. Assim o planejamento persistido (migration 123), o Anexo, o V\u00ednculo e a Etapa servem sem tabela nova. As Demandas abertas hoje o Pedro resolve com o diretor antes da subida; as colunas aposentadas ficam congeladas e o drop vem em PR posterior. Rejeitado: tabela nova de conversas (refaz o que a Demanda j\u00e1 carrega).\n\n3. **S\u00f3 um sentido: o diretor relata \u00e0 Vitta.** Os pedidos da Vitta ao hospital (os antigos Decis\u00e3o, Informa\u00e7\u00e3o e Terceiro) voltam para o WhatsApp. Emenda a ADR 0050, que fez a aba nos dois sentidos. Risco aceito: metade da conversa que a aba tirou do WhatsApp volta para l\u00e1.\n\n4. **O agente abre perguntando \"bug ou melhoria?\"**, com dois bot\u00f5es e um campo livre; se o diretor s\u00f3 descreve, ele classifica e confirma. D\u00favida que o Kit responde \u00e9 respondida ali, sem card. **Bug** segue um roteiro curto, uma pergunta por vez, no m\u00e1ximo cinco: onde, o que aconteceu, o que esperava, como repetir, o print. **Melhoria** segue o grill do terminal: uma pergunta por vez, contexto curto, duas op\u00e7\u00f5es com a recomendada destacada, campo livre, texto ou voz, teto de 12 perguntas e \"Fechar e resumir\" sempre \u00e0 m\u00e3o; o que n\u00e3o foi perguntado vira \"ficou em aberto\". Texto, voz e imagem entram em qualquer ponto. Substitui a ADR 0075 (o planejamento deixa de ser um bot\u00e3o no card de uma Demanda j\u00e1 criada e vira o caminho da melhoria dentro do chat).\n\n5. **O agente l\u00ea o c\u00f3digo.** Al\u00e9m do Kit, ele ganha ferramentas de leitura do reposit\u00f3rio pela API do GitHub (ler arquivo, buscar no c\u00f3digo, abrir `CONTEXT.md` e as ADRs aceitas, listar issues abertas). Fala com o diretor na l\u00edngua do Kit e desafia o pedido contra o c\u00f3digo e as ADRs por tr\u00e1s, como o terminal faz. N\u00e3o roda teste, n\u00e3o sobe stack e n\u00e3o grava no reposit\u00f3rio. Emenda a ADR 0056, que limitava o agente ao Kit. Rejeitado: s\u00f3 o Kit (conversa bem, mas n\u00e3o desafia contra o que est\u00e1 decidido); agente gerenciado com o reposit\u00f3rio clonado num sandbox (infraestrutura e custo para rodar c\u00f3digo, que um grill n\u00e3o precisa).\n\n6. **O card s\u00f3 nasce no clique \"Criar o card\"**, depois do resumo; \"N\u00e3o bateu\" volta \u00e0 conversa. Antes de criar, o agente lista as issues abertas e avisa quando j\u00e1 existe uma parecida, e a peneira p\u00fablica que j\u00e1 existe passa no texto. Rejeitado: criar sozinho no fim da conversa (card errado no reposit\u00f3rio p\u00fablico sem ningu\u00e9m ter lido).\n\n7. **O que o card leva.** Bug: issue \u00fanica `type:bug` com Onde, O que aconteceu, O que esperava, Como repetir e crit\u00e9rios de aceite, nascendo `ready-for-agent`, e a onda pega sozinho. Melhoria: o PRD inteiro, a metade de neg\u00f3cio da conversa e as Decis\u00f5es de implementa\u00e7\u00e3o e de teste lidas do c\u00f3digo, mais uma se\u00e7\u00e3o \"Para o gloss\u00e1rio\" com os termos e as decis\u00f5es candidatas a ADR; nasce `needs-triage`, porque ainda passa pelo `/to-issues`, e quem grava `CONTEXT.md` e ADR \u00e9 o terminal (o backend n\u00e3o faz commit na `main` protegida). Emenda a decis\u00e3o 1 da ADR 0054. Risco aceito: um bug relatado pelo diretor chega a produ\u00e7\u00e3o sem um humano ler a issue.\n\n8. **O print fica no app** (ADR 0069): a issue diz \"Anexos: N imagens\" e a rota de automa\u00e7\u00e3o entrega a imagem ao agente que pega a issue. Sem o \"Concluir\" humano, o bin\u00e1rio \u00e9 apagado 30 dias depois de Em produ\u00e7\u00e3o ou quando a issue fecha como N\u00e3o ser\u00e1 feita. Emenda a ADR 0069 no gatilho de apagar.\n\n9. **Modelo e custo.** A conversa inteira da tela roda no Opus 5.5 pela vari\u00e1vel que j\u00e1 existe, `llm_model_planejamento`; o resto do app segue no Sonnet 5.5 (ADR 0074). `cache_control` no prefixo fixo, tokens e custo gravados por chamada, fora da tela do diretor. Falha do provedor \u00e9 erro claro, conversa intacta, sem failover. A leitura de c\u00f3digo encarece a sess\u00e3o (estimativa de uns US$ 0,50 a mais); o custo gravado diz o n\u00famero real.\n\n10. **Manual e Kit.** O m\u00f3dulo Tecnologia do Manual (ADR 0076, decis\u00e3o 5) \u00e9 reescrito numa Fatia de manual do PRD, com o v\u00eddeo refeito (ADR 0076, decis\u00e3o 4). O Kit `tecnologia.md` \u00e9 reescrito no mesmo PR da tela. Emenda a decis\u00e3o 5 da ADR 0076 no conte\u00fado, n\u00e3o na regra.\n\n11. **Ordem.** Primeiro a tela nova no ar; a remo\u00e7\u00e3o do c\u00f3digo antigo vem numa fatia pr\u00f3pria, depois, para o diretor nunca ficar sem canal.\n\n## Consequ\u00eancias\n\n- O gloss\u00e1rio da Tecnologia \u00e9 reescrito: Demanda redefinida, Assistente de Tecnologia vira o chat inteiro, Roteiro do bug nasce, e Tipo, Produto com dono, Estado, Quadro, Painel, Conversa da Demanda e Roteiro por Tipo se aposentam.\n- O agente precisa de ferramentas (tool use) no backend, primeira vez no app, com teto de chamadas por turno.\n- O `/minhas-issues` e o `/grill-with-docs` deixam de precisar distinguir o \"PRD do diretor\" pela metade: o card de melhoria j\u00e1 vem com o PRD inteiro.", "cita": [74], "decisao": "Decis\u00e3o do Pedro (02/11/2026, grill fechado pelo `/express` e aprovado no terminal). A aba Tecnologia cresceu para um gestor de tarefas entre o hospital e a Vitta: sete tipos, Produto com dono, Respons\u00e1vel, Prioridade, Prazo, tr\u00eas raias...", "emenda": [50, 54, 56, 69, 76], "emendada_por": [78, 79, 83, 84, 90], "file": "docs/adr/0077-tecnologia-vira-o-chat-do-agente-bug-ou-melhoria.md", "number": 77, "slug": "0077-tecnologia-vira-o-chat-do-agente-bug-ou-melhoria", "status": "accepted", "substitui": [75], "substituida_por": [], "superseded_by": null, "supersedes": "0075", "title": "Tecnologia vira o chat do agente: bug ou melhoria, com Opus lendo o c\u00f3digo, e o card nasce no GitHub"}, {"amended_by": "0094", "amends": "0068, 0071, 0077", "body_md": "Decis\u00e3o do Pedro (05/11/2026). O Manual do usu\u00e1rio sai da plataforma inteiro, para ser refeito depois com outra abordagem. At\u00e9 aqui ele era um site Astro Starlight na Vercel (`manual-hsm.vercel.app`), com uma se\u00e7\u00e3o por m\u00f3dulo, P\u00e1gina de tarefa, V\u00eddeo de vis\u00e3o geral por m\u00f3dulo e uma Fatia de manual no fim de todo PRD com tela (ADRs 0057, 0072 e 0076).\n\n## Decis\u00f5es\n\n1. **O site sai do ar e do reposit\u00f3rio.** Os projetos `manual-hsm`, `manual-ouvidoria-hsm` e `manual-tecnologia-hsm` foram apagados da Vercel. A pasta `docs/manual/`, os prompts de produ\u00e7\u00e3o em `docs/prompts/`, as skills `/manual` e `/montar-manual` e os scripts e testes pr\u00f3prios dele em `tools/` saem do reposit\u00f3rio. O hist\u00f3rico fica no git.\n\n2. **O app perde o item Ajuda.** O item do menu (no app e no Admin) apontava para o site apagado; sai junto com a vari\u00e1vel `NEXT_PUBLIC_MANUAL_URL`. O kit de conhecimento da Tecnologia deixa de indicar o endere\u00e7o.\n\n3. **O fluxo deixa de pedir manual.** O `/to-prd` n\u00e3o tem mais a se\u00e7\u00e3o \"Manual: p\u00e1ginas que nascem ou mudam\", o `/to-issues` n\u00e3o cria a Fatia de manual, e o `/grill-with-docs` e o `/ask-pedro` n\u00e3o usam o Manual para escolher a porta. A Action p\u00f3s-merge para de tirar draft e de avisar no PRD; fica com o snapshot e o registro do deploy. O workflow `manual.yml` vira `ferramentas.yml` e roda s\u00f3 os testes de `tools/`, que continuam valendo.\n\n4. **Os v\u00eddeos ficam no Mac.** Em `~/Videos/Hospital/Manual/` ficam os seis V\u00eddeos de vis\u00e3o geral e os V\u00eddeos de tarefa, como material para a abordagem nova; as c\u00f3pias antigas, os rascunhos e as vers\u00f5es anteriores foram apagados.\n\n5. **As issues \"docs: manual do PRD\" foram apagadas**, inclusive a aberta do PRD de acompanhamento do processamento de Contas m\u00e9dicas. Os PRs de manual j\u00e1 mergeados ficam no hist\u00f3rico (o GitHub n\u00e3o apaga PR).\n\n## Consequ\u00eancias\n\n- As ADRs 0057, 0072 e 0076 passam a `superseded`. O que a 0076 decidiu sobre a Tecnologia (decis\u00e3o 5) era sobre a Tecnologia dentro do Manual e cai junto; o kit de conhecimento continua sendo o que o Assistente de Tecnologia l\u00ea.\n- A r\u00e9gua de texto da ADR 0071 continua valendo para todo texto para fora (tela, PDF, mensagem, PR, p\u00e1gina de divulga\u00e7\u00e3o); o lint dela que morava no Manual sai, e ficam o ESLint do front e o teste dos templates do backend.\n- Emenda a 0068 (a Fatia de manual some do fluxo e da lista do que sobe sem parada humana), a 0071 (o lint do Manual sai da r\u00e9gua) e a 0077 (a decis\u00e3o 10, de reescrever o m\u00f3dulo Tecnologia do Manual, cai).\n- Cada m\u00e1quina tira `manual-hsm.vercel.app` do `autoMode.environment` do pr\u00f3prio `~/.claude/settings.json`: com o projeto apagado, o subdom\u00ednio ficou livre para qualquer conta registrar e n\u00e3o pode seguir confi\u00e1vel para o modo auto. O `/setup-maquina` acusa no n\u00edvel 2 enquanto o host estiver l\u00e1.\n- O Manual novo, quando vier, \u00e9 decis\u00e3o nova, com ADR pr\u00f3pria.", "cita": [], "decisao": "Decis\u00e3o do Pedro (05/11/2026). O Manual do usu\u00e1rio sai da plataforma inteiro, para ser refeito depois com outra abordagem. At\u00e9 aqui ele era um site Astro Starlight na Vercel (`manual-hsm.vercel.app`), com uma se\u00e7\u00e3o por m\u00f3dulo, P\u00e1gina de...", "emenda": [68, 71, 77], "emendada_por": [94], "file": "docs/adr/0078-manual-do-usuario-aposentado.md", "number": 78, "slug": "0078-manual-do-usuario-aposentado", "status": "accepted", "substitui": [57, 72, 76], "substituida_por": [], "superseded_by": null, "supersedes": "0057, 0072, 0076", "title": "Manual do usu\u00e1rio aposentado"}, {"amended_by": null, "amends": "0077", "body_md": "Decis\u00e3o do Pedro (06/11/2026, grill no terminal a partir do \u00e1udio do diretor). O diretor usou o Planejamento da Demanda e gostou do formato (uma pergunta por vez, com a recomendada destacada), mas a conversa bateu no teto de 12 perguntas: o agente encerrou no meio do assunto, o chat deixou de aceitar pergunta nova e o resumo saiu com quatro a seis itens em \"Ficou em aberto\". O teto era c\u00f3digo (`TETO_DE_PERGUNTAS = 12`), n\u00e3o crit\u00e9rio do modelo, e o prompt mandava parar \"quando j\u00e1 tiver o bastante\", o que empurrava lacuna para o resumo. Esta ADR troca a regra de parada e mostra o custo para que o diretor saiba quanto a entrevista custa enquanto decide continuar.\n\n## Decis\u00f5es\n\n1. **Sem teto de perguntas na melhoria.** N\u00e3o existe limite de n\u00famero de perguntas, nem vis\u00edvel nem escondido. O que segura o tamanho da conversa \u00e9 o custo na tela (decis\u00e3o 6) e o \"Fechar e resumir\", que segue \u00e0 m\u00e3o. Emenda a decis\u00e3o 4 da ADR 0077. Rejeitado: teto alto invis\u00edvel como prote\u00e7\u00e3o (volta a cortar o diretor no meio, s\u00f3 que mais tarde).\n\n2. **A regra de parada \u00e9 \"nada em aberto\".** O agente s\u00f3 encerra quando o \"Ficou em aberto\" sairia vazio. Enquanto houver lacuna do lado do neg\u00f3cio, a pr\u00f3xima pergunta \u00e9 sobre ela. \"Ficou em aberto\" deixa de ser a sa\u00edda normal da conversa e passa a existir s\u00f3 quando o diretor fecha antes. Rejeitado: manter \"pare quando j\u00e1 tiver o bastante para a Vitta come\u00e7ar\" (\u00e9 o que gerou as pend\u00eancias).\n\n3. **A conversa nunca trava antes do card.** Depois do encerramento ou do resumo, o campo livre continua ativo at\u00e9 \"Criar o card\": o diretor escreve, e o agente volta a perguntar. Quem decide que acabou \u00e9 o diretor.\n\n4. **Fechar cedo deixa a lacuna \u00e0 vista.** Se o diretor clica \"Fechar e resumir\" com lacuna, o resumo mostra \"Ficou em aberto\" com o bot\u00e3o \"Continuar respondendo\", que retoma as perguntas por essas lacunas. \"Criar o card\" com lacuna continua permitido. Rejeitado: bloquear o card enquanto houver lacuna (prende o diretor).\n\n5. **T\u00edtulo e tipo na lista.** Na melhoria, o agente d\u00e1 o t\u00edtulo j\u00e1 na primeira resposta e o afina a cada turno, como j\u00e1 fazia no bug; o t\u00edtulo provis\u00f3rio deixa de ficar at\u00e9 o resumo. Cada linha da lista lateral ganha um selo \"Bug\" ou \"Melhoria\" ao lado da Etapa, sem agrupar nem filtrar. Retomar a conversa continua sendo abrir a linha: ela volta na \u00faltima pergunta sem resposta.\n\n6. **O custo da conversa aparece no cabe\u00e7alho dela.** \"Opus 5.5 \u00b7 US$ 1,84 at\u00e9 agora\", atualizado a cada turno, somando todas as chamadas de IA daquela conversa (classifica\u00e7\u00e3o, perguntas, leitura de c\u00f3digo, imagem, resumo). Fica s\u00f3 na conversa aberta, n\u00e3o na lista. Se alguma chamada saiu sem pre\u00e7o na tabela (gravada com custo zero), aparece \"custo n\u00e3o medido\", nunca um valor que finge ser real. Emenda a decis\u00e3o 9 da ADR 0077 (e a decis\u00e3o 7 da ADR 0075, que \u00e9 hist\u00f3rico), que mantinham o custo fora da tela do diretor. Quem v\u00ea a aba continua sendo s\u00f3 o Super admin (ADR 0050). Rejeitado: custo s\u00f3 num painel interno da Vitta (o diretor n\u00e3o dimensionaria a entrevista).\n\n7. **O Roteiro do bug n\u00e3o muda.** Continua com no m\u00e1ximo cinco perguntas, uma por campo fixo (onde, o que aconteceu, o que esperava, como repetir, print). Cinco campos n\u00e3o deixam lacuna.\n\n## Consequ\u00eancias\n\n- Uma conversa de melhoria pode ficar bem mais longa e mais cara; o risco \u00e9 aceito porque o diretor v\u00ea o n\u00famero enquanto conversa.\n- O Kit `tecnologia.md` deixa de falar em \"no m\u00e1ximo 12 perguntas\" e passa a explicar o custo no cabe\u00e7alho, no mesmo PR da mudan\u00e7a.\n- Repeti\u00e7\u00e3o sem fim do modelo n\u00e3o tem trava de n\u00famero: a defesa \u00e9 o prompt (n\u00e3o perguntar o que j\u00e1 foi respondido) e o diretor, que v\u00ea o custo e pode fechar.", "cita": [50, 75], "decisao": "Decis\u00e3o do Pedro (06/11/2026, grill no terminal a partir do \u00e1udio do diretor). O diretor usou o Planejamento da Demanda e gostou do formato (uma pergunta por vez, com a recomendada destacada), mas a conversa bateu no teto de 12 perguntas...", "emenda": [77], "emendada_por": [], "file": "docs/adr/0079-planejamento-sem-teto-e-custo-na-tela.md", "number": 79, "slug": "0079-planejamento-sem-teto-e-custo-na-tela", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Planejamento da Demanda sem teto de perguntas, e o custo da conversa na tela"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do Pedro (06/11/2026, grill t\u00e9cnico do PRD do diretor #1428). O diretor pediu t\u00edtulos, bot\u00f5es e textos curtos em caixa alta em todo o aplicativo, nas telas p\u00fablicas, nos t\u00edtulos dos PDFs e dos e-mails e nos t\u00edtulos que a IA escreve, com o texto digitado pela equipe como foi escrito e tudo numa entrega s\u00f3.\n\n## Decis\u00f5es\n\n1. **O limite \u00e9 o tipo de elemento.** Ficam em Caixa alta: item de menu, t\u00edtulo e subt\u00edtulo (h1 a h3), bot\u00e3o, aba, nome de campo, cabe\u00e7alho de coluna e etiqueta de situa\u00e7\u00e3o. O resto \u00e9 Texto corrido (par\u00e1grafo, toast, erro, ajuda, placeholder, corpo de di\u00e1logo, aviso do sino, conversa e resumo da Tecnologia, menos os subt\u00edtulos do resumo). Rejeitado: crit\u00e9rio por n\u00famero de palavras ou por \"tem verbo\" (cada pessoa julga de um jeito).\n\n2. **S\u00f3 na exibi\u00e7\u00e3o, nunca no dado.** Na tela, uma regra `text-transform: uppercase` no `@layer base` do `globals.css`, por elemento, com espa\u00e7amento leve. Nos PDFs (ata, POP, relat\u00f3rio, cartaz), `text-transform` nos t\u00edtulos dos templates do WeasyPrint. Nos e-mails, o filtro `upper` do Jinja s\u00f3 na vari\u00e1vel do t\u00edtulo. O texto da fonte e do banco continua com mai\u00fascula e min\u00fascula. Rejeitado: reescrever as strings em mai\u00fascula (cerca de 800, sem componente comum) e `upper()` na gera\u00e7\u00e3o da IA (altera o dado, sem volta).\n\n3. **Texto digitado dentro de elemento em caixa alta leva `normal-case`.** T\u00edtulo ou bot\u00e3o que mostra dado do banco (nome da reuni\u00e3o, t\u00edtulo do POP, nome da operadora) desliga a regra no trecho do dado.\n\n4. **Exce\u00e7\u00f5es fechadas.** O assunto do e-mail fica normal (spam e leitura da caixa de entrada). C\u00f3digos e siglas ficam como est\u00e3o. No POP com modelo anexado pelo hospital, o t\u00edtulo da IA tamb\u00e9m sai em caixa alta no PDF.\n\n5. **Uma subida s\u00f3.** Quatro fatias (telas, PDFs, e-mails, lista de confer\u00eancia) sobem juntas num `fechar_onda.py --prs`, para o aplicativo n\u00e3o ficar com telas misturadas. A confer\u00eancia \u00e9 a lista de prints por rota (desktop e 390px), mais um PDF e um e-mail de cada tipo, que vai ao diretor para o aceite por amostra.\n\n## Consequ\u00eancias\n\n- Quem chega encontra `normal-case` espalhado: \u00e9 o dado digitado protegido. N\u00e3o \"consertar\" gravando em mai\u00fascula.\n- O Manual saiu do escopo: a decis\u00e3o 8 do diretor pedia atualiz\u00e1-lo, mas ele foi aposentado na v\u00e9spera (ADR 0078). O diretor \u00e9 avisado na Conversa da Demanda.\n- Sem migration e sem lint novo: a regra base cobre o elemento que nasce, e `normal-case` mal posto s\u00f3 o print pega.", "cita": [78], "decisao": "Decis\u00e3o do Pedro (06/11/2026, grill t\u00e9cnico do PRD do diretor #1428). O diretor pediu t\u00edtulos, bot\u00f5es e textos curtos em caixa alta em todo o aplicativo, nas telas p\u00fablicas, nos t\u00edtulos dos PDFs e dos e-mails e nos t\u00edtulos que a IA...", "emenda": [], "emendada_por": [], "file": "docs/adr/0080-caixa-alta-por-tipo-de-elemento-so-na-exibicao.md", "number": 80, "slug": "0080-caixa-alta-por-tipo-de-elemento-so-na-exibicao", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Caixa alta por tipo de elemento, s\u00f3 na exibi\u00e7\u00e3o"}, {"amended_by": "0082", "amends": "0070", "body_md": "Decis\u00e3o do Pedro (07/11/2026, grilling) sobre os \u00e1udios do Diretor Executivo depois de usar o m\u00f3dulo. O modelo mental dele \u00e9 o de um auditor humano que ele treina: ele explica o contrato, entrega os documentos, corrige quando o auditor erra, e o auditor anota na conta o que incluir, tirar e corrigir para a faturista lan\u00e7ar no MV e marcar feito. Ele quer conversar com esse auditor num lugar s\u00f3, em vez de um bot\u00e3o por coisa, e tem medo de duas coisas: complexidade de uso e o agente \"se confundir\" com regra demais.\n\n## Contexto\n\n- O m\u00f3dulo j\u00e1 tem quase tudo do auditor: o Guia \u00e9 a conta anotada, a Linha com Feito, N\u00e3o procede e Bloqueado \u00e9 a mesa da faturista. O \"Ensinar uma regra nova\" j\u00e1 aceita texto livre e devolve proposta com conflitos. A tabela de pre\u00e7o j\u00e1 entra por PDF, XLSX ou CSV com a IA propondo o mapeamento das colunas. A Mem\u00f3ria j\u00e1 sai e volta por `.md`.\n- O que falta: um lugar \u00fanico para conversar; um jeito de apontar o que o m\u00f3dulo deixou passar (as faturistas acharam no prontu\u00e1rio a insulina de uma hiperglicemia que o m\u00f3dulo n\u00e3o viu, e n\u00e3o havia onde registrar); e uma forma de saber, antes de valer, o que uma regra nova faz nas contas.\n- A fila de Valida\u00e7\u00e3o passou de 80 itens. Quase 60 v\u00eam dos pr\u00f3prios arquivos do diretor: toda Regra que o `.md` n\u00e3o marca como VIGENTE entra Pendente (18 na ASSIM, 13 na Leve, 28 na Unimed), e cada uma vira um cart\u00e3o.\n- O Passo B recebe a Mem\u00f3ria inteira da operadora (100 a 150 Regras, uns 10 mil tokens, em cache). O tamanho n\u00e3o \u00e9 o risco; Regra duplicada ou contradit\u00f3ria \u00e9.\n- A decis\u00e3o 12 da ADR 0070 proibiu a palavra \"auditoria\" no m\u00f3dulo, a pedido do diretor. Agora ele quer \"auditor\".\n\n## Decis\u00f5es\n\n1. **O Auditor \u00e9 uma conversa que sempre termina em proposta.** O que ele recebe (texto, tabela, contrato) volta como proposta estruturada: Regra nova ou alterada, Tabela de pre\u00e7o, par\u00e2metro da Mem\u00f3ria ou card para a Tecnologia, e o Auditor as entrega **em lote, j\u00e1 decididas**, cada uma com a sua prova: quem decide responde \"ok\" ou \"corrige o item N\", nunca um Confirmar por proposta (um contrato de 40 cl\u00e1usulas \u00e9 um lote, n\u00e3o 40 cliques). Nada vale sem esse ok. Os envios atuais da tela de Operadoras continuam, como atalhos dentro da conversa.\n2. **Duas conversas, cada uma com o seu contexto.** A da Operadora (ensinar Regra, subir tabela e contrato) e a da Conta, aberta do Guia, para explicar um erro. Nada de uma Operadora entra na conversa de outra (decis\u00e3o 3 da ADR 0070).\n3. **A conversa n\u00e3o \u00e9 mem\u00f3ria.** S\u00f3 o que foi confirmado e virou Regra ou tabela pesa nas an\u00e1lises. A conversa fica guardada como hist\u00f3rico, ligada \u00e0 vers\u00e3o da Mem\u00f3ria que gerou. Descartado: p\u00f4r conversas no prompt das an\u00e1lises, que \u00e9 o caminho para o agente se contradizer com o tempo sem que ningu\u00e9m veja por qu\u00ea.\n4. **\"Faltou isto\" no Guia.** Quem v\u00ea o Guia aponta, por dia, o item e a p\u00e1gina que o m\u00f3dulo n\u00e3o achou. Abre a conversa da Conta; o Auditor explica por que n\u00e3o achou e classifica a origem: regra, leitura (p\u00e1gina n\u00e3o lida, OCR, folha digitalizada) ou defeito do c\u00f3digo. Regra vira proposta de Regra; leitura e defeito viram issue no GitHub que o Auditor escreve j\u00e1 com crit\u00e9rios de aceite, a Conta de exemplo (c\u00f3digo, p\u00e1gina, trecho desidentificado, o esperado), a explica\u00e7\u00e3o dele e a mensagem de quem apontou; nasce `ready-for-agent`, para a `/onda-enxuta` corrigir sem triagem humana. A trava continua na revis\u00e3o do PR e na subida (ADR 0068). A issue nunca leva texto de prontu\u00e1rio al\u00e9m do trecho desidentificado de at\u00e9 300 caracteres (decis\u00e3o 8 da ADR 0070; o reposit\u00f3rio \u00e9 p\u00fablico).\n5. **Quem ensina, quem aponta.** A conversa da Operadora \u00e9 de quem tem \"Regra contratual e tabelas\" (gest\u00e3o e diretorias), e o que essa pessoa confirma nasce Vigente. O \"Faltou isto\" \u00e9 de qualquer um que v\u00ea o Guia; a Regra que nasce de faturista ou coordenadora entra Pendente e vai para a Valida\u00e7\u00e3o.\n6. **Regra Pendente s\u00f3 quando algu\u00e9m de fato precisa decidir.** Regra que a diretoria ou a gest\u00e3o ensina ou importa nasce Vigente. Pendente fica para a Regra t\u00e9cnica HSM copiada e para a proposta de quem n\u00e3o decide. As Pendentes que j\u00e1 existem se resolvem numa conversa \"revisar pendentes\" da Operadora, em lote.\n7. **Prova antes do Confirmar.** Toda Regra nova ou alterada refaz o Passo B nas 10 \u00faltimas Contas conclu\u00eddas da Operadora (os eventos ficam guardados depois que o PDF \u00e9 apagado) e mostra o que o Guia teria dito de diferente, sem mexer nessas Contas. Linha marcada Feito que sumiria \u00e9 destacada. \"N\u00e3o mudaria nada\" tamb\u00e9m aparece, como sinal de que a Regra n\u00e3o pega como se imagina. Descartado: prova com 30 dias, que passa de cem Contas por Regra.\n8. **Conflito em vez de teto.** Sem limite de Regras por Operadora; a proposta acusa a Regra existente com que conflita e prop\u00f5e juntar ou substituir, em vez de empilhar.\n9. **Contrato vira Regras.** O contrato subido na conversa da Operadora gera propostas cl\u00e1usula a cl\u00e1usula e preenche o \"o contrato diz\" das Regras que j\u00e1 existem, pelo mesmo trilho de proposta e prova. A extra\u00e7\u00e3o de datas para o aviso de reajuste continua.\n10. **O `.md` continua sendo a rota para trabalhar fora do app.** Exportar e importar ficam como est\u00e3o; a importa\u00e7\u00e3o passa a mostrar o que mudou Regra a Regra antes de gravar, para n\u00e3o sobrescrever \u00e0s cegas o que foi ensinado pela conversa.\n11. **XLS antigo entra**, convertido para XLSX no servidor.\n12. **Custo sem teto, na tela.** Conversa e prova gravam em `cm_chamada_ia` e entram no custo da semana do Painel. O Painel ganha tamb\u00e9m o \"Faltou isto\" por semana e por origem.\n13. **A fila de Valida\u00e7\u00e3o chega decidida.** O Auditor decide cada Tema de valida\u00e7\u00e3o (N\u00e3o procede, Bloqueado, Regra proposta por quem n\u00e3o decide) com recomenda\u00e7\u00e3o, motivo e prova; a diretoria aprova o lote da semana ou corrige o item N. A pessoa passa de quem decide para quem aprova.\n14. **Um segundo agente procura o que o Auditor deixou passar.** Toda semana rel\u00ea uma amostra de 10 Contas conclu\u00eddas por outro \u00e2ngulo (o que o prontu\u00e1rio diz que foi dado e n\u00e3o est\u00e1 na conta) e cada achado entra como \"Faltou isto\" com origem agente, no lote do diretor. Vem numa fatia depois das outras. A auditoria em papel do diretor passa a ser a prova de que esse agente funciona, n\u00e3o o \u00fanico detector.\n15. **Lan\u00e7ar no MV continua humano.** O app n\u00e3o tem integra\u00e7\u00e3o com o MV; a faturista executa e marca Feito. Automatizar isso \u00e9 outro PRD.\n16. **\"Auditor\" volta, s\u00f3 como nome do agente.** Revoga a decis\u00e3o 12 da ADR 0070: o agente se chama Auditor na tela (\"Falar com o auditor\"). Guia, Linha, Mem\u00f3ria e Valida\u00e7\u00e3o ficam com esses nomes; rotas e tabelas continuam `cm_`. Sem nome de pessoa.\n\n## Consequ\u00eancias\n\n- O objetivo \u00e9 que agentes executem e conversem entre si (Auditor, segundo agente, agente de desenvolvimento) e que as pessoas aprovem lotes, em vez de checar item por item.\n- O diretor ensina por conversa sem perder o que torna a an\u00e1lise previs\u00edvel: tudo que pesa est\u00e1 escrito numa Regra que ele l\u00ea, prova e desfaz.\n- O app passa a medir omiss\u00f5es, n\u00e3o s\u00f3 acertos. \u00c9 o n\u00famero que diz se o Auditor melhora entre uma auditoria em papel e a seguinte.\n- Prova e conversa somam custo de IA por Regra ensinada (em torno de US$ 1 por prova de 10 Contas, com a Mem\u00f3ria em cache); o segundo agente soma US$ 1 a 2 por semana.\n- Issue `ready-for-agent` aberta pelo app consome sess\u00e3o de agente sem triagem: se o Auditor abrir card ruim em s\u00e9rie, o sinal aparece na fila da `/onda-enxuta`, n\u00e3o antes.\n- A fila de Valida\u00e7\u00e3o encolhe para o que s\u00f3 a diretoria decide.\n- Pede migration (conversa, mensagens, prova, apontamento \"Faltou isto\"), aplicada no Studio como as outras do m\u00f3dulo.", "cita": [68], "decisao": "Decis\u00e3o do Pedro (07/11/2026, grilling) sobre os \u00e1udios do Diretor Executivo depois de usar o m\u00f3dulo. O modelo mental dele \u00e9 o de um auditor humano que ele treina: ele explica o contrato, entrega os documentos, corrige quando o auditor...", "emenda": [70], "emendada_por": [82], "file": "docs/adr/0081-contas-medicas-auditor-conversa-que-propoe-prova-e-faltou-isto.md", "number": 81, "slug": "0081-contas-medicas-auditor-conversa-que-propoe-prova-e-faltou-isto", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Contas m\u00e9dicas: o Auditor \u00e9 uma conversa que s\u00f3 prop\u00f5e, toda regra passa por prova, e o \"Faltou isto\" entra no Guia"}, {"amended_by": "0087", "amends": "0081", "body_md": "Decis\u00e3o do Pedro (09/11/2026), depois do pico de custo de IA dos dias 8 e 9 de novembro. Emenda as decis\u00f5es 13 e 14 da ADR 0081.\n\n## Contexto\n\n- No dia 9/11 (UTC) a conta da Anthropic marcou US$ 99,79 em Opus 5.5, e no dia 8, US$ 44. Tudo saiu de Contas m\u00e9dicas: no dia 9, US$ 76,27 vieram de 131 chamadas da Prova da regra, US$ 18,40 da an\u00e1lise de 12 contas (Passo A e Passo B) e US$ 5,12 do Auditor.\n- A Prova veio do job `validacao_decidida_contas_medicas`, que entrou com a #1491 (PR #1510): a cada 30 minutos ele pegava at\u00e9 5 Temas da Valida\u00e7\u00e3o sem recomenda\u00e7\u00e3o e, em cada Regra pendente, refazia o Passo B nas \u00faltimas Contas conclu\u00eddas da operadora. Em dois dias ele provou as 53 Regras pendentes que a importa\u00e7\u00e3o das mem\u00f3rias tinha deixado na fila, uma a cada 5 minutos, sem ningu\u00e9m pedir.\n- O rel\u00f3gio n\u00e3o estava na ADR 0081, no PRD #1484 nem no card #1491. Eles pediam s\u00f3 que a fila chegasse decidida para aprovar em lote. A escolha do job de 30 minutos foi do agente que implementou o card, com o motivo de que a prova \"n\u00e3o cabe no tempo de um pedido\".\n- A ADR 0081 estimava US$ 1 por prova de 10 Contas. Saiu cerca de US$ 2,40 por prova de 4 Contas: o Passo B devolve uns 21 mil tokens de sa\u00edda por Conta, e o Coolify tem `CM_IA_MODELO_PASSO_A` e `CM_IA_MODELO_PASSO_B` em Opus.\n- O segundo agente (decis\u00e3o 14 da ADR 0081) estava agendado para todo domingo \u00e0s 03:00, 10 Contas por rodada, no modelo do Passo B. Ainda n\u00e3o tinha rodado.\n\n## Decis\u00f5es\n\n1. **Chamada de IA com custo relevante s\u00f3 roda depois de uma a\u00e7\u00e3o humana.** Vale para o app inteiro: nenhum job do APScheduler dispara IA por conta pr\u00f3pria. Quem clica v\u00ea antes quanto vai ser feito e o custo estimado. Fica de fora o que custa centavos e j\u00e1 roda hoje, como as sugest\u00f5es de a\u00e7\u00e3o do relat\u00f3rio quinzenal e mensal da Ouvidoria, que continua autom\u00e1tico. A fila de an\u00e1lise de Contas m\u00e9dicas tamb\u00e9m segue como est\u00e1, porque s\u00f3 processa a conta que algu\u00e9m enviou.\n\n2. **A Valida\u00e7\u00e3o chega decidida quando algu\u00e9m pede (emenda a decis\u00e3o 13 da ADR 0081).** Sai o job de 30 minutos. A tela de Valida\u00e7\u00e3o ganha o bot\u00e3o \"Pedir recomenda\u00e7\u00e3o ao Auditor\", com o n\u00famero de Temas abertos sem recomenda\u00e7\u00e3o, quantos levam Prova da regra e o custo estimado. Confirmado, o servidor recomenda todos esses Temas em segundo plano, sem o teto de 5 por rodada, e a tela mostra que est\u00e1 calculando. Um pedido por vez. O resto da decis\u00e3o 13 continua: a pessoa aprova o lote ou corrige o item N.\n\n3. **A recomenda\u00e7\u00e3o da Valida\u00e7\u00e3o roda no Sonnet.** A Prova da regra e o Auditor pedidos por esse bot\u00e3o usam `CM_IA_MODELO_VALIDACAO`, padr\u00e3o `claude-sonnet-5-5`, que custa metade do Opus. A Prova pedida na conversa da Operadora e o resto do m\u00f3dulo seguem nos modelos do Passo A e do Passo B.\n\n4. **O segundo agente roda quando algu\u00e9m pede (emenda a decis\u00e3o 14 da ADR 0081).** Sai o job de domingo. O Painel ganha, para quem tem \"painel completo\", o bot\u00e3o \"Reler contas conclu\u00eddas\", com quantas Contas ser\u00e3o relidas (at\u00e9 10 ainda n\u00e3o revisadas) e o custo estimado. O que ele acha continua entrando como Faltou isto de origem AGENTE.\n\n## Consequ\u00eancias\n\n- O custo de IA de Contas m\u00e9dicas passa a ter dono: cada rodada de recomenda\u00e7\u00e3o e de releitura tem algu\u00e9m que clicou e viu a estimativa antes.\n- A fila de Valida\u00e7\u00e3o pode ficar sem recomenda\u00e7\u00e3o at\u00e9 algu\u00e9m pedir. O lote s\u00f3 aplica o que tem recomenda\u00e7\u00e3o, ent\u00e3o nada muda para quem decide pelo cart\u00e3o.\n- Se ningu\u00e9m clicar, o segundo agente n\u00e3o rel\u00ea nada e o Painel n\u00e3o ganha Faltou isto de origem AGENTE naquela semana.\n- O pedido roda em segundo plano no mesmo processo. Um deploy no meio da rodada a interrompe; os Temas que faltaram continuam sem recomenda\u00e7\u00e3o e o pr\u00f3ximo clique termina o trabalho.\n- Job novo que chame IA precisa de uma ADR que emende esta.", "cita": [], "decisao": "Decis\u00e3o do Pedro (09/11/2026), depois do pico de custo de IA dos dias 8 e 9 de novembro. Emenda as decis\u00f5es 13 e 14 da ADR 0081.", "emenda": [81], "emendada_por": [87], "file": "docs/adr/0082-ia-com-custo-so-roda-depois-de-acao-humana.md", "number": 82, "slug": "0082-ia-com-custo-so-roda-depois-de-acao-humana", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "IA com custo s\u00f3 roda depois de uma a\u00e7\u00e3o humana; a Valida\u00e7\u00e3o e o segundo agente de Contas m\u00e9dicas viram bot\u00e3o"}, {"amended_by": "0084, 0090, 0091", "amends": "0077", "body_md": "Decis\u00e3o do Pedro (10/11/2026, grill no terminal em duas rodadas). A ADR 0077 reduziu a aba Tecnologia ao chat do diretor com o agente e tirou Respons\u00e1vel, Conversa, men\u00e7\u00f5es e e-mail. Oito dias de uso mostraram o que faltou do lado da Vitta: cada pessoa via s\u00f3 as pr\u00f3prias conversas, ent\u00e3o o Pedro n\u00e3o enxergava os cards que o diretor criava nem a entrevista que os gerou; a melhoria nascia sempre designada ao Pedro e o bug a ningu\u00e9m escolhido; uma falha na cria\u00e7\u00e3o da issue virava um erro na tela e n\u00e3o ficava registrada; e n\u00e3o havia como responder ao diretor dentro da Demanda. Esta ADR devolve tr\u00eas coisas, e s\u00f3 tr\u00eas: o Respons\u00e1vel, a vis\u00e3o do Desenvolvedor e a conversa entre pessoas.\n\n## Decis\u00f5es\n\n1. **Voltam Respons\u00e1vel, Conversa da Demanda e a vis\u00e3o do Desenvolvedor.** Prioridade, Prazo, Quadro, Painel, os sete Tipos e Produto com dono continuam aposentados. Emenda a decis\u00e3o 1 da ADR 0077. Rejeitado: Painel ou Quadro com raias por pessoa (\u00e9 o gestor de tarefas que a 0077 desmontou).\n\n2. **Desenvolvedor n\u00e3o \u00e9 perfil novo.** \u00c9 o Super admin que tem login do GitHub no cadastro. A aba segue sem eixo de permiss\u00e3o pr\u00f3prio (ADR 0050). Hoje s\u00e3o tr\u00eas: Pedro Rezende, Pedro Rib e Lucas Sampaio. Rejeitado: perfil \"Tecnologia\" com permiss\u00e3o pr\u00f3pria (eixo novo para tr\u00eas pessoas que j\u00e1 t\u00eam acesso).\n\n3. **Mesma tela, com mais para o Desenvolvedor.** Ele v\u00ea as Demandas de todos, a entrevista inteira, o n\u00famero e o link da issue e o estado do envio. A lista dele abre em \"Para mim\" e tem \"Todas\" e \"Envio falhou\", com autor e Respons\u00e1vel em cada linha. O diretor segue vendo s\u00f3 as Demandas dele, sem n\u00famero nem link. Rejeitado: tela separada para desenvolvedores.\n\n4. **A entrevista fica no app.** A issue leva um link para a Demanda, e n\u00e3o a conversa. Rejeitado: copiar a entrevista para a issue depois da peneira (o reposit\u00f3rio \u00e9 p\u00fablico e a fala crua do diretor n\u00e3o precisa estar l\u00e1 para o Desenvolvedor ler).\n\n5. **O diretor escolhe o Respons\u00e1vel antes de \"Criar o card\", e a escolha \u00e9 opcional.** O Respons\u00e1vel \u00e9 o dono do card no GitHub (o assignee), ent\u00e3o o card cai na fila de quem foi escolhido. Sem escolha, bug e melhoria caem no Pedro, que repassa trocando o dono. O bug continua nascendo pronto para a onda, agora na fila do Respons\u00e1vel. Rejeitado: escolha obrigat\u00f3ria (o diretor nem sempre sabe de quem \u00e9, e travar a cria\u00e7\u00e3o tira o canal dele); card sem dono at\u00e9 algu\u00e9m assumir (n\u00e3o entra em nenhuma fila e some).\n\n6. **Depois de criado, o Respons\u00e1vel \u00e9 derivado do GitHub**, como a Etapa: troca-se l\u00e1 e o app reflete. Rejeitado: trocar no app e gravar no GitHub (duas fontes, e risco de dois donos).\n\n7. **Falha de envio fica registrada na Demanda.** \"Envio falhou\" guarda o motivo e aparece na lista; diretor e Desenvolvedor t\u00eam \"Reenviar\". Designa\u00e7\u00e3o que falhou com a issue j\u00e1 criada aparece s\u00f3 para o Desenvolvedor, com \"Designar de novo\". A falha avisa os Desenvolvedores no sino. Rejeitado: reenvio autom\u00e1tico pelo cron (se a primeira tentativa passou e s\u00f3 a resposta se perdeu, nasce issue duplicada no reposit\u00f3rio p\u00fablico).\n\n8. **A Conversa da Demanda vive s\u00f3 no app**, separada da conversa com o agente, com men\u00e7\u00e3o. Men\u00e7\u00e3o e mensagem nova avisam por sino e por e-mail. Sem men\u00e7\u00e3o, a mensagem do diretor avisa o Respons\u00e1vel e a do Desenvolvedor avisa o autor da Demanda. Emenda as decis\u00f5es 1 e 3 da ADR 0077: a aba volta a ter os dois sentidos, mas s\u00f3 dentro de uma Demanda que o diretor abriu. Rejeitado: espelhar com os coment\u00e1rios da issue (o diretor n\u00e3o est\u00e1 no GitHub e a fala dele iria para o reposit\u00f3rio p\u00fablico); s\u00f3 o sino (o diretor n\u00e3o fica com o app aberto).\n\n9. **O card do diretor \u00e9 reconhec\u00edvel no GitHub.** A issue nasce com uma label de origem e, no topo, uma frase de resumo escrita pelo agente e passada pela peneira, em bug e em melhoria. O Hospital OS deriva da\u00ed o destaque, o aviso por voz e o resumo di\u00e1rio (ADR 0062): voz e destaque s\u00f3 para card designado a quem usa o OS; os dos outros Respons\u00e1veis entram no resumo do dia. Essa parte \u00e9 uma issue no reposit\u00f3rio do OS. Rejeitado: o app avisar o OS por chamada direta (o OS roda na m\u00e1quina de cada um e a produ\u00e7\u00e3o n\u00e3o o alcan\u00e7a); voz para todo card do diretor (aviso que toca por card alheio perde valor).\n\n## Consequ\u00eancias\n\n- O gloss\u00e1rio da Tecnologia ganha Desenvolvedor, Respons\u00e1vel, Conversa da Demanda e Envio falhou; Respons\u00e1vel e Conversa da Demanda saem da lista de aposentados com defini\u00e7\u00e3o nova.\n- A Demanda precisa guardar o estado do envio e o motivo da falha, o que pede migration.\n- A leitura de uma Demanda passa a conferir quem pede: autor ou Desenvolvedor.\n- A label de origem entra em `docs/agents/triage-labels.md`.\n- O Kit `tecnologia.md` muda no mesmo PR da tela.", "cita": [50, 62], "decisao": "Decis\u00e3o do Pedro (10/11/2026, grill no terminal em duas rodadas). A ADR 0077 reduziu a aba Tecnologia ao chat do diretor com o agente e tirou Respons\u00e1vel, Conversa, men\u00e7\u00f5es e e-mail. Oito dias de uso mostraram o que faltou do lado da...", "emenda": [77], "emendada_por": [84, 90, 91], "file": "docs/adr/0083-tecnologia-responsavel-escolhido-pelo-diretor-e-conversa-da-demanda-no-app.md", "number": 83, "slug": "0083-tecnologia-responsavel-escolhido-pelo-diretor-e-conversa-da-demanda-no-app", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Tecnologia: o diretor escolhe o Respons\u00e1vel, o Desenvolvedor v\u00ea as Demandas de todos e a Conversa da Demanda volta, s\u00f3 no app"}, {"amended_by": "0090, 0091, 0092, 0093", "amends": "0050, 0054, 0077, 0083", "body_md": "Decis\u00e3o do Pedro (11/11/2026, grill no terminal em duas rodadas, todas as recomenda\u00e7\u00f5es aceitas). A aba Tecnologia virou o chat do diretor com o agente (ADR 0077) e ganhou Respons\u00e1vel e a vis\u00e3o do Desenvolvedor (ADR 0083). No uso apareceram seis faltas. A tela ficou apertada, com quatro filtros espremidos e o menu fixo. O detalhe do card \u00e9 um texto corrido, quase a fala do diretor transcrita. N\u00e3o h\u00e1 como tirar da lista um card que n\u00e3o vale mais. Card planejado antes da ADR 0079, com teto de 12 perguntas, fica velho, e o c\u00f3digo pode j\u00e1 ter andado por fora. O que o Desenvolvedor abre pelo terminal n\u00e3o aparece para o diretor. E ningu\u00e9m v\u00ea o que foi entregue, quando subiu, nem um v\u00eddeo do que mudou.\n\n## Decis\u00f5es\n\n1. **Um PRD no app, e a skill do v\u00eddeo \u00e0 parte, no reposit\u00f3rio do OS.** As frentes da aba (tela, apagar, revis\u00e3o, cards do terminal, Entregas, demonstra\u00e7\u00e3o no card) se cruzam e v\u00e3o num PRD s\u00f3, em fatias. A skill que gera o v\u00eddeo \u00e9 ferramenta e vai num PR pr\u00f3prio no OS.\n\n2. **Apagar.** O card some do app, com a conversa e os anexos. No GitHub, a issue-raiz e as partes fecham como \"n\u00e3o planejada\", com um coment\u00e1rio de motivo. A issue n\u00e3o \u00e9 apagada de verdade: isso n\u00e3o tem volta, exigiria token com poder de administrador no app em produ\u00e7\u00e3o (o de hoje s\u00f3 escreve issues) e levaria junto o hist\u00f3rico das decis\u00f5es. S\u00f3 se apaga at\u00e9 **Planejada**: em Em desenvolvimento j\u00e1 existe PR aberto. Quem apaga: o autor apaga a pr\u00f3pria conversa Registrada; card criado, s\u00f3 o Desenvolvedor. Emenda a decis\u00e3o 11 da ADR 0050 (\"Nada se apaga\"). Rejeitado: apagar a issue no GitHub; arquivar sem apagar.\n\n3. **Revisar com o c\u00f3digo de hoje.** Bot\u00e3o no card em Em an\u00e1lise ou Planejada, enquanto nenhuma parte est\u00e1 em desenvolvimento. Ele retoma a mesma conversa e a mesma issue. O agente rel\u00ea a issue (corpo, coment\u00e1rios e o que mudou por fora), o c\u00f3digo, as ADRs aceitas e o que subiu desde a data do card. Depois abre o **Retrato de hoje** em tr\u00eas blocos (J\u00e1 existe, Mudou desde o card, Continua em aberto) e pergunta s\u00f3 pelas lacunas, sem teto. Todo item de \"J\u00e1 existe\" diz a vers\u00e3o em que entrou e passa pelo \"isso atende?\" do diretor antes de sair do card. Nada sai em sil\u00eancio. \"Atualizar o card\" regrava o PRD na mesma issue, com um coment\u00e1rio do que mudou. Se o card j\u00e1 tinha partes n\u00e3o come\u00e7adas, elas fecham como \"n\u00e3o planejada\" e o card volta para Em an\u00e1lise, para um novo `/to-issues`. Clicam o autor e o Desenvolvedor, com estimativa de custo e confirma\u00e7\u00e3o (ADR 0082), e a conversa registra quem respondeu cada turno. Rejeitado: conversa nova com issue nova (perde n\u00famero e hist\u00f3rico); reescrita do PRD pelo agente sem conversa.\n\n4. **Cards do terminal aparecem na aba.** Toda issue-raiz do app, PRD ou bug, ganha uma Demanda, com selo de **Origem**: \"Pedido do diretor\" ou \"Vitta\". Ferramenta e skills (`.claude/`, `tools/`, `docs/`) ficam de fora. A Demanda da Vitta n\u00e3o tem conversa com o agente; tem Etapa, documento e Conversa da Demanda. Emenda a decis\u00e3o 3 da ADR 0077 (a aba tinha um sentido s\u00f3) e a regra do gloss\u00e1rio que evitava PRD criado pelo terminal. Rejeitado: label manual para mostrar ao diretor; mostrar todas as issues, ferramenta inclusive.\n\n5. **Mesma tela para o diretor e para o Desenvolvedor.** Com `github_login`, ganha a mais o n\u00famero, o link e o bot\u00e3o de apagar card criado, como j\u00e1 \u00e9 a regra (ADR 0054, decis\u00e3o 9; ADR 0083). Rejeitado: telas separadas.\n\n6. **Tela.** O menu principal recolhe para s\u00f3 \u00edcones, em todo o app, e lembra a escolha no navegador. A lista de conversas fica mais larga, com busca e filtros em chips (Tipo, Etapa, Origem, Respons\u00e1vel, Envio falhou), e recolhe quando o documento abre. **Ver a emenda de 11/11/2026 abaixo: os chips viraram uma barra de campos com r\u00f3tulo.**\n\n7. **Documento do card.** O detalhe deixa de ser texto corrido e vira um documento com se\u00e7\u00f5es fixas: Em uma frase, O que muda (at\u00e9 cinco t\u00f3picos), Partes (com Etapa e datas), Demonstra\u00e7\u00e3o e Datas (criado, entregue, em produ\u00e7\u00e3o). Durante o planejamento ele se monta ao vivo ao lado do chat, no molde da ata viva da Ata Guiada. Depois do card, \u00e9 lido do GitHub. O bloco \"Para o diretor\" da issue ganha esse formato fixo e limite de tamanho, tanto no PRD do diretor quanto no `/to-prd` do terminal. Continua nunca digitado no app (ADR 0054, decis\u00e3o 7). Rejeitado: s\u00f3 resumir o texto de hoje; documento edit\u00e1vel \u00e0 m\u00e3o.\n\n8. **Entregas.** Segunda aba dentro de Tecnologia (\"Conversas\" e \"Entregas\"), que conta por card, com as partes no detalhe. Mostra entregues por semana e por m\u00eas, a data de entrega (fechamento), a data em produ\u00e7\u00e3o (Subida) e o Respons\u00e1vel. O hist\u00f3rico vem do que o `history.json` registra desde o primeiro deploy, e card antigo sem bloco aparece com \"Descri\u00e7\u00e3o em prepara\u00e7\u00e3o\". N\u00e3o \u00e9 o Painel que a ADR 0077 aposentou nem o quadro por pessoa que a 0083 rejeitou. \u00c9 retrato do que j\u00e1 foi entregue, n\u00e3o gestor de tarefa: ningu\u00e9m move nada ali. Rejeitado: na Central de Comando; contar por fatia.\n\n9. **Demonstra\u00e7\u00e3o.** O v\u00eddeo nasce de um clique do Pedro, nunca da Subida. O bot\u00e3o \"Gerar demonstra\u00e7\u00e3o\", no PedroOS, por card entregue (PRD ou bug), abre uma sess\u00e3o no Claude Agents que roda o `/divulgar` (ADR 0045). No fim, a sess\u00e3o grava na issue-raiz o marcador `<!-- demonstracao: <url> -->`, e o webhook que j\u00e1 existe leva o link da Vercel ao card, que ganha o selo \"Tem demonstra\u00e7\u00e3o\". O GitHub segue fonte \u00fanica, e o caminho vale tamb\u00e9m para card do terminal. Rejeitado: v\u00eddeo em toda subida (custo, ADR 0082); rota de automa\u00e7\u00e3o nova no app.\n\n10. **O diretor fica sabendo.** Sino e e-mail em dois momentos: quando o card entra **Em produ\u00e7\u00e3o**, com o resumo do que entrou e para que serve, e quando a **demonstra\u00e7\u00e3o fica pronta**. O resumo \u00e9 montado do documento estruturado, sem IA.
