<style>
:root {
  --bg: #07080c;
  --s1: #0b0d13;
  --s2: #10131b;
  --s3: #171b26;
  --s4: #212636;
  --ink: #e9ecf4;
  --ink-2: #aab0c3;
  --ink-3: #7f869b;
  --hair: rgba(233, 236, 244, 0.07);
  --magenta: #ff8a3d;
  --ambar: #ffb020;
  --vermelho: #ff6a5e;
  --verde: #4fd1a1;
  --ciano: #5ec8ff;
  --magenta-acesa: #ffb27a;
  --lilas: #c9a6ff;
  --demanda: #ff4fa3; 
  --humor: var(--magenta);
  --display: 'Sofia Sans Extra Condensed', 'Geist Sans', sans-serif;
  --sans: 'Geist Sans', system-ui, sans-serif;

  --raio: 14px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}

:root[data-humor='rodando'] { --humor: var(--ambar); }
:root[data-humor='erro'] { --humor: var(--vermelho); }
:root[data-humor='feito'] { --humor: var(--verde); }
:root[data-humor='ouvindo'] { --humor: var(--ciano); }
:root[data-humor='falando'] { --humor: var(--magenta-acesa); }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
  overflow: hidden;
}

::selection { background: color-mix(in oklab, var(--humor) 38%, transparent); color: var(--ink); }
:focus-visible { outline: 2px solid color-mix(in oklab, var(--humor) 80%, white); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 10px; border: 3px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
input, textarea, button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
a { color: inherit; text-underline-offset: 3px; }
.num, time, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }



.app {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  height: 100vh;
  position: relative;
  isolation: isolate;
}


.app::before {
  content: '';
  position: absolute;
  inset: -20vh auto auto -18vw;
  width: 70vw;
  height: 70vh;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--humor) 22%, transparent), transparent);
  pointer-events: none;
  z-index: -1;
  transition: background 1.2s var(--ease);
}



.lateral {
  display: flex;
  flex-direction: column;
  background: color-mix(in oklab, var(--s1) 86%, transparent);
  padding: 22px 16px 16px;
  min-height: 0;
  gap: 18px;
  
  overflow-y: auto;
}

.marca {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 8px;
}
.marca b { font: 800 26px/1 var(--display); letter-spacing: 0.04em; }
.marca span { font: 400 11px/1 var(--mono); color: var(--ink-3); letter-spacing: 0.06em; }

.presenca { display: grid; justify-items: center; gap: 2px; margin-top: -4px; }
.moldura { position: relative; }
.orbe { position: relative; }
.orbe canvas { display: block; }

.orbe[data-sem-webgl='true'] {
  border-radius: 50%;
  background: radial-gradient(circle, transparent 30%, color-mix(in oklab, var(--humor) 40%, white) 34%, var(--humor) 44%, #2a1206 56%, transparent 60%);

}
.estado-ia {

}
.mostrador { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.mostrador .tick.agora { stroke: var(--humor); stroke-width: 2; }
.estado-sub {
  font: 400 13px/1.4 var(--sans);
  color: var(--ink-2);

.botao-especial {

  display: flex;

.alas { display: grid; gap: 2px; }
.alas.sistema { margin-top: auto; }

  grid-template-columns: 22px minmax(0, 1fr) auto;

.ala-item:hover { background: var(--s3); color: var(--ink); }
.ala-item[aria-current='page'] { background: var(--s3); color: var(--ink); }

.ala-item svg { width: 17px; height: 17px; stroke-width: 1.6; }

.relogio-lateral { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px 0; color: var(--ink-3); font: 400 11px/1 var(--mono); letter-spacing: 0.06em; }


.marca span { margin-left: auto; }
.recolher {
  display: grid;
  place-items: center;
  align-self: center;
  margin-left: 8px;
  padding: 5px;
  border: 0;
  border-radius: 8px;
  background: transparent;

}
.recolher:hover { background: var(--s3); color: var(--ink); }
.recolher svg { width: 17px; height: 17px; stroke-width: 1.6; }
.app:has(> .lateral[data-recolhida]) { grid-template-columns: 72px minmax(0, 1fr); }
.lateral[data-recolhida] { padding: 22px 10px 16px; scrollbar-width: none; }

.lateral[data-recolhida] .recolher { margin-left: 0; }
.lateral[data-recolhida] :is(.marca b, .marca span, .estado-ia, .estado-sub, .alas h2, .ala-item span, .relogio-lateral) { display: none; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 12px; border-radius: 8px; border: 0;

}
.btn:hover:not(:disabled) { background: var(--s4); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; }
.btn svg { width: 15px; height: 15px; stroke-width: 1.8; }
.btn.primario { background: var(--ink); color: var(--bg); }
.btn.primario:hover:not(:disabled) { background: #fff; }
.btn.fantasma { background: transparent; color: var(--ink-2); }
.btn.fantasma:hover:not(:disabled) { background: var(--s3); color: var(--ink); }
.btn.pequeno { height: 28px; padding: 0 10px; font-size: 12px; }
.btn[aria-pressed='true'] { background: color-mix(in oklab, var(--magenta) 22%, var(--s2)); color: var(--ink); }
.btn[aria-pressed='true'] .num { color: var(--magenta-acesa); }



.principal { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; min-width: 0; }
.rolagem { overflow-y: auto; padding: 34px clamp(24px, 3.4vw, 56px) 40px; }

.tubo {
  --pa: #ff8a3d; --pb: #4a1a08; --pc: #ffe6d2; 
  --alt: 18px;
  display: grid; gap: 7px; min-width: 0;
}
.tubo[data-rodando='true'] { --pa: #ffb020; --pb: #7a2a06; --pc: #fff1cf; }
.tubo[data-fino='true'] { --alt: 8px; }
.tubo-vidro {
  position: relative; height: var(--alt); border-radius: 999px; overflow: hidden;
  background:
    linear-gradient(180deg, rgba(233, 236, 244, 0.07), transparent 45%, rgba(0, 0, 0, 0.4)),
    color-mix(in oklab, var(--pb) 22%, var(--bg));
  box-shadow: inset 0 1px 0 rgba(233, 236, 244, 0.06), inset 0 -2px 5px rgba(0, 0, 0, 0.55);
}
.tubo-plasma {
  position: absolute; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 4px) * var(--pct) / 100);
  min-width: calc(var(--alt) - 4px);
  border-radius: 999px; overflow: hidden;
  background: linear-gradient(180deg, var(--pc) -30%, var(--pa) 34%, var(--pb) 115%);
  animation: enche 1.6s var(--ease) both;
  transition: filter 1s var(--ease);
}
.tubo[data-fino='true'] .tubo-plasma { top: 1px; bottom: 1px; left: 1px; width: calc((100% - 2px) * var(--pct) / 100); }
.tubo-nebulosa {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 40%, color-mix(in oklab, var(--pc) 70%, transparent) 0 0.6px, transparent 1.2px) 0 0 / 29px 11px,
    radial-gradient(circle at 70% 75%, color-mix(in oklab, var(--pc) 45%, transparent) 0 0.5px, transparent 1.1px) 0 0 / 43px 13px,
    radial-gradient(38% 130% at 22% 42%, color-mix(in oklab, var(--pc) 55%, transparent), transparent 72%) 0 0 / 180px 100%,
    radial-gradient(30% 150% at 62% 72%, color-mix(in oklab, var(--pb) 90%, transparent), transparent 72%) 0 0 / 240px 100%,
    radial-gradient(34% 120% at 86% 28%, color-mix(in oklab, var(--pa) 70%, var(--pc)), transparent 70%) 0 0 / 140px 100%;
  background-repeat: repeat;
  opacity: 0.9;
  animation: deriva 16s linear infinite;
}

.tubo-plasma::after {
  content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 12px;
  background: radial-gradient(closest-side, var(--pc), transparent);
  animation: menisco 2.6s ease-in-out infinite alternate;
}
.tubo-reflexo {
  position: absolute; left: 7px; right: 7px; top: 2px; height: 32%;
  border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0));
}
.tubo[data-fino='true'] .tubo-reflexo { left: 3px; right: 3px; top: 1px; height: 30%; }
.tubo[data-rodando='true'] .tubo-nebulosa { animation-duration: 3.5s; }
.tubo[data-rodando='true'] .tubo-plasma::after { animation-duration: 0.7s; }

.tubo[data-frio='true'] .tubo-plasma { filter: saturate(0.3) brightness(0.72); }
.tubo[data-frio='true'] .tubo-nebulosa { animation-duration: 48s; }
.tubo-marcas { display: grid; padding: 0 2px; height: 6px; align-items: start; }
.tubo-marcas i { justify-self: center; width: 1px; height: 4px; background: color-mix(in oklab, var(--ink-3) 40%, transparent); }
.tubo-marcas i[data-acesa='true'] { height: 6px; width: 1.5px; background: color-mix(in oklab, var(--pa) 80%, var(--ink)); }
.tubo[data-frio='true'] .tubo-marcas i[data-acesa='true'] { background: var(--ink-3); }

@keyframes enche { from { clip-path: inset(0 100% 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }
@keyframes deriva { to { background-position: 58px 0, -43px 0, 180px 0, -240px 0, 280px 0; } }
@keyframes menisco { from { opacity: 0.55; } to { opacity: 1; } }



.fatos { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 24px; color: var(--ink-2); font-size: 14px; }
.fatos b { color: var(--ink); font-weight: 500; }
.cartoes-projeto { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: stretch; }

.projeto {
  display: grid; gap: 10px; min-width: 0; align-content: start;
  padding: 18px 20px 16px; border-radius: var(--raio); background: var(--s1);
  transition: background 0.3s var(--ease);
}
.projeto:hover { background: var(--s2); }
.projeto-cab { display: flex; align-items: center; gap: 10px; min-width: 0; }
.projeto-cab h3 {
  font: 800 26px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; margin: 0;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.projeto-cab .repo { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; color: var(--ink-3); flex: none; transition: background 0.2s var(--ease), color 0.2s var(--ease); }
.projeto-cab .repo:hover { background: var(--s3); color: var(--ink); }
.projeto-cab .repo svg { width: 14px; height: 14px; }
.selos { display: flex; gap: 6px; margin-left: auto; flex: none; }
.selo {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 6px;
  background: var(--s3); color: var(--ink-2); font: 500 11px/1 var(--mono); letter-spacing: 0.02em;
}
.selo svg { width: 12px; height: 12px; }
.selo.sem-pasta { background: color-mix(in oklab, var(--magenta) 14%, var(--s2)); color: var(--magenta-acesa); }
.projeto-repo { margin-top: -6px; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.projeto-linha { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
.projeto-linha .branch { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink); }
.projeto-linha svg { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
.pendentes[data-tem='true'] { color: var(--ambar); }
.commit { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; row-gap: 2px; align-items: center; font-size: 14px; }
.commit svg { width: 15px; height: 15px; color: var(--ink-3); }
.commit .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commit .quando { grid-column: 2; font-size: 11.5px; color: var(--ink-3); }
.commit.vazio { display: block; color: var(--ink-3); }
.projeto-pe { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; margin-top: 2px; }
.projeto-pe .mono { flex: 1 1 120px; min-width: 0; font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.projeto-botoes { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; margin-left: auto; }
.projeto-pe .btn { flex: none; }
.projeto-falha { margin: 0; font-size: 12.5px; color: var(--vermelho); }
.projeto[data-parado='true'] h3 { color: var(--ink-2); }

.categoria + .categoria { margin-top: 34px; }
.parados { margin-top: 34px; }
.cab-secao { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; font: inherit; }
.sec-alternar {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 4px 2px; margin-left: -2px;
  border: 0; border-radius: 8px; background: transparent; color: var(--ink);
  font: 800 26px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
}
.sec-alternar:hover { background: var(--s2); }
.sec-seta { width: 18px; height: 18px; color: var(--ink-3); transition: transform 0.25s var(--ease); }
.sec-alternar[aria-expanded='true'] .sec-seta { transform: rotate(90deg); }
.sec-alternar .conta { font: 500 13px/1 var(--mono); color: var(--ink-2); letter-spacing: 0; }
.cab-secao .nota { color: var(--ink-3); font-size: 13px; }
.cab-secao .btn { align-self: center; }
.coleta-nota { margin: 0 0 14px; color: var(--ink-3); font-size: 13px; }



.novo-projeto { margin: 0 0 24px; padding: 18px 20px; border-radius: var(--raio); background: var(--s1); }
.novo-projeto .cab-secao { font: 800 22px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.novo-projeto .abas { margin-bottom: 10px; background: var(--s2); }
.novo-projeto .abas button { display: inline-flex; align-items: center; gap: 6px; }
.novo-projeto .abas svg { width: 15px; height: 15px; }
.novo-projeto .nota { margin: 0 0 12px; color: var(--ink-3); font-size: 13px; }
.candidatos, .ignorados ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.candidato { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--s2); }
.candidato-nome { flex: 1 1 220px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.candidato-categoria { height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: var(--s3); font-size: 12px; }
.candidato .projeto-falha { flex-basis: 100%; }
.ignorados { margin-top: 16px; }
.ignorados h3 { margin: 0 0 8px; color: var(--ink-3); font: 500 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.ignorados li { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }



.projeto { position: relative; }
.projeto-abrir { color: inherit; text-decoration: none; }
.projeto-abrir::after { content: ''; position: absolute; inset: 0; border-radius: var(--raio); }
.projeto-abrir:focus-visible { outline: none; }
.projeto-abrir:focus-visible::after { outline: 2px solid color-mix(in oklab, var(--humor) 80%, white); outline-offset: 2px; }
.projeto-cab .repo, .projeto-pe .btn, .deploy-alvo { position: relative; z-index: 1; }
.projeto:hover h3 { color: var(--magenta-acesa); }
.topo .acoes { display: flex; gap: 8px; flex-wrap: wrap; }



.voltar { margin: -10px 0 14px -10px; }
.repo-link { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
.repo-link:hover { color: var(--ink); }
.repo-link svg { width: 13px; height: 13px; }
.fatos b[data-alerta='true'] { color: var(--vermelho); }

.abas { display: flex; gap: 4px; margin: 0 0 20px; padding: 4px; background: var(--s1); border-radius: 12px; width: fit-content; }
.abas button {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border: 0; border-radius: 9px;
  background: transparent; color: var(--ink-2); font: 500 14px/1 var(--sans);
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.abas button:hover { color: var(--ink); }
.abas button[aria-selected='true'] { background: var(--s3); color: var(--ink); }
.abas .num { font-size: 12px; color: var(--ink-3); }

.filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 14px; }
.segmentado { display: inline-flex; padding: 3px; gap: 2px; background: var(--s1); border-radius: 10px; }
.segmentado button {
  height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2);
  font: 500 13px/1 var(--sans); transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.segmentado button:hover { color: var(--ink); }
.segmentado button[aria-pressed='true'] { background: var(--s3); color: var(--ink); }
.filtro-projeto { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); font: 400 12px/1 var(--mono); letter-spacing: 0.04em; }
.filtro-projeto select { height: 34px; padding: 0 10px; border: 0; border-radius: 9px; background: var(--s2); color: var(--ink); font: 500 13px/1 var(--sans); max-width: 60vw; }

.pessoas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 18px; }
.pessoas .rotulo { color: var(--ink-3); font: 400 12px/1 var(--mono); letter-spacing: 0.04em; margin-right: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border: 0; border-radius: 999px;
  background: var(--s2); color: var(--ink-2); font: 500 13px/1 var(--sans);
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.chip:hover { background: var(--s3); color: var(--ink); }
.chip .num { font-size: 11.5px; color: var(--ink-3); }
.chip[aria-pressed='true'] { background: color-mix(in oklab, var(--magenta) 22%, var(--s2)); color: var(--ink); }
.chip[aria-pressed='true'] .num { color: var(--magenta-acesa); }

.funil-dono { margin: 0 0 8px; color: var(--magenta-acesa); font: 400 12px/1 var(--mono); letter-spacing: 0.04em; }
.funil { display: grid; grid-template-columns: repeat(var(--passos, 9), minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; }
.funil-passo {
  --cor: var(--ink-3);
  display: grid; gap: 8px; align-content: start; min-width: 0; text-align: left;
  padding: 12px 12px 11px; border: 0; border-radius: 12px; background: var(--s1); color: var(--ink);
  transition: background 0.2s var(--ease), opacity 0.2s var(--ease);
}
.funil-passo:hover { background: var(--s2); }
.funil-passo[aria-pressed='true'] { background: color-mix(in oklab, var(--cor) 20%, var(--s2)); }
.funil-passo[data-zero='true']:not([aria-pressed='true']) { opacity: 0.45; }
.funil-n { font: 800 34px/0.9 var(--display); letter-spacing: 0.02em; }
.funil-nome { display: flex; align-items: baseline; gap: 6px; font: 400 11px/1.25 var(--mono); letter-spacing: 0.03em; color: var(--ink-2); overflow-wrap: anywhere; }
.funil-nome::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--cor); }
.funil-resumo { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 0 20px; color: var(--ink-3); font: 400 12px/1.4 var(--mono); }
.funil-resumo button { border: 0; padding: 0; background: none; color: var(--ink-2); font: inherit; text-decoration: underline; text-decoration-color: var(--s4); text-underline-offset: 3px; }
.funil-resumo button:hover { color: var(--magenta-acesa); text-decoration-color: currentColor; }

.funil-numeros { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: -8px 0 20px; color: var(--ink-3); font: 400 12px/1.4 var(--mono); }
.funil-numeros button { border: 0; padding: 2px 6px; border-radius: 6px; background: var(--s2); color: var(--ink); font: inherit; }
.funil-numeros button:hover { color: var(--magenta-acesa); }


.explica { position: relative; display: inline-block; }
.funil > .explica { display: grid; min-width: 0; }
.explica-cartao { position: absolute; top: 100%; left: 0; border-top: 6px solid transparent; background-clip: padding-box; z-index: 30; display: grid; gap: 8px; width: 280px; max-height: 320px; overflow: auto; padding: 12px; border-radius: 12px; background: var(--s3); color: var(--ink); font: 400 13px/1.4 var(--sans); letter-spacing: 0; text-align: left; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8); }
.funil > .explica:nth-last-child(-n+3) .explica-cartao { left: auto; right: 0; }
.explica-regra { color: var(--ink-2); }
.explica-cartao ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.explica-cartao a { color: var(--ink); text-decoration: none; }
.explica-cartao a:hover { color: var(--magenta-acesa); }
.explica-vazio { color: var(--ink-3); }

.explica-campos { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; margin: 0; }
.explica-campos > div { display: contents; }
.explica-campos dt { color: var(--ink-3); }
.explica-campos dd { margin: 0; overflow-wrap: anywhere; }
.explica-cartao.solto { left: var(--x); top: var(--y); }
.linha-corpo > .explica { justify-self: start; min-width: 0; }
.grupo-cab > .explica { min-width: 0; }

[data-fase='triagem'] { --cor: var(--ink-3); }
[data-fase='fila'] { --cor: var(--ink-2); }
[data-fase='bloqueada'] { --cor: var(--vermelho); }
[data-fase='em_andamento'] { --cor: var(--ambar); }
[data-fase='pr_aberto'] { --cor: var(--ciano); }
[data-fase='mergeada'] { --cor: var(--magenta-acesa); }
[data-fase='em_producao'] { --cor: var(--verde); }
[data-fase='humana'] { --cor: var(--magenta); }
[data-fase='encerrada_sem_pr'] { --cor: var(--ink-3); }
[data-fase='em_onda'] { --cor: var(--ciano); }

.funil-passo.em-onda:hover { background: var(--s1); }
.funil-passo.em-onda[data-alerta='true'] { --cor: var(--vermelho); }
.funil-passo.em-onda[data-alerta='true'] .funil-n { color: var(--vermelho); }
.funil-nome svg { width: 12px; height: 12px; color: var(--vermelho); flex: none; }
.selo-onda { background: color-mix(in oklab, var(--ciano) 14%, var(--s2)); color: var(--ciano); }

.selo-demonstracao { display: inline-grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 6px; background: color-mix(in oklab, var(--verde) 14%, var(--s2)); color: var(--verde); }
.selo-demonstracao:hover, .selo-demonstracao:focus-visible { background: color-mix(in oklab, var(--verde) 26%, var(--s2)); }
.selo-demonstracao svg { width: 13px; height: 13px; }

.selo-demanda { flex: none; white-space: nowrap; background: var(--demanda); color: var(--bg); font-weight: 600; }

.selo-nova { flex: none; white-space: nowrap; color: var(--demanda); box-shadow: inset 0 0 0 1px var(--demanda); font-weight: 600; }
.linha[data-nova], .onda-fatia[data-nova], .painel li[data-nova] {
  background: color-mix(in oklab, var(--demanda) 10%, var(--s1)); box-shadow: inset 3px 0 0 var(--demanda);
}

.linhas { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.linha {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start;
  padding: 10px 12px; border-radius: 10px; transition: background 0.2s var(--ease);
}
.linha:hover { background: var(--s1); }

.linha[data-acesa], .grupo-cab[data-acesa] { animation: linha-acesa 2s var(--ease); }
@keyframes linha-acesa { from, 40% { background: color-mix(in oklab, var(--ciano) 22%, var(--s1)); } to { background: transparent; } }

[data-ajuda][data-acesa] { animation: parte-acesa 2s var(--ease); }
@keyframes parte-acesa { from, 40% { background: color-mix(in oklab, var(--ciano) 22%, var(--s1)); } }
.linha-num { color: var(--ink-3); font-size: 12.5px; padding-top: 2px; text-align: right; }
.linha-cab { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.linha-cab .linha-num { padding: 0; text-align: left; flex: none; }
.linha-corpo { display: grid; gap: 5px; min-width: 0; }
.linha-titulo { color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
a.linha-titulo:hover { text-decoration: underline; text-decoration-color: var(--ink-3); }
.linha[data-estado='CLOSED'] .linha-titulo { color: var(--ink-2); }
.linha-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.linha-meta .nota { color: var(--ink-3); font-size: 12px; }
.linha-meta .resp { color: var(--ink); }
.fase { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--mono); color: var(--ink-2); }
.fase::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--cor); }
.selo.alerta { background: color-mix(in oklab, var(--vermelho) 16%, var(--s2)); color: var(--vermelho); }

.ci { --cor: var(--ink-3); display: grid; place-items: center; width: 30px; height: 30px; margin-left: auto; border-radius: 9px; background: color-mix(in oklab, var(--cor) 16%, var(--s1)); color: var(--cor); }
.ci svg { width: 15px; height: 15px; }
[data-ci='verde'] { --cor: var(--verde); }
[data-ci='vermelho'] { --cor: var(--vermelho); }
[data-ci='pendente'] { --cor: var(--ambar); }
[data-ci='sem_ci'] { --cor: var(--ink-3); }
.ci-texto { color: var(--cor); font: 500 12px/1 var(--mono); }
.mais { margin: 14px 0 0 76px; }


.grupos-prd { display: grid; gap: 14px; }
.grupo-cab { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grupo-alternar {
  display: inline-flex; align-items: baseline; gap: 10px; min-width: 0; padding: 6px 10px 6px 4px;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: 700 15.5px/1.3 var(--sans); text-align: left;
}
.grupo-alternar:hover { background: var(--s2); }
.grupo-alternar .sec-seta { align-self: center; flex: none; }
.grupo-alternar[aria-expanded='true'] .sec-seta { transform: rotate(90deg); }
.grupo-alternar .linha-num { padding: 0; text-align: left; flex: none; }
.prd-titulo { overflow-wrap: anywhere; }
.grupo-alternar .conta { font: 500 12.5px/1 var(--mono); color: var(--ink-2); flex: none; }
.grupo-link { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; color: var(--ink-3); flex: none; }
.grupo-link:hover { background: var(--s2); color: var(--ink); }
.grupo-link svg { width: 15px; height: 15px; }
.grupo-prd .linhas { margin-left: 18px; }


.faixa-no-ar {
  --cor: var(--ink-3);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0 0 14px; padding: 8px 14px; border-radius: 10px;
  background: color-mix(in oklab, var(--cor) 9%, var(--s1)); font-size: 12.5px; color: var(--ink-2);
}
.faixa-no-ar[data-saude='verde'] { --cor: var(--verde); }
.faixa-no-ar[data-saude='ambar'] { --cor: var(--ambar); }
.faixa-no-ar[data-saude='vermelho'] { --cor: var(--vermelho); }
.faixa-rotulo { color: var(--ink-3); font: 400 11px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.faixa-versao { font: 700 15px/1 var(--mono); color: var(--ink); }
.faixa-saude { color: var(--cor); font: 500 12px/1.2 var(--mono); }
.faixa-servico { --cor: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.faixa-servico::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--cor); }
.faixa-servico[data-status='healthy'] { --cor: var(--verde); }
.faixa-servico[data-status='warning'] { --cor: var(--ambar); }
.faixa-servico[data-status='down'], .faixa-servico[data-status='unhealthy'] { --cor: var(--vermelho); }
.linha-do-tempo { display: grid; gap: 18px; }
.dia { display: grid; gap: 4px; }
.dia-separador { margin: 0; padding: 0 12px 4px; border-bottom: 1px solid var(--hair); color: var(--ink-3); font: 600 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.entregas-do-dia { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.entrega-linha {
  display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 8px 12px; border-radius: 10px; transition: background 0.2s var(--ease);
}
.entrega-linha:hover { background: var(--s1); }
.entrega-quando { padding-top: 3px; color: var(--ink-3); font: 400 12px/1.3 var(--mono); white-space: nowrap; }
.entrega-linha-corpo { display: grid; gap: 4px; min-width: 0; }
.entrega-linha-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }

button.entrega-linha-cab {
  width: 100%; height: auto; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent;
  font: inherit; font-size: 12.5px; text-align: left; cursor: pointer;
}
button.entrega-linha-cab:hover { background: transparent; }
.entrega-linha[data-aberta='true'] { background: var(--s1); }
.entrega-corpo { display: grid; gap: 12px; padding: 8px 0 4px; }
.entrega-ondas { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0; font-size: 13px; }
.entrega-prd { display: grid; gap: 4px; }
.entrega-prd-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 600 13.5px/1.4 var(--sans); }
.entrega-prd-titulo { color: var(--ink); }
.entrega-prd-barra { position: relative; width: 96px; height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.entrega-prd-barra > span { position: absolute; inset: 0 auto 0 0; background: var(--verde); border-radius: 3px; }
.entrega-prd-conta { color: var(--ink-2); font-weight: 400; font-size: 12.5px; }
.selo-completou { background: color-mix(in oklab, var(--verde) 22%, var(--s3)); color: var(--verde); }
.entrega-issues { margin-left: 18px; }

do que em policies SQL.\n\n## Por que \u00e9 surpreendente\n\nQuem chega a um projeto Supabase espera RLS protegendo as tabelas. Aqui **n\u00e3o h\u00e1 essa rede de seguran\u00e7a**: se um endpoint esquecer de aplicar o filtro de acesso, vaza dados. A disciplina vive no c\u00f3digo, n\u00e3o no banco.\n\n## Consequ\u00eancias\n\n- Cada endpoint que l\u00ea dados de Colaborador/Reuni\u00e3o **precisa** aplicar o filtro de acesso explicitamente \u2014 isto \u00e9 candidato natural a `/security-review`.\n- Policies do Supabase ficam simples (quase tudo liberado para a service role), o que acelera migrations.\n- \u00c9 dif\u00edcil de reverter: adicionar RLS depois exigiria reescrever as garantias de acesso como policies e auditar todos os endpoints.", "cita": [], "decisao": "O backend FastAPI acessa o Postgres sempre com a `SERVICE_ROLE_KEY` (que faz _bypass_ de RLS) e aplica **todo** o controle de acesso na camada de aplica\u00e7\u00e3o \u2014 filtrando por papel, `access_profile` e `is_super_admin` em Python, endpoint a...", "emenda": [], "emendada_por": [], "file": "docs/adr/0002-controle-acesso-aplicacao-service-role.md", "number": 2, "slug": "0002-controle-acesso-aplicacao-service-role", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Controle de acesso na aplica\u00e7\u00e3o (SERVICE_ROLE_KEY), n\u00e3o RLS"}, {"amended_by": "0030", "amends": null, "body_md": "> **Amendado pelo [ADR 0030](0030-pendencia-nasce-por-assinatura-gatilho-incremental.md)**: no caminho com ClickSign, a Pend\u00eancia deixou de nascer s\u00f3 no estado terminal e passou a nascer incrementalmente por assinatura (ou Aceite interno). O caminho sem assinatura (APROVADA) permanece como descrito aqui.\n\nEm reuni\u00f5es operacionais / de acompanhamento, o valor est\u00e1 em **registrar a Ata e disparar as Pend\u00eancias** \u2014 n\u00e3o na formalidade da assinatura. Hoje toda Ata s\u00f3 gera Pend\u00eancias depois que todos os Signat\u00e1rios assinam no ClickSign, o que pode levar dias e obriga o Facilitador a passar pelo Envelope mesmo quando ningu\u00e9m precisa assinar.\n\nA decis\u00e3o: na tela de valida\u00e7\u00e3o (`AGUARDANDO_VALIDACAO`), o Facilitador passa a ter **dois caminhos**. O bot\u00e3o atual vira **\"Enviar para assinatura\"** (fluxo ClickSign inalterado) e ganha um irm\u00e3o, **\"Finalizar sem assinatura\"**, que cria as Pend\u00eancias na hora e leva a Reuni\u00e3o a um novo estado terminal, **`APROVADA`**, sem Envelope e sem aguardar assinaturas.\n\nS\u00f3 muda o **destino da aprova\u00e7\u00e3o**. O Pipeline de IA, a extra\u00e7\u00e3o de a\u00e7\u00f5es e a revis\u00e3o/corre\u00e7\u00e3o da Ata s\u00e3o reusados sem altera\u00e7\u00e3o. O endpoint `POST /reunioes/{id}/aprovar-sem-assinatura` \u00e9 irm\u00e3o direto do `/aprovar`: mesmas guardas (Secret\u00e1ria 403, exige `AGUARDANDO_VALIDACAO` 400, Reuni\u00e3o inexistente 404, qualquer Facilitador pode), mas **s\u00edncrono** \u2014 retorna `total_pendencias` para a UI. Reusa o m\u00f3dulo `liberar_pendencias` (idempotente, independente do ClickSign). Ordem da opera\u00e7\u00e3o: **criar as Pend\u00eancias primeiro, marcar `APROVADA` depois** \u2014 se a cria\u00e7\u00e3o falhar, o status permanece `AGUARDANDO_VALIDACAO` e a a\u00e7\u00e3o \u00e9 re-tent\u00e1vel (a idempot\u00eancia garante que n\u00e3o duplica). A a\u00e7\u00e3o fica registrada em `audit_log` (`APROVACAO_SEM_ASSINATURA`).\n\n## Por que \u00e9 surpreendente\n\nA intui\u00e7\u00e3o do dom\u00ednio era \"Ata existe para ser assinada\" \u2014 o gatilho da Pend\u00eancia morava **dentro** do webhook do ClickSign. Agora a Pend\u00eancia nasce de um estado terminal que pode ser **ASSINADA ou APROVADA**, e h\u00e1 um caminho de produ\u00e7\u00e3o que nunca toca o ClickSign. Quem l\u00ea o c\u00f3digo esperando que toda Pend\u00eancia venha de uma assinatura precisa saber que existe essa segunda origem.\n\n## Alternativas descartadas\n\n- **Reusar o estado `ASSINADA`** (marcar como assinada sem assinatura): perderia a distin\u00e7\u00e3o entre uma Ata com formalidade digital e uma finalizada sem ela \u2014 confunde auditoria, badge e relat\u00f3rios. Por isso `APROVADA` \u00e9 um estado pr\u00f3prio, paralelo.\n- **Caminho revers\u00edvel** (enviar uma Ata `APROVADA` para assinatura depois): adiciona uma transi\u00e7\u00e3o de sa\u00edda de um estado terminal e o risco de duplicar Pend\u00eancias. A escolha \u00e9 definitiva; reabrir \u00e9 trabalho do Super admin via `force-status`, se algum dia for preciso. Fora de escopo.\n- **Regra de \"sem assinatura\" por tipo de Reuni\u00e3o** (ex.: toda reuni\u00e3o Gerencial dispensa assinatura): r\u00edgido demais. A escolha \u00e9 sempre **pontual**, por Ata, decidida pelo Facilitador caso a caso.\n- **Restringir a Super admin**: criaria fric\u00e7\u00e3o e depend\u00eancia de privil\u00e9gio. Qualquer Facilitador pode finalizar sem assinatura \u2014 espelha exatamente a permiss\u00e3o do `/aprovar`.\n\n## Consequ\u00eancias\n\n- O gatilho da Pend\u00eancia passa a ter **duas origens** (`ASSINADA` e `APROVADA`); qualquer c\u00f3digo que assuma \"Pend\u00eancia \u21d2 assinatura\" precisa ser revisto.\n- `APROVADA` entra no enum `StatusAta` (backend), no CHECK de `status_ata` (migration 040) e no tipo `StatusAta` do frontend (duplicado em dois locais \u2014 n\u00e3o consolidado nesta fatia).\n- A tela terminal de `APROVADA` tem badge pr\u00f3prio em verde clarinho (`green`, distinto do verde forte `emerald` da \"Assinada Digitalmente\"), resumo de Pend\u00eancias com link para o painel e o PDF preliminar como documento de refer\u00eancia; **sem** card de Signat\u00e1rios (n\u00e3o h\u00e1 Envelope). No **calend\u00e1rio**, a `APROVADA` passa a usar esse mesmo verde clarinho (antes ca\u00eda no cinza neutro do `default`): a fam\u00edlia verde significa \"estado terminal conclu\u00eddo\", e a intensidade distingue a formalidade (forte = assinada no ClickSign, clarinho = finalizada sem assinatura). Vale para os dois caminhos que chegam a `APROVADA`: a Ata Guiada e a Ata por Transcri\u00e7\u00e3o finalizada sem assinatura.\n- **Paridade mantida**: n\u00e3o h\u00e1 notifica\u00e7\u00e3o por e-mail ao respons\u00e1vel quando a Pend\u00eancia nasce \u2014 isso n\u00e3o existe em nenhum caminho hoje (o e-mail do ClickSign \u00e9 sobre *assinar*, n\u00e3o sobre a Pend\u00eancia). Melhoria futura, igual para ambos os caminhos.", "cita": [], "decisao": "Em reuni\u00f5es operacionais / de acompanhamento, o valor est\u00e1 em **registrar a Ata e disparar as Pend\u00eancias** \u2014 n\u00e3o na formalidade da assinatura. Hoje toda Ata s\u00f3 gera Pend\u00eancias depois que todos os Signat\u00e1rios assinam no ClickSign, o que...", "emenda": [], "emendada_por": [30], "file": "docs/adr/0003-estado-terminal-aprovada-sem-assinatura.md", "number": 3, "slug": "0003-estado-terminal-aprovada-sem-assinatura", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Estado terminal APROVADA: aprova\u00e7\u00e3o sem assinatura digital"}, {"amended_by": null, "amends": null, "body_md": "A diretoria precisa registrar **conversas, feedback e eventos** informais \u2014 \"o que foi tratado\" \u2014 sem a cerim\u00f4nia Reuni\u00e3o \u2192 Transcri\u00e7\u00e3o \u2192 Ata \u2192 ClickSign. Hoje o \u00fanico jeito de gerar uma Pend\u00eancia \u00e9 por uma Reuni\u00e3o que passa pelo Pipeline de IA e chega a estado terminal (ASSINADA/APROVADA, ADR 0003). N\u00e3o existe registro leve nem Pend\u00eancia avulsa, e o gloss\u00e1rio j\u00e1 separa \"evento\" de \"Reuni\u00e3o\".\n\nA decis\u00e3o: criar a **Nota**, entidade nova e leve, **paralela** \u00e0 Reuni\u00e3o (n\u00e3o uma variante). Uma Nota \u00e9 um **corpo de texto livre** redigido pelo Facilitador \u2014 por teclado ou por **voz** (transcri\u00e7\u00e3o via endpoint `/audio/transcriptions` do OpenRouter, modelo `gpt-4o-mini-transcribe`; o texto cai edit\u00e1vel no campo e o \u00e1udio \u00e9 descartado ap\u00f3s transcrever) \u2014 com um **roster opcional de Participantes** (Colaborador do cadastro **ou** nome avulso, para externos n\u00e3o cadastrados como \"o fulano aliado\"). A partir do corpo, a **IA prop\u00f5e** Pend\u00eancias \u2014 respons\u00e1vel casado contra o roster, prazo parseado de linguagem natural (\"sexta\") \u2014 que o Facilitador **confirma/edita/descarta** antes de criar; o add manual fica sempre dispon\u00edvel. Reusa `_find_participante`, `_normalizar_prazo` e o passo de estrutura\u00e7\u00e3o JSON do Pipeline.\n\nAs Pend\u00eancias da Nota caem na **mesma tabela `pendencias`** e no mesmo acompanhamento (painel, cron `alerta_prazo`, Repactua\u00e7\u00e3o, coment\u00e1rios, emails). Para isso, `pendencias` ganha um FK nul\u00e1vel **`id_nota`** ao lado do `id_reuniao` (tamb\u00e9m nul\u00e1vel), com um **CHECK** garantindo exatamente uma origem preenchida. O acesso **espelha o modelo atual**: o autor v\u00ea as suas Notas, Secret\u00e1ria e Super admin veem todas. A Nota \u00e9 **edit\u00e1vel** pelo autor e usa **soft-delete** (`deleted_at`); as Pend\u00eancias geradas s\u00e3o **independentes** \u2014 sobrevivem ao arquivamento ou \u00e0 edi\u00e7\u00e3o da Nota.\n\n## Por que \u00e9 surpreendente\n\nA intui\u00e7\u00e3o do dom\u00ednio \u00e9 \"a\u00e7\u00e3o nasce de uma Reuni\u00e3o assinada/aprovada\" \u2014 o ADR 0003 j\u00e1 abriu uma segunda origem terminal. A Nota abre uma **terceira porta**: uma Pend\u00eancia com `id_reuniao` **nulo** e `id_nota` preenchido, vinda de um artefato que **nunca toca** Transcri\u00e7\u00e3o, Ata nem ClickSign. Quem l\u00ea o c\u00f3digo esperando `pendencia.id_reuniao` sempre presente vai quebrar.\n\n## Alternativas descartadas\n\n- **Dobrar a Reuni\u00e3o** (modo r\u00e1pido que pula transcri\u00e7\u00e3o+IA e nasce APROVADA): reusaria `liberar_pendencias`, mas obrigaria a mexer no `StatusAta` (enum backend + CHECK no banco + 2 lugares no frontend) e carregaria 25+ colunas sem sentido para um bilhete. O gloss\u00e1rio j\u00e1 separa \"evento\" de \"Reuni\u00e3o\"; for\u00e7ar a fus\u00e3o polui o conceito central.\n- **S\u00f3 Pend\u00eancia avulsa** (sem container de registro): joga fora o pedido central \u2014 o hist\u00f3rico narrativo. Sobra a tarefa, perde-se o \"log do que foi tratado\".\n- **Par gen\u00e9rico `origem_tipo`/`origem_id`** em vez de FKs reais: aceitaria origens futuras sem migration, mas perde integridade referencial e o ON DELETE CASCADE viraria l\u00f3gica manual no app. Com s\u00f3 duas origens (Reuni\u00e3o e Nota), dois FKs nul\u00e1veis + CHECK \u00e9 mais seguro.\n- **IA cria a Pend\u00eancia direto** (sem confirma\u00e7\u00e3o): dispararia cobran\u00e7a real a partir de tarefa possivelmente alucinada. O passo de confirma\u00e7\u00e3o \u00e9 a guarda.\n- **Voz que transcreve E extrai numa tacada** (LLM multimodal de \u00e1udio): mais \"m\u00e1gico\", mas acopla os dois eixos (input e extra\u00e7\u00e3o) e tira a revis\u00e3o do texto cru. Fica como evolu\u00e7\u00e3o.\n- **Visibilidade global ou compartilh\u00e1vel caso a caso**: \"dar publicidade\" foi lido como \"ficar de record\", n\u00e3o \"broadcast\"; espelhar o acesso atual protege o feedback sens\u00edvel sem conceito novo. Compartilhar entre Facilitadores fica como aditivo futuro.\n\n## Consequ\u00eancias\n\n- `pendencias` passa a ter **tr\u00eas origens** l\u00f3gicas (Reuni\u00e3o ASSINADA, Reuni\u00e3o APROVADA, Nota). Qualquer c\u00f3digo que assuma `id_reuniao` preenchido \u2014 ex.: o link \"ver reuni\u00e3o de origem\" no painel \u2014 precisa tratar o caso `id_nota`.\n- Novas tabelas `notas` e `nota_participantes` (espelha `reuniao_participantes`, mas aceita nome avulso para externos). Migration nova: `id_nota` + CHECK em `pendencias`.\n- Nova depend\u00eancia de produ\u00e7\u00e3o no endpoint de transcri\u00e7\u00e3o do OpenRouter (mesma chave e billing do Pipeline). Custo desprez\u00edvel no volume esperado (fra\u00e7\u00e3o de centavo por Nota).\n- Gloss\u00e1rio atualizado: **Participante** generalizado (Reuni\u00e3o **ou** Nota), verbete de **Pend\u00eancia** passou a citar as origens, novo verbete **Nota**.\n- Trade-off consciente: **sem campo de \"data do evento\"** \u2014 o hist\u00f3rico ordena por data de cria\u00e7\u00e3o. Se virar necessidade, \u00e9 aditivo.", "cita": [3], "decisao": "A diretoria precisa registrar **conversas, feedback e eventos** informais \u2014 \"o que foi tratado\" \u2014 sem a cerim\u00f4nia Reuni\u00e3o \u2192 Transcri\u00e7\u00e3o \u2192 Ata \u2192 ClickSign. Hoje o \u00fanico jeito de gerar uma Pend\u00eancia \u00e9 por uma Reuni\u00e3o que passa pelo Pipeline...", "emenda": [], "emendada_por": [], "file": "docs/adr/0004-nota-registro-dinamico-paralelo-reuniao.md", "number": 4, "slug": "0004-nota-registro-dinamico-paralelo-reuniao", "status": "superseded", "substitui": [], "substituida_por": [11], "superseded_by": "0011", "supersedes": null, "title": "Nota: registro din\u00e2mico paralelo \u00e0 Reuni\u00e3o"}, {"amended_by": null, "amends": null, "body_md": "> **Revisada parcialmente pela [ADR 0006](0006-ata-guiada-tela-dedicada-documento-apoio.md).** Tr\u00eas pontos abaixo foram revisitados: o **chat inline** virou **tela dedicada** (ata viva); a **edi\u00e7\u00e3o** da Ata Guiada (descrita aqui como \"re-entrada no agente + `PATCH quadro-atribuicoes`\") ganhou a forma concreta de **corre\u00e7\u00e3o por apontar se\u00e7\u00e3o, pelo pr\u00f3prio chat da Guiada**; e a **aus\u00eancia de PDF** foi reafirmada como decis\u00e3o. O n\u00facleo desta ADR \u2014 Ata como segundo modo de gera\u00e7\u00e3o, `json_ata` enxuto, caminho sem assinatura \u2014 continua v\u00e1lido.\n\nA diretoria precisa registrar **reuni\u00f5es operacionais que n\u00e3o t\u00eam Transcri\u00e7\u00e3o** \u2014 bate-papos r\u00e1pidos, 1-a-1 \u2014 gerando Pend\u00eancias, mas com o documento **vinculado \u00e0 Reuni\u00e3o** (1-a-1), n\u00e3o avulso. A **Nota** (ADR 0004) \u00e9 deliberadamente **paralela/avulsa** e n\u00e3o preenche esse slot.\n\nA decis\u00e3o: a **Ata** passa a ter **dois modos de gera\u00e7\u00e3o**. Al\u00e9m do modo **por Transcri\u00e7\u00e3o** (Pipeline de IA \u2192 Ata completa \u2192 PDF \u2192 assinatura/aprova\u00e7\u00e3o), criamos a **Ata Guiada**: o Facilitador conversa com um **agente** (por texto ou voz, reusando a transcri\u00e7\u00e3o de voz da Nota) que organiza o relato num documento **enxuto** \u2014 `resumo_executivo` + `quadro_atribuicoes` \u2014 direto no slot `reunioes.json_ata`, perguntando as lacunas (sobretudo respons\u00e1vel e prazo de cada a\u00e7\u00e3o). A Reuni\u00e3o vai de `PROGRAMADA` **direto** para `AGUARDANDO_VALIDACAO` (pulando `PROCESSANDO`/Pipeline); o Facilitador valida e **finaliza sem assinatura** (`APROVADA`, ADR 0003), liberando as Pend\u00eancias pelo `liberar_pendencias` existente. Sem Envelope, sem PDF (por ora). Um novo campo **`metodo_geracao`** (`TRANSCRICAO` | `GUIADA`) em `reunioes` distingue os modos.\n\n## Por que \u00e9 surpreendente\n\nO **ADR 0004 descartou** \"dobrar a Reuni\u00e3o\" (modo r\u00e1pido sem transcri\u00e7\u00e3o) e criou a Nota no lugar. A Ata Guiada **revisita essa alternativa** \u2014 mas para um requisito diferente: registro **vinculado** \u00e0 Reuni\u00e3o, n\u00e3o avulso. E a defini\u00e7\u00e3o de **Ata** deixa de ser \"o documento gerado a partir da Transcri\u00e7\u00e3o\": agora **uma Ata pode existir sem Transcri\u00e7\u00e3o**. Quem ler o c\u00f3digo esperando que toda Ata tenha `url_transcricao`/PDF, ou que `json_ata` sempre traga as 6 se\u00e7\u00f5es, vai se surpreender \u2014 a Ata Guiada tem `json_ata` **parcial** (s\u00f3 `resumo_executivo` + `quadro_atribuicoes`) e sem m\u00eddia.\n\n## Alternativas descartadas e rela\u00e7\u00e3o com o ADR 0004\n\n- **Estender a Nota com `id_reuniao`**: quebraria o design da Nota (paralela por defini\u00e7\u00e3o, ADR 0004) e daria estrutura a algo que \u00e9 texto livre. A Nota continua avulsa; a Ata Guiada vive no slot da Reuni\u00e3o.\n- **As obje\u00e7\u00f5es do 0004 a \"dobrar a Reuni\u00e3o\", reavaliadas**: (a) *\"obrigaria a mexer no StatusAta\"* \u2014 desnecess\u00e1rio: a Ata Guiada reusa `PROGRAMADA \u2192 AGUARDANDO_VALIDACAO \u2192 APROVADA`, sem novo estado; (b) *\"carregaria 25+ colunas sem sentido para um bilhete\"* \u2014 n\u00e3o se aplica: \u00e9 uma **Reuni\u00e3o real**, com t\u00edtulo, data, Facilitador e Participantes leg\u00edtimos. O que tornava a fus\u00e3o poluente no 0004 (um registro **avulso** for\u00e7ado a virar Reuni\u00e3o) n\u00e3o existe aqui \u2014 o registro **\u00e9** de uma Reuni\u00e3o.\n- **Reusar o chat de corre\u00e7\u00e3o (`/corrigir`) para editar a Ata Guiada**: ele baixa a Transcri\u00e7\u00e3o do storage e regenera PDF \u2014 ambos inexistentes numa Ata Guiada. A edi\u00e7\u00e3o da Ata Guiada usa a re-entrada no agente e o `PATCH quadro-atribuicoes` (j\u00e1 existente).\n- **Sobrecarregar o campo `fonte`** (FIREFLIES/MOCK/IMPORTACAO_LEGADA) com um valor `GUIADA`: descartado. `fonte` responde \"de onde veio o conte\u00fado bruto\" \u2014 eixo ortogonal a \"como a Ata foi gerada\" \u2014 e \u00e9 um enum **tipado na resposta da API**; um valor novo ali quebraria a serializa\u00e7\u00e3o da lista de Reuni\u00f5es. Por isso o campo novo e separado `metodo_geracao`.\n- **Gerar PDF lite agora**: adiado. O valor est\u00e1 no `json_ata` + Pend\u00eancias; gerar PDF exigiria um template novo. Fica como aditivo se o cliente pedir documento imprim\u00edvel.\n\n## Consequ\u00eancias\n\n- `json_ata` passa a ter **dois shapes**: completo (Transcri\u00e7\u00e3o) e enxuto (Guiada). A renderiza\u00e7\u00e3o da tela de detalhe j\u00e1 \u00e9 defensiva (se\u00e7\u00f5es ausentes somem); c\u00f3digo que assuma `participantes`/`discussao`/`url_pdf_preliminar` presentes precisa tolerar aus\u00eancia.\n- Nova coluna `metodo_geracao` em `reunioes` (default `TRANSCRICAO`, para n\u00e3o afetar as Reuni\u00f5es existentes).\n- O agente da Ata Guiada \u00e9 um **chat** \u2014 espelha o `chat_correcao` (s\u00edncrono, OpenRouter-only, hist\u00f3rico mantido no frontend) \u2014 **n\u00e3o** \u00e9 o Pipeline de IA.\n- A Ata Guiada **nunca toca a ClickSign**; segue s\u00f3 o caminho terminal APROVADA (ADR 0003).\n- O gloss\u00e1rio (`CONTEXT.md`) foi atualizado: verbete **Ata** agora descreve os dois modos e h\u00e1 o novo verbete **Ata Guiada**.", "cita": [3, 4, 6], "decisao": "A diretoria precisa registrar **reuni\u00f5es operacionais que n\u00e3o t\u00eam Transcri\u00e7\u00e3o** \u2014 bate-papos r\u00e1pidos, 1-a-1 \u2014 gerando Pend\u00eancias, mas com o documento **vinculado \u00e0 Reuni\u00e3o** (1-a-1), n\u00e3o avulso. A **Nota** (ADR 0004) \u00e9 deliberadamente...", "emenda": [], "emendada_por": [], "file": "docs/adr/0005-ata-guiada-segundo-modo-de-geracao.md", "number": 5, "slug": "0005-ata-guiada-segundo-modo-de-geracao", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Ata Guiada: segundo modo de gerar a Ata, sem Transcri\u00e7\u00e3o"}, {"amended_by": null, "amends": null, "body_md": "A Ata Guiada nasceu (ADR 0005) como um **chat inline** espremido (~600px) dentro do card da Reuni\u00e3o, com um mini-preview do rascunho embaixo. Na pr\u00e1tica o Facilitador n\u00e3o enxerga a Ata tomando forma enquanto monta, n\u00e3o corrige uma se\u00e7\u00e3o espec\u00edfica sem reescrever o relato, e a sensa\u00e7\u00e3o \u00e9 apertada \u2014 bem diferente do peso visual do fluxo por Transcri\u00e7\u00e3o. Faltava tamb\u00e9m um jeito de apoiar o relato num documento que o Facilitador j\u00e1 tem em m\u00e3os (anota\u00e7\u00f5es, slides, um rascunho).\n\nA decis\u00e3o: a Ata Guiada ganha uma **tela dedicada** (rota pr\u00f3pria, a partir de uma Reuni\u00e3o `PROGRAMADA`) no formato **ata viva** \u2014 `Resumo Executivo` em cima e `Quadro de Atribui\u00e7\u00f5es` (tabela) embaixo, com o **mesmo visual da Ata final** \u2014 e um **chat lateral** (por texto ou voz) que monta e corrige. O bot\u00e3o \"Iniciar Ata Guiada\" deixa de abrir o chat inline e passa a **navegar** para essa tela. Tudo que segue a conclus\u00e3o permanece como na 0005: **Concluir \u2192 `AGUARDANDO_VALIDACAO` \u2192 Finalizar sem assinatura \u2192 Pend\u00eancias**, sem ClickSign e sem PDF.\n\nTr\u00eas decis\u00f5es estruturais sustentam a tela:\n\n- **`AtaEnxutaView` \u2014 m\u00f3dulo profundo.** O resumo + o quadro deixam de ser JSX inline no detalhe da Reuni\u00e3o (um arquivo de ~2200 linhas) e viram um componente apresentacional \u00fanico, com interface simples e est\u00e1vel (dados entram, eventos de \"apontar se\u00e7\u00e3o\" saem) e implementa\u00e7\u00e3o que conhece o visual da Ata. \u00c9 **reusado nas duas telas** \u2014 o detalhe e a tela dedicada renderizam o mesmo resumo + quadro pelo mesmo componente. Dedupe + testabilidade.\n- **Corre\u00e7\u00e3o por apontar se\u00e7\u00e3o opera sobre o rascunho, pelo pr\u00f3prio chat da Guiada.** Cada se\u00e7\u00e3o tem o \u00edcone-alvo (\u2316): apontar \u2192 corrigir pela conversa, no **mesmo padr\u00e3o de UX** da corre\u00e7\u00e3o de transcri\u00e7\u00e3o (chip \"Apontando: \u2026\" + marca\u00e7\u00e3o `[Se\u00e7\u00e3o: \u2026]` na mensagem). Mas o mecanismo \u00e9 outro \u2014 opera sobre o **rascunho em mem\u00f3ria** via o chat da Guiada, **n\u00e3o** pelo endpoint `/corrigir`.\n- **Documento de apoio \u2014 contexto ef\u00eamero sob demanda.** Opcionalmente o Facilitador anexa um arquivo (`.txt/.md/.pdf/.docx`) que entra como **contexto silencioso**: o agente s\u00f3 o consulta quando o Facilitador pede (\"tira as a\u00e7\u00f5es do anexo\", \"resume o que est\u00e1 no documento\"), **nunca** auto-extrai a ata a partir dele. \u00c9 ef\u00eamero \u2014 vive s\u00f3 durante a montagem e **n\u00e3o persiste** na Reuni\u00e3o.\n\n## Por que \u00e9 surpreendente\n\nQuem leu a **ADR 0005** carrega tr\u00eas expectativas que esta decis\u00e3o revisa:\n\n- **\"A edi\u00e7\u00e3o da Ata Guiada usa a re-entrada no agente e o `PATCH quadro-atribuicoes`.\"** A 0005 escreveu isso ao descartar o reuso do `/corrigir`. Aqui a corre\u00e7\u00e3o dirigida ganha forma concreta e diferente: o Facilitador **aponta uma se\u00e7\u00e3o** e corrige **pela conversa do pr\u00f3prio chat da Guiada** (marca\u00e7\u00e3o `[Se\u00e7\u00e3o: \u2026]`), sobre o rascunho em mem\u00f3ria \u2014 n\u00e3o por um PATCH de campo nem pelo `/corrigir`. O `/corrigir` continua descartado pelo mesmo motivo da 0005 (baixa a Transcri\u00e7\u00e3o e regenera PDF, ambos inexistentes na Guiada).\n- **\"A Ata Guiada \u00e9 um chat inline no card da Reuni\u00e3o.\"** Era assim na 0005; agora \u00e9 uma **tela dedicada**. O chat inline **sai** do detalhe.\n- **\"Sem PDF, por ora.\"** Mantido \u2014 e reafirmado aqui como decis\u00e3o, n\u00e3o acaso. O valor da Ata Guiada est\u00e1 no `json_ata` enxuto + Pend\u00eancias; gerar PDF segue adiado.\n\nE h\u00e1 a surpresa nova do **documento de apoio**: \u00e9 natural supor que anexar um documento serve para *gerar* a ata a partir dele (como a Transcri\u00e7\u00e3o gera a Ata por Pipeline). **N\u00e3o.** O documento de apoio \u00e9 **contexto, n\u00e3o fonte** \u2014 o agente n\u00e3o despeja seu conte\u00fado na ata sozinho. Quem esperar um \"auto-rascunho a partir do anexo\" vai se surpreender: foi deliberadamente descartado (ver abaixo).\n\n## Alternativas descartadas\n\n- **Auto-rascunho a partir do documento (mini-pipeline).** Anexar o documento e deixar o agente extrair a ata dele automaticamente. Descartado no grilling: tira o Facilitador do comando do que entra na ata e reintroduz, pela porta dos fundos, o peso de um pipeline que a Ata Guiada existe justamente para evitar. O documento \u00e9 **consultado sob demanda**, n\u00e3o processado.\n- **Reusar o endpoint `/corrigir` para a corre\u00e7\u00e3o por se\u00e7\u00e3o.** Mesmo motivo da 0005: ele baixa a Transcri\u00e7\u00e3o do storage e regenera o PDF \u2014 nenhum dos dois existe numa Ata Guiada. A corre\u00e7\u00e3o por se\u00e7\u00e3o reusa o **padr\u00e3o de UX** do `/corrigir`, n\u00e3o o endpoint.\n- **Persistir o documento de apoio na Reuni\u00e3o.** Descartado: \u00e9 insumo de montagem, n\u00e3o conte\u00fado da Ata. Persisti-lo daria peso (storage, ciclo de vida, permiss\u00f5es) a algo ef\u00eamero. O frontend guarda o texto extra\u00eddo em mem\u00f3ria e o reenvia a cada turno do chat (que segue stateless, como na 0005).\n- **Gerar PDF lite agora.** Adiado de novo, como na 0005. Aditivo se o cliente pedir documento imprim\u00edvel.\n\n## Consequ\u00eancias\n\n- **Nova rota** para a Ata Guiada, a partir de uma Reuni\u00e3o `PROGRAMADA`. O detalhe da Reuni\u00e3o perde o chat inline; o bot\u00e3o \"Iniciar Ata Guiada\" navega para a tela.\n- **`AtaEnxutaView`** passa a ser o \u00fanico lugar que sabe desenhar resumo + quadro enxutos \u2014 usado no detalhe e na tela dedicada. Mudan\u00e7as visuais nesse par acontecem num lugar s\u00f3.\n- O **chat lateral** evolui o componente atual: texto + voz (reusa o hook de grava\u00e7\u00e3o das Notas), aceita a \"se\u00e7\u00e3o apontada\" e o texto do documento de apoio, e os repassa ao endpoint de chat (`rascunho + messages + documento_apoio + section_context`).\n- **Backend \u2014 extra\u00e7\u00e3o do documento de apoio:** novo endpoint que recebe o arquivo e devolve o texto normalizado, **reusando o `transcricao_extractor`** (mesma normaliza\u00e7\u00e3o do anexar-transcri\u00e7\u00e3o). Dispon\u00edvel s\u00f3 em Reuni\u00e3o `PROGRAMADA` e bloqueado para Secret\u00e1ria (403), como os demais endpoints da Guiada.\n- **Backend \u2014 contrato do chat estendido:** `AtaGuiadaChatRequest` ganha `documento_apoio` (texto, opcional) e `section_context` (string, opcional), ambos repassados ao prompt. O chat segue **stateless**.\n- **Prompt** `chat_ata_guiada_system`/`_user`: (1) recebe o bloco do documento de apoio + a regra de us\u00e1-lo **s\u00f3 quando referenciado** (nunca despejar na ata sozinho); (2) entende `[Se\u00e7\u00e3o: \u2026]` para a corre\u00e7\u00e3o dirigida; (3) **menos tagarela** \u2014 como o rascunho agora est\u00e1 vis\u00edvel ao vivo, confirma e pergunta s\u00f3 as lacunas cr\u00edticas (respons\u00e1vel/prazo), em vez de interrogar item a item.\n- **Mantidos intactos:** a m\u00e1quina de estados (`PROGRAMADA \u2192 AGUARDANDO_VALIDACAO \u2192 APROVADA` via finalizar sem assinatura), `liberar_pendencias`, `metodo_geracao=GUIADA`, a aus\u00eancia de ClickSign e de PDF, e a Secret\u00e1ria sem acesso. O rascunho continua **ef\u00eamero at\u00e9 \"Concluir\"** (estado no frontend, sem autosave).\n- O gloss\u00e1rio (`CONTEXT.md`) foi atualizado: o verbete **Ata Guiada** descreve a tela dedicada e h\u00e1 o novo verbete **Documento de apoio**.\n\n> Esta ADR **revisa parcialmente a ADR 0005** nos pontos: chat inline (\u2192 tela dedicada), edi\u00e7\u00e3o da Ata Guiada (\u2192 corre\u00e7\u00e3o por se\u00e7\u00e3o pelo pr\u00f3prio chat, n\u00e3o PATCH/`/corrigir`) e aus\u00eancia de PDF (reafirmada). O restante da 0005 \u2014 a Ata Guiada como segundo modo de gera\u00e7\u00e3o, o shape enxuto do `json_ata`, o caminho sem assinatura \u2014 continua valendo.\n\n## Evolu\u00e7\u00e3o \u2014 finaliza\u00e7\u00e3o num clique no fluxo guiado (#66)\n\n> Nota posterior (2026-06-11), aditiva a esta decis\u00e3o.\n\nEsta ADR descreveu a conclus\u00e3o como **\"Concluir \u2192 `AGUARDANDO_VALIDACAO` \u2192 Finalizar sem assinatura \u2192 Pend\u00eancias\"** \u2014 dois cliques humanos em duas telas: na tela da Ata Guiada, \"Concluir e enviar para valida\u00e7\u00e3o\" (\u2192 `AGUARDANDO_VALIDACAO`, caindo no detalhe da Reuni\u00e3o) e, s\u00f3 l\u00e1, \"Finalizar sem assinatura\" (\u2192 `APROVADA`). Como na Ata Guiada o Facilitador **j\u00e1 revisa a ata ao vivo** no chat lateral, o passo de valida\u00e7\u00e3o manual intermedi\u00e1rio \u00e9 redundante. O bot\u00e3o da tela dedicada passa a **concluir e gerar as Pend\u00eancias num \u00fanico clique** (\"Concluir e gerar pend\u00eancias\"), levando o Facilitador **direto ao calend\u00e1rio**, onde a Reuni\u00e3o j\u00e1 aparece conclu\u00edda.\n\n**O que n\u00e3o muda:** a m\u00e1quina de estados segue `PROGRAMADA \u2192 AGUARDANDO_VALIDACAO \u2192 APROVADA` \u2014 **sem novo estado e sem novo endpoint**. O bot\u00e3o apenas **encadeia** os dois endpoints j\u00e1 existentes e **idempotentes** (`ata-guiada/concluir` + `aprovar-sem-assinatura` \u2192 `liberar_pendencias`); o que desaparece \u00e9 s\u00f3 o clique humano intermedi\u00e1rio, e s\u00f3 no fluxo guiado. A finaliza\u00e7\u00e3o manual no detalhe da Reuni\u00e3o (fluxo por Transcri\u00e7\u00e3o e fallback da Guiada) segue intacta.\n\n**Falha parcial:** se a gera\u00e7\u00e3o de pend\u00eancias falhar, a Reuni\u00e3o permanece em `AGUARDANDO_VALIDACAO` e a a\u00e7\u00e3o \u00e9 **re-tent\u00e1vel sem duplicar** (a idempot\u00eancia do `liberar_pendencias` garante) \u2014 o segundo clique pula o `concluir` (que exigiria `PROGRAMADA`) e re-tenta s\u00f3 o `aprovar-sem-assinatura`. Recarregar a tela cai no fallback de sempre: o detalhe da Reuni\u00e3o, com a finaliza\u00e7\u00e3o manual.", "cita": [5], "decisao": "A Ata Guiada nasceu (ADR 0005) como um **chat inline** espremido (~600px) dentro do card da Reuni\u00e3o, com um mini-preview do rascunho embaixo. Na pr\u00e1tica o Facilitador n\u00e3o enxerga a Ata tomando forma enquanto monta, n\u00e3o corrige uma se\u00e7\u00e3o...", "emenda": [], "emendada_por": [], "file": "docs/adr/0006-ata-guiada-tela-dedicada-documento-apoio.md", "number": 6, "slug": "0006-ata-guiada-tela-dedicada-documento-apoio", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Ata Guiada em tela dedicada: ata viva, corre\u00e7\u00e3o pelo pr\u00f3prio chat e documento de apoio"}, {"amended_by": null, "amends": null, "body_md": "A Diretoria do HSM entregou um DRF pedindo um \"Sistema de Gest\u00e3o de POPs\" \u2014 ciclo de vida de Procedimentos Operacionais Padr\u00e3o (elabora\u00e7\u00e3o com IA \u2192 revis\u00e3o \u2192 valida\u00e7\u00e3o \u2192 assinatura ClickSign \u2192 Biblioteca \u2192 treinamentos), com 4 perfis novos que **logam** (Superadmin/Diretoria, Gestor de Qualidade, Gerente, Coordenador). O dom\u00ednio n\u00e3o se mistura com o de Reuni\u00f5es \u2014 s\u00f3 \"Colaborador\" coincide (e por sorte com o mesmo significado: quem n\u00e3o loga).\n\nA decis\u00e3o tem tr\u00eas partes:\n\n1. **Mesmo app f\u00edsico, contexto de dom\u00ednio separado.** O POPs vive no mesmo repo, backend FastAPI, frontend Next.js e deploy Coolify do Hospital Reuni\u00f5es \u2014 rotas e m\u00f3dulos com namespace pr\u00f3prio (`pops`). A separa\u00e7\u00e3o \u00e9 de **dom\u00ednio e permiss\u00e3o**, n\u00e3o de infraestrutura: nasce o `CONTEXT-MAP.md` na raiz e o gloss\u00e1rio pr\u00f3prio em `docs/pops/CONTEXT.md`; termos hom\u00f4nimos entre contextos (ex.: \"Superadmin\") n\u00e3o significam a mesma coisa.\n2. **Pessoa \u00fanica, eixo de permiss\u00e3o novo.** N\u00e3o h\u00e1 tabela nova de gente: `participantes` segue sendo a entidade pessoa dos dois contextos. O acesso ao POPs vem de um eixo ortogonal `perfil_pop` (`superadmin | gestor_qualidade | gerente | coordenador | null`), independente do `access_profile` das Reuni\u00f5es. Ganhar perfil POP implica ganhar login (Supabase Auth). Uma pessoa pode ter papel num contexto, no outro, em ambos ou em nenhum.\n3. **Setor vira entidade.** Tabela pr\u00f3pria com nome e sigla (base do c\u00f3digo travado `HSM_[SIGLA]-[NNN]`, sequ\u00eancia por Setor), com v\u00ednculo N:N pessoa\u2194Setor (Gerente: v\u00e1rios; Coordenador: normalmente um, sem trava artificial). N\u00e3o confundir com o campo livre `setor` que j\u00e1 existe em `participantes`.\n\n## Por que \u00e9 surpreendente\n\n- O DRF pede um \"**Sistema**\" \u2014 quem o l\u00ea espera repo/app/deploy separados. A escolha foi m\u00f3dulo no app existente: a mesma diretoria usa os dois contextos, e a infraestrutura que o DRF exige **j\u00e1 existe aqui** (ClickSign com Envelope+webhook, email Resend+SMTP, PDF WeasyPrint, cron APScheduler, Supabase Storage, admin de usu\u00e1rios, chat-agente iterativo da Ata Guiada, extra\u00e7\u00e3o de .pdf/.docx, voz).\n- O cadastro atual **j\u00e1 tinha** `UserRole.GERENTE` e `UserRole.COORDENADOR` (cargo informativo) e um campo `setor` string \u2014 mas nada disso \u00e9 o RBAC do POPs. O eixo novo \u00e9 deliberadamente separado em vez de estender o `access_profile`: estender misturaria contextos (Secret\u00e1ria das Reuni\u00f5es viraria \"irm\u00e3\" de Coordenador de POPs no mesmo enum) e impediria a mesma pessoa de ter pap\u00e9is distintos nos dois contextos.\n- \"Superadmin (POPs)\" \u2260 `super_admin` das Reuni\u00f5es (bypass de debug). Hom\u00f4nimos em colunas diferentes \u2014 o CONTEXT-MAP documenta a homon\u00edmia para ningu\u00e9m fundir.\n\n## Alternativas descartadas\n\n- **App irm\u00e3o com infra compartilhada** (repo/deploy separados, mesmo Supabase/ClickSign): contextos fisicamente isolados, mas 2 backends + 2 frontends + servi\u00e7os duplicados ou lib comum extra\u00edda \u2014 caro demais para um dev solo, sem ganho de dom\u00ednio (o CONTEXT-MAP j\u00e1 d\u00e1 a separa\u00e7\u00e3o que importa).\n- **App separado com stack pr\u00f3pria**: zero risco de vazamento entre contextos, mas duplica toda a infraestrutura pronta e dobra a opera\u00e7\u00e3o que o ADR 0001 j\u00e1 coloca sob nossa responsabilidade (backup, upgrade, monitoramento).\n- **Estender o `access_profile` existente**: menos colunas, acoplamento m\u00e1ximo \u2014 ver acima.\n- **Tabela de usu\u00e1rios POP separada**: duplicaria a pessoa f\u00edsica (mesmo email em duas tabelas), quebraria o reuso do admin de usu\u00e1rios e complicaria o ClickSign (o signat\u00e1rio \u00e9 a mesma pessoa nos dois contextos).\n\n## Consequ\u00eancias\n\n- **A disciplina do ADR 0002 fica mais exposta.** Coordenadores e Gerentes logam no mesmo app mas **n\u00e3o podem ver Reuni\u00f5es, Notas ou Pend\u00eancias** (e Facilitadores sem perfil POP n\u00e3o veem POPs). Sem RLS, cada endpoint e item de navega\u00e7\u00e3o aplica o gating na camada de app \u2014 todo endpoint novo do POPs e a navega\u00e7\u00e3o por perfil s\u00e3o candidatos permanentes de `/security-review`.\n- O volume de usu\u00e1rios logados sai de 5 (Facilitadores) para potencialmente dezenas (Coordenadores/Gerentes de todos os setores) \u2014 o admin de usu\u00e1rios existente vira pe\u00e7a central e ganha o eixo `perfil_pop` + v\u00ednculos de Setor.\n- O volume ClickSign cresce estruturalmente: cada Vers\u00e3o Publicada = 3 signat\u00e1rios, e **toda Revis\u00e3o peri\u00f3dica re-assina** (mesmo sem mudan\u00e7a de conte\u00fado, por exig\u00eancia do DRF). Custo por envelope do plano atual precisa ser confirmado antes da Leva 1 entrar em produ\u00e7\u00e3o.\n- Gloss\u00e1rios por contexto via `CONTEXT-MAP.md`; ADRs seguem \u00fanicos e com numera\u00e7\u00e3o cont\u00ednua em `docs/adr/`.\n- Decis\u00f5es de produto do grilling (espinha de entregas, agente sem RAG, fluxograma em CSS, OCR com confirma\u00e7\u00e3o humana, alertas por regra + reda\u00e7\u00e3o IA) ficam no PRD \u2014 n\u00e3o s\u00e3o desta ADR.", "cita": [1, 2], "decisao": "A Diretoria do HSM entregou um DRF pedindo um \"Sistema de Gest\u00e3o de POPs\" \u2014 ciclo de vida de Procedimentos Operacionais Padr\u00e3o (elabora\u00e7\u00e3o com IA \u2192 revis\u00e3o \u2192 valida\u00e7\u00e3o \u2192 assinatura ClickSign \u2192 Biblioteca \u2192 treinamentos), com 4 perfis novos...", "emenda": [], "emendada_por": [], "file": "docs/adr/0007-pops-segundo-contexto-mesmo-app.md", "number": 7, "slug": "0007-pops-segundo-contexto-mesmo-app", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "POPs: segundo contexto de dom\u00ednio no mesmo app, com eixo de permiss\u00e3o pr\u00f3prio"}, {"amended_by": null, "amends": null, "body_md": "Na Ata Guiada, o respons\u00e1vel de cada a\u00e7\u00e3o era texto livre de ponta a ponta: o agente escrevia no quadro o nome como ouvido (\"Lucas\", \"Pedro\"), sem enxergar nem o roster da Reuni\u00e3o nem o cadastro. O v\u00ednculo com um Colaborador s\u00f3 era tentado depois, dentro de `liberar_pendencias`, por um `ILIKE %nome%` que pega o primeiro resultado \u2014 invis\u00edvel para o Facilitador e fr\u00e1gil a hom\u00f4nimos. Pior: mesmo a edi\u00e7\u00e3o manual na valida\u00e7\u00e3o (`PATCH quadro-atribuicoes`, combobox) recebia o `responsavel_participante_id`, usava-o para copiar nome/cargo can\u00f4nicos e **descartava o id**. Em nenhum ponto da cadeia o v\u00ednculo existia de fato. E com a finaliza\u00e7\u00e3o num clique (#66, evolu\u00e7\u00e3o da ADR 0006), o fluxo guiado nem passa mais pela tela de valida\u00e7\u00e3o \u2014 a conversa \u00e9 a \u00fanica revis\u00e3o antes de a Pend\u00eancia nascer.\n\nA decis\u00e3o, em quatro movimentos:\n\n- **Resolu\u00e7\u00e3o ao vivo, h\u00edbrida: o LLM conversa, o backend vincula.** A lista de candidatos (roster da Reuni\u00e3o anotado + cadastro de participantes ativos, com cargo/setor) entra no prompt do chat \u2014 o agente passa a falar e escrever os nomes can\u00f4nicos e a perguntar quando h\u00e1 ambiguidade (\"qual Lucas \u2014 Lucas Silva, de TI, ou Lucas Mendes, do RH?\") ou quando n\u00e3o encontra o nome (\"n\u00e3o achei Fernanda no cadastro \u2014 \u00e9 algu\u00e9m de fora?\"). Mas o `responsavel_id` \u00e9 resolvido **deterministicamente pelo backend a cada turno**, com a cascata do `participant_matcher` (a mesma do Pipeline de Transcri\u00e7\u00e3o; auto-match no threshold padr\u00e3o). O LLM nunca decide FK.\n- **Candidatos: roster primeiro, cadastro geral como fallback** \u2014 a mesma regra da extra\u00e7\u00e3o de Pend\u00eancias da Nota (`extracao_pendencias_service`). Quem n\u00e3o casa fica **externo**: s\u00f3 o nome, sem id, sinalizado no quadro, sem insist\u00eancia depois da primeira pergunta.\n- **O v\u00ednculo viaja no quadro, fim a fim.** O item do `quadro_atribuicoes` ganha `responsavel_id` (nullable): anotado a cada turno no rascunho, persistido pelo `concluir` no `json_ata`, gravado (e limpo, quando texto livre) pelo `PATCH quadro-atribuicoes` \u2014 que hoje o descarta \u2014 e **honrado por `liberar_pendencias`**, que s\u00f3 cai na Resolu\u00e7\u00e3o por nome quando o id est\u00e1 ausente (atas antigas, externos).\n- **Upsert no roster ao concluir.** Respons\u00e1vel casado fora do roster \u00e9 adicionado a `reuniao_participantes` no `concluir` \u2014 espelha o que o Pipeline de Transcri\u00e7\u00e3o j\u00e1 faz com os participantes detectados e mant\u00e9m o invariante do combobox da valida\u00e7\u00e3o (respons\u00e1vel escolh\u00edvel \u2286 roster). Sem efeito de assinatura: Ata Guiada nunca vai \u00e0 ClickSign. Durante o chat nada persiste \u2014 o rascunho segue ef\u00eamero (ADR 0006).\n\n## Por que \u00e9 surpreendente\n\n- **O backend recalcula o que o LLM acabou de escrever.** Com a lista no prompt, o agente j\u00e1 devolve \"Lucas Silva\" \u2014 parece redundante rodar o matcher de novo. N\u00e3o \u00e9: FK decidida por modelo generativo \u00e9 erro plaus\u00edvel e silencioso (id de outro Lucas, id inexistente), exatamente o tipo de falha que a feature existe para eliminar. O nome \u00e9 conversa; o id \u00e9 dado \u2014 e dado vem de c\u00f3digo determin\u00edstico.\n- **A FK vive dentro de um JSON.** `responsavel_id` dentro do `json_ata` n\u00e3o tem integridade referencial do banco. Aceito de prop\u00f3sito: o quadro \u00e9 rascunho dentro da Reuni\u00e3o (shape enxuto da ADR 0005), e a Pend\u00eancia \u2014 onde o v\u00ednculo vira cobran\u00e7a \u2014 tem FK real (`pendencias.responsavel_id`). O `concluir` revalida os ids server-side (existente e ativo no cadastro); id inv\u00e1lido cai para Resolu\u00e7\u00e3o por nome.\n- **O \u2713 do quadro \u00e9 promessa, n\u00e3o decora\u00e7\u00e3o:** o que o Facilitador v\u00ea vinculado na conversa \u00e9 exatamente o que `liberar_pendencias` grava \u2014 zero rematch surpresa no fim.\n\n## Alternativas descartadas\n\n- **LLM decide a FK** (devolve `responsavel_id` direto no rascunho): menos c\u00f3digo, mas id alucinado/trocado \u00e9 silencioso e mina a confian\u00e7a que a feature quer construir.\n- **Backend cego, sem lista no prompt** (matcher p\u00f3s-turno apenas): vincula certo, mas a conversa n\u00e3o muda \u2014 o agente seguiria dizendo \"Lucas\" sem saber perguntar \"qual Lucas?\"; a seguran\u00e7a n\u00e3o apareceria na intera\u00e7\u00e3o, que era o pedido.\n- **Sem id no quadro; rematch melhor na libera\u00e7\u00e3o** (trocar o ILIKE pela cascata): o v\u00ednculo exibido na conversa n\u00e3o seria garantido na Pend\u00eancia \u2014 desambigua\u00e7\u00f5es feitas pelo Facilitador na conversa poderiam ser desfeitas pelo rematch final.\n- **Id resolvido s\u00f3 na conclus\u00e3o**: sem \u2713 confi\u00e1vel ao vivo nem base determin\u00edstica para as perguntas de desambigua\u00e7\u00e3o durante a montagem.\n- **Combobox de participantes no quadro ao vivo**: corrigir durante a montagem segue conversacional (\u2316) \u2014 editar \u00e0 m\u00e3o um rascunho que o LLM reescreve a cada turno exigiria protocolo de prote\u00e7\u00e3o por item, para um ganho que a conversa j\u00e1 cobre. O ajuste manual com dropdown continua onde existe: na valida\u00e7\u00e3o (fallback da Guiada e fluxo por Transcri\u00e7\u00e3o).\n\n## Consequ\u00eancias\n\n- O prompt do chat guiado ganha o bloco de candidatos (roster + cadastro ativo, com cargo/setor). O cadastro \u00e9 pequeno (dezenas); se crescer, esse bloco \u00e9 o primeiro candidato a filtro.\n- Novo campo opcional `responsavel_id` no shape do item do quadro (rascunho e `json_ata`) \u2014 aditivo; atas existentes seguem v\u00e1lidas.\n- `liberar_pendencias` honra `responsavel_id` quando presente; o fallback por nome continua para atas antigas e itens sem v\u00ednculo. Quando h\u00e1 v\u00ednculo, o cargo exibido/persistido \u00e9 o can\u00f4nico do cadastro, n\u00e3o o ouvido na conversa.\n- `PATCH quadro-atribuicoes` passa a gravar/limpar o `responsavel_id` que hoje valida e descarta.\n- `concluir` revalida os v\u00ednculos server-side e faz o upsert do roster.\n- Gloss\u00e1rio (`CONTEXT.md`) atualizado: novo verbete **Resolu\u00e7\u00e3o**; **Participante** referencia a Resolu\u00e7\u00e3o; **Ata Guiada** menciona a Resolu\u00e7\u00e3o ao vivo.", "cita": [5, 6], "decisao": "Na Ata Guiada, o respons\u00e1vel de cada a\u00e7\u00e3o era texto livre de ponta a ponta: o agente escrevia no quadro o nome como ouvido (\"Lucas\", \"Pedro\"), sem enxergar nem o roster da Reuni\u00e3o nem o cadastro. O v\u00ednculo com um Colaborador s\u00f3 era tentado...", "emenda": [], "emendada_por": [], "file": "docs/adr/0008-resolucao-de-responsavel-ao-vivo-na-ata-guiada.md", "number": 8, "slug": "0008-resolucao-de-responsavel-ao-vivo-na-ata-guiada", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Resolu\u00e7\u00e3o de respons\u00e1vel ao vivo na Ata Guiada: LLM conversa, backend vincula"}, {"amended_by": null, "amends": null, "body_md": "Duas funcionalidades sa\u00edram de uso no dia a dia dos 5 Facilitadores e viraram peso morto no produto. A **Nota** (ADR 0004) \u2014 registro leve paralelo \u00e0 Reuni\u00e3o, com extra\u00e7\u00e3o de Pend\u00eancias por IA \u2014 **nunca foi adotada em produ\u00e7\u00e3o**: zero Notas criadas, zero Pend\u00eancias com `id_nota`. A **Importa\u00e7\u00e3o de ATAs** (`/reunioes/importar` + `bulk_import_atas`) cumpriu seu papel \u2014 a carga hist\u00f3rica de atas antigas j\u00e1 foi feita e as Reuni\u00f5es importadas vivem como Reuni\u00f5es normais \u2014 e n\u00e3o h\u00e1 nova carga prevista.\n\nA decis\u00e3o: **remover as duas de ponta a ponta**, n\u00e3o apenas escond\u00ea-las do menu.\n\n- **Notas**: sai a UI (`/notas`, componentes), o router (`notas.py`), os ramos de origem-Nota no c\u00f3digo de Pend\u00eancias (escopo e permiss\u00e3o por `id_nota`), os testes e o schema \u2014 migration que desfaz 041/042/043 (`DROP CONSTRAINT chk_pendencias_origem_unica`, `DROP COLUMN id_nota`, `DROP TABLE nota_participantes`, `DROP TABLE notas`), com **gate de seguran\u00e7a**: aborta se existir qualquer Nota ou Pend\u00eancia de Nota no banco. A Pend\u00eancia volta a nascer de uma \u00fanica porta: Reuni\u00e3o em estado terminal (ASSINADA ou APROVADA, ADR 0003).\n- **Importa\u00e7\u00e3o de ATAs**: sai a tela, o router (`importacao.py`), o item de menu e os testes. **Nenhuma migration** \u2014 os dados importados s\u00e3o Reuni\u00f5es/Atas comuns e permanecem intactos.\n- O que **fica**: a transcri\u00e7\u00e3o por voz (`useGravacaoVoz` + endpoint de transcri\u00e7\u00e3o), que a Nota introduziu mas a Ata Guiada e o chat de elabora\u00e7\u00e3o de POPs tamb\u00e9m usam.\n\nO ADR 0004 passa a `superseded` por este.\n\n## Por que \u00e9 surpreendente\n\nQuem ler as migrations em sequ\u00eancia ver\u00e1 041\u2013043 constru\u00edrem o que uma migration posterior derruba poucos meses depois \u2014 sem este registro, parece erro ou retrabalho. E o c\u00f3digo de Pend\u00eancias volta a assumir `id_reuniao` sempre preenchido, exatamente a suposi\u00e7\u00e3o que o ADR 0004 mandou parar de fazer: a \"terceira porta\" de origem fecha.\n\n## Alternativas descartadas\n\n- **S\u00f3 esconder do menu** (c\u00f3digo fica): superf\u00edcie morta para manter \u2014 testes rodando \u00e0 toa, gloss\u00e1rio descrevendo entidade fantasma, e o CHECK XOR em `pendencias` complicando todo racioc\u00ednio sobre origem sem servir a ningu\u00e9m.\n- **Feature flag**: complexidade de configura\u00e7\u00e3o para uma funcionalidade sem demanda conhecida; se a necessidade voltar, o git e este ADR guardam o desenho \u2014 recriar \u00e9 mais barato que carregar a flag.\n- **Manter as tabelas vazias \"por via das d\u00favidas\"**: o schema passa a mentir sobre o dom\u00ednio; a integridade (`CHECK` XOR) continuaria custando em cada mudan\u00e7a de Pend\u00eancias.\n\n## Consequ\u00eancias\n\n- `pendencias` volta a ter **duas origens** l\u00f3gicas (Reuni\u00e3o ASSINADA ou APROVADA) e `id_reuniao` como \u00fanica FK de origem \u2014 c\u00f3digo de escopo/permiss\u00e3o simplificado.\n- Gloss\u00e1rio (`CONTEXT.md`): sai o verbete **Nota**; **Pend\u00eancia**, **Participante** e **Resolu\u00e7\u00e3o** voltam a citar s\u00f3 a Reuni\u00e3o (e a Ata Guiada, que segue existindo \u2014 ADR 0005/0006/0008 n\u00e3o s\u00e3o afetados).\n- O menu lateral enxuga: Dashboard, Calend\u00e1rio, Pend\u00eancias, POPs (condicional a `perfil_pop`, ADR 0007) e Admin.\n- A migration de drop \u00e9 **irrevers\u00edvel com dados** \u2014 por isso o gate; recriar a feature no futuro = nova migration a partir deste ADR e do 0004.\n- Implementa\u00e7\u00e3o nas issues da reorganiza\u00e7\u00e3o do menu (remo\u00e7\u00e3o de Importa\u00e7\u00e3o; descontinua\u00e7\u00e3o de Notas; bootstrap do Superadmin POPs).", "cita": [3, 5, 7], "decisao": "Duas funcionalidades sa\u00edram de uso no dia a dia dos 5 Facilitadores e viraram peso morto no produto. A **Nota** (ADR 0004) \u2014 registro leve paralelo \u00e0 Reuni\u00e3o, com extra\u00e7\u00e3o de Pend\u00eancias por IA \u2014 **nunca foi adotada em produ\u00e7\u00e3o**: zero...", "emenda": [], "emendada_por": [], "file": "docs/adr/0011-descontinuar-notas-e-importacao-de-atas.md", "number": 11, "slug": "0011-descontinuar-notas-e-importacao-de-atas", "status": "accepted", "substitui": [4], "substituida_por": [], "superseded_by": null, "supersedes": "0004", "title": "Descontinuar Notas e Importa\u00e7\u00e3o de ATAs"}, {"amended_by": null, "amends": null, "body_md": "O `<select>` nativo do HTML n\u00e3o deixa estilizar a lista aberta: o sistema operacional a desenha (no macOS, com fundo escuro), fora do Design System. Hoje 15 telas (admin, POPs, reuni\u00f5es, secretaria, pend\u00eancias, notas) usam `<select>` nativo e exibem esse menu fora do padr\u00e3o. O `MultiSelect` que j\u00e1 existe no app fica branco justamente porque desenha a pr\u00f3pria lista.\n\nA decis\u00e3o: criar um componente `Select` de sele\u00e7\u00e3o \u00fanica em `components/ui/`, hand-rolled (React + Tailwind + lucide, o mesmo stack do `MultiSelect`), com o fundo branco do Design System, e substituir todos os `<select>` nativos por ele. Sem adotar lib headless (Radix, Headless UI): o projeto n\u00e3o tem nenhuma depend\u00eancia de UI al\u00e9m do lucide, e o padr\u00e3o hand-rolled j\u00e1 existe e \u00e9 a refer\u00eancia visual.\n\nContrapartida obrigat\u00f3ria: o `Select` precisa ter acessibilidade de teclado de verdade (setas, Enter, Esc, Home/End, type-ahead, `role=\"listbox\"`/`option`, `aria-activedescendant`), porque o `<select>` nativo que ele substitui j\u00e1 entregava isso de gra\u00e7a. Um clone do `MultiSelect` sem teclado regrediria a navega\u00e7\u00e3o.\n\n## Por que \u00e9 surpreendente\n\nUm dev acostumado a React vai perguntar por que n\u00e3o usamos Radix Select, que entrega a11y completa de f\u00e1brica. A resposta \u00e9 consist\u00eancia e zero depend\u00eancia: o app inteiro \u00e9 hand-rolled sobre Tailwind, e introduzir uma lib headless criaria dois padr\u00f5es convivendo (o `MultiSelect` hand-rolled e um `Select` de lib). O custo aceito \u00e9 assumir a a11y de teclado na m\u00e3o.\n\n## Alternativas descartadas\n\n- **Radix / Headless UI**: a11y de f\u00e1brica, mas seria a primeira depend\u00eancia headless do projeto e um segundo padr\u00e3o ao lado do `MultiSelect`. Reavaliar se o custo de manter a a11y hand-rolled se mostrar alto.\n- **Manter o `<select>` nativo**: imposs\u00edvel deixar branco; a lista aberta \u00e9 desenhada pelo SO, fora do alcance do CSS.\n- **Clonar o `MultiSelect` sem tecl
