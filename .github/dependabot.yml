# Atualização de versão semanal, um PR por ecossistema (issue #1287).
# Desde a issue #1599 o CI roda no Mac do Pedro, e o PR do Dependabot não roda
# nele: pacote novo que ninguém leu rodaria com o acesso da conta do Pedro. O PR
# fica vermelho (job `fora-do-mac`) até alguém conferir a mudança e trazê-la num
# PR de uma branch deste repositório, que passa pelo CI e pela subida.
version: 2
updates:
  - package-ecosystem: npm
    directory: /hospital-reunioes/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    # Versão grande (major) não entra no lote semanal: muda API e quebra o CI
    # (o #1320 juntou Next 16, TypeScript 7 e mais cinco). Major vira issue planejada.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /hospital-reunioes/backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
