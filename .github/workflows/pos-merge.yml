name: Pós-merge

# Snapshot depois de cada push na main (ADR 0062, decisão
# 10, emendada pela ADR 0065; issue #940), e o registro do deploy que a subida
# dispara depois do health (ADR 0064, decisão 6b; issue #1000). A subida
# (fechar_onda.py) monta só a verdade do deploy e a entrega aqui; o
# history.json e o state.json com ela, o mapa factual (docs/spec/snapshots/,
# blocos AUTO do docs/ARQUITETURA.md) saem daqui, com o ambiente completo do
# backend.
#
# Dois jobs que gravam (ADR 0065). O `gerar` instala o backend e roda os scripts, sem
# credencial nenhuma: token só de leitura, que nem fica no .git/config. O
# `commitar` não instala nada: recebe por artefato só o patch dos dois
# caminhos e dos dois JSONs do registro, confere estes contra o input da
# subida e empurra direto na main com a deploy key, o único ator em
# `bypass_actors` do ruleset (.github/rulesets/main.json). A chave vive num
# secret do Environment `pos-merge`, restrito à branch main.
#
# O terceiro job, `em-producao` (issue #1065, ADR 0069, decisão 4), avisa o app de
# que a versão subiu, para ele marcar Em produção as Demandas do lote. Roda só
# quando o passo que aplica o registro deu certo, e num job à parte, e não como
# passo do `gerar`: o segredo do webhook não entra no job que roda pacote de
# terceiros (ADR 0065). Falhar não derruba o run, porque a reconciliação de hora
# em hora do app lê o mesmo registro no history.json da main.
on:
  push:
    branches: [main]
    # O que a própria Action escreve. Push pela deploy key dispara workflow
    # (ao contrário do GITHUB_TOKEN): o [skip ci] do commit e este filtro
    # impedem o loop.
    paths-ignore:
      - 'docs/spec/snapshots/**'
      - 'docs/ARQUITETURA.md'
      - 'docs/spec/deploy/history.json'
      - 'docs/spec/deploy/state.json'
  # O registro do deploy (ADR 0064, decisão 6b): o fechar_onda.py termina no
  # health e dispara este workflow na main com o registro, sem PR. O run grava
  # os dois JSONs. O push do squash de código também acorda a Action, mas com o
  # history.json de antes do health.
  workflow_dispatch:
    inputs:
      registro:
        description: 'JSON com "entrada" (a do history.json) e "state" (o state.json inteiro), do fechar_onda.py'
        required: true
        type: string

permissions:
  contents: read

# Um por vez, sem cancelar o que já começou: dois runs empurrando snapshot ao
# mesmo tempo brigariam pelos mesmos arquivos.
concurrency:
  group: pos-merge
  cancel-in-progress: false

jobs:
  gerar:
    name: Snapshot e registro
    runs-on: ubuntu-latest
    env:
      # As mesmas do job backend do ci.yml: o Settings exige as duas primeiras
      # e recusa subir sem ENVIRONMENT. Sem elas o import do app falha e o
      # snapshot cai no parser AST, que rebaixa o ROTAS.md.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      ENVIRONMENT: ci
    outputs:
      # Se o registro foi aplicado: é o que libera o aviso ao app (job
      # `em-producao`). No run do push o passo nem roda, e fica `skipped`.
      registro: ${{ steps.registro.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A ponta da main na hora do run, e não o commit do evento: o run que
          # esperou na fila já parte do commit que o run anterior empurrou.
          ref: main
          # O pip, o uv sync e o import do app rodam aqui: nenhum token fica
          # no .git/config para um pacote comprometido ler.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Aplicar o registro do deploy
        id: registro
        # Só no run que a subida dispara (ADR 0064, decisão 6b): a entrada nova
        # vai para o topo do history.json e o state.json passa a ser o do
        # registro. O input entra por
        # env e o script recusa tudo fora do esquema sem escrever nada.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REGISTRO: ${{ inputs.registro }}
        run: python3 tools/aplicar_registro.py

      - name: Ambiente do backend (pelo uv.lock, como no CI)
        # O snapshot lê as rotas do app montado pelo .venv de
        # hospital-reunioes/backend (introspect_routes.py).
        working-directory: hospital-reunioes/backend
        run: |
          pip install uv
          uv sync --frozen --extra dev --python "$(command -v python)"

      - name: Snapshot (docs/spec/snapshots e blocos AUTO do ARQUITETURA.md)
        # --no-commit: sem ele o snapshot.py commita sozinho, com outra
        # mensagem e sem [skip ci]. Quem commita é o job de baixo.
        run: python3 .claude/skills/snapshot/scripts/snapshot.py --root . --no-commit

      - name: Empacotar o patch dos três caminhos e do registro
        # Roda mesmo com o snapshot vermelho: o registro não se perde (o run fica vermelho do mesmo jeito). Patch, e não os
        # arquivos: leva arquivo apagado e aplica sobre a ponta da main que o
        # outro job vê.
        if: ${{ !cancelled() }}
        run: |
          git add -A -- docs/spec/snapshots docs/ARQUITETURA.md \
            docs/spec/deploy/history.json docs/spec/deploy/state.json
          git diff --cached --binary > "$RUNNER_TEMP/pos-merge.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pos-merge
          path: ${{ runner.temp }}/pos-merge.patch
          if-no-files-found: error
          retention-days: 1

  commitar:
    name: Commitar na main pela deploy key
    needs: gerar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # O secret da deploy key só existe neste Environment, que só aceita job
    # da branch main: YAML de outra branch (ou de um workflow_dispatch nela)
    # não chega à chave.
    environment: pos-merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.POS_MERGE_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pos-merge
          path: ${{ runner.temp }}/pos-merge

      - name: Commitar na main como github-actions[bot]
        # Só entra o que a Action escreve, os mesmos caminhos do paths-ignore:
        # o --include descarta do patch qualquer outro caminho. [skip ci] no
        # assunto: o push da deploy key acorda workflow. O rebase pega o PR que
        # entrou na main durante o run; sem ele o push seria recusado. O
        # registro do run disparado pela subida entra por env, como no `gerar`:
        # é com ele que os dois JSONs do patch são conferidos.
        env:
          REGISTRO: ${{ inputs.registro }}
        run: |
          patch="$RUNNER_TEMP/pos-merge/pos-merge.patch"
          if [ ! -s "$patch" ]; then
            echo "Snapshot e registro em dia: nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index \
            --include='docs/spec/snapshots/*' \
            --include='docs/ARQUITETURA.md' \
            --include='docs/spec/deploy/history.json' \
            --include='docs/spec/deploy/state.json' \
            "$patch"
          # As checagens com awk saem pelo exit do próprio awk, e não por um
          # grep -q depois dele: com shell: bash, o encadeamento falha quando
          # qualquer comando dele falha, e o grep que sai no primeiro achado
          # mata o awk de SIGPIPE e o if dá falso.
          # Modo novo só de arquivo comum, ou o 000000 da deleção: symlink
          # aponta para fora, e gitlink faz o submodule update do clone sair
          # com 128.
          if git diff --cached --raw --no-renames | awk '$2 != "100644" && $2 != "000000" {f = 1} END {exit !f}'; then
            echo "::error::O patch traz modo que não é de arquivo comum (symlink, gitlink, executável): recusado."
            exit 1
          fi
          # Nada nasce nem morre nos dois caminhos: o snapshot.py só reescreve
          # os arquivos do TARGET_FILES e os blocos AUTO do ARQUITETURA.md, e o
          # registro só os dois JSONs. Um
          # CLAUDE.md ou uma skill dentro de
          # docs/spec/snapshots/ vira instrução de quem lê o snapshot, agente
          # sem humano incluído. O --include só olha o nome novo: um rename de
          # fora para dentro passaria e apagaria a origem. Sem renames, cada
          # caminho do índice aparece e tem que ser um M da lista. LC_ALL=C e
          # -a: no locale UTF-8 do runner, o GNU grep não imprime a linha com
          # nome que não é UTF-8 válido, e o arquivo sairia do fora (#1031).
          fora=$(git -c core.quotePath=false diff --cached --name-status --no-renames \
            | LC_ALL=C grep -a -Ev '^M[[:space:]]+(docs/spec/snapshots/(ROTAS|ENTIDADES|SCHEMA|MIGRATIONS|INTEGRACOES)\.md|docs/ARQUITETURA\.md|docs/spec/deploy/(history|state)\.json)$' || true)
          if [ -n "$fora" ]; then
            echo "::error::O patch cria, apaga ou toca arquivo que a Action não escreve: $fora"
            exit 1
          fi
          # O registro do deploy (ADR 0064, decisão 6b) só muda no run que a
          # subida dispara, e só para o que ela mandou: o history.json da main
          # com a entrada do input no topo, as antigas iguais e na mesma
          # ordem, e o state.json do input. O `gerar` roda pacote de terceiros
          # depois de aplicar o registro: a conferência é contra o input, e
          # não contra o que ele entregou. Token a token (o --stream do jq,
          # que não junta nada): a igualdade de JSON do jq deixaria passar
          # chave repetida (fica a última) e um valor a mais no fim do
          # arquivo, texto que vai cru para a main (PR #1035).
          deploy=docs/spec/deploy
          registro=""
          if ! git diff --cached --quiet -- "$deploy"; then
            if [ -z "$REGISTRO" ]; then
              echo "::error::O patch muda $deploy num run sem registro (só o run que a subida dispara traz um): recusado."
              exit 1
            fi
            tokens="$RUNNER_TEMP/registro-tokens"
            mkdir -p "$tokens"
            if ! jq -cn --slurpfile antes <(git show "HEAD:$deploy/history.json") \
                  '$antes[0] | .deploys = [$ENV.REGISTRO | fromjson | .entrada] + .deploys | tostream' \
                  > "$tokens/history-esperado" \
                || ! jq -cn '$ENV.REGISTRO | fromjson | .state | tostream' > "$tokens/state-esperado" \
                || ! git show ":$deploy/history.json" | jq -c --stream . > "$tokens/history" \
                || ! git show ":$deploy/state.json" | jq -c --stream . > "$tokens/state" \
                || ! cmp -s "$tokens/history-esperado" "$tokens/history" \
                || ! cmp -s "$tokens/state-esperado" "$tokens/state"; then
              echo "::error::O history.json ou o state.json do patch não é o registro que a subida mandou: recusado."
              exit 1
            fi
            registro="registro v$(jq -nr '$ENV.REGISTRO | fromjson | .entrada.app_version'), "
          fi
          if git diff --cached --quiet; then
            echo "O patch não toca os caminhos da Action: nada a commitar."
            exit 0
          fi
          git commit -q -m "chore(spec): ${registro}snapshot pós-merge $(git rev-parse --short HEAD) [skip ci]"
          git pull --rebase -q origin main
          git push -q origin HEAD:main

  em-producao:
    name: Avisar o app que a versão subiu
    needs: gerar
    # Depois do registro aplicado, e só no run que a subida dispara. O snapshot
    # vermelho não segura o aviso: a versão subiu do mesmo jeito.
    if: ${{ !cancelled() && needs.gerar.outputs.registro == 'success' }}
    runs-on: ubuntu-latest
    # O app fora do ar ou o segredo ainda não cadastrado não derrubam o run: a
    # reconciliação de hora em hora do app marca Em produção pelo history.json.
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Chamar o webhook de deploy do app
        # O segredo e o registro entram por env, nunca no `run`. O script só usa
        # a biblioteca padrão: nada é instalado neste job.
        env:
          REGISTRO: ${{ inputs.registro }}
          TECNOLOGIA_DEPLOY_WEBHOOK_SECRET: ${{ secrets.TECNOLOGIA_DEPLOY_WEBHOOK_SECRET }}
        run: python3 tools/avisar_deploy_ao_app.py
