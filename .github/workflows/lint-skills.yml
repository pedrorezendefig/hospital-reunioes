name: Lint skills

# O ci.yml ignora `.claude/**` e `**/*.md` no trigger, então um PR que mexe só
# num SKILL.md nunca acordaria o CI principal. Este workflow roda quando uma
# skill muda e trava o cabeçalho YAML quebrado (issue #807): `description:` sem
# aspas com dois-pontos no meio faz o Claude Code descartar o cabeçalho inteiro
# em silêncio, e a skill perde a descrição com os gatilhos.
permissions:
  contents: read

# Commit novo na mesma branch cancela a rodada anterior do PR (issue #1599). O
# push na main tem um grupo por commit e nunca cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'tools/lint_skills.py'
      - 'tools/test_lint_skills.py'
      - '.github/workflows/lint-skills.yml'
  pull_request:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'tools/lint_skills.py'
      - 'tools/test_lint_skills.py'
      - '.github/workflows/lint-skills.yml'

jobs:
  lint-skills:
    name: Cabeçalho YAML das skills
    # No Mac do Pedro (issue #1599); PR de fork não roda nele. O uv do Mac
    # traz o Python 3.12 e as dependências: o setup-python do Mac só instala
    # em /Users/runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, pedro-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testes do lint
        run: uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tools/test_lint_skills.py -q
      - name: Lint skills
        run: uv run --no-project --python 3.12 --with pyyaml python tools/lint_skills.py --dir .claude/skills
