name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  # Sem paths-ignore no PR (issue #910): o ruleset da main exige os três jobs
  # abaixo, e workflow pulado por filtro de caminho não reporta check nenhum. O
  # PR só de docs (o registro do fechar_onda.py, ADR, skill) ficaria esperando
  # para sempre. Quem pula o trabalho pesado é o job `mudancas`, e job pulado
  # por `if` conta como verde para o ruleset.
  pull_request:
    branches: [main]

jobs:
  mudancas:
    name: Mudanças fora de docs
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.diff.outputs.codigo }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: O PR muda algo fora de docs/, .claude/ e Markdown?
        # Mesma regra do paths-ignore do push e do docs-only do fechar_onda.py.
        # Se o git diff falhar, o passo falha e os jobs rodam (ver o if deles).
        id: diff
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arquivos="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$arquivos" | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend Lint, Format & Tests
    needs: mudancas
    # Pulado por if = verde no ruleset. Detector quebrado roda o job: pular o
    # CI de um PR de código por erro do detector passaria pelo ruleset sem teste.
    if: ${{ !cancelled() && (needs.mudancas.result != 'success' || needs.mudancas.outputs.codigo == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-reunioes/backend
    env:
      # Pydantic Settings em app/config.py exige só esses 2 campos sem default.
      # Valores dummy fixos satisfazem a validação de presença para o pytest rodar.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      # O default de ENVIRONMENT é "production" (fail-closed, issue #450), e em
      # produção o Settings recusa ClickSign sandbox. Sem declarar o ambiente
      # aqui, o import do app levantaria antes do primeiro teste. Mesmo valor
      # que o job de build já passa como build arg.
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v6
        with:
          # Histórico completo: a guarda de migration repetida compara a branch
          # com origin/main e precisa do ponto em que elas se separaram.
          fetch-depth: 0
      - name: Lint travessão (templates de documento e email)
        # Trava travessão (U+2014) e meia-risca (U+2013) nos templates que viram
        # PDF/email (ADR 0013). Só superfície que o usuário lê: NÃO inclui
        # prompts (instruem a IA e citam o caractere), comentários, testes nem docs.
        # Os caracteres entram via \x{...} para não existir nenhum literal no lint.
        run: |
          if grep -rPln '[\x{2014}\x{2013}]' app/templates/; then
            echo "::error::Travessão (U+2014) ou meia-risca (U+2013) encontrado nos templates acima. Use vírgula, ou hífen entre números (ADR 0013)."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Migration com número repetido
        # Duas sessões em paralelo podem escolher o mesmo próximo número
        # (issue #903). Recusa migration que o PR adiciona com número que a
        # main já usa; o fechar_onda.py repete a conferência contra a main da
        # hora do merge, porque ela pode ter andado desde este CI.
        if: github.event_name == 'pull_request'
        run: python ../../tools/checar_migration_repetida.py --base origin/main
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest --maxfail=3 -q --no-header

  frontend-lint:
    name: Frontend Lint & Type Check
    needs: mudancas
    if: ${{ !cancelled() && (needs.mudancas.result != 'success' || needs.mudancas.outputs.codigo == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-reunioes/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          # Pin pnpm@9 para bater com o Dockerfile do frontend
          # (corepack prepare pnpm@9 --activate). pnpm@11 trata ERR_PNPM_IGNORED_BUILDS
          # como fatal mesmo com onlyBuiltDependencies declarado no package.json.
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: hospital-reunioes/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Tests (vitest)
        run: pnpm test

  build:
    name: Docker Build (sanity)
    needs: mudancas
    if: ${{ !cancelled() && (needs.mudancas.result != 'success' || needs.mudancas.outputs.codigo == 'true') }}
    runs-on: ubuntu-latest
    # Sanity check: garante que os 2 Dockerfiles ainda buildam.
    # NAO faz push — Coolify cuida do build de producao via webhook do GitHub App.
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: hospital-reunioes/backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            ENVIRONMENT=ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: hospital-reunioes/frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-ci
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_ENVIRONMENT=ci
