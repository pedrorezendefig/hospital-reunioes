name: CI

# Os jobs sem Docker rodam no runner próprio do Mac do Pedro (rótulo
# `pedro-mac`, issue #1599): os minutos grátis do GitHub de novembro de 2026
# acabaram e a conta não tem cartão. Só o `build` fica no `ubuntu-latest`. O CI
# só anda com o Mac ligado. PR vindo de fork não roda no Mac: o job
# `fork-sem-mac` o deixa vermelho em vez de os jobs pulados contarem verde.

permissions:
  contents: read

# Commit novo na mesma branch cancela a rodada anterior do PR. O push na main
# tem um grupo por commit e nunca cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  # Sem paths-ignore no PR (issue #910): o ruleset da main exige os três jobs
  # abaixo, e workflow pulado por filtro de caminho não reporta check nenhum. O
  # PR só de docs (ADR, skill) ficaria esperando
  # para sempre. Quem pula o trabalho pesado é o job `mudancas`, e job pulado
  # por `if` conta como verde para o ruleset.
  pull_request:
    branches: [main]

jobs:
  mudancas:
    name: Partes que o PR muda
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pedro-mac]
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      ferramenta: ${{ steps.diff.outputs.ferramenta }}
      imagem: ${{ steps.diff.outputs.imagem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: O PR muda backend, frontend ou ferramenta?
        # Cada job pesado roda só com a parte dele (PRD #963, decisão 4):
        # backend com backend/ ou supabase/, frontend com frontend/, build com
        # qualquer um dos dois. Ferramenta é o que fica fora de
        # hospital-reunioes/, a mesma fronteira da subida (fechar_onda.py);
        # nenhum job daqui a consome, porque os testes de tools/ rodam no
        # ferramentas.yml. Se o git diff falhar, o passo falha e os jobs rodam (ver
        # o if deles).
        # Imagem é o que entra nos dois Dockerfiles (o contexto deles), e só ela
        # acorda o `build`, o único job que gasta minuto do GitHub (issue #1599).
        # Mudar o próprio CI não acorda o `build`: o que ele constrói não mudou.
        id: diff
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          imagem_muda() { printf '%s\n' "$1" | grep -qE '^hospital-reunioes/(backend|frontend)/|^"'; }
          if [ "$EVENTO" != "pull_request" ]; then
            # Push na main: os testes rodam inteiros (no Mac, sem custo) e a
            # imagem só quando o push muda o contexto dela. Diff que falha ou
            # vem vazio constrói.
            imagem=true
            if arquivos="$(git -c core.quotePath=false diff --no-renames --name-only "$ANTES" "$GITHUB_SHA")" \
                && [ -n "$arquivos" ] && ! imagem_muda "$arquivos"; then
              imagem=false
            fi
            printf 'backend=true\nfrontend=true\nferramenta=true\nimagem=%s\n' "$imagem" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: num rename o diff lista só o caminho novo, e tirar
          # código do backend ou do frontend pularia o job dele.
          # core.quotePath=false: no padrão o git põe entre aspas caminho com
          # acento, e nenhum ^hospital-reunioes/ casaria (pularia os jobs).
          arquivos="$(git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"
          muda() { printf '%s\n' "$arquivos" | grep -qE "$1"; }
          backend=false; frontend=false; ferramenta=false
          if muda '^hospital-reunioes/(backend|supabase)/'; then backend=true; fi
          if muda '^hospital-reunioes/frontend/'; then frontend=true; fi
          # Os casos dos cacoetes (ADR 0071) são lidos também pelo vitest da
          # regra do ESLint: mudou o JSON, o front prova que concorda.
          if muda '^tools/tells_casos\.json$'; then frontend=true; fi
          if printf '%s\n' "$arquivos" | grep -qv '^hospital-reunioes/'; then ferramenta=true; fi
          # Mexeu no próprio CI, o diff veio vazio, ou um caminho continua entre
          # aspas (aspa, barra invertida, caractere de controle): roda tudo.
          if [ -z "$arquivos" ] || muda '^\.github/workflows/' || muda '^"'; then
            backend=true; frontend=true
          fi
          imagem=false
          if [ -z "$arquivos" ] || imagem_muda "$arquivos"; then imagem=true; fi
          printf 'backend=%s\nfrontend=%s\nferramenta=%s\nimagem=%s\n' "$backend" "$frontend" "$ferramenta" "$imagem" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Lint, Format & Tests
    needs: mudancas
    # Pulado por if = verde no ruleset. Detector quebrado roda o job: pular o
    # CI de um PR de código por erro do detector passaria pelo ruleset sem teste.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.mudancas.result != 'success' || needs.mudancas.outputs.backend == 'true') }}
    runs-on: [self-hosted, pedro-mac]
    defaults:
      run:
        working-directory: hospital-reunioes/backend
    env:
      # Pydantic Settings em app/config.py exige só esses 2 campos sem default.
      # Valores dummy fixos satisfazem a validação de presença para o pytest rodar.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      # O default de ENVIRONMENT é "production" (fail-closed, issue #450), e em
      # produção o Settings recusa ClickSign sandbox. Sem declarar o ambiente
      # aqui, o import do app levantaria antes do primeiro teste. Mesmo valor
      # que o job de build já passa como build arg.
      ENVIRONMENT: ci
      # O WeasyPrint acha as bibliotecas do Homebrew por aqui no Mac.
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: a guarda de migration repetida compara a branch
          # com origin/main e precisa do ponto em que elas se separaram.
          fetch-depth: 0
      - name: Lint travessão (templates de documento e email)
        # Trava travessão (U+2014) e meia-risca (U+2013) nos templates que viram
        # PDF/email (ADR 0013). Só superfície que o usuário lê: NÃO inclui
        # prompts (instruem a IA e citam o caractere), comentários, testes nem docs.
        # Os caracteres entram pelos bytes do UTF-8 para não existir nenhum
        # literal no lint (o grep do Mac não tem -P).
        run: |
          if LC_ALL=C grep -rlE "$(printf '\342\200\224|\342\200\223')" app/templates/; then
            echo "::error::Travessão (U+2014) ou meia-risca (U+2013) encontrado nos templates acima. Use vírgula, ou hífen entre números (ADR 0013)."
            exit 1
          fi
      - name: Migration com número repetido
        # Duas sessões em paralelo podem escolher o mesmo próximo número
        # (issue #903). Recusa migration que o PR adiciona com número que a
        # main já usa; o fechar_onda.py repete a conferência contra a main da
        # hora do merge, porque ela pode ter andado desde este CI.
        if: github.event_name == 'pull_request'
        run: uv run --no-project --python 3.12 python ../../tools/checar_migration_repetida.py --base origin/main
      - name: Migration com recibo
        # Toda migration nova termina gravando o próprio número em
        # migracoes_aplicadas (issue #969): a subida só mergeia depois que o
        # /api/health devolve esse número, e sem o insert esperaria 24 h.
        if: github.event_name == 'pull_request'
        run: uv run --no-project --python 3.12 python ../../tools/checar_recibo_da_migration.py --base origin/main
      - name: poppler e tesseract (pdftotext e OCR das Contas médicas)
        # A leitura de PDF das Contas médicas roda o `pdftotext -layout` de
        # verdade nos testes (issue #1116, ADR 0070); a imagem leva o mesmo pacote.
        # O `tesseract` com o português lê as folhas desenhadas no teste da
        # confiança do OCR (issue #1398), como a imagem lê as digitalizadas. No
        # Mac eles vêm do Homebrew; sem o `por`, o teste pularia em silêncio.
        run: |
          for binario in pdftotext pdftoppm tesseract; do
            command -v "$binario" > /dev/null || { echo "::error::Falta o $binario no Mac do runner: brew install poppler tesseract tesseract-lang"; exit 1; }
          done
          tesseract --list-langs 2>/dev/null | grep -qx por || { echo "::error::O tesseract do Mac do runner está sem o português: brew install tesseract-lang"; exit 1; }
      - name: Lock em sincronia (uv.lock x pyproject.toml)
        # Issue #852: o `uv sync --frozen` abaixo e a imagem instalam o que está
        # no lock, sem re-resolver. Um pyproject.toml alterado sem `uv lock`
        # passaria em silêncio com as versões velhas; aqui ele reprova.
        run: |
          if ! uv lock --check; then
            echo "::error file=hospital-reunioes/backend/uv.lock::uv.lock fora de sincronia com o pyproject.toml. Rode 'uv lock' em hospital-reunioes/backend e commite o lock junto."
            exit 1
          fi
      - name: Install dependencies (pelo uv.lock)
        # Versões exatas do lock, com o extra de dev (ruff, pytest), num venv
        # no Python 3.12 que o uv do Mac baixa (o setup-python do Mac só
        # instala em /Users/runner). O venv entra no PATH dos passos
        # seguintes, então ruff e pytest rodam com o que o lock travou.
        run: |
          uv sync --frozen --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest, em paralelo)
        # pytest-xdist, um worker por CPU (issue #971). O que tem o marcador
        # `rodar_sozinho` roda no job `backend-sozinho`, ao mesmo tempo que
        # este. Nenhum retry: teste que falha só em paralelo ganha o marcador,
        # não uma segunda tentativa.
        run: pytest -n auto -m "not rodar_sozinho" --maxfail=3 -q --no-header

  backend-sozinho:
    name: Backend Tests (rodar sozinho)
    needs: mudancas
    # A lista do marcador `rodar_sozinho` num job próprio, em paralelo com o
    # job de backend: em série, no mesmo job, ela somava 2,5 min a todo PR do
    # app. Mesma condição do job de backend.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.mudancas.result != 'success' || needs.mudancas.outputs.backend == 'true') }}
    runs-on: [self-hosted, pedro-mac]
    defaults:
      run:
        working-directory: hospital-reunioes/backend
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      ENVIRONMENT: ci
      # O WeasyPrint acha as bibliotecas do Homebrew por aqui no Mac.
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pdftotext das Contas médicas (Homebrew do Mac)
        run: |
          command -v pdftotext > /dev/null || { echo "::error::Falta o pdftotext no Mac do runner: brew install poppler"; exit 1; }
      - name: Install dependencies (pelo uv.lock)
        # O uv do Mac (~/.local/bin, no PATH do runner) baixa o Python 3.12
        # sozinho: o setup-python do Mac só instala em /Users/runner.
        run: |
          uv sync --frozen --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tests (pytest, rodar sozinho)
        # A lista do marcador `rodar_sozinho`, em série. Sem teste marcado o
        # pytest sai com 5 (nada coletado): lista vazia é o estado bom, então
        # só o 5 vira verde; qualquer outro código reprova. O `--durations=0`
        # deixa no log o tempo de cada um, que é o que diz qual pesa (#1362).
        run: |
          set +e
          pytest -m rodar_sozinho --maxfail=3 -q --no-header --durations=0
          codigo=$?
          if [ "$codigo" -eq 5 ]; then exit 0; fi
          exit "$codigo"

  frontend-lint:
    name: Frontend Lint & Type Check
    needs: mudancas
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.mudancas.result != 'success' || needs.mudancas.outputs.frontend == 'true') }}
    runs-on: [self-hosted, pedro-mac]
    defaults:
      run:
        working-directory: hospital-reunioes/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 24 e pnpm do Mac
        # O Node 24 do Mac (/usr/local/bin, no PATH do runner), sem setup-node.
        # O pnpm vem do corepack do próprio Node, na versão do `packageManager`
        # do package.json (o mesmo major do Dockerfile), num atalho só deste job.
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          node --version | grep -q '^v24\.' || { echo "::error::O runner precisa do Node 24, achou $(node --version)"; exit 1; }
          corepack enable pnpm --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
      - name: Install dependencies
        # O store do pnpm fica no Mac de uma rodada para a outra.
        run: pnpm install --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Tests (vitest)
        run: pnpm test

  build:
    name: Docker Build (sanity)
    needs: mudancas
    # Docker fica no GitHub (issue #1599), e só quando o PR muda o que entra
    # na imagem: é o único job que gasta minuto.
    if: ${{ !cancelled() && (needs.mudancas.result != 'success' || needs.mudancas.outputs.imagem == 'true') }}
    runs-on: ubuntu-latest
    # Os 2 Dockerfiles ainda buildam. A imagem do backend vai para o GHCR com a
    # tag do sha do head do PR (issue #1001, ADR 0064 decisão 6c): depois do
    # merge a subida (fechar_onda.py) dá a ela a tag do squash pelo
    # imagem-backend.yml, e o Coolify só puxa. A do frontend não sai daqui: é
    # construída com valores falsos, e o Coolify ainda a constrói pelo webhook.
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM_BACKEND: ghcr.io/pedrorezendefig/hospital-reunioes-backend
      # Só PR deste repositório publica: o de fork não tem token que escreva no
      # GHCR, e o push na main não precisa (a imagem do squash é do workflow
      # que a subida dispara).
      PUBLICA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout do head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O head do PR, não o merge com a main que o pull_request faria: a
          # imagem leva a tag do head e tem que ter o código dele.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hospital-reunioes/backend
          push: ${{ env.PUBLICA == 'true' }}
          tags: ${{ env.IMAGEM_BACKEND }}:${{ github.event.pull_request.head.sha || github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Cache do GitHub Actions, isolado por ref: o PR lê o da main e escreve
          # só no dele, e nenhum PR envenena o build da main nem o de outro PR.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            ENVIRONMENT=ci
      # A tag `:<head>` é mutável; o digest do que este build publicou não. A subida
      # o lê deste artefato e retagueia pelo digest (revisão do PR #1016).
      - name: Digest da imagem do backend
        if: env.PUBLICA == 'true'
        env:
          DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          mkdir -p digest
          printf '%s\n' "$DIGEST" > digest/digest
      - name: Guarda o digest para a subida
        if: env.PUBLICA == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-backend
          path: digest/digest

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hospital-reunioes/frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-ci
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_ENVIRONMENT=ci

  # As duas travas de repositório público (issue #1287) olham só o que o PR
  # traz, então não rodam no push da main. Não dependem do `mudancas`: PR só de
  # docs também pode trazer segredo ou planilha.
  gitleaks:
    name: Segredo nos commits do PR (gitleaks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pedro-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o gitleaks lê cada commit entre a base e o head.
          fetch-depth: 0
      - name: Gitleaks nos commits do PR
        # Só os commits do PR (`base..head`): o histórico antigo não reprova PR
        # novo. O binário é conferido pelo sha256 do release antes de rodar.
        # A allowlist dos fixtures de teste fica no .gitleaks.toml.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERSAO: 8.30.1
          # O pacote do Mac (darwin_arm64), conferido no checksums.txt do release.
          SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          pacote="gitleaks_${VERSAO}_darwin_arm64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$pacote" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${pacote}"
          echo "$SHA256  $RUNNER_TEMP/$pacote" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$pacote" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --config .gitleaks.toml --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .

  arquivo-sensivel:
    name: Arquivo sensível no PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pedro-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: a trava compara o head com o ponto em que ele
          # saiu da base.
          fetch-depth: 0
      - name: Nenhum arquivo de dado fora das pastas liberadas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project --python 3.12 python tools/checar_arquivo_sensivel.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # PR de fork não roda no Mac, e os jobs exigidos pelo ruleset, pulados por
  # `if`, contariam como verdes sem teste nenhum. Este job deixa o PR vermelho.
  fork-sem-mac:
    name: PR de fork não roda no CI
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Recusar o PR de fork
        run: |
          echo "::error::O CI roda no Mac do Pedro e não aceita código de fork. Traga a mudança para uma branch deste repositório."
          exit 1
