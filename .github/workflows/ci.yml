name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.superpowers/**'
      - 'atas-migracao/**'
      - 'blueprint/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.superpowers/**'
      - 'atas-migracao/**'
      - 'blueprint/**'
      - '**/*.md'

jobs:
  backend:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-reunioes/backend
    env:
      # Pydantic Settings em app/config.py exige só esses 2 campos sem default.
      # Valores dummy fixos satisfazem a validação de presença para o pytest rodar.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest --maxfail=3 -q --no-header

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-reunioes/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          # Pin pnpm@9 para bater com o Dockerfile do frontend
          # (corepack prepare pnpm@9 --activate). pnpm@11 trata ERR_PNPM_IGNORED_BUILDS
          # como fatal mesmo com onlyBuiltDependencies declarado no package.json.
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: hospital-reunioes/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit

  build:
    name: Docker Build (sanity)
    runs-on: ubuntu-latest
    # Sanity check: garante que os 2 Dockerfiles ainda buildam.
    # NAO faz push — Coolify cuida do build de producao via webhook do GitHub App.
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: hospital-reunioes/backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            ENVIRONMENT=ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: hospital-reunioes/frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-ci
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_ENVIRONMENT=ci
