name: Manual

# O ci.yml ignora docs/** no trigger, então o Manual do usuário tem workflow
# próprio: o lint do texto, o build do Starlight e a prova de que o que está em
# draft não vai para o ar (ADR 0057, decisões 5 e 10).
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'tools/lint_manual.py'
      - 'tools/checar_build_manual.py'
      - 'tools/checar_video_manual.py'
      - 'tools/inventario_manual.py'
      - 'tools/tirar_draft_manual.py'
      - 'tools/test_lint_manual.py'
      - 'tools/test_checar_build_manual.py'
      - 'tools/test_checar_video_manual.py'
      - 'tools/test_publicar_manual.py'
      - 'tools/test_inventario_manual.py'
      - 'tools/test_skill_montar_manual.py'
      - 'tools/test_tirar_draft_manual.py'
      - 'tools/test_skill_cadeia_manual.py'
      - 'tools/test_setup_maquina_manual.py'
      - '.claude/skills/manual/**'
      - '.claude/skills/montar-manual/**'
      - '.claude/skills/to-prd/**'
      - '.claude/skills/to-issues/**'
      - '.claude/skills/onda/**'
      - '.claude/skills/deploy/**'
      - '.claude/skills/setup-maquina/**'
      - '.claude/skills/ask-pedro/**'
      - '.github/workflows/manual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'tools/lint_manual.py'
      - 'tools/checar_build_manual.py'
      - 'tools/checar_video_manual.py'
      - 'tools/inventario_manual.py'
      - 'tools/tirar_draft_manual.py'
      - 'tools/test_lint_manual.py'
      - 'tools/test_checar_build_manual.py'
      - 'tools/test_checar_video_manual.py'
      - 'tools/test_publicar_manual.py'
      - 'tools/test_inventario_manual.py'
      - 'tools/test_skill_montar_manual.py'
      - 'tools/test_tirar_draft_manual.py'
      - 'tools/test_skill_cadeia_manual.py'
      - 'tools/test_setup_maquina_manual.py'
      # `**` e não só o SKILL.md: as references citam os conferidores de
      # tools/ pelo nome, e renomear um sem disparar o workflow deixaria a
      # receita apontando para script que não existe mais.
      - '.claude/skills/manual/**'
      - '.claude/skills/montar-manual/**'
      # A cadeia que passou a conhecer o Manual (issue #735): o detector prova
      # que a seção do PRD, o modo da /manual e o script de tools/ que elas
      # mandam rodar existem. Sem o gatilho, a prova não roda justo no PR que
      # renomeia um deles.
      - '.claude/skills/to-prd/**'
      - '.claude/skills/to-issues/**'
      - '.claude/skills/onda/**'
      - '.claude/skills/deploy/**'
      - '.claude/skills/setup-maquina/**'
      - '.claude/skills/ask-pedro/**'
      - '.github/workflows/manual.yml'

jobs:
  manual:
    name: Lint, build e draft fora do ar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint travessão (docs/manual)
        # Mesma trava do ci.yml para os templates do backend (ADR 0013). Os
        # caracteres entram por \x{...} para não existir literal nenhum aqui.
        # `-I` pula arquivo binário: os prints .png do manual antigo casam a
        # sequência de bytes por acaso e travariam o CI por nada.
        run: |
          set +e
          grep -rIPln '[\x{2014}\x{2013}]' docs/manual/ --exclude-dir=node_modules --exclude-dir=dist
          STATUS=$?
          set -e
          # O grep sai 0 quando acha, 1 quando não acha e 2 quando falha (regex
          # inválida, PCRE sem UTF, caminho que sumiu). Sem separar o 2, o passo
          # ficaria verde sobre uma varredura que não rodou.
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Travessão (U+2014) ou meia-risca (U+2013) nos arquivos acima. Use vírgula, dois-pontos ou hífen (ADR 0013)."
            exit 1
          fi
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::A varredura de travessão falhou (grep saiu $STATUS). Conserte a varredura antes de seguir."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ffmpeg (a publicação reencoda os vídeos para 720p)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Testes do lint, do conferidor e da publicação
        run: |
          pip install pytest
          python -m pytest tools/test_lint_manual.py tools/test_checar_build_manual.py tools/test_checar_video_manual.py tools/test_publicar_manual.py tools/test_inventario_manual.py tools/test_skill_montar_manual.py tools/test_tirar_draft_manual.py tools/test_skill_cadeia_manual.py tools/test_setup_maquina_manual.py -q

      - name: Lint do manual
        run: python3 tools/lint_manual.py --dir docs/manual/src/content/docs

      - name: Inventário com cada lacuna num balde
        # Não trava por lacuna (o passivo do manual é justamente o que a
        # /montar-manual divide em terminais): trava quando a conta não fecha,
        # com página fora dos cinco módulos ou varredura que não achou página
        # nenhuma.
        run: python3 tools/inventario_manual.py --dir docs/manual

      - name: Vídeo de tarefa com fonte versionada e MP4 fora do git
        # O MP4 não vem no clone (é regerável): o que o CI pode provar é que
        # toda página que exibe vídeo tem a composição e o carimbo para regerar.
        run: python3 tools/checar_video_manual.py --dir docs/manual

      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          # Starlight 0.42 exige Node >= 22.12.
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: docs/manual/pnpm-lock.yaml

      - name: Instalar dependências do site
        working-directory: docs/manual
        run: pnpm install --frozen-lockfile

      - name: Build do site
        working-directory: docs/manual
        run: pnpm build

      - name: Draft fora do dist e da busca
        run: python3 tools/checar_build_manual.py --dir docs/manual
