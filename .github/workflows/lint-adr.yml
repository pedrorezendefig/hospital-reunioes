name: Lint ADR

# O ci.yml ignora docs/** no trigger, então o lint das ADRs vive em workflow próprio,
# disparado só quando uma ADR muda. Garante status verdadeiro e supersessão bidirecional.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - 'tools/lint_adr.py'
      - '.github/workflows/lint-adr.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - 'tools/lint_adr.py'
      - '.github/workflows/lint-adr.yml'

jobs:
  lint-adr:
    name: Frontmatter e supersessão das ADRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Lint ADR
        run: python3 tools/lint_adr.py
