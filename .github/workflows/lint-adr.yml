name: Lint ADR

# O ci.yml ignora docs/** no trigger, então o lint das ADRs vive em workflow próprio,
# disparado só quando uma ADR muda. Garante status verdadeiro e supersessão bidirecional.
permissions:
  contents: read

# Commit novo na mesma branch cancela a rodada anterior do PR (issue #1599). O
# push na main tem um grupo por commit e nunca cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - 'tools/lint_adr.py'
      - '.github/workflows/lint-adr.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - 'tools/lint_adr.py'
      - '.github/workflows/lint-adr.yml'

jobs:
  lint-adr:
    name: Frontmatter e supersessão das ADRs
    # No Mac do Pedro (issue #1599); PR de fork não roda nele.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, pedro-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint ADR
        run: uv run --no-project --python 3.12 python tools/lint_adr.py
