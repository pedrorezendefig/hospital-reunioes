<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Reuniões · painel do fluxo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4EFE4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23DE5630'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="masthead wrap">
  <div class="mast-top">
    <span class="eyebrow">do brainstorm ao deploy</span>
    <div class="mast-status" id="mast-status"></div>
  </div>
  <h1 class="mast-title">Hospital <span class="accent">Reuniões</span></h1>
</header>

<nav class="tabs" aria-label="Seções">
  <div class="wrap tabs-row" id="tabs">
    <button data-tab="plano">Plano</button>
    <button data-tab="issues">Issues</button>
    <button data-tab="producao">Produção</button>
    <button data-tab="mapa">Mapa</button>
    <button data-tab="dominio">Domínio</button>
    <button data-tab="guia">Guia</button>
  </div>
</nav>

<div class="wrap" id="banner"></div>

<main class="wrap" id="view">
  <div class="loading rv"><span class="dot ok pulse"></span> coletando o fluxo — gh · docs/spec · git…</div>
</main>

<footer class="wrap foot" id="foot"></footer>

<script src="/vendor/marked.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
