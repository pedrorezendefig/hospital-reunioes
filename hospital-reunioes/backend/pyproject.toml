[project]
name = "hospital-reunioes-backend"
version = "0.1.0"
description = "Sistema de Gestão de Reuniões Hospitalares - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.10.0",
    "openai>=1.50.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "markdown>=3.7",
    "weasyprint>=62.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "slowapi>=0.1.9",
    "resend>=2.0.0",
    "pdfplumber>=0.11.0",
    "docx2txt>=0.8",
    "markitdown[pdf,docx]>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
